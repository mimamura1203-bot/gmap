育成するよりも外部から人材を採用する方が、通常は短時間で調達できる。しかし、特殊な要件を満たす人材を求めている場合は、外部調達でもある程度の期間が必要である　\n\n■出典：グロービス マネジメントブック 改訂3版　\n\n15．人員配置 P.210-211","source":"Excel: GMAP道場問題秋春(2).xlsx","no":79,"idx":79},{"id":"xlsx-2025秋-人的資源管理-20","season":"2025秋","subject":"人的資源管理","scope":"16.報奨","question":"出題範囲：16.報奨\n\n■問20.報奨項目の種類についての記載で、下記から誤っているものをすべて選択してください。\n\nA.基本給は金銭的報奨の根幹であるため、基本給の報奨基準や報奨水準を決定する際には、最も慎重を要する。手当は基本給を補完する役割を持ち、基本給の設計によって多様な形態をとる。現金給与は基本給と手当をどのような比率で組み合わせるかがポイントとなる。\n\nB.インセンティブ・システムは、個人の成果や部門・企業の業績が目標に対する達成度などの基準を満たした場合、それに応じて個人に支払われるものだ。例えば、自社株式を購入する権利を与えるプロフィット・シェアリングなどがある。\n\nC.フリンジ・ベネフィットとは、「その企業に所属していることによって得られる特典」が該当する。具体的には、優遇ローン、健康保険、社宅、独身寮、各種施設の法人割引などが挙げられる。退職金、年金積立、財形貯蓄といった特典は該当しない。\n\nD.従来は、さまざまな福利厚生を全従業員に一律に付与する企業が多く見られた。しかし、従業員の価値観やライフスタイルが多様化するにつれて、一律付与は経済合理的ではなくなり、従業員の個人的なニーズも満たしきれなくなった。","answer":"■正解：B、C\n\n■解説：\n\nA：合っています。\n\nB：インセンティブ・システムは、例えば、一定の基準に従って利益を配分するプロフィット・シェアリングや、自社株式を購入する権利を与えるストック・オプションなどがある。\n\nC：フリンジ・ベネフィットとは、「その企業に所属していることによって得られる特典」のすべてが該当する。具体的には、退職金、年金積立、財形貯蓄、優遇ローン、健康保険、社宅、独身寮、各種施設の法人割引などが挙げられる。\n\nD：合っています。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n報奨 P.212-213","source":"Excel: GMAP道場問題秋春(2).xlsx","no":80,"idx":80},{"id":"xlsx-2025秋-人的資源管理-21","season":"2025秋","subject":"人的資源管理","scope":"17.評価","question":"2025年10月1日（水）＜人的資源管理＞\n\n出題範囲：17.評価\n　\n■問.21 文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n　\n・企業がよく活用している代表的な評価手法に、（①）がある。（①）では従業員はマネジャーとともに組織目標のすり合わせを行いながら、納得と合意の下で（②）に自分の当期目標を決定する。　\n\n・特定の項目についての評価が総合的な評価に影響を与える傾向を（③）と言う。\n\n・潜在的に最高の評価や最低の評価をつけることを避ける傾向を（④）と言う。\n　\nA：①OKR　②客体的　③ハロー効果　④中心化傾向\n\nB：①OKR　②主体的　③中心化傾向　④ハロー効果\n\nC：①MBO　②主体的　③ハロー効果　④中心化傾向\n\nD：①MBO　②客体的　③中心化傾向　④ハロー効果","answer":"■正解：C\n\n　\n　\n\n■解説：\n\n・企業がよく活用している代表的な評価手法に、MBO（目標管理）がある。MBOは次の手順で行う。従業員はマネジャーとともに組織目標のすり合わせを行いながら、納得と合意の下で主体的に自分の当期目標を決定する。そして従業員は自己管理しながら目標達成を目指し、マネジャーはそのための支援と協力を行う。評価期間の終わりに、従業員は当初の目標と実際の成果について自己評価を行い、マネジャーはその妥当性をチェックし、フィードバックする。そして、互いに納得できる結論をもって最終評価とする。\n　\n・ハロー（後光）効果：特定の項目についての評価が総合的な評価に影響を与える傾向を言う。たとえば、際立って高い評価を受けた項目があった場合、その評価に引っ張られて、他の項目についても優れていると判断してしまうことがある。\n　\n・中心化傾向：潜在的に最高の評価や最低の評価をつけることを避ける傾向を言う。たとえば、従業員の評価を5段階で行うと、自然と３や４に評価が集中するものだ。この傾向は、評価基準が明確になっていない場合にとくに生じやすい。\n\n　\n　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n      17.評価 P.214 - P.215","source":"Excel: GMAP道場問題秋春(2).xlsx","no":81,"idx":81},{"id":"xlsx-2025秋-人的資源管理-22","season":"2025秋","subject":"人的資源管理","scope":"18. 能力開発","question":"2025年10月1日（水）＜人的資源管理＞\n\n出題範囲：18. 能力開発\n\n■問22.組織と人事システムにおける「能力開発」について、誤っているものを選択してください。　\n\nA.能力開発は「投資」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「戦略的コスト」としてとらえることが重要だ。　\n\nB.これまで多くの日本企業ではOJTが能力開発の中心だったが、客観的法則が必ずしも通用しなくなってきている状況では、Off-JTを有効に活用していく必要がある。　\n\nC.キャリアとは、人員配置によって形成される業務経験の繋がりである。　\n\nD.従業員は自分のキャリアについて、自ら考えていくことも必要だ。自分に「エンプロイアビリティー」（雇用されうるだけの能力）があるかを常に問い続け、戦略的にキャリア・デザインを考えなくてはならない。","answer":"■正解：AとB\n\n■解説：\n\nA：能力開発は「コスト」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「戦略的投資」としてとらえることが重要だ。　\n\n→能力開発は「戦略的投資」としてとらえる。　\n\nB：これまで多くの日本企業ではOJTが能力開発の中心だったが、経験則が必ずしも通用しなくなってきている状況では、Off-JTを有効に活用していく必要がある。　\n\n→OJTが能力開発の中心だったが、経験則が必ずしも通用しなくなってきている状況。　\n\n■出典：グロービス マネジメントブック 改訂3版\n\n18．能力開発 P.216-217","source":"Excel: GMAP道場問題秋春(2).xlsx","no":82,"idx":82},{"id":"xlsx-2025秋-人的資源管理-23","season":"2025秋","subject":"人的資源管理","scope":"21.ワーク・ライフ・バランス","question":"出題範囲：21.ワーク・ライフ・バランス\n\n■問23.ワーク・ライフ・バランスを通じて従業員に豊かな生活基盤を提供することが必要です。以下の選択肢の中で、誤っているものを一つ選んでください。\n\nA. 人間は、組織の構成員である以前にひとつの人格である。家族、地域社会、学校の同窓会などの一員でもあり、これらの組織や社会において一定の役割を担うことを期待されているし、また貢献したいと望んでいる。\n\nB. 人間の社会的生活における多面性を理解しないままマネジメントすることは、個人の人間性を否定するものである。\n\nC. マネジメントとしては、従業員が組織における役割とそれ以外の社会における役割をメリハリをもって担えるようサポートすることが求められる。\n\nD. ワーク・ライフ・バランスを実現させることは、短期的に人材獲得の競争力や企業業績にもつながっていく。","answer":"■正解：Dが誤り\n\n■解説：\n\n​​ワーク・ライフ・バランスを実現させるために多くの組織ではフレックスタイムでの勤務、在宅での勤務、弾力的な休職制度、いったん家庭の事情で退職した社員の再雇用、パートタイム労働の多様化など、多様かつ柔軟な働き方ができるような制度を設け始めている。このような制度を設けることは、直接的・短期的には経済合理的ではないこともあるかもしれない。\n\nワーク・ライフ・バランスを実現させることは、長い目でみればCSRを果たすことにもつながり、人材獲得の競争力や企業業績にもつながっていく。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n21.ワーク・ライフ・バランス P.222-223","source":"Excel: GMAP道場問題秋春(2).xlsx","no":83,"idx":83},{"id":"xlsx-2025秋-人的資源管理-24","season":"2025秋","subject":"人的資源管理","scope":"22. メンタルヘルス","question":"出題範囲：22. メンタルヘルス\n\n■問24. 次の文章中の(①)～(⑥)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n\n現代は、予想もしない急激な変化が常態化している(①)の時代であり、社員の疲労、うつ状態などが増加し、多大な(②)を引き起こしかねない。そのため、従業員のメンタルな健康に配慮をすることで、組織の(③)を高く維持することが求められている。\n\n80年代以降、だれもがストレス性疾患のリスクにさらされるようになり、社内に(④)を常駐させる企業が増えた。その後も医学的対応を進めてきたが、組織として有効的かつ包括的な取り組みがなされていないのが現状である。そこで、従来の医学的アプローチを見直したものが、(⑤)アプローチである。このアプローチで重要なのは、(⑥)、人的資源管理の両面から適切な対策を打つということである。\n\nA: ①ハイパー・ボール ②人件費増大　 ③生産性　④保健師 ⑤予防 ⑥心理学\n\nB: ①ハイパー・ボール   ②経済的損失　③評判　 ④保健師 ⑤予防 ⑥組織行動学\n\nC: ①ハイパー・チェンジ ②人件費増大 ③評判　④保健師 ⑤適応 ⑥心理学\n\nD: ①ハイパー・チェンジ ②経済的損失 ③生産性 ④産業医 ⑤適応 ⑥組織行動学","answer":"■正解：D\n\n■解説：\n\n現代は、予測もしない急激な変化が常態化している(ハイパー・チェンジ)の時代であり、社員の疲労、うつ状態などが増加し、多大な(経済的損失)を引き起こしかねない。そのため、従業員のメンタルな健康に配慮をすることで、組織の(生産性)を高く維持することが求められている。\n\n80年代以降、だれもがストレス性疾患のリスクにさらされるようになり、社内に(産業医)を常駐させる企業が増えた。しかし、多くの企業では、メンタルへルスの問題を専門の医師に丸投げしたり、現場の管理職の自助努力に委ねてしまうなど、組織として有効的かつ包括的な取り組みがなされていないのが現状である。そこで、従来の医学的アプローチを見直したものが、(適応)アプローチである。このアプローチで重要なのは、(組織行動学)、人的資源管理の両面から適切な対策を打つということである。\n\n■出典：グロービス マネジメントブック 改訂3版\n\nメンタルヘルス p.224-225","source":"Excel: GMAP道場問題秋春(2).xlsx","no":84,"idx":84},{"id":"xlsx-2025秋-人的資源管理-25","season":"2025秋","subject":"人的資源管理","scope":"1. 企業経営と人・組織のマネジメント","question":"2025年10月8日（水）＜人的資源管理＞\n\n出題範囲：1. 企業経営と人・組織のマネジメント\n\n■問25.組織行動学と人的資源管理について、誤っているものを全て選択してください。\n\nA. 人・組織のマネジメントは、戦略目標の達成という企業の目的と、生活維持や自己実現などの個人の目的とをうまく適合させ、競争優位の源泉を築くことを目指している。\n\nB. 人・組織のマネジメントを習得するには、まずその対象となる「人」の特徴や行動について理解する必要がある。\n\nC. 従業員に期待どおりに動いてもらうためには、ヒトの感情のメカニズム（法則性）を理解しておくことが重要だ。\n\nD. 人の行動メカニズムを理解することにより、企業は起こり得る事態を予測し、目標を達成するために必要な施策を準備することが可能になる。","answer":"■正解：\n\nC\n\n■解説：\n\nA. 人・組織のマネジメントは、戦略目標の達成という企業の目的と、生活維持や自己実現などの個人の目的とをうまく適合させ、競争優位の源泉を築くことを目指している。\n\nB. 人・組織のマネジメントを習得するには、まずその対象となる「人」の特徴や行動について理解する必要がある。\n\nC. 従業員に期待どおりに動いてもらうためには、ヒトの行動のメカニズム（法則性）を理解しておくことが重要だ。\n\nD. 人の行動メカニズムを理解することにより、企業は起こり得る事態を予測し、目標を達成するために必要な背策を準備することが可能になる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n企業経営と人・組織のマネジメント P.182 - P183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":85,"idx":85},{"id":"xlsx-2025秋-人的資源管理-26","season":"2025秋","subject":"人的資源管理","scope":"2. 人・組織のマネジメントに影響を及ぼす要因","question":"出題範囲：2. 人・組織のマネジメントに影響を及ぼす要因\n\n■問26. 次の文章中の(①)～(④)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n\n自分の価値観や目的が所属している組織の価値観や（①）、目的に合致したり、共感ができる部分が大きい場合などに、人は働きがいを感じる。　\n企業は組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求めていることを、（②）を通して伝えなくてはならない。　\n企業は必要に応じて、在宅勤務やワークシェアリングなどを柔軟に取り入れ、（③）を活用する方法を考える必要がある。\n企業が従業員の賃金レベルや就業条件など、人・組織のマネジメントの具体的施策を決定するには、（④）の同意を得る必要がある。　\nA: ①経営理念　②包括的な施策　　③顕在的労働力　④経営幹部\n\nB: ①ビジョン　②包括的な施策　　③潜在的労働力　④従業員\n\nC: ①経営理念　②具体的な施策　　③顕在的労働力　④経営幹部\n\nD: ①ビジョン　②具体的な施策　　③潜在的労働力　④従業員","answer":"■正解：\n\nD\n\n①：ビジョン、②：具体的な施策、③：潜在的労働力、④：従業員\n\n■解説：\n\n人は自分の価値観や目的が所属している組織の価値観やビジョン、目的に合致したり、共感ができる部分が大きい場合などに、働きがいを感じる。　\n企業は組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求めていることを、具体的な施策を通して伝えなくてはならない。　\n企業は必要に応じて、在宅勤務やワークシェアリングなどを柔軟に取り入れ、潜在的労働力を活用する方法を考える必要がある。\n企業が従業員の賃金レベルや就業条件など、人・組織のマネジメントの具体的施策を決定するには、従業員の同意を得る必要がある。　\n■出典：グロービス マネジメントブック 改訂3版\n\n人・組織のマネジメントに影響を及ぼす要因P.184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":86,"idx":86},{"id":"xlsx-2025秋-人的資源管理-27","season":"2025秋","subject":"人的資源管理","scope":"3.組織行動学と人的資源管理","question":"2025年10月8日（水）＜人的資源管理＞\n\n出題範囲：3.組織行動学と人的資源管理\n　\n■問27.下記文章中の「」に入る語句として適切なものを選択肢A~Dのうちから選んでください。\n　\n・人の行動は「個人」か、「集団」（目的を持った個人の集合）か、「」（目的を持った集団の集合）かによって異なってくる。\n　\nA. 人事\n\nB. 組織\n\nC. 企業\n\nD. マネジメント","answer":"■正解：B\n　\n■解説：\n\n人の行動は「個人」か、「集団」（目的を持った個人の集合）か、「組織」（目的を持った集団の集合）かによって異なってくる。意思決定をする場合、要する時間やコンフリクトの多寡などに違いが生じる。そのため、それぞれの特徴を理解しておくことが、マネジメントを行ううえでは重要になる。\n\n　\n　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n3.組織行動学と人的資源管理 P.186-187","source":"Excel: GMAP道場問題秋春(2).xlsx","no":87,"idx":87},{"id":"xlsx-2025秋-人的資源管理-28","season":"2025秋","subject":"人的資源管理","scope":"12.組織文化と企業経営","question":"出題範囲：12.組織文化と企業経営\n\n■問28.組織文化の「機能」に関する記述として、誤っているものを一つ選択してください。\n\nA.とるべき判断や行動の指針を与え、意思決定のスピードを速める機能がある。\n\nB.判断の指針を示すことで、公的な情報伝達で伝えなければならない情報の量を増やす効果がある。\n\nC.強すぎる価値観が共有されると、構成員のものの見方が固定化し、環境変化を見過ごす原因にもなりうる。\n\nD.昇進や昇給などの評価基準を明確にし、個人の動機づけ（モチベーション）を高める機能がある。","answer":"■正解：B\n\n■解説：\n\n組織文化は「伝えなければならない情報の量を軽減する」。「増やす」という部分が誤りです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n12.組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":88,"idx":88},{"id":"xlsx-2025秋-人的資源管理-29","season":"2025秋","subject":"人的資源管理","scope":"13.組織設計","question":"出題範囲：13.組織設計\n\n■問29.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・組織設計にあたって考慮すべき要素には、分業と協業、指揮命令系統、管理範囲、意思決定権限、分化と統合が挙げられる。\n\n・（①）とは、同じ部門や部署において機能が異なるユニットを分離し、別々に管理することを指す。（②）は（同じ組織内で）複数に分離されているユニットをまとめあげ、統一して管理することを言う。 ・（③）とは、組織全体の業務を、専門性などの基準に基づき、組織構成員に割り振ることだ。（④）とは、組織全体として協力して業務を行うことを言う。\n\nA. ①分業　②協業　③分化　④統合\nB. ①協業　②分業　③分化　④統合\nC. ①分化　②統合　③分業　④協業\nD. ①分化　②統合　③協業　④分業","answer":"■正解：C\n\n■解説：\n\n・組織設計とは、企業戦略を遂行するために個々の業務をどのように組み合わせ、どのように行うかを決定することであり、業務プロセスや意思決定プロセスなどの動的な側面も考慮しなくてはならない。\n\n・分化と統合はいずれも、企業全体の付加価値や効率を高めていこうという考え方に基づく。\n\n・企業は通常、業務を製造、営業、経理などの機能別に分解し、構成員に割り当てる分業体制をとっている。そのため、協業の必要が生じると、複数の業務間で業務の受け渡しなどについて調整しなくてはならない。ある程度までの分業は効率化に役立つが、過度の業務細分化は従業員のモチベーションや業務効率を低下させる原因になりうる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n13.組織設計 P.206 - P207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":89,"idx":89},{"id":"xlsx-2025秋-人的資源管理-30","season":"2025秋","subject":"人的資源管理","scope":"14.組織形態","question":"出題範囲：14.組織形態 \n\n■問30.組織形態について正しいものを選択してください。　\n\nA.組織形態とは、組織構造の決定要因に基づき、組織構造の形である「組織図」を描いたものである。したがって、外部環境、事業特性、戦略、HRポリシーは考慮しなくてもよい。　\n\nB.代表的な組織形態にヒエラルキー型組織とマトリクス型組織がある。ヒエラルキー型組織は、機能別組織と事業部制組織を組み合わせたもので、マトリクス型組織は機能別組織と事業部制組織に分けられる。　\n\nC.機能別組織は、責任の所在が明確で、事業部長レベルでかなりの経営判断ができるため、問題解決のための迅速なアクションが可能である。事業部制組織は、その機能を深く理解し、専門的な知識を持った人材を育成することができる。　\n\nD.マトリクス型組織がうまく機能した場合は、情報伝達が円滑になり、1人の人間が2つの役割を同時に効果的に果たすことが期待できる。その一方で、構成員は通常2人のボスを持つことになるので、権限や責任が曖昧かつ流動的になり、指揮命令系統が混乱したり、業務に支障が生じるおそれがある。","answer":"■正解：D　\n■解説：　\nA  \n・組織形態は組織構造の決定要因に加え、外部環境、事業特性、戦略、HRポリシーなどを考慮して設計する。　\n\nB  \n・ヒエラルキー型組織は機能別組織と事業部制組織に分けられる。　\n・機能別組織と事業部制組織を組み合わせたのが、マトリクス型組織だ。　\n\nC  \n・機能別組織は、その機能を深く理解し、専門的な知識を持った人材を育成することができる。　\n・事業部制組織では、事業経営に関して権限委譲が行われ、各事業部は利益責任を負う。責任の所在が明確で、事業部長レベルでかなりの経営判断ができるため、問題解決のための迅速なアクションが可能だ。　\n\nD  \n・選択肢DはP.209 18-21行目の原文そのまま。　\n■出典：グロービス マネジメントブック 改訂3版 　\n14.組織形態　P.208-209","source":"Excel: GMAP道場問題秋春(2).xlsx","no":90,"idx":90},{"id":"xlsx-2025秋-組織行動-1","season":"2025秋","subject":"組織行動","scope":"4. リーダーシップとマネジメント","question":"出題範囲：4. リーダーシップとマネジメント\n■問1.\nリーダーシップとマネジメントの能力を習得するために、「基礎的なビジネス能力」が必要とされる。具体的には「1人のビジネスパーソンとしての高い基準、自律の精神、1人称で語れるオーナーシップ・マインド（当事者意識）、前向きな姿勢、相手を理解しようとする懐の深さ」といった要素が求められる。\nこれらの要素およびリーダーシップとマネジメントに関する記述として、適切でない選択肢はどれか。\n■選択肢\n１.これらの要素はリーダーシップやマネジメント能力の土台となるものである。\n２.リーダーシップとマネジメントはまったく異なる側面を持つため、同時に習得することができない。\n３.リーダーシップとマネジメントの能力を習得するために、企業は様々な実践の場を提供することが期待される。\n４.リーダーシップとマネジメントの能力を自分のものにするためには、これらの要素を身につけた後、場数と経験を積むことも重要である。","answer":"■正解：２\n\n■解説：リーダーシップとマネジメントは同時に身に着けることは難しく感じられるが、これらの能力はいずれも習得可能である。\n\n出典：グロービス マネジメントブック 改訂3版>\n4．リーダーシップとマネジメント P.188-189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":91,"idx":91},{"id":"xlsx-2025秋-組織行動-2","season":"2025秋","subject":"組織行動","scope":"5.エンパワーメント","question":"出題範囲：5.エンパワーメント\n\n■問2.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・ビジネスにおけるエンパワーメントの特徴は（①）を促し（②）することにある。\n・（①）を促すとは、業務の遂行にあたって、経営者やマネジャーが業務目標を明確に示す一方、その遂行方法については従業員の主体的な（③）に任せることを言う。\n・業務の遂行を（②）するやり方も、具体的な指示や解決策を従業員に与えるのではなく、従業員自身が問題点を発見したり、不足する能力を開発できるように環境を整えるといった形をとる。\n\nA. ①専門性　②指導　③行動\nB. ①可能性　②支援　③活動\nC. ①自律性　②支援　③判断\nD. ①協力性　②学習　③判断","answer":"■正解：C\n\n■解説：\n\nエンパワーメントは組織構成員の自律的な行動を促すために用いられるリーダーシップの技法の一つである。エンパワーメントを有効に活用するには、構成員の自律性を促すと同時に、その行動を制御することも必要だ。\n\nビジネスにおけるエンパワーメントの特徴は「自律性」を促し、「支援」することにある。「自律性」を促すとは、業務の遂行にあたって、経営者やマネジャーが業務目標を明確に示す一方、その遂行方法については従業員の主体的な判断に任せることを言う。\n\n業務の遂行を「支援」するやり方も、具体的な指示や解決策を従業員に与えるのではなく、従業員自身が問題点を発見したり、不足する能力を開発できるように環境を整えるといった形をとる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n5．エンパワーメント P.190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":92,"idx":92},{"id":"xlsx-2025秋-組織行動-3","season":"2025秋","subject":"組織行動","scope":"6. パワー","question":"出題範囲：6. パワー\n\n■問3.多様なステークホルダーに影響を与える「パワー」、すなわち「人や組織の行動に影響を与える力」に関する記述として、誤っているものはどれか。\n\nA.パワーの5つの構成は強制力、報酬力、正当権力、専門力、俯瞰力である\n\nB.パワーは必ずしも1人ですべてを兼ね備える必要はなく、様々なパワーの源泉を持つ人が複数集まり、相互補完してもよい\n\nC.与え手のパワーが変わらなければ、受け手への影響力の度合いは変わらない\n\nD.社会的・倫理的に問題のある方法でパワーを用いないために、企業が求める行動規範や価値観を明確にし、社内に浸透させる必要がある","answer":"■正解：AとC\n\n■解説：\n\nA.パワーの5つの構成は強制力、報酬力、正当権力、専門力、同一視力である\n\nC.パワーの受け手と与え手の関係によって、影響力の度合いは変化する。そのため、与え手のパワーが変わらなくても、受け手の変化によって影響力が変わることもある\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n6.パワー P.192-193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":93,"idx":93},{"id":"xlsx-2025秋-組織行動-4","season":"2025秋","subject":"組織行動","scope":"","question":"■問4　モチベーション理論の代表的な以下3つの理論の提唱者を、下記から選択せよ。\n\n１．欲求5段階説\n\n２．X理論・Y理論\n\n３．動機づけ・衛生理論\n\n選択肢：マグレガー、ハーズバーグ、デシ、マズロー","answer":"■正解：１．マズロー　２．マグレガー　３．ハーズバーグ\n\n■解説：\n\nA.H.マズローは、人間の欲求を「生理的」「安全」「社会的」「尊厳」「自己実現」という、低次から高次への5段階に分けて考えた。\n\nD.マグレガーは、人間をX理論とY理論で説明した。X理論は「人間は本来怠け者で、責任を回避しようとするものだ」と考えるのに対し、Y理論では「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。\n\nF.ハーズバーグは、仕事に対する満足をもたらす要因と不満をもたらす要因が異なることを示し、前者を「動機づけ要因」、後者を「衛生要因」と呼んだ。\n\nデシは「内発的動機」「外発的動機」を提唱した。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n7．モチベーションとインセンティブ P.194-195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":94,"idx":94},{"id":"xlsx-2025秋-組織行動-5","season":"2025秋","subject":"組織行動","scope":"8. 集団のメカニズム","question":"出題範囲：8. 集団のメカニズム\n　\n■問5.集団を捉える視点のなかで、誤っているものを選択してください。\n　\nA.「役割」とは、集団内における相対的な位置づけを指す。人はさまざまな集団に属するが、集団によって期待される役割が対立したり矛盾することがある。\n　\nB.集団が構成員を引きつけ、その集団の一員であり続けるように動機づける度合いを「凝集性」という。集団の凝集性が高い場合に、グループシンクが起きやすい。\n　\nC.「多様性」とは、集団の構成員の組み合わせの多様さを指す。多様な集団は短期的にコンフリクトを生むことが多いが、そうした困難をいったん克服できれば、構成員がさまざまな情報や能力を持っていることの利点が発揮され、より高い成果を生み出す可能性が高い。\n　\nD.集団の構成員間で共有する行動基準を「規範」という。たとえば、構成員間で「役職が上位の人に対して批判的意見を言うべきではない」という意識が浸透している場合、それがその集団の規範と言える。","answer":"■正解：Aのみ\n　\n■解説：\n「役割」とは、集団において期待される行動様式を指します。\n集団内における相対的な位置づけは、「役割」ではなく「地位」のことを指しています。\n　\n■出典：グロービス マネジメントブック 改訂3版\n8．集団のメカニズム P.196-197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":95,"idx":95},{"id":"xlsx-2025秋-組織行動-6","season":"2025秋","subject":"組織行動","scope":"9. チームマネジメント","question":"出題範囲：9. チームマネジメント\n\n■問6.集団の発展は5つの段階に分けることが出来ます。5つの内4つの段階を抽出し、その特徴について下記に説明しております。説明が誤っているものを選択してください。\n\nA.激動期：議論、緊張、衝突の生まれる段階。構成員間で互いに自分の考えを披瀝しあい、コミュニケーションを図る。集団内における自分の役割や地位についてのイメージはこの段階ではまだ形作ってはいけない。\n\nB.形成期：集団結成が明示され、構成員が顔合わせする段階。人は集まったものの、集団としての機能は形成されていない状態にある。集団の目的や規範も共有されていない。\n\nC.実現期：特定の目的を持った集団として構成員が統合され、集団が機能する段階。あらゆる集団が自動的に実現期に至る。\n\nD.規範形成期：構成員が規範をつくり出す段階。「激動期」の結果を踏まえて、集団の目標や各自の役割を明確にし、それらを全構成員が理解し共有する。","answer":"■正解：AとC\n\n■解説：\n\n「A.激動期」は、議論、緊張、衝突の生まれる段階。構成員間で互いに自分の考えを披瀝しあい、コミュニケーションを図ることにより、集団内における自分の役割や地位についてイメージを形作っていく段階。\n\n「C.実現期」は、あらゆる集団が自動的に至るわけではない。マネジメントの巧拙によっては、実現期に至らないまま解散することもある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n9.チームマネジメント P.198-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":96,"idx":96},{"id":"xlsx-2025秋-組織行動-7","season":"2025秋","subject":"組織行動","scope":"10. コミュニケーション","question":"出題範囲：10. コミュニケーション\n\n■問7.コミュニケーションは、次の4つのプロセスを経る。プロセスの順番に並べなさい。\n\nA. 伝達 \n\nB. フィードバック\n\nC. 記号化\n\nD. 解読","answer":"■正解：C→A→D→B\n\n■解説：\n\nコミュニケーションは、記号化、伝達、解読、フィードバックという4つのプロセスを経る。\n\n記号化：メッセージを記号に変換すること。大きく言語、非言語の2種類がある。\n伝達：さまざまなチャネル（伝達経路）を通してメッセージを受け手に伝えること。\n解読：受け手が記号化されたメッセージの意味を読み取ること。\nフィードバック：受け手が解読したメッセージを送り手とともに確認すること。\n■出典：グロービス マネジメントブック 改訂3版 　\n10．コミュニケーション P.200-201","source":"Excel: GMAP道場問題秋春(2).xlsx","no":97,"idx":97},{"id":"xlsx-2025秋-組織行動-8","season":"2025秋","subject":"組織行動","scope":"11. コンフリクト","question":"出題範囲：11. コンフリクト　\n\n■問８.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\nコンフリクト(対立、軋轢)とは相反する意見、態度、要求などが存在し、互いに譲らないことで緊張状態が生じることを言う。コンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、（①）のやり方次第で、アイデアの創造や本質的な問題の発見などにつながり、組織の（②）を高めるドライバーとなりうる。\n\nわれわれは通常、（③）したコンフリクトのみを対処すべき事態だととらえがちだが、（④）なコンフリクトが存在する可能性についても考慮する必要がある。\n　\nA.①リーダーシップ、②成果、③潜在化、④顕在的\nB.①リーダーシップ、②仲間意識、③顕在化、④潜在的\nC.①マネジメント、②成果、③顕在化、④潜在的\nD.①マネジメント、②イメージ、③潜在化、④顕在的","answer":"■正解：C\n\n■解説：\n\nコンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、「マネジメント」のやり方次第で、アイデアの想像や本質的な問題の発見などにつながり、組織の「成果」を高めるドライバーになりうる。\n\nわれわれは通常、「顕在化」したコンフリクトのみ対処すべき事態だととらえがちだが、「潜在的」なコンフリクトが存在する可能性についても考慮する必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\nコンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":98,"idx":98},{"id":"xlsx-2025秋-組織行動-9","season":"2025秋","subject":"組織行動","scope":"19. 変革のマネジメント","question":"出題範囲：19. 変革のマネジメント\n\n■問 9.社会心理学者のクルト・レビンの変革のプロセスについて、下記の記述から適切なものを全て選択してください。\n\nA.　解凍：メンバーに変化の必要性を理解させ、現状を打破して、変化へ向けて準備させる段階\n\nB.　移動：変化のための具体的な方策を実施し、新たな行動や考え方を学習させていく段階\n\nC.　再凍結：新しく導入された変化を定着させる段階","answer":"■正解：全て（Ａ・Ｂ・Ｃ）\n\n■解説：\n　組織変革の際には、「このように行動してほしい」と経営陣がメッセージを発するだけでは不十分である。変革は一足飛びに実現できるものではない。社会心理学者のクルト・レビンは変革のプロセスを「解凍・移動・再凍結」という3段階にまとめている。企業は推進役となるリーダーの強い意志の下、このプロセスに沿って変革を進めていくことが重要である。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n変革のマネジメント P.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":99,"idx":99},{"id":"xlsx-2025秋-組織行動-10","season":"2025秋","subject":"組織行動","scope":"20.組織学習","question":"出題範囲：20.組織学習\n\n■問10.「学習する組織」の特徴に関して、下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n・「学習する組織」は、過去の組織文化や戦略の枠に（①）をしばられることなく、変化に対応し、（②）していく機能を備えている。\n\n・すべての構成員が（③）を持ち、現在の環境に適応する強さと将来の変化に対応する柔軟性を理解し実践する。つまり、組織全体が学習する能力を備えている。\n\n・ここで言う「学習」とは、単に知識を習得することにとどまらず、（①）のパターンを変えていくことを指す。\n\nA. ①ルールや規範　②自己改革　③創造性と合理性\n\nB. ①ビジョンや戦術　②事業拡大　③責任と権限\n\nC. ①思考や行動　②自己改革　③自律性と協調性\n\nD. ①ルールや規範　②行動変容　③責任と権限","answer":"■正解：C\n\n■解説：\n\n「学習する組織」は、過去の組織文化や戦略の枠に思考や行動をしばられることなく、変化に対応し、自己改革していく機能を備えています。すべての構成員が自律性と協調性を持ち、現在の環境に適応する強さと将来の変化に対応する柔軟性を理解し実践する。つまり、組織全体が学習する能力を備えています。ここで言う「学習」とは、単に知識を習得することにとどまらず、思考や行動のパターンを変えていくことを指します。\n\n【補足】\n\n「学習する組織」が注目されるようになった背景には、企業を取り巻くスピードが速くなり、常に変化への適応力・成長力が求められるようになったことが挙げられます。急速な環境変化が常態化している今日、主体的に変化を続ける変革力を持った個人やチーム、組織を目指す企業が増えています。「学習する組織」の概念は、新しい組織のあり方を探り、組織変革を実現していくための必要なカギを提示しています。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n組織学習 P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":100,"idx":100},{"id":"xlsx-2025秋-組織行動-11","season":"2025秋","subject":"組織行動","scope":"8. 集団のメカニズム","question":"出題範囲：8. 集団のメカニズム\n\n■問11.集団のメカニズムを理解するために考慮すべき概念として、「凝集性」と「多様性」の概念について、最も適したものはどれか。\n\n１.凝集性が高ければ集団内の同質性が促進されるため、多様性とは常に排他的な関係にある。\n\n２.多様性の高い集団は短期的にはコンフリクトが生じやすいが、その困難を乗り越えられれば結果的に高い成果を生み出す可能性を高める。\n\n３.凝集性の高さは、構成員間の相互作用によって決まるが、多様性の高さは相互作用を阻害するため、両者は相関しない。\n\n４.多様性が高い集団であっても、凝集性が低ければ必ず高い成果を生み出す。","answer":"■正解：2\n\n■解説：\n\n凝集性と多様性は相反するものではなく、互いの阻害要因にもなり得ない。そのため、二律背反的な説明の1,3,4は間違い。\n\n凝集性：集団が構成員を引きつけ、その集団の一員であり続けるように動機づける度合いを指す。凝集性の高さは、各構成員の魅力や構成員間の相互作用、集団の目標や規範などの要素によって決まる。集団の凝集性が高い時、共有する目標に対する集団としての成果が大きくなる傾向がある。\n\n多様性：集団の構成員の組み合わせの多様さを指す。構成員のバックグラウンドや文化、価値観などが多様な集団は、同質的な人々から成る集団よりも個人間の相違が大きいため、短期的にはコンフリクトを生むことが多い。しかし、そうした困難をいったん克服できれば、構成員が様々な情報や能力を持っていることの利点が発揮され、より高い成果を生み出す可能性が高い。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n8．集団のメカニズム P.196-197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":101,"idx":101},{"id":"xlsx-2025秋-組織行動-12","season":"2025秋","subject":"組織行動","scope":"7.モチベーションとインセンティブ","question":"出題範囲：7.モチベーションとインセンティブ\n\n■問12.モチベーション理論について間違っているものをすべて選択してください。\n\nA.マズローの5段階欲求は「生理的」「安全」「社会的」「尊厳」「自己実現」に分けられる。\n\nB.マグレガーのX理論、Y理論において、X理論は「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。\n\nC.マグレガーのX理論、Y理論において、Y理論は「人間は本来怠け者で、責任を回避しようとするものだ」と考える。\n\nD.ハーズバーグの動機づけ・衛生理論では、仕事に対する満足をもたらす要因と不満をもたらす要因が異なることを示している。","answer":"■正解：BとC\n\n■解説：\n\nマグレガーのX理論、Y理論において、X理論は「人間は本来怠け者で、責任を回避しようとするものだ」と考えるのに対し、Y理論では「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。近年では、Y理論に基づいて動機づけを考えることが必要だと言われている。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n7．モチベーションとインセンティブ P.194ｰ195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":102,"idx":102},{"id":"xlsx-2025秋-組織行動-13","season":"2025秋","subject":"組織行動","scope":"10. コミュニケーション","question":"2025年9月18日（木）＜組織行動学＞\n\n出題範囲：10. コミュニケーション\n\n■問13.送り手と受け手の間でメッセージを伝達し、その意味を共有する「コミュニケーション」の阻害要因に関する記述として、正しいものはどれか。\n\nA.送り手の問題に「フィルタリング」がある。これは受け手により好意的に受け入れてもらうために、送り手が情報を操作することである。\n\nB.受け手の問題に「選択的認知」がある。これは個人的な経験に基づいて複数の情報から特定の情報のみを選択したり、自己の関心を反映させた解釈を行うことである。\n\nC.送り手と受け手の双方に関わる問題に「文化的差異」がある。文化的な背景が違うと、同じ単語やジェスチャーが意味するものが異なることがある\n\nD.「感情表現」などの非言語コミュニケーションでは、理性的かつ客観的な思考過程は無視されにくいため冷静な判断を下しやすい","answer":"■正解：AとBとC\n\n■解説：\n\nD.「感情表現」は送り手と受け手双方に誤解を与えることが多い。大喜びといった極端な感情表現に直面すると、理性的かつ客観的な思考過程を無視し、感情的な判断を下しがちになる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n10.コミュニケーション P.200-201","source":"Excel: GMAP道場問題秋春(2).xlsx","no":103,"idx":103},{"id":"xlsx-2025秋-組織行動-14","season":"2025秋","subject":"組織行動","scope":"5.エンパワーメント","question":"出題範囲：5.エンパワーメント\n\n■問14.エンパワーメントを活用していくための３つの成功要件の組み合わせとして正しい選択肢を下記から選んでください。\n\nA. ①経営理念、ビジョンの共有　②集団における意思決定　③コミュニケーションプロセス\n\nB. ①正当な評価と報奨　②集団における意思決定　③個人の動機づけ\n\nC. ①能力の把握と資源の提供　②コミュニケーションプロセス　③個人の動機づけ\n\nD. ①経営理念、ビジョンの共有　②正当な評価と報奨　③能力の把握と資源の提供","answer":"■正解：D\n\n■解説：\n\n構成員の自律的な行動は必要だが、それが行き過ぎてしまうと、構成員の動きに統一性や一貫性がなくなり、組織が目指している目標を実現できなくなる。そのため、構成員の自律性を促すだけではなく、その行動をある程度制御しなくてはならない。また、部下の能力を見極め、適切な業務を設定することも大切だ。\n\nこのように考えると、エンパワーメントの「技術」はそれほど簡単ではないことがわかる。これらの微妙なバランスをとっていくために、①経営理念、ビジョンの共有、②正当な評価と報奨、③能力の把握と資源の提供、の3点に注意していく必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n5．エンパワーメント P.190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":104,"idx":104},{"id":"xlsx-2025秋-組織行動-15","season":"2025秋","subject":"組織行動","scope":"4. リーダーシップとマネジメント","question":"出題範囲：4. リーダーシップとマネジメント\n\n■問15.経営管理者に要求される能力は、縦軸に企業変革の必要性、横軸に企業運営の複雑性の2軸からマトリクス表現できます。経営管理者に要求される能力の説明として、誤っているものを選択してください。\n　\nA.19世紀における大部分の企業組織では、リーダーシップ、マネジメント機能ともそれほど必要としない\n　\nB.企業の創業期は、高度のマネジメント機能が必要であるが、リーダーシップ機能へのニーズは少ない\n　\nC.高度成長期の大企業では、高度のリーダーシップが必要であるが、マネジメント機能へのニーズは少ない\n　\nD.現在の大部分の大企業では、リーダーシップ、マネジメントの両機能が大いに要求されている","answer":"■正解：BとC\n　\n■解説：\n\nB.企業の創業期は、高度のリーダーシップが必要であるが、マネジメント機能へのニーズは少ない\n　\nC.高度成長期の大企業では、高度のマネジメント機能が必要であるが、リーダーシップ機能へのニーズは少ない\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4．リーダーシップとマネジメント P.188-189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":105,"idx":105},{"id":"xlsx-2025秋-組織行動-16","season":"2025秋","subject":"組織行動","scope":"20. 組織学習","question":"出題範囲：20. 組織学習\n■問16.急速な環境変化が常態化している今日、変革する力を持った組織が注目されています。マサチューセッツ工科大学のピーター・センゲは「伝統的な組織」と「学習する組織」の違いを5つの区分でそれぞれ説明しています。間違っているものを選択してください。\n　\nA.方向性の決定：\n「伝統的な組織」においては、組織のあちこちで共有されるビジョンを認識することができる。トップ・マネジメントは、ビジョンの存在と育成に対して責任をもつ。\n　\nB.アイデアの形成と実行：\n「学習する組織」においては、アイデアの形成と実行は組織のあらゆるレベルにおいて行われる。\n　\nC.組織における考え方の特徴：\n「伝統的な組織」においては、各人はそれぞれ自分の仕事に責任を持ち、個人の能力の向上に力を注ぐ。\n　\nD.コンフリクトの解決：\n「学習する組織」においては、コンフリクトは階層上の権力や影響力の行使を通じて解決される。\n　\nE.リーダーシップとモチベーション：\n「学習する組織」においては、リーダーの役割はエンパワーメントとカリスマ的なリーダーシップにより共有されるビジョンを構築し、個人に権限を委譲し、やる気を起こさせ、企業全体に効果的な意思決定を促すことである。","answer":"■正解：A、D\n　\n■解説：\n　\n「A.方向性の決定」にて上記で説明している内容は、「学習する組織」に関しての説明です。「学習する組織」は、組織のあちこちで共有されるビジョンを認識することができ、トップ・マネジメントはビジョンの存在と育成に対して責任をもちます。一方で、「伝統的な組織」では、ビジョンはトップ・マネジメントによって示されます。\n　\n「D.コンフリクトの解決」にて上記で説明している内容は、「伝統的な組織」に関しての説明です。「伝統的な組織」は、階層上の権力や影響力の行使を通じてコンフリクトが解決されます。一方で「学習する組織」では、組織のどこにおいても相互の学習と多様な視点の統合を通じてコンフリクトが解決されます。\n　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n20.組織学習P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":106,"idx":106},{"id":"xlsx-2025秋-組織行動-17","season":"2025秋","subject":"組織行動","scope":"6.パワー","question":"出題範囲：6.パワー\n\n■問17.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・アメリカの社会心理学者のジョン・フレンチとバートラム・ラーベンによると、パワーは次の５つで構成される。\n・（①）：受け手にとって苦痛となるものを与えることで、影響を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する。\n・報酬力：受け手にとって励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、（②）などが該当する。\n・（③）：受け手に対し影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する。\n・（④）：受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。\n・同一視力：受け手にとって魅力のある人物、理想像であること。たとえば、（⑤）、実績などが同一視力を形成する要素となりうる。\n\nA. ①専門力　②有給休暇　③強制力　④正当権力　⑤インセンティブ\nB. ①正当権力　②インセンティブ　③強制力　④影響力　⑤権力闘争\nC. ①強制力　②インセンティブ　③正当権力　④専門力　⑤業務経験\nD. ①強制力　②有給休暇　③正当権力　④影響力　⑤業務経験","answer":"■正解：C\n\n■解説：\n\n・強制力：受け手にとって苦痛となるものを与えることで、影響を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する。\n\n・報酬力：受け手にとって励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、インセンティブなどが該当する。\n\n・正当権力：受け手に対し影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する。\n\n・専門力：受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。\n\n・同一視力：受け手にとって魅力のある人物、理想像であること。たとえば、業務経験、実績などが同一視力を形成する要素となりうる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n6．パワー　P.192-193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":107,"idx":107},{"id":"xlsx-2025秋-組織行動-18","season":"2025秋","subject":"組織行動","scope":"19. 変革のマネジメント","question":"出題範囲：19. 変革のマネジメント\n\n■問18.組織改革とは、新しい環境に適応するために組織を変化させることである。組織改革の方法について、間違っているものを選択してください。\n\nA.組織改革の際には、経営陣がメッセージを発するだけで十分である。\n\nB.自己変革型組織では、従業員をサポートする必要はない。\n\nC.マネージャーはマネジメントとリーダーシップの技術を身につけるべきである。\n\nD.組織改革には、経営戦略やマーケティングの施策を変えるだけでよい。","answer":"■正解：Ａ、Ｂ、Ｄ\n\n■解説：\n\nA. 組織改革の際には、「このように行動してほしい」と経営陣がメッセージを発するだけでは不十分である。\n\nB. 自己変革型組織ではとくに、従業員をサポートするエンパワーメントが強く求められる。\n\nD. 組織の構成要素は、経営理念やビジョン、経営戦略、マーケティングなどの施策群、組織構成員などの行動などに分けられる。組織改革ではこれらすべてを変える必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n19.変革のマネジメント P.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":108,"idx":108},{"id":"xlsx-2025秋-組織行動-19","season":"2025秋","subject":"組織行動","scope":"","question":"■問 19.コンフリクトのマネジメントに関して、以下から不適切なものを選んでください。\n\nA.　コンフリクトにはマイナスの効果しかないので、回避するか速やかに解消すべきである。\n\nB.　コンフリクトの最初のきっかけとなる行動に対して、どのような対応を示し、そこからどのようにコンフリクトが深まったのかというパターンを掴む。\n\nC.　コンフリクトは多くの場合、実質的問題と感情的問題という2つの異なる問題から生じる。組織では感情的問題を表に出しにくいため、しばしば実質的問題にすり替えられることがある。\n\nD.　コンフリクトが生じる原因は突き詰めると外的要因に絞られ、シンプルである。","answer":"■正解：A,D\n\n■解説：\nA：コンフリクトにはプラスの効果もマイナスの効果もある。対策を打つ前に、どちらの効果がより強く表れているかを分析する。\nD：コンフリクトが生じる原因として、外的要因と個人的要因が考えられる。通常、コンフリクトの原因は複数存在し、それらが複雑に絡み合っていることが多い。対立が深まるにつれ、最初の原因とは関係ないものが原因になることもある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\nコンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":109,"idx":109},{"id":"xlsx-2025秋-組織行動-20","season":"2025秋","subject":"組織行動","scope":"9. チーム・マネジメント","question":"出題範囲：9. チーム・マネジメント\n\n■問 2 0.「集団とチーム」に関する下記の記述について、正しいものを全て選択してください。\n\nＡ．集団の構成員は、通常、自分の責任範囲を超えて業務を遂行する。\n\nＢ．集団の成果は、各構成員の業績達成能力の総和以上にはならない。\n\nＣ．チームの構成員は、個人責任と相互責任を担う。\n\nＤ．チームの成果は、各構成員の業績達成能力の総和よりも大きくなる。","answer":"■正解： ＢとＣとＤ\n\n■解説：\n\nＡは誤り：集団の構成員は通常、自分の責任範囲内で業務を遂行します。\n\nチームの構成員は個人責任と相互責任を担っており、その活動は個人の責任範囲にとどまりません。チーム全体の活動の最大化のために積極的に情報の共有や意思決定を行います。\n\n得られる成果が構成員個々の業績達成能力の総和よりも大きくなる集団のことを「チーム」と呼びます。プラスアルファの成果の有無が、集団とチームの最大の違いです。\n\n■出典：グロービス マネジメントブック 改訂3版\n\nチーム・マネジメント P.198-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":110,"idx":110},{"id":"xlsx-2025秋-組織行動-21","season":"2025秋","subject":"組織行動","scope":"6. パワー","question":"出題範囲：6. パワー\n\n■問21.急速に変化する技術、社会、経済の環境下で、企業が目標を達成するために「パワー」を適切に用いる必要が生じる、最も根源的だと思われる理由を１つ選択してください。\n\n１企業のブランドイメージを確立し、市場での競争優位を確保するため。 \n２相互依存関係にある多様なステークホルダーとの協力が不可欠であり、良好な関係を維持する必要があるため。 \n3組織内のリーダーシップを強化し、従業員のモチベーションを向上させるため。 \n4新しい技術開発を促進し、継続的なイノベーションを生み出すため。","answer":"正解：2\n\n■解説：\n\n技術や社会、経済などが急速に変化する中で企業が目標を達成するには、相互依存関係にあるステークホルダーとの協力が不可欠。利害が対立することもあるステークホルダーと良好な関係を維持するために「パワー」を適切に用いる必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版\n6．リーダーシップとマネジメント P.192-193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":111,"idx":111},{"id":"xlsx-2025秋-組織行動-22","season":"2025秋","subject":"組織行動","scope":"8. 集団のメカニズム","question":"出題範囲：8. 集団のメカニズム\n\n■問22.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n集団における意思決定\n一般に、（①）における意思決定は（②）で行う意思決定より優れている。それは、多様な意見や情報を収集できたり、決定内容がより多くの人に受け入れられる可能性が高いからだ。\n一方、集団ゆえに陥りやすい問題もある。その一つである「（③）」は合意に至ろうとするプレッシャーから、集団において物事を多様な視点から批判的に評価する能力が欠落する傾向である。\n\nA. ①集団　②個人　③コンセンサス\nB. ①集団　②個人　③グループシンク\nC. ①個人　②集団　③コンセンサス\nD. ①個人　②集団　③グループシンク","answer":"■正解：B\n\n■解説：\n\n集団における意思決定\n\n一般に、集団における意思決定は個人で行う意思決定より優れている。それは、多様な意見や情報を収集できたり、決定内容がより多くの人に受け入れられる可能性が高いからだ。\n\n一方、集団ゆえに陥りやすい問題もある。その一つである「グループシンク」は合意に至ろうとするプレッシャーから、集団において物事を多様な視点から批判的に評価する能力が欠落する傾向である。とくに集団の凝集性が高い場合や、外部と隔絶している場合、支配的なリーダーが存在する場合などに起こりやすい。グループシンクを避けるためには、異なった意見を十分に受け入れ、建設的な批判を重視し、選択肢の分析に時間をかけるなどの配慮が必要だ。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n集団のメカニズム P.196ｰ197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":112,"idx":112},{"id":"xlsx-2025秋-組織行動-23","season":"2025秋","subject":"組織行動","scope":"7. モチベーションとインセンティブ","question":"2025年10月2日（木）＜組織行動学＞\n\n出題範囲：7. モチベーションとインセンティブ\n\n■問23.モチベーションとインセンティブに関する記述として、正しいものはどれか。\n\nA.インセンティブを高めるものをモチベーションという\n\nB.金銭的報酬はあるレベルを超えるとモチベーションを高める効果が薄れる傾向もある\n\nC.魅力あるリーダや気心知れた仲間などの社会的関係も、個人の安心感や余裕を生み、組織への帰属意識やコミットメントを引き出す\n\nD.モチベーションの代表的な例として社会的動機があるが、これは「生活に必要な金銭を得たい」という最も一般的・根本的なものである","answer":"■正解：BとC\n\n■解説：\n\nA.モチベーションを高めるものをインセンティブという\n\nD.問題文は金銭的動機を示しており、社会的動機とは「一定の価値観を共有できる集団（組織）の中で社会生活を営み、その中で注目や評価を受けたり、権力を得たい」という欲求から生じる\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n7.モチベーションとインセンティブ P.194-195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":113,"idx":113},{"id":"xlsx-2025秋-組織行動-24","season":"2025秋","subject":"組織行動","scope":"20. 組織学習","question":"出題範囲：20. 組織学習\n　\n　\n■問24.（「学習する組織」の特徴に関して、下記文章中の（①）～（④）に入る語句の組み合せとして適切なものを選択肢A～Dのうちから選択してください。\n\nアージリスは、組織における学習プロセスには、「シングルループ・ラーニング」と「ダブルループ・ラーニング」の2形態があるとしている。\n\nシングルループ・ラーニングとは、（①）に対して、（②）達成へ向けて軌道修正を行うことを言う。一方、ダブルループ・ラーニングとは、（①）に対して、（②）や（③）そのものを疑い、それらも含めて軌道修正を行うことを言う。アージリスは、組織の構成員が（④）と責任感を持って、変革に資するような行動をとるためには、「ダブルループ・ラーニング」が必要だと考えた。\n\n　\nA.①目標　②既存の計画　③前提　④モチベーション\n\nB.①問題　②既存の計画　③根拠　④自発的な意欲\n\nC.①問題　②既存の目的　③前提　④自発的な意欲\n\nD.①目標　②既存の目的　③根拠　④モチベーション","answer":"■正解：C\n　\n■解説：\n\n　「学習する組織」の概念は、自己変革していく能力を備えた新しい組織のあり方を探り、組織変革を実現してくために必要な鍵を提示している。\n\n　アージリスは、組織における学習プロセスには、「シングルループ・ラーニング」と「ダブルループ・ラーニング」の２形態があるとしている。シングルループ・ラーニングとは、問題に対して、既存の目的達成へ向けて軌道修正を行うことを言う。一方、ダブルループ・ラーニングとは、問題に対して、既存の目的や前提そのものを疑い、それらも含めて軌道修正を行うことを言う。アージリスは、組織の構成員が自発的な意欲と責任感を持って、変革に資する行動をとるためには、「ダブルループ・ラーニング」が必要だと考えた。\n\n　学習する組織を実現するためには、目的や前提そのものを疑い、それらの変革をもたらす「ダブルループ・ラーニング」の考え方が不可欠な要素と言える。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n20.組織学習P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":114,"idx":114},{"id":"xlsx-2025秋-組織行動-25","season":"2025秋","subject":"組織行動","scope":"10. コミュニケーション","question":"出題範囲：10. コミュニケーション\n\n■問25.コミュニケーションとは、送り手と受け手の間でメッセージを伝達し、その意味を共有することです。コミュニケーションを効果的に行うためのコミュニケーション・プロセスの説明として、誤っているものを選択してください。\n　\nA.「記号化」とは、メッセージを記号に変更すること。言語化することを指し、話す、聞く、書く、読むといった方法が可能になる。非言語は含まれない。\n　\nB.「伝達」とは、さまざまなチャネルを通してメッセージを受け手に伝えること。チャネルは、電話や電子メールなどの具体的な方法を指すこともあれば、組織における公式／非公式な伝達経路を指すこともある。\n　\nC.「解読」とは、受け手が記号化されたメッセージの意味を読み取ること。記号化されていることで、送り手と受け手が同じ記号から読み取るメッセージは概ね完全一致するものである。\n　\nD.「フィードバック」とは、受け手が解読したメッセージを送り手とともに確認すること。ポイントを繰り返したり、言い換えたりすることによって、お互いの理解する意味合いがほぼ一致していることを確認する。","answer":"■正解：AとC\n　\n■解説：\n\nA.記号化には、大きく言語、非言語の2種類がある。非言語は表情や態度、行動、相手との距離のとり方など言語以外の記号である。\n　\nC.送り手と受け手は通常、それぞれの個人的経験や組織内における地位や役割などが異なっているため、両者が同じ記号から読み取るメッセージが完全に同じになることは稀である。\n\n■出典：グロービス マネジメントブック 改訂3版\n10．コミュニケーション P.200-201","source":"Excel: GMAP道場問題秋春(2).xlsx","no":115,"idx":115},{"id":"xlsx-2025秋-組織行動-26","season":"2025秋","subject":"組織行動","scope":"19. 変革のマネジメント","question":"出題範囲：19. 変革のマネジメント\n　\n　\n■問26.組織変革とは、新しい環境に適応するために組織を変化させることである。では、具体的に組織の何が変わるのか、下記より選択してください。\n　\nA.経営理念やビジョン\n　\nB.経営戦略\n　\nC.マーケティングなどの施策群\n　\nD.組織構成員の行動","answer":"■正解：A、Ｂ、Ｃ、D　の全部\n　\n■解説：組織の構成要素は、「経営理念やビジョン」「経営戦略」「マーケティングなどの施策群」「組織構成員の行動」などに分けられる。組織変革ではこれらすべてを変える必要がある。とくに鍵となるのが構成員である。構成員の行動を変えることなくして、変革の実行はあり得ない。\n　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n19.変革のマネジメントP.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":116,"idx":116},{"id":"xlsx-2025秋-組織行動-27","season":"2025秋","subject":"組織行動","scope":"11. コンフリクト","question":"出題範囲：11. コンフリクト\n\n■問27.ハーバード大学ビジネススクールのジェームズ・ウェアとルイス・バーンズは、個人間のコンフリクトに対処するには、まず状況を理解し、状況そのものを変えるか、当事者の態度や対応を変える必要があるとしている。\n\nコンフリクトを理解するための視点として、現象面から本質的問題の把握までをまとめた次の４点を順番に並べなさい。\n\nA. コンフリクトのパターン（きっかけとなる行動とその対応、相違点の表現）\n\nB. コンフリクトの根底にある要因（外部要因、個人的要因）\n\nC. コンフリクトが個人および組織に及ぼしている効果（プラスの効果とマイナスの効果）\n\nD. 実質的問題と感情的問題","answer":"■正解：C→A→D→B\n■解説：\nコンフリクトを理解するための視点として、現象面から本質的問題の把握までは以下の４点である。\n1.コンフリクトが個人および組織に及ぼしている効果\nコンフリクトにはプラスの効果もマイナスの効果もある。対策を打つ前に、どちらの効果がより強く表れているかを分析する。\n\n2.コンフリクトのパターン\nコンフリクトの最初のきっかけと行動に対して、どのような対応を示し、そこからどのようにコンフリクトが深まったのかというパターンをつかむ。また、当事者がどのように相違点を表現しているかも重要だ。\n\n3.実質的問題と感情的問題\nコンフリクトは多くの場合、実質的問題と感情的問題という2つの異なる問題から生じる。\n\n4.コンフリクトの根底にある要因\nコンフリクトが生じる原因として、外部要因と個人的要因が考えられる。外部要因は時間的制約、予算制約、資源配分、業績へのプレッシャーなど、個人的要因は対抗意識、相性、仕事上のスタイル、ストレスの許容度などだ。\n\n■出典：グロービス マネジメントブック 改訂3版\n11．コンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":117,"idx":117},{"id":"xlsx-2025秋-組織行動-28","season":"2025秋","subject":"組織行動","scope":"9. チーム・マネジメント","question":"出題範囲：9. チーム・マネジメント\n\n■問28.チーム・マネジメントについて、以下の（①）～（④）の正しい組み合わせを選択肢A～Dのうちから選んでください。\n\n高い成果を上げるチームをつくるには、「（①）の組み合わせ」と「（②）」が重要だ。多様な能力を持つ（①）で編成されているチームは、より大きな成果を生み出す可能性を持つ。なぜなら、技術的な（③）というスキル、問題解決や意思決定のスキル、（④）上のスキル、という3つの重要なスキルがチームとして十分に発揮されるからだ。\n\nA.①マネージャー、②凝集性、③一般知識、④対人関係\n\nB.①構成員、②分散性、③一般知識、④対立関係\n\nC.①マネージャー、②分散性、③リーダーシップ、④社内調整\n\nD.①構成員、②凝集性、③専門知識、④対人関係","answer":"■正解：D\n\n■解説：\n\n高い成果を上げるチームをつくるには、「構成員の組み合わせ」と「凝集性」が重要だ。多様な能力を持つ構成員で編成されているチームは、より大きな成果を生み出す可能性を持つ。なぜなら、①技術的な専門知識というスキル、②問題解決や意思決定のスキル、③対人関係上のスキル、という3つの重要なスキルがチームとして十分に発揮されるからだ。\n\n■出典：グロービス マネジメントブック 改訂3版\n\nチーム・マネジメント P.198-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":118,"idx":118},{"id":"xlsx-2025秋-組織行動-29","season":"2025秋","subject":"組織行動","scope":"5. エンパワーメント","question":"出題範囲：5. エンパワーメント\n\n■問 29.エンパワーメントの説明として不適切なものを選んでください。\n\nA.　エンパワーメントという言葉をビジネスで用いるとき、「与えられた（業務）目標を達成するために、組織の構成員に自律的に行動する“力”を与えること」と定義できる。\n\nB.　変化が不確実でそのスピードも速い近年、「組織構成員の自律的な行動」の重要性が高まっているが、部下に任せ、自律的な行動を促す上司の行動はあくまで個人的な行動パターンに過ぎず、「経営の技術」としてのエンパワーメントではない。\n\nC.　構成員の自律的な行動は必要だが、それが行き過ぎてしまうと、構成員の動きに統一性や一貫性がなくなり、組織が目指している目標を実現できなくなる。","answer":"■正解：B\n\n■解説：\nB：これまでにも「好きにやってみろ」と部下に任せ、自律的な行動を促すことができる上司は数多く存在した。しかし、通常そうした上司の取り組みは個人的な行動パターンとしてとらえられ、「経営の技術」として意識的に習得するものという認識はなかった。今後は、経営者やマネジャーはリーダーシップを発揮するために必要な「技術」として、エンパワーメントを習得する必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\nエンパワーメント 190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":119,"idx":119},{"id":"xlsx-2025秋-組織行動-30","season":"2025秋","subject":"組織行動","scope":"4.リーダーシップとマネジメント","question":"出題範囲：4.リーダーシップとマネジメント\n\n■問30.企業変革の必要性や企業運営の複雑性の観点から、経営管理者に要求される能力に関する下記の記述ついて適切なものを全て選択してください。\n\nA.19世紀における大部分の企業組織：リーダーシップ、マネジメント機能ともそれほど必要としない。\n\nB.高度成長期の大企業：高度のマネジメント機能が必要であるが、リーダーシップ機能へのニーズは少ない。\n\nC.企業の創業期：高度のリーダーシップが必要であるが、マネジメント機能へのニーズは少ない。\n\nD.現在の大部分の大企業：リーダーシップ、マネジメントの両機能が大いに要求されている。","answer":"■正解： 全て（Ａ・Ｂ・Ｃ・Ｄ）\n\n■解説：\n\n「リーダーシップ」は「変革を推し進める機能」であり、（長期的な）ビジョンの提示や伝達、メンバーの動機付けが主な機能となります。一方で、「マネジメント」は「効率的に組織を運営する機能」であり、（短期的な）計画や予算の立案や組織構造の設計、人員配置、予算の実績管理など、問題解決が主な機能となります。\n\nVUCAの時代において、変化への対応は「リーダーシップ」が、複雑な環境への対応は「マネジメント」の能力が不可欠となります。これは、一部の経営陣に限らず、従業員にとっても同様であり、目の前の変化や複雑な状況にその場で対処することが競争上不可欠となっており、両方の能力を身に付けることが求められています。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4.リーダーシップとマネジメント P.188-189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":120,"idx":120},{"id":"xlsx-2025秋-アカウンティング-1","season":"2025秋","subject":"アカウンティング","scope":"1. 企業経営とアカウンティング","question":"出題範囲：1. 企業経営とアカウンティング\n\n■問1.\n\n1.企業経営とアカウンティング\n\n次の文章で正しいものを1つ選択してください\n\nA.企業の所有者は社長や取締役などの経営者であり、資本を提供している株主ではない\n\nB.株主と経営者との間の情報の非対称性を是正するディスクロージャーが重要になってくる\n\nC.株主は開示された会計情報に基づいて、経営者の理念を評価することができる\n\nD.IR活動は制度的ディスクロージャーである","answer":"■正解：B\n\n■解説：\n\nA：企業の所有者は資本を提供している株主であり、社長や取締役などの経営者ではない\n\nC：株主は開示された会計情報に基づいて、経営者の行動（業績）を評価することができる\n\nD：IR活動は自発的ディスクロージャーである\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n1.企業経営とアカウンティング P.92-93","source":"Excel: GMAP道場問題秋春(2).xlsx","no":121,"idx":121},{"id":"xlsx-2025秋-アカウンティング-2","season":"2025秋","subject":"アカウンティング","scope":"2.アカウンティングの目的","question":"出題範囲：2.アカウンティングの目的\n　\n■問2.財務会計、税務会計および管理会計の説明について、以下より正しいものをひとつ選びなさい。\n　\nA.財務諸表は、損益計算書、貸借対照表、キャッシュフロー計算書の3つを柱に構成されている。\n　\nB.日本の会計基準は米国会計基準よりも情報開示に対して高い厳格性を課しており、証券市場における情報開示の透明度は、一般にアメリカよりも日本の方が高いと言われる。\n　\nC.財務会計上の利益と税務会計上の課税対象所得は、必ず一致する。\n　\nD.管理会計は、さまざまな法律や規則（会社法・金融商品取引法・税法など）によって厳格に規定されている。","answer":"■正解：A\n　\n■解説：\n　\nA:正しい説明である。\n　\nB:誤り。日本とアメリカの説明が逆で、アメリカの方が透明性が高い。企業活動のグローバル化に伴って、日本でもより透明度の高い情報開示が求められるようになり、会計基準の見直しが進んでいる。\n　\nC:誤り。財務会計と税務会計は目的が違うため、収益や費用などを算出するときのルールも異なる。したがって、財務会計上の利益と税務会計上の課税対象所得は必ずしも一致しない。\n　\nD:誤り。財務会計についての説明。\n　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n2.アカウンティングの目的 P.94-95","source":"Excel: GMAP道場問題秋春(2).xlsx","no":122,"idx":122},{"id":"xlsx-2025秋-アカウンティング-3","season":"2025秋","subject":"アカウンティング","scope":"3. 収益および費用の認識","question":"出題範囲：3. 収益および費用の認識\n\n■問3.会計年度の経営成績を正しく示すためには、期間損益計算に基づく必要があります。その認識基準として、現金主義、発生主義、実現主義の3つの方法がありますが、以下のうち、収益と費用の認識として、正しいものを全て選んでください。\n\nA.費用収益対応原則とは、費用と収益を同じ基準で測定・認識することである。費用を発生主義で計上するときは収益も発生主義で計上しなければならない。\n\nB.たとえば家賃を2期分前払いした場合、使用期間相当分（１期分）を今期分の費用として計上するのが発生主義の考え方である。\n\nC.実現主義は、経済的価値の増加が実現したときに収益を認識する。たとえば、顧客から注文を受けて決済をしたら企業の経済的価値が増加するので、実現主義の場合はこの段階で収益を計上する。\n\nD.たとえば家賃を後払いする場合は、まだ現金を支払っていなくても、使用期間相当分は今期の費用として計上されることは、実現主義に基づく。","answer":"■正解：B\n\n■解説：\n\nA：誤り。費用収益対応原則とは、発生した費用のうち、その期の収益獲得に貢献した部分だけをその期の費用として測定・認識することである。減価償却がその典型例。\n\nＢ：正しい。原則として、費用は発生主義、収益は実現主義が基準。\n\nＣ：誤り。発生主義→注文を受けた段階で企業の経済価値が増加し、収益を計上する。実現主義→確実に顧客宛に発送した段階で、収益を計上する。\n\nＤ：誤り。「家賃を後払いする場合は、まだ現金を支払っていなくても使用期間相当分を今期の費用を計上する」のは発生主義の考え方。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n3.収益及び費用の認識 P.96-97","source":"Excel: GMAP道場問題秋春(2).xlsx","no":123,"idx":123},{"id":"xlsx-2025秋-アカウンティング-4","season":"2025秋","subject":"アカウンティング","scope":"4. 財務諸表の成り立ち","question":"出題範囲：4. 財務諸表の成り立ち \n　\n■問4.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n　\n・損益計算書は、ある一定の期間（通常1年）における企業の経営成績を示したものだ。損益計算書に示される過去1年間の成果は、主に（①）活動による成果と、それを補完する（②）活動の成果によるものだ。\n　\n・貸借対照表は、ある時点（決算期末時点）での企業の資産内容を明らかにしたものだ。主に（②）活動と（③）活動の結果が示される。\n　\n　・キャッシュフロー計算書は、企業の各期の現金および現金同等物の増減を整理して示したものだ。現金の動きを整理することで、（①）活動と流動性（資金繰り）の関係や、（④）に関わる諸活動と現金の流れの関係も明らかになる。\n　\n　\nA. ①営業　②投資　③財務　④営業サイクル\n\nB. ①財務　②投資　③営業　④財務サイクル\n\nC. ①営業　②財務　③投資　④営業サイクル\n\nD. ①投資　②営業　③財務　④投資サイクル","answer":"■正解：C\n　\n■解説：\n\n・損益計算書の営業利益は仕入れから代金回収まで行う営業活動の成果を、経常利益は財務活動（資金調達活動、資金運用活動）の成果を表わします。\n\n・貸借対照表の「資産」は資金の具体的な運用形態（投資）を、「負債＋純資産」はその資金調達の源泉（財務）を示します。\n\n・キャッシュフロー計算書では、事業を継続させるために営業サイクル（営業活動、財務活動、投資活動）における実際の現金の動きを把握する必要があります。\n　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4．財務諸表の成り立ちP.98-99","source":"Excel: GMAP道場問題秋春(2).xlsx","no":124,"idx":124},{"id":"xlsx-2025秋-アカウンティング-5","season":"2025秋","subject":"アカウンティング","scope":"5. 損益計算書","question":"出題範囲：5. 損益計算書\n\n■問5.以下の損益計算書から①売上総利益、②営業利益、③経常利益、④当期純利益を算出してください。\n売上高　　　　　　　　　　　　：10,000\n売上原価　　　　　　　　　　　：5,000\n売上総利益　　　　　　　　　　：①\n販売費および一般管理費　　　　：2,000\n営業利益　　　　　　　　　　　：②\n営業外収益　　　　　　　　　　：2,000\n営業外費用　　　　　　　　　　：1,000\n経常利益　　　　　　　　　　　：③\n特別利益　　　　　　　　　　　：1,000\n特別損失　　　　　　　　　　　：2,000\n税金等調整前当期純利益　　　　：3,000\n法人税、住民税および事業税　　：1,000\n少数株主利益　　　　　　　　　：1,000\n当期純利益　　　　　　　　　　：④","answer":"■正解：\n\n①売上総利益　：5,000\n\n②営業利益　　：3,000\n\n③経常利益　　：4,000\n\n④当期純利益　：1,000\n\n■解説：\n\n①売上総利益は、売上総利益 ＝ 売上高 ― 売上原価で求めることが出来る。\n\n②営業利益は、営業利益 = 売上総利益 ― 販売費および一般管理費で求めることが出来る。\n\n③経常利益は、経常利益 ＝ 営業利益 ＋ 営業外収益―営業外費用で求めることが出来る。\n\n④当期純利益は当期純利益 = 税金等調整前当期純利益 ― 法人税、住民税および事業税 ―少数株主利益で求めることが出来る。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n5．損益計算書 P.100-101","source":"Excel: GMAP道場問題秋春(2).xlsx","no":125,"idx":125},{"id":"xlsx-2025秋-アカウンティング-6","season":"2025秋","subject":"アカウンティング","scope":"6.貸借対照表（資産）","question":"出題範囲：6.貸借対照表（資産）\n \n■問6　貸借対照表における資産分類の説明として、誤っているものを1つ選択してください。\n\nA.当座資産：営業活動の販売段階で生じる売掛金・受取手形など、営業活動の回収段階で生じる現金・預金に近い形の資産を指す。\n \nB.その他流動資産：1年以内に費用として損益計算書に計上される(費用化される)前払費用などを指す。\n \nC.無形固定資産：法律や契約によって認められた権利に基づく資産。鉱業権、電話加入権、借地権、のれんなどが該当する。\n \nD.投資その他の資産：企業本来の事業活動とは関係ない投資や、支配する事を目的として長期的に保有する資産のこと。特許権、投資有価証券、長期貸付金、子会社株式などが該当する。","answer":"■正解：D\n \n     ■解説：特許権は無形固定資産に分類されるため、Dが誤り。投資その他の資産は財務活動によって生じ、無形固定資産は投資活動によって生じる。その他は選択肢に記載の通り。\n \n　■出典：グロービス マネジメントブック 改訂3版 　\n\n　6.貸借対照表（資産） P.102-103","source":"Excel: GMAP道場問題秋春(2).xlsx","no":126,"idx":126},{"id":"xlsx-2025秋-アカウンティング-7","season":"2025秋","subject":"アカウンティング","scope":"7. 貸借対照表（負債＋純資産）","question":"出題範囲：7. 貸借対照表（負債＋純資産）\n　\n■問7. 貸借対照表の負債に関する記述として、誤っているものを全て選択してください。\n\nA. 貸借対照表では通常、負債は「流動負債」と「固定負債」に分けて計上される。それぞれの支払猶予期間は、流動負債は1年以内、固定負債は1年超である。\n\nB. 流動負債の代表的な勘定科目として、支払手形、売掛金、未払費用、未払法人税、短期借入金などがある。\n\nC. 固定負債の代表的な勘定項目として、長期借入金、社債などがある。\n\nD. 負債とは営業サイクルに関わって生じた債務であり、将来の損失に備えるための各種引当金は資産として計上する。","answer":"■正解：B・D　が誤り\n\n■解説：\n\nA. 正しい\n\nB. 売掛金は流動資産であり、企業が商品やサービスを提供した対価として、後日受け取る権利がある代金である。流動負債に計上されるのは買掛金であり、商品を仕入れたりサービスを受けたものの、まだ代金を払っていない状態の債務である。\n\nC. 正しい\n\nD. 退職給付引当金や賞与引当金など、将来にわたる支払いに備えるための各種引当金は固定負債に計上される。\n　\n■出典：グロービス マネジメントブック 改訂3版\n\n貸借対照表（負債＋純資産） P.104-105","source":"Excel: GMAP道場問題秋春(2).xlsx","no":127,"idx":127},{"id":"xlsx-2025秋-アカウンティング-8","season":"2025秋","subject":"アカウンティング","scope":"8. キャッシュフロー計算書","question":"出題範囲：8. キャッシュフロー計算書\n\n■問8.キャッシュフロー計算書の見方について、誤っているものを選択してください。\n\nA.貸借対照表との関係で現金の動きを考えると、概ね資産の増加は現金の増加を、負債・純資産の増加は現金の減少を意味する。\n\nB.企業の発展段階や業種に関わらず、現金は多ければ多い方が良い。\n\nC.成長中の企業（事業）では、営業活動による収支では、マイナスに、投資活動ではプラスに、財務活動ではマイナスになる傾向がある。\n\nD. 安定期は、営業活動による収支ではプラスに転じ、投資活動はプラスだが支出額は減少するので、財務活動はほぼ均衡の状態となる。","answer":"■正解：全て間違い\n\n■解説：\n\nA. 貸借対照表との関係で現金の動きを考えると、おおむね資産の増加は現金の減少を、負債・純資産の増加は現金の増加を意味する。\n\nB. 現金は多ければよいわけでもなく、企業の発展段階や業種に応じて適正な水準かどうかがポイントになる。現金を必要以上に多く持っていることは、企業活動に活用すべき資金を遊ばせているわけで、好ましい姿ではない。\n\nC. 成長中の企業（事業）では、売り上げを伸ばすために取引先に対する支払条件を緩和したり、見込み生産を行うので、営業活動による現金収支はマイナスに、投資活動では活発に設備投資を行うのでマイナスに、それを支えるために積極的に資金調達を行うので財務活動ではプラスになる傾向がある。\n\nD．安定期は、営業活動では支払条件も安定し、需給も調整しやすくなるのでプラスに転じ、投資活動はマイナスだが支出額は減少するので、財務活動はほぼ均衡の状態となる。成熟期には、営業活動の現金収支はプラスに、投資活動は抑えぎみで、財務活動では返済が多くなり、マイナスになる傾向にある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\nキャッシュフロー計算書 P.106-107","source":"Excel: GMAP道場問題秋春(2).xlsx","no":128,"idx":128},{"id":"xlsx-2025秋-アカウンティング-9","season":"2025秋","subject":"アカウンティング","scope":"9.連結会計","question":"出題範囲：9.連結会計\n\n■問9.連結会計について次の文章から誤っているものを1つ選択してください。\n\nA.連結会計の対象となる子会社の基準には、持株基準と支配力基準がある。\n\nB.親会社が過半数の株式を所有している場合、子会社は連結会計の対象となる。\n\nC.親会社が過半数の株式を所有していない場合、その会社を連結会計の\n\n対象とすることができない。\n\nD.親会社が子会社に販売活動を行った場合、親会社の売掛金と子会社の買掛金は外部との\n\n財の移動と認められない。そのため、連結決算の過程で相殺処理が行われる。","answer":"■正解：Ｃが誤り\n\n■解説：\n\nC   過半数の株式を保有していなくとも、親会社が役員派遣などを通じて子会社の財務や経営を実質的に支配している場合は連結対象に含める。これを支配力基準という。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n9.連結会計 P.108-109","source":"Excel: GMAP道場問題秋春(2).xlsx","no":129,"idx":129},{"id":"xlsx-2025秋-アカウンティング-10","season":"2025秋","subject":"アカウンティング","scope":"10. 税効果会計と退職給付会計","question":"出題範囲：10. 税効果会計と退職給付会計\n\n■問10.税効果会計および退職給付会計について、次のA～Dのうち、正しいものを選択してください。\n\nA. 税効果会計とは、財務会計上の利益と税務会計上の所得との乖離を合理的に期間対応させるための会計処理である。\n\nB. 繰延税金資産は、将来の租税負担として計上される。\n\nC. 退職給付会計とは、従業員が退職するときに企業が支払う退職金や企業年金を厳格に見積もり、これに対する企業の対応状況を開示する会計制度である。\n\nD. 現在の会計制度では、退職給付会計において退職一時金のみを退職給付引当金として計上する。\n\n✽","answer":"■正解：AとC\n\n■解説：\n\nA： 正しい。財務会計上と税務会計上の所得との乖離を合理的に期間対応させるための会計処理が税効果会計である。\n\nＢ： 誤り。繰延税金資産は将来の租税負担ではなく、「将来の税金の減少額」として計上される。将来の負担に相当するのは「繰延税金負債」である。\n\nＣ：正しい。退職給付会計とは、従業員が退職するときに企業が支払う退職金や企業年金を厳格に見積もり、これに対する企業の対応状況を開示する会計制度。\n\nＤ：誤り。いまの会計規則では、年金の積立不足額も退職一時金とともに退職給付引当金として計上される。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n10.税効果会計と退職給付会計 P.110-111","source":"Excel: GMAP道場問題秋春(2).xlsx","no":130,"idx":130},{"id":"xlsx-2025秋-アカウンティング-11","season":"2025秋","subject":"アカウンティング","scope":"","question":"■問11\n\n次の有価証券の中で、時価法で計上されるのはどれか？\n\nA.子会社・関連会社株式\n\nB.売買目的有価証券\n\nC.満期保有目的の債券\n\nD.長期的には売却が想定される有価証券","answer":"■正解：BとD\n\n■解説：\n\nA 子会社・関連会社株式は原価法\n\nC 満期保有目的の債券は償却原価法\n\n■出典：グロービス マネジメントブック 改訂3版\n\n11.有価証券(時価会計) P.112-113","source":"Excel: GMAP道場問題秋春(2).xlsx","no":131,"idx":131},{"id":"xlsx-2025秋-アカウンティング-12","season":"2025秋","subject":"アカウンティング","scope":"","question":"■問12.以下の財務データから求められるROA・ROEの正しい組み合わせはどれか選びなさい。\n　\n（PL）\n売上高　　　：20,000\n売上総利益　：  8,000\n営業利益　　：  5,000\n経常利益　　：  3,000\n当期純利益　：  1,000\n　\n（BS）\n資産の部　　　　　　　　負債及び純資産の部\n現金・預金：   500  　　　買掛金　　：2,000\n売掛金　　：1,500　  　　長期借入金：3,000\n棚卸資産　：3,000　　  　株主資本　：5,000　\n固定資産　：5,000 \n　\nA：ROA：20％、ROE：10％\nB：ROA：5％、ROE：25%\nC：ROA：10％、ROE：20％\nD：ROA：25％、ROE：5%","answer":"■正解：C\n　\n■解説：ROA（Return on Assets：総資産利益率）は「当期純利益÷総資産」、ROE（Return on Equity：自己資本利益率）は「当期純利益÷自己資本」で求めることができる。\n\nまた、ROE＝ROA〔売上高当期純利益率（当期純利益÷売上高）×総資産回転率（売上高÷総資産）〕×財務レバレッジ（総資産÷自己資本）で表すこともできる。\n　\n上記例の場合、下記計算式で求められる。\n\nROA＝1,000（当期純利益）÷10,000（総資産）＝10％\n\nROE＝1,000（当期純利益）÷5,000（自己資本：株主資本）＝20％\n　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n12.総合力分析：ROAとROE　 P.114-115","source":"Excel: GMAP道場問題秋春(2).xlsx","no":132,"idx":132},{"id":"xlsx-2025秋-アカウンティング-13","season":"2025秋","subject":"アカウンティング","scope":"13. 収益性分析","question":"出題範囲：13. 収益性分析\n\n■問13.売上高利益率とは、売上高に対してどのくらいの利益を獲得することができたかを示す指標ですが、どの利益を用いるかにより、いくつかの指標があります。以下のうち、指標とそこから分かる傾向について、誤っているものを選んでください。\n\nA.売上高総利益率は、原材料＋労務費・製造経費等の売上原価を控除した利益率の高い製品を販売しているかを示している。この比率が下落しているときは、原価率の上昇や商品力の低下などの原因が考えられる。\n\nB.売上高営業利益率は、売上原価と販売費・一般管理費を控除した営業利益を用いて、本業の利益率が高いかどうかを示している。この比率が低下しているときは、販売活動や管理活動が効率的でないなどの原因が考えられる。\n\nC.売上高経常利益率は、支払金利等を控除した通常の企業活動における利益率である。この比率が低下しているときは、支払利息等が増加しているなどの原因が考えられる。なお、連結の場合、経常利益には子会社だけでなく持分法適用関連会社の収支の影響も受けるため、グループ全体の状況がこの比率に表れる。\n\nD.各売上高利益率は、同一企業内で時系列で比較して用いる以外にも、同一の業界内で他社と比較して用いることも有益である。例えば売上高総利益率は、同一の業界内でも差が付きやすい項目のため、競合他社と比較することで、自社の営業力や商品の品質が高いかを確認することができる。また、売上高営業利益率は企業のマーケティング戦略などの相違を見ることができる。","answer":"■正解：D\n\n■解説：\n\nDが誤り。\n\n業種によって差があるが、売上高総利益率は取り扱う商品・サービスにより異なり、同一の業界内では一般に大きな相違はない。また、同一企業内でも製品や部門ごとに計算することが比較的容易なため、セグメント情報に使われることが多い。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n13.収益性分析 P.116-117","source":"Excel: GMAP道場問題秋春(2).xlsx","no":133,"idx":133},{"id":"xlsx-2025秋-アカウンティング-14","season":"2025秋","subject":"アカウンティング","scope":"14. 安全性分析","question":"出題範囲：14. 安全性分析\n　\n■問14.安全性分析に関する記述として、誤っているものをすべて選択してください。\n　\nA.自己資本比率は「自己資本／(負債＋純資産)」で表される。この数値が大きいほど企業の安定度が高く、業績が悪化しても債務超過を避けるだけの抵抗力があると言える。\n　\nB.流動比率は「流動負債／流動資産」で表される。この比率は150%~200%程度が望ましいと言われている。\n　\nC.固定比率は「固定資産／純資産」で表される。この比率は100%以下であるのが望ましいが、現実には製造業で120%程度となっている。\n　\nD.インタレスト・カバレッジ・レシオは「営業利益／支払利息」で表される。事業利益が支払うべき金利の何倍あるか、という金利支払能力を示す数値であり、製造業平均で18倍と言われている。","answer":"■正解：BとDが誤り\n　\n　\n■解説：\n\nA:正しい\n\n現在、日本の製造業平均の自己資本比率の平均はおおむね40%前後と言われている。\n\nB:誤り\n\n流動比率は「流動資産／流動負債」で表される。短期間(1年以内)に返済する必要のある負債は、同じく短期間(1年以内)に現金化される資産で賄われる必要がある。\n\nC:正しい\n\n固定比率は固定資産の調達がどれだけ純資産によって賄われているかを示す。\n\nD:誤り\n\n事業利益 ＝（営業利益＋金融収益）であることから、インタレスト・カバレッジ・レシオは「（営業利益＋金融収益）／支払利息」で表わされる。\n　\n■出典：グロービス マネジメントブック 改訂3版","source":"Excel: GMAP道場問題秋春(2).xlsx","no":134,"idx":134},{"id":"xlsx-2025秋-アカウンティング-15","season":"2025秋","subject":"アカウンティング","scope":"15. 株式市場が企業を評価する批評","question":"2025年9月26日（金）＜アカウンティング＞\n\n出題範囲：15. 株式市場が企業を評価する批評\n\n■問15. 株式市場が企業を評価する批評について、誤っているものを選択してください。\n\nA.時価総額(発行済み株式数×株価)とは、株主資本(当該企業の株主の持分)の総額を簿価で表したものだ。ファイナンスでは株主資本価値と呼ばれる。M＆Aのときに注目される指標でもある。\n\nB.配当性向(配当金総額/税引後当期純利益)とは、利益のうち配当にどれだけの比率を振り向けているかを示す指標だ。投資家にとっては通常、配当性向はある程度低いほうが好ましい。配当金が高くなることに加えて、余剰利益がそれだけ多い、すなわち財務状況が健全であることを意味するからだ。\n\nC.EPS(Earnings per Share：1株当たり利益)とは、企業の利益を1株あたりに換算して、収益性を見るための指標だ。EPSを算出するときは、分子には債権者に利息を返す前の株主に分配すべき利益という意味で、税引前当期純利益が用いられる。\n\nD.PER(Price Earnings Ratio：株価収益率)とは、株価と1株当たりの利益(EPS)の比率を表す指標だ。株価がEPSで示された利益の何年分かという尺度で評価していることになる。株式市場では、業種や発展段階に応じて、その時々の適正なPER水準に関するコンセンサスがある。\n\nE.PBR(Price to Book Ratio：株価純資産倍率)とは、株価と1株当たりの純資産の比率を表す指標だ。1株当たりの純資産とは「総資産-負債総額」を株数で割った値のことだ。PBRの高い企業は、株式市場がその企業に対して、簿価以上の価値を見出していることを意味する。","answer":"■正解：A,B,Cが誤り\n\n■解説：\nA.誤り\n時価総額(発行済み株式数×株価)とは、株主資本(当該企業の株主の持分)の総額を時価で表したものだ。ファイナンスでは株主資本価値と呼ばれる。M＆Aのときに注目される指標でもある。\n\nB.誤り\n配当性向(配当金総額/税引後当期純利益)とは、利益のうち配当にどれだけの比率を振り向けているかを示す指標だ。投資家にとっては通常、配当性向はある程度高いほうが好ましい。配当金が高くなることに加えて、余剰利益がそれだけ多い、すなわち財務状況が健全であることを意味するからだ。\n\nC.誤り\nEPS(Earnings per Share：1株当たり利益)とは、企業の利益を1株あたりに換算して、収益性を見るための指標だ。EPSを算出するときは、分子には債権者に利息を返した後の株主に分配すべき利益という意味で、税引後当期純利益が用いられる。\n\nD.正しい\nE.正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n\n15.株式市場が企業を評価する指標 P.120-121","source":"Excel: GMAP道場問題秋春(2).xlsx","no":135,"idx":135},{"id":"xlsx-2025秋-アカウンティング-16","season":"2025秋","subject":"アカウンティング","scope":"16.たな卸資産","question":"出題範囲：16.たな卸資産\n\n■問16たな卸資産の評価方法の説明として、誤っているものを1つ選択してください。\n\nA.先入先出法：たな卸資産に加わった古い順から販売（払い出し）していくと仮定した方法で、コストも販売単価も上昇している時期には「現在の販売価格（高い）－昔の原価（安い）＝営業利益（大きい）」となるため、結果として利益が大きく計上されることが多い。\n\nB.後入先出法：最新の仕入在庫から順に販売していくと仮定した方法で、売上総利益は常に最新の状況を示すこととなり、会計上の利益は小さくなることが多い。逆に、貸借対照表上のたな卸資産は昔の簿価で計上されるため、これが積み重なると在庫の金額（簿価）は現在の状況（価格）を反映しているとは言い難くなる。\n\nC.平均法：個別の仕入（製造）原価に注目せず、1期間の期首在庫を含めた総仕入金額と総仕入数量からその期の平均単価（簿価）を算出し、その期中に販売されたすべての製品についてその価格（簿価）を原価とする移動平均法と、仕入れのたびに平均単価を算出し直し、払出原価を算出する総平均法がある。","answer":"■正解：C\n\n■解説：\n\n移動平均法と総平均法の説明が逆である。\n\n【正】\n\n1期間の期首在庫を含めた総仕入金額と総仕入数量からその期の平均単価（簿価）を算出し、その期中に販売されたすべての製品についてその価格（簿価）を原価とする総平均法と、仕入れのたびに平均単価を算出し直し、払出原価を算出する移動平均法がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16.たな卸資産　P.122-123","source":"Excel: GMAP道場問題秋春(2).xlsx","no":136,"idx":136},{"id":"xlsx-2025秋-アカウンティング-17","season":"2025秋","subject":"アカウンティング","scope":"17. 減価償却と固定資産","question":"出題範囲： 17. 減価償却と固定資産\n　\n■問17. 減価償却と固定資産に関する記述として、誤っているものを全て選択してください。\n\nA. 設備は後年度ほど収益力が衰え、修繕費も増加する。そのため、減価償却費を定額法で計上した場合、後年度の費用負担が過大となる。\n\nB. 設備投資が多いときは償却費の負担が過大となるが、減価償却費を定率法で計上した場合、費用の配分を毎期均等化することができる。\n\nC. これまでの日本の大部分の製造業は、競争力の向上や技術革新に遅れないようにするために定額法を採用してきた。一方で、今後の低成長時代を考え、営業利益を確保するために、定額法から定率法に変更する企業も数多く見られる。\n\nD. 無形固定資産も償却しなければならない。特許権、商標権などの法律上の権利である資産は、有形固定資産の減価償却と同様の償却を行う。ただし、一般的には定額法により、残存価値ゼロで償却される。","answer":"■回答：B・C　が誤り\n\n　\n■解説：\n\nA. 正しい\n\nB. 定率法は、設備投資が多い場合に当初の償却費の負担が過大となり、費用の配分が毎期均等化しないという短所がある。なお定率法とは、固定資産の耐用期間中、毎期期首償却残高に一定率を乗じた減価償却費を計上する方法である。\n\nC. これまでの日本の大部分の製造業は、定率法を採用してきた。その理由は、物理的な設備寿命以上のスピードで償却を進め、そこで得た資金を再投資につぎ込むためである。一方で、低成長時代において、営業利益を確保するために定率法から定額法に変更する企業が多く見られつつある。\n\nD. 正しい\n\n　\n■出典：グロービス マネジメントブック 改訂3版\n\n17.　減価償却と固定資産 P.124-125","source":"Excel: GMAP道場問題秋春(2).xlsx","no":137,"idx":137},{"id":"xlsx-2025秋-アカウンティング-18","season":"2025秋","subject":"アカウンティング","scope":"18.損益分岐点分析","question":"出題範囲：18.損益分岐点分析\n\n■問18.企業A~C社の損益分岐点売上高を計算し、小さい順に並べよ。\n\nただし、限界利益率＝1-変動費率","answer":"■正解：\n\nC→A→B\n\n■解説：\n損益分岐点売上高＝固定費÷限界利益率\n限界利益率＝1-(変動費÷売上高)＝1-変動費率\n*変動費率＝変動費÷売上高\nA社：武田薬品工業\n固定費: 220 (100億円単位)\n変動費率: 30%（0.30）\n限界利益率=(1 - 0.30)\n損益分岐点売上高 = 220 ÷ (1 - 0.30) = 314.3\nB社：トヨタ自動車\n固定費: 775 (100億円単位)\n変動費率: 75%（0.75）\n限界利益率=(1 - 0.75)\n損益分岐点売上高 = 775 ÷ (1 - 0.75) = 3100\nC社：ユニクロ\n固定費: 90 (100億円単位)\n変動費率: 50%（0.50）\n限界利益率=(1 - 0.50)\n損益分岐点売上高 = 90 ÷ (1 - 0.50) = 180\n*2024年3月期または2023年8月期の決算情報を基に筆者が作成。\n■出典：グロービス マネジメントブック 改訂3版\n18.損益分岐点分析 P.126-127","source":"Excel: GMAP道場問題秋春(2).xlsx","no":138,"idx":138},{"id":"xlsx-2025秋-アカウンティング-19","season":"2025秋","subject":"アカウンティング","scope":"","question":"■問19当社は商品Ｘと商品Ｙを販売している。\n\n以下の資料に基づきそれぞれ１ヶあたりに配賦する間接費として正しいものを選択してください。\n\n但し計算方法は活動基準原価計算（ABC)として配賦するものとし、配賦基準となるアクテビィティドライバーは対象製品の営業訪問回数とします。\n\n　　　　　　　　製品Ｘ｜　製品Ｙ\n\n販売数量（ヶ）　　1,000｜　1,000\n\n訪問回数（回）　　　 10｜　　30\n\n間接費用合計：100万円（1,000千円）\n\nA.　Ｘ：250円　Ｙ：7500円\n\nB.　Ｘ：250円　Ｙ：750円\n\nC.　Ｘ：350円　Ｙ：5000円\n\nD.　Ｘ：250円　Ｙ：500円","answer":"■正解：Ｂ\n\n■解説：\n\nＢ　活動基準原価計算（ABC)においては間接費用は活動発生回数などのアクティビティドライバーにより配賦されます。\n\n100万円（1,000千円）を訪問回数合計40回で割ると１回あたりは25千円/回になります。\n\nそのため、訪問回数をそれぞれかけると\n\nＸ：25千円×10回＝250千円\n\nＹ：25千円×30回＝750千円\n\nの間接費用が配賦されます。\n\nそれぞれの販売数量（1,000個）で割ると、1個あたりの間接費は\n\nＸ：250円　Ｙ：750円となります。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n19.原価計算 P.128-129","source":"Excel: GMAP道場問題秋春(2).xlsx","no":139,"idx":139},{"id":"xlsx-2025秋-アカウンティング-20","season":"2025秋","subject":"アカウンティング","scope":"20. マネジメント・コントロール","question":"出題範囲：20. マネジメント・コントロール\n\n■問20.次の文の空欄（①～⑥）に当てはまる正しい語句の組み合わせを、下の選択肢A～Dからひとつ選んでください。\n\nマネジメント・コントロールとは、（①）化した組織を全社目標達成に向けて効果的に業務遂行させるための役割である。そのプロセスは、1,部門別実行計画策定、2,経営資源配分計画策定、3,（②）、4,実績分析・業績評価・（③）の4段階から成る。\n\nまた、管理責任単位（業績評価単位)には（④）・センターと（⑤）・センターが多用され、さらにBSC（Balanced Scorecard)では「財務」「⑥」「内部ビジネスプロセス」「学習と成長」の4つの視点から指標が設定される。\n\nA. ① 分権　② 予算編成　③ 報告　④ コスト　⑤ プロフィット　⑥ 顧客\n\nB. ① 中央集権　② 戦略策定　③ 公表　④ コスト　⑤ 投資　⑥ 従業員\n\nC. ① 分権　② 実行計画　③ 評価　④ コスト　⑤ プロフィット　⑥ 株主\n\nD. ① 専門　② 原価計算　③ 分析　④ コスト　⑤ 利益　⑥ 顧客","answer":"■正解：A\n\n■解説：\n\n②③マネジメント・コントロールのプロセスは4段階：\n\n部門別実行計画策定、経営資源配分計画策定、予算編成（バジェッティング）、実績分析・業績評価・報告（レポーティング）\n\n④コスト・センター：工場や管理部門など、コストのみ責任を負う。⑤プロフィット・センター：営業部や事業部門など、利益責任を負う。\n\nBSC（Balanced Scorecard)は「財務」「顧客」「内部ビジネスプロセス」「学習と成長」の4つの視点から指標が設定される。\n\n■出典：グロービス マネジメントブック 改訂3版\n\nマネジメント・コントロール　P.130-131","source":"Excel: GMAP道場問題秋春(2).xlsx","no":140,"idx":140},{"id":"xlsx-2025秋-アカウンティング-21","season":"2025秋","subject":"アカウンティング","scope":"","question":"■問21\n\n①〜④に入る言葉をA〜Dから1つずつ選んでください\n\n内部統制は、\n\n業務の（①）、財務報告の（②）、事業活動に関わる法令などの（③）、資産の（④）の大きく4つの目的を有する\n\nA 信頼性\n\nB 保全\n\nC 有効性および効率性\n\nD 遵守","answer":"■正解：①-C ②-A ③-D ④-B\n\n■解説：\n\n日本版SOX法における内部統制の目的について\n\nCOSOのフレームワーク（SOX法のベースとなったもの）に基づくもの\n\n１業務の有効性および効率性　２財務報告の信頼性　３事業活動に関わる法令などの遵守\n\n日本独自に付加されたもの\n\n４資産の保全\n\n■出典：グロービス マネジメントブック 改訂3版\n\n21.内部統制P.132-133","source":"Excel: GMAP道場問題秋春(2).xlsx","no":141,"idx":141},{"id":"xlsx-2025秋-アカウンティング-22","season":"2025秋","subject":"アカウンティング","scope":"5.損益計算書","question":"出題範囲：5.損益計算書\n　\n■問22.あるメーカーの収益・費用について下記の数値がわかっているとき、①売上総利益　②営業利益　③当期純利益　がそれぞれいくらになるか求めよ。\n\nこれ以外の費用は発生していないものとし、営業外損益、特別損益及び少数株主利益は考慮しなくて良い。\n　\n売上高：20,000\n\n人件費（営業担当者）：2,000\n\n労務費（製造ライン）：5,000\n\n広告宣伝費：1,000\n\n原材料費：10,000\n\n法人税率：40％","answer":"■正解：\n\n①売上総利益：5,000\n②営業利益：2,000\n③当期純利益：1,200\n　\n■解説：\n①売上総利益＝売上高－売上原価\n製造業においては、製品の原材料や部品などの代金、製造ラインの担当者の人件費である労務費や機械の減価償却費、電気代等が売上原価となる。\n本問では「労務費（製造ライン）」と「原材料費」が売上原価に当たり、\n20,000-10,000-5,000＝5,000が売上総利益。\n②営業利益＝売上総利益－販売費および一般管理費\n販売費は営業担当者の人件費や広告宣伝費等の販売に関わる費用。一般管理費は本社建物の減価償却費等の管理に関わる費用。\n本問では「人件費（営業担当者）」と「広告宣伝費」が販売費および一般管理費に当たり、\n5,000-2,000-1,000＝2,000が営業利益。\n③当期純利益＝税金等調整前当期純利益－法人税、住民税および事業税ー少数株主利益（営業利益－営業外損益＝経常利益、経常利益ー特別損益＝税金等調整前当期純利益）\n本問では営業外損益及び特別損益が発生しないこととしているため、営業利益から法人税を差し引いたものが当期純利益となる。\n法人税率40％より、\n2,000×（1-0.4）＝1,200が当期純利益。\n■出典：グロービス マネジメントブック 改訂3版 　\n5.損益計算書　P.100-101","source":"Excel: GMAP道場問題秋春(2).xlsx","no":142,"idx":142},{"id":"xlsx-2025秋-アカウンティング-23","season":"2025秋","subject":"アカウンティング","scope":"6.貸借対照表（資産）","question":"出題範囲：6.貸借対照表（資産）\n\n■問23.貸借対照表の資産の部は、企業が保有する資金の具体的形態を示すもので、将来収益を生むための経営資源を表すものです。以下のうち、資産について、誤っているものを全て選んでください。\n\nA.流動資産は主に短期間（1年以内）に現金化しやすいもので、企業の支払能力の基準となる。そのうち、当座資産とは、既に現金化されている現金・預金を指す。\n\nB.固定資産は主に１年以内に費用化または現金化しないものをいう。そのうち、有形固定資産とは、建物・機械・土地などを指し、事業で使用するにつれて価値が減少し、いずれは使えなくなるため、減価償却される。\n\nC.固定資産のうち、投資その他資産は、財務活動によって生じる資産で、投資有価証券、長期貸付金などが該当する。なお、子会社・関連会社の株式は投資目的ではないので固定資産には含まない。\n\nD.繰延資産は固定資産と同じく短期に費用化できない資産で、一時的に資産として計上し、徐々に費用化していく。社債発行差金や研究開発費などを繰延資産として計上する場合がある。","answer":"■正解：Ａ，Ｂ，Ｃ\n\n■解説：\n\nＡ：誤り。当座資産は、売掛金・受取手形など、現金に近い形の資産を含む。\n\nＢ：誤り。土地は時の経過に伴って価値が減少しないため、有形固定資産のうち、非償却資産である。ほかには建物仮勘定が非償却資産に該当する。\n\nＣ：誤り。子会社・関連会社の株式など、支配することを目的として長期に保有する資産も、投資その他資産に含む。\n\nＤ：記載の通り。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n6.貸借対照表（資産） P.102-103","source":"Excel: GMAP道場問題秋春(2).xlsx","no":143,"idx":143},{"id":"xlsx-2025秋-アカウンティング-24","season":"2025秋","subject":"アカウンティング","scope":"7. 貸借対照表（負債＋純資産）","question":"出題範囲：7. 貸借対照表（負債＋純資産）\n　\n■問24.純資産に関する記述として、誤っているものをすべて選択してください。\n　\nA.純資産とは、投資家から集めた出資金と過去の利益を蓄積した株主資本のほか、評価・換算差額等、新株予約権、少数株主持分の4つに分類される。\n　\nB.株主資本とは、株主が企業に拠出した資金と過去の利益の蓄積分である。前者は資本金、資本剰余金、自己株式であり、財務活動に対応する。後者は利益剰余金であり、営業活動に対応する。\n　\nC.評価・換算差額等とは、土地や有価証券といった資産の時価評価や為替変動に起因する純資産の増減額である。\n　\nD.新株予約権とは、新株予約権を有する者が、会社に対してこの権利を行使した場合、特定の価格で株式を売却できる権利である。\n\nE.少数株主持分とは、連結対象となる子会社の資産や負債を親会社のB/Sに合算する際に、子会社の純資産のうち、持ち株比率に応じて親会社の株主に帰属する部分である。","answer":"■正解：DとEが誤り\n\n■解説：\nA:正しい\nB:正しい\nC:正しい\nD:誤り　\n\n　新株予約権とは、新株予約権を有する者が、会社に対してこの権利を行使した場合、特定の価格で株式を購入できる権利である。\n\nE:誤り \n\n　少数株主持分とは、連結対象となる子会社の資産や負債を親会社のB/Sに合算する際に、子会社の純資産のうち、持ち株比率に応じて親会社以外の株主（少数株主）に帰属する部分である。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n7.貸借対照表（負債＋純資産）　 P.104-105","source":"Excel: GMAP道場問題秋春(2).xlsx","no":144,"idx":144},{"id":"xlsx-2025秋-アカウンティング-25","season":"2025秋","subject":"アカウンティング","scope":"8. キャッシュフロー計算書","question":"出題範囲：8. キャッシュフロー計算書\n\n■問25.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n・企業活動を継続させるには、企業の営業成績のみならず、流動性(資金繰り)と現金収支の状況を把握しておく必要がある。営業活動・投資活動・財務活動について各期の（　①　）の増減を整理したのがキャッシュフロー計算書だ。\n\n・（　②　）によって生じるキャッシュフローを把握するには、直接法と間接法がある。直接法では、営業活動から生じる現金の入金と支出を直接算出する。間接法は、当期純利益の数字に減価償却費を加え、さらに貸借対照表上の各項目の増減を加えて機械的に現金の増減を算出する。\n\n・（　③　）から生じるキャッシュフローでは、通常の営業活動以外の部分、すなわち設備投資の実施、廃棄、固定資産の取得・売却などに伴う現金の増減を把握する。\n\n・（　④　）から生じるキャッシュフローでは、直接の営業活動とは結び付かない企業の財務活動、すなわち銀行借入れ、社債発行や株式発行による資金調達、配当支払いや減資などによる現金の増減を計算する。\n\nA. ①税金　②営業活動　③財務活動　④投資活動\n\nB. ①株価　②財務活動　③投資活動　④営業活動\n\nC. ①現金　②営業活動　③投資活動　④財務活動\n\nD. ①借入金　②投資活動　③営業活動　④財務活動","answer":"■正解：C\n\n■解説：\n\n・企業活動を継続させるには、企業の営業成績のみならず、流動性(資金繰り)と現金収支の状況を把握しておく必要がある。営業活動・投資活動・財務活動について各期の（①現金）の増減を整理したのがキャッシュフロー計算書だ。\n\n・（②営業活動）によって生じるキャッシュフローを把握するには、直接法と間接法がある。直接法では、営業活動から生じる現金の入金と支出を直接算出する。間接法は、当期純利益の数字に減価償却費を加え、さらに貸借対照表上の各項目の増減を加えて機械的に現金の増減を算出する。\n\n・（③投資活動）から生じるキャッシュフローでは、通常の営業活動以外の部分、すなわち設備投資の実施、廃棄、固定資産の取得・売却などに伴う現金の増減を把握する。\n\n・（④財務活動）から生じるキャッシュフローでは、直接の営業活動とは結び付かない企業の財務活動、すなわち銀行借入れ、社債発行や株式発行による資金調達、配当支払いや減資などによる現金の増減を計算する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n8．キャッシュフロー計算書 P.106-107","source":"Excel: GMAP道場問題秋春(2).xlsx","no":145,"idx":145},{"id":"xlsx-2025秋-アカウンティング-26","season":"2025秋","subject":"アカウンティング","scope":"12. 総合力分析：ROAとROE","question":"出題範囲：12. 総合力分析：ROAとROE　\n\n■問26. A〜Eに示す各指標を算出してください。（計算の答えは小数点第二位を四捨五入してください）\n\n2025年\n\n売上高　　　　　　：10,000\n\n売上総利益　　　　：2,500\n\n営業利益　　　　　：1,000\n\n当期純利益　　　　：500\n\n総資産　　　　　　：8,000\n\n流動負債　　　　　：3,000\n\n固定負債　　　　　：1,000\n\nA.　売上高当期純利益率(%)\n\nB.　総資産回転率(回)\n\nC.　財務レバレッジ\n\nD.　ROE(%)\n\nE.　ROA(%)\n\n✽","answer":"■正解：\n\nA.　売上高当期純利益率：5%\nB.　総資産回転率：1.25回\nC.　財務レバレッジ：2.0\nD.　ROE：12.5%\nE.　ROA：6.25%\n\n■解説：\n売上高当期純利益率(%)：当期純利益(500)÷売上高(10,000)\n総資産回転率(回)：売上高(10,000)÷総資産(8,000)\n財務レバレッジ：総資産(8,000)÷自己資本(総資産8,000-流動負債3,000-固定負債1,000)\n\nROE(%)：当期純利益(500)÷自己資本(4,000)\n　　　 　 別解：売上高当期純利益率×総資産回転率×財務レバレッジ\nROA(%)：当期純利益(500)÷総資産(8,000)\n　　　      別解：売上高当期純利益率×総資産回転率\n■出典：グロービス マネジメントブック 改訂3版 　\n\n12.総合力分析：ROAとROE　P.114-115","source":"Excel: GMAP道場問題秋春(2).xlsx","no":146,"idx":146},{"id":"xlsx-2025秋-アカウンティング-27","season":"2025秋","subject":"アカウンティング","scope":"16. たな卸資産","question":"出題範囲： 16. たな卸資産\n　\n■問27. たな卸資産の評価基準に関する記述として、誤っているものを全て選択してください。\n\nA. 原価法とは、たな卸資産を取得原価で評価する方法である。\n\nB. 時価が取得原価（簿価）より著しく下落した時には、回復する見込みがある場合を除き、原価法を採用している場合でも、強制的に時価を評価額としなければならない。\n\nC. 低価法とは、期首と期末の時価を比較していずれかが低いほうの価格で評価する方法であり、価値を堅く見積もる保守主義に基づく。\n\nD. 日本では、以前は原価法が義務付けられていたが、2008年から新たに「たな卸資産の評価に関する会計基準」が適用され、トレーディング目的以外の評価基準は原価法もしくは低価法のいずれかの採用が任意となった。","answer":"■回答：C・D　が誤り\n\n■解説：\n\nA. 正しい\n\nB. 正しい\n\nC. 低価法とは、時価と原価を比較していずれか低いほうの価格で評価する方法である。\n\nD. 日本では、以前は原価法と低価法のいずれを採用するかは任意だった。2008年から適用された「たな卸資産の評価に関する会計基準」は、国際的な会計ルールとの整合をとることを主眼に置いており、トレーディング目的以外の評価基準は低価法が義務付けられた。\n　\n■出典：グロービス マネジメントブック 改訂3版\n\n16.　たな卸資産 P.122-123","source":"Excel: GMAP道場問題秋春(2).xlsx","no":147,"idx":147},{"id":"xlsx-2025秋-アカウンティング-28","season":"2025秋","subject":"アカウンティング","scope":"17.減価償却と固定資産","question":"出題範囲：17.減価償却と固定資産\n\n■問28.減価償却の定率法の算出方法について、適切なのはどれか？\n\nA.（取得原価－残存価額）×（１÷耐用年数）\n\nB.（取得原価－減価償却費の累計額）×（１÷耐用年数）\n\nC.（取得原価－残存価額）×償却率\n\nD.（取得原価－減価償却費の累計額）×償却率","answer":"■正解：D\n\n■解説：\n\n定率法は償却の初期に多くの減価償却費を計上する方法である。\n\n減価償却費（定率法）＝（取得原価－減価償却費の累計額）×償却率\n\n定額法は減価償却費を各期間にわたって均等に計上する方法である。\n\n減価償却費（定額法）＝（取得原価－残存価額）×（１÷耐用年数）\n\n■出典：グロービス マネジメントブック 改訂3版\n\n17.減価償却と固定資産 P. 124-125","source":"Excel: GMAP道場問題秋春(2).xlsx","no":148,"idx":148},{"id":"xlsx-2025秋-アカウンティング-29","season":"2025秋","subject":"アカウンティング","scope":"18.損益分岐点分析","question":"出題範囲：18.損益分岐点分析\n\n■問29　下記のようなコスト構造の企業における、限界利益と損益分岐点売上高を計算してください。\n\n売上　：1,000\n\n変動費：500\n\n固定費：400","answer":"■正解：\n\n限界利益　　　　：500\n\n損益分岐点売上高：800\n\n■解説：\n\n✅ 限界利益：500\n\n（売上 1000 − 変動費 500）\n\n✅ 限界利益率：50%\n\n（限界利益 500 ÷ 売上 1000）\n\n✅ 損益分岐点売上高：800\n\n（固定費 400 ÷ 限界利益率 0.5）\n\n🧮 用語の補足\n\n固定費：売上に関係なく毎月かかる費用（例：家賃など）\n\n変動費：売上に応じて増減する費用（例：製造業の材料費、外注費など）\n\n■出典：グロービス マネジメントブック 改訂3版\n\n18.損益分岐点分析 P.126-127","source":"Excel: GMAP道場問題秋春(2).xlsx","no":149,"idx":149},{"id":"xlsx-2025秋-アカウンティング-30","season":"2025秋","subject":"アカウンティング","scope":"19. 原価計算","question":"出題範囲：19. 原価計算\n\n■問30.ある会社の年間間接費は次の通りです。\n調査活動費　：500,000円\n生産活動費　：1,200,000円\n管理活動費　：300,000円\n顧客サービス：200,000円\n合計：2,200,000円\n\n製品Aの売上高構成比は40%。また、会社全体に占める製品Aの活動消費割合はそれぞれ、調査50％、生産40％、管理30％、顧客サービス20％である。\n\n次の組合せのうち、\n（①）従来配賦（売上高基準）による製品Aの配賦額、\n（②）ABC（活動基準原価計算）による製品Aの配賦額、\n（③）差額（従来－ABC）\nの正しい組合せを選んでください。\n\nA. ① 880,000円　② 860,000円　③ 20,000円\nB. ① 880,000円　② 820,000円　③ 60,000円\nC. ① 900,000円　② 860,000円　③ 40,000円\nD. ① 820,000円　② 860,000円　③ 20,000円","answer":"■正解：\n\nA. ① 880,000円　② 860,000円　③ 20,000円\n\n■解説：\n\n従来配賦：2,200,000×40%＝880,000円\n\nABC配賦：\n\n500,000×0.50＝250,000\n\n1,200,000×0.40＝480,000\n\n300,000×0.30＝90,000\n\n200,000×0.20＝40,000\n\n合計＝860,000円\n\n差額（従来－ABC）：880,000－860,000＝20,000円\n\n■出典：グロービス マネジメントブック 改訂3版\n\n19．原価計算　 P.128-129","source":"Excel: GMAP道場問題秋春(2).xlsx","no":150,"idx":150},{"id":"xlsx-2025秋-ファイナンス-1","season":"2025秋","subject":"ファイナンス","scope":"1. 企業経営と企業財務","question":"出題範囲：1. 企業経営と企業財務　\n\n■問1. 企業経営と企業財務について、間違っているものを全て選択してください\n\nA.企業経営において財務の役割は、経営目標の実現（一般には企業価値の最大化）を目指し、どの投資対象にいくら投資するか、どのような手段で必要な資金を調達するか、を判断し実行することである。\n\nB.企業が投資や資金調達を行う際に、ファイナンス理論を踏まえていなければ、記録・報告ができない。\n\nC.企業は財務活動で得た資金を事業投資活動に充て、生み出された収益（キャッシュフロー）は、企業内で留保され再び事業投資に振り向けられるか、資金提供した投資家や銀行に還元される。\n\nD. 企業財務では経営目標の実現を目指して、企業の日々の事業活動を所定の規則に従って数字の形で表現し、記録・報告することで企業価値の最大化を図ろうとするので、企業の過去に重点が置かれる。","answer":"■正解：B,D\n\n■解説：\n\nB.企業が投資や資金調達を行う際に、ファイナンス理論を踏まえていなければ、『的確な意思決定』ができない。\n\nD.企業財務では、『今後の活動から生じるキャッシュフローを効率的に増加させるかを主眼』としているので、企業の『将来』に重点が置かれる。企業の日々の事業活動を所定の規則に従って数字の形で表現し、記録・報告するのは、企業会計の定義にあたる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n1.企業経営と企業財務 P.136-137","source":"Excel: GMAP道場問題秋春(2).xlsx","no":151,"idx":151},{"id":"xlsx-2025秋-ファイナンス-2","season":"2025秋","subject":"ファイナンス","scope":"2.ファイナンス理論の体系","question":"2025年9月13日（土）＜ファイナンス＞\n\n出題範囲：2.ファイナンス理論の体系\n\n■問02.ファイナンス理論の体系について、誤っているものを選択してください。\n\nA.ファイナンス理論は大きく、投資理論（インベストメント）と企業金融理論（コーポレート・ファイナンス）の2分野で構成されている。前者は金融市場からの資金調達に関する理論であり、後者は余剰資金の運用に関する理論である。\n\nB.投資理論では、投資家が投資した際のリスクと利回り（リターン）の関係や、投資対象資産の価値・価格が主要なテーマとなる。\n\nC.投資家に支払うコストとは、とりもなおさず投資家の期待利回りの裏返しなので、この部分は投資理論ときわめて密接に関係する。\n\nD.企業の価値について考えるときの前提になるのが、「企業価値は、将来その企業が生み出すと予想されるキャッシュフローを将来の価値に換算したものに等しい」という考え方だ。","answer":"■正解：A,D\n\n■解説：\n\nA.ファイナンス理論は大きく、投資理論（インベストメント）と企業金融理論（コーポレート・ファイナンス）の2分野で構成されている。前者は「余剰資金の運用」に関する理論であり、後者は「金融市場からの資金調達」に関する理論である。\n\nB.正しい。\n\nC.正しい。\n\nD.企業の価値について考えるときの前提になるのが、「企業価値は、将来その企業が生み出すと予想されるキャッシュフローを「現時点」の価値に換算したものに等しい」という考え方だ。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n2.ファイナンス理論の体系 P.138-139","source":"Excel: GMAP道場問題秋春(2).xlsx","no":152,"idx":152},{"id":"xlsx-2025秋-ファイナンス-3","season":"2025秋","subject":"ファイナンス","scope":"3.金銭の時間的価値：現在価値","question":"出題範囲：3.金銭の時間的価値：現在価値\n\n■問3.　1年後に年金として政府から100円を受け取るとする。金利2%の時、100円の現在価値は？\n\nA. 102.04円\n\nB. 100.00円\n\nC.   98.04円\n\nD.   96.12円","answer":"■正解：C\n\n■解説：\n\n将来受け取る金銭の、今日の時点での価値のことを「現在価値」と呼ぶ。n年後に受け取る現金Cの現在価値（PV）は、割引率（設問では金利）をrとすると、以下の式で表します。\n\nPV=C/(1+r)n\n\nそのため、今回のケースでは100円の現在価値は、100/(1+0.02) = 98.04円になります。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n3．金銭の時間的価値：現在価値 P.140-141","source":"Excel: GMAP道場問題秋春(2).xlsx","no":153,"idx":153},{"id":"xlsx-2025秋-ファイナンス-4","season":"2025秋","subject":"ファイナンス","scope":"","question":"■問4. 以下の文中の（1）〜（4）に当てはまる用語として最も適切な組み合わせを選べ。\n\n（1）法では、資産の価値をその資産が将来生み出すキャッシュフローの現在価値と定義する。\n\nある一定額の受け取りが特定期間続くキャッシュフローを（2）と呼び、社債の現在価値の計算など広範なものに適用される。\n\n一定額の受け取りが永久に続くキャッシュフローを（3）と呼ぶ。土地や耐用年数の十分に長い不動産などは、これを生み出すものとして資産価値を計算する。\n\n毎年の受取額がある一定の割合で永久に増えていくキャッシュフローを（4）と呼び、成長が著しい新興企業の企業価値の算定などに用いられる。\n\n選択肢\nA.（1）DCF（2）年金（3）割増永久年金（4）永久年金\nB.（1）DCF（2）年金（3）永久年金（4）割増永久年金\nC.（1）年金（2）DCF（3）永久年金（4）割増永久年金","answer":"■正解：B\n\n■解説：\n各キャッシュフローに対する説明は添付資料の通り\n\n■出典：グロービス マネジメントブック 改訂3版\n4.DCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":154,"idx":154},{"id":"xlsx-2025秋-ファイナンス-5","season":"2025秋","subject":"ファイナンス","scope":"5. 投資評価の様々な方法","question":"出題範囲：5. 投資評価の様々な方法\n\n■問5. NPV法による投資評価を行う際のステップを正しい順番に並べなさい。\n\nA. NPVを計算する\n\nB. キャッシュフローの現在価値を計算する\n\nC. 投資により生み出されるキャッシュフローを予測する\n\nD. NPVが正（NPV＞０）ならば投資を行い、負（NPV＜０）ならば投資しない","answer":"■正解：C→B→A→D\n\n■解説：\n\nNPV法では、投資により生み出されるキャッシュフローの現在価値（PV）と初期投資額を比較することで、その投資を評価する。金銭の時間的価値やリスクなどのファイナンス理論に基づいており、最も望ましい評価手法と言える。\n\nNPV法では、NPVがプラスなら投資を行い、マイナスなら投資しない判断をする。\n\nNPVを算定する際、WACC（割引率）が大きくなればなるほど、NPVの値は小さくなる。\n\nまた、NPV=0となる割引率がIRR(内部収益率)である。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n5．投資評価の様々な方法 P144-145","source":"Excel: GMAP道場問題秋春(2).xlsx","no":155,"idx":155},{"id":"xlsx-2025秋-ファイナンス-6","season":"2025秋","subject":"ファイナンス","scope":"","question":"■問6.次のケースの金銭的価値について、正しいものを選んでください　\n\n土地の貸付収入が年間１５０万円、維持管理費５０万円で、キャッシュフローの成長率５％、割引率１０％となる土地の価値はいくらになるか計算してください　\n\nA：３,１５０万円　\n\nB：２,１００万円　\n\nC：１,５００万円　\n\nD：１,０００万円","answer":"■正解 B：２,１００万円　\n■解説：　\n割増永久年金　\n毎年の受取額がある一定の割合で永久に増えていくキャッシュフローを割増永久年金と呼ぶ。１年目の受取額をＣＦ１、キャッシュフローの成長率をｇ、割引率をｒとすると、割増永久年金法の現在価値は以下となる　\nＰＶ　＝　ＣＦ×（１＋ｇ）／（ｒ－ｇ）　\nＰＶ　＝　（１５０－５０）×（１＋５％）／（１０％－５％）　\n　　　＝　２,１００万円　\n\n答え．Ｂ：２,１００万円が正解　\n\n補足：ＣＦ１の計算　\nＣＦ１　＝　ＣＦ×（１＋ｇ）　\nちなみに、　\n割増永久年金の成長率ｇが０％の場合、ただの永久年金となる　\nＰＶ　＝　ＣＦ×（１＋ｇ）／（ｒ－ｇ）　・・・割増永久年金の公式　\nＰＶ　＝　ＣＦ×（１＋０％）／（ｒ－０％）　\n　　　＝　ＣＦ／ｒ　　　　　　　　　　　・・・永久年金の公式　\n　\n■出典：グロービス マネジメントブック 改訂3版　\n\n4．DCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":156,"idx":156},{"id":"xlsx-2025秋-ファイナンス-7","season":"2025秋","subject":"ファイナンス","scope":"6.分散投資の効果(1)：ポートフォリオ理論","question":"2025年9月13日（土）＜ファイナンス＞\n\n出題範囲：6.分散投資の効果(1)：ポートフォリオ理論\n\n■問7.下記文章の中から、正しいものを全て選択してください。\n\nA.投資のリスクは、利回りのばらつきであり、利回りの分布の標準偏差によって数値化できる。\n\nB.多数の資産に分散投資することを「ポートフォリオを組む」と言う。ポートフォリオ全体のリスクは、標準偏差を構成比で加重平均したものである。\n\nC.株式Ｐは、収益率が10%になる確率が40%、収益率が5%になる確率が30%、株価が変化しない確率が30%である。株式Ｐの期待利回りは、（収益率10%×確率40％）＋（収益率5%×確率30％）+（収益率0%×確率30％）　で計算できる。\n\nD.投資のリスクを低減するポイントは、投資対象を分散させることと、値動きの相関係数が大きいものを組み合わせることである。","answer":"■正解：AとC\n\n■解説：\n\nA：正しい\n\nB：ポートフォリオ全体のリスクは、標準偏差を単純の構成比で加重平均したものとはならない。構成する資産の利回りが、互いにどれくらい関係して変動するかを示す相関係数がポートフォリオ全体のリスクに影響を与える。\n\nC：正しい\n\n（収益率10%×確率40％）＋（収益率5%×確率30％）+（収益率0%×確率30％）＝　5.5%\n\nD：相関係数は「－１」～「＋１」の値を取り、相関係数が小さいほど（－１に近づくほど）リスク低減効果が大きくなる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n6.分散投資の効果(1)：ポートフォリオ理論 P.146-147","source":"Excel: GMAP道場問題秋春(2).xlsx","no":157,"idx":157},{"id":"xlsx-2025秋-ファイナンス-8","season":"2025秋","subject":"ファイナンス","scope":"7. 分散投資の効果（２）：効率的フロンティアと資本市場線","question":"出題範囲：7. 分散投資の効果（２）：効率的フロンティアと資本市場線\n\n■問08. 分散投資の効果に関する考え方について、誤っているものをすべて選択してください。\n\nA.複数のリスク資産からなるポートフォリオで、資産の数を増やしていくとポートフォリオ全体のリスクは低減されていくが、ある一定の値以下には下がることはない。\n\nB.資産の数を増やすことで低減されるリスクをシステマティック・リスクといい、景気などすべての資産に影響を与える原因により発生する。資産の数を増やしても除去できないリスクをアンシステマティック・リスクといい、個別資産に固有の原因により発生する。\n\nC.投資家は、同じリスクであればより大きい利回りを期待できるポートフォリオを好むことから、効率的フロンティア線上にあるポートフォリオのいずれかを保有するとされる\n\nD.一定期間保有すれば一定の利回りがあらかじめ保証されている資産、いわゆる「無リスク資産」は現実的には存在しないため、マーケットポートフォリオ上の資産の組み合わせで保有することが望ましい。","answer":"■正解：BとD\n\n■解説：\n\nB：資産の数を増やすことで低減されるリスクは、アンシステマティック・リスク（ユニークリスクや分散可能なリスクとも言われる）と言い、個別資産に固有の原因により発生する。一方、資産の数を増やしても除去できないリスクをシステマティック・リスク（マーケット・リスクや分散不能なリスクとも言われる）と言い、景気などすべての資産に影響を与える原因により発生する。\n\nD：国債のように満期まで保有すれば一定の利回りがあらかじめ保証されている資産、すなわちリスクのない資産「無リスク資産」が存在する。\n\nA：正しい\n\nC：正しい\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n     7.分散投資の効果（２）：効率的フロンティアと資本市場線 P.148-149","source":"Excel: GMAP道場問題秋春(2).xlsx","no":158,"idx":158},{"id":"xlsx-2025秋-ファイナンス-9","season":"2025秋","subject":"ファイナンス","scope":"8.分散投資の効果(3)：CAPM(資本資産価格モデル)","question":"出題範囲：8.分散投資の効果(3)：CAPM(資本資産価格モデル)\n\n■問9. CAPM（資本資産価格モデル）は、株式などの個別銘柄の期待利回りを計算するときに実務で広く使われている。下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n個別資産の期待利回り　＝　（①）の利回り　＋\n\n（②）×（（③）の期待利回り―（①）の利回り）\n\nA. ①無リスク資産　②β　③マーケット・ポートフォリオ\n\nB. ①マーケット・ポートフォリオ　②β　③無リスク資産\n\nC. ①個別資産　②β　③マーケット・リスク・プレミアム\n\nD. ①β　②個別資産　③マーケット・リスク・プレミアム","answer":"■正解：A\n\n■解説：\n\n・個別資産の期待利回り　＝　無リスク資産の利回り　＋　β　×（マーケット・ポートフォリオの期待利回り―無リスク資産の利回り）\n\n・マーケット・リスク・プレミアムを推定する際には、過去のマーケット・ポートフォリオの近似のポートフォリオ（たとえばTOPIX）の利回り実績と国債の利回り実績との差を使うことが多い。\n\n・βは個別資産の市場全体（マーケット・ポートフォリオ）に対する感応度である 。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n8.分散投資の効果(3)：CAPM(資本資産価格モデル) P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":159,"idx":159},{"id":"xlsx-2025秋-ファイナンス-10","season":"2025秋","subject":"ファイナンス","scope":"8.分散投資の効果（3）：CAPM（資本資産価格モデル）_ 計算問題（CAPM）","question":"出題範囲：8.分散投資の効果（3）：CAPM（資本資産価格モデル）_ 計算問題（CAPM）\n\n■問10. 国債の利回りが2.0%、マーケット・リスクプレミアムが3.0%である場合、β=1.5の資産（株式）の期待利回りとして正しいものをA〜Dの中から選択してください。\n\nA：0.1%\n\nB：2.5%\n\nC：6.0%\n\nD：6.5%","answer":"■正解：D\n\n■解説：個別資産の期待利回り＝無リスク資産の利回り＋β×（マーケット・ポートフォリオの期待利回り－無リスク資産の利回り）\n\n期待利回り＝2.0%＋1.5×3.0% = 6.5%\n\n・マーケット・リスク・プレミアム：マーケット・ポートフォリオの期待利回りと無リスク資産の利回りとの差のこと。\n\n・CAPM：資産へ投資することのリスクと期待利回りの関係を定量化するモデル。個別資産のリスクはβで表され、マーケット・リスクプレミアムと無リスク資産利回りから、個別リスク資産の期待利回りが求められる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n8.分散投資の効果（3）：CAPM（資本資産価格モデル） P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":160,"idx":160},{"id":"xlsx-2025秋-ファイナンス-11","season":"2025秋","subject":"ファイナンス","scope":"1. 経営戦略の意義と企業の目的","question":"出題範囲：1. 経営戦略の意義と企業の目的\n\n■問11.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n一般に企業の資金調達は大きく2つに分類されている。それは（①）と（②）である。\n\n（①）には社外の仕入れ先から、現金決済を一定期間猶予してもらうという形で資金を調達している買掛金や支払手形（③）。\n\nまた、いったん調達された（②）は、企業が存在する限り原則的に返済されることはない。企業が倒産した際には、（①）の返済が優先される。\n\nA. ①負債　②株主資本　③も含む\n\nB. ①株主資本　②負債　③も含む\n\nC. ①株主資本　②負債　③を含まない\n\nD. ①負債　②株主資本　③を含まない","answer":"■正解：A\n\n■解説：\n\n・企業の資金調達は大きく負債と株主資本に分類されます。\n\n・負債は企業が株主以外の外部の関係者に対して負っている債務の総称であり、このことから外部資本とか他人資本と呼ばれることもあります。負債は借入れのみだけでなく買掛金や支払手形も含みます。\n\n・株主資本は資本金、法定準備金、剰余金（内部留保）を含み、株主に帰属するべき持ち分の総称です。いったん調達された株主資本は、企業が存在する限り原則的に返済されることはありません。企業が倒産した際には、負債の返済が優先されます。また、株主に対しては、配当という形での利益還元が為されますが、負債の対価としての金利に比べ、企業は業績に応じて弾力的に配当額を決定できます。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n9．企業の資金調達手段 (p.152-153）","source":"Excel: GMAP道場問題秋春(2).xlsx","no":161,"idx":161},{"id":"xlsx-2025秋-ファイナンス-12","season":"2025秋","subject":"ファイナンス","scope":"10.資本コスト","question":"出題範囲：10.資本コスト\n\n■問12.以下の資本コストに関する文章において、①～⑤に当てはまる適切なものをA～Iから選択して下さい。\n\n企業は資金を1円調達するのにいくらかかっているかを示す（①）に関心がある。ビジネスでは（①）以上の利回りを上げることができれば、（②）と（③）の両方をカバーでき、債権者と株主を共に満足させることができる。\n\n（①）は以下の式により求めることができる。\n \n① ＝ ④ ÷（④＋⑤）× ② ×（１－税率）＋ ⑤ ÷（④＋⑤）× ③\n \nA.リスク・フリー・レート 、　B.負債総額、　C.株式の時価総額\n\nD.利息、　E.マーケット・リスク・プレミアム、　F.株主資本コスト\n\nG.負債コスト、　H.法人税率、　I.加重平均資本コスト(WACC)","answer":"■正解：\n\n① I.加重平均資本コスト(WACC)\n\n② G.負債コスト\n\n③ F.株主資本コスト\n\n④ B.負債総額\n\n⑤ C.株式の時価総額\n \n■解説：\n\n企業は借入に対しては「利息」というコストを、株式に対しては、「配当」と「値上がり益」というコストをかけて資金を調達している。加重平均資本コスト（WACC）とは、企業が１円調達するのに何％のコストがかかっているのかを表すものである。\n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n10.資本コスト P.154-155","source":"Excel: GMAP道場問題秋春(2).xlsx","no":162,"idx":162},{"id":"xlsx-2025秋-ファイナンス-13","season":"2025秋","subject":"ファイナンス","scope":"10.資本コスト_ 計算問題（WACC）","question":"出題範囲：10.資本コスト_ 計算問題（WACC）\n\n■問13. 税引き後のWACCで正しいものを選んでください。\n飲料メーカーのZ社は、新規事業の投資判断のためWACC（加重平均資本コスト）を算出することにしました。以下のデータに基づき、同社のWACCとして最も適切なものを選択してください。\n\n株主資本コスト: 12.0%\n税引前有利子負債コスト: 5.0%\n実効法人税率: 30.0%\n(金額の単位：百万円)\n\n資産の部　　　　　　　　負債及び株主資本の部\n現金・預金　2,500　　　　買掛金　　　　8,000\n売掛金　　　3,500　　　　短期借入金　　5,000\n棚卸資産　 12,000　　　　長期借入金　  15,000\n固定資産　 40,000　　　　株主資本　　  30,000\n\nA：6.9％\nB：8.6％\nC：9.2％\nD：9.8％","answer":"■正解：B（8.6％）\n\n■解説：WACCの計算式は下記となります。\nWACC=D/(D+E)×rD×(1-税率)+E/(D+E)×rE\nD：負債総額=短期借入金+長期借入金=5,000+15,000=20,000\n※負債の中でも利子が発生するものだけを合計します。\nE：株式の時価総額=30,000\nrD：負債コスト=5%\nrE：株主資本コスト=12%\n税率=30%=0.3\n計算は下記の通りです。\nD/(D+E)=20,000/(20,000+30,000)=0.4\nE/(D+E)=30,000/(20,000+30,000)=0.6\nWACC\n=0.4×5%×(1-0.3)+0.6×12%\n=8.6%\n■出典：グロービス マネジメントブック 改訂3版 　\n\n10．資本コスト P.154-155","source":"Excel: GMAP道場問題秋春(2).xlsx","no":163,"idx":163},{"id":"xlsx-2025秋-ファイナンス-14","season":"2025秋","subject":"ファイナンス","scope":"11.資本コストの推定","question":"2025年9月20日（土）＜ファイナンス＞\n\n出題範囲：11.資本コストの推定\n\n■問14.　リスク・フリーレート4.0%、マーケット・リスク・プレミアム6.0%、個別企業のβ1.2の時の株主資本コストは？\n\nA. 10.0% \n\nB. 11.2%\n\nC.   9.2%\n\nD.   8.0%","answer":"■正解：B\n\n■解説：\n\n企業から見た株主資本コストは、投資家から見た期待利回りに一致する。つまり配当と株価の値上がり値（キャピタルゲイン）を提供しなければならないので、株主資本コストを推定するにはCAPMを利用するのが一般的である。CAPMを利用する場合、株主資本コストは以下の式になります。\n\n株主資本コスト = リスク・フリーレート＋個別企業のβ×マーケット・リスク・プレミアム\n\nそのため、今回のケースでは、株主資本コストは、4.0% + 1.2 × 6.0% = 11.2%となります。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n3．金銭の時間的価値：現在価値 P.156-157","source":"Excel: GMAP道場問題秋春(2).xlsx","no":164,"idx":164},{"id":"xlsx-2025秋-ファイナンス-15","season":"2025秋","subject":"ファイナンス","scope":"12.市場の効率性","question":"出題範囲：12.市場の効率性\n\n■問15. 市場の効率性について、下記の選択肢から誤っているものを一つ選べ。\n\nA.効率的市場仮説に基づき、最初から市場平均を上回るのではなく、市場平均並みの利益を目指す運用を行うことをパッシブ運用と言う。\n\nB.ウィーク・フォームは、株価チャートなどのテクニカル分析に基づいて取引ルールを作っても、それによって他の投資家以上の利益を恒常的に上げることはできないというものである。\n\nC.ストロング・フォームは、企業のインサイダー情報を含む非公開のあらゆる情報を使っても、他の投資家以上の利益を上げ続けることはできないというものである。\n\nD.セミ・ストロングフォームは、「短期的に」見れば概ね市場の効率性が成り立っている。ただし、「長い目」で見れば何らかの非効率（ミス・プライシング）が存在する可能性があるというものである。\n✽","answer":"■正解：D\n\n■解説：\nA:（正）設問の通り。なお、市場以上の利益を上げようとする運用をアクティブ運用と言う。\nB:（正）設問の通り。ウィーク・フォームは過去の資産価値や収益率のデータに基づいた取引ルールをつくっても、他の投資家以上の利益を恒常的に利益を上げることはできないというものである。\nC:（正）設問の通り。ストロング・フォームは、非公開情報を含むあらゆる情報を使っても、他の投資家以上に利益を上げ続けることはできないというものである。\nD:（誤）長期と短期が逆。セミストロング・フォームは「長い目」で見れば概ね市場の効率性が成り立っている。ただし、「短期的」には市場には何らかの非効率（ミス・プライシング）が存在する可能性がある。\n\n■出典：グロービス マネジメントブック 改訂3版\n12.市場の効率性 P.158-159","source":"Excel: GMAP道場問題秋春(2).xlsx","no":165,"idx":165},{"id":"xlsx-2025秋-ファイナンス-16","season":"2025秋","subject":"ファイナンス","scope":"13.企業の最適資本構成(1)：理論","question":"2025年9月27日（土）＜ファイナンス＞\n\n出題範囲：13.企業の最適資本構成(1)：理論\n\n■問16.企業の最適資本構成を考える上でスタート地点となる「企業の資本構成は企業価値に影響を与えない」ことを示したMM命題の前提となる完全市場の定義について誤っているものを選択してください。\n\nA. 取引される証券にかかる情報は市場参加者のすべてに一様にコストなしに伝わる\n\nB. 資本市場への参入障壁がなく、またどの市場参加者も価格に影響を与えるほどの力を持っていない\n\nC. 資本市場への参入に伴うコストはなく、証券の取引は自由に行われる\n\nD. 税制は存在する","answer":"■正解：D\n\n■解説：\n\nMM命題において、税制は存在しないという前提の下、完全市場を定義している。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n13.企業の最適資本構成(1)：理論  P160-161","source":"Excel: GMAP道場問題秋春(2).xlsx","no":166,"idx":166},{"id":"xlsx-2025秋-ファイナンス-17","season":"2025秋","subject":"ファイナンス","scope":"14. 企業の最適資本構成（２）：実際","question":"出題範囲：14. 企業の最適資本構成（２）：実際\n\n■問17.企業の資本構成について、誤っているものを選択してください\n\nA.企業は、負債を増やせば節税効果により企業価値が高まる。しかし、極端な負債の増大は倒産リスクが高まるため、負債調達コストが上昇し、企業価値を減少させる。これら２つの効果の分岐点となるのが最適資本構成点である\n\nB.法人税があれば、負債に対する金利の支払いは費用として収益から控除される。利益が圧縮されることにより、その分税金の支払いが減少してキャッシュフローが増加するため、その現在価値である企業価値も増大する\n\nC.実際には、どの程度の負債比率の上昇に対して、どの程度負債調達コストが上昇するのか（＝リスク・プレミアム）を判断するのは容易ではない。近年では、判断するための有効な資料として社債の格付けが活用されている\n\nD.株主の目から見れば、株主の利益の最大化のために負債比率を低く抑えることが最大の使命である","answer":"■正解：D（誤り）\n\n■解説：\n\nA.設問の通り\n\nB.設問の通り\n\nC.設問の通り\n\nD.株主の目から見れば、必要以上に負債比率を低く抑えている経営者は、株主の利益の最大化という使命を怠っていると映るケースもありうる\n\n企業は総資産に対する負債比率を引き上げることで、WACCを低下させることができる。あとは、負債比率を引き上げたことによって格付けが下がったときに、調達コストがどの程度上昇するかを推定すればよい。実際には、企業はこのようにして負債比率、すなわち資本構成を決定することが多い\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n14.企業の最適資本構成（２）：実際　P.162-163","source":"Excel: GMAP道場問題秋春(2).xlsx","no":167,"idx":167},{"id":"xlsx-2025秋-ファイナンス-18","season":"2025秋","subject":"ファイナンス","scope":"15. 配当政策","question":"出題範囲：15. 配当政策\n\n■問18.以下の文で、正しいものを全て選択して下さい。\n\nA.株主の利益には、株の値上がり益(キャピタルゲイン)と配当(インカムゲイン)があるが、株主は、株の値上がり益よりも、配当による還元を求める。\n\nB.マイクロソフト社が創業から2003年まで配当を出さなかったのは、成長投資機会が豊富で、内部留保を優先したからである。\n\nC.配当を減らす（減配する）と、一般的に、株主はネガティブなシグナルだと受け止める。\n\nD.成長機会が限られている成熟企業は、株主に配当として還元することより、設備投資をさらに拡大することで、株主の要求に応える傾向がある","answer":"■正解：正しいのは、BとC\n\n■解説：\n\nA.誤り。株主が、株の値上がり益、配当による還元、どちらを望むかは、一概に決まらない。配当は支払われた時点で課税されるのに対し、株の値上がり益は株を売却して利益を実現した時点で課税されるため課税の先送りができる、といった税制の影響を受ける。また、企業が成長期にあるか、成熟期にあるか、などの影響を受ける。\n\nB.正しい。マイクロソフトの創業期は、株価上昇による値上がり益で株主は満足しており、配当よりも更なる成長機会への投資を望んだ。\n\nC.正しい。投資家は、配当政策を、経営者の持っている情報を推測するためのシグナルとして利用する。一般的に、配当を減らす（減配する）ことは、業績悪化のシグナルと解釈され、株価下落につながることが多い。逆に安定配当や増配は投資家の安心材料になる。\n\nD.誤り。成長機会が限られている成熟企業は、株の値上がりも緩やかになることが多く、配当や自社株買いによって株主に還元する方が、株主価値を高められる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n15.配当政策 P.164-165","source":"Excel: GMAP道場問題秋春(2).xlsx","no":168,"idx":168},{"id":"xlsx-2025秋-ファイナンス-19","season":"2025秋","subject":"ファイナンス","scope":"","question":"■問19. 株式評価モデルに関する考え方について、誤っているものをすべて選択してください。\n\nA.企業経営者にとって、自社の株式が理論的に見てどの程度の水準にあるべきかを客観的に知っておくことは重要だ。それによって、日々の短期的な株式の動きに惑わされることなく、長期的に株主資本価値を上げていくための方策が見えてくる。\n\nB.理論株価を知っておくことで、株価が理論値よりも過大に評価されているときには、自社株を市場で買入消却を行い、過小評価されているときには、増資によって株式市場から資金を調達するというように、機動的な財務戦略をとることが可能となる。\n\nC.企業活動から発生すると予想される毎年のFCF（フリー・キャッシュフロー）をWACC（加重平均資本コスト）で割り引いた現在価値をすべて合計することで、企業の総資産価値が得られる。そこから負債（有利子負債から現金等価物を差し引いた純有利子負債）の価値を差し引けば、株主資本の価値が得られる。このようにして株式の価値を求める方法を配当割引モデルと言う。\n\nD.配当割引モデルは割引率として株主資本コストを用い、負債を差し引くことなく直接株主資本の価値を求めることができる。このモデルの問題は、企業経営者は自由に配当を設定できる点であり、配当が必ずしも企業の将来の業績と連動せず、正確な企業価値が求められないことがある。","answer":"■正解：BとC\n\n■解説：\n\nB：株価が理論値よりも過大に評価されている場合には、増資によって株式市場から資金を調達し、過小評価されているときには自社株を市場で買入消却する。\n\nC： 問題文の説明は、配当割引モデルではなく、キャッシュフロー割引モデル。\n\nA：正しい\n\nD：正しい\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n18.株式評価モデル P.170-171","source":"Excel: GMAP道場問題秋春(2).xlsx","no":169,"idx":169},{"id":"xlsx-2025秋-ファイナンス-20","season":"2025秋","subject":"ファイナンス","scope":"16.フリー・キャッシュフロー","question":"出題範囲：16.フリー・キャッシュフロー\n\n■問20. フリー・キャッシュフロー（FCF）は、DCF法により企業価値を計算するときに使われるキャッシュフローのことであり、以下のように定義される。下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nFCF = （①） × (1-法人税率) + （②） – （③） -ΔWC\n\nWC = （現金等価物を除いた）流動資産 - （④）\n\nA. ①EBITDA　②労務費　　　③投資　　　　④固定負債\n\nB. ①EBIT　　  ②労務費　　　③減価償却費　④固定負債\n\nC. ①EBIT　　  ②減価償却費　③投資　　　　④（有利子負債を除いた）流動負債\n\nD. ①EBITDA　②投資　　　    ③減価償却費　④（有利子負債を除いた）流動負債\n\n✽","answer":"■正解：C\n\n■解説：\n\n・FCF = EBIT × (1-法人税率) + 減価償却費 – 投資 -ΔWC \n\n・WC = （現金等価物を除いた）流動資産 - （有利子負債を除いた）流動負債\n\n・ΔWCは、WCの前年度との差額\n\n・EBIT（Earning Before Interest and Tax: 支払金利前税引前利益）は営業利益に金利以外で恒常的に発生する営業外損益を加えた額\n\n・流動資産の主なものとしては売掛金やたな卸資産、流動負債の主なものとしては買掛金がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16.フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":170,"idx":170},{"id":"xlsx-2025秋-ファイナンス-21","season":"2025秋","subject":"ファイナンス","scope":"17. 企業価値の算出","question":"出題範囲：17. 企業価値の算出\n\n■問21.企業価値の算出に関する次の記述のうち、誤っているものを一つ選んでください。\n\nA.企業価値には、大きく分けて、今後ともこの企業が事業活動を継続していくことを前提とする価値（継続価値＝Going-Concern Value）と、解散するとした場合の価値（清算価値＝Liquidation Value）の2つの考え方がある\n\nB.財務諸表上の企業の利益をもとにして企業の価値を推定しようとする際、一般に企業利益として用いられるのは、「株主にとっての企業価値」という観点から、負債に伴う金利等の費用や支払税を差し引いた税引後利益を使うことが多い\n\nC.清算価値は、企業をいま解散するとして、資産を個別に洗い直し処分価値を合計したものから、負債を差し引いた金額を企業価値とする考え方である。資産の処分価格は通常、貸借対照表上の簿価とは異なるが、負債は簿価を用いて算出する","answer":"■正解：C\n\n■解説：\n\nA：正しい\n\nB：正しい\n\nC：資産の処分価値だけでなく、負債も簿価ではなく実際の金額を確定する必要がある（例：社債を期日前償還する場合、ペナルティが課せられることが多く、その分も負債に上乗せする必要がある　など）\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n17.企業価値の算出 P.168-169","source":"Excel: GMAP道場問題秋春(2).xlsx","no":171,"idx":171},{"id":"xlsx-2025秋-ファイナンス-22","season":"2025秋","subject":"ファイナンス","scope":"16.フリー・キャッシュフロー_ 計算問題（FCF）","question":"出題範囲：16.フリー・キャッシュフロー_ 計算問題（FCF）\n\n■問22. 下記情報から求めたFCFについて、正しいものを選択してください。\nなお、税率は40%とします。\n\n売上高       ：1,000億円\n売上総利益：100億円\n減価償却費：2億円\n支払金利前税引き前利益：50億円\n経常利益    ：10億円\n当期純利益：5億円\n固定資産評価額：10億円\n新規設備投資額：5億円\n今年度の運転資本：10億円\n昨年度の運転資本：8億円\n\nA：55億円\nB：25億円\nC：17億円\nD：1億円","answer":"■正解：B\n\n■解説：FCFの公式は以下の通りです。\n\nFCF＝EBIT（支払金利前税引き前利益）×（1-法人税率）＋減価償却費ー投資ーΔWC\n\nEBIT：支払金利前税引き前利益のこと。営業利益に金利以外で恒常的に発生する営業外損益を加えた額（earning=利益、interest=利息、Tax＝税金）\n\nΔWC：ワーキング・キャピタルの前年度との差額（Δ＝デルタ、差分を意味する）\n\n従い、数値を当てはめると以下の通りです。\n\nFCF＝50億円×（1-40%）＋2億円ー5億円ー（10億円ー8億円）\n\n       ＝25億円\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16．フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":172,"idx":172},{"id":"xlsx-2025秋-ファイナンス-23","season":"2025秋","subject":"ファイナンス","scope":"19. EVA","question":"出題範囲：19. EVA\n\n■問23.EVAの説明として、誤っているものを全て選択してください。\n\nA.EVAは単年度のフリー・キャッシュフロー（FCF）から、調達資金にかかるすべての資本コストを差し引いたものを企業の真の利益（付加価値）として認識する。\n\nB.EVAは資本コスト支払い後の企業の付加価値を増大させ、ひいては株主価値を増加させようという考え方である。\n\nC.EVAとFCFの違いは、EVAは「その年度の投下資本を全額控除する」のに対し、FCFは「総資本に対して当該期間に稼ぎ出すべき資本コストの率ではなく実額」を差し引く点である。\n\nD.単年度のFCFを経営指標にした場合、投資の多い年度のFCFはマイナスになる可能性があるため、大きな投資を先送りにする危険性がある。","answer":"■正解：A、Cが誤り\n\n■解説：\n\nA.誤り\n\nEVAは「税引後営業利益」から、調達資金にかかるすべての資本コストを差し引いたものを企業の真の利益（付加価値）として認識する。\n\nC.誤り\n\nEVAとFCFの違いは、EVAは「総資本に対して当該期間に稼ぎ出すべき資本コストの率ではなく実額」を差し引くのに対し、FCFは「その年度の投下資本を全額控除する」点である。FCFとEVAの説明が逆になっているため、誤り。\n\nB.正しい\n\nD.正しい\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n19.EVA P.172-173","source":"Excel: GMAP道場問題秋春(2).xlsx","no":173,"idx":173},{"id":"xlsx-2025秋-ファイナンス-24","season":"2025秋","subject":"ファイナンス","scope":"20.オプション理論の基礎","question":"出題範囲：20.オプション理論の基礎\n\n■問24.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nオプションは（①）に対する保険のようなもので、オプションの保有者（「買い手」）はオプションが行使できればリスクなしで必ず利益を上げられる。当然ながら、 オプションの相手側（「売り手」）は何らかの対価（保険料のようなもの）なしには取引に応じるはずがない。そのため、契約成立時に、オプションの買い手は「（②）」と呼ばれる対価を売り手に支払う。\n\nオプションからの利得は、オプション行使時のオプション対象資産の価格によって決まる。一般に（③）・オプションの場合、資産価格が行使価格よりも上昇していれば、時価よりも安く買えるので、オプションを行使して利得を確保するが、行使価格以下であればオプションを行使しない。（④）・オプションの場合は、資産価格が行使価格よりも下落していれば、時価よりも高く売れるのでオプションを行使して利得を確保するが、行使価格以上であれば放棄する。\n\nA. ①行使価格　②プレミアム　③コール　④プット\n\nB. ①資産価格　②ペイオフ　　③プット　④コール\n\nC. ①資産価格　②プレミアム　③コール　④プット\n\nD. ①行使価格　②ペイオフ　　③プット　④コール","answer":"■正解：C\n\n■解説：適切な文章は下記の通りです。\n\nオプションは（資産価格）に対する保険のようなもので、オプションの保有者（「買い手」）はオプションが行使できればリスクなしで必ず利益を上げられる。当然ながら、 オプションの相手側（「売り手」）は何らかの対価（保険料のようなもの）なしには取引に応じるはずがない。そのため、契約成立時に、オプションの買い手は「（プレミアム）」と呼ばれる対価を売り手に支払う。\n\nオプションからの利得は、オプション行使時のオプション対象資産の価格によって決まる。一般に（コール）・オプションの場合、資産価格が行使価格よりも上昇していれば、時価よりも安く買えるので、オプションを行使して利得を確保するが、行使価格以下であればオプションを行使しない。（プット）・オプションの場合は、資産価格が行使価格よりも下落していれば、時価よりも高く売れるのでオプションを行使して利得を確保するが、行使価格以上であれば放棄する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n20.オプション理論の基礎 P.174-175","source":"Excel: GMAP道場問題秋春(2).xlsx","no":174,"idx":174},{"id":"xlsx-2025秋-ファイナンス-25","season":"2025秋","subject":"ファイナンス","scope":"4.DCF法","question":"出題範囲：4.DCF法\n \n■問25.　年間の家賃収入が350万円、維持管理費が50万円で、割引率5.0%で、10年後に売却する際、住宅の残存価値を計算してください。残存価値の算定には永久年金法を使用してください。\n\nヒント：1.05^10=1.6289です。\n\nA：6,000.0万円\n\nB：3,683.5 万円\n\nC：2,316.5万円\n\nD：300万円","answer":"■正解：Β.3,683.5 万円\n \n■解説：\n\nDCF法（割引キャッシュフロー法）で、永久年金法で残存価値を計算する場合、以下の式になる。\n\nPV = (350 - 50) / 0.05　\n\nそのため、10年後の売却価格が毎年300万円CFを永久に生み続けると仮定して、永久年金法で計算すると、\n\n残存価値300/0.05 = 6,000万円（A）\n \n上記の結果は、10年後の価値なので現在価値に直すと、\n\nPV = 6,000/ 1.05^10 = 3,683.5 万円（B）\n \n*10年後までのFCFから生み出される資産の現在価値（PV）を計算する式は以下\n\nPV = 300/1.05 + 300/1.05^2 + ・+・・・+・＋ 300/1.05^10 = 2,136.5\n\nそのため、10年間のFCFの現在価値は2,316.5万円（C）\n\n今回は残存価値を求める問題なので、正解は B.となります。\n \n ■出典：グロービス マネジメントブック 改訂3版 　\n\nDCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":175,"idx":175},{"id":"xlsx-2025秋-ファイナンス-26","season":"2025秋","subject":"ファイナンス","scope":"22.投資ファンド","question":"出題範囲：22.投資ファンド\n\n■問26. 投資ファンドについて、下記の選択肢から誤っているものをすべて選べ。\n\nA.投資ファンドには、企業価値を向上させる方法論や投資先のタイプ、投資回収方法などによって、再生ファンド、ハゲタカファンド、キャピタルゲイン、不動産ファンドなどがある。\n\nB.投資ファンドの業務としては、投資先の発掘と投資、投資先の価値を向上させる活動、資金回収がある。\n\nC.再生ファンドは、経営状況が悪化した企業の株式を買収し、資金や経営陣を投入することで会社の再建を図り、株式公開や事業売却の形で資金回収を図る。\n\nD.ハゲタカファンドは、主に資産や事業の切り売りをすることで資金回収を図り、再生ファンドとは明確に色分けされる。","answer":"■正解：AとD\n\n■解説：\n\nA:（誤）投資ファンドの種類は再生ファンド、ハゲタカファンド、「ベンチャー・キャピタル」、不動産ファンドなどがある。キャピタルゲインとは株式の値上がり益のことである。\n\nB:（正）設問の通り。\n\nC:（正）設問の通り。\n\nD:（誤）ハゲタカファンドは、主に資産や事業の切り売りをすることで資金回収を図る。なお、ハゲタカファンドと再生ファンドは明確に色分けできるものではなく、１つの投資ファンドの中で両方の手法を使い分けることも多い。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n22.投資ファンド P.178-179","source":"Excel: GMAP道場問題秋春(2).xlsx","no":176,"idx":176},{"id":"xlsx-2025秋-ファイナンス-27","season":"2025秋","subject":"ファイナンス","scope":"計算問題
