（株主資本コスト、株主資本コストの推定）","question":"出題範囲：計算問題（株主資本コスト、株主資本コストの推定）\n\n■問27. WACCで正しいものを選んでください。\n長期借入金の利息：6.0%\n10年国債利回り：5.0%\nマーケットリスクプレミアム：8.0%\n自社β：0.8\n税率：40.0%\n株式時価総額：23,000百万円\n(金額の単位：百万円)\n資産の部　　　　　　　　負債及び株主資本の部\n現金・預金　2,500　　　　買掛金　　　　5,000\n売掛金　　　5,500　　　　長期借入金　  43,000\n棚卸資産　 10,000　　　　株主資本　　   20,000\n固定資産　 50,000\n\nA：5.3％\nB：6.3％\nC：7.3％\nD：8.3％","answer":"■正解：B\n\n■解説：\n\nWACCの計算式は負債/（負債+株主資本）×負債コスト（rD）×（1-税率）+株主資本/（負債+株主資本）×株主資本コスト（rE）。\n\n株主資本コストは原則、時価を使用します。\n\n株主資本コスト(rE)の計算式はリスクフリーレート＋β×マーケットリスクプレミアム（rm-rf）\n\n問題に当てはめると、\n\nrE=5.0%+0.8×8.0%=11.4%\n\nWACC=43,000/(43,000+23,000)×6.0%×(1-40%)+23,000/(43,000+23,000)×11.4%=6.3%\n\n■出典：グロービス マネジメントブック 改訂3版\n\n10．資本コスト P.154-155\n\n11．株主資本コストの推定 P.156-157","source":"Excel: GMAP道場問題秋春(2).xlsx","no":177,"idx":177},{"id":"xlsx-2025秋-ファイナンス-28","season":"2025秋","subject":"ファイナンス","scope":"8. 分散投資の効果（3）：CAPM（資本資産価格モデル）","question":"出題範囲：8. 分散投資の効果（3）：CAPM（資本資産価格モデル）\n\n■問28.以下の３つの条件のうち、株主の期待利回りが最も大きいものを選べ。なお、いずれの選択肢についても株式市場へ上場しているものとする\n\nA.株主の期待利回り：７.５％\n\nB.国債の利回り：２.０％、マーケット・リスク・プレミアム：４.０％、β：１.５\n\nC.国債の利回り：２.０％、マーケット・ポートフォリオの期待利回り：６.０％、β：１.２","answer":"■正解：Ｂ（８.０％）\n\n■解説：\n\n株主の期待利回りは、CAPMの式に基づき計算するとBが最大（８.０％）となる。\n\nA.７.５％\n\nB.２.０％ ＋ １.５ × ４.０％ ＝ ８.０％\n\nC.２.０％ ＋ １.２ × （６.０％ － ２.０％） ＝ ６.８％\n\n　個別資産の期待利回り\n\n＝ 無リスク資産の利回り ＋ β × マーケット・リスク・プレミアム\n\n＝ 無リスク資産の利回り ＋ β ×（マーケット・ポートフォリオの期待利回り－無リスク資産）\n\n・無リスク資産の利回りは、国債の利回りを参照することが一般的である\n\n・βは個別資産の市場全体（マーケット・ポートフォリオ）に対する感応度である\n\n・マーケット・ポートフォリオの期待利回りと無リスク資産の利回りの差を「マーケット・リスク・プレミアム」と言う\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n8．分散投資の効果（3）：CAPM（資本資産価格モデル）P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":178,"idx":178},{"id":"xlsx-2025秋-ファイナンス-29","season":"2025秋","subject":"ファイナンス","scope":"","question":"■問29.2014年度のフリー・キャッシュフローは、A〜Dのどの金額になりますか。\n\n（計算式の答えは小数点第二位を四捨五入してください）\n\n　　　　　　　　　　2013年度　　2014年度　(百万円)\n売上高　　　　　　：4,000　　　　5,000\n営業費用　　　　　：3,700　　　　4,500\n　　内、減価償却費：   200　　　　　800\n営業利益　　　　　：   300　　　　　500\n支払利息 (利率30%)：     90　　　　　150\n法人税 　(税率40%)： 　84　　　　　140\n当期純利益　　　　：  126　　　　　 210\n投資額　　　　　　：   100　　　　1,000\n流動資産　　　　　：1,250　　　　1,280\n流動負債　　　　　：   960　　　　1,010\n※流動資産は現金等価物を除いた額、流動負債は有利子負債を除いた額とする\n　　\nA.　  70　（百万円）\nB.　  80　（百万円）\nC.　120　（百万円）\nD.　170　（百万円）","answer":"■正解：C.　120　（百万円）\n\n■解説：\nフリー・キャッシュフロー\n＝ EBIT ×（１－法人税率）＋ 減価償却費 － 投資 －⊿WC\nEBITは営業損益に金利以外で「恒常的に発生する営業外損益」を加えた額です。\nEBIT = 営業利益 + （営業外収益※ − 営業外費用※）※支払利息を除く\n今回は、\nEBIT = 営業利益 + （営業外収益 0 − 営業外費用 0）\nEBIT = 営業利益\nフリー・キャッシュフロー\n＝ 500　×（１ － 40%） ＋ 800 － 1,000 －（－20）\n＝ 120\nWC（運転資本）\n＝（現金等価物を除いた）流動資産 － （有利子負債を除いた）流動負債\n⊿WC（増加運転資本）\n＝ 2014年度の運転資本 － 2013年度の運転資本\n＝（2014年度の流動資産ー流動負債）－（2013年度の流動資産ー流動負債）\n＝（1,280 － 1,010 ）－（ 1,250 － 960 ）\n＝ －20\n　　\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16．フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":179,"idx":179},{"id":"xlsx-2025秋-ファイナンス-30","season":"2025秋","subject":"ファイナンス","scope":"21. 企業買収防衛策","question":"出題範囲：21. 企業買収防衛策\n　\n■問30.（１）～（５）の企業買収防衛策の説明として適切なものを選択肢A~Eのうちから選んでください。\n　\n１：既存の株主に対して新株予約権を発行し、敵対的買収者が一定の議決権割合を取得した時点で、市場価格より安い価格で株式を引き受けられるようにすること。\n　\n２：敵対的買収者により解任・退任されるなど一定の条件を満たした場合、巨額の退職金が取締役に支払われるという委任契約を被買収企業の取締役があらかじめ締結しておくもの。\n　\n３：敵対的買収者が最も欲しがっている資産や事業を売却することで、買収意欲をそぐ手法。\n　\n４：被買収企業の経営陣と合意の上で、友好的に買収または合併を行う会社。被買収企業が友好的な買収者を自ら選択することで、敵対的買収者からの買収を避けることを狙っている。\n　\n５：経営陣が自社の株式を取得して、非公開企業としてしまうこと。\n　\nA. ホワイトナイト\nB. ポイズン・ピル\nC. マネジメント・バイ・アウト\nD. クラウン・ジュウェル\nＥ.ゴールデン・パラシュート","answer":"■正解：\n\n１:Ｂ- ポイズン・ピル　\n\n２:Ｅ- ゴールデン・パラシュート　\n\n３:Ｄ- クラウン・ジュウェル　\n\n４:Ａ- ホワイトナイト　\n\n５:Ｃ- マネジメント・バイ・アウト\n\n■解説：\n\n正解の通り\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n21.企業買収防衛策 P.176-177","source":"Excel: GMAP道場問題秋春(2).xlsx","no":180,"idx":180},{"id":"xlsx-2025春-マーケティング-1","season":"2025春","subject":"マーケティング","scope":"","question":"問1.マーケティング思考に関する以下A～Dの文章から、誤っているものをすべて選択してください。\nA. マーケティングの活動範囲は営業活動や広告、市場調査に限定されているわけではい。\nB. セリングの目的は1年後の売上を確保することにあるので、長期志向になりやすい。\nC. マーケティングの目的は短期的な成長だ。\nD. マーケティングは顧客満足を軸に「買ってもらえる仕組み」を考える活動である。","answer":"■正解：B、C\nA：正解\nB：セリングの目的は今日の売上を確保することにあるので、短期志向になりやすい。\nC：マーケティングの目的は継続的な成長だ。\nD：正解\n【補足】マーケティングとセリングの違い\n・マーケティング：顧客ニーズを分析し、商品開発やブランド戦略を考え、継続的な市場戦略を作ること。\n・セリング：実際に顧客に商品を売るプロセスで、現状の売上確保に焦点を当てる。\n例えば、マーケティングでは「顧客が求めるものは何か。顧客のニーズを満たす製品を提供するにはどうすればよいか。」を考えますが、セリングは「観光地の土産物屋をイメージしてみるとわかりやすい。土産物屋は通常、1回の売り上げを最大化することのみ考えて、商品を売り込もうとする」を考えます。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.マーケティングの発想 P.48-49","source":"Excel: GMAP道場問題秋春(2).xlsx","no":181,"idx":181},{"id":"xlsx-2025春-マーケティング-2","season":"2025春","subject":"マーケティング","scope":"","question":"A.市場環境の変化を踏まえて企業の進むべき方向を見出し、経営戦略や事業活動に落とし込んでいく役割を果たすのがマーケティングである。\nB.マーケティングは、自社の製品、技術シーズから売れる可能性を見出していくことを主眼としている。\nC.マーケティング戦略は、製品軸で考えるため事業レベルに特化した戦略である。\nD.マーケティング戦略は、「コスト・リーダーシップ戦略」「差別化戦略」「集中戦略」などが重要な役割を担っている。","answer":"■正解：A\nA：正しい\nB：マーケティングは、顧客の期待を明確化し、顧客ニーズの充足を保証するために、企業内のさまざまな機能を統合する役割を担っている。選択肢にあるような、R&D部門、製品開発は、技術シーズ中心の発想になりやすく、それだけではマーケティングの視点がかけていると言える。\nC：マーケティング戦略は、経営戦略と同様に、全社レベル、事業レベル、製品レベルの各視点で考えなくてはならない。\nD：マーケティング戦略（事業レベル）では、セグメンテーションやターゲティング、ポジショニング、マーケティング・ミックスなどが根幹を担っている。選択肢は「企業の競争優位をどう築くか」という事業戦略の話であり、ポーターの競争戦略フレームワークである。\n■出典：グロービス マネジメントブック 改訂3版 　\n2.マーケティングの役割 P.50-51","source":"Excel: GMAP道場問題秋春(2).xlsx","no":182,"idx":182},{"id":"xlsx-2025春-マーケティング-3","season":"2025春","subject":"マーケティング","scope":"","question":"■問3.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・セグメンテーション(市場細分化)：環境分析の結果を踏まえて、不特定多数の人々を、同じ(　①　）を持つ固まり(セグメント)に分ける。\n・ターゲティング(標的市場の選定)：市場を構成するさまざまなセグメントの中から、(　②　)が事業を展開するのに最もふさわしいセグメントを選び出す。\n・ポジショニング：競合製品に対して自社製品をどのように(　③　)するかを決定する。いわば、顧客の頭の中に自社製品を特別の価値を有するものとして位置づけられるようにするための活動である。\n・マーケティング・ミックス(4P)：ターゲットとするセグメントに対して働きかけるための具体的なマーケティング施策の総称である。4Pとは、Production(製品)、Price(価格)、(　④　)、Promotion(コミュニケーション)の頭文字を取ったもので、これらの最良の組み合わせ(ミックス)を考えていく。このときに重要なのは、4P間で整合性が取れていることだ。\nA. ①ウォンツ　②顧客　③コモディティ化　④Painful(顧客の困り具合)\nB. ①ニーズ　②自社　③差別化　④Place(流通)\nC. ①ウォンツ　②自社　③差別化　④Perpetual(永続)\nD. ①ニーズ　②顧客　③コモディティ化　④Pride(誇り)","answer":"■正解：B\n■解説：\nマーケティングの観点からビジネスを構築していくためのプロセスは、以下の6つのステップに大別される。\n≪マーケティング戦略立案の流れ≫\n①　マーケティング環境分析と市場機会の発見\n②　セグメンテーション(市場細分化)\n③　ターゲティング(標的市場の選定)\n④　ポジショニング\n⑤　マーケティング・ミックス(4P)\n⑥　マーケティング施策の実行と評価\n※②～⑤の流れをを略して「STP4P」\n必ずしも一方向的な流れではなく、行きつ戻りつする事もある。\n特にやりっぱなしではなく、必ずその結果を評価しうまくいっていない部分については原因を探り、戦略の見直しを行う事が重要である。\n■出典：グロービス マネジメントブック 改訂3版 　\n3．マーケティング・マネジメント P.52-53","source":"Excel: GMAP道場問題秋春(2).xlsx","no":183,"idx":183},{"id":"xlsx-2025春-マーケティング-4","season":"2025春","subject":"マーケティング","scope":"","question":"■問4.市場機会の発見について、誤っているものを選択してください。\nA.マーケティング環境の分析では、自社ではコントロールできない外部環境と、コントロール可能な内部環境を見る。その後、SWOT分析を行い、KSF（成功の鍵となる要因）を発見する。\nB.市場の機会と脅威は通常、外部分析から導かれ、また、機会と脅威には二面性がある。機会と脅威を見つける際には、環境の変化を本質まで掘り下げて分析することがポイントだ。\nC.市場の脅威を捉え直す方法は「自社の強みと弱み」をもう一度見直すことだ。ただし、一見短所と思われる特徴を長所に転じさせることは難しく、実例は少ない。\nD.自社にとっての市場の機会とは、「他社にない強みを発揮できる舞台」を指す。環境分析を行い、他社に対して競争優位を発揮できるような市場機会を創造的に発見することが重要である。","answer":"■正解：C\n■解説：\nA・B・D：正しい\nC：誤り。\n一見短所と思われる特徴を長所に転じさせた例は多く、自社にとっての市場機会とは、発見した事実の中に「ある」ものではなく、その事実を企業がどう捉えるかによって「創り出される」ものだ。\n■出典：グロービス マネジメントブック 改訂3版 　\n4.市場の機会の発見 P.54-55","source":"Excel: GMAP道場問題秋春(2).xlsx","no":184,"idx":184},{"id":"xlsx-2025春-マーケティング-5","season":"2025春","subject":"マーケティング","scope":"","question":"■問5.マーケティングでは市場調査やシェア分析、製品選好分析、販売予測、広告効果分析など、さまざまなリサーチが行われる。マーケティング・リサーチの目的はマーケティング上の仮説を検証することにある。マーケティング戦略を実りあるものにするには　リサーチにおいて明確な目的を持ち、市場の状況を的確に把握できる手段を選択・活用する必要がある。\nマーケティングのリサーチは通常、①、②、③、④の手順で行われるが、①～④に入る語句として適切なものを選択肢A~Dから選んでください。\nA.　 ①リサーチの設計と実施　② リサーチ目的の設定　③仮説の設定　④仮説の検証　\nB.　 ① 仮設の設定　②リサーチ目的の設定　③仮説の検証　④リサーチの設計と実施\nC. 　①リサーチ目的の設定　②仮説の設定　③リサーチの設計と実施　④仮説の検証　\nD. 　①仮説の検証　②リサーチ目的の設定　③仮説の設定　④リサーチの設計と実施","answer":"■正解：C\n■解説：\n・リサーチは通常、①リサーチ目的の設定、②仮説の設定、③リサーチの設計と実施、④仮説の検証という手順で行われる 。\nリサーチ目的の設定：リサーチの第1ステップは、だれが、どのような目的のために、どのような情報を必要としているのかを明確にすること。\n仮説の設定：リサーチは仮説なしには進められない。\nリサーチの設計と実施：リサーチの設計では、必要なデータを特定し、そのデータ収集をするためにリサーチ手法や質問内容を決めて実施する。\n仮説の検証：いかによいデータを集めても、分析が的確に行わなけなくては意味がない。検証したい事柄に応じてさまざまな分析手法を用いる。\n■出典：グロービス マネジメントブック 改訂3版 　\n5.マーケティング・リサーチ P.56-57","source":"Excel: GMAP道場問題秋春(2).xlsx","no":185,"idx":185},{"id":"xlsx-2025春-マーケティング-6","season":"2025春","subject":"マーケティング","scope":"","question":"■問6.下記文章中の（①）～（⑥）に入る語句として適切なものを選択肢A~Fのうちから選んでください。\nどの顧客層をターゲットにするかを決めるのがターゲティング（標的市場の選定）だ。このとき、とくに以下の6点 (6R) に注意し、総合的に判断しなくてはならない。\n【①】：その事業あるいは商売が成立する最低限の規模を獲得できるセグメントでなければならない\n【②】：一般に、市場の生成期や成長段階の初期に、売上げやシェア獲得の大きなチャンスがある\n【③】： もし周囲への影響力の強いセグメントがあるならば、優先的にアプローチをすべきである\n【④】：たとえ魅力的なセグメントがあっても、地理的に遠かったり、名簿を入手できなかったりすると、顧客に的確なアプローチができない\n【⑤】：すでに競合がその市場で大きな地位を占めている場合、市場の魅力度は低減する。競合の優位性が小さい領域で差別化できれば、新たな地位を獲得する可能性が広がる\n【⑥】 ： 実行されたアクションに対し、適切な結果がもたらされたかを測定すべきである。\nA. 顧客の優先順位/波及効果 (Rank /Ripple Effect)\nB. 競合状況 (Rival)\nC. 成長性 (Rate of Growth)\nD. 有効な市場規模 (Realistic Scale)\nE. 反応の測定可能性 (Response)\nF. 到達可能性 (Reach)","answer":"■正解：①：D、②：C、③：A、④：F、⑤：B、⑥：E\n■解説：\nどの顧客層をターゲットにするかを決めるのがターゲティング（標的市場の選定）だ。このとき、とくに以下の6点 (6R) に注意し、総合的に判断しなくてはならない。\n有効な市場規模 (Realistic Scale) : その事業あるいは商売が成立する最低限の規模を獲得できるセグメントでなければならない。\n成長性 (Rate of Growth) : 一般に、市場の生成期や成長段階の初期に、売上げやシェア獲得の大きなチャンスがある。\n顧客の優先順位/波及効果 (Rank /Ripple Effect) : もし周囲への影響力の強いセグメントがあるならば、優先的にアプローチをすべきである。\n到達可能性 (Reach) : たとえ魅力的なセグメントがあっても、地理的に遠かったり、名簿を入手できなかったりすると、顧客に的確なアプローチができない。\n競合状況 (Rival) ：すでに競合がその市場で大きな地位を占めている場合、市場の魅力度は低減する。競合の優位性が小さい領域で差別化できれば、新たな地位を獲得する可能性が広がる\n反応の測定可能性 (Response) : 実行されたアクションに対し、適切な結果がもたらされたかを測定すべきである。 広告の効果や、商品に対する満足度の調査など\n単語だけでなく、その意味も理解しておきましょう～！\n■出典：グロービス マネジメントブック 改訂3版 　\n6.セグメンテーションとターゲティング P.58-59","source":"Excel: GMAP道場問題秋春(2).xlsx","no":186,"idx":186},{"id":"xlsx-2025春-マーケティング-7","season":"2025春","subject":"マーケティング","scope":"","question":"■問7.ポジショニングの検討について、以下A〜Dの中から誤っているものをすべて選択してください\nA.ポジショニングを検討するときには、例えば製品の属性を軸にして2次元のマップを用いて有効なポジションを視覚的に探す方法がある。その際は相関性の高い軸を組み合わせるように注意しなくてはならない。\nB.ポジショニングは、ターゲット顧客の頭の中に独自のポジションを築き、明確でユニークな差別化イメージを植え付けるための活動である。\nC.ポジショニング成功のための鉄則は、想定する顧客像が明確かつ適切であること、顧客に正確に伝わること、顧客にとって共感できること、企業全体のポジショニングと整合していることである。\nD.まったく同じ内容の製品やサービスであれば、ポジショニングが変わってもマーケティング施策は変わらない。","answer":"■解説：AとDは誤り\nA. 相関性の高い軸を組み合わせるという点が誤り。\n2次元マップを描く場合は、独立性の高い軸を組み合わせるように注意しなくてはならない。例えば「品質」と「価格」というように相関性の高い軸を選んでしまうと、「高品質・高価格」「低品質・低価格」という当たり前の関係しか導き出せず、1つの軸で考えるときと同じ結果になってしまう。\nB.正しい\nC.正しい\nD. ポジショニングが変わればマーケティング施策は異なったものになるため誤り。\n例えば化粧品メーカーが新製品を売り出す場合、それを高付加価値商品として展開する場合と普及品として展開する場合とでは、そのポジションにふさわしい製品設計や価格設定、流通チャネル、販売方法などを考えることになる。\n■出典：グロービス マネジメントブック 改訂3版 　\n7.ポジショニング P.60-61","source":"Excel: GMAP道場問題秋春(2).xlsx","no":187,"idx":187},{"id":"xlsx-2025春-マーケティング-8","season":"2025春","subject":"マーケティング","scope":"","question":"■問8.製品特性に関する以下のA〜Dの文章のうち、適切でないものを選択してください。\nA. 製品の構成要素は「コア」「形態」「付随機能」の3つに分解でき、どの要素が差別化の決め手になるかは、製品特性や競争環境などによって異なる。\nB.　製品は、物理特性によって「非耐久財」「耐久財」「サービス」の3つに分けられる。非耐久財は、再購入を促すことが課題であり、店頭シェアの獲得やマス広告が重要になる。\nC. 生産財は、使用される目的に応じて「材料・部品」「資本財」「備品・サービス」の3つに分類される。\nD. 消費財は、購買プロセスによって「最寄品」「買回品」「専門品」に分類される。専門品は、家具や衣類など、いくつかの製品を比較検討して買う製品で、価格と機能のバランスがポイントとなる。","answer":"■正解：D\n■解説：\nA: 正しい。製品は「コア」「形態」「付随機能」の3要素に分解され、それぞれの重要性は製品特性や競争環境によって異なる。\nB: 正しい。製品は、物理特性によって「非耐久財」「耐久財」「サービス」の3つに分類される。非耐久財は、すぐに消費されるもので、食品や飲料、洗剤、化粧品などの消耗品を指す。これらの製品は再購入を促すことが課題であり、店頭シェアの獲得やマス広告が重要である。\nC: 正しい。生産財は、「材料・部品」（最終製品の生産にすべて使用）、「資本財」（最終製品の生産に部分的に使用）、「備品・サービス」（最終製品にまったく使用されない）の3つに分類される。\nD: 誤り。「買回品」に関する説明内容となっている。「専門品」は、自動車や高級衣料品など、購入にあたって特別な知識や趣味性を要する製品であり、競争上、ブランドの確立と維持が重要になる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n8.製品特性 P.62-63","source":"Excel: GMAP道場問題秋春(2).xlsx","no":188,"idx":188},{"id":"xlsx-2025春-マーケティング-9","season":"2025春","subject":"マーケティング","scope":"","question":"■問9.ブランドが持つ3つの機能について、下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・顧客が製品の情報を全て把握することは難しいが、（①）機能によってブランドが目印となり、購買に関する情報処理の時間やコストを節約できるようになる。\n\n・（②）機能は購買リスクの軽減・回避に役立つ効果があり、製品やサービスへの信頼が担保されることで、顧客は過去の購買体験やブランドに紐づく評判をもとに安心して購買の意思決定を行うことができる。\n\n・ブランドが持つイメージや世界観は（③）機能として、顧客の満足度向上やロイヤリティの向上に大きく影響を与える。\nA. ①識別　　　②意味づけ　③品質保証\nB. ①識別　　　②品質保証　③意味づけ\nC. ①意味付け　②品質保証　③識別\nD. ①品質保証　②識別　③意味づけ","answer":"■正解：B\n■解説：\n①識別機能\n　ブランドが目印となり、顧客が情報を処理する時間やコストを削減する役割を果たす。\n②品質保証機能\n　ブランドが持つ信頼性により、顧客は安心して購買の意思決定を行える。\n③意味付け機能\n　ブランドのイメージや世界観が、顧客の満足度やロイヤリティ向上に寄与する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n9．ブランド P.64-65","source":"Excel: GMAP道場問題秋春(2).xlsx","no":189,"idx":189},{"id":"xlsx-2025春-マーケティング-10","season":"2025春","subject":"マーケティング","scope":"","question":"問10.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・新市場を創造する場合などは最初から（①）がはっきりしているとは限らず、（②）発想による（③）開発が有効な場合も多い。\n・新製品開発の出発点は、製品（③）を考えることだ。\n・製品（④）は、関係者が共有し理解できるような明確な言葉で表すことが求められる。\nA. ①コンセプト　②アイデア　③シーズ　④ニーズ\nB. ①シーズ　②コンセプト　③ニーズ　④アイデア\nC. ①ニーズ　②シーズ　③アイデア　④コンセプト\nD. ①アイデア　②ニーズ　③コンセプト　④シーズ","answer":"■正解：C\n■解説：\n・新市場を創造する場合などは最初からニーズがはっきりしているとは限らず、シーズ発想によるアイデア開発が有効な場合も多い。\n・新製品開発の出発点は、製品アイデアを考えることだ。\n・製品コンセプトは、関係者が共有し理解できるような明確な言葉で表すことが求められる。\n■出典：グロービス マネジメントブック 改訂3版 　\n10.新製品開発 P.66-67","source":"Excel: GMAP道場問題秋春(2).xlsx","no":190,"idx":190},{"id":"xlsx-2025春-マーケティング-11","season":"2025春","subject":"マーケティング","scope":"","question":"■問11.製品ライフサイクルと関連する概念について、以下の記述のうち適切でないものを選択してください。\nA. 製品ライフサイクルと顧客タイプの割合は、イノベーター2.5%、アーリー・アダプタ\nー13.5%、フォロワー34%、レイト・フォロワー34%、ラガード16%である。\nB. 導入期のマーケティング課題は、製品の本質的な機能を認知させることなので、クチコミの威力を発揮するアーリー・アダプターをいかに取り込むかが鍵になる。\nC. ライフサイクル理論で注意すべき点は、すべての製品が同じように導入期、成長期、成熟期、衰退期というプロセスを限定することだ。\nD. 企業が時代の変化に関係なく、マーケティング戦略を固定し、修正を行わない活動をプロダクト・エクステンションと言う。","answer":"■正解：C．D\n■解説： C．Dは適切ではない。\nA：正解\nB：正解\nC：ライフサイクル理論で注意すべき点は、すべての製品が同じように導入期、成長期、成熟期、衰退期というプロセスをたどるとは限らないことだ。\nD： 企業が時代の変化に応じてマーケティング戦略を見直し、修正を重ねる活動をプロダクトエクステンションと言う。\n■出典：グロービス マネジメントブック 改訂3版 　\n11.製品ライフサイクル P.68-69","source":"Excel: GMAP道場問題秋春(2).xlsx","no":191,"idx":191},{"id":"xlsx-2025春-マーケティング-12","season":"2025春","subject":"マーケティング","scope":"","question":"■問12.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・価格は企業の収益性に大きな影響を与えるため、需給関係や（①）などを考慮しながら、戦略的な価格設定を心がける必要がある。\n\n・価格はまた、（②）に対するメッセージや、競合企業に対するシグナルとしても機能する。\n\n・価格変化の度合いに対する需要変化の度合いの比率を示す指標を（①）と言う。（①）が（③）場合は、価格を変更してもほとんど需要は変化しないが、（①）が（④）と、価格は変わると需要が大きく変化する。（①）はその製品のスイッチング・コストにも影響を受ける。\nA. ①価格弾力性　②消費者　　　　③大きい　④小さい\nB. ①心理的変数　②サプライヤー　③小さい　④大きい\nC. ①価格弾力性　②消費者　　　　③小さい　④大きい\nD. ①心理的変数　②サプライヤー　③大きい　④小さい","answer":"■正解：C\n■解説：\n・価格は企業の収益性に大きな影響を与えるため、需給関係や価格弾力性などを考慮しながら、戦略的な価格設定を心がける必要がある。（心理的変数はセグメンテーションの切り口である。最初の文に入らないこともないが、後述の文で文意が通らない）\n・価格はまた、消費者に対するメッセージや、競合企業に対するシグナルとしても機能する。（サプライヤーに対するメッセージとするにはあまりに婉曲的）\n・価格変化の度合いに対する需要変化の度合いの比率を示す指標を価格弾力性と言う。価格弾力性が小さい場合は、価格を変更してもほとんど需要は変化しないが、価格弾力性が大きいと、価格は変わると需要が大きく変化する。価格弾力性はその製品のスイッチング・コストにも影響を受ける。\n■出典：グロービス マネジメントブック 改訂3版 　\n12.価格と事業経済性 P.70-71","source":"Excel: GMAP道場問題秋春(2).xlsx","no":192,"idx":192},{"id":"xlsx-2025春-マーケティング-13","season":"2025春","subject":"マーケティング","scope":"","question":"■問13.価格決定に影響を与える要素について、以下A〜Dの中から誤っているものをすべて選択してください\nA.利益を確保するためにはコストを上回る価格が必要なので、コストが価格の最低限度(価格の下限)となる。コストは通常、固定費と変動費で構成されている。\nB.製造設備など固定比率が高い場合、固定費をカバーする(損益分岐点を超える)までは赤字だが、それ以降は売り上げ増加分のほとんどが利益になる。逆に、商社や小売店など変動費率が高い場合、製品一つ当たりの営業利益の最大化が目標となる。\nC.カスタマー・バリューとは「顧客が適正と認める金額」の事であり、価格設定における下限となる。\nD.競争上、自社の都合だけで価格を設定できず、競合の価格やその動向に影響を受ける場合がある。たとえば、砂糖やガソリンなど同質化できない商品では、1社が低い価格をつければ他社も追随せざるを得ない。","answer":"■正解：B、C、D\n■解説：B、C、Dは誤り\nA.正しい\nB..製造設備など固定比率が高い場合、固定費をカバーする(損益分岐点を超える)までは赤字だが、それ以降は売り上げ増加分のほとんどが利益になる。逆に、商社や小売店など変動費率が高い場合、製品一つ当たりの限界利益(価格-変動費)の最大化が目標となる。\n\nC.カスタマー・バリューとは「顧客が適正と認める金額」の事であり、価格設定における上限となる。\n\nD..競争上、自社の都合だけで価格を設定できず、競合の価格やその動向に影響を受ける場合がある。たとえば、砂糖やガソリンなど差別化できない商品では、1社が低い価格をつければ他社も追随せざるを得ない。競争環境の影響を避けたければ、機能やデザイン、ブランド、サービスなどの面で競合製品と明確に差別化することが求められる。\n■出典：グロービス マネジメントブック 改訂3版 　\n13.戦略的価格設定 P.72-73","source":"Excel: GMAP道場問題秋春(2).xlsx","no":193,"idx":193},{"id":"xlsx-2025春-マーケティング-14","season":"2025春","subject":"マーケティング","scope":"","question":"■問14.流通チャネルの意義について、誤っているものを全て選択してください。\nA.流通チャネルは、企業が効率的に製品を市場に届けたり、競争優位性を構築する上で重要な役割を果たす。製品特性や顧客特性、競合環境等を総合的に判断しながら最適な流通チャネルを設計しなくてはならない。\nB.流通チャネルは製品と顧客とのギャップを埋めるために、４つのフロー（物流、商流、金流、情報流）に関わっている。さらに、ファイナンス機能やリスク分担などの役割も担っている。\nC.流通チャネルの形態は、仲介業者の数によってゼロ段階から３段階まで分類される。例えば2段階チャネルはメーカーと消費者の間に仲介業者が一つ介在する場合を指す。\nD.その他の流通形態として、マルチレベル方式、フランチャイズ方式、ライセンス方式などの展開方法がある。","answer":"■正解：B・Cが誤り\n■解説：\nA：正しい\nB：誤り。流通チャネルは製品と顧客とのギャップを埋めるために、３つのフロー（物流、商流、情報流）に関わっている。\nC：誤り。\n　　ゼロ段階：メーカーが直接消費者に販売するケース。\n　　１段階　：メーカーと消費者の間に仲介業者が１つ介在する。\n　　２段階　：メーカーと消費者の間に、卸売業者と小売業者の２つが介在する。\n　　３段階　：メーカーと消費者の間に、卸売業者と二次卸、小売業者の３つが介在する。\nD：正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n14.流通チャネルの意義 P.74-75","source":"Excel: GMAP道場問題秋春(2).xlsx","no":194,"idx":194},{"id":"xlsx-2025春-マーケティング-15","season":"2025春","subject":"マーケティング","scope":"","question":"■問15.流通チャネルの構築は、ターゲット市場及び自社経営資源の把握をしたうえでA～Eの視点から行なう。また、人口動態、製品特性、顧客の購入スタイル、投資額や維持コスト、競合のチャネル政策、自社ブランド力、製品ラインやサービスの競争力などの要素を念頭に置きながら、マーケティング目標を達成するために適切なチャネルを考えなければならない。\n次の流通チャネルの構築プロセス　A～Eを正しい順に並べてください。\nA. チャネルの動機づけ政策の決定\nB. 流通チャネルの幅（密度）/　排他性の決定\nC. チャネル・メンバーの選定\nD. 流通チャネル長さの決定\nE. 展開エリアの決定","answer":"■正解：D→B→E→C→A\n■解説：\n流通チャネルの長さ：チャネルの段階数を決定する。特に流通業者を用いるかどうかの判断が求められる。\n流通チャネルの幅：流通業者の数を決定する。例えば顧客の利便性を最優先させるならば、流通業者の数を増やす方が良い。\n展開エリアの決定：販売エリアの広さを決定する。いっせいに全国展開を図る場合と、地域限定の場合では、プロモーション方法も必要な経営資源の量も全く異なる。\nチャネル・メンバーの選定：具体的にどのような企業と取引を行うのかの選定基準を明確に持たなければならない。\nチャネルの動機づけ政策：自社製品の販売に積極的に取り組んでもらえるようにチャネル・メンバーに対するインセンティブを検討する。\n■出典：グロービス マネジメントブック 改訂3版 　\n15．流通チャネルの構築プロセス P.76-77","source":"Excel: GMAP道場問題秋春(2).xlsx","no":195,"idx":195},{"id":"xlsx-2025春-マーケティング-16","season":"2025春","subject":"マーケティング","scope":"","question":"■問16.下記文章中の（①）～（⑥）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\nマーケティングの目的は最終的に顧客に自社製品を買ってもらうことだが、顧客が購買に至るまでには長い意思決定プロセスが存在する。一般的に認知、理解、愛好、選好、（①）、そして（②）の６段階のプロセスを経ると言われている。企業にとって、想定顧客が現在どの段階にいるかを知り、彼らがどのようなコミュニケーション方法によって（②）に近づけていくかが重要だ。\n　そのためには、潜在顧客に対して（③）を促し、（④）を持たせ、（⑤）を喚起し、（②）行動を起こさせるようなメッセージを伝えなければならない。これを、消費者の態度変容プロセス（各英単語の頭文字をとってAIDAモデル）という。\n　なお、AIDAモデルに（⑥）または記憶（Memory）を加えた「AIDMA」や、（①）を加えた「AIDCA」モデルも提唱されている。\nA. ①欲求、②購買、③興味、④注意、⑤動機づけ、⑥確信\nB. ①確信、②注意、③欲求、④購買、⑤動機づけ、⑥興味\nC. ①確信、②購買、③注意、④興味、⑤欲求、⑥動機づけ\nD. ①興味、②購買、③注意、④欲求、⑤確信、⑥動機づけ\n✽","answer":"■正解：Ｃ\n■解説：\nマーケティングの目的は最終的に顧客に自社製品を買ってもらうことだが、顧客が購買に至るまでには長い意思決定プロセスが存在する。一般的に認知、理解、愛好、選好、確信、そして購買の６段階のプロセスを経ると言われている。企業にとって、想定顧客が現在どの段階にいるかを知り、彼らがどのようなコミュニケーション方法によって購買に近づけていくかが重要だ。\n　そのためには、潜在顧客に対して注意を促し（Attention）、興味を持たせ（Interest）、欲求を喚起し（Desire）、購買行動を起こさせる（Action）ようなメッセージを伝えなければならない。これを、消費者の態度変容プロセス（AIDAモデル）という。\n　なお、AIDAモデルに動機づけ（Motive）または記憶（Memory）を加えた「AIDMA」や、確信（Conviction）を加えた「AIDCA」モデルも提唱されている。\n■出典：グロービス マネジメントブック 改訂3版 　\n16.購買決定プロセスとコミュニケーション手段 P.78-79","source":"Excel: GMAP道場問題秋春(2).xlsx","no":196,"idx":196},{"id":"xlsx-2025春-マーケティング-17","season":"2025春","subject":"マーケティング","scope":"","question":"■問17.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・広告戦略は（①）と（②）とに大別される。（①）の役割は「伝える場の確保」であり、（②）の役割は「伝えるべきメッセージづくり」である。\n\n・それぞれのメディアの特性を生かした（①）を考えなくてはならない。たとえば、一度に多くの情報を伝達しなければならない広告は（③）向きではないが、製品イメージを視覚・聴覚に直接訴えたい時にその力は絶大だ。\n\n・（②）は、企業が絞り込んだ製品の属性を、受け手に興味を持って受容してもらえる（④）に落とし込むことだ。伝えるべき属性をそのままストレートに伝達するだけで（④）が成立するケースはほとんどない。\nA. ①メディア戦略　②クリエイティブ戦略　③テレビ　④メディア・ミックス\nB. ①クリエイティブ戦略　②メディア戦略　③インターネット　④ポジショニング\nC. ①メディア戦略　②クリエイティブ戦略　③テレビ　④広告表現\nD. ①クリエイティブ戦略　②メディア戦略　③インターネット　④コミュニケーション","answer":"■正解：C\n■解説：\n・広告戦略はメディア(媒体)戦略とクリエイティブ(表現)戦略とに大別される。メディア戦略の役割は「伝える場の確保」であり、クリエイティブ戦略の役割は「伝えるべきメッセージ作りである」\n\n・それぞれのメディアには特性があり、それを生かしたメディア戦略を考えなくてはならない。たとえば、テレビは視覚や聴覚に訴求可能であるが、コストが高く情報量に制限がある。また、ターゲットに合わせてメディアを戦略的に組み合わせることを「メディア・ミックス」と呼ぶ\n\n・クリエイティブ戦略の第一歩は、企業が伝えるべき製品の属性を選び出すことで、第2のステップは企業が絞り込んだ製品の属性を、受けてに興味を持って受容してもらえる広告表現に落とし込むことだ。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n17．広告戦略 P.80-81","source":"Excel: GMAP道場問題秋春(2).xlsx","no":197,"idx":197},{"id":"xlsx-2025春-マーケティング-18","season":"2025春","subject":"マーケティング","scope":"","question":"■問18.セールス・プロモーションと販売戦略に関する以下のA〜Dの文章のうち、適切でないものを選択してください。\nA.広告が顧客の意識下に累積的にイメージを浸透させるプル効果を主目的とするのに対し、セールス・プロモーションは、顧客の関心を購買に直結させる意図を持つため、即物的な面が強い。\nB.流通チャネル向けのセールス・プロモーションは、報奨金や報奨旅行、コンテスト、リベートなどを用いて流通に働きかけることにより、流通側が単独あるいはメーカーと共同で能動的に顧客にプッシュすることを狙う。\nC.営業担当者には、潜在顧客の啓蒙、需要創造、ルーチン・サービス、テクニカル・サポートといった期待役割があり、その中でもとくに重要なのは潜在顧客の啓蒙と需要創造である。\nD.営業担当者のパフォーマンスは、教育や動機づけによって大きな差が生じる。指導や監督を行う場合のポイントは、営業担当者が邁進すべき方向を明確に示すことである。","answer":"■正解：C\n■解説：\nA：正しい。\nB：正しい。\nC：誤り。\n営業担当者の期待役割のうち特に重要なのは、需要創造と「テクニカル・サポート」である。\nD：正しい。\n■出典：グロービス マネジメントブック 改訂3版 　\n18. セールス・プロモーションと販売戦略 P.82-83","source":"Excel: GMAP道場問題秋春(2).xlsx","no":198,"idx":198},{"id":"xlsx-2025春-マーケティング-19","season":"2025春","subject":"マーケティング","scope":"","question":"■問19. 顧客維持型マーケティングに関する以下の記述のうち、適切なものを全て選択してください。\nA. 顧客維持型マーケティングは、広告費を増やし新規顧客を獲得することが中心的な戦略である。\nB. 顧客維持型マーケティングは、メーカーが最寄品の販売に活用するのに最も適した手法である。\nC. 顧客維持型マーケティングは、ライフスタイルの多様化や顧客ニーズの変化の加速化に対して、不確\n実性の高い見込み顧客に対してマーケティング資源を投じるターゲット・マーケティングのことである。\nD. 顧客維持型マーケティングでは、1人の顧客に何回買ってもらうかを重視する「ワン・トゥ・ワン・\nマーケティング（リレーションシップ・マーケティング）」の考え方が重要となる。","answer":"■正解：D\n■解説：\nA（誤り）：顧客維持型マーケティングは、既存顧客との関係を深め、リピーターを増やすことを目的\nとする。新規顧客獲得のために大量の広告を打つのではなく、顧客満足度の向上や継続的な関係構築が\n重要である。\nB（誤り）：最寄品（例：飲料、日用品など）は安価で流通が広く、メーカーが直接顧客と関係を築き\nにくいため、顧客維持型マーケティングには適さない。高価格・高関与の商材や、製品に占めるサービ\nス部分が大きいビジネスでは顧客との接点が増えるため、企業は顧客との関係維持により注力する必要\nがある。\nC（誤り）：ライフスタイルの多様化やニーズの変化の加速化は事実。しかし、顧客維持型マーケティ\nングは不確実性の高い見込み顧客に対してマーケティング資源を投じるものではなく、既存顧客との関\n係を重視する手法である。\nD（正しい）：「ワン・トゥ・ワン・マーケティング（リレーションシップ・マーケティング）」は、1\n人の顧客に何度も購入してもらうことを重視し、長期的な関係を築くことを目的とする。これは顧客維\n持型マーケティングの根幹となる考え方である。\n■出典：グロービス マネジメントブック 改訂3版 　\n19.顧客維持型マーケティング P.84-85\n25","source":"Excel: GMAP道場問題秋春(2).xlsx","no":199,"idx":199},{"id":"xlsx-2025春-マーケティング-20","season":"2025春","subject":"マーケティング","scope":"","question":"■問20.BtoBマーケティングの特徴や考え方について、誤っているものを全て選択してください。\nA.BtoBマーケティングでは、製品の開発や生産といった上流工程の付加価値が高いので、営業は単な\nる「ご用聞き」でよく、営業提案は特に必要ない。\nB.法人顧客による購買の意思決定の多くは、担当者とその上司のみによって下される。\nC.自社が提供する財が、他のどのような財とともに顧客のビジネスのバリューチェーンの中で位置づけ\nられているのかを「微視」的に把握することも、BtoBのマーケティング戦略を立てるうえで不可欠とな\nる。\nD.コモディティ化による価格競争を回避し、顧客の固有の課題に対応することで、独自の価値を創造し\nようという考え方は「プロダクト志向」と呼ばれる。","answer":"■正解：A,B,C,D全て\n■解説：\nA.製品の開発や生産といった上流工程の付加価値が高かった時代は、営業は単なる「ご用聞き」でよ\nかったが、市場が成熟化して製品・サービス（財）での差別化が難しくなるにつれ、付加価値の高い営\n業提案が求められる。これらを実現するために、BtoBマーケティングという枠組みでさまざまなマー\nケティング戦略が考案されるようになった。\nB.法人顧客による購買の意思決定の多くは、個人でなく、組織内外の数多い関係者の意向を受けて下さ\nれる。\nC.自社が提供する財が、他のどのような財とともに顧客のビジネスのバリューチェーンの中で位置づけ\nられているのかを「俯瞰」的に把握することも、BtoBのマーケティング戦略を立てるうえで不可欠とな\nる\nD.コモディティ化による価格競争を回避し、顧客の固有の課題に対応することで、独自の価値を創造し\nようという考え方は「ソリューション志向」と呼ばれる。\n■出典：グロービス マネジメントブック 改訂3版 　\n20.BtoBマーケティング P.86-87","source":"Excel: GMAP道場問題秋春(2).xlsx","no":200,"idx":200},{"id":"xlsx-2025春-マーケティング-21","season":"2025春","subject":"マーケティング","scope":"","question":"■問21.レピュテーション（評判）に関する以下A～Dの文章から、誤っているものをすべて選択してく\nださい。\nA.マーケティングの観点からは、ブランド力の重要な決定要因である。\nB. 形のないサービスや、高額で簡単に試用ができない製品・サービス（コンサルティングなど）は、レ\nピュテーションがとくに重要となる。\nC. 企業が注目しているのは、悪いレピュテーションを中期の段階で食い止めることだ。\nD. レピュテーション・マネジメントは、広義にはクライシス（不祥事や事故）対応、あるいはメディア\n対応を指すが、狭義には企業の評判維持・向上活動を指す。","answer":"■正解：C．D\n■解説： C．Dは適切ではない。\nA：正解\nB：正解\nC：企業が注目しているのは、悪いレピュテーションを初期の段階で食い止めるである。\nD：選択肢は広義と狭義の意味が逆になっている。レピュテーション・マネジメントは、広義には企業\nの評判維持・向上活動全体を指すが、狭義にはクライシス（不祥事や事故）対応、あるいはメディア対\n応を指す。\n【補足】レピュテーション・マネジメント\nとくに経営人の発言や行動は企業のレピュテーションに大きな影響を与えることから、欧米では経営陣\nを対象とした危機管理トレーニングやメディア・トレーニングなどを実施している企業が多い。\n■出典：グロービス マネジメントブック 改訂3版 　\n21.レピュテーション P.88-89","source":"Excel: GMAP道場問題秋春(2).xlsx","no":201,"idx":201},{"id":"xlsx-2025春-マーケティング-22","season":"2025春","subject":"マーケティング","scope":"","question":"■問22.マーケティング思考について述べた以下の文から、誤っているものを全て選んでください。\nA.マーケティングの活動範囲は営業活動や広告、市場調査などに限定されない。企業のあらゆる活動を\nコーディネートしながら、顧客にとって価値のある製品や情報を提供していくという一連のプロセスを\n計画・推進し、コントロールする重要な役割を担っている。\nB.マーケティングは顧客満足を軸に「買ってもらえる仕組み」を考える活動であり、継続的に成長して\nいくために、いかに顧客のニーズを満たすかという発想に立っている。\nC.マーケティングでは、顧客の維持・創造よりも、今日の売上を確保するという短期志向型の考え方が\n優先される。\nD.顧客の欲求を表す概念として、「ニーズ」と「ウォンツ」がある。","answer":"■正解：C\n■解説：\nC：今日の売上を確保するという短期販売戦略は、「売り込む手段」を考えるセリング。「顧客に買っ\nてもらえる仕組みをつくること」であるマーケティングとは異なる考え方であり、誤り。\nA・B・Dは正しく、記載のとおり。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.マーケティングの発想 P.48-49","source":"Excel: GMAP道場問題秋春(2).xlsx","no":202,"idx":202},{"id":"xlsx-2025春-マーケティング-23","season":"2025春","subject":"マーケティング","scope":"","question":"■問23.マーケティング戦略の階層について、下記文章中の（①）～（⑤）に入る語句の組み合わせと\nして適切なものを選択肢A~Dのうちから選んでください。\n・経営戦略は経営理念とビジョンを起点に、(　①　)戦略、(　②　)戦略、機能戦略という階層構造を\n形成している。マーケティング戦略も同様に、(　①　)レベル、(　②　)レベル、(　③　)レベルの各視\n点で考えなければならない。\n・マーケティング戦略は、扱っている製品について「だれに何をいくらで売るか。それをどのように(　\n④　)させ、どのように供給するか」ということをトータルで考えていく。\n・(　②　)マーケティングはセグメンテーションやターゲティング、ポジショニング、(　⑤　)などの\nマーケティング戦略の根幹を担っている。製品間の調整を図る時にも、(　②　)レベルでの視点が必要\nである。\nA. ①全社　②部門　③製品　④購入　⑤マーケティング・ミックス\nB. ①事業　②個人　③意識　④認知　⑤プロダクトアウト\nC. ①全社　②事業　③製品　④認知　⑤マーケティング・ミックス\nD. ①事業　②部門　③意識　④購入　⑤プロダクトアウト","answer":"■正解：C\n■解説：\n・経営戦略は経営理念とビジョンを起点に、全社戦略、事業戦略、機能戦略という階層構造を形成して\nいる。マーケティング戦略も同様に、全社レベル、事業レベル、製品レベルの各視点で考えなければな\nらない。\n・マーケティング戦略は、扱っている製品について「だれに何をいくらで売るか。それをどのように認\n知させ、どのように供給するか」ということをトータルで考えていく。\n・事業マーケティングはセグメンテーションやターゲティング、ポジショニング、マーケティング・\nミックスなどのマーケティング戦略の根幹を担っている。製品間の調整を図る時にも、事業レベルでの\n視点が必要である。\n■出典：グロービス マネジメントブック 改訂3版 　\n2．マーケティングの役割 P.50-51\n29","source":"Excel: GMAP道場問題秋春(2).xlsx","no":203,"idx":203},{"id":"xlsx-2025春-マーケティング-24","season":"2025春","subject":"マーケティング","scope":"","question":"■問24.マーケティング・マネジメントについて、誤っているものを全て選択してください。\nA.マーケティング・プロセスは①マーケティング環境分析と市場機会の発見、②セグメンテーション、\n③ターゲティング、④ポジショニング、⑤マーケティング・ミックス（4P）という5つのステップに大\n別される。このプロセスは基本的に一方的な流れになる。\nB.上記のステップのうちセグメンテーションとは、市場を構成するさまざまなセグメントの中から、自\n社が事業を展開するのに最も相応しいセグメントを選び出すことだ。\nC.マーケティング・プロセスを円滑に進めるには、マーケティング活動を効率的かつ効果的に運用でき\nるような体制を整えなくてはならない。成果を最大化するためには組織構造や職務設計、人事システム、\n人員配置、評価・報酬の仕組み、計画設定や予算管理の徹底が必要だが、情報システムの構築はさほど\n重要ではない。","answer":"■正解：全て誤り\n■解説：\nA：誤り。マーケティング・プロセスは5つではなく6つのプロセスに大別され、このプロセスは必ず\nしも一方的な流れではなく、行きつ戻りつすることもある。\n＜マーケティングプロセスの6つのステップ＞\n①マーケティング環境分析と市場機会の発見\n②セグメンテーション\n③ターゲティング\n④ポジショニング\n⑤マーケティング・ミックス（4P）\n⑥マーケティング施策の実行と評価\nB：誤り。セグメンテーションとは、環境分析の結果を踏まえて、不特定多数の人々を、同じニーズを\nもつ固まりに分けること。問題文は「ターゲティング」の説明。\nC：誤り。マーケティング・プロセスを円滑に進めるには、情報システムの構築も重要。マーケティン\nグ計画の策定、実行、評価には、市場環境や競合動向、販売状況などの情報が欠かせない。有効な情報\nを迅速かつ確実に収集し、的確に活用する能力の有無が競争上の命運を分ける。\n■出典：グロービス マネジメントブック 改訂3版 　\n3.マーケティング・マネジメント P.52-53","source":"Excel: GMAP道場問題秋春(2).xlsx","no":204,"idx":204},{"id":"xlsx-2025春-マーケティング-25","season":"2025春","subject":"マーケティング","scope":"","question":"■問25.　 マーケティングにおける「市場の機会の発見」に関する次の文章のうち、正しいものを全て\n選んでください。\nA. 自社にとっての市場の機会とは、「他社にない強みを発揮できる舞台」を指す。環境分析を行い、他\n社に対して競争優位を発揮できるような市場機会を創造的に発見することが重要である。\nB.　マーケティング環境の分析では、自社ではコントロールできない外部環境と、コントロール可能な\n内部環境を見る。外部環境ではマクロ環境、市場（顧客）、競合について、内部分析では自社の経営資\n源や強みと弱みなどを明らかにする。\nC.　SWOT分析とは内部分析による自社の強み（Strengths）・脅威（Threats）と外部分析による市\n場の機会（Opportunities）・弱み（Weaknesses）を掛け合わせて総合的に判断する為のフレーム\nワークである。\nD.　ある事象を発見したとき、企業はそれをすぐに「脅威」と考えるのではなく、これを「機会」に出\n来ないだろうかと問う姿勢が大切である。","answer":"■正解：A、B、D\n■解説：\nA.　正しい\nB.　正しい\nC. 　誤り　脅威（Threats）と・弱み（Weaknesses）が入れ替わっている。\nSWOT分析とは内部分析による自社の強み（Strengths）・弱み（Weaknesses）と外部分析による市\n場の機会（Opportunities）・脅威（Threats）を掛け合わせて総合的に判断する為のフレームワーク\nである。\nD.　正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n4.　市場の機会発見　P54-55","source":"Excel: GMAP道場問題秋春(2).xlsx","no":205,"idx":205},{"id":"xlsx-2025春-マーケティング-26","season":"2025春","subject":"マーケティング","scope":"","question":"■問26.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢AからDのう\nちから選んでください。\n　マーケティング・リサーチの目的は、マーケティング上の戦略「（①）」を「（②）」することにあ\nる。マーケティング戦略を実りあるものにするには、リサーチにおいて明確な（③）を持ち、市場の状\n況を的確に把握できる（④）を選択・活用する必要がある。\nA. ①仮説、②検証、③手段、④目的\nB. ①検証、②仮説、③目的、④手段\nC. ①目的、②手段、③仮説、④検証\nD. ①仮説、②検証、③目的、④手段","answer":"■正解：D\n■解説：\n　マーケティング・リサーチの目的は、マーケティング上の戦略「仮説」を「検証」することにある。\nマーケティング戦略を実りあるものにするには、リサーチにおいて明確な目的を持ち、市場の状況を的\n確に把握できる手段を選択・活用する必要がある。\nマーケティングでは市場調査やシェア分析、製品選好分析、販売予想、広告効果分析など、目的別に\n様々なリサーチが行われる。\nリサーチでは、現状から考えられる仮説と予測される結果を必ず事前に考え、調査結果との違いを評価\nする、仮説検証型のアプローチが望ましい。とりあえず手に入るデータを集めて、そこから最終結論を\n導く方法は、無駄が多く誤った結論を得る可能性が高い。\nリサーチは通常、①リサーチ目的の設定、②仮説の設定、③リサーチの設計と実施、④仮説の検証とい\nう手順が行われる。\n■出典：グロービス マネジメントブック 改訂3版 　\n5.マーケティング・リサーチ P.56-57","source":"Excel: GMAP道場問題秋春(2).xlsx","no":206,"idx":206},{"id":"xlsx-2025春-マーケティング-27","season":"2025春","subject":"マーケティング","scope":"","question":"■問27.セグメンテーションとターゲティングについて、正しいものをすべて選択してください。\nA.セグメンテーションとは、不特定多数の顧客を同じ性質やニーズをもつセグメント（固まり）に分け\nることである。\nB.ターゲティングとは単一顧客を選定することである。\nC.セグメンテーションは、どのような軸（セグメンテーション変数）で分けるかがポイントになる。従\n来は地理的変数、人口動態変数がよく用いられていたが、最近は消費者ニーズの多様化や個性化に合わ\nせて、心理的変数や行動変数（例:購買頻度や購買動機）が重視されるようになった。\nD.ターゲティングの検討にあたっては3点（3R）に注意し、総合的に判断しなくてはならない。\n1. 有効な市場規模 (Realistic Scale): その事業あるいは商売が成立する最低限の規模を獲得できるセグ\nメントでなければならない。\n2. 成長性 (Rate of Growth): 一般に、市場の生成期や成長段階の初期に、売上やシェア獲得の大きな\nチャンスがある。\n3. 顧客の優先順位／波及効果 (Rank／Ripple Effect): もし周囲への影響力の強いセグメントがあるな\nらば、優先的にアプローチをすべきである。","answer":"■正解：AとC\n■解説：\nA.正しい。\nB.誤り。ターゲティングは標的市場の選定である。\nC.正しい。\nD.誤り。ターゲティングの検討にあたっては6点（6R）に注意し、総合的に判断しなくてはならない。\n設問では6Rのうち3点しか言及されておらず、総合的に判断するには抜け漏れがある。\n6Rとは\n1. 有効な市場規模 (Realistic Scale)\n2. 成長性 (Rate of Growth)\n3. 顧客の優先順位／波及効果 (Rank／Ripple Effect)\n4. 到達可能性（Reach）\n5. 競合状況（Rival）\n6. 反応の測定可能性（Response）\n■出典：グロービス マネジメントブック 改訂3版 　\n6.セグメンテーションとターゲティング P.58-59","source":"Excel: GMAP道場問題秋春(2).xlsx","no":207,"idx":207},{"id":"xlsx-2025春-マーケティング-28","season":"2025春","subject":"マーケティング","scope":"","question":"■問28.ポジショニングに関する以下のA?Dの文章のうち、適切でないものを選択してください。\nA.いくら魅力的なポジショニングを考えていても、それをきちんと伝えるコミュニケーションの努力が\nなければ、顧客の頭の中に像は結ばれない。\nB.ポジショニングは製品コンセプトに落とし込まれるが、マーケティング・ミックス戦略を規定してい\nくことはない。\nC.製品のポジショニングが売り手企業自体やその既存製品のポジショニングと整合していないと、顧客\nに混乱した印象を与えるだけでなく、既存製品の売上げや企業全体のイメージにも悪影響を与える可能\n性がある。\nD.優れたポジショニングが想定する顧客イメージは、実際にその製品を購入すると想定されるターゲッ\nト顧客とは異なる場合がある。顧客の実像と彼らが他人にどう思われたいのかは異なる場合が多いこと\nを意識しておかなければならない。","answer":"■正解：B\n■解説：\nA:正しい。\nB:誤り。ポジショニングは製品コンセプトに落とし込まれ、流通チャネルやコミュニケーションなどの\nマーケティング・ミックス戦略を規定していく。\nC:正しい。\nD:正しい。\n■出典：グロービス マネジメントブック 改訂3版 　\n7.ポジショニング P.60-61","source":"Excel: GMAP道場問題秋春(2).xlsx","no":208,"idx":208},{"id":"xlsx-2025春-マーケティング-29","season":"2025春","subject":"マーケティング","scope":"","question":"■問29.製品特性に関する以下の記述のうち、適切なものを全て選択してください。\nA. 専門品とは、自動車や高級衣料品など、購入にあたって特別な知識や趣味性を要する製品のことで、\n競争上、ブランドの確立と維持が重要である。\nB. 最寄品とは、家具や衣類などいくつかの製品を比較検討して買う製品のことで、価格と機能のバランス\nがポイントとなる。\nC. 耐久財は、食品や洗剤のように、一度購入すればすぐに消費されるため、再購入を促すことが課題と\nなる。\nD. サービスは、輸送や金融、ホテルなどの無形の製品を指し、一度提供されると修正や返品ができない\nため、売り手に対する信頼性が重要となる。","answer":"■正解：A,D\n■解説：\nA（正しい）：\n専門品は、自動車や高級衣料品のように、購入にあたって特別な知識や趣味性を要する製品である。消\n費者はブランドや品質を重視し、比較的長期間にわたって慎重に購入を検討する。競争戦略として、ブ\nランドの確立と維持が重要となる。\nB（誤り）：\n最寄品は、食品や飲料など、消費者が特別な努力を払わずに頻繁に購入する製品であり、小売店での広\n範な流通が売上向上の鍵となる。 家具や衣類は、消費者がいくつかの製品を比較検討して購入する「買\n回品」に分類される。\nC（誤り）：\n耐久財は、自動車や家電製品など、長期間にわたり繰り返し使用できる有形の製品を指す。食品や洗剤\nのように一度購入するとすぐに消費されるものは「非耐久財」に分類され、再購入を促すことが課題と\nなる。\nD（正しい）：\nサービスは、輸送、金融、ホテルなどの無形の製品を指し、一度提供されると物理的な修正や返品がで\nきないため、売り手の信頼性が重要となる。\n■出典：グロービス マネジメントブック 改訂3版 　\n8.製品特性 P.62-63","source":"Excel: GMAP道場問題秋春(2).xlsx","no":209,"idx":209},{"id":"xlsx-2025春-マーケティング-30","season":"2025春","subject":"マーケティング","scope":"","question":"■問30.マーケティングにおけるブランド体系の説明として、正しいものを選択してください。\nA.コーポレートブランド：企業内の事業単位がブランドとして認知され、商品名にも展開されているも\nの\nB.事業ブランド：企業総体としてブランドが認知され、商品名にも展開されているもの\nC.ファミリーブランド：いくつかの商品カテゴリーをまたがった包括的なブランドとして認知されてい\nるもの\nD.商品ブランド：１つの核となるブランドから派生したバリエーションを多く持つもの","answer":"■正解：C\n■解説：\nAは事業ブランド、Bはコーポレートブランド、Dは商品群ブランドの説明である。\n■出典：グロービス マネジメントブック 改訂3版 　\n9.ブランド P.64-65","source":"Excel: GMAP道場問題秋春(2).xlsx","no":210,"idx":210},{"id":"xlsx-2025春-経営戦略-1","season":"2025春","subject":"経営戦略","scope":"1. 経営戦略の意義と企業の目的","question":"■問1. 経営戦略の意義と企業の目的について、下記文章中の①～⑤の組み合わせとして適切なものを、以下の選択肢A～Dの中から選んでください。\n・企業を成長・存続させるためには、企業が進むべき方向性を示し、自社の（①）を持続させる実現可能な方策（戦略）を打ち出さなくてはならない。\n・戦略策定では方向性を示さなくてはならないが、その前にまず企業の（②）を知っておく必要がある。\n・経営者の第一の使命は（③）の最大化である。（③）の最大化のためには（④）にとっての価値を最大化する必要がある。（④）に支持されない企業は業績を伸ばすことが出来ず、企業価値や株価を高めることも出来ないからだ。\n・企業変革の担い手は（⑤）であることも多い。トップ・マネジメントには、企業の目指す方向性やビジョンの提示、その実現に向けてのステークホルダーを巻き込む力、過去の成功体験に捉われずに変化を受け入れる度量の広さが求められる。\n\nA：①経営資源、②目的、③利益、④顧客、⑤リーダー\nB：①競争優位、②戦略、③株主価値、④従業員、⑤外部関係者\nC：①競争優位、②目的、③株主価値、④顧客、⑤ミドル・マネジメント\nD：①経営資源、②戦略、③利益、④従業員、⑤ステークホルダー","answer":"■正解：C\n■解説：\n・戦略にはさまざまな定義があるが、「企業あるいは事業の目的を達成する為に、持続的な競争優位を確立すべく構造化されたアクション・プラン」と定義されている。\n・戦略策定では方向性を示さなくてはならないが、その前にまず企業の目的を知っておく必要がある。そもそも、企業は何のために日々の活動を行っているのかを、理解しておく必要がある。\n・経営者の第一の使命は株主価値の最大化である。欧米では「企業は株主のもの」という考え方が一般的である。しかし、株主だけを重視していればよいというわけでもない。株主価値の最大化のためには顧客にとっての価値を最大化する必要がある。顧客に支持されない企業は業績を伸ばすことが出来ず、企業価値や株価を高めることも出来ないからだ。\n・リーダーシップはトップだけに求められるものではなく、企業変革の担い手はミドル・マネジメントであることも多い。トップのコミットメントだけでは企業は変わらず、ミドル・マネジメント層が事業や機能のレベルで変革を担うことが必要となる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n1. 経営戦略の意義と企業の目的P.2-3","source":"Excel: GMAP道場問題秋春(2).xlsx","no":211,"idx":211},{"id":"xlsx-2025春-経営戦略-2","season":"2025春","subject":"経営戦略","scope":"2.経営理念と戦術レベル","question":"■問2.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n経営戦略は、企業の現実の姿と経営理念やビジョンとの間にあるギャップを埋めるための具体的な方法論を示すものであり、通常、3つの戦略レベルで策定される。\n（①）では、どの事業領域（事業ドメイン）で戦い、何を競争力の源泉とし、どのような事業の組み合わせ（事業ポートフォリオ）を持ち、どのように経営資源を配分するかを決定する。\n（②）では、個別の事業分野において競争に勝ち抜くための分析を行い、具体的なアクション・プランを策定・実施する。\n（③）では、営業戦略や財務戦略、人事戦略などの施策を機能別に落とし込み、上位の戦略をどのように実施していくかを考える。\nいずれのレベルにおいても、経営理念やビジョンとの一貫性と、他の戦略レベルとの整合性を保つことが重要である。\n\nA. ①事業戦略　②全社戦略　③機能戦略\nB. ①機能戦略　②事業戦略　③全社戦略\nC. ①全社戦略　②事業戦略　③機能戦略\nD. ①全社戦略　②機能戦略　③事業戦略","answer":"■正解：C\n■解説：\n①全社戦略\nどの事業領域（事業ドメイン）で戦い、何を競争力の源泉とし、どのような事業の組み合わせ（事業ポートフォリオ）を持ち、どのように経営資源を各事業に配分するかを決定するのが全社戦略である。複数の事業を抱える企業（多角化企業）の場合は、どの事業に優先的にリソースを投下するかなど、企業全体の視点で最適化を図る必要がある。\n②事業戦略\n個別事業の視点から競争に勝ち抜くための戦略を策定する。市場を分析し、競合企業や顧客動向を把握したうえで、具体的なアクション・プランを立てるのが事業戦略の役割。特定市場における企業間の競争を分析し、最適な戦略を具体化していく。\n③機能戦略\n営業戦略や財務戦略、人事戦略など、事業戦略を実現するための施策を機能別に落とし込み、実行計画を策定する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n2.経営理念と戦術レベル P.4-5","source":"Excel: GMAP道場問題秋春(2).xlsx","no":212,"idx":212},{"id":"xlsx-2025春-経営戦略-3","season":"2025春","subject":"経営戦略","scope":"3.戦略策定プロセス","question":"■問3.戦略策定プロセスの概要について、（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A～Dの中から選んでください。\n・（　①　）：戦略目標を設定する際の思想的なバックボーンとなる。\n・環境分析：環境分析では、自社を取り巻く内外の環境に目を配る。（　②　）は自社が直接コントロールできない社外の環境を指す。大きなトレンドや変化の兆しを明らかにしたり、市場のニーズや競争環境を把握することは、市場における機会と脅威の発見につながる。一方、（　③　）では自社がコントロール可能な経営資源が分析の対象だ。経営資源や自社の構造上の強みや弱みを冷静に把握することにより、自社にとってのビジネスチャンスを見つけやすくなる。\n・（　④　）の抽出：環境分析の結果を踏まえて、当該事業を成功させるための要件を探り、それを実現させるために何をすべきかを検討する。\n\nA：①経営理念・ビジョン、②内部環境、③外部環境、④戦略オプション\nB：①経営戦略、②外部環境、③内部環境、④戦略オプション\nC：①経営理念・ビジョン、②外部環境、③内部環境、④成功要因\nD：①経営戦略、②内部環境、③外部環境、④成功要因","answer":"■正解：C\n■解説：\n戦略策定プロセスとは、経営理念やビジョンを実行可能なアクション・プランに落とし込む際の基本的な流れを指す。このプロセスは一方通行の流れではなく、仮説・検証を繰り返したり、実施結果や環境変化に応じて戦略の見直しを行うことも大切だ。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n3.戦略策定プロセスP.6-7","source":"Excel: GMAP道場問題秋春(2).xlsx","no":213,"idx":213},{"id":"xlsx-2025春-経営戦略-4","season":"2025春","subject":"経営戦略","scope":"4. 全社戦略の構成要素（１）：ドメイン","question":"■問 4.ドメインの説明として、誤っているものを選択してください。\nA.ドメインの決定とは、自社の戦う場所を決めるだけではなく、戦わない場所も明らかにすることである。\nB.ドメインを決めるときには、製品軸（製品やサービス）・市場軸（市場ニーズ）から定義する方法がある。\nC.ドメインを決めるときのポイントは、自社の強みを発揮できそうになくても、大きな領域を定義する。\nD. 市場ニーズの変化に合わせてドメインの広さや、切り口を変えたりすることが求められる。","answer":"■正解：Cのみ\n■解説：\n全社戦略の構成要素は①ドメイン（事業を展開する領域）、②コア・コンピタンス（企業の中核的な力）、③資源配分（経営資源の全体的な最適化）に注目します。\nドメインを決めるときのポイントは、自社の強みを十分に発揮できるかどうかです。\n製品軸から定義し事業展開しているカゴメは、【トマト】を軸に種子、栽培、加工などの事業を展開しています。\n市場軸から定義し事業展開しているシティバンクは、同じような性格を持つ顧客をひとくくりにして、その顧客層をターゲットとして事業をドメインとするやり方をとっています。\nA、B、Dは正解です。\n■出典：グロービス マネジメントブック 改訂3版 　\n4．全社戦略の構成要素（１）：ドメイン P.8-9","source":"Excel: GMAP道場問題秋春(2).xlsx","no":214,"idx":214},{"id":"xlsx-2025春-経営戦略-5","season":"2025春","subject":"経営戦略","scope":"5. 全社戦略の構成要素（２）：コア・コンピタンスと資源配分","question":"■問5.以下「全社戦略の視点」についての文章の( )に入る言葉を、A～Mから選んでください。\n全社戦略を考える上で主に３つの視点がある。1つ目の視点はドメインである。※全社戦略の構成要素(１）で出題・解説\n2つ目の視点は、コア・コンピタンスの選択と(①)だ。コア・コンピタンスとは、企業内部に培ったさまざまな能力のうち、競争のための手段として最も有効なものを指す。\nコア・コンピタンスを見極める場合、(②)可能性、移転可能性、代替可能性、稀少性、(③)性について考える必要がある。（②）、移転、代替の可能性が（④）ほど、又、稀少性、（③）性が高いほど（⑤）は持続しやすくなる。\n全社戦略における3つめの視点は、自社の事業や製品に対する資源配分だ。特に複数の事業を持つ企業の場合は、(⑥)的な視点で適正な資源配分を考える必要がある。適正な資源配分を行うためには、各事業の現状把握と、(⑦)の設定や投資方針の決定が必要である。\n不足している経営資源や能力は、社内で(①)する以外に、他企業を買収して取り込んだり、アライアンスやアウトソーシングなどで外部資源による補完を行う。\nA.機能 B.育成 C.蓋然 D.高い E.事業 F.経営理念 G.全社 H.低い I.事業目的 J.調達 K.競争優位\nL.耐久 M.模倣","answer":"■正解：①－B.育成、②－M.模倣、③－L.耐久、④－H.低い、⑤－K.競争優位、⑥－G.全社、⑦－I.事業目的\n■解説：\n・全社戦略の2つ目の視点は、コア・コンピタンスの選択と（育成）。\n・コア・コンピタンスを見極める場合、①（模倣）可能性、②移転可能性、③代替可能性、④稀少性、⑤（耐久）性の5つを考える必要がある。①、②、③の可能性が（低い）ほど、④、⑤が高いほど、（競争優位）は持続しやすい。\n・全社戦略の3つ目の視点は、自社の事業や製品に対する資源配分。\n・複数の事業を持つ企業は、個々の事業の成否だけでなく、（全社）的な視点で適正な資源配分を考える必要がある。\n・適正な資源配分を行うためには、各事業の状況を明らかにしたうえで、（事業目的）の設定や投資方針の決定を行う必要がある。\n・不足している経営資源や能力は、社内で（育成）する以外に、他企業の買収で取り込む方法やアライアンス、アウトソーシングなどのように外部資源を用いて補完する方法がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n5．全社戦略の構成要素(2)：コア・コンピタンスと資源配分 P.10-11","source":"Excel: GMAP道場問題秋春(2).xlsx","no":215,"idx":215},{"id":"xlsx-2025春-経営戦略-6","season":"2025春","subject":"経営戦略","scope":"6.事業ポートフォリオと事業ライフサイクル","question":"■問6.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n事業ライフサイクルの4段階を下記文章中の(①)～(④)に入る語句の組み合わせとして適切なものを選択肢A～Dから選んで下さい。\n\n・導入期は売上高も利益も低くキャッシュフローも(①)だ。競合企業はほとんどないが、需要拡大のために顧客に対するPR活動に力を入れる必要がある。\n・成長期になると売上高が急速に伸び利益も上昇する。キャッシュフローも(②)に転じるが、競合他社の参入は増える。競争が激しくなるため、他社との（③）を図る必要がある。\n・成熟期になると売上高は(④)に転じ、利益も低下するが、投資額が少ないためキャッシュフローはプラスになる。競争は激化するため、競争上の優位性が築けなければ敗者となる。\n・衰退期になると売上高は低下し、利益も減少する。新規投資が不要なため一部のリーダー企業は利益を出すことができるが、安定した利益を上げ続けるには(⑤)の追求が不可欠である。\n\nA．①マイナス　②プラス　　③区別化　　④高成長　　⑤効率性\nB．①マイナス　②プラス　　③差別化　　④高成長　　⑤効率性\nC．①マイナス　②プラス　　③差別化　　④低成長　　⑤効率性\nD．①プラス　　②マイナス　③差別化　　④低成長　　⑤収益性","answer":"■正解：C\n■解説：\n市場の成長性や適正な資源配分を考えるときは、事業ライフサイクルを理解しておくとよい。これは「ある製品や市場は必ず誕生から衰退迄の流れを持ち、その段階に応じてとるべき戦略は異なる」とする考え方で、各段階で競争環境や顧客のニーズ、必要な資金、戦略課題が変わることに注意が必要だ。\n■出典：グロービス マネジメントブック 改訂3版 　\n6.事業ポートフォリオと事業ライフサイクル P.12-13","source":"Excel: GMAP道場問題秋春(2).xlsx","no":216,"idx":216},{"id":"xlsx-2025春-経営戦略-7","season":"2025春","subject":"経営戦略","scope":"7. ポートフォリオ・マトリクス","question":"■問７.下記文章中の（①）～（⑥）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n間取り図、青写真・設計図、、「5 對 花形事業 (Star) 問題児 (Question Mark) 金のなる木 金のなる木（CashCow) (Cash Cow) 負け犬 我 (Dog)」というテキストの画像のようです\nA. ①高い　②低い　③高い　④低い　⑤市場成長率　⑥相対マーケットシェア\nB. ①高い　②低い　③高い　④低い　⑤相対マーケットシェア　⑥市場成長率\nC. ①高い　②低い　③低い　④高い　⑤営業利益率　⑥マーケットシェア\nD. ①高い　②低い　③低い　④高い　⑤売上成長率　⑥相対マーケットシェア","answer":"■正解：A\n■解説：\nPPMは、マトリックスの縦軸と横軸で示されるものを正しく図解し、整理しておくと理解が深まります。これは資源配分や成長戦略の意思決定に活用されるもので、事業ポートフォリオ構築の3要素のうち、事業の魅力度を市場成長率から、競争上の優位性を相対マーケットシェアから以下の4つのカテゴリに分類したモデルです。\n花形事業（Star）\n市場成長率：高、相対マーケットシェア：高\n戦略: 現在のシェアを維持しつつ成長するための積極投資を継続し、金のなる木に育てる\n金のなる木（Cash Cow）\n市場成長率：低、相対マーケットシェア：高\n戦略:投資をシェアの維持に必要な最小限度にとどめて収益を上げ、キャッシュを回収する戦略をとり、他の事業への資金源とする\n問題児（Question Mark）\n市場成長率：高、相対マーケットシェア：低\n戦略: 早いうちに集中投資をしてシェアを拡大し花形事業を目指すか、思い切って撤退するかの、「選択と集中」の投資判断が必要\n負け犬（Dog）\n市場成長率：低、相対マーケットシェア：低\n戦略: 維持コストを最小限にするか、見込みがないため、買い手がいるうちに売却するなどの撤退戦略の検討\n■出典：グロービス マネジメントブック 改訂3版 　\n７．ポートフォリオ・マトリクス P.14-15","source":"Excel: GMAP道場問題秋春(2).xlsx","no":217,"idx":217},{"id":"xlsx-2025春-経営戦略-8","season":"2025春","subject":"経営戦略","scope":"8. 事業拡大と多角化の基本戦略","question":"■問8.以下の選択肢のうち、事業の多角化の説明として適切でないものを選んでください。\nA.多角化によって企業全体として収益源が複数になることで、リスク分散の効果が期待できる。\nB.本業との共通性を確保することにより、流通チャネルや技術、製造、人材、ブランド、ノウハウ管理などに関して、コスト面や付加価値面でのシナジーが得られる。\nC.多角化によって企業の事業ドメインが明確になり、経営資源の集中がしやすくなる。\nD.多角化とは、アンゾフの事業拡大マトリクスにおいて、新製品を新市場に展開する戦略を指す。","answer":"■正解：C\n■解説：\n多角化のジレンマとして、多角化を重ねることで事業ドメインが曖昧になり、本業を見失う危険がある。その結果、企業の求心力が弱まったり、経営資源の分散化が進み、どの分野でも優位性を保てなくなるリスクもあるため、Cの「事業ドメインが明確になり、経営資源の集中がしやすくなる」は誤りである。\nA/B: 多角化のメリットとして、「収益源の多様化によるリスク分散」や「本業との共通性を活かしたシナジーの発揮」がある。\nD: アンゾフの事業マトリクスにおいて「多角化」は「新製品を新市場に展開する戦略」と定義されている。\n■出典：グロービス マネジメントブック 改訂3版 　\n8. 事業拡大と多角化の基本戦略 P.16-17","source":"Excel: GMAP道場問題秋春(2).xlsx","no":218,"idx":218},{"id":"xlsx-2025春-経営戦略-9","season":"2025春","subject":"経営戦略","scope":"9.競争優位を築くための基本戦略","question":"■問9.下記文章中の（①）～（⑤）に入る語句の組み合わせとして、適切なものを選択肢A~Dのうちから選んでください。\n・（①）は、コストを中心に競争優位を確立することに主眼を置くもので、「競合他社よりも（②）コストを実現する事」が基本テーマとなる。\nこの戦略の勝ちパターンは、大規模な生産設備への投資をいち早く行い、大量生産体制を整える。そして、参入当初は赤字覚悟の上で早期シェア獲得を目指すペネトレーション・プライシング（市場浸透価格戦略）を行う。高シェアを確保すれば、規模の経済と経験曲線が機能し、更に（②）コストを実現できるようになる。\n・（③）は、「自社製品を差別化し、業界の中でもユニークだと見られる何かを創造すること」が基本テーマである。ユニークさとは、顧客に価値として認識され、競合が簡単に模倣できないものでなければならない。\n・（④）は、「特定の顧客層、特定の製品、特定の市場など、限られた領域に対し、企業の経営資源を集中すること」が基本テーマである。（①）や（③）との違いは、特定の（⑤）だけを狙う点であり、（⑤）を絞り込むことで、競合他社に比べて効果的、かつ効率よく戦うことができる考えである。\nA. ①コスト・リーダーシップ戦略　②高い　③集中戦略　　④差別化戦略　⑤設備\nB .①コスト・リーダーシップ戦略　②低い　③差別化戦略　④ＴＴ戦略　　⑤ターゲット\nC. ①差別化戦略　　　　　　　　　②低い　③集中戦略　　④市場浸透　　⑤設備\nD. ①コスト・リーダーシップ戦略　②低い　③差別化戦略　④集中戦略　　⑤ターゲット","answer":"■正解：D\n■解説：\n・競争優位を築くための基本戦略としては、コスト・リーダーシップ戦略、差別化戦略、集中戦略の３つがある。M.E.ポーターの競争戦略フレームワークが有名で、縦軸に「戦略ターゲットの幅（業界全体／特定の分野）」、横軸に「競争優位のタイプ（他社よりも低いコスト／顧客が認める特異性）」の切り口に対し、事業特性、市場環境、自社の経営資源等を十分に考慮し、どの戦略が有効であるか判断する。\n■出典：グロービス マネジメントブック 改訂3版 　\n9.競争優位を築くための基本戦略　P.18-19","source":"Excel: GMAP道場問題秋春(2).xlsx","no":219,"idx":219},{"id":"xlsx-2025春-経営戦略-10","season":"2025春","subject":"経営戦略","scope":"10. 事業の経済性分析","question":"■問10.戦略をコスト面から分析するための事業経済性の考え方に関して、下記文章中の①～⑤の組み合わせとして適切なものを、以下の選択肢A～Dの中から選んでください。\n\n◆規模の経済\n一般的に企業のコストは、（①）に関わらず一定の固定費と、（①）に比例する変動費に分解できる。（②）当たりの変動費は製品の生産量が増えても一定であるが、（②）当たりの固定費は生産量が増えると低下する。すなわち、固定費の部分は規模が大きくなればなるほどコスト効率が（③）する。\n◆経験曲線\n現時点までの累積の（①）、すなわち累積の経験量が増えるほどコスト（④）に結びつくとする経験曲線（エクスペリエンス・カーブ）の考え方がある。\n◆（⑤）の経済\n事業活動の（⑤）を広げることによって、資源を有効活用し、経済効率を高める考え方である。\n\nA：①消費量、②工数、③低下、④向上、⑤個別\nB：①生産量、②単位、③低下、④向上、⑤個別\nC：①消費量、②工数、③向上、④低下、⑤範囲\nD：①生産量、②単位、③向上、④低下、⑤範囲","answer":"■正解：D\n\n■解説：\n戦略をコスト面から分析するための事業経済性の考え方には、①事業の規模の大きさによって低コストを実現するという「規模の経済」、②累積経験量を増やしてコストダウンを図るという「経験曲線」、③事業活動の範囲を広げることによって資源を有効活用し、経済効率を高めるという「範囲の経済」の３つがある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n10. 事業の経済性分析　 P.20-21","source":"Excel: GMAP道場問題秋春(2).xlsx","no":220,"idx":220},{"id":"xlsx-2025春-経営戦略-11","season":"2025春","subject":"経営戦略","scope":"11. 外部環境分析","question":"■問11. 経営戦略における外部環境分析について、正しいものをすべて選択してください。\nA：マクロ環境分析では、自社でコントロールでき、企業活動に影響を与える要因を検証する。代表的な項目は、政治(Politics)、経済(Economy)、社会(Society)、技術(Technology)である。\nB：マクロ環境よりもさらに個別具体的な分析を行うときのフレームワークとして3C分析がある。市場(顧客)分析は、自社の製品やサービスを購買する意志や能力のある潜在顧客を把握する。具体的には市場規模や成長性、ニーズ、購買決定プロセス、購買決定者の観点で分析する。競合分析は、競争状況や競争相手について把握する。自社分析は、自社の経営資源や企業活動について定性面・定量面から客観的に把握する。\nC：環境分析の最終目標は自社にとっての事業機会を発見することであり、SWOT分析により4つの視点から自社の現状を分析し戦略立案に活用できる。4つの視点とは、経済的価値、希少性、模倣困難性、組織力のことである。\nD：事業のKSFと自社のコア・コンピタンスが適合していない場合、KSFを変えるために積極的に外部環境に働きかけて業界のルールを変えることもある。\n✽","answer":"■正解：B、D\n■解説：\nA：マクロ環境分析では、自社でコントロールできないが、企業活動に影響を与える要因を検証する。\nC：SWOT分析は、市場における機会(Opportunities)、自社にとっての脅威(Threats)、自社の強み(Strengths)、弱み（Weaknesses）の4つの要素を組み合わせたものである。問題文の4つは、経済的価値（Value）、希少性（Rarity）、模倣困難性(Imitability)、組織力(Organization)の視点から分析するVRIO分析のことである。\nBとDは正解。\nD：外部環境分析の手順として、まずマクロ環境分析や業界・市場環境を分析し、市場における「機会」と「脅威」を整理する。この時、何が事業のKSFなのかを十分に検討し、自社と競合を分析して自社の「強み」と「弱み」を整理し、コア・コンピタンスを見極める。そして、市場における機会と脅威に対して、自社の強みを生かし弱みを克服することを考え、自社にとっての機会を見つけ出す。\n　事業のKSFと適合しない場合、上記に加え、自社のコア・コンピタンスの構造を変革してKSFとのフィットを高める努力が必要となる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n11．外部環境分析　P22-23","source":"Excel: GMAP道場問題秋春(2).xlsx","no":221,"idx":221},{"id":"xlsx-2025春-経営戦略-12","season":"2025春","subject":"経営戦略","scope":"12.業界分析：業界構造と「5つの力」","question":"■問12.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n業界構造を分析するときに役立つフレームワークが、ポーターの「5つの力」分析である。これらを分析することで、業界の収益構造や競争の鍵を発見したり、将来の競争の変化を予測することが可能になる。\nたとえば、（①）が容易な業界（参入障壁が低い業界）では、業界の収益性が上がるとすぐに競合企業が増え、収益性は下がってしまう。また、（②）の存在が大きくなると、例えば自社の製品が価格対性能比で劣る場合に顧客を一気に奪われるおそれがある。\nさらに、（③）が強くなるのは、例えば買い手の購入量が多かったり、製品の差別化が難しく他企業も類似製品をつくっている場合などである。一方、（④）が強くなるのは、売り手の業界が少数の企業に寡占されている場合や、売り手の製品が自社の業界にとって重要な部品となっている場合などだ。\nそして、（⑤）が激しくなるのは、同業者数が多い場合や、業界の成長が遅い場合、装置型産業のように固定費の割合が大きい場合などである。\n\nA.①新規参入　②代替品　　③売り手の交渉力　④買い手の交渉力　⑤業界内の競争\nB.①代替品　　②新規参入　③買い手の交渉力　④売り手の交渉力　⑤業界内の競争\nC.①新規参入　②買い手の交渉力　　③代替品　④業界内の競争　⑤売り手の交渉力\nD.①新規参入　②代替品　　③買い手の交渉力　④売り手の交渉力　⑤業界内の競争","answer":"■正解：D\n■解説：\n①新規参入\n参入障壁には技術上・マーケティング上・設備投資上のものなど様々で、海外メーカーの参入が脅威となるケースも多い。\n自動車業界は、開発、生産、広告、ディーラー網の構築などに規模の経済が働きやすい業界では、新規参入が難しい例として挙げられる。\n②代替品\nイノベーションにより従来の機能をまったく別の製品で代替できる場合、あるいは異業種の参入によって、従来の商慣習とは異なる製品・サービスの供給形態が出てきた場合などに影響が大きい。\n③買い手の交渉力\n※問題文を参照ください。\n④売り手の交渉力\n※問題文を参照ください。\n⑤業界内の競争\nとくに装置型産業や巨額の設備投資が必要な業界では、一度参入すると撤退しづらく、果てしない値下げ競争に陥るなど泥沼化するおそれがある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n12.業界分析：業界構造と「5つの力」 P.24-25","source":"Excel: GMAP道場問題秋春(2).xlsx","no":222,"idx":222},{"id":"xlsx-2025春-経営戦略-13","season":"2025春","subject":"経営戦略","scope":"13.業界分析：アドバンテージ・マトリクス","question":"■問13.アドバンテージ・マトリクスの説明として、誤っているものを選択してください。\nA.特化型事業は、競争要因は限定されており、幅広い分野で特化した地位を築いている事業である。この場合、事業全体の規模と収益性には相関関係はない。むしろ、ある特定セグメントの中におけるシェアが収益性の決定要因となる。\nB.規模型事業は、規模の利益を追求することで優位性を構築できる事業である。下手に差別化を試みてもむしろコスト高になるだけで、顧客にその価値を認められにくい。\nC.分散型事業は、競争要因が数多く存在するものの、圧倒的な優位性構築が困難な事業である。事業が小規模な段階では高い収益性を維持できるが、事業規模を拡大すると強みが薄れ、収益性を維持できない。\nD.手詰まり型事業は、優位性構築が容易な事業である。規模による格差の影響から、コスト高が差別化要素となっている。成熟期/衰退期の産業で大規模化の限界に至った事業や、慢性的な供給過剰の状態にある業界などが挙げられる。","answer":"■正解：A,D\n■解説：\nA.特化型事業は、競争要因がいくつか存在し、かつ、特定の分野でユニークな地位を築くことで優位性構築が可能な事業である。D.A.アーカーは特殊専門雑誌業界、計測機器業界、医薬品業界がこれに当たるとする。\nB.設問のとおり。半導体、コンピュータ、自動車などでも、汎用的性格の強いものがこの業界に当てはまる。規模型事業においてはシェア拡大により規模を追求することが基本戦略となる。\nC.設問のとおり。地域密着型の事業および事業拡大によるコストダウンの余地が小さい事業がこれに該当する。\nD.手詰まり型事業は、過去には規模による格差が存在したものの、コスト低下が進み、大差がなくなってしまっている。セメント業界、石油化学業界などの素材産業がこれに当たると言われる。\n■出典：グロービス マネジメントブック 改訂3版 　\n13.業界分析：アドバンテージ・マトリクス　P.26-27","source":"Excel: GMAP道場問題秋春(2).xlsx","no":223,"idx":223},{"id":"xlsx-2025春-経営戦略-14","season":"2025春","subject":"経営戦略","scope":"14. 内部分析：バリューチェーン","question":"■問14.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\nバリューチェーン（価値連鎖）という考え方は、事業活動を機能ごとに分解し、どの部分（機能）で付加価値が生み出されているかを分析することで、事業戦略の構築や改善に役立てようというものだ。\n１つの製品が顧客のもとに届くまでには、さまざまな業務活動が関係する。（①）は【（②）の流れ】に着目して企業の活動を主活動と支援活動に分け、それにマージン（利益）を加えて全体の付加価値を表している。\n主活動は、部品や原材料などの購買、製造、出荷物流、販売・マーケティング、アフターサービスなどだ。\n支援活動は、主活動を支える人事や経理、技術開発などの間接部門である。\nこの分析では、諸活動を厳密に分類することが目的ではなく、それぞれの活動の役割、（③）、および全体としての（④）への貢献度を明確にすることがポイントになる。\nA. ①ポーター　②人　③コスト　④全社戦略\nB. ①アドラー　②モノ　③計画　④全社戦略\nC. ①ポーター　②モノ　③コスト　④事業戦略\nD. ①コッター　②カネ　③計画　④事業戦略","answer":"■正解：C\n■解説：\nバリューチェーンはポーターが提唱した。【モノの流れ】に着目して、企業の活動を主活動と支援活動に分け、それにマージン（利益）などを加えて全社の付加価値を表している。バリューチェーン分析は、諸活動を厳密に分類することが目的ではなく、それぞれの活動の役割、コスト、および全体としての事業戦略への貢献度を明確にすることがポイントになる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n14. 内部分析：バリューチェーン P.28-29","source":"Excel: GMAP道場問題秋春(2).xlsx","no":224,"idx":224},{"id":"xlsx-2025春-経営戦略-15","season":"2025春","subject":"経営戦略","scope":"15.競争上の地位に応じた戦略","question":"■問15.競争上の地位によってとるべき企業の戦略について、誤っているものを全て選択してください。\nA.リーダーは、市場規模の拡大で最も恩恵を受けるため、規模拡大への投資を行い、シェアの維持を目指す。2番手に対して明確なコスト差を確立できそうな機会には、シェア拡大に注力する。基本戦略方針は、差別化戦略。\nB.チャレンジャーは、リーダーに取って代わろうとする企業で、リーダー並みの差別化やコスト競争力といった優位性を築き、リーダーとの直接対決、背面攻撃、後方攻撃をとる。基本戦略方針は、全方位型戦略である。\nC.フォロワーは、リーダーに追随し、競合企業からの極端な反撃を招かない方法で経営成果の最大化を目指す。基本戦略方針は、模倣戦略である。\nD.ニッチャーは、大手が本気で参入してこないような市場のくくりを発見し、そこに限られた経営資源を集中させて、高い専門性やブランド力を維持することで、他社の参入を防ぐ。基本戦略方針は、集中戦略である。","answer":"■正解：AとB\n■解説：\nA リーダーのとるべき基本戦略方針は、全方位型戦略。周辺需要拡大、同質化、非価格対応、最適市場シェアが戦略の定石となる。\nB チャレンジャーの主な戦略は、いずれの場合もリーダー以上の差別化やコスト競争力など、一過性でない優位性を築く必要がある。とるべき基本戦略方針は、対リーダー差別化戦略で、リーダーがとりえない政策をとることが戦略の定石となる。\nC、Dは正しい。\n■出典：グロービス マネジメントブック 改訂3版 　\n15 競争上の地位に応じた戦略 P.30-31","source":"Excel: GMAP道場問題秋春(2).xlsx","no":225,"idx":225},{"id":"xlsx-2025春-経営戦略-16","season":"2025春","subject":"経営戦略","scope":"16.事業ライフサイクルに応じた戦略","question":"■問16.新規事業戦略には次の3パターンがある。自社の経営資源や市場の環境を踏まえて最適な戦略を選ぶことが必要だ。\n①ハード要素で事業展開を図る\n②ソフト要素で事業展開を図る\n③ニッチ市場の開拓\nでは、次の文章は上記の３パターンのうち、どのパターンの説明を行ったものでしょうか？\n\n技術的な革新により新製品を作り出す パターンである。特許による防御も加われば、優位性のあるビジネスを創出する可能性が高くなる。技術的な独自性がなくても、生産技術力を生かし、他社の開発した技術をベースに最もコスト・パフォーマンスの高い製品を作るというパターンもある。\n\nA.①ハード要素で事業展開を図る\nB.②ソフト要素で事業展開を図る\nC.③ニッチ市場の開拓","answer":"■正解：A\n■解説：\n新規事業戦略の3パターンについての説明は以下の通りです。\n\n① ハード 要素で事業展開を図る\n技術的な革新により新製品を創り出すパターンである。特許による防御も加われば、優位性のあるビジネスを創出する可能性が高くなる。技術的な独自性がなくても、生産技術力を生かし、他社の開発した技術をベースに最もコスト・パフォーマンスの高い製品を作るというパターンもある。\n②ソフト 要素で事業展開を図る\nマーケティング手法やビジネスシステムの変革などにより、新しいビジネスモデルを作るパターンだ。既存の販売網を使わず、新チャネルを構築するなどの事業展開がこれに当たる。①に比べて、よりビジネスに対する感性や素養、リーダーシップが必要とされることが多い。\n③ニッチ市場の開拓\n①②とは別に、それまで誰も気づかなかった新しい市場を発見・開拓し、そこでいち早く 優位性 （ノウハウ、優良顧客、調達先との関係など）を構築するというパターンだ。競争が極端に激化することは少ないが、市場のニッチ性ゆえに、企業の屋台骨を背負う大事業にまでは育ちにくい。\nよって、A.①ハード要素で事業展開を図る、が正解です。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n16.事業ライフサイクルに応じた戦略 P.32-33","source":"Excel: GMAP道場問題秋春(2).xlsx","no":226,"idx":226},{"id":"xlsx-2025春-経営戦略-17","season":"2025春","subject":"経営戦略","scope":"17.戦略形成に関する見方","question":"■問17. リソース・ベースド・ビュー（RBV）ついてあっているものを選択してください。\nA. 社外資源に目を向け、その有効活用を図るべく戦略を構築しようとする考えである。\nB. リソースとは、生産設備や個々の人材などの有形リソースだけではなく、ノウハウやスキルなどの無形リソースも含まれる。\nC. コア・コンピタンスやケイパビリティなどの無形リソースを活用することで、模倣の可能性を引き上げ、持続的な競争優位につながると考える。\nD. リソースのコモディティ化や専有可能性などが企業の競争優位につながると考える。","answer":"■正解：Bのみ\n■解説：\n・リソース・ベースド・ビュー（RBV）は、社内資源に目を向け、その有効活用をはかるべく戦略を構築しようとする考えである。\n・なお、ここでいうリソースは、生産設備や個々の人材にとどまらない。\n・コア・コンピタンスやケイパビリティ（組織能力）などの目に見えにくいノウハウやスキルなども包含しており、むしろそうした無形のリソースを有効活用することこそが、模倣の可能性を引き下げ、持続的な競争優位につながると考える。\n・RBVではまた、そのリソースの希少性や専有可能性などが企業の競争優位につながると考え注目する。\n■出典：グロービス マネジメントブック 改訂3版 　\n17．戦略形成に関する見方 P.34-35","source":"Excel: GMAP道場問題秋春(2).xlsx","no":227,"idx":227},{"id":"xlsx-2025春-経営戦略-18","season":"2025春","subject":"経営戦略","scope":"18. M&Aとアライアンス","question":"■問18.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A～Dの中から選んでください。\n近年、企業戦略においてM&Aやアライアンスの持つ重要性が高まっている。M&Aとは、合併や企業買収のことであり、すでに確立した事業を買うことで、必要な経営資源を一瞬にして手に入れることが可能だ。M&Aでは、内部成長では間に合わないような場合に、（①）を拡大する手法として活用されることもある。\n一方アライアンスとは、複数の企業が互いに何らかのメリットを得ようとして協力することである。アライアンスの中でも、異なる優位性を持つ別の企業と強者連合を組む（②）は成功率が高くなる。\nM&Aの展開方法としては、同一業種の競合他社を吸収・買収することによりスケールメリットをつくり出す（③）、またコスト面や市場面で自社がコントロールできる範囲を広げ、他社に対して優位性を確立する（④）、そして異業種間のM&Aによる事業の相互補完や資源共有化によるシナジー、リスクの分散を図る手法がある。\nただし、M&Aは戦略との整合性だけでなく、（⑤）における適合性がなければ、統合されずにシナジーを発揮できないケースや従業員が強い拒否を示すこともあるため注意が必要である。\n\nA.①シェア　②戦略的提携　③水平統合　④垂直統合　⑤組織面\nB.①シェア　②業務提携　③垂直統合　④水平統合　⑤財務面\nC.①ブランド力　②戦略的提携　③垂直統合　④内部成長　⑤組織面\nD.①シェア　②資本提携　③水平統合　④垂直統合　⑤財務面","answer":"■正解：A\n■解説：\n①シェア\n企業活動においてスピードやタイミングは極めて重要である。M&Aでは内部成長に頼っていては間に合わないと判断した場合に、シェアを一気に拡大する手法がとられる。\n②戦略的提携\n市場ですでに優位性を発揮している企業が異なる優位性を持つ別の企業と強者連合を組む戦略的提携。投資リスク軽減のためにも「強者連合」が有効な手法となっている。\n③水平統合\n水平統合は同一業種の競合他社を吸収・買収することにより、コスト優位性を構築することを目的とする。規模の経済を生かせる成熟期にある業界で頻繁に行われる手法。\n④垂直統合\n垂直統合は仕入れ先である川上の事業に進出する場合と、販売先である川下へ進出する場合がある。\n⑤組織面\nM&Aでは、組織文化の摩擦が致命的な問題となりやすく、買収対象企業と自社との適合性を検討する必要がある。M&Aを行う場合は、戦略的意図を明確にし、買収後の事業戦略を十分に検討する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n18. M&Aとアライアンス P.36-37","source":"Excel: GMAP道場問題秋春(2).xlsx","no":228,"idx":228},{"id":"xlsx-2025春-経営戦略-19","season":"2025春","subject":"経営戦略","scope":"","question":"■問19.バリューチェーン（以下、VC）の再構築に関する説明で、誤っているものすべてを選択してく\nださい。\nA．VCの再構築とは、イノベーションの影響で企業活動における付加価値構造が破壊され、新たなビジ\nネスシステムへとつくり直されることにより、これまで当然と見なされていた事業の「定義」や「ルー\nル」が根本的に変わることである。\nB．業界ルールや成功要因が変化する背景には、消費者ニーズに代表される外部要因と、企業内の経済\n性に関わる条件が変化している場合が多い。\nC．自社事業がVCの再構築の影響を受けるかどうかを把握し、新たな可能性を探る術は存在しない。\nD．新たなビジネスモデルのパターンとして、コンサルティング会社のＢＣＧは、「レイヤーマス\nター」「オーケストレータ―」「マーケット・メーカー」「パーソナル・エージェント」「コスト・ド\nライバー」の５つに分類している。","answer":"■正解：C、D\n■解説：\nA：記述の通り\nB：記述の通り\nC：コンサルティング会社のBCGは、VCの再構築による「新たな可能性を探る方法」として、「5つ\nの問い」が有効だとしている。（参考：① VC全体の中でコストの割に価値が低い部分はどこか、② VC\n全体のなかで自社事業は顧客とどのような関係にあるか、③自社事業でネットワーク化の影響をうける\nのはどこか、④VCが変わることで、現在の戦略的資産のうち、重荷となるものはどれか、⑤新しいVC\nではどの様な活動、能力が必要となるか）\nD：BCGでは、５つではなく「４つ」に分類している。※「コスト・ドライバー」は、製品やサービス\nのコストを最も大きく左右する要因・活動を指す用語。\n■出典：グロービス マネジメントブック 改訂3版 　\n19.バリューチェーンの再構築　P.38-39","source":"Excel: GMAP道場問題秋春(2).xlsx","no":229,"idx":229},{"id":"xlsx-2025春-経営戦略-20","season":"2025春","subject":"経営戦略","scope":"","question":"■問20.企業は様々な形でグローバル化とIT（情報技術）の発達の影響を受けています。グローバル展\n開の方法と、デファクト・スタンダードをめぐる競争に関して、間違っているものをすべて選んでくだ\nさい。\nA:企業がグローバル展開を志向する理由として、市場拡大による成長機会の追求や、低コストあるいは\n差別化の実現による競合他社に対する優位性構築が挙げられる。\nB:グローバル展開を図るパターンの一つであるグローバル戦略とは、現場のニーズにきめ細かく対応す\nるために本社の指揮下で共通した製品とそのバリエーションを全世界に供給することが特徴である。\nC:ハイテク産業などは、特に他社に先駆けて技術開発に成功することが、市場を制することにつながる。\nD:規格競争においては、リーダーの同質化戦略が特に有効となる。","answer":"■正解：B,C,D\n■解説：\nA：記述の通り\nB：本社の指揮下で共通した製品とそのバリエーションを全世界に供給する統合重視のパターン（グ\nローバル戦略）。この場合、グローバル展開によって効率化は図れるが、現地のニーズにきめ細かく対\n応しきれないというマイナス面がある。\n　なお、国・地域ごとにR&Dやマーケティング、生産など、現地市場への適合性を重視しながらグ\nローバル展開を図るパターンを「マルチ・ドメスティック戦略」と呼ぶ。\nC：とくに、ハイテク産業などにおけるデファクト・スタンダードをめぐる競争（規格競争）には、従\n来の常識とは異なる側面がある。たとえば、技術的にもっともすぐれ、他社に先駆けて技術開発に成功\nした企業が、必ずしもシェアを獲得したり、他企業よりも優位に立てるとは限らない。技術的優位性は\nなくても、自社技術をスタンダードとして認めてもらえた企業が市場を制する場合がある。\nD：競争上の地位に応じた戦略の定石が該当しない場合がある。たとえば、規格競争ではリーダーの同\n質化戦略（下位企業の戦略を模倣する戦略）は有効ではない。\n■出典：グロービス マネジメントブック 改訂3版 　\n20. グローバル化と規格競争　 P.40-41","source":"Excel: GMAP道場問題秋春(2).xlsx","no":230,"idx":230},{"id":"xlsx-2025春-経営戦略-21","season":"2025春","subject":"経営戦略","scope":"","question":"■問21. CSR（Corporate　Social　Responsibility：企業の社会的責任）について、誤っているもの\nすべてを選択してください。\nA：20世紀の企業経営において、最も重要視されたステークホルダーは、株主、顧客、社会の三者で\nあった。最近は、もう1つ重要なステークホルダーとして、従業員が存在意義を増している。\nB：企業は社会的責任を果たし、また価値を提供すべきであるという考え方が広まっている。具体的に\nは、法令順守（コンプライアンス）のような社会市民としてとるべき倫理的な行動の遵守と、積極的な\n環境対策や障害者の雇用、貧困撲滅支援などといったポジティブな貢献の両方が期待されている。\nC：企業も社会市民として、社会的問題に積極的に取り組むことが、継続的価値や利益獲得をめぐる競\n争力を高め、持続的な成長につながるとの考え方が広まりつつある。\nD：CSRは、政治・行政に近い領域の活動は含まれないようにしている。規制緩和・民営化が進み、こ\nれまで行政が担っていた役割を企業が担いやすくなったことが影響している。\nE：マイケル・ポーターは、自社の持つバリュー・チェーンは活用しづらいと説いている。バリュー・\nチェーンの活動を社会と戦略の両方に役立つものに変える必要はないと考えている為である。","answer":"■正解：A、C、D、E（B以外）\n■解説：\nA： 20世紀において、最も重要視されたステークホルダーは、株主、顧客、従業員の三者であった。最\n近は、もう1つ重要なステークホルダーとして、社会が存在意義を増している。\nC：企業も社会市民として、社会的問題に積極的に取り組むことが、ブランド価値や人材獲得をめぐる\n競争力を高め、持続的な成長につながるとの考え方が広まりつつある。\nD：近年では、より政治・行政に近い領域の活動もCSRに含まれるようになっている。規制緩和・民営\n化が進み、これまで行政が担っていた役割を企業が担いやすくなったことを勘案すると、この流れは一\n段と加速していくだろう。\nE：マイケル・ポーター教授は、自社の持つバリュー・チェーンを有効に活用することが必要だと説い\nている。たとえば、学習塾や英会話スクールなどであれば、本業で小学生を対象としていなくても、そ\nのノウハウや経営資源をうまく転用しながら社会貢献できる可能性がある。バリュー・チェーンの活動\nを社会と戦略の両方に役立つものに変えることができる。\n■出典：グロービス マネジメントブック 改訂3版 　\n21．CSR　P42-43","source":"Excel: GMAP道場問題秋春(2).xlsx","no":231,"idx":231},{"id":"xlsx-2025春-経営戦略-22","season":"2025春","subject":"経営戦略","scope":"","question":"■問22.下記、社会起業家の説明として、誤っているものをA~Cから選んでください。\nＡ．社会の仕組みにはさまざまな歪みや非合理性がある。こうした問題を新製品、新サービス、新事業\n創造によって解決し、それによって社会変革を実現しようとする起業家のことを「社会起業家」という\nＢ．わが国では欧米より社会起業家の登場が大幅に遅れたが、2000年頃から社会的な認知が広がり、\n医療や介護、保育、教育、農業などの分野で大きなビジネスチャンスがあると期待されている。\nＣ．社会起業家には、通常の企業家以上に高いビジネス能力やコミュニケーション能力、さらに高い志\nが求められるが、こうした人材が積極的に社会起業家を志す傾向にあるため、人材面の課題はさほど深\n刻ではない。","answer":"■正解：C\n■解説：\nC：社会起業家には、通常の企業家以上に求められる能力が必要である一方、実際にはなかなか社会起\n業家を志さない。また公的な活動に志の高い人間は、往々にして利益の追及を軽視する傾向もある。\n■出典：グロービス マネジメントブック 改訂3版 　\n22.社会起業家 P.44-45","source":"Excel: GMAP道場問題秋春(2).xlsx","no":232,"idx":232},{"id":"xlsx-2025春-経営戦略-23","season":"2025春","subject":"経営戦略","scope":"","question":"■問23. 戦略策定プロセスの概要について、（①）～（④）に入る語句の組み合わせとして適切なもの\nを選択肢A～Dの中から選んでください。\n・優れた戦略を策定・実施するには、「合理性と論理性」「　①　」という2つの異なる条件を満たす\nことが求められる。\n・戦略策定において、事実を（　②　）観察し、論理的に組み立てて分析する場面では、合理性や論理\n性の発揮が求められる。\n・戦略の策定や実施に関わる人々を動かすには、信念や夢、（　③　）への挑戦、既存の組織風土の打\n破、革新的なものの見方など、人間的な側面に働きかける力が必要になる。\n・戦略は組織の現状によって制約を受けるが、同時に戦略は組織が（　④　）するものでなくてはなら\nない。\nA：①事業ドメインとケイパビリティ、②客観的に、③差別化、④変革\nB：①創造性と革新性、②解像度高く、③差別化、④成長\nC：①事業ドメインとケイパビリティ、②主観的に、③リスク、④成長\nD：①創造性と革新性、②客観的に、③リスク、④変革","answer":"■正解：D\n■解説：\n優れた戦略を策定・実施するには、「合理性と論理性」「創造性と革新性」という2つの異なる条件を\n満たすことが求められる。\n戦略策定では、合理性や論理性が求められる一方で、戦略の策定や実施に関わる人を動かすには、創造\n性や革新性などの要素も体現しなくてはならない。\n■出典：グロービス マネジメントブック 改訂3版 　\n3.戦略策定プロセスP.6-7","source":"Excel: GMAP道場問題秋春(2).xlsx","no":233,"idx":233},{"id":"xlsx-2025春-経営戦略-24","season":"2025春","subject":"経営戦略","scope":"","question":"■問24.下記事業ポートフォリオの説明として、誤っているものをA～Dから選んでください。\nA. 事業ポートフォリオは、さまざまな事業機会と自社の経営資源のバランスをとりながら、事業の選択\nや組み合わせを考えていく方法である。\nB. 企業が複数の事業活動を行う背景には、事業領域の拡大によって成長の機会を獲得したり、事業環境\nの変化によるリスクを分散するといった目的がある。\nC. 事業ポートフォリオを検討する場合、【事業の魅力度】、【事業間のシナジー】の2つの視点で考え\nるとよい。\nD.【事業間シナジー】で得られるメリットは、技術力や生産設備、営業網の共有によるコスト面のみで\nある。","answer":"■正解：C、D\n■解説：\nＣ：事業ポートフォリオを検討する場合、【事業の魅力度】、【競争上の優位性】、【事業間のシナ\nジー】の3つの視点で考える。競争上の優位性は、その事業を始めた場合、自社に勝ち目があるかとい\nうことで、市場占有率・他社比較した相対的な収益性・組織の各機能の優劣評価などが考えられる。\nD：【事業間シナジー】で得られるメリットは、コスト面のメリット以外に、ブランドやノウハウ、人\n材の移転などによる効率性の向上など、さまざまな部分でシナジーが働く。新規事業の潜在競争力を評\n価する際には、部分的に既存資源を流用できるかという点だけではなく、関連する事業間で双方向的に\n発生するシナジーにも留意しなくてはならない。\n■出典：グロービス マネジメントブック 改訂3版 　\n6. 事業ポートフォリオと事業ライフサイクル　 P.12-13","source":"Excel: GMAP道場問題秋春(2).xlsx","no":234,"idx":234},{"id":"xlsx-2025春-経営戦略-25","season":"2025春","subject":"経営戦略","scope":"","question":"■問25.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちか\nら選んでください。\n・戦略策定において、現実を正確に把握するために環境分析を行う。その際、自社の（①）と（②）の\n環境に着目し、分析の漏れ、重複を防ぎ、必要な要素を押えるためにフレームワークが有効だ。\n・PEST分析では、政治、経済、社会、（③）の項目に分け、自社の事業に関係の深い重要な要因や環\n境変化だけに絞り込んで分析することがポイントだ。\n・3C分析では、（①）分析として市場（顧客）分析、競合分析、（②）分析として自社分析を行う。\n市場分析では、市場規模や、成長性、ニーズや（④）決定プロセス、誰が（④）を行うかと言った観点\nで分析する。\n・SWOT分析では、（①）分析として市場の機会と脅威を見つけ出し、（②）分析として自社の強みと\n弱みを把握することに主眼が置かれる。SWOTを整理することで、業界の（⑤）や、自社にとっての事\n業機会を導き出しやすくなる。\nA. ①内部　②外部　③技術 ④競争 ⑤KSF\nB. ①内部　②外部　③法律 ④競争 ⑤KBF\nC. ①外部　②内部　③技術 ④購買 ⑤KSF\nD. ①外部　②内部　③法律 ④購買 ⑤KBF","answer":"■正解：C\n■解説：\n・戦略の策定では、現実の把握のため環境分析を行うが、外部と内部に着目して行う。\n・PESTは外部環境分析のフレームワーク。代表的な項目である政治(Politics)、経済（Economy)、社\n会（Society)、技術(Technology)の頭文字をとってPEST分析と呼ばれる。\n・3Cは、外部分析として市場（顧客）と競合の分析、内部分析として自社分析を行う。\n・市場分析は、市場規模、成長性、ニーズ、購買決定プロセスや誰が購買を行うかという観点で分析す\nる。\n・SWOT分析は、外部分析として、市場の機会と脅威、内部分析として自社の強みと弱みを把握するこ\nとで、業界のKSFや自社にとっての事業機会を導き出しやすくなる。\n■出典：グロービス マネジメントブック 改訂3版 　\n11．外部環境分析 P.22-23","source":"Excel: GMAP道場問題秋春(2).xlsx","no":235,"idx":235},{"id":"xlsx-2025春-経営戦略-26","season":"2025春","subject":"経営戦略","scope":"","question":"■問26.\nCSRについて、下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~D\nのうちから選んでください。\n欧州を中心に、20世紀後半から社会的問題になってきたのが、どうすれば(①)性のあるよりよい社会を\nつくれるかということだ。とくに環境や貧困などの問題は、一朝一夕に解決できるわけではないし、現\n在の無為無策は将来に大きな禍根を残しかねない。企業も社会市民として、こうした問題に積極的に取\nり組むことが、ブランド価値や人材獲得を巡る競争力を高め、(①)的な成長につながるとの考え方が広\nまりつつある。具体的な領域としては、以前から環境対策や労働環境の改善などが注目されてきた。た\nとえば、再生紙などの(②)を用いる、商用車にエコカーを採用する、(③)を採用することで身障者でも働\nきやすい環境を提供する、などである。\n近年ではこれらに加え、貧しい国々の製品を積極的に買う、独裁国家からの製品は買わない、地域の教\n育プログラムの支援をするなど、より政治・行政に近い領域もCSRに含まれるようになっている。(④)\nが進み、これまで行政が担っていた役割を企業が担いやすくなったことを勘案すると、こうした流れは\nいちだんと(⑤)していくだろう。\nA．①発展　②リサイクル品　③ユニバーサルデザイン　④規制強化・民営化　⑤加速\nB．①持続　②リサイクル品　③アクセシブルデザイン　④規制緩和・民営化　⑤加速\nC．①持続　②リサイクル品　③ユニバーサルデザイン　④規制緩和・民営化　⑤加速\nD．①発展　②新品　③バリアフリーデザイン　④規制緩和・民営化　⑤減速","answer":"■正解：C\n■解説：\nCSRの今後の重要性を鑑みて、より良い未来社会を作るべく社会に価値提供する部分から作問してみま\nした。\n欧州を中心に、20世紀後半から社会的問題になってきたのが、どうすれば持続性のあるよりよい社会を\nつくれるかということ。とくに環境や貧困などの問題は、一朝一夕に解決できるわけではなく、現在の\n無為無策は将来に大きな禍根を残しかねない。企業も社会市民として、こうした問題に積極的に取り組\nむことが、ブランド価値や人材獲得を巡る競争力を高め、持続的な成長につながるとの考え方が広まり\nつつあります。具体的な領域としては、たとえば、再生紙などのリサイクル品を用いる、商用車にエコ\nカーを採用する、ユニバーサルデザインを採用することで身障者でも働きやすい環境を提供する、など\nがあります。近年ではこれらに加え、貧しい国々の製品を積極的に買う、独裁国家からの製品は買わな\nい、地域の教育プログラムの支援をするなど、より政治・行政に近い領域もCSRに含まれるようになっ\nてきています。規制緩和・民営化が進み、これまで行政が担っていた役割を企業が担いやすくなったこ\nとを勘案すれば、こうした流れはいちだんと加速していくと考えられています。\nよって、Cが解答です。\n■出典：グロービス マネジメントブック 改訂3版\n21.CSR P.42-43","source":"Excel: GMAP道場問題秋春(2).xlsx","no":236,"idx":236},{"id":"xlsx-2025春-経営戦略-27","season":"2025春","subject":"経営戦略","scope":"","question":"■問27.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちか\nら選んでください。\n・企業の目的はステークホルダー間のバランスを取りながら、付加価値を提供し、成長し続けることと\n言える。\n・経営者の第一の使命は（①）価値の最大化。欧米では「企業は（①）のもの」という考え方が一般的\nだ。\n・（①）価値の最大化のためには（②）にとっての価値を最大化する必要がある。（②）に支持されな\nい企業は業績を伸ばすことができず、企業価値や株価を高めることもできないからだ。\n・企業が（③）に対して存在意義を示す、つまり有益な付加価値を提供することは、従業員の知恵が付\n加価値の源泉となって初めて可能にする 。\nA. ①株主　②社会　③顧客\nB. ①株主　②顧客　③社会\nC. ①顧客　②顧客　③株主\nD. ①社会　②顧客　③株主","answer":"■正解：B\n■解説：\n・経営者の使命は株主価値の最大化。欧米では「企業は株主のもの」という考え方が一般的だ。\n・株主価値の最大化のためには顧客にとっての価値を最大化する必要がある。顧客に支持されない企業\nは業績を伸ばすことができず、企業価値や株価を高めることもできないからだ。\n・企業が社会に対して存在意義を示す、つまり有益な付加価値を提供することは、従業員の知恵が付加\n価値の源泉となって初めて可能になる 。\n■出典：グロービス マネジメントブック 改訂3版 　\n1．経営戦略の意義と企業の目的 P.2-3","source":"Excel: GMAP道場問題秋春(2).xlsx","no":237,"idx":237},{"id":"xlsx-2025春-経営戦略-28","season":"2025春","subject":"経営戦略","scope":"","question":"■問28.以下の記述のうち、「コア・コンピタンス」を説明する内容として、誤っているものを選択し\nてください。\nA. コア・コンピタンスとは、企業内部に培ったさまざまな能力のうち、競争のための手段として最も有\n効なものを指し、技術開発力や物流ネットワーク、生産方式、共通の価値観、ブランドなどが含まれる。\nB. コア・コンピタンスは、模倣可能性・移転可能性・代替可能性が低く、希少性・耐久性が高いほど、\n競争優位を持続しやすいと言われる。\nC. 複数の事業を持つ企業の場合、経営資源の配分は、特定の事業に集中投資することが望ましく、成長\nが見込める事業に資源を集中させるべきである。\nD. 経営資源が不足している場合、社内で育成する以外に、他企業を買収して取り込む方法やアライアン\nスやアウトソーシングなどのように外部資源を用いて補完する方法がある。","answer":"■正解：C\n■解説：\n複数の事業を持つ企業の場合は、個々の事業の成否だけでなく、全社的な視点で適正な資源配分を考え\nる必要がある。特定の事業に資源を注ぎ込みすぎると、他の事業で資源や人材が不足し、うまく運営で\nきなくなり、経営基盤の脆弱化につながりかねない。適正な資源配分を行うためには、まず各事業の現\n在の状況を明らかにしたうえで、事業目的の設定や投資方針の決定を行う必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n5. 全社戦略の構成要素（2）：コア・コンピタンスと資源配分 P.10-11","source":"Excel: GMAP道場問題秋春(2).xlsx","no":238,"idx":238},{"id":"xlsx-2025春-経営戦略-29","season":"2025春","subject":"経営戦略","scope":"","question":"■問29.事業戦略における競争上の地位に応じた戦略について、正しいものすべてを選択してください。\nA．チャレンジャーの基本戦略は、代表例としてリーダーとの直接対決、背面攻撃、後方攻撃があり、\nリーダーができないことを戦略の定石とする。いずれもリーダー以上の差別化、コスト競争力など、一\n過性ではない優位性を築く必要がある。\nB．フォロワーは、大手企業が本気で参入してこないような市場のくくりを発見し、経営資源を集中さ\nせて、高い専門性やブランド力を維持することで、他社参入を防ぐ戦略をとる。\nC．同業界に属していれば、企業がとりうる戦略は競争上の地位によって制約を受けない。\nD．競争上の地位と競争戦略の定石において、リーダーは全方位型戦略を取る。定石としては、周辺需\n要の拡大、同質化、非価格対応、最適市場シェア等が考えられる。戦略的な課題は、市場シェア、最大\n利潤、名声などである。","answer":"■正解：A、D\n■解説：\nA．記載の通り。\nB．誤り。記載しているのはニッチャーの戦略であり、フォロワーは業界リーダーに追随し、競合企業\nからの極端な反撃を招かない方法で経営成果の最大化を目指す。\nC．誤り。同業界に属していれば、企業がとりうる戦略は競争上の地位によって制約を受ける。トップ\nシェアを誇る大企業と、シェア拡大を目指す中小企業では、取るべき戦略は異なる。\nD．記載の通り。\n■出典：グロービス マネジメントブック 改訂3版 　\n15.競争上の地位に応じた戦略　P.30-31","source":"Excel: GMAP道場問題秋春(2).xlsx","no":239,"idx":239},{"id":"xlsx-2025春-経営戦略-30","season":"2025春","subject":"経営戦略","scope":"","question":"■問30.戦略形成のとらえ方にはいくつかの学派がある。コンフィギュレーション学派について、下記\n文章中の①～⑤の組み合わせとして適切なものを、以下の選択肢A～Dの中から選んでください。\nコンフィギュレーション学派：\n組織をコンフィギュレーション（特徴や行動が（①）した集団。組織構成や構造の特徴として表れる）\nととらえ、ある特定の組織は最も環境に合ったコンフィギュレーションをとると考える。コンフィギュ\nレーション学派はもっとも包括的な戦略形成論であり、他の学派の主張でも（②）で包括的に説明しよ\nうとする。たとえば、プランニング学派は比較的（③）した状況に置かれた組織で有効であり、ポジ\nショニング学派は経済合理性が（④）働いている状況に置かれた組織で有効、ラーニング学派は予測が\n（⑤）アイデアが重視される業界で有効である、などだ。\nA:①臨機応変に対応、②客観的、③変動、④強く、⑤容易で\nB:①首尾一貫、②客観的、③変動、④弱く、⑤難しく\nC:①臨機応変に対応、②自説、③安定、④弱く、⑤容易で\nD:①首尾一貫、②自説、③安定、④強く、⑤難しく","answer":"■正解：D\n■解説：\nコンフィギュレーション学派は、組織をコンフィギュレーション（特徴や行動が首尾一貫した集団。組\n織構成や構造の特徴として表れる）ととらえ、ある特定の組織は最も環境に合ったコンフィギュレー\nションをとると考える。アルフレッド・チャンドラーやミンツバーグが代表格である。\nコンフィギュレーション学派はもっとも包括的な戦略形成論であり、他の学派の主張も自説で包括的に\n説明しようとする。たとえば、プランニング学派は比較的安定した状況に置かれた組織（成熟した大量\n生産型事業など）で有効であり、ポジショニング学派は経済合理性が強く働いている状況におかれた組\n織（アメリカにおける多くの生産財事業など）で有効、ラーニング学派は予測が難しくアイデアが重視\nされる業界（ハイテク産業など）で有効である、などだ。\n組織は環境に合ったコンフィギュレーションをとるという考え方は、必然的に環境の変化に応じて、変\n革（トランスフォーメーション）により、あるコンフィギュレーションから別のコンフィギュレーショ\nンへと飛躍することを要請する。\n■出典：グロービス マネジメントブック 改訂3版 　\n17. 戦略形成に関する見方　 P.34-35","source":"Excel: GMAP道場問題秋春(2).xlsx","no":240,"idx":240},{"id":"xlsx-2025春-人的資源管理-1","season":"2025春","subject":"人的資源管理","scope":"1..企業経営と人・組織のマネジメント","question":"■問1.経営資源としての人の特徴として誤っているものをすべて選びなさい。\nA.人には意思や感情、欲求がある\nB.人の能力は向上し、時には低下する。また能力の種類も変化する\nC.意思、感情、欲求、能力などは「変えよう」と決めてすぐに変えられるものではないが、組織の明確なルールや環境整備があれば個人の変化を計画通りに制御できる\nD.意思、感情、欲求、能力のあり方や変化の程度には個人差がある。同一人物でも注目するタイミングによって感じ方や欲求の程度が異なる場合がある\nE.意思、感情、欲求、能力などの組み合わせに基づく何らかのメカニズムによって、人の行動は常に合理的に決定される","answer":"■正解：CとEが誤り\n■解説：\nC: 「組織の明確なルールや環境整備があれば、個人の変化を計画通りに制御できる」という部分が誤り。実際には、人の変化は予測できる部分もあるが、計画通りに制御することは難しい。個々の感情や価値観が影響するため、完全に管理することはできない。\nE: 「人の行動は常に合理的に決定される」という部分が誤り。実際には、人の行動は感情や状況に影響され、必ずしも合理的とは限らない（例：衝動買いや、組織内の政治的判断など）。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n1.企業経営と人・組織のマネジメント P.182-183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":241,"idx":241},{"id":"xlsx-2025春-人的資源管理-2","season":"2025春","subject":"人的資源管理","scope":"2.人・組織のマネジメントに影響を及ぼす要因","question":"■問2.組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求める際に、最も効果的なアプローチは何ですか？\n1.朝礼などで経営理念を唱和させ、強制的に理念の浸透を図る。\n2.管理職層が経営理念やビジョンを深く理解し、意思決定を行う。\n3.経営理念やビジョンを実現するための経営戦略と、それを支援する人・組織のマネジメントにおいて整合性を取る。\n4.従業員に対して、経営理念やビジョンに関するクイズやテストを定期的に実施する。","answer":"■正解：3\n■解説：\n組織全体に経営理念やビジョンを浸透させ、それらを具体的な行動へと繋げていくためには、経営理念、ビジョン、経営戦略、そして人事・組織のマネジメントの間に整合性を図ることが極めて重要であると言えます。\n現代において、人々は単に生活の糧を得るだけでなく、仕事に「働きがい」を求める傾向が強まっています。従業員が自身の価値観や目的と、所属する組織の価値観やビジョン、目的との間に共感できる部分が大きい場合に、働きがいを感じるのです。\n企業が優秀な人材を惹きつけ、その能力を最大限に発揮させるためには、明確な経営理念やビジョンを示すことが不可欠となります。\nしかし、単に経営理念やビジョンを掲げるだけでは十分ではありません。組織としてそれらを尊重し、従業員にもそれらに沿った行動を求める姿勢を、具体的な施策を通して示す必要があります。そのためには、経営理念やビジョンを実現するための経営戦略と、それを支援する人・組織のマネジメントが不可欠となります。\nここで最も重要な点は、経営理念、ビジョン、経営戦略、そして人・組織のマネジメントのすべてにおいて整合性が取れていることです。もしこれらの間に矛盾や不整合が生じた場合、例えば、経営理念に共感して入社した従業員のモチベーションが低下したり、組織として目指す戦略目標の達成を妨げるような行動が起こる可能性が生じます。\n経営理念やビジョンを組織全体に浸透させ、具体的な行動に結びつけるためには、それらを実現するための道筋を示す経営戦略と、その戦略を人的・組織的な側面から支える人事・組織のマネジメントが一体となり、一貫性のある取り組みを行うことが不可欠であると言えるでしょう。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n2.人・組織のマネジメントに影響を及ぼす要因 P.184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":242,"idx":242},{"id":"xlsx-2025春-人的資源管理-3","season":"2025春","subject":"人的資源管理","scope":"3. 組織行動学と人的資源管理","question":"■問3.人的資源管理（HRM）を構成する重要な要素のうち、「HRポリシー」と「HRシステム」に関して、（）内の単語で正しい組み合わせのものを選んでください。\n・HRポリシーとは、企業の経営理念をもとに（①）を遂行し、（②）を実現していくために、組織と人がどうあるべきかを示すものである。\n・HRシステムとは、HRポリシーに基づいて個々の構成員をどのように活用、管理するかを決めたものである。HRシステムは、（③）、報奨、評価、（④）に分けられる。\nA．①計画、②ビジョン、③行動規範、④能力開発\nB．①計画、②目標、　　③人員配置、④フィードバック\nC．①戦略、②目標、　　③行動規範、④フィードバック\nD．①戦略、②ビジョン、③人員配置、④能力開発","answer":"■正解：D\n■解説：\n人的資本管理（HRM）は、HRポリシー、組織構造、HRシステム、組織文化の４つの要素から構成される。これらは、HRMの施策を立案・評価する際の考え方の枠組みとなる。組織構造と組織文化については、以下の通り。\n・組織構造とは、HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行するかを決めたもの。\n・組織文化とは、組織構成員が共有する信念、価値観、行動規範の集合体のこと。組織文化は厳密には「仕組み」と言えないが、人や組織の行動に影響を与える重要な要素の１つとして考慮する必要がある。企業は経営理念やビジョン、HRMの施策などを通して、組織文化に間接的な影響を与えることができる。\n■出典：グロービス マネジメントブック 改訂3版 　\n3．組織行動学と人的資源管理 P.186-187","source":"Excel: GMAP道場問題秋春(2).xlsx","no":243,"idx":243},{"id":"xlsx-2025春-人的資源管理-4","season":"2025春","subject":"人的資源管理","scope":"12.組織文化と企業経営","question":"■問4.組織文化の３つの機能の解説として、誤っているものを選んでください。\nA．判断や行動の指針：　組織文化は、とるべき判断や行動の指針を与える。その結果、意思決定のスピードを速め、学習コストを増大させる。\nB．情報伝達の簡素化：　組織文化は、判断や行動の指針を示すことによって、公的な情報伝達において伝えなければならない情報の量を軽減する。これにより、公的情報の伝達コスト削減や時間の短縮につながるだけでなく、情報の解釈における不確実性も小さくなるので、構成員間の誤解やコンフリクトを回避することができる。\nC．個人の動機付け：　組織文化は、組織の行動規範や価値観を通じて、昇進や昇給などの評価基準を明確にする。組織文化によって、構成員は何を行えば組織で評価されるかを学び、自ら目標を設定し、実践するためのモチベーションを高めることができる。","answer":"■正解：A\n■解説：\n・A：正しくは、組織文化はとるべき判断や行動の指針を与える。その結果、意思決定のスピードを速め、学習コストを低減する。\n・B：正しい\n・C：正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n12．組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":244,"idx":244},{"id":"xlsx-2025春-人的資源管理-5","season":"2025春","subject":"人的資源管理","scope":"13. 組織設計","question":"■問5.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A〜Dのうちから選んでください。\n組織設計の目的は、（①）の源泉を生み出し、それを（②）できる組織を構築することにある。\n組織構造の設計や変更にあたっては、環境変化や（③）との整合性を図るだけではなく、分業と（④）、指揮命令系統、管理範囲、意思決定権限、分化と（⑤）などの要素を考慮する必要がある。\nA.①競争原理、②維持、③組織変更、④協業、⑤統合\nB.①競争原理、②開発、③戦略、④協同、⑤統一\nC.①競争優位、②維持、③戦略、④協業、⑤統合\nD.①競争優位、②開発、③組織変更、④協同、⑤統一","answer":"■正解：C\n■解説：\n組織設計の目的は、競争優位の源泉を生み出し、それを維持できる組織を構築することにある。\n組織構造の設計や変更にあたっては、環境変化や戦略との整合性を図るだけではなく、分業と協業、指揮命令系統、管理範囲、意思決定権限、分化と統合などの要素を考慮する必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n13．組織設計 P.206-207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":245,"idx":245},{"id":"xlsx-2025春-人的資源管理-6","season":"2025春","subject":"人的資源管理","scope":"14. 組織形態","question":"■問6.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n組織形態は組織構造の決定要因に加え、外部環境・事業特性・戦略・HRポリシーなどを考慮し、代表的には（①）組織と（②）組織に分けられます。\n（①）組織は、事業形態が単純で製品の種類が少ない場合に有効とされる（③）組織と、企業の規模が拡大しさまざまなビジネスを手がける際に多くなる（④）組織に分けられる。\n（②）組織が上手く機能した場合は情報伝達が円滑になる一方で、権限や責任が曖昧かつ流動的になる点に注意が必要である。\nA. ①マトリクス型　②ヒエラルキー型　③事業部制　④機能別\nB. ①ヒエラルキー型　②マトリクス型　③機能別　④事業部制\nC. ①マトリクス型　②ヒエラルキー型　③機能別　④事業部制\nD. ①ヒエラルキー型　②マトリクス型　③事業部制　④機能別","answer":"■正解：B\n■解説：\n・組織形態は大きくヒエラルキー型組織とマトリクス型組織に分けられる。\n・ヒエラルキー型組織はさらに２つに分類され、\n①機能別組織：製造・営業・研究開発・財務/人事/経理など、それぞれの役割を理解し専　門的な部署が存在している。事業間製品間について調整の必要が少ない、一般的には製　品の種類が少なく単純な場合に有効\n②事業部制組織：企業規模が拡大し、それぞれの事業部ごとに利益責任を負うと同時に、　責任の所在が明確になり迅速なアクションが必要な場合に用いられることが多い\n・マトリクス型組織については機能別組織と事業部制組織を組み合わせ、それぞれの長所を取り入れることを目的に用いられる。その一方で権限や責任、指揮命令系統などの調整が課題となる。まずはそれぞれの組織形態の特徴をしっかり押さえましょう。","source":"Excel: GMAP道場問題秋春(2).xlsx","no":246,"idx":246},{"id":"xlsx-2025春-人的資源管理-7","season":"2025春","subject":"人的資源管理","scope":"15.人員配置","question":"■問7. 下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・人員配置とは、企業の（①）を遂行するために必要な（②）を実現することである。\n・人員配置は、求められる人員構成と現状との間の不足分を埋めること（③）と、余剰分を解消すること（④）に分けられる。\n・人材（③）にはコストがかかり、大きく分けて金銭的なコストと（⑤）コストがある。\nA. ①戦略　②人事制度　③採用　④解雇　⑤教育的\nB. ①業務　②人員構成　③代謝　④調達　⑤時間的\nC. ①業務　②人事制度　③調達　④代謝　⑤教育的\nD. ①戦略　②人員構成　③調達　④代謝　⑤時間的","answer":"■正解：D\n■解説：\n解説：\n・人員配置とは、企業の戦略を遂行するために必要な人員構成を実現することだ。\n・具体的には、求められる人員構成と現状との間の不足分を埋めること（調達）と、余剰分を解消すること（代謝）に分けられる。\n・調達には外部調達と内部調達が挙げられ、いずれにも人材調達コストがかかる。大きく分けて金銭的なコストと時間的なコストがあり、タイミングによってメリット・デメリットは求める人材の要件が異なる。\n■出典：グロービス マネジメントブック 改訂3版 　\n15．人員配置 P.210-211","source":"Excel: GMAP道場問題秋春(2).xlsx","no":247,"idx":247},{"id":"xlsx-2025春-人的資源管理-8","season":"2025春","subject":"人的資源管理","scope":"16.報奨","question":"■問8.報奨について誤っているものを選択してください。\nA.報奨基準とは「何に対して」報奨を支払うかを示したものである。\nB.報奨項目とは「どのように」報奨を支払うかを示したものである。\nC.報奨水準とは、報奨の「原資の水準」を示したものである。\nD.報奨はインセンティブの１つで、従業員の企業への貢献の対価である。","answer":"■正解：C\n■解説：\n報奨はインセンティブの一つで、従業員の会社の貢献の対価である。報奨システムを設計する際には、経済合理性や評価との整合性を考慮に入れなくてはならない。また、従業員のモチベーションを高めるために、公平で、だれもが納得できるような評価方法を用いることが不可欠だ。\n①報奨基準：「何に対して」報奨を支払うかを示したもの。報奨基準を決定することは、従業員の振る舞いや、業務への取り組み方などを規定することにつながる。\n②報奨項目：「どのように」報奨を支払うかを示したもの。毎月の給与やボーナスだけでなく、福利厚生やストック・オプションなど幅広い範囲にわたる。\n③報奨水準：「だれにいくら」報奨を支払うかを示したもの。報奨水準は、他企業と比較した場合の「外部競争力」と、従業員間のバランスをとるなどの「内部公平性」を考慮して決定する。\n■出典：グロービス マネジメントブック 改訂3版 　\n16.報奨 P.212-213","source":"Excel: GMAP道場問題秋春(2).xlsx","no":248,"idx":248},{"id":"xlsx-2025春-人的資源管理-9","season":"2025春","subject":"人的資源管理","scope":"17.評価","question":"■問９.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・企業は従業員の能力や成果を測定し評価するが、その目的はHRシステムの最適化を図るための（①）と（②）にある。\n\n・評価項目として企業は一般に、「成果」「能力」「勤務態度」などの評価項目を組み合わせて用いている。評価項目を考える際に最も重要なのは、（③）との整合性が取れていることである。\n\n・どれほど精緻な評価システムであっても、それを運用するのは人間なので、評価者が陥りがちな傾向、特に（④）や中心化傾向には気を付けることが必要である。\nA. ① データ管理　② 人材育成　③ 報酬制度　④ 確証バイアス\nB. ① スキル開発　② フィードバック　③ 経営理念　④ 厳格化傾向\nC. ① 情報収集　② コミュニケーション　③ 企業戦略　④ ハロー効果\nD. ① 報酬決定　② 配置転換　③ 組織目標　④ 寛大化傾向","answer":"■正解：C\n■解説：\n・評価の目的は情報収集とコミュニケーションである。情報収集としては、評価結果の分析により、人員配置、能力開発、報奨などHRシステムの最適化を図ることが可能となる。\n・評価結果やその理由をフィードバックすることにより、期待や改善点などを伝えるコミュニケーションをとることにつながる。\n・ハロー効果とは、特定の項目についての評価が総合的な評価に影響を与える傾向をいう。\n・中心化傾向とは、潜在的に最高の評価や最低の評価をつけることを避ける傾向をいう。評価基準が明確になっていない場合に生じやすい。\n■出典：グロービス マネジメントブック 改訂3版 　\n17.評価 P.214-215","source":"Excel: GMAP道場問題秋春(2).xlsx","no":249,"idx":249},{"id":"xlsx-2025春-人的資源管理-10","season":"2025春","subject":"人的資源管理","scope":"18.能力開発","question":"■問10.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n能力開発は「（①）」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「（②）」としてとらえることが重要だ。\n持続的に好調な業績を上げている企業には、次のような特徴が見られる。\n\n1）経営者が自分のミッションとして能力開発に積極的に関与している\n\n2）短期から中長期にかけての動態的な計画に基づいて育成を進めている\n\n3）変化に追従するための（③）を得ることではなく、変化そのものの意味合いをとらえ、進むべき方向を自ら考える（④）を開発することに投資している。\n\nA. ①コスト　②戦略的な投資　③自律的な思考力（ストック）　④最新知識（フロー）\nB. ①戦略的な投資　②コスト　③自律的な思考力（ストック）　④最新知識（フロー）\nC. ①コスト　②戦略的な投資　③最新知識（フロー）　④自律的な思考力（ストック）\nD. ①戦略的な投資　②コスト　③最新知識（フロー）　④自律的な思考力（ストック）","answer":"■正解：C\n■解説：\n能力開発は「コスト」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「戦略的な投資」としてとらえることが重要だ。\n持続的に好調な業績を上げている企業には、次のような特徴が見られる。\n\n1）経営者が自分のミッションとして能力開発に積極的に関与している\n\n2）短期から中長期にかけての動態的な計画に基づいて育成を進めている\n\n3）変化に追従するための最新知識（フロー）を得ることではなく、変化そのものの意味合いをとらえ、進むべき方向を自ら考える自律的な思考力（ストック）を開発することに投資している。\n\n「人・組織が学習する能力」によって企業の競争力が左右される今日、これらの特徴はすべての企業が留意すべき視点と言える。\n■出典：グロービス マネジメントブック 改訂3版 　\n18．能力開発 P.216-217","source":"Excel: GMAP道場問題秋春(2).xlsx","no":250,"idx":250},{"id":"xlsx-2025春-人的資源管理-11","season":"2025春","subject":"人的資源管理","scope":"21.ワーク・ライフ・バランス","question":"■問11.政府はワークライフバランスを「仕事と生活の調和」と訳し、特に企業の従業員が仕事と生活の適切なバランスをとることを提唱しています。\nでは、政府がワークライフバランスの推進を重視する背景として、主に挙げられる国家的な事情は次のうちどれでしょうか？\nA. 労働生産性の向上と経済成長の促進\nB. 高齢化社会への対応と福祉政策の強化\nC. 少子化対策と男女共同参画推進\nD. 企業の国際競争力の強化","answer":"■正解：C. 少子化対策と男女共同参画推進\n■解説：政府がワークライフバランスを推進する背景には、少子化対策と男女共同参画の推進といった社会的な要請があります。働きながら家庭生活を充実させられる環境を整えることで、子育てと仕事の両立を支援し、結果として出生率の向上や女性の社会進出を促すことが目的とされています。\nもちろん、労働生産性の向上（A）や企業の競争力強化（D）も間接的な影響として期待されていますが、政府のワークライフバランス施策の直接的な背景とは異なります。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.企業経営と人・組織のマネジメント P.222-223","source":"Excel: GMAP道場問題秋春(2).xlsx","no":251,"idx":251},{"id":"xlsx-2025春-人的資源管理-12","season":"2025春","subject":"人的資源管理","scope":"22:メンタルヘルス","question":"■問12.ハイパーチェンジ時代における企業の人事・組織マネジメントにおいて、従業員のメンタルヘルス対策は重要な課題となっています。\n「適応アプローチ」に関する記述として、最も適切なものを一つ選びなさい。\n1.適応アプローチは、従業員のメンタル不調を個人の性格や素質に起因するものと捉え、個々の性格改善や精神的な鍛錬によってストレスへの適応力を高めることを主眼とする。\n2.適応アプローチは、メンタル不調を医学的な問題として捉え、精神科医による診断と治療を最優先とし、職場環境の改善やリーダーシップの向上といった組織的な対応は二次的なものと位置づける。\n3.適応アプローチは、メンタル不調の原因を従業員と職場環境との相互作用におけるストレスと捉え、ストレス要因の除去や従業員の対処能力の向上、そして健康な従業員に対する積極的な予防策を含む、組織的かつ包括的なアプローチである。\n4.適応アプローチは、メンタル不調が現れた従業員に対して事後的に対応するものであり、日頃から働きやすい職場づくりやリーダーシップの発揮といった予防的な取り組みは、その範疇に含まれない。","answer":"■正解：3\n■解説：\n選択肢1は×。適応アプローチは、ストレス状態を性格上の問題ではなく、当人と環境との関係性の中で捉えます。個人の性格改善だけを主眼とするものではありません。\n選択肢2は×。これは「医療依存アプローチ」の説明に近い内容です。適応アプローチは医学的な対応も重要としつつも、職場のマネジメントやリーダーシップによる対応を重視します。\n選択肢3が〇。適応アプローチはストレスを原因とし、ストレッサーの除去や対処能力の改善、そして健康者への予防的な働きかけを含む、組織行動学・人的資源管理的な観点からのアプローチとして定義されています。\n選択肢4は×。適応アプローチは、メンタル不調者への事後的な対応だけでなく、健康者に対する積極的な働きかけによる予防も重要な目的としています。日頃からの適切なリーダーシップや働きやすい職場づくりがその基盤となります。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n22.メンタルヘルス P.224-225","source":"Excel: GMAP道場問題秋春(2).xlsx","no":252,"idx":252},{"id":"xlsx-2025春-人的資源管理-13","season":"2025春","subject":"人的資源管理","scope":"1. 企業経営と人・組織のマネジメント","question":"■問13.人・組織のマネジメントを正しく実行するために、認識及び理解すべき事項を説明した以下の文章のうち、適切でないものを選びなさい。\nA．人の行動メカニズムを理解することで、企業は起こりうる事態を予測し、目標を達成するために必要な施策を準備することが可能になる。\nB．意思・欲求・能力の3つの組合せに基づく何らかのメカニズムにより、人の行動はある程度決定する。\nC．人の能力は向上し、時には低下する。また、能力の種類も変化する。\nD．個人の考え方や価値観は多様性に富むため、多面的な視点からさまざまな可能性を予測すべきである","answer":"■正解：B\n■解説：\n人の行動を決定する要素には、意思、欲求、能力の３つだけでなく、「感情」も含まれる。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.企業経営と人・組織のマネジメント P.182-183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":253,"idx":253},{"id":"xlsx-2025春-人的資源管理-14","season":"2025春","subject":"人的資源管理","scope":"2.人・組織のマネジメントに影響を及ぼす要因","question":"■問14.人、組織のマネジメントを考える際、特に大きな影響を与える可能性がある６つの外部環境を把握する必要があります。（　　）に入る選択肢の組み合わせで適切なものを選んでださい。\n労働市場、①（　　　　）、労働組合、経済状況、技術的進歩、②（　　　　　　）\nA：①政治状況　②競合他社\nB：①政治状況　②海外情勢\nC：①法的規制　②競合他社\nD：①法的規制　②海外情勢","answer":"■正解：C\n■解説：\n労働市場、①（法的規制）、労働組合、経済状況、技術的進歩、②（競合他社）\n労働市場：労働市場を通じて、企業は必要な人材を確保する。労働市場の構成が変化すれば、企業の人員構成や雇用形態も影響を受ける。\n法的規制：法律や条令、裁判所が下した判例のこと。これらに従って、人と組織のマネジメントを行う。\n労働組合：労働組合とは、従業員の代表として労働条件をはじめとする従業員の経済的地位向上をさせることを目的に結成された組織である。\n経済状況：景気動向や金利・為替の変動などの経済状況も、人・組織のマネジメントに影響を及ぼす。\n技術的進歩：IT等の技術進歩は、職場環境や組織構造などに大きな影響を与える。\n競合他社：競争力を維持するためには、競合他社の従業員と同等もしくはそれ以上の能力・資質を持った従業員を獲得し、育てるような施策を用意する必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n2.人・組織のマネジメントに影響を及ぼす要因 P.184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":254,"idx":254},{"id":"xlsx-2025春-人的資源管理-15","season":"2025春","subject":"人的資源管理","scope":"3. 組織行動学と人的資源管理","question":"■問15.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A〜Dのうちから選んでください。\n人的資源管理（HRM）は次の４つの要素から構成される。\n・（①）：HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるかを決めたもの。\n・（②）：組織構成員が共有する信念、価値観、行動規範の集合体のこと。（②）は厳密には「仕組み」とは言えないが、人や組織の行動に影響を与える重要な要素の1つとして考慮する必要がある。企業は経営理念やビジョン、HRMの施策などを通して、（②）に間接的な影響を与えることができる。\n・（③）：HRポリシーに基づいて、個々の構成員をどのように活用・管理していくかを決めたもの。（③）はさらに「人員配置」「報酬」「評価」「能力開発」に分けられる。\n・（④）：企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどうあるべきかを示すもの。したがって、（④）は企業の経営理念、ビジョン、戦略と密接に関係したものになる。\nA.①組織構造、②組織文化、③HRシステム、④HRポリシー\nB.①組織文化、②組織構造、③HRシステム、④HRポリシー\nC.①HRシステム、②組織文化、③組織構造、④HRポリシー\nD.①HRシステム、②組織構造、③組織文化、④HRポリシー","answer":"■正解：A\n■解説：\n人的資源管理（HRM）は次の４つの要素から構成される。\n・組織構造：HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるかを決めたもの。\n・組織文化：組織構成員が共有する信念、価値観、行動規範の集合体のこと。組織文化は厳密には「仕組み」とは言えないが、人や組織の行動に影響を与える重要な要素の1つとして考慮する必要がある。企業は経営理念やビジョン、HRMの施策などを通して、組織文化に間接的な影響を与えることができる。\n・HRシステム：HRポリシーに基づいて、個々の構成員をどのように活用・管理していくかを決めたもの。HRシステムはさらに「人員配置」「報酬」「評価」「能力開発」に分けられる。\n・HRポリシー：企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどうあるべきかを示すもの。したがって、HRポリシーは企業の経営理念、ビジョン、戦略と密接に関係したものになる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n3．組織行動学と人的資源管理 P.186-187","source":"Excel: GMAP道場問題秋春(2).xlsx","no":255,"idx":255},{"id":"xlsx-2025春-人的資源管理-16","season":"2025春","subject":"人的資源管理","scope":"12. 組織文化と企業経営","question":"■問16.下記の組織文化と企業経営に関する説明で、正しい選択肢を全て選んでください\nA.組織文化は「組織構成員が共有する信念、価値観、行動規範の集合体」と定義できる\nB.企業は組織文化を直接コントロールすることができる\nC.組織文化の形成は、「生成段階・浸透段階」の２段階に分けることが出来る\nD.組織文化の機能は、大きく「判断や行動の指針・情報伝達の簡素化・個人の動機づけ」と３つの機能をもつ","answer":"■正解：A,C,Dが正しい\n■解説：\n誤：企業は組織文化を直接コントロールすることができる\n正：直接コントロールすることはできないが、間接的に影響を与えることは可能\nなお、そのためにはできるだけ具体的に組織文化を把握しておくこと。\n組織文化を把握するには組織固有の行動パターンを観察すると良い。\n■出典：グロービス マネジメントブック 改訂3版 　\n12．組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":256,"idx":256},{"id":"xlsx-2025春-人的資源管理-17","season":"2025春","subject":"人的資源管理","scope":"13. 組織設計","question":"■問17.組織設計の目的は、競争優位の源泉を生み出し、それを維持できる組織を構築することである。\n下記から、組織設計について、誤っているものを全て選択してください。\nA.組織設計とは、企業戦略を遂行するために個々の業務をどのように組み合わせ、及びそれらをどのように行うか決定することである。\nB.アメリカの経営史学者のジョン・P・コッターは、多角化戦略をとる企業の組織形態は従来の機能別組織から事業部制へ移行することを示し、 戦略に合わせて個別最適な組織を設計していくべきであると論じた。\nC.「組織図」で表される部門名や配置人員数などの動的な側面だけでなく、業務のプロセスや意思決定プロセスなどの静的な側面も考慮する必要はない。\nD. 一度出来上がった組織を変えることが難しく、しばしば現状維持へと走りがちである。企業は外部環境や戦略との整合性を常に意識し、競争優位の源泉を生み出し、それを維持できるような組織構造の構築を目指す必要がある。","answer":"■正解：BとC\n■解説：\nA.正しい\nB.アメリカの経営史学者のA.D.チャンドラーは、多角化戦略をとる企業の組織形態は従来の機能別組織から事業部制へ移行することを示し、 戦略に合わせて最適な組織を設計していくべきであると論じた。\nC.「組織図」で表される部門名や配置人員数などの静的な側面だけでなく、業務のプロセスや意思決定プロセスなどの動的な側面も考慮する必要はある。\nD.正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n13.組織設計 P.206-207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":257,"idx":257},{"id":"xlsx-2025春-人的資源管理-18","season":"2025春","subject":"人的資源管理","scope":"14.組織形態","question":"■問18.組織形態について正しいものを選択してください。\nA.機能別組織は幅広い知識を持ったマネジャーが育ちやすく、組織間のシナジーを生み出しやすい。\nB.事業部制組織の事業部長レベルでは、事業経営に関して部分的な意思決定にしか参画しないため、管理職がマネジメント・スキルを磨く機会が少ない。\nC.マトリクス型組織では1人のボスからの権限や責任が明確であり、指揮命令系統がわかりやすい。\nD.組織形態は組織構造の決定要因に加え、外部環境、事業特性、戦略、HRポリシーなどを考慮して設計する。","answer":"■正解：D\n■解説：\nA 　× 機能別組織では幅広い知識を持ったマネジャーが育ちにくく、組織間のコンフリクトが起きやすい。その結果、最終的な意思決定がトップ・マネジメントに委ねられることが多くなり、意識決定に時間を要する。\nB 　×　事業部制組織では、責任の所在が明確で、事業部長レベルでかなりの経営判断ができるため、問題解決のための迅速なアクションが可能だ。事業経営に関して早い段階から広範囲にわたる意思決定に参画できるので、管理職がマネジメント・スキルを磨く機会も増える。\nC 　×　マトリクス型組織がうまく機能した場合は、情報伝達が円滑になり、1人の人間が2つの役割を同時に効果的に果たすことが期待できる。その一方で、構成員は通常2人のボスを持つことになるので、権限や責任が曖昧かつ流動的になり、指揮命令系統が混乱したり、業務に支障が生じるおそれがある。\nD 　◯ 組織形態は組織構造の決定要因に加え、外部環境、事業特性、戦略、HRポリシーなどを考慮して設計する。\n■出典：グロービス マネジメントブック 改訂3版 　\n14.組織形態 P.208-209","source":"Excel: GMAP道場問題秋春(2).xlsx","no":258,"idx":258},{"id":"xlsx-2025春-人的資源管理-19","season":"2025春","subject":"人的資源管理","scope":"","question":"■問19.人員配置における外部調達と内部調達のそれぞれの特徴について、誤っているものを全て選択\nしてください。\nA.内部調達の場合は金銭的コストが一切かからないため、負担なく実現できる。\nB.内部調達は、その人材に関しあらかじめ得られる情報が豊富なので、その人材が求める要件を満たし\nているかどうか評価しやすいが、外部調達は得られる情報が限定的のため、評価の精度をあげるための\n工夫（インターンシップなど）が行われている。\nC.人材調達は当事者だけでなく他の組織構成員にも影響を与える。生え抜きの部門長をいきなり外部人\n材に変えるなどの外部調達をした場合は、昇進の機会を失った内部調達候補者のモチベーションが下が\nるほか、組織文化のコンフリクトの原因になるなど、マイナスの影響が懸念される。\nD.変化の激しい環境下においてはスピーディーな決断が求められるため、既に組織文化に適合している\n生え抜きの人材を登用する内部調達が適している。","answer":"■正解：A、D\n■解説：\nA：\n内部調達は金銭的コストが不要に見えるが、実際にはその人材が現在のスキルや経験を身に着けるまで\nの能力開発・育成コストがかかっている。\nD：変化の激しい環境には、外部調達がより適している。通常は短期間で調達できることや、組織間の\nセクショナリズムやマンネリズムの打破、組織の活性化につながるなど、変化への刺激となる効果が期\n待できることによる。\n一方、内部調達は、育成に時間がかかることや、時間をかけて候補人材の評価をすること、内部調達の\n登用は他の組織構成員にも将来のキャリアに対する期待が高まるなどの効果が期待できることから、予\n見可能な安定した環境により適している。\n■出典：グロービス マネジメントブック 改訂3版 　\n15.人員配置 P.210-211","source":"Excel: GMAP道場問題秋春(2).xlsx","no":259,"idx":259},{"id":"xlsx-2025春-人的資源管理-20","season":"2025春","subject":"人的資源管理","scope":"","question":"■問20.　報奨の基本要素の一つである報奨項目の種類について、下記文章中の（①）～（④）に入る\n語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n・基本給と手当：基本給は金銭的報奨の根幹であるため、基本給の（①）や報奨水準は慎重に決定する\n必要がある。手当は基本給を補完する役割を持ち、多様な形態をとる。\n・（②）：個人の成果や部門・企業の業績が目標に対する達成度などの基準を満たした場合、それに応\nじて個人に支払われるものである。たとえば、プロフィット・シェアリングなどがある。\n・福利厚生（③）：その企業に所属していることによって得られる特典のすべてが該当する。従来は、\n全従業員に一律に付与する企業が多く見られた。しかし、従業員の価値観やライフスタイルが多様化す\nるにつれて、一律付与は合理的ではなくなり、福利厚生を効率的に提供しようとする動きがある。その\n一例が、（④）だ。これは、従業員が一定ポイントを持ち、その範囲内で希望する福利厚生を選択でき\nる仕組みになっている。\nA. ①報奨基準　②ボーナス　③フリンジ・ベネフィット　④セレクティブ・プラン\nB. ①金額　②インセンティブ・システム　③カンパニー・ベネフィット　④セレクティブ・プラン\nC. ①報奨基準　②インセンティブ・システム　③フリンジ・ベネフィット　④カフェテリア・プラン\nD. ①金額　②ボーナス　③カンパニー・ベネフィット　④カフェテリア・プラン","answer":"■正解：C\n■解説：\n報奨は、次の3つの基本的な要素に分けて考えると分かりやすい。報奨基準は「何に対して」報奨を支払\nうか示したもので、報奨項目は「どのように」報奨を支払うかを示したもので、報奨水準は「だれにいく\nら」報奨を支払うかを示したものである。\n基本給は金銭的報奨の根幹であるため、基本給の①報奨基準や報奨水準は慎重に決定する必要がある。\n②インセンティブ・システム：個人の成果や部門・企業の業績が目標に対する達成度などの基準を満た\nした場合、それに応じて個人に支払われるものである。たとえば、プロフィット・シェアリングなどが\nある。なお、日本企業で一般的な賞与は、固定的な給与としての色合いが強い。\n福利厚生（③フリンジ・ベネフィット）：その企業に所属していることによって得られる特典のすべて\nが該当する。従来は、全従業員に一律に付与する企業が多く見られた。しかし、従業員の価値観やライ\nフスタイルが多様化するにつれて、一律付与は合理的ではなくなり、福利厚生を効率的に提供しようと\nする動きがある。その一例が、（④カフェテリア・プラン）だ。これは、従業員が一定ポイントを持ち、\nその範囲内で希望する福利厚生を選択できる仕組みになっている。\n■出典：グロービス マネジメントブック 改訂3版 　\n16.報奨　 P.212-213","source":"Excel: GMAP道場問題秋春(2).xlsx","no":260,"idx":260},{"id":"xlsx-2025春-人的資源管理-21","season":"2025春","subject":"人的資源管理","scope":"","question":"■問21.次のうち、人事評価制度における“評価結果の活用”として最も望ましくないものを1つ選びな\nさい。\nA. 昇進・昇格の選抜に活用する\nB. 業績や行動の傾向を把握し、今後の配置や育成方針に活かす\nC. 評価スコアをもとに給与テーブルに機械的に連動させる\nD. 従業員との面談を通じて、成長や改善点の認識を共有する\nE. 組織全体のパフォーマンス分析に役立てる","answer":"■正解：C\n■解説：\n評価結果を給与に反映させること自体は適切だが、「機械的に」連動させるのはリスクが高い。評価は\nあくまで人の成長や状況を踏まえた総合判断であり、機械的な処理は誤ったメッセージを与える可能性\nがある。コミュニケーションや納得感の醸成が不可欠。\n■出典：グロービス マネジメントブック 改訂3版 　\n17.評価　 P.214-215","source":"Excel: GMAP道場問題秋春(2).xlsx","no":261,"idx":261},{"id":"xlsx-2025春-人的資源管理-22","season":"2025春","subject":"人的資源管理","scope":"","question":"■問22.\n経験則が通用しにくい現代において、日本企業が能力開発の中心としてきたOJTの限界を補完するため\nに、より重視すべきと考えられるOff-JTの役割として最も適切なものはどれか。\n1.既存の業務知識やスキルを効率的に反復学習し、定着させること。\n2.体系化された知識や理論を習得し、変化の本質を理解するための自律的な思考力（ストック）を開発\nすること。\n3.職場内の人間関係を円滑にし、チームワークを高めるためのコミュニケーションスキルを向上させる\nこと。\n4.最新の業界動向や競合他社の戦略に関する情報を収集し、共有すること。","answer":"■正解：2\n■解説：\nOJTが中心であった従来の能力開発に対し、経験則が通用しなくなっている状況下でOff-JTの有効活用\nが提唱されています。特に、変化に追従するための最新知識（フロー）だけでなく、変化そのものの意\n味合いを捉え、自ら考える自律的な思考力（ストック）を開発することへの投資の重要性が強調されて\nいます。\n■出典：グロービス マネジメントブック 改訂3版 　\n18.能力開発 P.216-217","source":"Excel: GMAP道場問題秋春(2).xlsx","no":262,"idx":262},{"id":"xlsx-2025春-人的資源管理-23","season":"2025春","subject":"人的資源管理","scope":"","question":"■問23.ワーク・ライフ・バランスを通じて従業員に豊かな生活基盤を提供することが必要です。以下\nの選択肢の中で、誤っているものを一つ選んでください。\nA.人間は、組織の構成員である以前にひとつの人格である。家族、地域社会、学校の同窓会などの一員\nでもあり、これらの組織や社会において一定の役割を担うことを期待されているし、また貢献したいと\n望んでいる。\nB.人間の社会的生活における多面性を理解しないままマネジメントすることは、個人の人間性を否定す\nるものである。\nC.マネジメントとしては、従業員が組織における役割とそれ以外の社会における役割をメリハリをもっ\nて担えるようサポートすることが求められる。\nD.ワーク・ライフ・バランスを実現させることは、短期的に人材獲得の競争力や企業業績にもつながっ\nていく。","answer":"■正解：D\n■解説：\nワーク・ライフ・バランスを実現させることは、長い目でみればCSRを果たすことにもつながり、人材\n獲得の競争力や企業業績にもつながっていく。\nワーク・ライフ・バランスを実現させるために多くの組織ではフレックスタイムでの勤務、在宅での勤\n務、弾力的な休職制度、いったん家庭の事情で退職した社員の再雇用、パートタイム労働の多様化など、\n多様かつ柔軟な働き方ができるような制度を設け始めている。このような制度を設けることは、直接\n的・短期的には経済合理的ではないこともあるかもしれない。\n■出典：グロービス マネジメントブック 改訂3版 　\n5.これからの人・組織のマネジメント（増補）企業経営と人・組織のマネジメント P.222-223","source":"Excel: GMAP道場問題秋春(2).xlsx","no":263,"idx":263},{"id":"xlsx-2025春-人的資源管理-24","season":"2025春","subject":"人的資源管理","scope":"","question":"■問24.メンタルヘルスに関する記述について、（　　）の中に入れる語句の組み合わせとして正しい\nものを選んでください。\n大きな変革の時代を、カナダのストレス研究所所長のリチャード・アール博士は、（①）と名付けた。\n変化のスピードだけではなく、変化の「目新しさ」と「②」に注目した概念で、予測できず備えられな\nいことが不安材料となりストレスを引き起こす。\nメンタルヘルス問題に対し、医学のみではなく、職場において対応可能なケースを見極め、（③）、人\n的資源管理の両面から適切な対応をうつアプローチを（④）アプローチという。\nA：①ニュー・ジェネレーション、
