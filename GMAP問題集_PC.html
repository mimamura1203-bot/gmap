  showAnswer=false;
  render();
}
function randomQ(){
  if(!filtered.length){toast('対象の問題がありません'); return;}
  if(filtered.length===1)current=0;
  else{
    var next=current, guard=0;
    while(next===current && guard<10){next=Math.floor(Math.random()*filtered.length);guard++;}
    current=next;
  }
  showAnswer=false; closeDrawer(); render(); toast('ランダムで移動しました');
}
function mark(s){
  var q=cur(); if(!q)return;
  var r=rec(q.id||curIndex());
  r.status=s;
  r.attempts=(r.attempts||0)+1;
  if(s==='correct')r.corrects=(r.corrects||0)+1;
  saveRecords();
  toast(s==='correct'?'正解にしました':'不正解にしました');
  render();
}
function toggleReview(){
  var q=cur(); if(!q)return;
  var r=rec(q.id||curIndex());
  r.review=!r.review;
  saveRecords();
  toast(r.review?'復習マークを付けました':'復習マークを外しました');
  render();
}
function retryLowRate(){
  var exists=false;
  DATA.forEach(function(q,i){
    var r=rec(q.id||i);
    if(r.attempts && ((r.corrects||0)/r.attempts)<0.7)exists=true;
  });
  if(!exists){toast('正答率70%未満の問題はありません'); return;}
  var st=$('statusFilter'); if(st)st.value='lowrate';
  current=0; showAnswer=false; closeDrawer(); applyFilters(); toast('低正答率の問題に絞りました');
}
function showAllQuestions(){
  var s=$('subjectFilter'); if(s)s.value='';
  updateScopeOptions();
  var sc=$('scopeFilter'); if(sc)sc.value='';
  var st=$('statusFilter'); if(st)st.value='all';
  var kw=$('search'); if(kw)kw.value='';
  current=0; showAnswer=false; closeDrawer(); applyFilters(); toast('全問題に戻しました');
}

function selectSubjectFromTop(subj){
  var s=$('subjectFilter');
  if(s){
    s.value=subj;
    updateScopeOptions();
  }
  var sc=$('scopeFilter');
  if(sc)sc.value='';
  current=0;
  showAnswer=false;
  closeDrawer();
  applyFilters();
  toast(subj+' の問題を表示しました');
}

function toggleDrawer(){var d=$('drawer'); if(d)d.classList.toggle('open');}
function closeDrawer(){var d=$('drawer'); if(d)d.classList.remove('open');}
var clearArmed=false;
function clearRecords(){
  if(!clearArmed){
    clearArmed=true;
    toast('もう一度「記録削除」を押すと削除します');
    setTimeout(function(){clearArmed=false;},3000);
    return;
  }
  clearArmed=false;
  records={}; saveRecords(); render(); toast('学習記録を削除しました');
}
function renderList(){
  var html='';
  if(listOpen){
    filtered.forEach(function(idx,j){
      var q=DATA[idx], r=rec(q.id||idx);
      var cls=(j===current?'current ':'')+(r.status==='correct'?'correct ':'')+(r.status==='wrong'?'wrong ':'')+(r.review?'review ':'')+(isLowRateRecord(r)?'lowrate ':'');
      var qr=r.attempts?Math.round((r.corrects||0)/r.attempts*100)+'%':'-';
      html+='<button type="button" class="'+cls+'" data-jump="'+j+'">'+esc((j+1)+'. '+(q.subject||'')+'｜'+(q.scope||'')+'｜回答'+(r.attempts||0)+'回／正答率'+qr)+'</button>';
    });
  }
  var box=$('list');
  if(box){
    box.classList.toggle('open',listOpen);
    box.innerHTML=listOpen?html:'';
  }
  var bottom=$('bottomList');
  var body=$('bottomListBody');
  if(bottom)bottom.classList.toggle('open',listOpen);
  if(body)body.innerHTML=listOpen?html:'';
  var c=(body&&body.querySelector('.current')) || (box&&box.querySelector('.current'));
  if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'nearest'});}catch(e){}
}
function bindButton(id,fn){
  var e=$(id); if(!e)return;
  var lock=0;
  function run(ev){if(ev){ev.preventDefault();ev.stopPropagation();} var now=Date.now(); if(now-lock<230)return false; lock=now; fn(); return false;}
  e.onclick=run; e.addEventListener('touchend',run,false); e.addEventListener('pointerup',run,false);
}
function bindCommon(){
  bindButton('btnCorrect',function(){mark('correct');});
  bindButton('btnWrong',function(){mark('wrong');});
  bindButton('btnReview',toggleReview);
  bindButton('btnList',function(){listOpen=!listOpen; renderList();});
  bindButton('btnCloseList',function(){listOpen=false; renderList();});
  bindButton('btnExport',exportRecords);
  bindButton('btnClear',clearRecords);
  bindButton('btnClose',closeDrawer);
  var subjectSelect=$('subjectFilter');
  if(subjectSelect)subjectSelect.onchange=function(){updateScopeOptions();};
  ['scopeFilter','statusFilter'].forEach(function(id){var e=$(id); if(e)e.onchange=function(){};});
  var s=$('search'); if(s)s.oninput=function(){};
  bindButton('btnApply',function(){applyFilters(); closeDrawer();});
  document.addEventListener('click',function(ev){
    var j=ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-jump');
    if(j!=null){ev.preventDefault(); current=Number(j)||0; showAnswer=false; closeDrawer(); render();}
  },false);
  var drawer=$('drawer');
  if(drawer){
    ['click','touchend','pointerup'].forEach(function(type){
      drawer.addEventListener(type,function(ev){ev.stopPropagation();},false);
    });
  }
    var subjectRates=$('subjectRates');
  if(subjectRates){
    subjectRates.addEventListener('click',function(ev){
      var card=ev.target.closest&&ev.target.closest('.subject-card');
      if(!card)return;
      var subj=card.getAttribute('data-subject');
      if(subj)selectSubjectFromTop(subj);
    },false);
  }

  window.addEventListener('resize',function(){setTimeout(fitAllText,120);});
  window.addEventListener('orientationchange',function(){setTimeout(fitAllText,300);});
}
function bindTouch(){
  var stage=$('stage'); if(!stage)return;
  stage.addEventListener('touchstart',function(ev){
    if(ev.target.closest&&ev.target.closest('button,select,input,.drawer'))return;
    var t=ev.touches&&ev.touches[0]; if(!t)return;
    touchStartX=t.clientX; touchStartY=t.clientY; touchStartTime=Date.now();
  },{passive:true});
  stage.addEventListener('touchend',function(ev){
    if(ev.target.closest&&ev.target.closest('button,select,input,.drawer'))return;
    var now=Date.now(); if(now-lastTap<220)return;
    var t=ev.changedTouches&&ev.changedTouches[0]; if(!t)return;
    var dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
    lastTap=now;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.25){dx<0?move(1):move(-1); return;}
    if(Math.abs(dx)<20 && Math.abs(dy)<20 && now-touchStartTime<600)toggleAnswer();
  },false);
  stage.addEventListener('click',function(ev){
    if(ev.target.closest&&ev.target.closest('button,select,input,.drawer'))return;
    if(Date.now()-lastTap<350)return;
    toggleAnswer();
  },false);
}
function bindKeyboard(){
  document.addEventListener('keydown',function(ev){
    var tag=(ev.target&&ev.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea'){
      if(ev.key==='Escape'){ev.target.blur(); closeDrawer();}
      return;
    }
    if(ev.key===' '){ev.preventDefault(); toggleAnswer();}
    else if(ev.key==='ArrowRight'){ev.preventDefault(); move(1);}
    else if(ev.key==='ArrowLeft'){ev.preventDefault(); move(-1);}
    else if(ev.key==='1'){ev.preventDefault(); mark('correct');}
    else if(ev.key==='2'){ev.preventDefault(); mark('wrong');}
    else if(ev.key==='r'||ev.key==='R'){ev.preventDefault(); toggleReview();}
    else if(ev.key==='l'||ev.key==='L'){ev.preventDefault(); listOpen=!listOpen; renderList();}
    else if(ev.key==='Escape'){ev.preventDefault(); closeDrawer();}
  });
}
function init(){
  loadAll();
  fillSelect('subjectFilter',unique('subject'));
  updateScopeOptions();
  filtered=DATA.map(function(_,i){return i;});
  bindCommon();
  bindKeyboard();
  render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
