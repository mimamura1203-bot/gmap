②予測不能性、③組織行動学、④人的\nB：①ハイパー・チェンジ・エイジ、②予測可能性、③健康管理、④適応\nC：①ハイパー・チェンジ・エイジ、②予測不能性、③組織行動学、④適応\nD：①ニュー・ジェネレーション、②予測可能性、③健康管理、人的","answer":"■正解：C\n■解説：\n大きな変革の時代を、カナダのストレス研究所所長のリチャード・アール博士は、（①ハイパー・チェ\nンジ・エイジ）と名付けた。変化のスピードだけではなく、変化の「目新しさ」と「②予測不能性」に\n注目した概念で、予測できず備えられないことが不安材料となりストレスを引き起こす。\nメンタルヘルス問題に対し、医学のみではなく、職場において対応可能なケースを見極め、（③組織行\n動学）、人的資源管理の両面から適切な対応をうつアプローチを（④適応）アプローチという。\n■出典：グロービス マネジメントブック 改訂3版 　\n22.メンタルヘルス P.224-225","source":"Excel: GMAP道場問題秋春(2).xlsx","no":264,"idx":264},{"id":"xlsx-2025春-人的資源管理-25","season":"2025春","subject":"人的資源管理","scope":"","question":"■問25.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A?Dのうちか\nら選んでください。\n人・組織のマネジメントは、（①）の達成という企業の目的と、生活維持や（②）などの個人の目的と\nをうまく適合させ、（③）の源泉を築くことを目指している。\n人・組織のマネジメントを理解し身につけるには、人の（④）や行動のメカニズムについて把握する必\n要がある。\nA.①企業理念、②目標達成、③競争原理、④意思\nB.①戦略目標、②自己実現、③競争優位、④特徴\nC.①企業理念、②自己実現、③競争戦略、④思考\nD.①戦略目標、②目標達成、③競争優位、④意図","answer":"■正解：B\n■解説：\n人・組織のマネジメントは、戦略目標の達成という企業の目的と、生活維持や自己実現などの個人の目\n的とをうまく適合させ、競争優位の源泉を築くことを目指している。\n人・組織のマネジメントを理解し身につけるには、人の特徴や行動のメカニズムについて把握する必要\nがある。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.企業経営と人・組織のマネジメント P.182-183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":265,"idx":265},{"id":"xlsx-2025春-人的資源管理-26","season":"2025春","subject":"人的資源管理","scope":"","question":"■問26.人、組織のマネジメントについての説明で、誤っている文章を全て選択してください。\nA：まずは内部環境から把握する必要がある\nB：外部環境のいくつかの要因は人・組織のマネジメントに特に大きな影響を与える可能性がある\nC：労働組合は社内組織とみなし、従業員の代表として会社と交渉を行う\nD：近年は潜在的労働力を活用する方法を考える必要がある","answer":"■正解：A･C\n■解説：\nAとCは以下の部分が間違いです。\nA：まずは内部環境から把握する必要がある\n　→まずは外部環境を把握する必要がある\nC：労働組合は社内組織とみなし、従業員の代表として会社と交渉を行う\n　→企業内に置かれている労働組合は従業員が作ったもので「社内組織」とは見なさない。\n■出典：グロービス マネジメントブック 改訂3版 　\n2.人・組織のマネジメントに影響を及ぼす要因 P.184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":266,"idx":266},{"id":"xlsx-2025春-人的資源管理-27","season":"2025春","subject":"人的資源管理","scope":"","question":"■問27.組織行動学と人的資源管理について、正しいものをすべて選んでください。\nA. 組織行動学（OB）はマネジャーなどの「仕組み」によって、人的資源管理（HRM）では評価制度な\nどの「個人の取り組み」を作ることによって、組織や人に働きかける。\nB. 人・組織のマネジメントには、部下の管理やリーダーシップなどを扱う組織行動学（OB）と、人員\n配置や評価制度などを扱う人的資源管理（HRM）という２つの領域がある。いずれも「人の行動メカニ\nズム」に基づいている。両者の具体的な施策間で柔軟性を持つことが重要である。\nC. 組織行動学（OB）の視点では、２つの側面で考える必要がある。\n「①個人・集団・組織」では、人の行動は、「個人」「集団」「組織」かによって異なる。例えば、意\n思決定をする場合、要する時間やコンフリクトの多寡などに違いが生じる。そのため、それぞれの特徴\nを理解しておくことが、マネジメントを行う上では重要である。\n「②認識・行動」では、人や組織に働きかけるときには、自分が取るべき行動と、他者や組織に与える\n影響について十分に考慮した上で行動をすることが必要である。「行動」の前には必ず「認識」という\nステップを踏むことが重要である。\nD. 人的資源管理（HRM）の視点では、４つの要素から構成される。\n人的資源管理（HRM）の施策を立案・評価する際の考え方の枠組みは以下の４つである。\n① HRポリシー、②組織構造、③HRシステム、④組織文化","answer":"■正解：C、D\n■解説：\nA.誤り\nOBはマネジャーなどの「個人の取り組み」で、HRMでは評価制度などの「仕組み」で、組織や人に働\nきかける。\nB.誤り\n人・組織のマネジメントには、部下の管理やリーダーシップなどを扱う組織行動学（OB）と、人員配\n置や評価制度などを扱う人的資源管理（HRM）という２つの領域がある。いずれも「人の行動メカニズ\nム」に基づいている。両者の具体的な施策間で整合性を図ることが重要である。\nC.正解\nD.正解\n＜補足＞\nHRポリシー：企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどう\nあるべきかを示すもの。\n組織構造：HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるかを決\nめたもの。\nHRシステム：HRポリシーに基づいて、個々の構成員をどのように活用・管理していくかを決めたもの。\nHRシステムはさらに「人員配置」「報奨」「評価」「能力開発」に分けられる。\n組織文化：組織構成員が共有する信念、価値観、行動規範の集合体のこと。\n■出典：グロービス マネジメントブック 改訂3版 　\n03．組織行動学と人的資源管理　P. 186-187\n出題範囲：12.組織文化と企業経営\n■問28.組織文化について誤っているものを選択してください。","source":"Excel: GMAP道場問題秋春(2).xlsx","no":267,"idx":267},{"id":"xlsx-2025春-人的資源管理-28","season":"2025春","subject":"人的資源管理","scope":"","question":"■問28.組織文化について誤っているものを選択してください。\nA.組織文化は、「組織構成員が共有する信念、価値観、行動規範の集合体」と定義できる。\nB.組織文化の浸透段階では、儀式や逸話、経営陣のメッセージなど具体的な形になったものや、すでに\n組織文化を共有している構成員との交流などを通じて、他の構成員に伝播していく。\nC.組織文化は、とるべき判断や行動の指針を与える。その結果、意思決定のスピードを速め、学習コス\nトも増加する。\nD.組織文化は、組織の行動規範や価値観を通じて、昇進や昇給などの評価基準を明確にする。","answer":"■正解：C\n■解説：\nA ◯ 組織文化は、「組織構成員が共有する信念、価値観、行動規範の集合体」と定義できる。組織文\n化は価値観や行動規範として構成員の行動を規定する。\nB　◯　組織文化の浸透段階では、儀式や逸話、経営陣のメッセージなど具体的な形になったものや、\nすでに組織文化を共有している構成員との交流などを通じて、他の構成員に伝播していく。構成員の行\n動パターンに影響を与える評価基準などをHRMの施策として示すことも、組織文化の浸透に役立つ。\nC 　×　組織文化は、とるべき判断や行動の指針を与える。その結果、意思決定のスピードを速め、学\n習コストは低減する。\nD 　◯ 組織文化は、組織の行動規範や価値観を通じて、昇進や昇給などの評価基準を明確にする。組織\n文化によって、構成員は何を行えば組織で評価されるかを学び、自らの目標を設定し、実践するための\nモチベーションを高めることができる。\n■出典：グロービス マネジメントブック 改訂3版 　\n12.組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":268,"idx":268},{"id":"xlsx-2025春-人的資源管理-29","season":"2025春","subject":"人的資源管理","scope":"13. 組織設計","question":"出題範囲：13. 組織設計\n■問29.組織設計にあたって考慮すべき要素には、分業と協業、指揮命令系統、管理範囲、意思決定権\n限、分化と統合が挙げられる。それぞれの特徴について、誤っているものを全て選択してください。\nA.ある程度までの分業は効率化に役立つが、過度の業務細分化は従業員のモチベーションや業務効率を\n低下させる原因になりうるため、効率化を最大化する分業の度合いを見つけ出すことがポイントである。\nB.指揮命令系統とは、命令や指示、報告などを含む情報の流れを指し、問題が生じたときには臨機応変\nに変更すべきである。\nC.管理範囲とは1人のマネージャーが統制できる構成員の数を示すもので、適切な範囲は業務の目的や\n種類により変わるため、マネージャーはその業務に応じた適切な人数を統制できる人員を配置すべきで\nある。\nD.意思決定権限とは、組織のどこで意思決定を行うかを示すもので、意思決定の精度と効率化を高める\nためにはできる限り分権化を進めることが望ましい。\nE.分化と統合は、ユニットを分離し、または統一して管理することをいうが、いずれも企業全体の付加\n価値や効率を高めていこうという考え方に基づく。","answer":"■正解：Ｂ、Ｃ、D\n■解説：\nB：「問題が生じたときに、だれに報告・相談すればよいか」といった指揮命令系統の一貫性と明確さ\nは業務を行ううえで不可欠である。\nC：適切な管理範囲は、業務の複雑さや、マネージャーと部下の能力、情報収集の難易度など複数の要\n素によって変わる。\nD：意思決定の精度と効率化を高めるためには、集約化と分権化の適度なバランスをとることが必要で\nある。\n■出典：グロービス マネジメントブック 改訂3版 　\n13.組織設計 P.206-207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":269,"idx":269},{"id":"xlsx-2025春-人的資源管理-30","season":"2025春","subject":"人的資源管理","scope":"","question":"■問30.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちか\nら選んでください。\n・機能別組織は、戦略遂行していく際の機能ごとに構成された組織形態だ。部門間で機能の重複がない\nので、（①）の点で優れている。一方で、事業や製品について各機能部門の意思決定への関与が不明確\nなため（②）の所在が曖昧になりやすい。\n・事業部制組織では、事業経営に関して（③）が行われ、各事業部は利益責任を負う。早い時期から広\n範囲にわたる意思決定に参画できるので、管理職がマネジメント・スキルを磨く機会も増える。\n・マトリクス組織がうまく機能した場合は、情報伝達が円滑になり、1人の人間が2つの役割を同時に\n効果的に果たすことが期待できる。一方で、（④）が曖昧かつ流動的になり、指揮命令系統が混乱した\nり、業務に支障を生じるおそれがある。\nA. ①経営効率　②事業責任　③権限委譲　④権限や責任\nB. ①リーダー育成　②事業責任　③権限集約　④人事評価\nC. ①リーダー育成　②専門性　③権限委譲　④権限や責任\nD. ①経営効率　②専門性　③権限集約　④人事評価","answer":"■正解：A\n■解説：\nA. ①経営効率　②事業責任　③権限委譲　④権限や責任\n■出典：グロービス マネジメントブック 改訂3版 　\n14．組織形態 P.208-209","source":"Excel: GMAP道場問題秋春(2).xlsx","no":270,"idx":270},{"id":"xlsx-2025春-組織行動-1","season":"2025春","subject":"組織行動","scope":"4.リーダーシップとマネジメント","question":"■問 01. リーダーシップとマネジメントの機能についての出題です。\n下記文章中の（①）～（⑤）に入る語句の組み合わせ として適切なものを選択肢A~Gのうちから選んでください。\n■リーダーシップ((①)を推し進める機能)\n1. (②)なビジョンを提示する。\n2. ビジョンを伝達することにより、メンバーを統合する。\n3. メンバーの(③)を行う。\n■マネジメント(効率的に組織を運営する機能)\n1. (④)な計画や予算を立案する。\n2. (⑤)の設計、人員の配置、詳細計画のコミュニケーションなどを行う。\n3. 予算や実績管理などを行い、問題解決を図る。\nA. 改善\nB. 変革\nC. 短期的\nD. 長期的\nE. 管理\nF. 動機付け\nG. 組織構造","answer":"■正解：\n①B.変革 ②D.長期的 ③.F. 動機付け ④C.短期的 ⑤G. .組織構造\n■解説：\n■リーダーシップ((変革)を推し進める機能)\n1. (長期的)なビジョンを提示する。\n2. ビジョンを伝達することにより、メンバーを統合する。\n3. メンバーの(動機付け)を行う。\n■マネジメント(効率的に組織を運営する機能)\n1. (短期的)な計画や予算を立案する。\n2. (組織構造)の設計、人員の配置、詳細計画のコミュニケーションなどを行う。\n3. 予算や実績管理などを行い、問題解決を図る\n■出典：グロービス マネジメントブック 改訂3版 　\n4.リーダーシップとマネジメント P.188 - P189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":271,"idx":271},{"id":"xlsx-2025春-組織行動-2","season":"2025春","subject":"組織行動","scope":"5. エンパワーメント","question":"■問2 エンパワーメントについて、誤っているものをすべて選択してください。\nA. エンパワーメントを有効に活用するには、構成員の自律性を促すと同時に、その行動を制御することも必要。\nB. エンパワーメントの成功要件は「正当な評価と報奨」、「能力の把握と資源の提供」であり、経営理念やビジョンの共有は行うべきではない。\nC. OBの取り組みとして、行動規範にかなった行動は褒め、反する行動に対して改善を求めることが挙げられる。\nD. OBの仕組みとして、組織目標を達成する上で求められることに対する評価を重視し、報奨とリンクさせることが挙げられる。","answer":"■正解：Ｂ、Ｄ\n■解説：\nB.エンパワーメントの成功要件として注意したい３点として、「経営理念やビジョンの共有」、「正当な評価と報奨」、「能力の把握と資源の提供」が挙げられる。\nD. [OBの仕組み]では無く、[HRMの仕組み]が正しい。\n略語はマネジメントブックP186に解説があります。\nOB: Organizational Behavior 組織行動学\nHRM: Human Resource Management 人的資源管理\n■出典：グロービス マネジメントブック 改訂3版 　\n5．エンパワーメント P.190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":272,"idx":272},{"id":"xlsx-2025春-組織行動-3","season":"2025春","subject":"組織行動","scope":"6. パワー","question":"■問3\n人や組織の行動に影響を及ぼすパワーの源泉を、アメリカの社会心理学者ジョン・フレンチとバートラム・ラーベンが5つに定義している。そのうち「受け手にとって苦痛となるものを与えることで、影響を及ぼすことのできる力」はどれか。次の【Ａ】～【Ｅ】から適切なものを選びなさい。\n【Ａ】懲罰力\n【Ｂ】強制力\n【Ｃ】パワハラ力\n【Ｄ】強権力\n【Ｅ】上位力","answer":"■正解：【Ｂ】\n\n■解説：\n解答の通り。ジョン・フレンチとバートラム・ラーベンによるとパワーは次の5つ、強制力・報酬力・正当権力・専門力・同一視力で構成されている。「受け手にとって苦痛となるものを与えることで、影響を及ぼすことのできる力」＝強制力\n\n■出典：グロービス マネジメントブック 改訂3版 　\n6. パワー P. 192-193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":273,"idx":273},{"id":"xlsx-2025春-組織行動-4","season":"2025春","subject":"組織行動","scope":"7. モチベーションとインセンティブ","question":"■問4.モチベーションとインセンティブに関する記述として、誤っているものを選択してください。\nA.マズローの欲求5段階説によれば、人の欲求は「生理的」「安全」「社会的」「尊厳」「自己実現」という5段階に分けられ、すべての段階の欲求が同時に発生する。\n\nB.マグレガーのY理論では、「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考え、近年ではY理論に基づいて動機づけを考えることが必要だと言われている。\nC.ハーズバーグの動機づけ・衛生理論では、不満をもたらす要因である衛生要因に対して手を打つことにより、不満は解消されるが、そのことが満足感やモチベーションを高めるとは限らない。\nD.個人のモチベーションである「金銭的動機」「社会的動機」「自己実現動機」と、組織が与えるインセンティブである「金銭的報奨」「社会的評価」「自己実現の場の提供」の整合性（FIT）が重要である。","answer":"■正解：Aのみ誤りがある。（B~Dには誤りがない。）\n■解説：\nマズローの欲求5段階説では、人間の欲求を「生理的」「安全」「社会的」「尊厳」「自己実現」という、低次から高次への5段階に分けて考えています。\nまた「人の欲求は低次の欲求が満たされると、より高次の欲求へと移行する。それと同時に、低次の欲求によるモチベーション形成へのインパクトは弱まる」とされています。したがって「すべての段階の欲求が同時に発生する」という記述は誤りです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n7.モチベーションとインセンティブ P.194-195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":274,"idx":274},{"id":"xlsx-2025春-組織行動-5","season":"2025春","subject":"組織行動","scope":"8．集団のメカニズム","question":"■問5.集団をとらえる視点の説明として、正しいものをすべて選択してください。\nA.規範：集団の構成員間で共有する行動基準を指す。例えば、構成員間で「役職が上位の人に対して批判的な意見を言うべきではない」と言う意識が浸透している場合、それがその集団の規範と言える。\nB.役割：集団において期待される行動様式を指す。人は様々な集団に属するが集団によって期待される役割が対立したり矛盾したりすることがある。その結果、強いストレスが生じたり、期待される役割を果たせなかったりする。\nC.規模：集団の構成員数を指す。一般に、人数が多ければより多様な意見や情報を入手でき、少なければ意思決定や行動がより迅速になる。\nD.凝集性：集団が構成員を惹きつけ、その集団の一員であり続けるように動機づける度合いを指す。凝集性の高さは、各構成員の魅力や構成員間の相互作用、集団の目標や規模などの要素によって決まる。","answer":"■正解：すべて正解\n■解説：\n集団をとらえる視点は、選択肢の他に「地位：集団内における相対的な位置付け」「多様性：構成員の組み合わせの多様さ」があり、全部で６つの視点が存在します。\n■出典：グロービス マネジメントブック 改訂3版 　\n8.集団のメカニズム P.196-197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":275,"idx":275},{"id":"xlsx-2025春-組織行動-6","season":"2025春","subject":"組織行動","scope":"9.チーム・マネジメント","question":"■問6.集団の形成プロセスを正しい順に並べてください。\nA.激動期\nB.終了期\nC.形成期\nD. 実現期\nE.規範形成期","answer":"■正解：C→A→E→D→B\n■解説：\n①形成期：集団形成が明示され、構成員が顔合わせする段階。人は集まったものの、集団としての機能は形成されていない状態にある。集団の目的や規範も共有されていない。\n②激動期：議論、緊張、衝突の生まれる段階。構成員間でお互いに自分の考えを披瀝しあい、コミュニケーションを図ることにより、集団内における自分の役割や地位についてイメージを形づくっていく。\n③規範形成期：構成員が規範をつくり出す段階。「激動期」の結果を踏まえて、集団の目標や各自の役割を明確にし、それらを全構成員が理解し共有する。\n④実現期：特定の目的を持った集団として構成員が統合され、集団が機能する段階。ただし、あらゆる集団が自動的に実現期に至るわけではない。マネジメントの巧拙によっては、実現期に至らないまま解散することもある。\n⑤終了期：集団の目的達成、目的の分化などの理由によって集団が解散する段階。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n9．チーム・マネジメント P.198-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":276,"idx":276},{"id":"xlsx-2025春-組織行動-7","season":"2025春","subject":"組織行動","scope":"10.コミュニケーション","question":"■問7.下記文章中の（①）～（⑦）に入る語句として適切なものを選択肢A~Dのうちから選んでください。\nコミュニケーションの落とし穴：コミュニケーションを阻害する要因を理解しておくと、効果的なコミュニケーションを行うときに役立つ。コミュニケーションがうまくいかない原因として、送り手の問題、受け手の問題、送り手と受け手の双方の問題が考えられる。\n送り手の問題：送り手に関わる阻害要因に「（①）」がある。これは、受け手により（②）的に受け入れてもらうために、送り手が情報を操作することだ。一般に、（③）方向の階層数の多い組織では、（①）が起こりやすくなる。\n受け手の問題：受け手に関わる阻害要因に「（④）」がある。これは、情報を認識するプロセスにおいて、個人的な経験に基づいて複数の情報から特定情報のみを選択したり、自己の関心や期待などを反映させた解釈を行うことを指す。\n双方の問題：送り手と受け手双方に関わる阻害要因に「（⑤）」がある。文化的な背景が違うと、同じ単語やジェスチャーが意味するものが異なることがある。同様の現象は性別、年齢、階層、立場の違いなどによっても生じる。\nまた、非言語コミュニケーション、とくに「（⑥）」は送り手と受け手双方に誤解を与えることが多い。大喜びや落胆といった極端な（⑥）に直面すると、理性的かつ客観的な思考過程を無視し、感情的な判断を下しがちになる。コミュニケーションにおいて“（⑦）の感情”のコントロールが重視されるのはこのためだ。\nA. ①選択的認知　②好意　③縦　④フィルタリング　⑤文化的差異　⑥感情表現　⑦怒り\nB. ①選択的認知　②理性　③横　④フィルタリング　⑤感情表現　⑥文化的差異　⑦好意\nC. ①フィルタリング　②好意　③縦　④選択的認知　⑤文化的差異　⑥感情表現　⑦怒り\nD. ①フィルタリング　②理性　③横　④選択的認知　⑤感情表現　⑥文化的差異　⑦好意","answer":"■正解：C\n■解説：\n集団は構成員相互のコミュニケーションがなければ機能しない。コミュニケーションは、送り手から受け手への情報の伝達と、両者間での意味の共有の両方が満たされてはじめて成立する。\nコミュニケーションを阻害する要因を理解しておくと、効果的なコミュニケーションを行うときに役立つ。効果的なコミュニケーションができない場合は、送り手か受け手、あるいは双方に問題がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n10.コミュニケーション P.200-201","source":"Excel: GMAP道場問題秋春(2).xlsx","no":277,"idx":277},{"id":"xlsx-2025春-組織行動-8","season":"2025春","subject":"組織行動","scope":"11.コンフリクト","question":"■問08.コンフリクトにおける定義やマネジメントについて、正しいものを選択してください。（すべて無も含む）\nA.コンフリクトは非効率的なコミュニケーションを増やすが、情報伝達が正しく行われ、意思決定に歪みは生じにくい。\nB.コンフリクトの実質的な問題とは、当事者が互いに相手に対して抱いている個人的な認識や感情によるものである。\nC.表面化しているコンフリクトは発見するのが困難で重要である場合が多い。\nD.コンフリクトが進行し対立が深まっても、最初の原因のみ対立の根底の要因となり続ける。","answer":"■正解：なし\n■解説：\nA.コンフリクトが起きると、非効率的なコミュニケーションが増え、情報が正しく伝達されず、意思決定に歪みが生じるといったマイナス面がある。\nB.内容は感情的問題。実質的問題とは経営方針や実行手順、役割と責任といった事業運営上の意見の食い違いによるもの。\nC.コンフリクトは必ずしも直接的に表現されるとは限らない。表面化していないコンフリクトを発見するほうが困難かつ重要である場合が多い。\nD.最初の原因と関係ないものが原因になることもある。\n■出典：グロービス マネジメントブック 改訂3版 　\n11.コンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":278,"idx":278},{"id":"xlsx-2025春-組織行動-9","season":"2025春","subject":"組織行動","scope":"19. 変革のマネジメント","question":"■問9.次のうち、自己変革型組織を実現するためのアプローチとして誤っているものをすべて選んでください。\nA.組織の経営理念やビジョンは、一度確立したら変更せず、一貫性を重視することが重要である。\nB.変化を好み、自ら変化を生み出し、変化に自律的に対応することは重要だが、従来から存在する行動パターンに従って動くことも重視すべきである。\nC.組織変革の際には、「このように行動してほしい」と経営陣がメッセージを発することで変革をスムーズに進めることができる。\nD.組織変革は、推進役となるリーダーの強い意思の下、「解凍・移動・再凍結」の3段階のプロセスに沿って進めていくことが重要だ。","answer":"■正解：A,B,C\n■解説：\nA（誤り）一貫性のある経営理念やビジョンは重要だが、自己変革型組織では環境の変化に応じて経営理念やビジョンを進化させることが求められる。\nB（誤り）組織も個人も従来から存在する行動パターンに従って動こうとするが、環境変化の多い今日では、変化を好み、自ら変化を生み出し、変化に自律的に対応する「自己変革型組織」になることが求められる。\nC（誤り）組織変革の際には経営陣がメッセージを発するだけでは不十分である。組織変革では経営理念やビジョン、経営戦略、マーケティング、組織構成員の行動の全てを変える必要があるが、とくに鍵となるのが構成員である。\nD（正解）レビンの変革プロセスは、メンバーに変化の必要性を理解させ変化へ向けて準備させる「解凍」、変化のための具体的な方策実施や新たな行動や考え方を学習させる「移動」、新しく導入された変化を定着させる「再凍結」の3段階にまとめられている。\n■出典：グロービス マネジメントブック 改訂3版 　\n19. 変革のマネジメント P.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":279,"idx":279},{"id":"xlsx-2025春-組織行動-10","season":"2025春","subject":"組織行動","scope":"20. 組織学習","question":"■問10.「学習する組織」の特徴および実現する要素について、正しいものをすべて選択してください。\nA. 過去の組織文化や戦略の枠を思考や行動の基本として守りながらも、変化に対応していく機能を備えている。\nB. すべての構成員が自律性と協調性を持ち、現在の環境に適応する強さと将来の変化に対応する柔軟性を理解し実践する。\nC. ここで言う「学習」とは、単に知識を習得することにとどまらず、思考や行動のパターンを変えていくことを指す。\nD.「学習する組織」を実現するための要素として、「シングルループ・ラーニング」や「5つのプリン」がある。","answer":"■正解：B、C\n■解説：\n「学習する組織」について、各選択肢に関連したマネジメントブックの記載は以下の通りです。\nA→過去の組織文化や戦略の枠に思考や行動をしばられることなく、変化に対応し、自己改革していく機能を備えている。\nB：すべての構成員が自律性と協調性を持ち、現在の環境に適応する強さと将来の変化に対応する柔軟性を理解し実践する。（正解）\nつまり、組織全体が学習する能力を備えているのだ。\nC：ここで言う「学習」とは、単に知識を習得することにとどまらず、思考や行動のパターンを変えていくことを指す。（正解）\nD→「学習する組織」を実現するための要素として、「ダブルループ・ラーニング」や「5つのディシプリン」がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n20．組織学習 P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":280,"idx":280},{"id":"xlsx-2025春-組織行動-11","season":"2025春","subject":"組織行動","scope":"8.集団のメカニズム","question":"■問11.集団における意思決定についての出題です。\n下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを\n選択肢A~Dのうちから選んでください。\n■集団における意思決定\n一般に、(①)における意思決定は(②)で行う意思決定より優れている。\nそれは、多様な意見や情報を収集できたり、\n決定内容がより多くの人に受け入れられる可能性が高いからだ。\n一方、(①)ゆえに陥りやすい問題もある。\nその一つである「(③)」は、合意に至ろうとするプレッシャーから、\n(①)において物事を多様な視点から批判的に評価する能力が欠落する傾向である。\n特に(①)の凝集性が高い場合や、外部と隔絶している場合、\n支配的なリーダーが存在する場合などに起きやすい。\n(③)を避けるためには、異なった意見を十分に受け入れ、\n建設的な批判を重視し、選択肢の分析に時間をかけるなどの配慮が必要だ。\nA. 個人\nB. 集団\nC. コーシャス・シフト\nD. グループシンク","answer":"✽■正解：\n①B.集団 ②A.個人 ③.D. グループシンク\n■解説：\n■集団における意思決定\n一般に、(集団)における意思決定は(個人)で行う意思決定より優れている。\nそれは、多様な意見や情報を収集できたり、\n決定内容がより多くの人に受け入れられる可能性が高いからだ。\n一方、(集団)ゆえに陥りやすい問題もある。\nその一つである「(グループシンク)」は、合意に至ろうとするプレッシャーから、\n(集団)において物事を多様な視点から批判的に評価する能力が欠落する傾向である。\n特に(集団)の凝集性が高い場合や、外部と隔絶している場合、\n支配的なリーダーが存在する場合などに起きやすい。\n(グループシンク)を避けるためには、異なった意見を十分に受け入れ、\n建設的な批判を重視し、選択肢の分析に時間をかけるなどの配慮が必要だ。\n■出典：グロービス マネジメントブック 改訂3版 　\n8.集団のメカニズム P.196 - P197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":281,"idx":281},{"id":"xlsx-2025春-組織行動-12","season":"2025春","subject":"組織行動","scope":"7.モチベーションとインセンティブ","question":"■問12. 組織が与えるインセンティブに関する記述として、誤っているものを選択してください。\nA. モチベーションを高めるものをインセンティブと言う。代表的なインセンティブとして、金銭的報奨、社会的評価、自己実現の場の提供などがある。\nB. 金銭的報奨は不足すれば不満の原因となり、あるレベルを超えるとモチベーションを高める傾向がある。\nC. 社会的評価は給与の高さや待遇などを指す。\nD. 自己実現の場とは、自分の理想像に近づくための機会や環境を指す。","answer":"■正解：B, C\n■解説：\n（Bの正答）金銭的報奨は不足すれば不満の原因となり、あるレベルを超えるとモチベーションを[高める効果が薄れる]傾向がある。\n（Cの正答）社会的評価は[地位や権限、名誉など]を指す。\n■出典：グロービス マネジメントブック 改訂3版 　\n7.モチベーションとインセンティブ P.194-195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":282,"idx":282},{"id":"xlsx-2025春-組織行動-13","season":"2025春","subject":"組織行動","scope":"10.コミュニケーション","question":"■問13. コミュニケーションの4つのプロセスである記号化、伝達、解読、フィードバックについて、次のA～Dより誤ったものを全て選びなさい。\nA.記号化とはメッセージを言語化することのみを指し、非言語的な表情、態度などは重要でない。\nB.伝達とはさまざまな伝達経路を通してメッセージを受け手に伝えることである。\nC.解読とは受け手が記号化されたメッセージを読み取ることである。\nD.フィードバックとは受け手が解読したメッセージを送り手とともに確認することである。","answer":"正解は\n①～④すべて正解\n✽\n✽\n✽\n✽\n✽\n✽\nパワーナイト は、ここにいる皆さん全員が応募可能です！同じテーマに興味・関心を持つ仲間と繋がることで、互いの知見や意見を交換し、あすか会議後も繋がり続ける「同志」 を見つけることができます。\n現在、登壇者の募集が始まっています！！あなたの一歩踏み出す勇気を「あすか委員 パワーナイト企画担当」がそっと背中を押させていただきます。\n少しでもご興味があれば、コミュニティを覗いてみてください。","source":"Excel: GMAP道場問題秋春(2).xlsx","no":283,"idx":283},{"id":"xlsx-2025春-組織行動-14","season":"2025春","subject":"組織行動","scope":"5. エンパワーメント","question":"■問14 . エンパワーメントに関する記述として、最も適切なものを選択してください。\nA.エンパワーメントとは、個人に対する権限委譲を意味し、上司の負担を軽減するために、できるだけ多くの業務を部下に任せることが重要である\nB.エンパワーメントを有効に活用するには、構成員の自律性を促すと同時に、その行動を制御することも必要である\nC.エンパワーメントの成功のためには、経営理念やビジョンの共有は不要であり、個人の裁量を最大化することが最も重要である\nD.部下の能力を見極めることはエンパワーメントの支障となるため、同じレベルの業務を均等に任せることが望ましい","answer":"■正解： B\n■解説：\n選択肢Aの誤り：ビジネスにおけるエンパワーメントの特徴は、単なる「権限委譲」ではなく 、「自律性」を促し、「支援」することにあるとされています。また、上司の負担軽減が目的というわけではありません。\n選択肢Bは正解：構成員の自律的な行動は必要だが、それが行き過ぎてしまうと、構成員の動きに統一性や一貫性がなくなり、組織が目指している目標を実現できなくなる。そのため、構成員の自律性を促すだけでなく、その行動をある程度制御しなくてはならない。\n選択肢Cの誤り：構成員間に行動規範を浸透させるためには、経営者やマネジャーが経営理念とビジョン、行動規範をわかりやすい言葉で、熱意を込めて、継続的に伝える必要があるとされています。\n選択肢Dの誤り：部下の能力を見極め、適切な業務を設定することが重要であるとされています。\n■出典：グロービス マネジメントブック 改訂3版 　\n5. エンパワーメント P.190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":284,"idx":284},{"id":"xlsx-2025春-組織行動-15","season":"2025春","subject":"組織行動","scope":"4.リーダーシップとマネジメント","question":"■問15.リーダーシップとマネジメントに関する説明として、正しいものを選択してください。\nA.グローバル化の進展やITの飛躍的な進捗などに伴い、企業を取り巻く環境は予測しにくく、複雑になっている。その中で、変化に対応するにはマネジメントの能力が、複雑な環境に対応するには、リーダーシップの能力が不可欠である。\nB. 経営者やマネージャーは当然、リーダーシップとマネジメント能力を兼ね備え得ていることが求められるが、個々の従業員は、リーダーシップ能力のみを高めることが求められている。\nC. リーダーシップとマネジメントはまったく異なる側面を持つため、同時に身につけることは難しく、これらの能力はいずれも生まれつきいずれかを持ち合わせているものである。\nD. リーダーシップやマネジメントの能力の土台となるのが基礎的なビジネス能力（ビジネス・フレームワークの理解、仮説構築能力、論理的思考能力など）であり、さらには１人のビジネスパーソンとして自律の精神やオーナーシップ・マインドなども求められる。","answer":"■正解：D\n■解説：\nA：（誤）リーダーシップとマネジメントの説明が逆。「変化に対応するにはリーダーシップの能力が、複雑な環境に対応するには、マネジメントの能力が不可欠である。」\nB：（誤）現在は、一部の経営陣だけではなく、個々の従業員もリーダーシップとマネジメントの能力を身につける必要がある。なぜならば、自分達の目の前で起こっている変化や複雑な状況にその場で対処することが、競争上不可欠であるからだ。\nC：（誤）リーダーシップとマネジメントはまったく異なる側面を持つため、同時に身につけることは難しく感じられるが、これらの能力はいずれも習得可能である。\nD：（正）記載の通り。\n■出典：グロービス マネジメントブック 改訂3版 　\n4.リーダーシップとマネジメント P.188-189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":285,"idx":285},{"id":"xlsx-2025春-組織行動-16","season":"2025春","subject":"組織行動","scope":"20. 組織学習","question":"■問16.「学習する組織」を実現するための要素として、「ダブルループ・ラーニング」と「５つのディシプリン」があります。ピーター・センゲの「５つのディシプリン」について、下記文章中の①～⑤に入る適切な語句を選択肢A～Eのうちから選んでください。\n〈1〉システム思考：独立した事象に目を奪われずに、各要素間の相互依存性、相互関連性に着目し、（①）とその動きをとらえる思考方法を言う。\n〈2〉自己実現と自己研鑽：自らのビジョンや欲求が何であるか探り続けると同時に、現状を的確に見極めることによって両者の（②）を認識し、ビジョンや欲求の実現に向けて行動することを言う。\n〈3〉メンタル・モデルの克服：物事の見方や行動に大きく影響を与える固定観念や暗黙の前提をメンタル・モデルと言う。（③）や競合、市場に関して組織で共有しているメンタル・モデルを認識し、それを打破するための取り組みが必要である。\n〈4〉共有ビジョンの構築：各個人のビジョンから共有されたビジョンを導くことにより、お題目ではなく、組織の構成員が心底望む（④）を構築することを言う。\n〈5〉チーム学習：学習の基礎単位は個人ではなく、（⑤）である。構成員間のダイアローグ（対話）を通して複雑な問題を探求することにより、個人で考えるときよりも優れた解決方法の発見につながる。\n〈選択肢〉\nA．将来像\nB．自社\nC．チーム\nD．全体像\nE．ギャップ","answer":"■正解：\n（①）D．全体像\n（②）E．ギャップ\n（③）B．自社\n（④）A．将来像\n（⑤）C．チーム\n\n■解説：\nセンゲは、適応し変化する能力を継続的に開発している組織を「学習する組織」と名づけ、その実現のために必要な要素として「５つのディシプリン」（構成技術）を挙げた。なかでも、「システム思考」という要素を他の4つの要素を束ねるディシプリンとして位置づけている。センゲは、組織がこれら５つのディシプリンを同時に獲得できることにより、変化への自己対応能力を備えることができると考えた。\n■出典：グロービス マネジメントブック 改訂3版 　\n20．組織学習 P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":286,"idx":286},{"id":"xlsx-2025春-組織行動-17","season":"2025春","subject":"組織行動","scope":"6.パワー","question":"■問17.下記文章中の（①）～（⑤）に入る語句として適切なものを選択肢A~Dのうちから選んでください。\nパワーを有効に活用するためには、人や組織の行動に影響を及ぼすパワーの源泉を理解する必要がある。アメリカの社会心理学者のジョン・フレンチとバートラム・ラーベンによると、パワーは次の５つで構成される。\n（①）：受け手にとって苦痛となるものを与えることで、影響を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する。\n（②）：受け手にとって励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、インセンティブなどが該当する。\n（③）：受け手に対し影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する。\n（④）：受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。\n（⑤）：受け手にとって魅力のある人物、理想像であること。たとえば、業務経験、実績などが形成する要素となりうる。\nA：①正当権力　②同一視力　③強制力　④専門力　⑤報酬力\nB：①強制力　②同一視力　③正当権力　④専門力　⑤報酬力\nC：①正当権力　②報酬力　③強制力　④専門力　⑤同一視力\nD：①強制力　②報酬力　③正当権力　④専門力　⑤同一視力","answer":"■正解：D\n■解説：\n影響力を行使する側が多様なパワーの源泉を持っていると、より効果的に人の行動に影響を与えることができる。戦略目標の実現には、必ずしも１人ですべてのパワーの源泉を兼ね備えている必要はなく、さまざまなパワーの源泉を持つ人が複数集まり、相互補完すればよい。\n■出典：グロービス マネジメントブック 改訂3版 　\n6.パワー P.192-193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":287,"idx":287},{"id":"xlsx-2025春-組織行動-18","season":"2025春","subject":"組織行動","scope":"19.変革のマネジメント","question":"■問18.変革マネジメントにおける必要性や方法について、正しいものを選択してください。\nA.組織変革では経営理念やビジョン、経営戦略、マーケティングなどの施策群、組織構成員の行動に分れられ、これらすべてを変える必要がある。\nB.社会心理学者のクルト・レビンは、変革のプロセスを「解凍・移動・再凍結」の３段階でまとめており、変革のステップは一足飛びに実現できると述べている。\nC.自己変革型組織では、マネジャーはマネジメントとリーダーシップの技術を身につけ、それらを駆使することが強く求められる。\nD.変革に対する抵抗が、変化への不安が要因であれば、理解を促すためのコミュニケーションを強化したり、変革の計画や実行段階に構成員を参加させることで対応する。","answer":"■正解：A\n■解説：\nA正解。組織変革ではすべてを変える必要。とくに鍵となるのが構成員であり、構成員の行動を変えることなくして、変革の実行はありえない。\nB不正解。レビンは、変革は一足飛びに実現できるものではないと述べている。\nC不正解。強く求められるのは従業員をサポートするエンパワーメントである。\nD不正解。問題の内容は変革の認識が不足している場合の対応である。変化への不安が原因であれば、新たなスキルを身につける機会を提供するなど、不安感を取り除く措置を講じる必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n19.変革のマネジメント P.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":288,"idx":288},{"id":"xlsx-2025春-組織行動-19","season":"2025春","subject":"組織行動","scope":"","question":"■問19.コンフリクトを理解するための視点について、現象面から本質的問題の把握までをまとめたも\nのとして、誤っているものを全て選んでください。\nA.コンフリクトの最初のきっかけとなる行動に対して、どのような対応を示し、そこからどのようにコ\nンフリクトが深まったのかというパターンをつかむ。\nB.コンフリクトは必ず回避すべきで、そのためには相手の意見を尊重し、対立を避けることが最も重要\nである。\nC.コンフリクトが発生する主な要因は「個人的要因」にあるため、チームの相性を考慮したメンバー配\n置を行えば、ほとんどのコンフリクトは防ぐことができる。\nD.コンフリクトは多くの場合、実質的問題と感情的問題という2つの異なる問題から生じる。組織では\n実質的問題を表に出しにくいため、しばしば感情的問題にすり替えられることがある。","answer":"■正解：B,C,D\n■解説：\nA（正解）コンフリクトのパターンをつかむことにより、コンフリクトの根本原因と対処の糸口が見え\nてくることが多い。\nB（誤り）コンフリクトを回避することが最善と考えるのは誤り。コンフリクトにはプラスの効果もマ\nイナスの効果もある。対策を打つ前にどちらの効果がより強く表れているかを分析する。コンフリクト\nはマイナス面に目が向きがちだが、マネジメントのやり方次第で、アイデアの創造や本質的な問題の発\n見につながる場合もある。\nC（誤り）コンフリクトが生じる原因として、外部要因（時間や予算などの制約やプレッシャーなど）\nと個人的要因（対抗意識、相性、仕事上のスタイル、ストレス許容度など）があり、これらの複数の原\n因が複雑に絡み合っていることが多い。\nD（誤り）コンフリクトは多くの場合、実質的問題と感情的問題という2つの異なる問題から生じる。\n感情的問題とは、当事者が違いに相手に対して抱いている個人的な認識や感情で、組織では感情的問題\nを表に出しにくい。そのため、しばしば実質的問題にすり替えられることがある。逆に、最初は実質的\n問題であったのに、対立点が個人的感情に由来するのではないかと当事者が疑い始め、感情的問題に転\n換して解決が難しくなる場合もある。\n■出典：グロービス マネジメントブック 改訂3版 　\n11. コンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":289,"idx":289},{"id":"xlsx-2025春-組織行動-20","season":"2025春","subject":"組織行動","scope":"","question":"■問20.「チーム・マネジメント」について、適切でないものをすべて選択してください。\nA. 多様な能力を持つ構成員で編成されているチームは、より大きな成果を生み出す可能性を持つ。\nB.構成員の誰もが「技術的な専門知識」、「問題解決や意思決定」、「対人関係」といった重要なスキ\nルを兼ね備えているわけではないため、優先したいスキルに絞って人材を集めることが必要である。\nC. チームの分散性が高いことも、より高い成果につながる可能性がある。個別の目標に向けて、それぞ\nれの場所で周囲の影響を受けずに業務に励むことができる。\nD.リーダーは集団の発展段階を考慮に入れ、チームの状態に合わせて、指導、権限委譲、コーチングな\nどのマネジメントを行う必要がある。","answer":"■正解：B、C\n■解説：\n高い成果を上げるチームをつくるには、「構成員の組み合わせ」と「凝集性」が重要です。各選択肢に\n関連したマネジメントブックの記載を確認しておきましょう。\nA（正）設問通り\nB（誤）\n実際には、構成員の誰もが「技術的な専門知識」、「問題解決や意思決定」、「対人関係」といった重\n要なスキルを兼ね備えているわけではない（ここまでは正しい）。\nそのため、不足スキルを相互補完できる人材を集める必要がある。\n最初から揃わない場合は、潜在的な能力を備えた人材でチームを結成し、チーム活動を通して必要なス\nキルを開発・習得させたりする。\nC（誤）\nチームの「凝集性」が高いことも、より高い成果につながる可能性がある。それは、構成員が共通の目\n標や価値観を持っており、目標達成のために一丸となって取り組むからだ。\nD.（正）\nリーダーは集団の発展段階*を考慮に入れ、チームの状態に合わせて構成員に働きかけていくことも大\n切。\n集団が現在どの段階*にあるかを把握し、指導、問題解決、権限委譲、コーチングなど、集団の状態に\n適合したマネジメントを行う必要がある。\n＊集団の発展段階：①形成期→②激動期→③規範形成期→④実現期→⑤終了期\n■出典：グロービス マネジメントブック 改訂3版 　\n9．チーム・マネジメント P.198-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":290,"idx":290},{"id":"xlsx-2025春-組織行動-21","season":"2025春","subject":"組織行動","scope":"","question":"■問21.パワーを用いた影響力の行使についての出題です。\n下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Gのうちから選ん\nでください。\n■パワーを用いた影響力の行使\n企業において効果的な形でパワーを行使するには、「パワーの(①)が、(②)との関係をどうとらえているか」\n「パワーを行使した結果が、(③)の実現につながるか」ということを常に考える必要がある。\nパワーは、企業目的を果たすために適切な方法で用いなくてはならない。\n個人的な利益のためにパワーを用いると、社内で政治的なかけひきや権力闘争などが起こるおそれがある。\nまた、社会的・倫理的に問題のある方法を用いると、企業の信用を損なったり、訴訟に発展するおそれがある。\nこうした事態を避けるためには、企業が求める(④)や価値観を明確にし、(⑤)に浸透させる必要がある。\nA.受け手\nB.与え手\nC.組織目標\nD.個人的な利益\nE.行動規範\nF.社外\nG.社内","answer":"■正解：\n①A.受け手 ②B.与え手 ③ C.組織目標 ④ E.行動規範 ⑤ G.社内\n■解説：\n■集団における意思決定\n企業において効果的な形でパワーを行使するには、\n「パワーの(受け手)が、(与え手)との関係をどうとらえているか」\n「パワーを行使した結果が、(組織目標)の実現につながるか」\nということを常に考える必要がある。\nパワーは、企業目的を果たすために適切な方法で用いなくてはならない。\n個人的な利益のためにパワーを用いると、社内で政治的なかけひきや権力闘争などが起こるおそれがあ\nる。\nまた、社会的・倫理的に問題のある方法を用いると、企業の信用を損なったり、訴訟に発展するおそれ\nがある。\nこうした事態を避けるためには、企業が求める(行動規範)や価値観を明確にし、(社内)に浸透させる必\n要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n6.パワー P.192 - P193","source":"Excel: GMAP道場問題秋春(2).xlsx","no":291,"idx":291},{"id":"xlsx-2025春-組織行動-22","season":"2025春","subject":"組織行動","scope":"","question":"■問22.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちか\nら選んでください。\n・企業には通常、公式集団と非公式集団が存在する。\n・企業が公式に形成する公式集団では、達成すべき目標と職務や役割が組織によって（①）に定められ\nる。\n・非公式集団は自然発生的に形成されるもので、多くの場合、（②）な人間関係に基づいている。\n・（③）では組織によって公式に定められた目標や役割は無く、集団構成員間の非公式な交流の中で共\n有された共通の利害や関心が存在する。\nA. ①詳細　②個人的　③公式集団\nB. ①明確　②個人的　③非公式集団\nC. ①詳細　②組織的　③公式集団\nD. ①明確　②組織的　③非公式集団","answer":"■正解：B\n■解説：\n・企業が公式に形成する公式集団では、達成すべき目標と職務や役割が組織によって（①明確）に定め\nられる。\n・非公式集団は自然発生的に形成されるもので、多くの場合、（②個人的）な人間関係に基づいている。\n・（③非公式集団）では組織によって公式に定められた目標や役割は無く、集団構成員間の非公式な交\n流の中で共有された共通の利害や関心が存在する。\n■出典：グロービス マネジメントブック 改訂3版 　\n8.集団のメカニズム P.196-197","source":"Excel: GMAP道場問題秋春(2).xlsx","no":292,"idx":292},{"id":"xlsx-2025春-組織行動-23","season":"2025春","subject":"組織行動","scope":"","question":"■問23 D.マグレガーが提唱したモチベーション理論に当てはまる語句を次の組み合わせから選びなさい。\nDマグレガーは、人間をＸ理論とＹ理論で説明している。 Ｘ理論では「人間は本来怠け者で、【①】を回避しようとするものだ」と考えているのに対し、 Ｙ理論では「人間は本来勤勉で、進んで仕事を行い【①】を取ろうとするものだ」と考える。 近年では、【②】理論に基づいて動機づけを考えることが必要だと言われている。\nA.【①】責任 【②】Y\nB.【①】対立関係 【②】Y\nC.【①】責任 【②】X\nD.【①】対立関係 【②】X","answer":"■正解：A\n■解説：\nモチベーションを理解するには、人の欲求やモチベーションに関する理論が役に立つ。 代表的な理論が\n３つあり、「マズローの欲求５段階説」「マグレガーのX理論・Y理論」「ハーズバーグの動機づけ・\n衛生理論」 がある。 本文はDマグレガーのX理論とY理論の説明をしている。 X理論では「人間は本\n来怠け者で、責任を回避しようとするものだ」と考えているのに対し、 Y理論では「人間は本来勤勉で、\n進んで仕事を行い責任を取ろうとするものだ」と考える。 近年では、Y理論に基づいて動機づけを考え\nることが必要だと言われている。\n■出典：グロービス マネジメントブック 改訂3版 　\n7.モチベーションとインセンティブ P. 194-195","source":"Excel: GMAP道場問題秋春(2).xlsx","no":293,"idx":293},{"id":"xlsx-2025春-組織行動-24","season":"2025春","subject":"組織行動","scope":"","question":"■問 24.組織学習に関する記述として、最も不適切なものを選択してください。\nA.「学習する組織」では、単に知識を習得することにとどまらず、思考や行動のパターンを変えていく\nことを「学習」と捉える\nB.センゲの提唱する「5つのディシプリン」は、①システム思考、②自己実現と自己研鑽、③メンタル\nモデルの克服、④共有ビジョンの構築、⑤チーム学習である\nC.「学習する組織」では、何を行うべきかはトップ・マネジメントが決定し、その他の組織構成員はそ\nれに従って行動する\nD.アージリスによれば、問題に対して既存の目的達成へ向けて軌道修正を行うことを「シングルルー\nプ・ラーニング」と言い、問題に対して既存の目的や前提そのものを疑い、それらも含めて軌道修正を\n行うことを「ダブルループ・ラーニング」と言う","answer":"■正解：C\n■解説：\n組織学習において、「学習する組織」は過去の組織文化や戦略の枠に思考や行動をしばられることなく、\n変化に対応し自己改革していく機能を備えている組織のことを指します。\nセンゲによると、「学習する組織」では「アイデアの形成と実行は組織のあらゆるレベルにおいて行わ\nれる」とされており、選択肢Cの「何を行うべきかはトップ・マネジメントが決定し、その他の組織構\n成員はそれに従って行動する」というのは「伝統的な組織」の特徴です。\n「学習する組織」を実現するための要素として、アージリスの「ダブルループ・ラーニング」とセンゲ\nの「5つのディシプリン」がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n20. 組織学習 P.220-221","source":"Excel: GMAP道場問題秋春(2).xlsx","no":294,"idx":294},{"id":"xlsx-2025春-組織行動-25","season":"2025春","subject":"組織行動","scope":"","question":"■問25.コミュニケーションを阻害する要因に関する説明として、正しいものを選択してください。\nA. コミュニケーションがうまくいかない原因として、送り手、受け手のいずれか一方に問題があると考\nえられ、双方に問題があるということはない。\nB. 送り手に関わる阻害要因に「選択的認知」がある。これは、受け手により好意的に受け入れてもらう\nために、送り手が情報を操作することだ。例えば、部下との面談で、部下にとって耳の痛いことを伝え\nない場合がそうだ。\nC. 受け手に関わる阻害要因に「フィルタリング」がある。これは、情報を認識するプロセスにおいて、\n個人的な経験に基づいて複数の情報から特定情報のみを選択したり、自己の関心や期待などを反映させ\nた解釈を行うことを指す。\nD. 送り手と受け手の双方に関わる阻害要因に「文化的差異」がある。文化的な背景が違うと、同じ単語\nやジェスチャーが意味するものが異なることがある。","answer":"■正解：D\n■解説：\nA：誤り。\n解説：コミュニケーションがうまくいかない原因として、送り手の問題、受け手の問題、送り手と受け\n手の双方の問題が考えられる。\nB：誤り。\n解説：送り手に関わる阻害要因に「フィルタリング」がある。\nC：誤り。\n解説受け手に関わる阻害要因に「選択的認知」がある。\nD：正しい。\n解説：記載の通り。\n■出典：グロービス マネジメントブック 改訂3版 　\n10. コミュニケーション P.200-201","source":"Excel: GMAP道場問題秋春(2).xlsx","no":295,"idx":295},{"id":"xlsx-2025春-組織行動-26","season":"2025春","subject":"組織行動","scope":"","question":"■問26.社会心理学者クルト・レビンがまとめた変革のプロセスを正しい順に並べてください。\nA.再凍結\nB. 解凍\nC.移動","answer":"■正解： B→C→A\n■解説：\n①解凍：メンバーに変化の必要性を理解させ、現状を打破して、変化へ向けて準備させる段階\n②移動：変化のための具体的な方策を実施し、新たな行動や考え方を学習させていく段階。\n③再凍結：新しく導入された変化を定着させる段階。\n企業は推進役となるリーダーの強い意志の下、このプロセスに沿って変革を進めていくことが重要であ\nる。\n■出典：グロービス マネジメントブック 改訂3版 　\n19．変革のマネジメント P.218-219","source":"Excel: GMAP道場問題秋春(2).xlsx","no":296,"idx":296},{"id":"xlsx-2025春-組織行動-27","season":"2025春","subject":"組織行動","scope":"","question":"■問27.下記文章中の（①）～（④）に入る語句として適切なものを選択肢A~Dのうちから選んでくだ\nさい。\n　コンフリクトは多くの場合、（①）的問題と（②）的問題という２つの異なる問題から生じる。\n（①）的問題とは、経営方針や実行手順、役割と責任といった事業運営上の意見の食い違いによるもの\nだ。組織では（②）的問題を表に出しにくいため、しばしば（①）的問題にすり替えられることがある。\n　コンフリクトが生じる原因として、（③）要因と（④）的要因が考えられる。（③）要因は時間的制\n約、予算制約、資源配分、業績へのプレッシャーなど、（④）的要因は対抗意識、相性、仕事上のスタ\nイル、ストレスの許容度などだ。通常、コンフリクトの原因は複数存在し、それらが複雑に絡み合って\nいることが多い。対立が深まるにつれ、最初の原因とは関係ないものが原因になることもある。\nA：①感情　②実質　③自社　④個人\nB：①経営　②本質　③外部　④部門\nC：①実質　②感情　③外部　④個人\nD：①本質　②個人　③自社　④部門","answer":"■正解：C\n■解説：\nコンフリクト（対立、軋轢）とは、相反する意見、態度、要求などが存在し、互いに譲らないことで緊\n張状態が生じることを言う。企業のみならずあらゆる組織、人間関係においてコンフリクトは避けられ\nない。コンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、マネジメントのやり方次第で、\nアイデアの創造や本質的な問題の発見などにつながり、組織の成果を高めるドライバーとなりうる。\n■出典：グロービス マネジメントブック 改訂3版 　\n11.コンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":297,"idx":297},{"id":"xlsx-2025春-組織行動-28","season":"2025春","subject":"組織行動","scope":"","question":"■問28.チームマネジメントの内容について、正しいものを選択してください。\nA.集団の構成員は自分の業務を遂行するためだけではなく、チーム全体の活動を最大化させるために、\n積極的に情報の共有や意思決定を行う。\nB.チームの成果は各構成員の業績達成能力の総和以上にはならない。\nC.構成員間で互いに自分の考えを披瀝（ひれき）しあい、コミュニケーションを図ることにより、集団\n内における自分の役割や地位についてイメージを形づくっていく段階を形成期という。\nD.高い成果をあげるチームをつくるには、「構成員の組み合わせ」と「凝集性」が重要になる。","answer":"■正解：Ｄ\n■解説：\nＡ不正解：チームの構成員の内容である。集団の構成員は通常、自分の責任範囲内で業務を遂行する。\nＢ不正解：集団の成果の内容である。チームの成果は各構成員の業績達成能力の総和よりも大きくなる。\nＣ不正解：激動期の内容である。形成期は集団結成が明示され、構成員が顔合わせする段階である。\nＤ正解：多様な能力を持つ構成員で編成されているチームは、より大きな成果を生み出す可能性を持つ。\n■出典：グロービス マネジメントブック 改訂3版 　\n9.チーム・マネジメント P198.-199","source":"Excel: GMAP道場問題秋春(2).xlsx","no":298,"idx":298},{"id":"xlsx-2025春-組織行動-29","season":"2025春","subject":"組織行動","scope":"","question":"■問29.エンパワーメントの成功要件を説明する以下の文章について、下記文章中の（①）～（⑤）に\n入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n【1】（①）：「組織は何のために存在するのか」という組織の存在意義や使命と、ある時点までに\n「こうなっていたい」と思う組織の到達目標を通して、「必ずすべきこと」や「すべきではないこと」\nなどの行動規範を共有する。\n【2】（②と③）：構成員の意欲を高め、自律的かつ適度に制御された行動を促すために、OBの取り組\nみとHRMの仕組みを用意する。\n【3】（④と⑤）：エンパワーメントを行う際には、業務を任せる相手の能力を見極めることが重要で\nある。\nA：①パーパスとカルチャーコード ②人事評価の透明化 ③キャリア開発支援 ④パフォーマンス実績 ⑤\nコーチング体制の整備\nB：①経営理念、ビジョンの共有 ②正当な評価 ③報奨 ④能力の把握 ⑤資源の提供\nC：①存在意義と将来像 ②リーダーの期待値共有 ③ 1on1ミーティングの徹底 ④保有スキルの確認 ⑤\nピアサポートの活用\nD：①ミッション・ステートメント ②エンゲージメント向上施策 ③働きがいの醸成 ④主体性の成熟度\n⑤環境への適応支援","answer":"■正解：B\n■解説：\n【1】経営理念、ビジョンの共有：構成員間に行動規範を浸透させるためには、経営者やマネジャーが\n経営理念とビジョン、行動規範をわかりやすい言葉で、熱意を込めて、継続的に伝える必要がある。\n【2】正当な評価と報奨：OBの取り組みとしては、行動規範にかなった行動はほめ、反する行動に対し\nては改善を求めることなどが挙げられる。これら評価と報奨が対象とする行動と、経営理念やビジョン\nが求める行動規範が乖離している場合、構成員は困惑し、エンパワーメントを行っても組織目標の実現\nに結びつかない。HRMの仕組みとしては、組織目標を達成するうえで求められることに対する評価を\n重視し、報奨とリンクさせることなどが挙げられる。\n【3】能力の把握と資源の提供：能力を認識する際には、ビジネスリーダーの能力要件などを参考に、\n個々の能力要件について具体的に見ていく必要がある。構成員の能力を把握したうえで、自律的に動く\nために必要な情報や経営資源を提供し、成功体験を積ませることにより、構成員のモチベーションをさ\nらに高めることができる。\n■出典：グロービス マネジメントブック 改訂3版 　\n5. エンパワーメント P.190-191","source":"Excel: GMAP道場問題秋春(2).xlsx","no":299,"idx":299},{"id":"xlsx-2025春-組織行動-30","season":"2025春","subject":"組織行動","scope":"","question":"■問30.下記文章中の（ ① ）～（ ⑥ ）に入る語句として適切なものを、選択肢A～Cから選んでくださ\nい。\nJ.コッターは、変革を推し進める機能を（ ① ）、効率的に組織を運営する機能を（ ② ）と定義した。\nグローバル化の進展やITの飛躍的な進歩などに伴い、企業を取り巻く環境は予測しにくく、複雑になっ\nている。その中で、変化に対応するには（ ③ ）が、複雑な環境に対応するには（ ④ ）の能力が不可欠\nである。\n経営者やマネージャーは当然（ ⑤ ）の能力が求められる。\n現在は、個々の従業員に（ ⑥ ）が求められる。\n＜選択肢＞\nA. リーダーシップ\nB. マネジメント\nC. リーダーシップとマネジメントの両方","answer":"■正解：①Ａ、　②Ｂ、　③Ａ、　④Ｂ、　⑤Ｃ　、⑥Ｃ\n■解説：\nJ.コッターは、経営陣やマネージャーに求められる機能を2つに分け、変革を推し進める機能を「A.\nリーダーシップ」、効率的に組織を運営する機能を「B.マネジメント」と定義しました。\n変化に対応するには「A.リーダーシップ」が、複雑な環境に対応するには「B.マネジメント」の能力が\n不可欠です。\n激しい変化や複雑な環境に迅速に対応することが求められる状況においては、経営陣だけではなく、\n個々の従業員も「C.リーダーシップとマネジメントの両方 」の能力を併せ持っていることが求められま\nす。\nまた、これらの能力は同時に身につけることは難しく感じられますが、いずれも習得可能とされていま\nす。\n■出典：グロービス マネジメントブック 改訂3版 　\n4．リーダーシップとマネジメント P.188-189","source":"Excel: GMAP道場問題秋春(2).xlsx","no":300,"idx":300},{"id":"xlsx-2025春-アカウンティング-1","season":"2025春","subject":"アカウンティング","scope":"1. 企業経営とアカウンティング","question":"■問1.企業経営とアカウンティングについて、誤っているものを選択してください。\nA. 企業の経済活動を映す鏡であるアカウンティングは、ステークホルダーに対して説明責任を果たすことを目的としている。情報の非対称性を軽減するためにも、ノンディスクロージャー(情報非開示)は企業の責務である。\nB. アカウンティングは企業会計のことだが、英語のAccountには「説明する」という意味がある。企業はステークホルダーに対して経営活動の実績を説明する責任を負っている。このことをAccountability(説明責任)と言う。\nC. 株主と経営者は共に経営活動の効用を最大化するために経済合理的に行動する、というのが前提であるが、経営活動に関する情報収集という点では、経営者よりも株主のほうが優位にたちやすい。\nD. 企業のディスクロージャーとして、IR(インベスターズ・リレーションズ：投資家向け広報活動)が注目されている。企業の経営状態や会計情報は、会社法や金融商品取引法、企業会計原則、法人税法などで開示が義務づけられている(制度的ディスクロージャー)。","answer":"■正解：AとC\n■解説：\nA. 企業の経済活動を映す鏡であるアカウンティングは、ステークホルダーに対して説明責任を果たすことを目的としている。情報の非対称性を軽減するためにも、ディスクロージャー(情報開示)は企業の責務である。\nB. 正解\nC. 株主と経営者は共に経営活動の効用を最大化するために経済合理的に行動する、というのが前提であるが、経営活動に関する情報収集という点では、株主よりも経営者のほうが優位にたちやすい\nD. 正解\n■出典：グロービス マネジメントブック 改訂3版\n1.企業経営とアカウンティング P.92-93","source":"Excel: GMAP道場問題秋春(2).xlsx","no":301,"idx":301},{"id":"xlsx-2025春-アカウンティング-2","season":"2025春","subject":"アカウンティング","scope":"2. アカウンティングの目的","question":"■問2.各種会計について、下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Gのうちから選んでください。\n\n財務会計は、株式会社における（①）の理念に基づき、企業が会計原則に従った財務諸表によって、（②）に対して客観的かつ公正な企業の姿を開示することを目的としている。\n管理会計は、企業内部の経営管理手法として、（③）や（④）などに活用される。\nA. 顧客\nB. 情報開示\nC. 所有と経営の分離\nD. 外部ステークホルダー\nE. 業績管理\nF. 法人税額の算出\nG. 経営者の意思決定","answer":"■正解：①：C. 所有と経営の分離、②：D. 外部ステークホルダー、③・④：E. 業績管理・G. 経営者の意思決定（順番はどちらでも正解）\n\n■解説：\n財務会計は、株式会社における所有と経営の分離の理念に基づき、企業が会計原則に従った財務諸表によって、外部ステークホルダーに対して客観的かつ公正な企業の姿を開示することを目的としている。\n管理会計は、企業内部の経営管理手法として、経営者の意思決定や業績管理などに活用される。\n■出典：グロービス マネジメントブック 改訂3版 　\n2.アカウンティングの目的 P.94-95","source":"Excel: GMAP道場問題秋春(2).xlsx","no":302,"idx":302},{"id":"xlsx-2025春-アカウンティング-3","season":"2025春","subject":"アカウンティング","scope":"3. 収益および費用の認識","question":"■問3.収益の計上基準として用いられる考え方はどれですか？\nA.現金主義\nB.発生主義\nC.実現主義\nD.費用収益対応の原則","answer":"■正解：C\n■解説：\n現金主義：現金の収入（入金）・支出（支払い）と同時に収益・費用を認識する。\n発生主義：「経済的価値」が増加または減少した時点で収益・費用を認識する。費用を計上する際は原則的に発生主義が基準となる。\n実現主義：経済的価値の増加が実現したときに収益を認識する。確実に商品を顧客宛に発送した段階で収益を計上する。\n費用収益対応原則：発生した費用のうち、その期の収益獲得に貢献した部分だけをその期の費用として測定・認識すること\n■出典：グロービス マネジメントブック 改訂3版 　\n3.収益および費用の認識 P.96-97","source":"Excel: GMAP道場問題秋春(2).xlsx","no":303,"idx":303},{"id":"xlsx-2025春-アカウンティング-4","season":"2025春","subject":"アカウンティング","scope":"4.財務諸表の成り立ち","question":"■問4.営業サイクル(営業循環)、財務諸表と企業活動に関する記述について、誤っているものを全て選択してください。\nA. 営業サイクルに関わる企業活動は主に、営業活動、財務活動の２つである。\nB. 財務活動は、必要な資金を用意するために行う「資金調達活動」と、余った資金を活用する「資金運用活動」で構成される。\nC. 財務諸表の中で要となるのが、損益計算書、貸借対照表、キャッシュフロー計算書である。\nD. 貸借対照表は、資金の具体的な運用形態を示す「資産」と、その資金の調達源泉を示す「負債」から構成されている。","answer":"■正解：AとD\n■解説：\nA. 誤り\n営業サイクルは「営業活動」「投資活動」「財務活動」の3つに分類されます。「2つ」は不正確です。\nB. 正しい\n財務活動は、必要な現金を用意するために行う「資金調達活動」と、余った資金を活用する「資金運用活動」で構成されています。\nC. 正しい\n問のとおりです。財務諸表は、損益計算書(1年間の売上と利益、費用の集計)、貸借対照表（資金調達源泉の表示）とキャッシュフロー計算書（現金および現金同等物の増減の表示）です。\nD. 誤り\n貸借対照表は「資産」（左側）と「負債＋純資産」（右側）で構成されます。「負債のみ」という記述は誤りで、純資産も調達源泉に含まれます。\n■出典：グロービス マネジメントブック 改訂3版 　\n4.財務諸表の成り立ち P.98-99","source":"Excel: GMAP道場問題秋春(2).xlsx","no":304,"idx":304},{"id":"xlsx-2025春-アカウンティング-5","season":"2025春","subject":"アカウンティング","scope":"5. 損益計算書","question":"出題範囲：5. 損益計算書\n■問5.A〜Dに示す各指標を算出してください。\n売上高　　　　　　　　　：363,721\n売上原価　　　　　　　　： 54,880\n　売上総利益　　　　　　：　A\n販管費および一般管理費　　：170,303\n　営業利益　　　　　　　：　B\n営業外収益　　　　　　　： 33,256\n営業外費用　　　　　　　： 5,218\n　経常利益　　　　　　　：　C\n特別利益　　　　　　　　： 20,854\n特別損失　　　　　　　　： 17,086\n　税金等調整前当期純利益：　D\n法人税等　　　　　　　　： 37,037\n　当期純利益　　　　　　：　E","answer":"■正解：\nA.　売上総利益　　　　　　：308,841\nB.　営業利益　　　　　　　：138,538\nC.　経常利益　　　　　　　：166,576\nD.　税金等調整前当期純利益：170,344\nE.　当期純利益　　　　　　：133,307\n■解説：\n売上総利益：売上高（363,721）ー売上原価（54,880）\n営業利益：売上総利益（308,841）ー販管費および一般管理費（170,303）\n経常利益：営業利益（138,538）＋営業外収益（33,256）ー営業外費用（5,218）\n税金等調整前当期純利益：経常利益（166,576）＋特別利益（20,854）ー特別損失（17,086）\n当期純利益：税金等調整前当期純利益（170,344）ー法人税等（37,037）\n■出典：グロービス マネジメントブック 改訂3版 　\n5．損益計算書 P.100-101","source":"Excel: GMAP道場問題秋春(2).xlsx","no":305,"idx":305},{"id":"xlsx-2025春-アカウンティング-6","season":"2025春","subject":"アカウンティング","scope":"6.貸借対照表（資産）","question":"■問6.貸借対照表で資金の使途を表す資産の部について、誤っているものを一つ選択してください。\nA. 資産は通常、流動資産、固定資産、繰延資産に分類される。\nB. 流動資産とは主に短期間に現金あるいは費用となるものから構成される。短期の基準は1年以内である。ただし、売掛金など営業活動から発生する資産は期間に関わらず、原則としてすべて流動資産となる。\nC. 営業サイクルに関わる活動の中で、流動資産は主に営業活動から生じ、固定資産は主に投資活動と財務活動から生じる。\nD.固定資産について、機械設備は有形固定資産に、子会社株式は無形固定資産に分類される。\n✽\n✽","answer":"■正解：誤りはD\n■解説：\nA：設問の通り。\nB：「流動」と「固定」を分ける基準は２つあり、「1年基準」と「正常営業循環基準」である。正しい。\nC：設問の通り。\nD：機械設備は具体的な形態を持ち、長期間にわたり事業活動に使用されるため「有形固定資産」に分類されるのは正しい。一方、子会社株式は支配することを目的として長期的に保有する資産のため、企業本来の事業活動とは関係ない投資と同様に「投資その他資産」に分類される。「無形固定資産」は法律や契約によって認められた権利に基づく資産で、特許権やのれんが該当する。よって、選択肢Dが誤り。\n■出典：グロービス マネジメントブック 改訂3版 　\n6. 貸借対照表（資産） P.102-103","source":"Excel: GMAP道場問題秋春(2).xlsx","no":306,"idx":306},{"id":"xlsx-2025春-アカウンティング-7","season":"2025春","subject":"アカウンティング","scope":"7.貸借対照表（負債＋純資産）","question":"7■問7.企業経営における人・組織のマネジメントの役割や特徴について、誤っているものを選択してください。\nA. 一般には、将来の支払債務である負債の額が業界適正規模より大きい場合、企業の不健全さを示していると見なされる。\nB.流動負債とは、企業の通常の営業サイクル中または短期間（１年以内）に支払わなくてはならない負債である。\nC. 純資産とは、投資家から集めた出資金と過去の利益を蓄積した株主資本のほか、評価・換算差額等、新株予約権、少数株主持分の4つ（単体では少数株主持分を除く3つ）に分類される。\nD. 株主資本とは、株主が企業に拠出した資金と過去の利益の蓄積分である。前者は資本金、資本剰余金、自己株式であり、営業活動に対応する。後者は利益剰余金であり、財務活動に対応する。","answer":"■正解：Dのみ\n■解説：\nA～C：正解です。\nD：誤り\n財務活動、営業活動が逆となります。\n『前者は資本金、資本剰余金、自己株式であり、「財務」活動に対応する。後者は利益剰余金であり、「営業活動」に対応する』\n■出典：グロービス マネジメントブック 改訂3版 　\n7.貸借対照表（負債＋純資産）P. 104-105","source":"Excel: GMAP道場問題秋春(2).xlsx","no":307,"idx":307},{"id":"xlsx-2025春-アカウンティング-8","season":"2025春","subject":"アカウンティング","scope":"８.キャッシュフロー計算書","question":"■問８.企業（事業）の発展段階に応じて資金の流れは変わる。成長期・安定期・成熟期の各段階における、営業活動・投資活動・財務活動から生じるキャッシュフローの傾向について、誤っているものを選択してください。\nA.成長期の企業（事業）では営業活動による現金収支はプラス、投資活動ではマイナス、に、財務活動ではプラスになる。\nB.安定期は営業活動ではプラス、投資活動はマイナスだが、財務活動ほぼ均衡の状態となる。\nC.成熟期は営業活動ではプラス、投資活動は抑え気味で、財務活動はプラスになる。\nD.成長期においては財務活動のみプラスとなる。","answer":"■正解：A\n■解説：\n【成長期】成長中の企業（事業）では、売上を伸ばすために取引先に対する支払条件を緩和したり、見込み生産を行うので営業活動による現金収支はマイナスに、投資活動では活発に設備投資を行うのでマイナスに、それらを支えるために積極的に資金調達を行うので財務活動ではプラスになる。\n【安定期】営業活動では支払い条件も安定し、需給も調整しやすくなるのでプラスに転じ、投資活動はマイナスだが支出額は減少するので、財務活動はほぼ均衡の状態となる。\n【成熟期】営業活動の現金収支はプラスに、投資活動は抑えぎみで、財務活動では返済が多くなり、マイナスになる傾向にある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n８.キャッシュフロー計算書　 P.106-107","source":"Excel: GMAP道場問題秋春(2).xlsx","no":308,"idx":308},{"id":"xlsx-2025春-アカウンティング-9","season":"2025春","subject":"アカウンティング","scope":"9.連結会計","question":"■問9.連結会計に関する以下の文章のうち、正しいものの組み合わせを選んでください。\nア.日本の上場企業は日本会計基準、国際会計基準、米国会計基準のいずれの場合においても原則として連結財務諸表を作成する必要がある。\nイ.連結会計の対象となるかどうかは主に株式の過半を所有しているかどうかが基準であるが、持ち株比率50%未満でも連結子会社となる場合もある。\nウ.連結決算の作成においては、親会社と子会社の取引について貸借対照表の項目は単純合算し、損益計算書の項目は相殺消去する。\nエ.持分法適用会社の財務諸表は連結決算においては貸借対照表のみに反映され、損益計算書には反映されない。\n\n＜選択肢＞\n①　アとイ\n②　イとウ\n③　イとエ\n④　ウとエ","answer":"■正解：①\n■解説：\nア.正しい。日本会計基準ではかつては連結財務諸表の作成は必須ではなかったが、2000年3月期より義務化された。\nイ.正しい。持株比率が50%以下の場合においても親会社が役員派遣などを通じて経営を実質的に支配している状態であれば、連結決算において子会社と見なされる（支配力基準）。\nウ.誤り。連結対象会社同士の取引は貸借対照表項目についても相殺消去する。例えば、個別財務諸表において親会社で子会社に対する買掛金が100、子会社で親会社に対する売掛金が100計上されている場合、連結財務諸表上では売掛金、買掛金ともに0となる。\nエ.誤り。持分法適用会社の損益についても持分法による投資利益として連結財務諸表に反映される。例えば、親会社が40%を出資している持分法適用会社の当期純利益が1億円の場合、連結財務諸表上では当期純利益1億円×持分比率40%＝4千万円を持ち分法投資利益として表示する。\n■出典：グロービス マネジメントブック 改訂3版 　\n9.連結決算 P.108-109","source":"Excel: GMAP道場問題秋春(2).xlsx","no":309,"idx":309},{"id":"xlsx-2025春-アカウンティング-10","season":"2025春","subject":"アカウンティング","scope":"10. 税効果会計と退職給付会計","question":"■問10.税効果会計と退職給付会計について、次のA～Dのうち、正しいものを選択してください。\nA.税効果会計は、財務会計上の税引前利益と税務会計上の所得との差違を合理的に期間対応させるための会計処理手続きである。\nB.税効果会計は、どうすれば国民から税金を効果的に徴収できるか、を考えるための仕組みである。\nC.退職給付会計とは、従業員が退職するときに企業が支払う退職金や企業年金を厳格に見積もり、これに対する企業の対応状況を開示する会計制度である。\nD.いまの会計規則では、退職一時金のみを引当金（退職給付引当金）として貸借対照表の負債に計上する。","answer":"■正解：AとCです\n■解説：\nA：正解です。\nB：誤りです。税効果会計と、税金の徴収は関係ありません。\nC：正解です。\nD：誤りです。いまの会計規則では、年金の積立不足額も退職一時金とともに「退職給付引当金」として計上されます。\n■出典：グロービス マネジメントブック 改訂3版 　\n10.税効果会計と退職給付会計 P.110-111","source":"Excel: GMAP道場問題秋春(2).xlsx","no":310,"idx":310},{"id":"xlsx-2025春-アカウンティング-11","season":"2025春","subject":"アカウンティング","scope":"11. 有価証券(時価会計)","question":"■問 11.有価証券(時価会計)について、正しいものを選択してください。\nA.会計基準の変更に伴い、有価証券は保有目的別に計上基準が異なるようになった。とりわけ、売買目的の保有有価証券は原価法で、子会社・関連会社株式は時価法で計上するようになった点が注目される。\nB.日本では従来、保有有価証券を計上するときには、大きく分けて原価法(原則取得原価法)と低価法の2つの基準から選択するのが原則だった。\nC.2001年3月期の有価証券報告書から新しい会計基準が適用され、保有有価証券の計上基準が変わった。とくにおさえておくべき点は、これまでのように強制適用ではなく選択性であることと、従来の低価法がなくなったことだ。\nD.売買を目的とした有価証券には時価法が適用される。すなわち、貸借対照表には市場価格で評価計上し、損益計算書には市場価格が取得価格より高ければ有価証券評価損として、低ければ有価証券評価益として計上しなくてはならない。","answer":"■正解：Bのみ\n■解説：\nA.会計基準の変更に伴い、有価証券は保有目的別に計上基準が異なるようになった。とりわけ、売買目的の保有有価証券は（時価法）で、子会社・関連会社株式は（原価法）で計上するようになった点が注目される。\nB.正解\nC.2001年3月期の有価証券報告書から新しい会計基準が適用され、保有有価証券の計上基準が変わった。とくにおさえておくべき点は、これまでのように（選択性ではなく強制適用であること）と、従来の低価法がなくなったことだ。\nD.売買を目的とした有価証券には時価法が適用される。すなわち、貸借対照表には市場価格で評価計上し、損益計算書には市場価格が取得価格より高ければ（有価証券評価益）として、低ければ（有価証券評価損）として計上しなくてはならない。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n11.有価証券(時価会計) P.112-113","source":"Excel: GMAP道場問題秋春(2).xlsx","no":311,"idx":311},{"id":"xlsx-2025春-アカウンティング-12","season":"2025春","subject":"アカウンティング","scope":"12. 総合力分析ROAとROE","question":"■問12.A〜Dに示す各指標を算出してください。（計算式の答えは小数点第二位を四捨五入してください）\n2021年(単位：百万円）\n売上高　　　　　　　：3,000\n売上高総利益　　　　：1,200\n営業利益　　　　　　：800\n支払利息　　　　　　：100\n当期純利益　　　　　：300\n流動資産　　　　　　：1,000\n固定資産　　　　　　：4,000\n流動負債　　　　　　：800\n固定負債　　　　　　：2,500\n総資産　　　　　　　：5,000\nA.　ROA：\nB.　売上高当期純利益率：\nC.　財務レバレッジ：\nD.　ROE：","answer":"■正解：\nA.　ROA：　6.0%\nB.　売上高当期純利益率：　10.0%\nC.　財務レバレッジ：　2.9\nD.　ROE：　17.6%\n■解説：\nROA：当期純利益(300)÷総資産(5,000)\n売上高当期純利益率：当期純利益(300)÷売上高(3,000)×100\n財務レバレッジ：総資産(5,000)÷自己資本(総資産5,000-流動負債800-固定負債2,500)\nROE：当期純利益(300)÷自己資本(1,700)x100\n■出典：グロービス マネジメントブック 改訂3版 　\n12．総合力分析：ROAとROE P.114-115","source":"Excel: GMAP道場問題秋春(2).xlsx","no":312,"idx":312},{"id":"xlsx-2025春-アカウンティング-13","season":"2025春","subject":"アカウンティング","scope":"13. 収益性分析","question":"■問13.収益性分析の役割や特徴について、誤っているものを選択してください。\nA.売上高利益率は企業のプロセスにより規定されているため、事業形態や業種が異なる企業同士を比較してみても優劣をつけることができない\nB.売上高総利益率が高いことは、営業力の強さや製品の優秀さを意味するが、年を追ってこの比率が下落するときは、原価率の上昇や商品力の低下などが考えられる\nC.売上高営業利益率を同業他社と比較することにより、販売活動や管理活動の効率性がわかる\nD.売上高経常利益率の分子である経常利益に関して、連結の場合、持ち分法による投資損益の影響は受けない","answer":"■正解：D\n■解説：\n連結の場合、経常利益は持分法による投資損益によっても影響を受ける。したがって、経常利益を増やしたいのならば、その企業単独の合理化だけではなく、子会社や関連会社などのマネジメントを行う必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n13.収益性分析 P.116-117","source":"Excel: GMAP道場問題秋春(2).xlsx","no":313,"idx":313},{"id":"xlsx-2025春-アカウンティング-14","season":"2025春","subject":"アカウンティング","scope":"14.安全性分析","question":"■問14.企業の安全性分析に関する指標について、以下の記述のうち誤っているものを一つ選択してください。\nA. 自己資本比率は、総資本に占める自己資本の割合を示す。自己資本比率が高いほど、外部からの資金調達への依存度が低く、企業の財務安定性は高いと言える。\nB. 流動比率は、短期（1年以内）に支払う必要のある流動負債に対し、同じく短期（1年以内）に現金化できる流動資産がどの程度あるかを示す指標である。\nC. 当座比率は、流動資産の中でも特に換金性の高い当座資産と流動負債の比率を示す。当座資産は、預金、受取手形、売掛金、有価証券等の現金に近い流動資産だけを流動負債の支払い手段と捉えている。\nD. 固定比率は、固定資産が純資産に対してどの程度の割合であるかを示す指標である。固定比率が高いほど、企業の長期的な財務安定性は高いと評価される。。","answer":"■正解：D\n■解説：\nA：正しい。自己資本比率は、株主資本（自己資本）が総資本に占める割合であり、高いほど企業の安定性が高いと言える。外部からの調達への依存度が低いため、財務的な健全性が高いと判断される。\nB：正しい。 流動比率は、短期的な支払い能力を測る指標であり、短期（1年以内）に返済する必要のある負債（流動負債）に対し、同じく短期（1年以内）に現金化できる資産（流動資産）がどの程度あるかを示す。\nC：正しい。 当座比率は、流動資産から換金性の低い棚卸資産などを除いた当座資産と流動負債の比率であり、流動比率よりも厳密な短期支払能力を示す。\nD：誤っている 固定比率は、固定資産が純資産の何倍であるかを示す指標である。一般的に、この比率は低いほど、企業の長期的な財務安定性が高いと評価される。割合が高い場合、自己資本に対して固定資産への投資が大きい状態を示し、長期的な財務安定性の観点から注意が必要となる。\n■出典：グロービス マネジメントブック 改訂3版 　\n14.安全性分析 P.118-119","source":"Excel: GMAP道場問題秋春(2).xlsx","no":314,"idx":314},{"id":"xlsx-2025春-アカウンティング-15","season":"2025春","subject":"アカウンティング","scope":"15. 株式市場が企業を評価する指標","question":"■問15.株式投資家は企業の会計データに加えて、将来への期待や含み資産（負の場合もある）なども考慮して企業を評価する。投資家が注目する代表的な指標について、誤っているものを全て選択してください。\nA.時価総額\n株主資本の総額を時価で表したもの。ファイナンスでは株主資本価値と呼ばれる。M＆Aの時に注目される指標でもある。\nB.配当性向\n利益のうち配当にどれだけの比率を振り向けているかを示す指標。投資家にとっては通常、配当性向はある程度高いほうが好ましい。\nC.EPS\n企業の利益を1株当たりに換算して、収益性を見るための指標。EPSを算出するときは、分子には債権者に利息を返した後の株主に分配すべき利益という意味で、税引後当期純利益が用いられる。\nD.PER\n株価と1株当たりの純資産の比率を表す指標。1株当たりの純資産とは「総資産ー負債総額」を株数で割った値のこと。この指標が高い企業は、株式市場がその企業に対して、簿価以上の価値を見出していることを意味する。\nE.PBR\n株価と1株あたりの利益（EPS）の比率を表す指標。株価がEPSの何倍かを見るために用い、その企業の価値がEPSで示された利益の何年分かという尺度で評価している。","answer":"■正解：DとE\n■解説：\nA.正しい　　時価総額（発行済み株式数×株価）\nB.正しい　　配当性向（配当金総額／税引後当期純利益）\nC.正しい　　EPS（Earnings per Share）（税引後当期純利益／発行済み株式数）\nD.誤り\nE.誤り\nDとEの説明が逆になっている。正しくは以下の通り。\nD.PER（Price Earnings Raito：株価収益率）（株価／EPS）\n株価と1株当たりの利益（EPS）を比率を表す指標。株価がEPSの何倍かを見るために用い、その企業の価値をEPSで示された利益の何年分かという尺度で評価している。\nE.PBR（Price to Book Raito：株価純資産倍率）（株価／1株当たり純資産額）\n株価と1株当たりの純資産の比率を表す指標。1株当たりの純資産とは「総資産ー負債総額」を株数で割った値のこと。PBRの高い企業は、株式市場がその企業に対して、簿価以上の価値を見出していることを意味する。\n■出典：グロービス マネジメントブック 改訂3版 　\n15.株式市場が企業を評価する指標 P.120-121","source":"Excel: GMAP道場問題秋春(2).xlsx","no":315,"idx":315},{"id":"xlsx-2025春-アカウンティング-16","season":"2025春","subject":"アカウンティング","scope":"16.たな卸資産","question":"■問16.たな卸資産の評価について、正しいものを一つ選択してください。\nA. どの時期で仕入れたたな卸資産を販売したと認識するかによって、同じ売上高でも会計上の利益額は異なってくる。一方で、期末において貸借対照表上のたな卸資産の金額は変わらない。\nB. 企業はたな卸資産を評価する方法を決定した後、業績が厳しい時期には評価方法を柔軟に変更すべきである。\nC. 先入先出法は、物価が上昇し製造コストも販売単価も上昇している時期には、結果として利益が小さく計上されることが多い。\nD. 平均法には、総平均法と移動平均法がある。","answer":"■正解：正解はD。\n■解説：\nA：（誤）通常は同じ種類のたな卸資産であっても調達時期により仕入れ価格が異なるので、どの時期で仕入れたたな卸資産を販売したと認識するかによって、同じ売上高でも会計上の利益額は異なってくる。それにより、期末において貸借対照表上のたな卸資産の金額も異なる。\nB：（誤）会計原則の継続性から考えると、企業はたな卸資産を評価する方法を決定した後は、その方法を毎期継続して採用すべきである。\nC：（誤）先入先出法は、たな卸資産に加わった古い順から販売していくと仮定した方法で、設問のようなインフレのときは「現在の販売価格（高い）－昔の原価（安い）＝利益（大きい）」となるため、結果として利益が大きく計上されることが多い。\nD：（正）設問の通り。\n■出典：グロービス マネジメントブック 改訂3版 　\n16. たな卸資産 P.122-123","source":"Excel: GMAP道場問題秋春(2).xlsx","no":316,"idx":316},{"id":"xlsx-2025春-アカウンティング-17","season":"2025春","subject":"アカウンティング","scope":"17.減価償却と固定資産","question":"■問17.減価償却・固定資産について、誤っているものを１つ選択してください。\nA. 定額法とは、減価償却費を各期間にわたって均等に計上する方法である。\nB. 250％定率法とは、償却率を定額法の償却率（＝１／耐用年数）を2.5倍した率とし、毎年の減価償却費が定額法によって期首帳簿価額を残りの耐用年数で償却するとした場合の償却額を下回るとき、償却法を定率法から定額法に変更して償却していくものである。\nC. 定額法のメリットの一つとして、機械等の能率が高いとき、すなわち収益の多いときに償却費が多く計上される。\nD. 無形固定資産も償却しなければならない。特許権、借地権、商標権などの法律上の権利である資産は、有形固定資産の減価償却と同様の償却を行う。","answer":"■正解：Cのみ\n■解説：\nA、B、D：正解です。\nC：誤り\n記載は「定率法」のメリットとなります。\n「定率法」のメリットの一つとして、機械等の能率が高いとき、すなわち収益の多いときに償却費が多く計上される。\n■出典：グロービス マネジメントブック 改訂3版 　\n17.貸借対照表（負債＋純資産）P. 124-125","source":"Excel: GMAP道場問題秋春(2).xlsx","no":317,"idx":317},{"id":"xlsx-2025春-アカウンティング-18","season":"2025春","subject":"アカウンティング","scope":"18.損益分岐点分析","question":"■問18. 売上高：350万円、固定費：80万円、変動費：100万円の時、損益分岐点売上高に\nもっとも近いものを、下記のA～Dから選んでください。\nA：112万円\nB：129万円\nC：146万円\nD：170万円","answer":"A\n■解説：損益分岐点売上高の算出法は下記の通り。\n①限界利益を求める\n限界利益＝売上高－変動費＝350万円－100万円＝250万円\n②限界利益率を求める\n限界利益率＝限界利益÷売上高＝250万円÷350万円＝71.4％\n③損益分岐点売上高を求める\n損益分岐点売上高＝固定費÷限界利益率＝80万円÷71.4％＝112万円","source":"Excel: GMAP道場問題秋春(2).xlsx","no":318,"idx":318},{"id":"xlsx-2025春-アカウンティング-19","season":"2025春","subject":"アカウンティング","scope":"","question":"■問19.以下の条件に従い製品A、Bそれぞれの1個あたり原価を活動基準原価計算により算定してく\nださい。\n①製品Aを2,000個、製品Bを3,000個製造した\n②製品Aの材料費は1,000千円、製品Bの材料費は1,200千円だった\n③間接費の項目／金額／アクティビティ・ドライバーは以下の通り\n　・機械のセッティング／300千円／セットアップ回数\n　・品質検査／500千円／検査回数\n④各製品の活動量は以下の通り\n　・セットアップ回数　製品A：4回　製品B：2回（1個当たりではない！）\n　・検査回数　製品A：18回　製品B：32回（同上！）","answer":"■正解：製品A：690円　製品B：540円\n■解説：\n・配賦率の計算\n機械のセッティング：300千円／（4回＋2回）＝50千円／回\n品質検査：500千円／（18回＋32回）＝10千円／回\n・間接費配賦金額の計算\n製品A：4回×50千円＋18回×10千円＝380千円\n製品B：2回×50千円＋32回×10千円＝420千円\n・1個当たり原価の計算\n製品A：（1,000千円＋380千円）／2,000個＝690円／個\n製品B：（1,200千円＋420千円）／3,000個＝540円／個\n■出典：グロービス マネジメントブック 改訂3版 　\n19.原価計算 P.128-129","source":"Excel: GMAP道場問題秋春(2).xlsx","no":319,"idx":319},{"id":"xlsx-2025春-アカウンティング-20","season":"2025春","subject":"アカウンティング","scope":"","question":"■問20.マネジメント・コントロールに関して、次のA～Dのうち、正しいものを全て選択してくださ\nい。\nA.マネジメント・コントロールとは、経営管理の「経営者が主体となって全社的視点から経営戦略を策\n定するステップ」と、「さまざまな職能分野を担当する現場管理者が行う日常のオペレーション管理の\nステップ」の橋渡しを行い、全体としての組織活動に秩序を与えることである。\nB.マネジメント・コントロールにおける管理責任単位（業績評価単位）は、主にマネジメント・セン\nターと、コントロール・センターが多用されている。\nC.一般に、マネジメント・コントロールのプロセスは、①部門別実行計画策定、②経営資源配分計画策\n定（プログラミング）、③予算編成（バジェッティング）、④実績分析・業績評価・報告（レポーティ\nング）の４段階からなる。\nD.BSC（Balanced Scorecard）では、財務、顧客、製品、人材、の４つの視点から、それぞれ戦略と\n関連性が強い指標を選択する。","answer":"■正解：AとCです\n■解説：\nA：正解です。\nB：誤りです。マネジメント・コントロールにおける管理責任単位（業績評価単位）は、主にコスト・\nセンターと、プロフィット・センターが多用されています。\nC：正解です。\nD：誤りです。BSCでは、財務、顧客、内部ビジネスプロセス、学習と成長、の４つの視点から、それ\nぞれ戦略と関連性が強い指標を選択します。\n■出典：グロービス マネジメントブック 改訂3版 　\n20.マネジメント・コントロール P.130-131","source":"Excel: GMAP道場問題秋春(2).xlsx","no":320,"idx":320},{"id":"xlsx-2025春-アカウンティング-21","season":"2025春","subject":"アカウンティング","scope":"","question":"■問21.内部統制の役割や特徴について、誤っているものをすべて選択してください。\nA. 内部統制とは、企業の財務報告の信頼性を確保し、事業経営の有効性と効率性を高め、かつ事業経営\nに関わる法規の遵守を促すことを目的として企業外部に設けられ、運用される仕組みである。\nB. 内部統制は、①業務の有効性および効率性、②財務報告の信頼性、③事業活動に関わる法令などの遵\n守(コンプライアンス)、④資産の保全―の大きく4つの目的を有する。\nC. 内部統制は5つの構成要素に大別される。具体的には、①統制環境、②リスク評価の機能、③統制活\n動、④情報・伝達の機能、⑤監視活動の5つである。\nD. 内部統制の概念と構成要素は、国際的にも共通に理解されているものである。しかし、それぞれの企\n業において、どのような内部統制の仕組みを構築し、どのように運用するかについては、各国の法制や\n社会慣行あるいは個々の企業が置かれた環境や事業の特性などを踏まえ、株主が内部統制の機能と役割\nを効果的に達成し得るよう工夫していくべきものである。","answer":"■正解：AとCとD\n■解説：\nA. 誤り　内部統制とは、企業の財務報告の信頼性を確保し、事業経営の有効性と効率性を高め、かつ事\n業経営に関わる法規の遵守を促すことを目的として企業（内部）に設けられ、運用される仕組みである。\nB. 正解\nC. 誤り　内部統制は（6つ）の構成要素に大別される。具体的には以下の6つである。\n①統制環境、②リスク評価の機能、③統制活動、④情報・伝達の機能、⑤監視活動、⑥IT(情報技術)へ\nの対応\nD. 誤り　内部統制の概念と構成要素は、国際的にも共通に理解されているものである。しかし、それぞ\nれの企業において、どのような内部統制の仕組みを構築し、どのように運用するかについては、各国の\n法制や社会慣行あるいは個々の企業が置かれた環境や事業の特性などを踏まえ、（経営者自ら）が内部\n統制の機能と役割を効果的に達成し得るよう工夫していくべきものである。\n■出典：グロービス マネジメントブック 改訂3版 　\n21.内部統制 P.132-133","source":"Excel: GMAP道場問題秋春(2).xlsx","no":321,"idx":321},{"id":"xlsx-2025春-アカウンティング-22","season":"2025春","subject":"アカウンティング","scope":"","question":"■問22.A?Eに示す各項目を算出してください。\n売上高　　　　　　　　　：215,780\n売上原価　　　　　　　　： 90,880\n　売上総利益　　　　　　：　A\n販管費および一般管理費　：　B\n　営業利益　　　　　　　：　C\n営業外収益　　　　　　　： 42,380\n営業外費用　　　　　　　： 10,680\n　経常利益　　　　　　　： 72,380\n特別利益　　　　　　　　： 8,450\n特別損失　　　　　　　　： 17,650\n　税金等調整前当期純利益：　D\n法人税等　　　　　　　　： 15,795\n　当期純利益　　　　　　：　E","answer":"■正解：\nA.　売上総利益　　　　　　：124,900\nB.　販売費および一般管理費： 84,220\nC.　営業利益　　　　　　　： 40,680\nD.　税金等調整前当期純利益： 63,180\nE.　当期純利益　　　　　　： 47,385\n■解説：\nA:売上総利益：売上高（215,780）ー売上原価（90,880）\nC:営業利益：経常利益（72,380)＋営業外費用（10,680）－営業外収益（42,380）\nB:販売費および一般管理費：売上総利益（124,900）－営業利益（40,680）\nD:税金等調整前当期純利益：経常利益（72,380）＋特別利益（8,450）ー特別損失（17,650）\nE:当期純利益：税金等調整前当期純利益（63,180）ー法人税等（15,795）\n■出典：グロービス マネジメントブック 改訂3版 　\n5．損益計算書 P.100-101","source":"Excel: GMAP道場問題秋春(2).xlsx","no":322,"idx":322},{"id":"xlsx-2025春-アカウンティング-23","season":"2025春","subject":"アカウンティング","scope":"","question":"■問23.貸借対照表（資産）について、誤ったものをすべて選択してください。\nA.流動資産のうち、当座資産は営業活動の販売段階で生じる売掛金、受取手形など、営業活動の回収段\n階で生じる現金・預金のように現金および現金に近い形の資産を指す。\nB.流動資産のうち、たな卸資産は営業活動の仕入れ・生産段階で生じる完成品・半製品などのように、\n販売されることで初めて現金化される資産を指す。\nC.固定資産のうち、有形固定資産は土地・建設仮勘定などの償却資産、建物・機械装置などの非償却資\n産からなる。これらは投資活動によって生じる。\nD.固定資産のうち、無形固定資産は特許権、実用新案権等が該当し、他社から買い入れたり、合併した\n場合に計上されるのれんも無形固定資産に該当する。これらは資金運用活動に該当する。","answer":"■正解：C,D\n■解説：\nA.正しい\nB.正しい\nC.誤り\n固定資産のうち有形固定資産は建物・機械装置などの償却資産、土地・建設仮勘定などの非償却資産か\nらなる。これらは投資活動によって生じる。\nD.誤り\n営業サイクルにおける資産科目のうち、有形固定資産・無形固定資産は投資活動に該当する。\n■出典：グロービス マネジメントブック 改訂3版 　\n6.貸借対照表（資産） P.102-103","source":"Excel: GMAP道場問題秋春(2).xlsx","no":323,"idx":323},{"id":"xlsx-2025春-アカウンティング-24","season":"2025春","subject":"アカウンティング","scope":"","question":"■問24.貸借対照表の純資産に関する記述として、誤っているものを一つ選択してください。\nA.一般に、企業の健全性を測る上で、純資産は負債よりも大きいことが望ましいとされています。\nB.株主資本、評価・換算差額等、新株予約権、少数株主持分の4つに分類されます。\nC.企業の通常の営業サイクル中または短期間（1年以内）に支払わなくてはならない負債のことです。\nD.株主資本は、株主が企業に拠出した資金と過去の利益の蓄積分であり、資本金や利益剰余金などが含\nまれます。","answer":"■正解：C\n■解説：\nA：適切です。「一般には、将来の支払債務である負債の額が業界適正規模より大きい場合、企業の不\n健全さを示していると見なされる」とあることから、反対に純資産が負債よりも大きい方が健全である\nと考えられます。\nB：適切です。「純資産とは、投資家から集めた出資金と過去の利益を蓄積した株主資本のほか、評\n価・換算差額等、新株予約権、少数株主持分の4つ（単体では少数株主持分を除く3つ）に分類され\nる」\nC：不適切です。そもそもこの記述は流動負債に関する説明であり、純資産に関する記述ではありませ\nん。\nD：適切です。「株主資本とは、株主が企業に拠出した資金と過去の利益の蓄積分である。前者は資本\n金、資本剰余金、自己株式であり、財務活動に対応する。後者は利益剰余金であり、営業活動に対応す\nる」とマネジメントブックに記載されています。\n■出典：グロービス マネジメントブック 改訂3版 　\n7.貸借対照表（負債＋純資産） P.104-105","source":"Excel: GMAP道場問題秋春(2).xlsx","no":324,"idx":324},{"id":"xlsx-2025春-アカウンティング-25","season":"2025春","subject":"アカウンティング","scope":"","question":"■問25.キャッシュフロー計算書に関する記載について、誤っているものを１つ選択してください。\nA.上場企業はグループ会社を含めた連結キャッシュフロー計算書を開示しなければならない。開示され\nた連結キャッシュフロー計算書から、投資家は企業グループの現金の創出力を評価できるようになる。\nB.営業活動によって生じるキャッシュフローを把握するには直接法と間接法があるが、実際のキャッ\nシュフロー計算書は直接法によって作成されたものが多い。直接法は、営業活動から生じる現金の入金\nと支出を直接計算する方法である。\nC.投資活動から生じるキャッシュフローでは、通常の営業活動以外の部分（設備投資の実施、破棄、固\n定資産の取得・売却など）に伴う現金の増減を把握する。\nD.財務活動から生じるキャッシュフローでは、直接の営業活動とは結びつかない企業の財務活動（銀行\n借入れ、社債発行や株式発行による資金調達、配当支払い、減資など）による現金の増減を計算する。","answer":"■正解：B\n■解説：\nA.正しい\nB.誤り\n実際のキャッシュフロー計算書は間接法によって作成されたものが多い。間接法は、当期純利益の数字\nに減価償却費を加え、さらに貸借対照表上の各項目の増減を加えて機械的に現金の増減を算出する方法。\nC.正しい　\nD.正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n8.キャッシュフロー計算書 P.106-107","source":"Excel: GMAP道場問題秋春(2).xlsx","no":325,"idx":325},{"id":"xlsx-2025春-アカウンティング-26","season":"2025春","subject":"アカウンティング","scope":"","question":"■問26.ある企業の以下に示す財務指標から、当該企業のROEを算出してください。\n売上高当期純利益率 ：25%\n売上高成長率 ：10%\n総資産回転率 ：0.5\n棚卸資産回転率 ：5.0\n自己資本比率 ：50%\n財務レバレッジ ：2倍","answer":"■正解：ROE：25%\n■解説：\nROE（Return On Equity：自己資本利益率）\n＝当期純利益/自己資本\n=(当期純利益/売上高)×(売上高/総資産)×(総資産/自己資本)\n=売上高当期純利益率×総資産回転率×財務レバレッジ\n=25%×0.5×2\n=25%\nなお、「売上高当期純利益率×総資産回転率」はROA（Return　On　Assets：総資産利益率）に該当\nする。\nまた、この問では財務レバレッジが2倍、自己資本比率が50%であり、これらは互いに逆数の関係に\nなっている。\n■出典：グロービス マネジメントブック 改訂3版 　\n12．総合力分析：ROAとROE P.114-115","source":"Excel: GMAP道場問題秋春(2).xlsx","no":326,"idx":326},{"id":"xlsx-2025春-アカウンティング-27","season":"2025春","subject":"アカウンティング","scope":"","question":"■問27.たな卸資産について、誤っているものを１つ選択してください。\nA. たな卸資産の場合は先入先出法、後入先出法、平均法などがあり、どの方法を用いるかによって売上\n原価や期末残高が変わる。\nB. 先入先出法は、 たな卸資産に加わった古い順から販売（払い出し）していくと仮定した方法で、結\n果的に在庫として残るのは新しく取得・製造した製品となる。\nC. 後入先出法は、先入先出法とは逆に最新の仕入在庫から順に販売していくと仮定した方法で、売上総\n利益（販売価格－原価）は常に最新の状況を示すこととなり、会計上の利益は小さくなることが多い。\nD. 低価法とは「時価と原価を比較していずれか低いほうの価格で評価」する方法であり、価値を堅く見\n積もる保守主義に基づく。日本では、低価法・原価法のいずれを採用するかは任意である。","answer":"■正解：Dのみ\n■解説：\nA、B、C：正解です。\nD：誤り\n日本では、以前は低価法・原価法のいずれを採用するかは任意であったが、国際的な会計ルールとの整\n合をとることを主眼に、2008年4月からは新たに「たな卸資産の評価に関する会計基準」が適用され、\nトレーディング目的以外のたな卸資産の評価基準は【低価法が義務づけられた】。\n■出典：グロービス マネジメントブック 改訂3版 　\n16. たな卸資産P. 122-123","source":"Excel: GMAP道場問題秋春(2).xlsx","no":327,"idx":327},{"id":"xlsx-2025春-アカウンティング-28","season":"2025春","subject":"アカウンティング","scope":"","question":"■問28. 有形固定資産の減価償却の方法は①定額法と②定率法の２つがある。下記の条件で、①定額法、\n②定率法それぞれの1年目の減価償却費を算出し、A?Cから正しいものを選んでください。\n取得原価：1,000千円\n残存価額：便宜上０円とする\n耐用年数：5年\nA：1年目は定額法の値の方が定率法より大きい。\nB：1年目は定率法の値の方が定額法より大きい。\nC：1年目は定額法・定率法ともに値は同じである。","answer":"■正解：\nB.　1年目は 定率法の値の方が定額法より大きい。\n■解説：\n①減価償却費（定額法）\n＝（取得原価－残存価額）×（１÷耐用年数）\n＝（1,000千円－0円）×（１÷5年）＝200千円\n※償却率＝１÷耐用年数＝20％となる。\n②減価償却費（定率法）※250％定率法の計算例\n＝（取得原価－減価償却費の累計額）×償却率\n＝（1,000千円－０円）×（20％×250％）＝500千円\n※1年目の減価償却費なので、減価償却費の累計額は0円とする。\n※250％定率法では償却率を定額法の償却率（＝１÷耐用年数）を2.5倍した率とする。\n■出典：グロービス マネジメントブック 改訂3版 　\n17．減価償却と固定資産P.124-125","source":"Excel: GMAP道場問題秋春(2).xlsx","no":328,"idx":328},{"id":"xlsx-2025春-アカウンティング-29","season":"2025春","subject":"アカウンティング","scope":"","question":"■問29.とある非上場メーカーA社のM&Aを検討しています。現在判明している情報は以下の通りです。\nA社の固定費および直近の売上高を推定してください。\n①A社の直近の営業利益率、変動費率はそれぞれ業界平均と同じで10%、40%と言われている。\n②数年前のコロナ禍においては売上が15億円まで減少し営業利益がほぼ0だった（ぎりぎり営業赤字\nを回避した）とのこと。\n③コロナ禍から現在に至るまで変動費率、固定費ともに大きな変化はないものと見られる。","answer":"■正解：固定費　9億円、直近の売上高　18億円\n■解説：\n損益分岐点売上高＝変動費＋固定費であるので、\n損益分岐点売上＝売上×変動費率＋固定費\n問題の条件より15億円＝15億円×40%＋固定費\nこれを整理すると固定費は9億円\n営業利益＝売上高－（変動費＋固定費）であるので、\n営業利益率＝｛売上高－（変動費＋固定費）｝／売上高\n問題の条件より10%＝｛売上高－（売上高×40%＋9億円）｝／売上高\nこれを整理すると直近の売上高は18億円\n■出典：グロービス マネジメントブック 改訂3版 　\n18.損益分岐点分析 P.126-127","source":"Excel: GMAP道場問題秋春(2).xlsx","no":329,"idx":329},{"id":"xlsx-2025春-アカウンティング-30","season":"2025春","subject":"アカウンティング","scope":"","question":"■問30. 以下の条件の場合の製品甲、製品乙の1個当たりの製造原価はいくらになるでしょうか。\n条件：\n①材料費は、製品甲：4,500円、製品乙：7,500円\n②労務費は、合計で30,000円（アクティビティ・ドライバーは製造時間）\n③梱包費は、合計で18,000円（アクティビティ・ドライバーは製造数量）\n④製造にかかった時間は、製品甲：25時間、製品乙：75時間\n⑤製造した数量は、製品甲：60個、製品乙：120個","answer":"■正解：製品甲：300円、製品乙：350円、です。\n■解説：\n・配賦率の計算\n労務費：30,000円 /（25時間+75時間）＝300円\n梱包費：18,000円 /（60個+120個）＝100円\n・労務費＆梱包費の配賦金額の計算\n製品甲：300円×25時間+100円×60個＝13,500円\n製品乙：300円×75時間+100円×120個＝34,500円\n・1個当たり製造原価の計算\n製品甲：（材料費4,500円+労務費＆梱包費13,500円）/ 60個＝＠300円\n製品乙：（材料費7,500円+労務費＆梱包費34,500円）/120個＝@350円\n■出典：グロービス マネジメントブック 改訂3版 　\n19．原価計算 P.128-129","source":"Excel: GMAP道場問題秋春(2).xlsx","no":330,"idx":330},{"id":"xlsx-2025春-ファイナンス-1","season":"2025春","subject":"ファイナンス","scope":"1. 企業経営と企業財務","question":"■問1.企業経営と企業財務について、間違っているものを全て選択してください。\nA.企業財務では経営目標の実現を目指して、資金（キャッシュフロー）を管理し、企業価値の最大化を図ろうとするので、企業の過去に重点が置かれる。\nB.企業は資金を得るために有価証券等（株式、債権）を投資家向けに発行したり、銀行から借り入れる。\nC.企業は財務活動で得た資金を事業投資活動に充て、生み出された収益（キャッシュフロー）は、企業内で留保され再び事業投資に振り向けられるか、資金提供した投資家や銀行に還元される。\nD.企業が投資や資金調達を行う際に、ファイナンス理論を踏まえていなければ、記録・報告ができない。","answer":"■正解：A . D\n■解説：\nA.企業財務では、今後の活動から生じるキャッシュフローを効率的に増加させるかを主眼としているので、企業の『将来』に重点が置かれる。\nD.企業が投資や資金調達を行う際に、ファイナンス理論を踏まえていなければ、『的確な意思決定』ができない。\n■出典：グロービス マネジメントブック 改訂3版 　\n1.企業経営と企業財務 P.136-137","source":"Excel: GMAP道場問題秋春(2).xlsx","no":331,"idx":331},{"id":"xlsx-2025春-ファイナンス-2","season":"2025春","subject":"ファイナンス","scope":"2.ファイナンス理論の体系","question":"■問2.ファイナンス理論の体系について、誤っているものをすべて選択してください。\nA.ファイナンス理論は大きく、投資理論（インベストメント）と企業金融理論（コーポレート・ファイナンス）の2つに分けられる。\nB.投資理論では、投資家が投資した際のリスクと市場規模の関係や、投資対象資産の価値・価格が主要なテーマとなる。\nC.デリバティブとはその名のとおり、ある資産の価格を元にして、派生商品の価格が定まる仕組みの金融商品のことである。\nD.企業金融理論の中心的なテーマは、いろいろな資産に分散投資すること（ポートフォリオ投資）に関することである。","answer":"■正解：BとD\n■解説：\nB.投資理論では、投資家が投資した際のリスクと利回り（リターン）の関係や、投資対象資産の価値・価格が主要なテーマとなります。\nD.企業金融理論の中心的なテーマは、企業が資金調達を行う際に、どのような手段で調達すれば企業価値を最大化できるかということです。ポートフォリオ投資は、投資理論のテーマになります。\n■出典：グロービス マネジメントブック 改訂3版 　\n2.ファイナンス理論の体系 P.138-139","source":"Excel: GMAP道場問題秋春(2).xlsx","no":332,"idx":332},{"id":"xlsx-2025春-ファイナンス-3","season":"2025春","subject":"ファイナンス","scope":"3. 金銭の時間的価値：現在価値","question":"■問03.金銭の時間的価値の特徴について、誤っているものを選択してください。\nA.将来受け取る金銭の、今日時点での価値のことを「将来価値」と呼ぶ。\nB.n年後に受け取る現金Cの現在価値（PV）は、割引率をr とすると　PV=C/(1+r)^n　であらわすことができる。\nC. 割引率が2%のとき、1年後に受け取る100円の現在価値（PV）は102.04円である。\nD.現在価値を計算する際に用いる(“1+割引率“の逆数)をハードルレートという。","answer":"■正解：A、C、D\n■解説：\nA. 将来受け取る金銭の、今日時点での価値のことを「現在価値」と呼ぶ。\nB.設問のとおり\nC. 割引率が2%のとき、1年後に受け取る100円の現在価値（PV）は100/1.02=98.04円となります。\nD. 現在価値を計算する際に用いる(“1+割引率“の逆数)をディスカウント・ファクターという。\n■出典：グロービス マネジメントブック 改訂3版 　\n3.金銭の時間的価値：現在価値 P.140-141","source":"Excel: GMAP道場問題秋春(2).xlsx","no":333,"idx":333},{"id":"xlsx-2025春-ファイナンス-4","season":"2025春","subject":"ファイナンス","scope":"4. DCF法","question":"■問4.典型的なキャッシュフロー（永久年金、割増永久年金、年金）のうち、次の①～⑥に対応する資産価値の計算および説明として適切なものをA～Fから選択して下さい。\n　　　　　　　計算　　　説明　\n永久年金　　（　①　）（　④　）\n割増永久年金（　②　）（　⑤　）\n年金　　　　（　③　）（　⑥　）\n■資産価値の計算\nA.社債の現在価値の計算\nB.土地や耐用年数の十分長い不動産の計算\nC.成長が著しい新興企業価値の計算\n■説明\nD.毎年の受取額がある一定の割合で永久に増えていくキャッシュフロー\nE.一定額の受け取りが永久に続くキャッシュフロー\nF.ある一定の受け取りが特定期間続くキャッシュフロー","answer":"■正解：① B、② C、③ A、④ E、⑤ D、⑥ F\n\n■解説：\n各キャッシュフローに対する説明は記載の通り。\n現在価値の計算式はそれぞれ以下となる。\n永久年金　　：PV＝CF / r\n　　　　　　　毎年の受取額をCF、割引率をrとする\n割増永久年金：PV＝CF1 /（ r - g ）\n　　　　　　　１年目の受取額をCF1、キャッシュフローの成長率をg、割引率をrとする\n年金法　　　：PV＝CF / r ×［ 1 - 1 /（ 1 + r ）n乗］\n　　　　　　　毎年の受取額をCF、受取期間をn、割引率をrとする\n■出典：グロービス マネジメントブック 改訂3版 　\n4.DCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":334,"idx":334},{"id":"xlsx-2025春-ファイナンス-5","season":"2025春","subject":"ファイナンス","scope":"5.投資評価の様々な方法","question":"問5. あなたはある企業の財務担当者です。\n以下の3つの投資プロジェクトについて、投資判断を行う必要があります。\n各プロジェクトの初期投資額と5年間のキャッシュフローは以下の通りで、資本コストは10%とします。\n\n各プロジェクトのNPV（正味現在価値）とIRR（内部収益率）は以下の通りです。\nこれらの数値に基づき、どのプロジェクトに投資すべきか、理由とともに答えてください。\nA．プロジェクトA: NPV 1,372万円、IRR 15.24%\nB．プロジェクトB: NPV 1,405万円、IRR 13.40%\nC．プロジェクトC: NPV 2,059万円、IRR 13.55%","answer":"■正解：C\n■解説：\n投資判断について、\n・IRR（率）≧ハードル・レート\n・NPV（実数）＞0\nであれば、一般的には投資は妥当と判断ができます。\nどのプロジェクトに投資するかの判断のポイントは、IRR（率）だけでなくNPV（実数）も考慮することです。\nIRRは投資効率を示す指標ですが、投資額が小さいと、全体の利益額も小さくなります。\n今回のケースでは、NPVが最も高いプロジェクトCが、最も投資価値が高いと判断できます。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n5.投資評価の様々な方法 P.144-145","source":"Excel: GMAP道場問題秋春(2).xlsx","no":335,"idx":335},{"id":"xlsx-2025春-ファイナンス-6","season":"2025春","subject":"ファイナンス","scope":"4.DCF法","question":"■問6　A社の1年後の受取額(CF)は30億円で、2年目以降の成長率は4%で一定です。\n割引率を10％とすると、A社のキャッシュフローの現在価値はいくらですか？\n　\nA.　311億円\nB.　482億円\nC.　736億円\nD.　500億円","answer":"■正解：\nD.　500億円\n■解説：\n30/(10%-4%)=500億円\n割増永久年金でキャッシュフローを計算します。\n成長率をg、割引率をrとすると、\n現在価値=CF1/(r-g)\nとなります。\n■出典：グロービス マネジメントブック 改訂3版 　\n4．DCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":336,"idx":336},{"id":"xlsx-2025春-ファイナンス-7","season":"2025春","subject":"ファイナンス","scope":"6. 分散投資の効果⑴：ポートフォリオ理論","question":"■問7.分散投資の考え方について、誤っているものを全て選択してください。\nA.リスク資産に投資する際の投資リスクの大小を数値化するために、ファイナンスでは、予測される利回りの分布の平均を投資のリスクと定義する。\nB.ポートフォリオ全体の期待利回りは、個別資産の期待利回りをそれぞれの資産が投資全体に占める割合で重みづけした加重平均により求められる。\nC.相関係数は、2つの資産の利回りが互いにどのくらい関係して変動するかを測る尺度で、0～1の値をとる。\nD.2つのリスク資産のポートフォリオ組み入れ比率を考える際、両資産の利回りの相関係数が小さくなるほど、ポートフォリオのリスク低減効果は小さくなる。\n✽","answer":"■正解：A,C,D\n■解説：\nA：誤り\nリスク資産に投資する際の投資リスクの大小を数値化するために、ファイナンスでは、予測される利回りの分布の標準偏差を投資のリスクと定義する。\nB：正しい\nC：誤り\n相関係数は、2つの資産の利回りが互いにどのくらい関係して変動するかを測る尺度で、+1～-1の値をとる。相関係数の関係は、+1：完全な正の相関、0：無相関、-1：完全な負の相関、となる。\nD：誤り\n2つのリスク資産のポートフォリオ組み入れ比率を考える際、両資産の利回りの相関係数が小さくなるほど、ポートフォリオのリスク低減効果は大きくなる。\n■出典：グロービス マネジメントブック 改訂3版 　\n6.分散投資の効果⑴ポートフォリオ理論 P.146-147","source":"Excel: GMAP道場問題秋春(2).xlsx","no":337,"idx":337},{"id":"xlsx-2025春-ファイナンス-8","season":"2025春","subject":"ファイナンス","scope":"7．分散投資の効果（２）：効率的フロンティアと資本市場線","question":"■問８.分散投資の効果に関して、誤っているものを選択してください。\nA.複数のリスク資産によってポートフォリオを組むことでリスクは低減できるため、ポートフォリオに新しいリスク資産を次々加えれば、無限にリスクは低減できる\nB.資産の数を増やしても、除去できないリスクを「システマティック・リスク」という。システマティック・リスクは、景気などすべての資産に影響を与える原因により発生する\nC.投資家は、同じリスクであればより大きい利回りを期待できるポートフォリオを好むことから、効率的フロンティア線上にあるポートフォリオのいずれかを保有するとされる\nD.国債など、満期まで保有すれば一定の利回りがあらかじめ保証されている資産のことを、「無リスク資産」という。無リスク資産とリスク資産を組み合わせる場合、無リスク資産とマーケットポートフォリオを組み合わせるのが合理的である","answer":"■正解：A\n■解説：\nA.複数のリスク資産によってポートフォリオを組むことでリスクは低減できるが、ポートフォリオに新しいリスク資産を次々加えても、ある一定の値以下には下がらない。\n■出典：グロービス マネジメントブック 改訂3版 　\n7. 分散投資の効果（２）：効率的フロンティアと資本市場線 P.148-149","source":"Excel: GMAP道場問題秋春(2).xlsx","no":338,"idx":338},{"id":"xlsx-2025春-ファイナンス-9","season":"2025春","subject":"ファイナンス","scope":"8．分散投資の効果（3）：CAPM（資本資産価格モデル）","question":"■問9　誤っているのはどれか？\nA.マーケット・ポートフォリオのβは1と規定される。\nB.個別資産の期待利回りは、「無リスク資産の利回り+β×マーケット・リスク・プレミアム」で表すことができる。\nC.β＝1.5の個別資産は、市場全体の利回りが1%上昇した時、1.5%下落することが期待される。\nD.CAPMは「全投資家は将来に対してそれぞれ独自の予見を持つ」という前提がある。","answer":"■正解：CとDが誤り。\n■解説：\nA,B：正しい。\nC：誤り。βは市場全体（マーケット・ポートフォリオ）に対する感応度を示す。β＝1.5の資産はマーケット・ポートフォリオが1%上昇すると1.5%上昇することが期待される。\nβ＝－1.5の資産であれば、マーケット・ポートフォリオが1%上昇すると1.5%下落することが期待される。\nD：誤り。CAPMは「全投資家は将来に対して同一の予見を持つ」ことを前提としたモデルである。\n■出典：グロービス マネジメントブック 改訂3版 　\n8．分散投資の効果（3）：CAPM（資本資産価格モデル） P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":339,"idx":339},{"id":"xlsx-2025春-ファイナンス-10","season":"2025春","subject":"ファイナンス","scope":"８. 分散投資の効果(3)：CAPM ※計算問題","question":"■問10.CAPMに基づいて以下の場合のX社の株主期待利回りを計算してください。\n国債の利回り　2.0%\nβ（ベータ）1.5\nマーケット・ポートフォリオの期待利回り　8.0%","answer":"■正解：11.0%\n■解説：\n個別資産の期待利回りは、CAPMの計算式で求められる。\n個別資産の期待利回り＝無リスク資産の利回り＋β×（マーケット・ポートフォリオの期待利回り ー 無リスク資産の利回り）\nマーケット・ポートフォリオの期待利回りと無リスク資産の利回りの差を、マーケット・リスク・プレミアムと言う。\n■出典：グロービス マネジメントブック 改訂3版 　\n８. 分散投資の効果(3)：CAPM P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":340,"idx":340},{"id":"xlsx-2025春-ファイナンス-11","season":"2025春","subject":"ファイナンス","scope":"9. 企業の資金調達手段","question":"■問11.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Eのうちから選んでください。\n・ 一般に企業の資金調達方法は大きく2つに分類され、それは（ ① ）と（ ② ）である。\n・ （ ① ）は借入れのみではなく、社外の仕入れから、現金決済を一定期間猶予してもらうという形で資金を調達している（ ③ ）や（ ④ ）も含む。\n・（ ② ）は、資本金、法定準備金、（ ⑤ ）を含み、株主に帰属するべき持分の総称であり、いったん調達されると企業が存在する限り原則的に返済されることはない。\nA. ①負債　②株主資本　③社債　④余剰金（内部留保）　⑤買掛金\nB. ①負債　②株主資本　③買掛金　④支払手形　⑤余剰金（内部留保）\nC. ①株主資本　②負債　③買掛金　④支払手形　⑤社債\nD. ①株主資本　②負債　③買掛金　④余剰金（内部留保）　⑤社債\nE. ①株主資本　②負債　③社債　④支払手形　⑤買掛金","answer":"■正解：B\n■解説：\n（補足説明）\n・負債は返済もしくは決済期限を持っており、その期限までに債権者に対して返済されなければいけない。\n・企業が倒産した際には、負債の返済が優先される。\n■出典：グロービス マネジメントブック 改訂3版 　\n9.企業の資金調達手段 P.152-153","source":"Excel: GMAP道場問題秋春(2).xlsx","no":341,"idx":341},{"id":"xlsx-2025春-ファイナンス-12","season":"2025春","subject":"ファイナンス","scope":"10.資本コスト","question":"■問12.以下の資本コストに関する文章において、①～⑥に当てはまる適切なものをA～Fから選択して下さい。\n投資家は企業に、社債の購入、株式の投資という2つの方法により資金を提供する。社債の購入においては、投資家は（①）を要求する。一方、株式に投資する場合は、投資家は（②）を期待する。ちなみに、株式の方が社債よりリスクが（③）。\n（①）（②）は、企業側から見れば、資金調達に伴うコストとなるため、この場合、前者は（④）、後者は（⑤）と呼ばれる。\n企業は（④）と（⑤）を個別に知る以上に、資金を1円調達するのにいくらかかっているかを示す（⑥）に関心がある。ビジネスでは（⑥）以上の利回りを上げることができれば、（④）と（⑤）の両方をカバーできる。\nA.リスク・フリー・レート 、　B.低い、　C.高い\nD.利息、　E.マーケット・リスク・プレミアム、　F.株主資本コスト\nG.負債コストもしくは借入コスト、　H.株主期待利回り、　I.加重平均資本コスト(WACC)","answer":"■正解：①D.利息、②H.株主期待利回り、③C.高い、④G.負債コストもしくは借入コスト、⑤F.株主\n資本コスト、⑥I.加重平均資本コスト(WACC)\n■解説：\n投資家視点と企業視点では、同じファイナンス理論でも表現が異なる場合があります。その内容を出題\nいたしました。\n社債は毎年決まった額の利息が支払われますが、株式の場合は儲かることもあれば損することもあり、\n利回りは不安定なため、リスクは高いです。\n加重平均資本コスト(WACC)については、計算式とともに認識しておきましょう。\n社債：利息と負債コストもしくは借入コスト\n株式：株式期待利回りと株主資本コスト\n■出典：グロービス マネジメントブック 改訂3版 　\n10.資本コスト P.154-155","source":"Excel: GMAP道場問題秋春(2).xlsx","no":342,"idx":342},{"id":"xlsx-2025春-ファイナンス-13","season":"2025春","subject":"ファイナンス","scope":"10.資本コスト_ 計算問題（WACC）","question":"■問13. 税引き後のWACCで正しいものを選んでください。\n非上場のY社の株主からの期待収益率は15％です。一方、税引き前の有利子負債コストは7％、法人税率は40％です。以下の財務データを用いて加重平均資本コスト（WACC）を計算してください。\n(金額の単位：百万円)\n資産の部　　　　　　　　負債及び株主資本の部\n現金・預金　2,000　　　 買掛金　　　　 5,000\n売掛金　　　4,000　　　 長期借入金　 20,000　\n棚卸資産　 24,000　　　　株主資本（簿価）　　 20,000\n固定資産　 40,000　　　　株主資本（時価）　 25,000\nA：9.5％\nB：10.2％\nC：11.1％\nD：11.8％","answer":"■正解：B\n■解説：\nWACCの計算式は負債/(負債+株主資本)×借入れに対する利息(rD)×(1-税率)+株主資本/(負債+株主資本)×株主期待利回り(rE)です。\n以上より計算は20,000/(20,000+25,000)×7%×(1-40%)+25,000/(20,000+25,000)×15％\n=10.2%となります。\n負債は支払い利息の発生する有利子負債、株主資本は簿価ではなく時価ベースとなる点にご注意ください。\n■出典：グロービス マネジメントブック 改訂3版 　\n10．資本コスト P.154-155","source":"Excel: GMAP道場問題秋春(2).xlsx","no":343,"idx":343},{"id":"xlsx-2025春-ファイナンス-14","season":"2025春","subject":"ファイナンス","scope":"11. 株主資本コストの推定","question":"■問14.CAPMを利用した株主資本コストの推定方法について、誤っているものを選択してください。\nA.CAPMを利用して株式資本コストを推定するには、リスク・フリー・レート、マーケット・リスク・プレミアム、個別企業のβを用いる。\nB.リスク・フリー・レートは、無リスク資産の中でも預金金利の利回りを使うのが一般的である。\nC.マーケット・リスク・プレミアムは、過去の株式投資による利回りを見ながら決定されると考えられる。\nD.個別企業のβは、個別企業の株価と、市場全体の株価の動きの相関を求めることで推計する。","answer":"■正解：B\n■解説：\nリスク・フリー・レートは、無リスク資産の中でも「国債」の利回りを使うのが一般的であるため、「預金金利」ではないことから選択肢Bが誤りである。\n株主資本コストは投資家の期待利回りと言い換えることが出来る。株主が企業の発行する株式を購入するのは、株式投資からの期待利回りが、他の資産への投資を諦めても、経済合理性を持つ水準にある場合である。\n株式が価格変動を伴うリスクのある資産である以上、株式投資の期待利回りが、無リスク資産（国債）の利回り（＝リスク・フリー・レート）を上回っている（＝リスク・プレミアムがある）場合に投資家は株式を購入する判断を行う。\n株式資本コストはリスク・フリー・レート＋β×マーケット・リスク・プレミアムで求められる。\n■出典：グロービス マネジメントブック 改訂3版 　\n11.株主資本コストの推定 P.156-157","source":"Excel: GMAP道場問題秋春(2).xlsx","no":344,"idx":344},{"id":"xlsx-2025春-ファイナンス-15","season":"2025春","subject":"ファイナンス","scope":"12.市場の効率性","question":"■問 15. 効率的市場仮説について、正しい記述を一つ選びなさい。\nA. 効率的市場では、過去の株価データを利用することで、他の投資家以上の利益を恒常的に上げることができる。\nB. 効率的市場仮説とは、世の中にあるすべての情報に基づいても、恒常的に市場平均以上の利益を得ることはできないという考え方である。\nC. セミストロング・フォームの効率的市場では、公表されている情報に基づいて取引を行えば、常に利益を上げることができる。\nD. ストロング・フォームの効率的市場は、過去の株価情報のみが無関係であり、他の情報は利益に結びつく可能性がある。","answer":"■正解：B\n\n■解説：\n選択肢A：「過去の株価データを利用することで、他の投資家以上の利益を恒常的に上げることができる」とあるため、不正解です。\nウィーク・フォームの効率的市場では、過去の資産価格や収益率のデータに基づいた取引ルールでは恒常的に利益を上げられないと定義されています。つまり、過去のデータ分析によって、将来の株価を予測し、他の投資家以上の利益を得ることは不可能とされます（ざっくり言うと、「過去の株価の動きを見ても、常に他の投資家以上の利益を得ることはできない」）。\n選択肢C：「公表されている情報に基づいて取引を行えば、常に利益を上げることができる」とあるため不正解です。\nセミストロング・フォームの効率的市場では、世間に公開されている情報であれば何でも、その情報に基づいた取引ルールでは恒常的に利益を上げられないと定義されています。つまり、公開情報に基づいた分析や取引を行っても、市場平均を上回る利益を得ることはできないとされています（ざっくり言うと、「ニュースや会社の公開情報を見ても、常に他の投資家以上の利益を得ることはできない」）。\n選択肢D：「過去の株価情報のみが無関係であり、他の情報は利益に結びつく可能性がある」とあるため不正解です。\nストロング・フォームの効率的市場では、非公開情報を含むあらゆる情報を使っても、他の投資家以上の利益を恒常的に上げることはできないと定義されています。つまり、いかなる情報を用いても、市場平均を上回る利益を得ることはできないとされています（ざっくり言うと、「インサイダー情報などを使っても、常に他の投資家以上の利益を得ることはできない」）。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n12.市場の効率性 P.158-159","source":"Excel: GMAP道場問題秋春(2).xlsx","no":345,"idx":345},{"id":"xlsx-2025春-ファイナンス-16","season":"2025春","subject":"ファイナンス","scope":"13.企業の最適資本構成(1)：理論","question":"■問16　下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n企業価値を最大化するためには、どのような資本構成（負債と株主資本の構成比率）にすべきなのだろうか。1958年にフランコ・モジリアニとマートン・ミラーの2人が、最適資本構成について、「（①）においては、資本構成は企業価値に（②）」と示した。\nこの議論はMM命題と呼ばれ、「（③）は存在しない」などの特殊な前提の上に成り立ってはいるものの、いまでも企業の最適資本構成について考えるときのスタート地点となっている。\nA. ①完全市場　②影響を与える　③税制\nB. ①株式市場　②影響を与えない　③取引の自由\nC. ①完全市場　②影響を与えない　③税制\nD. ①不完全市場　②影響を与える　③取引の自由","answer":"■正解：C\n■解説：\nフランコ・モジリアニとマートン・ミラー、2人の名前からモジリアニ＝ミラーの命題（MM命題）と呼ばれるこの論証は、「企業の資本構成（負債と株主資本の構成比率）は企業価値に影響を与えない」ことを示しています。\nただ、MM理論は、特殊な前提の上に成り立っていることを理解しておく必要があります。重要な前提は、「完全市場」の下での話であるということです。では、「完全市場」とは何か？定義の一つに、「税制は存在しない」ということがあります。\nこの重要な前提を踏まえて、MM命題を振り返ると、「税制が存在しない完全市場の下では、企業の資本構成は企業価値に影響を与えない」となります。\n「税制は存在する」ことが前提といえる現在の社会では、「税制が存在しない」というのは特殊な前提ですね。\n■出典：グロービス マネジメントブック 改訂3版 　\n13.企業の最適資本構成(1)：理論 P.160-161","source":"Excel: GMAP道場問題秋春(2).xlsx","no":346,"idx":346},{"id":"xlsx-2025春-ファイナンス-17","season":"2025春","subject":"ファイナンス","scope":"14.企業の最適資本構成⑵：実際","question":"■問17.最適資本構成の考え方について、誤っているものを全て選択してください。\nA.資金調達を考える際、借入調達よりも資本調達の方がキャッシュフローが増加し、その現在価値である企業価値も増大する。\nB.実際の経営では、貸借対照表における負債と株主資本の構成比率が企業価値に影響を与えることはない。\nC.社債の発行利回りは、基本的に社債格付けに従って変動する。社債格付けと対象企業の負債比率との間には、強い相関が認められる。\nD.自社の格付けを低下させることは企業イメージや社員の士気低下に繋がるため、経営者としては、信用力を高めるためにも無借金経営とすることが望ましい。","answer":"■正解：A,B,D\n■解説：\nA：誤り\n資金調達を考える際、資本調達よりも借入調達の方が負債の節税効果により税金の支払いが減少してキャッシュフローが増加するため、その現在価値である企業価値も増大する。\nB. 誤り\n実際の経営では、企業価値は資本構成の影響を受ける。負債を増やせば節税効果により企業価値が高まる。但し、極端な負債の増大は倒産リスクが高まるため負債調達コストが上昇し、企業価値を減少させる。\nC.正しい\nD.誤り\n借入の節税効果を使わず必要以上に負債比率を低く抑えている経営者は、株主の目からみれば、株主の利益の最大化という使命を怠っているとみなされる可能性があることを考慮しておく必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n14.企業の最適資本構成⑵実際 P.162-163","source":"Excel: GMAP道場問題秋春(2).xlsx","no":347,"idx":347},{"id":"xlsx-2025春-ファイナンス-18","season":"2025春","subject":"ファイナンス","scope":"15．配当政策","question":"■問１８.経営者として考慮すべき配当政策の観点について、正しいものをすべて選択してください。\nA.経営者は、様々な問題を総合的に考慮し、株主に対して最大の利益をもたらす配当政策を決める必要がある。完全市場を想定した場合、株価が値上がりするよりも、より多くの配当で還元するほうが投資家の利益になる。\nB.日本では、上場株式の配当にかかる税率と、株式売却益にかかる税率は、その時々の政策や金額などによって異なる。そのため、個人投資家と法人投資家、大株主と小口株主など、だれの利益を最も重視するかによって配当政策は影響を受ける。\nC.企業の経営状況やその企業がもつ投資機会については、投資家の持つ情報のほうが経営者の持つ情報よりも多い。投資家が持つ情報は「シグナル」として経営者が投資家の考えを推測するために利用され、配当政策に影響を与える。\nD.配当を削減しても、株価にプラスに働くこともある。たとえば、魅力的な投資機会に恵まれた成長期のベンチャー企業が新規投資の為に配当削減を発表した場合、投資家はその企業の価値を見直し、株価が上がる可能性もある。","answer":"■正解：BとD\n■解説：\nA.誤り：\n企業の総価値から負債を引いたものが株主の持ち分だという前提に立つと、配当として支払われずに企業に残る内部留保も株主のものであるため、完全市場では、企業が利益を内部留保しても配当しても株主価値に違いを与えないと考えられる。つまり、税金のない完全市場では、配当をどれだけ支払うかの配当政策は株主価値に影響を与えないことになる。\nB.正しい：\n実際には選択肢Bに書かれているように、株式の配当にかかる税率と、キャピタル・ゲイン（株式売却益）にかかる税率は異なり、投資家の利益には税制が影響する。言い換えると、税金のある実際の世界では、配当と内部留保の価値には差が生じ、投資家によって望ましい配当政策が異なる。経営者はだれの利益を最も重視するか考慮して配当政策を決定する必要がある。\nC.誤り：\n企業の経営状況やその企業がもつ投資機会について、正しくは、企業経営者の持つ情報のほうが、投資家のもつ情報よりもはるかに多い。そのため投資家は配当政策を「シグナル」として、経営者の持つ情報を推測するために利用する。\nD.正しい：\n設問に書かれているように、配当を削減しても、株価にプラスに働くこともある。\n仮に、あるベンチャー企業が配当を削減した場合、それが新規投資の資金調達に不可欠な施策だと納得すれば、投資家はその企業の評価をポジティブに見直し、株価が上昇するかもしれない。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n15. 配当政策 P.164-165","source":"Excel: GMAP道場問題秋春(2).xlsx","no":348,"idx":348},{"id":"xlsx-2025春-ファイナンス-19","season":"2025春","subject":"ファイナンス","scope":"","question":"■問19.以下の選択肢のうち、正しいものはどれか。\nA.株価は日々の動きが重要であり、企業経営者が自社の株価の理論的な水準を知る必要は無い。\nB.理論株価を求める方法はキャッシュフロー割引モデルだけである。\nC.自社の株価が過大に評価されているときは、自社株式の買入消却を行った方がよい。\nD.ある企業が今後永久に年率g%で成長することが見込まれるとき、現在の理論株価は次の式で求める\nことができる。\n株価 = ( 今期末FCF / ( WACC - g ) - 負債 ) / 発行済み株式総数","answer":"■正解：D\n■解説：\nA：誤り。企業経営者にとって、短期的な株価の動きに惑わされず、長期的に株主資本価値をあげたり、\n機動的な財務戦略をとるために、自社の株価の理論的な水準を知っておくことは重要である。\nB：誤り。他に配当割引モデルなどがある。\nC：誤り。自社の株価が理論値よりも過大に評価されているときは、増資などして有利な資金調達が可\n能である。逆に過小に評価されているときには、自社株式の買入消却を行ったほうがよい。\nD：正しい。割増永久年金の公式で求める企業の理論株価である。\n■出典：グロービス マネジメントブック 改訂3版 　\n18.株式評価モデル P.170-171","source":"Excel: GMAP道場問題秋春(2).xlsx","no":349,"idx":349},{"id":"xlsx-2025春-ファイナンス-20","season":"2025春","subject":"ファイナンス","scope":"","question":"■問20. フリー・キャッシュフローについて下記文章中の（①）～（③）に入る語句の組み合わせとし\nて適切なものを選択肢A~Dのうちから選んでください。\nフリー・キャッシュフロー（FCF）とは、DCF法により企業価値を計算するときに使われるキャッシュ\nフローのことであり、以下の式で定義される。\nFCF＝EBIT（支払金利前税引前利益）X　 (1－法人税率)＋（①）－（②）－ΔWC\nΔWCはワーキング・キャピタル（WC）の（③）との差額（増加運転資本）である。\nA. ①減価償却費　②配当金　③翌年度\nB. ①金融収益　②投資　③前年度\nC. ①投資　②減価償却費　③翌年度\nD. ①減価償却費　②投資　③前年度","answer":"■正解：\nD. ①減価償却費　②投資　③前年度\n■解説：\nFCF＝EBIT（支払金利前税引前利益）X　 (1－法人税率)＋減価償却費－投資－ΔWC\nΔWCはワーキング・キャピタル（WC）の前年度との差額（増加運転資本）である。\nWCは、日々のビジネスを回すのに使われている資金の額を表し、以下のように定義される。\nWC＝（現金等価物を除いた）流動資産－（有利子負債を除いた）流動資産\nFCFの定義式でΔWCがマイナス項目として登場するのは、その分だけ資金調達が必要になるため。前\n年度に比べてWCの額が増加する場合、企業はその分を補うために新たに資金が必要になる。\n■出典：グロービス マネジメントブック 改訂3版 　\n16. フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":350,"idx":350},{"id":"xlsx-2025春-ファイナンス-21","season":"2025春","subject":"ファイナンス","scope":"","question":"■問21.企業価値の算出について、間違っているものを全て選択してください。\nA.企業価値の算定で、予測財務諸表を作成し、そこから求められるフリー・キャッシュフローとWACC\nから価値を算定する期間の価値を継続価値と呼ぶ。\nB.財務諸表上の企業の利益をもとにして、企業の価値を推定する際は、税引前利益を使うことが多い。\nC.利益から企業価値を算出する方法の1つにPER（株価収益率）があり、将来のPER予測を行う際は、\nPERを成熟・安定産業においては高めに、成長産業においては低めに見積もる必要がある。\nD.企業をいま解散するとして、資産を個別に洗い直して処分価値を合計したものから、負債を差し引い\nた金額を企業価値とする考え方を清算価値という。","answer":"■正解：A . B. C\n■解説：\nA.企業価値の算定で、予測財務諸表を作成し、そこから求められるフリー・キャッシュフローとWACC\nから価値を算定する期間「以降の」価値を継続価値と呼ぶ。\nB.財務諸表上の企業の利益をもとにして、企業の価値を推定する際は、一般的に企業利益として用いら\nれるのは、株主にとっての企業価値という観点から、負債に伴う金利等の費用や支払税を差し引いた\n「税引後利益」を使うことが多い。\nC.利益から企業価値を算出する方法の1つにPER（株価収益率）があり、将来のPER予測を行う際は、\nPERを「成長産業」においては高めに、「成熟・安定産業」においては低めに見積もる必要がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n17.企業価値の算出 P.168-169","source":"Excel: GMAP道場問題秋春(2).xlsx","no":351,"idx":351},{"id":"xlsx-2025春-ファイナンス-22","season":"2025春","subject":"ファイナンス","scope":"","question":"■問22.フリー・キャッシュフロー（FCF）とは、DCF法により企業価値を計算するときに使われる\nキャッシュフローのことである。以下の情報が分かっているときに、フリー・キャッシュフローを計算\nしてください。\nEBIT　　　　　　40億円\n減価償却費　　　10億円\n投資　　　　　　15億円\n今年度運転資本　20億円\n前年度運転資本　15億円\n法人税率　　　　40％\n※EBITは、支払金利前税引前利益です。","answer":"■正解：14億円\n■解説：\nFCF ＝ EBIT × （1 － 法人税率） ＋ 減価償却費 － 投資 － ΔWC\n※WCはワーキング・キャピタル、運転資本\n上記の式に与えられた数値を当てはめると、\nFCF ＝40億円 × （1 －40％） ＋ 10億円 － 15億円 － 5億円 ＝ 14億円\n※ΔWC（増加運転資本）＝今年度運転資本 － 前年度運転資本 ＝ 20億円 － 15億円\n■出典：グロービス マネジメントブック 改訂3版 　\n16.フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":352,"idx":352},{"id":"xlsx-2025春-ファイナンス-23","season":"2025春","subject":"ファイナンス","scope":"","question":"■問23.EVAの説明として、誤っているものを選択してください。\nA.EVAは当期利益から、調達資金にかかるすべての資本コストを差し引いたものを企業の真の利益（付\n加価値）として認識する。\nB.EVAは資本コスト支払い後の企業の付加価値を増大させ、ひいては株主価値を増加させようという考\nえ方である。\nC.EVAとFCFの違いは、EVAは「その年度の投下資本を全額控除する」のに対し、FCFは「総資本に\n対して当該期間に稼ぎ出すべき資本コストの率ではなく実額」を差し引く点である。\nD.EVAを経営指標にした場合、投資の多い年度のEVAはマイナスになる可能性があるため、大きな投\n資を先送りにする危険性がある。","answer":"■正解：A、C、D\n■解説：\nA. 誤り\nEVAは当期利益ではなく企業の純粋な営業活動による利益から、調達資金にかかるすべての資本コスト\nを差し引いたものを企業の真の利益（付加価値）として認識する。\nB.設問のとおり\nC. 誤り\nEVA とFCF の違いは、EVAは「総資本に対して当該期間に稼ぎ出すべき資本コストの率ではなく実\n額」を差し引くのに対し、FCFは「その年度の投下資本を全額控除する」点である。\nFCFとEVAの説明が逆になっているため、誤り。\nD. 誤り\nFCFを経営指標にした場合、投資の多い年度のFCFはマイナスになる可能性があるため、大きな投資を\n先送りにする危険性がある。\n■出典：グロービス マネジメントブック 改訂3版 　\n19.EVA P.172-173","source":"Excel: GMAP道場問題秋春(2).xlsx","no":353,"idx":353},{"id":"xlsx-2025春-ファイナンス-24","season":"2025春","subject":"ファイナンス","scope":"","question":"■問24.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちか\nら選んでください。\n・オプションとは、ある資産（株式や債券など）を将来定められた時点（行使期限）に一定の価格（行\n使価格）で売買出来る権利のことである。オプション保有者にはそれを行使する権利があり、義務が\n（①）。\n・オプションの保有者（買い手）はオプションが行使できればリスクなしで必ず利益を上げられる。当\n然ながらオプションの相手方（売り手）は何らかの対価なしには取引に応じるはずがない。この対価を\n「プレミアム」という。\n・オプションには大きく分けて、コール・オプションとプット・オプションの2種類がある。プット・\nオプションは買い手が資産を（②）権利を持ち、売り手は資産を（③）義務を負う。\n・プット・オプションの場合、資産価格が行使価格よりも（④）していれば、時価よりも（⑤）売れる\nのでオプションを行使して利得を確保する。\nA. ①ある　②買う　③売る　④上昇　⑤低く\nB. ①ない　②売る　③買う　④下落　⑤高く\nC. ①ある　②売る　③買う　④下落　⑤高く\nD. ①ない　②買う　③売る　④上昇　⑤低く","answer":"■正解：B\n■解説：\n・オプションは資産価格に対する保険のようなものであり、オプションの保有者にはそれを行使する権\n利はあるが、義務は無い。\n・オプションには、コール・オプション、プット・オプションの2種類があり、それぞれの種類/売買と\n取引内容の関係は以下となる。\n　コール：（買い手）資産を買う権利を持つ、（売り手）資産を売る義務を負う\n　プット：（買い手）資産を売る権利を持つ、（売り手）資産を買う義務を負う\n・オプションからの利得（ペイオフ）は、オプション行使時のオプション対象資産の価格によって決ま\nる。コールは「買う権利」なので、資産価値（時価）が行使価格（買う権利）よりも上昇していれば、\n時価よりも安く買えるので（資産価格＞行使価格）、オプションを行使して利得を確保する（時価が行\n使価格以下の場合はオプションを行使しない）。\n反対に設問のプットの場合は「売る権利」なので、資産価値（時価）が行使価格（売る権利）よりも下\n落していれば、時価よりも高く売れるので（資産価格＜行使価格）、オプションを行使して利得を確保\nする（時価が行使価格以上の場合はオプションを放棄する）。\n■出典：グロービス マネジメントブック 改訂3版 　\n20．オプション理論の基礎 P.174-175","source":"Excel: GMAP道場問題秋春(2).xlsx","no":354,"idx":354},{"id":"xlsx-2025春-ファイナンス-25","season":"2025春","subject":"ファイナンス","scope":"","question":"■問25. なでしこ動物園のアフリカ象は子供達にとても人気で、年間5,000万円の収益を生み出してい\nます。しかし、16年目に南アフリカ共和国に返還されることが決まっています。割引率を5%として、\nこのアフリカ象が生み出す資産価値を計算してください。\n※15年目のDF（ディスカウント・ファクター）は0.48を使用してください。\n※アフリカ象が長く生きると仮定して永久年金法を使って計算してください。","answer":"■正解：5億2,000万円\n■解説：年金法の公式、PV = CF / r * (1 - (1 / (1 + r)^n)) を使用して求めます。\nこの公式の意味するところは、アフリカ像が永久に生み出す価値①から、16年目以降に永久に生み出\nす価値②を差し引き、15年間の価値を求めています。\n1.アフリカ象が永久に生み出す価値\n永久年金法を使用し算出します（年間収益 / 割引率）\n　　5,000万円 / 5% = 10億円・・・①\n2.16年目以降、永久に生み出す価値\n16年目を起点に、同じく永久年金法で価値を求めます\nこの価値は16年目に発生するので、15年目のDFを使って現在価値に割り戻します。15年目のDFを\n使用するのは、16年目が計算上のYr.1（15年目がYr.0）になるためです。\n　　10億円（5,000万円/5%）×0.48 = 4億8,000万円・・・②\n3.アフリカ象の資産価値を計算する・・・① - ②\n　　10億円 ? 4億8,000万円 = 5億2,000万円\nよって年金法の公式、PV = CF / r * (1 - (1 / (1 + r)^n)) は以下のように分解できます。\n　　アフリカ象の価値＝永久年金法の価値 ×（1 - DF）\nなお、実際のGMAPの試験では、計算に使用するディスカウント・ファクターを下記一覧表から参照す\nる必要のある問題が出されますのでDF一覧表の見方には慣れておきましょう！\n■出典：グロービス マネジメントブック 改訂3版 　\n4．DCF法 P.142-143","source":"Excel: GMAP道場問題秋春(2).xlsx","no":355,"idx":355},{"id":"xlsx-2025春-ファイナンス-26","season":"2025春","subject":"ファイナンス","scope":"","question":"■問26　投資ファンドは、広く資金を集めて企業へ投資し、企業再生や育成、分割などを行って（①）\nを向上させたうえで、売却益による利益獲得を狙う。あるいは、投資のあてがないにもかかわらず必要\n以上の現金を保有している企業に（②）を迫る。\n　再生ファンドの再生案件では、B/S（貸借対照表）の（③）だけでなく、P/L（損益計算書）の改善が\n大きな命題となる。\n　一方、清算型の投資回収を行うハゲタカファンドは、P/L改善の優先順位は低く、資産価値の評価と\n資産の付加価値向上が主眼となる。\nA. ①社員のモチベーション　②増配　③圧縮\nB. ①社員のモチベーション　②経営者の退陣　③伸張\nC. ①企業価値　②経営者の退陣　③伸張\nD. ①企業価値　②増配　③圧縮","answer":"■正解：\nD\n■解説：\n投資ファンドは、近年、「モノ言う株主」として、企業活動や経済に大きな影響を与えている。方法論\nは様々だが、共通しているのは経営への積極的な介入による高いリターンの追求である。その影響も\nあって、経営者は常に「企業価値」の最大化を迫られるようになっている。\n再生ファンドは、資金や経営陣を投入することで会社の再建を図り、株式公開や事業売却の形で資金回\n収を図るファンド。徹底したコストカット、製品ラインの絞り込み、従業員のリストラなどコスト削減\nを進めるとともに、売上拡大を図ることがファンドから送り込まれた経営陣の腕の見せ所となる。\n■出典：グロービス マネジメントブック 改訂3版 　\n22．投資ファンド P.178-179","source":"Excel: GMAP道場問題秋春(2).xlsx","no":356,"idx":356},{"id":"xlsx-2025春-ファイナンス-27","season":"2025春","subject":"ファイナンス","scope":"","question":"■問27.資金調達の40％を負債、60％を株主資本に依存している企業があるとします。平均負債コスト\nが3％、株主資本コストが8％、法人税率が30％とするとき、この企業のＷＡＣＣ（加重平均資本コス\nト）を以下の中から一つ選んでください。\nＡ4.02％\nＢ4.46％\nＣ5.64％\nＤ6.00％","answer":"■正解：Ｃ\n指定された条件のＷＡＣＣは以下のように求められる。\nＷＡＣＣ＝0.4×3％×（1-0.3）+0.6×8％＝5.64％\n■解説：\nＷＡＣＣ（Weighted Average Cost of Capital）＝Ｄ／（Ｄ＋Ｅ）×ｒＤ×（1-税率）+Ｅ／（Ｄ＋\nＥ）×ｒＥ\n*Ｄ：負債、Ｅ：株主資本、ｒＤ：負債コスト、ｒＥ：株主資本コスト\n■出典：グロービス マネジメントブック 改訂3版 　\n10.資本コスト P.154-155","source":"Excel: GMAP道場問題秋春(2).xlsx","no":357,"idx":357},{"id":"xlsx-2025春-ファイナンス-28","season":"2025春","subject":"ファイナンス","scope":"","question":"■問２８.国債の利回りが1.1％、マーケット・リスク・プレミアムが4.0％という条件のとき、CAPM\nを用いてベータ（β）の値が1.5の会社の株式の期待利回りを求めるとします。以下のうち最も適切な\n値を1つ選んでください。\nA: 5.65％\nB: 6.60％\nC: 7.10％\nD:10.40％","answer":"■正解：Ｃ\n指定された条件の株式の期待利回り（R）は以下のようになる\nR＝1.1％+ 1.5 × 4.0％＝7.10％\n■解説：\n「ＣＡＰＭ(Capital Asset Pricing Model)」（資本資産価格モデル）とは、個別リスク資産の期待利回\nりを計算するために広く使われる定量化のモデル\n個別資産の期待利回り\n＝リスク・フリー・レート　+　ベータ　×　マーケット・リスク・プレミアム\n＝無リスク資産の利回り+β×（マーケット・ポートフォリオの期待利回り－無リスク資産の利回り）\n■出典：グロービス マネジメントブック 改訂3版 　\n8.分散投資の効果(3)：CAPM（資本資産価格モデル） P.150-151","source":"Excel: GMAP道場問題秋春(2).xlsx","no":358,"idx":358},{"id":"xlsx-2025春-ファイナンス-29","season":"2025春","subject":"ファイナンス","scope":"","question":"■問29. 法人税率が40％であるとき、20X1年のフリー・キャッシュフロー（FCF）を求めてください。\n営業外損益は無いものとします。\n(金額の単位：百万円)\n　　　　　　　　　20X0年　　 20X1年\n営業利益　　　　　110　　　　150\n減価償却費　　　　20　　　　 30\n投資　　　　　　　40　　　　 80\n運転資金　　　　　50　　　　 80","answer":"■正解：10（百万円）\n■解説：フリー・キャッシュフロー（FCF）は以下のように定義される。\nFCF＝EBIT（支払金利前税引前利益）×（1-法人税率）+減価償却費-投資-⊿WC\n⊿WCは運転資金（WC）の前年度からの増減である。\nしたがって、20X1年のFCFは、以下の式で求めることができる。\nFCF＝150×（1-0.4）+30-80-（80-50）＝10\n■出典：グロービス マネジメントブック 改訂3版 　\n16．フリー・キャッシュフロー P.166-167","source":"Excel: GMAP道場問題秋春(2).xlsx","no":359,"idx":359},{"id":"xlsx-2025春-ファイナンス-30","season":"2025春","subject":"ファイナンス","scope":"","question":"■問30.企業買収防衛策に関する以下の文章中の（①）～（③）に入る語句の組み合わせとして適切な\nものを選択肢A~Dのうちから選んでください。\nポイズン・ピル：既存の株主に対して（①）を発行し、敵対的買収者が一定の議決権割合を取得した時\n点で、市場価格より（②）価格で株式を引き受けられるようにする。これにより、敵対的買収者が株式\nを買い増したとき、買収者の（③）を下げることができる。また株式の価値を下げ、買収費用を上げる\nことで買収意欲を削ぐ効果が期待できる。\nA. ①社債　②高い　③投資効率\nB. ①新株予約権　②安い　③議決権割合\nC. ①社債　②安い　③投資効率\nD. ①新株予約権　②高い　③議決権割合","answer":"B. ①新株予約権　②安い　③議決権割合\n■解説：\n株式の持ち合い解消に伴う安定株主の比率の低下や経済合理的な行動をとる機関投資家の持株比率の増\n加等の背景により、近年日本においても企業買収防衛策に通じておくことが重要になっている。\n　\n代表的な対抗策としては、設問のポイズン・ピルのほか以下のものがある。\n・クラウン・ジュエル\n　敵対的買収者が最も欲しい資産・事業を売却することで買収意欲を削ぐ。\n・ゴールデンパラシュート\n　被買収企業の取締役が敵対的買収者により解任・退任される等一定の条件に達した場合、取締役に巨\n額の退職金が支払われるという契約を事前に締結しておく。\n・ホワイト・ナイト\n　敵対的買収者からの買収を阻止するために、被買収企業が友好的な別の買収者と買収または合併につ\nいて合意するケースがある。この友好的な買収者のことを「ホワイト・ナイト（白馬の騎士）」と呼ぶ。\n・マネジメント・バイ・アウト\n　経営陣が自社の株式を取得して、非公開企業とすること。非公開企業にすることで、自由な株式の取\n得ができなくなる。\n■出典：グロービス マネジメントブック 改訂3版 　\n21. 企業買収防衛策 P.176-177","source":"Excel: GMAP道場問題秋春(2).xlsx","no":360,"idx":360},{"id":"docx-2026春-ファイナンス-5353f74b","season":"2026春","subject":"ファイナンス","scope":"21. 企業買収防衛策","question":"2026年5月2日（土）＜ファイナンス＞\n出題範囲：21. 企業買収防衛策\n　\n■問30.企業買収防衛策について、誤っているものを全て選択してください。\n　\nA. ポイズン・ピル：敵対的買収者が一定の議決権割合を取得した際、既存株主が保有する株式を市場価格よりも高い価格で企業が買い取るようにすることで、買収コストを引き上げる手法。\n　\nB. クラウン・ジュウェル：敵対的買収社が最も欲しがっている資産や事業を売却することで、買収意欲をそぐ手法。\n　\nC. ゴールデン・パラシュート：敵対的買収が発生した際、被買収企業の全従業員に対して多額の特別手当や退職金を支払う契約をあらかじめ締結しておくことで、買収後の人件費負担を増大させ、買収を断念させる手法。\n　\nD. ホワイト・ナイト：被買収企業の経営陣と合意のうえで、友好的に買収または合併を行う会社。被買収企業が友好的な買収者を自ら選択することで、敵対的買収者からの買収を避けることが狙い。\n　\nE. マネジメント・バイ・アウト：経営陣が自社の株式を取得して、非公開企業としてしまうこと。","answer":"■正解：A, C\n　\n■解説：\n・ポイズン・ピル：「市場価格より安い価格」で株式を引き受けられるようにすることで、敵対的買収者が株式を買い増したとき「買収者の議決権割合を下げる」ことが出来ます。\n　\n・ゴールデン・パラシュート：全従業員ではなく、巨額の退職金が「取締役」に支払われるという委任契約をあらかじめ締結しておくことで、敵対的買収を行うと巨額の損失が発生するようにしておくことで、敵対的買収者の買収意欲をそぐことを意図しています。\n　\n■出典：グロービス マネジメントブック 改訂3版\n21．企業買収防衛策 P.176-177","source":"Word: GMAP道場2026春 (1)(1).docx","no":361,"idx":361},{"id":"docx-2026春-ファイナンス-e8be0f64","season":"2026春","subject":"ファイナンス","scope":"16.フリー・キャッシュフロー","question":"2026年5月2日（土）＜ファイナンス＞\n出題範囲：16.フリー・キャッシュフロー\n■問29.ΔWCを踏まえたフリー・キャッシュフロー（FCF）で正しいものを選んでください。\nN社のEBITは1,800百万円、法人税率は35％です。減価償却費は300百万円、設備投資は500百万円でした。\nまた、前年度末と今年度末の財務データは以下の通りです。\nWCは、(現金等価物を除いた)流動資産 － (有利子負債を除いた)流動負債で計算してください。\n（金額の単位：百万円）\n【前年度末】\n現金・預金　   500\n売掛金　　　1,600\n棚卸資産　　2,000\n買掛金　　　1,100\n短期借入金　   700\n【今年度末】\n現金・預金　   700\n売掛金　　　1,900\n棚卸資産　　2,300\n買掛金　　　1,200\n短期借入金　   900\nFCF ＝ EBIT ×（1－法人税率）＋減価償却費－投資－ΔWC\nA：340百万円\nB：470百万円\nC：640百万円\nD：970百万円","answer":"■正解：\nB：470百万円\n■解説：\nまず前年度末WCを計算する。\n前年度末WC＝（売掛金1,600＋棚卸資産2,000）－買掛金1,100\n＝3,600－1,100＝2,500\n次に今年度末WCを計算する。\n今年度末WC＝（売掛金1,900＋棚卸資産2,300）－買掛金1,200\n＝4,200－1,200＝3,000\nしたがって、ΔWC＝3,000－2,500＝500\n次にFCFを計算する。\nFCF＝1,800×（1－35％）＋300－500－500\n＝1,800×0.65＋300－500－500＝1,170＋300－5
