<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMAP問題集｜PC版</title>
<style>
:root{--main:#1f4e79;--soft:#eef5fb;--bg:#f7fafc;--text:#172033;--muted:#667085;--line:#d7e2ec}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}button,input,select{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:10px}
.header{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 2px 10px rgba(31,78,121,.05)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:800;color:var(--main);font-size:20px}.counter{color:var(--main);background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
.subject-rates{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:8px;margin-top:7px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.subject-rates::-webkit-scrollbar{display:none}
.subject-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 9px;min-width:170px}.subject-card.current{background:var(--soft);border-color:var(--main)}
.subject-name{color:var(--main);font-weight:800;font-size:12px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subject-metrics{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:10px}.subject-metrics b{color:var(--main);font-size:12px}.bar{height:5px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:4px}.subject-card.current .bar{background:#fff}.bar>i{display:block;height:100%;width:0;background:var(--main);border-radius:999px}.bar.progress>i{opacity:.45}
.workspace{min-height:0;display:grid;grid-template-columns:250px 1.25fr .82fr 68px;gap:8px}
.side,.panel,.actions{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(31,78,121,.04)}.side{padding:10px;overflow:auto}.side h3{margin:0 0 8px;color:var(--main);font-size:15px}label{display:grid;gap:4px;color:var(--muted);font-size:12px;margin-bottom:8px}select,input[type="search"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--text)}
.shortcut{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.7;background:var(--soft);border-radius:12px;padding:8px}.shortcut b{color:var(--main)}
.panel{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;color:var(--main);font-size:16px}
.question-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge,.q-metric{color:var(--main);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.meta{display:flex;gap:5px;margin:0 0 5px;overflow:hidden}.meta span{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{min-height:0;overflow:hidden;padding:10px 13px}.question,.answer{white-space:pre-wrap;word-break:break-word;overflow:hidden}.placeholder{color:var(--muted);background:var(--soft);border-radius:14px;padding:14px;line-height:1.6}
#answerPanel.hidden .answer{display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
.actions{display:grid;align-content:center;gap:14px;padding:8px}.actions button,.side button{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:14px;padding:10px 6px;font-weight:800;font-size:13px}.actions button.primary,.side button.primary{background:var(--main);color:#fff}.actions button.status-on{background:var(--main);color:#fff;box-shadow:inset 0 0 0 2px var(--main);}.side-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.side-buttons #btnApply{grid-column:1 / -1;background:var(--main);color:#fff}.side-buttons #btnList{grid-column:1 / -1}
.list{display:none;gap:6px;margin-top:8px;max-height:32vh;overflow:auto}.list.open{display:grid}.list button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 8px;color:var(--text);font-size:12px}.list button.current{border-color:var(--main);background:var(--soft);color:var(--main);font-weight:800}.list button.correct{border-left:6px solid var(--main)}.list button.wrong{border-left:6px solid #778899}.list button.review{outline:2px solid var(--main)}
.error{display:none;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:7px 9px;font-size:12px;margin-top:6px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:rgba(23,32,51,.88);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}
.drawer{display:block}

.lowrate-mark {
  color:#fff;
  background:var(--main);
  border-radius:999px;
  padding:2px 7px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.lowrate-card {
  box-shadow:inset 0 0 0 2px var(--main);
}
.list button.lowrate {
  background:var(--soft);
  border-color:var(--main);
}


.bottom-list{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(23,32,51,.22);display:none;grid-template-rows:auto 1fr;max-height:36dvh;overflow:hidden}
.bottom-list.open{display:grid}
.bottom-list-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--main)}
.bottom-list-head button{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:999px;padding:6px 12px;font-weight:800}
#bottomListBody{display:grid;gap:6px;overflow:auto;padding:10px;max-height:none;margin:0}


.actions button,
.front-actions button {
  white-space:nowrap;
  word-break:keep-all;
  overflow-wrap:normal;
}


.actions {
  width:76px;
}
.actions button {
  font-size:12px !important;
  letter-spacing:-0.04em;
  white-space:nowrap;
  word-break:keep-all;
  overflow-wrap:normal;
}


.lowrate-mark {
  color:#b42318 !important;
  background:#fff1f0 !important;
  border:1px solid #f04438 !important;
  border-radius:999px;
  padding:2px 8px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}
.list button.lowrate {
  background:#fff1f0 !important;
  border-color:#f04438 !important;
  color:#b42318 !important;
  font-weight:800;
}
.list button.lowrate::before {
  content:"低正答率 ";
  color:#b42318;
  font-weight:900;
}
#bottomListBody button.lowrate {
  background:#fff1f0 !important;
  border-color:#f04438 !important;
  color:#b42318 !important;
  font-weight:800;
}
#bottomListBody button.lowrate::before {
  content:"低正答率 ";
  color:#b42318;
  font-weight:900;
}


.subject-card {
  cursor:pointer;
  touch-action:manipulation;
}
.subject-card:active {
  transform:scale(.98);
}
.subject-card.current::after {
  content:"選択中";
  display:inline-block;
  margin-top:4px;
  color:#fff;
  background:var(--main);
  border-radius:999px;
  padding:2px 7px;
  font-size:10px;
  font-weight:800;
}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="topline"><div class="title">GMAP問題集｜PC版</div><div class="counter" id="pos">0 / 0</div></div><div class="subject-rates" id="subjectRates"></div><div class="error" id="error"></div></header>
<main class="workspace" id="stage">
<aside class="side drawer" id="drawer"><h3>絞り込み</h3>
<label>科目<select id="subjectFilter"></select></label><label>出題範囲<select id="scopeFilter"></select></label><label>状態<select id="statusFilter"><option value="all">すべて</option><option value="unanswered">未回答のみ</option><option value="correct">正解のみ</option><option value="wrong">不正解のみ</option><option value="review">復習のみ</option><option value="lowrate">正答率が低い問題</option></select></label><label>検索<input id="search" type="search" placeholder="キーワード検索"></label>
<div class="side-buttons"><button id="btnApply">表示</button><button id="btnList">一覧</button><button id="btnExport">記録保存</button><button id="btnClear">記録削除</button></div><div class="list" id="list"></div>
<div class="shortcut"><b>Space</b> 答え表示　<b>←/→</b> 前後<br><b>1/2</b> 正解/不正解　<b>R</b> 復習<br><b>L</b> 一覧</div>
</aside>
<section class="panel"><div class="panel-head"><h2>問題</h2><div class="question-status"><span class="badge" id="statusLabel">未回答</span><span class="q-metric" id="questionMetric">回答 0回｜正答率 -</span></div></div><div class="content" id="qBox"><div class="meta" id="meta"></div><div class="question" id="qText">問題を読み込み中です。</div></div></section>
<section class="panel hidden" id="answerPanel"><div class="panel-head"><h2>答え・解説</h2><span class="badge" id="answerLabel">非表示</span></div><div class="content" id="aBox"><div class="answer" id="aText"><div class="placeholder">Spaceキーで答え・解説を表示します。</div></div></div></section>
<nav class="actions"><button id="btnCorrect">正解<br>1</button><button id="btnWrong">不正解<br>2</button><button id="btnReview">復習<br>R</button></nav>
</main></div>

<section class="bottom-list" id="bottomList">
  <div class="bottom-list-head">
    <strong>問題一覧</strong><button type="button" id="btnCloseList">閉じる</button>
  </div>
  <div class="list open" id="bottomListBody"></div>
</section>

<script id="quiz-json" type="application/json">[{"id":"xlsx-2025秋-マーケティング-1","season":"2025秋","subject":"マーケティング","scope":"1.マーケティングの発想","question":"出題範囲：1.マーケティングの発想\n\n■問01.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n(①)の目的は今日の売上げを確保することにあるので、短期志向に陥りやすい。\n\n(②)の目的は継続的な成長だ。顧客を、企業に長く利益をもたらす存在として、より長期的な関係の中でとらえる必要がある。\n\n(③)とは、衣食住などの生理的なことから、社会的、文化的、個人的なことに至るさまざまな事柄に対して人間が感じる「満たされない状態」のことだ。\n\n(④)は、(③)を満たすために製品化されたものを求める感情、つまり「具体的な製品やサービスへの欲求」のことである。\n\nA. ウォンツ\n\nB. ニーズ\n\nC. セリング\n\nD. マーケティング","answer":"■正解：\n\n①C. セリング ②D. マーケティング ③B. ニーズ ④A. ウォンツ\n\n■解説：\n\nセリングの目的は今日の売上げを確保することにあるので、短期志向に陥りやすい。\n\nマーケティングの目的は継続的な成長だ。顧客を、企業に長く利益をもたらす存在として、より長期的な関係の中でとらえる必要がある。\n\nニーズとは、衣食住などの生理的なことから、社会的、文化的、個人的なことに至るさまざまな事柄に対して人間が感じる「満たされない状態」のことだ。\n\nウォンツは、ニーズを満たすために製品化されたものを求める感情、つまり「具体的な製品やサービスへの欲求」のことである。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n1.マーケティングの発想 P.48 - P.49","source":"Excel: GMAP道場問題秋春(2).xlsx","no":1,"idx":1},{"id":"xlsx-2025秋-マーケティング-2","season":"2025秋","subject":"マーケティング","scope":"2. マーケティングの役割","question":"出題範囲：2. マーケティングの役割\n\n■問２.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n・企業は(①)という枠組みの中で、外部環境と自社の経営資源から戦略を策定していくが、外部環境の中で最も重要な要素の一つは(②)である。\n\n・(②)の変化を踏まえて企業の進むべき方向性を見出し、経営戦略や事業活動に落とし込んでいく役割をはたすのが(③)である。\n\n・（③）は(④)の期待を明確化し、ニーズの充足を保証するために、企業内のさまざまな機能を統合する役割を持っている 。\n\nA. ①経営戦略　②競合の数　③マーケティング　④株主\n\nB. ①経営戦略　②市場環境　③リーダーシップ　④顧客\n\nC. ①経営理念　②市場環境　③マーケティング　④株主\n\nD. ①経営理念　②市場環境　③マーケティング　④顧客","answer":"■正解：D\n\n■解説：\n\n・企業は経営理念という枠組みの中で、外部環境と自社の経営資源から戦略を策定していくが、外部環境の中で最も重要な要素の一つは市場環境である。\n\n﻿・市場環境の変化を踏まえて企業の進むべき方向性を見出し、経営戦略や事業活動に落とし込んでいく役割をはたすのがマーケティングである。\n\n・マーケティングは顧客の期待を明確化し、ニーズの充足を保証するために、企業内のさまざまな機能を統合する役割を持っている 。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n2．マーケティングの役割 P.50-51","source":"Excel: GMAP道場問題秋春(2).xlsx","no":2,"idx":2},{"id":"xlsx-2025秋-マーケティング-3","season":"2025秋","subject":"マーケティング","scope":"3. マーケティング・マネジメント","question":"出題範囲：3. マーケティング・マネジメント\n\n■問3.マーケティング戦略立案の流れを早い順に並べなさい。\n\nA.　マーケティング施策の実行と評価\n\nB.　マーケティングミックス（４P）\n\nC.　ポジショニング\n\nD. 　セグメンテーション（市場細分化）\n\nE.　マーケティング環境分析と市場機会の発見\n\nF.　ターゲティング（標的市場の選定）","answer":"■正解：E→D→F→C→B→A\n\n■解説：\n\nマーケティングの観点からビジネスを構築して行くためのプロセスは6つのステップに大別される。（マーケティング戦略立案の流れ）\n\n・マーケティング環境分析と市場機会の発見\n\n・セグメンテーション（市場細分化）\n\n・ターゲティング（標的市場の選定）\n\n・ポジショニング\n\n・マーケティングミックス（４P)\n\n・マーケティング施策の実行と評価\n\nこのプロセスは必ずしも一方方向ではなく、行きつ戻りつすることもある。実際には制約条件などにより、どれか動かせない要素があるため、遡って整合性をとることも多い。　有効なマーケティング活動を行うにはプロセスを理解し、それを効果的に進めるための組織運営が必要である。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n3．マーケティング・マネジメント P.52-53","source":"Excel: GMAP道場問題秋春(2).xlsx","no":3,"idx":3},{"id":"xlsx-2025秋-マーケティング-4","season":"2025秋","subject":"マーケティング","scope":"4. 市場の機会の発見","question":"2025年9月15日（月）＜マーケティング＞\n\n出題範囲：4. 市場の機会の発見\n\n■問4.マーケティングの環境分析について、誤っているものを選択してください。\n\nA.マーケティング環境の分析では、自社ではコントロールできない外部環境と、コントロール可能な内部環境を見る。外部環境では、マクロ環境、市場（顧客）、競合について、内部環境では自社の経営資源や強みと弱みなどを明らかにする。\n\nB.市場の機会と脅威は通常、外部環境から導かれる。しかし、他社の機会が必ずしも自社にとっても好機であるとは限らない。一般的な市場の機会に自社の強みが合致したときに、自社にとっての機会が生み出される。\n\nC.ある事象を発見したとき、企業はそれをすぐに「脅威」と考えるのではなく、これを「機会」にできないだろうかと問う姿勢が大切である。そうした頭の切り替えができるか否かは、日頃から環境変化に注意し、準備をしているかどうかにかかっている。 \n\nD.視点を変えることによって一見短所と思われる特徴を長所に転じさせた例は少ない。自社にとっての市場の機会とは、発見した事実の中に「ある」ものであり、その事実をどうとらえるかによって「創り出される」ものではない。","answer":"■正解：Ｄのみ誤り\n\n■解説：\n\n自社にとっての市場の機会とは、「他社にない強みを発揮できる舞台」を指します。環境分析を行い、他社に対して競争優位を発揮できるような市場機会を創造的に発見することが重要です。\n\n「自社の強みと弱み」をもう一度見直すことで、「弱み」だと思っていたことが、大きな「強み」に転じることがあります。\n\n選択肢Dは、「視点を変えることによって一見短所と思われる特徴を長所に転じさせた例は多い。自社にとっての市場の機会とは、発見した事実の中にあるものではなく、その事実をどうとらえるかによって創り出されるものである」が正しいです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4．市場の機会の発見 P.54-55","source":"Excel: GMAP道場問題秋春(2).xlsx","no":4,"idx":4},{"id":"xlsx-2025秋-マーケティング-5","season":"2025秋","subject":"マーケティング","scope":"","question":"■問5.マーケティング・リサーチに関する説明として誤っているものを選択してください。\n\nA.マーケティングでは市場調査やシェア分析、製品選好分析、販売予測、広告効果分析など、目的別にさまざまなリサーチが行われる。\n\nB.リサーチのプロセスは通常、❶リサーチ目的の設定、❷リサーチの設定と実施、❸仮説の設定、❹仮説の検証という手順で行われる。\n\nC.リサーチに使われるデータには、新聞などで一般に公開されているデータのように他の目的のために収集された「２次データ」と、特定の目的のために収集する「１次データ」がある。２次データは比較的容易に入手できるため、情報収集に要する時間と費用が節約できる。しかし、別の目的で作成されているため、必要な情報がすべて手に入るとは限らない。\n\nD.定量リサーチでは１つの変数だけを単独で分析するのではなく、それらの相関について分析する場合が多く、簡単な表計算ソフトが最低限必要である。","answer":"■正解：Bのみ\n\n■解説：\n\nリサーチは通常、❶リサーチ目的の設定、❷仮説の設定、❸リサーチの設計と実施、❹仮説の検証という手順で行われる。\n\nリサーチでは、現状から考えられる仮説と予測される結果を必ず事前に考え、調査結果との違いを評価する、仮説検証型のアプローチが望ましい。とりあえず手に入るデータを集めて、そこから最終結論を導く方法は、無駄が多く誤った結論を得る可能性が高い。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n5.マーケティング・リサーチ P.56-57","source":"Excel: GMAP道場問題秋春(2).xlsx","no":5,"idx":5},{"id":"xlsx-2025秋-マーケティング-6","season":"2025秋","subject":"マーケティング","scope":"6.セグメンテーションとターゲティング","question":"出題範囲：6.セグメンテーションとターゲティング\n\n■問6.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n限られた経営資源を有効に利用するには、不特定多数の顧客を小集団（セグメンテーション）に分けて、標的市場を選定して（ターゲティング）、効率的に効果的に市場にアプローチする必要があります。\n\n・セグメンテーションを考える時に大切なのは、(①)にとっての効率と（②）にとっての効果（満足度）とのギャップです。\n\n・ターゲティングの時に注意する6点（6R）は、有効な市場規模、成長性、顧客の優先順位、到達可能性、競合状況、(③)があります。\n\nA. ①企業　②顧客　③反応の測定可能性\n\nB. ①企業　②顧客　③顧客情報の信頼性\n\nC. ①顧客　②企業　③反応の測定可能性\n\nD. ①顧客　②企業　③顧客情報の信頼性","answer":"■正解：A\n\n■解説：\n\n企業にとっての効率と顧客にとっての効果（満足度）を元に顧客群を分けて、\n\nどのセグメントをターゲットにするかは\n\n商売が成立する最低限の規模（Realistic Scale）,成長性（Rate of Growth）,顧客の優先順位（Rank）,到達可能性（Reach）,競合状況（Rival）,反応の測定可能性（Response）に注意しましょう。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n6.セグメンテーションとターゲティング　p58-59","source":"Excel: GMAP道場問題秋春(2).xlsx","no":6,"idx":6},{"id":"xlsx-2025秋-マーケティング-7","season":"2025秋","subject":"マーケティング","scope":"","question":"■問 7.ポジショニングの検討について、\n以下A〜Dの中から誤っているものを１つ選択してください\n\nーーーーーーーーーーーーーーーーーーーーーーーー\n\nA.ポジショニングは、ターゲット顧客の中に独自のポジションを築き、明確でユニークな差別化イメージを植え付けるための活動である。\n\nB.ポジショニングを検討するときは、経営者視点で考えることがポイントだ。具体的には、企業にとって最も利益をもたらすKSFを設定し、競合品との差別化できる方法を考える方法などがある。\n\nC. 2次元マップを描く場合は、ターゲット顧客が重視している代表的な属性を軸として選び出し、組み合わせる。「品質」と「価格」など相関の高い軸を選んでしまうと当たり前の関係しか導き出せず、1つの軸で考える時と同じ結果になってしまうため適切ではない。\n\nD. ポジショニング成功のための鉄則として①想定する顧客像が明確かつ適切であること➁顧客に正確に伝わること③顧客にとって共感できること④企業全体のポジショングと整合していることの4つがあげられる。","answer":"■正解： Bのみ誤り\n\n■解説：\n\nマーケティングのポジショニングを考える際に重視するのは顧客目線となります。\n\nその際、顧客の重視するKBFを想定することが大切な考え方となります。\n\n選択肢Bは、ポジショニングを検討するときは、顧客の視点で考えることがポイントだ。具体的には、ターゲット顧客が重視するKBFをもとに競合品といかに差別化できるかを考える方法などがある。\n\nが正しいです。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n7．ポジショニング P.60-61","source":"Excel: GMAP道場問題秋春(2).xlsx","no":7,"idx":7},{"id":"xlsx-2025秋-マーケティング-8","season":"2025秋","subject":"マーケティング","scope":"8. 製品特性","question":"出題範囲：8. 製品特性\n\n■問08. 下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n製品はその構成要素を（①）（②）（③）の３つに分解できる。\n\n（①）は顧客の本質的なニーズを満たすための、根本となる機能や価値のこと。自動車の場合、人や物を乗せて運ぶという運搬機能\n\n（②）は（①）に付随する製品特性やスタイル、品質、ブランド、パッケージなどのこと。自動車の場合、色やスタイル、モデル名、燃費、安全性、最高速度など\n\n（③） は アフターサービスや補償など付加的な要素のうち、顧客が価値を認めるもの。\n\n自動車の場合、保証や保険、カーローン、アフターサービスなど\n\nこれらの３要素のうち、どれがマーケティング戦略上最も重要かということは、製品特性や競争環境によって異なる。\n\n例えば、書籍は内容そのもの（①）と著者というブランド（②）が重要だが、コンピュータはテクニカル・サポートや保証（③）が大きな意味を持つ。\n\nA. ①コア　　　②追加機能　③付加価値\nB. ①コア　　　②形態　　　③付随機能\nC. ①基本機能　②形態　　　③付加価値\nD. ①基本機能　②追加機能　③付随機能","answer":"■正解：B\n\n■解説：\n\n製品の導入期にはコアや形態の要素で差別化が可能であっても、市場が発達して競合の類似製品が出回るようになると、付随機能での差別化が重要になったりする。そのため、リサーチなどを通じて、顧客がどのような要素を重視しているか見極めなくてはならない。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n製品特性　P.62~P.63","source":"Excel: GMAP道場問題秋春(2).xlsx","no":8,"idx":8},{"id":"xlsx-2025秋-マーケティング-9","season":"2025秋","subject":"マーケティング","scope":"9.ブランド","question":"出題範囲：9.ブランド\n\n■問9.問題です。以下、ブランドに関する記述です。(　）内に入れるものの正しい組み合わせを選んでください。\n\n・ブランドとは「競合相手やその製品・サービスとの違いを明確にするために用いられる名前、言葉、デザイン、（①）、またはそれらを組み合わせたもの」である。\n\n・強いブランドを育て、ブランド・（②）を高めることは重要な戦略課題である。\n\n・ブランドには主に３つの機能がある。購買に関する情報処理の時間やコストを節約する「（③）機能」、購買リスクの軽減、回避に役立つ「（④）機能」、そしてブランドによって満足感が高まったり、自己実現の手段になる「意味づけ」機能である。\n\n・強いブランドを持つことにより、企業はさまざまな効果を得ることができる。その一つは（⑤）に対する障壁となり、競争優位の構築に貢献するということである。\n\nA．①シンボル　②イメージ　　　③品質保証　④識別　　　⑤買い手\n\nB．①シンボル　②ロイヤルティ　③識別　　　④品質保証　⑤新規参入者\n\nC．①経営理念　②イメージ　　　③品質保証　④識別　　　⑤新規参入者\n\nD．①経営理念　②ロイヤルティ　③品質保証　④識別　　　⑤買い手","answer":"■正解：B\n\n■解説：\n\nブランドとは、競合相手やその製品・サービスとの違いを明確にするために用いられる名前、言葉、デザイン、シンボルまたはそれらを組み合わせたもの。\n\nブランド・ロイヤルティ（顧客の忠誠心や継続性）を高めることがブランドの強さにつながっていく。\n\nブランド機能には、購買に関する情報処理の時間やコストを節約する「識別機能」と、購買リスクの軽減、回避に役立つ「品質保証機能」、ブランドにより満足感が高まったり、自己実現の手段になる「意味づけ」機能がある。\n\n強いブランドを持つことの企業のメリットはさまざまある。商標権の設定により法的保護を受けられ、競合企業との差別化を図ることができたり、新規参入の障壁となって、競争優位の構築に貢献する。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n9．ブランド P64-65","source":"Excel: GMAP道場問題秋春(2).xlsx","no":9,"idx":9},{"id":"xlsx-2025秋-マーケティング-10","season":"2025秋","subject":"マーケティング","scope":"10.新製品開発","question":"出題範囲：10.新製品開発\n\n■問10.新製品開発のプロセスは大きく4つのステージに分かれる。\n\nプロセスの早いものから順に並べなさい。\n\nA.戦略仮説の検討\n\nB.製品コンセプトの開発\n\nC.市場参入\n\nD.製品化","answer":"■正解：Ｂ→Ａ→Ｄ→Ｃ\n\n■解説：\n\n製品コンセプトの開発 → 戦略仮説の検討 → 製品化→ 市場参入の順です。\n\n・新製品開発プロセスは大きくこの4つのステージに分かれる。\n\n・ニーズ発想（こんなニーズがあるが、何か解決できる方法はないだろうか？）またはシーズ発想（こんな新しい技術が開発されたが、何か利用できないだろうか？）により製品アイデア（市場に提供するその製品固有の機能）が創出され、製品コンセプトとして表される。市場参入までのプロセスは、製品コンセプトとの整合性を図りながら進めなくてならない。\n\n・製品コンセプトは、新製品に関わる担当部門間を結ぶコンセンサスとなり、共通言語として機能する。したがって、関係者が共有し理解できるような明確な言葉で表すことが求められる\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n10．新製品開発 P.66-67","source":"Excel: GMAP道場問題秋春(2).xlsx","no":10,"idx":10},{"id":"xlsx-2025秋-マーケティング-11","season":"2025秋","subject":"マーケティング","scope":"11. 製品ライフサイクル","question":"出題範囲：11. 製品ライフサイクル\n\n■問11.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを\n　選択肢A~Dのうちから選んでください。\n\n・製品のライフサイクルは、導入期、成長期、成熟期、衰退期に分けられます。\n\n・導入期の主な購買層は、新しいものに敏感な（①）と（②）です。\n\n・成長期になると需要が急拡大し、売上も加速度的に増加します。\n　この段階の中心的な顧客は（③）です。\n\n・成熟期になると、大勢の人がその製品を使用しているのを見て、\n　保守的なマインドを持つ（④）がようやく受容し始めます。\n\nA. ①フォロワー　　②アーリー・アダプター　③イノベーター　④レイト・フォロワー\n\nB. ①フォロワー　　②レイト・フォロワー　　③イノベーター　④アーリー・アダプター\n\nC. ①イノベーター　②アーリー・アダプター　③フォロワー　　④レイト・フォロワー\n\nD. ①ラガード　　　②イノベーター　　　　　③フォロワー　　④レイト・フォロワー","answer":"■正解：C\n\n■解説：\n\nイノベーターは、リスクを恐れず、技術的な知識も総じて高いマニア層。アーリー・アダプターは、周りからは思慮深い成功者と思われている人が多く、オピニオン・リーダーとして製品の評価形成に影響力を持つ。フォロワーは、成長期の中心的な顧客。レイト・フォロワーは、市場が成熟段階に入り、大勢の人がその製品を使用しているのを見てから購入する保守的な層。ラガードは、流行に関心がなく、他者の購買にほとんど影響を与えない。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n11．製品ライフサイクル P.68-69","source":"Excel: GMAP道場問題秋春(2).xlsx","no":11,"idx":11},{"id":"xlsx-2025秋-マーケティング-12","season":"2025秋","subject":"マーケティング","scope":"12. 価値と事業経済性","question":"出題範囲： 12. 価値と事業経済性\n\n■問 12. 下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n価格弾力性\n価格を変化させたときに、製品によって需要量が大きく変わるものと、ほとんど変わらないものがある。\n価格変化の度合いに対する需要変化の度合いの比率を示す指標を価格弾力性と言う。\n価格弾力性が(①)場合は、価格を変更してもほとんど需要は変化しないが、価格弾力性が(②)と、価格が変わると需要が大きく変化する。\n通常、コメや野菜などの(③)は価格弾力性が(①)。宝飾品などの高価な(④)は価格弾力性が(②)と言われる。\n価格弾力性は顧客セグメントによって多様であり、同じ顧客セグメントであっても状況とともに変化する可能性がある。たとえば飛行機の場合、プライベートで利用するときとビジネスで利用するときでは、座席のクラスが変わったりする。価格弾力性はその製品のスイッチング・コストにも影響を受ける。\n\nたとえば、使用に際して新たな学習が必要な製品でほとんど価格差がなければ、顧客はあえて違うメーカーの類似製品に切り替えようとはしない。パソコンのソフトなどは、スイッチング・コストが高いために価格弾力性が小さくなっている典型例と言える。\n\nA. 大きい\n\nB. 小さい\n\nC. 贅沢品\n\nD. 生活必需品","answer":"■正解：\n\n① B. 小さい ②A. 大きい ③D. 生活必需品 ④C. 贅沢品\n\n■解説：\n\n価格弾力性\n\n価格を変化させたときに、製品によって需要量が大きく変わるものと、ほとんど変わらないものがある。\n\n価格変化の度合いに対する需要変化の度合いの比率を示す指標を価格弾力性と言う。\n\n価格弾力性が小さい場合は、価格を変更してもほとんど需要は変化しないが、価格弾力性が大きいと、価格が変わると需要が大きく変化する。\n\n通常、コメや野菜などの生活必需品は価格弾力性が小さい。宝飾品などの高価な贅沢品は価格弾力性が大きいと言われる。\n\n価格弾力性は顧客セグメントによって多様であり、同じ顧客セグメントであっても状況とともに変化する可能性がある。たとえば飛行機の場合、プライベートで利用するときとビジネスで利用するときでは、座席のクラスが変わったりする。価格弾力性はその製品のスイッチング・コストにも影響を受ける。\n\nたとえば、使用に際して新たな学習が必要な製品でほとんど価格差がなければ、顧客はあえて違うメーカーの類似製品に切り替えようとはしない。パソコンのソフトなどは、スイッチング・コストが高いために価格弾力性が小さくなっている典型例と言える。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n価値と事業経済性 P.70 - P.71","source":"Excel: GMAP道場問題秋春(2).xlsx","no":12,"idx":12},{"id":"xlsx-2025秋-マーケティング-13","season":"2025秋","subject":"マーケティング","scope":"13. 戦略的価格設定","question":"出題範囲：13. 戦略的価格設定\n\n■問 13.戦略的価格設定について、誤っているものを一つ選んでください。\n\n（A）利益を確保するためにはコストを上回る価格が必要であり、コストが価格の最低限度となる。コストは通常、固定費と変動費で構成されている。固定費率が高い事業では、固定費をカバーするまでは赤字であるが、それ以降は売上増加分のほとんどが利益となる。\n\n（B）カスタマー・バリューとは、「顧客が適正と認める金額」のことであり、価格設定における上限となる。テクニカル・バリューとカスタマー・バリューの差を認識し、両者を一致させるために製品の試用や、製品特性の正確な伝達といった顧客への働きかけが重要である。\n\n（C）競争上、自社の都合だけで価格を設定できず、競合の価格やその動向に影響を受ける場合がある。競争環境の影響を避けるためには、機能やデザイン、ブランド、サービスなどの面で競合製品との明確な差別化が必要となる。\n\n（D）新製品の導入価格を設定する際、代表的な手法として、価格設定をコスト同等かそれ以下にするディスカウント・プライシングと、早期の資金回収のために導入価格を高く設定するスキミング・プライシングが知られている。","answer":"■正解：D\n\n■解説：\n\n正しくは、\n\n新製品の導入価格を設定する際、代表的な手法として、価格設定をコスト同等かそれ以下にするペネトレーション・プライシングと、早期の資金回収のために導入価格を高く設定するスキミング・プライシングが知られている。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n13．戦略的価格設定 P.72-73","source":"Excel: GMAP道場問題秋春(2).xlsx","no":13,"idx":13},{"id":"xlsx-2025秋-マーケティング-14","season":"2025秋","subject":"マーケティング","scope":"14.流通チャネルの意義","question":"出題範囲：14.流通チャネルの意義\n\n■問14.流通チャネルの意義について、正しいを全て選択してください。\n\nA.企業が効率的に製品を届ける為に、流通チャネルが重要な役割を果たす。流通チャネルは製品と顧客との間にあるギャップを埋める為に、3つのフロー（物流、商流、情報流）に関わっている。\n\nB.流通チャネルはメーカーにとって大きな資産になる。競合に先立って優良チャネルを確保できれば、それが参入障壁となり、長期的な競争優位性を築くこともできる。\n\nC.流通チャネルの形態にはゼロ段階から3段階までの分類以外にマルチレベル方式、フランチャイズ方式、ライセンス方式などの展開方法がある。\n\nD.フランチャイズ方式は小売りや飲食業などに多く、フランチャイザー（システムの提供者）が特定地域におけるビジネスの展開、ノウハウ、その他サポートを提供する見返りに、フランチャイジー（システムの利用者）からロイヤリティーを徴収する。","answer":"■正解：全て正しい\n\n■解説：\n\n流通チャネルは、企業が効率的に製品を市場に届けたり、競争優位性を構築するうえで、重要な役割を果たす。流通チャネルには様々な形態があるので、製品特性や顧客特性、競合環境等を総合的に判断しながら最適な流通チャネルを設計しなくてはならない。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n14．流通チャネルの意義 P.74-75","source":"Excel: GMAP道場問題秋春(2).xlsx","no":14,"idx":14},{"id":"xlsx-2025秋-マーケティング-15","season":"2025秋","subject":"マーケティング","scope":"15.流通チャネルの構築プロセス","question":"出題範囲：15.流通チャネルの構築プロセス\n\n■問15流通チャネルの構築プロセスについて、誤っているものを選択してください。\n\nA.製品説明の必要性が高く、顧客が地理的に集中し、特定顧客の大量購入が見込める場合は流通業者を通した方がよいが、製品説明の必要性が低く、潜在顧客も分散しているときは直販が適している。\n\nB.顧客の利便性を最優先するならば、流通業者の数を減らすほうがよいが、流通業者にとって魅力的な販売条件を提供する必要があれば、流通業者の数を制限しないほうが望ましい。\n\nC.いっせいに全国展開を図る場合と、地域を限定して徐々にエリアを拡大していく場合とでは、プロモーション方法も必要な経営資源の量もまったく異なる。また、流通業者は地域密着型の展開を図っている場合が多いため、取引するメンバーの選定にも影響が出てくる。\n\nD.チャネルメンバーを選定する際の基準として、財務内容などの企業の健全性、果たしうる機能、得意とする製品カテゴリーなどのほかに販売組織の確立度、顧客の数と質、対顧客交渉力、顧客との人間関係、小売店売場獲得力、取引条件、物流能力、情報武装のレベル、コントロールのしやすさ、自社のビジョンへの共鳴度などがあげられる。","answer":"■正解：AとBが誤り\n\n■解説：\n\n選択肢Aは、「製品説明の必要性が高く、顧客が地理的に集中し、特定顧客の大量購入が見込める場合は直販が適しているが、製品説明の必要性が低く、潜在顧客も分散しているときは流通業者を通したほうがよい」が正しいです。\n\n選択肢Bは、「顧客の利便性を最優先するならば、流通業者の数を増やすほうがよいが、流通業者にとって魅力的な販売条件を提供する必要があれば、流通業者の数を制限するほうが望ましい」が正しいです。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n15.流通チャネルの構築プロセス  P.76-77","source":"Excel: GMAP道場問題秋春(2).xlsx","no":15,"idx":15},{"id":"xlsx-2025秋-マーケティング-16","season":"2025秋","subject":"マーケティング","scope":"16.購買決定プロセスとコミュニケーション手段","question":"2025年9月29日（月）＜マーケティング＞\n\n出題範囲：16.購買決定プロセスとコミュニケーション手段\n\n■問16.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n\nマーケティングでは、顧客が購買に至るまでには長い意思決定プロセスが存在する。\n\n一般に認知、（①）、愛好、選好、確信、そして（②）の６段階のプロセスを経ると言われている。企業にとって、想定顧客が現在どの段階にいるかを知り、彼らをどのようなコミュニケーション方法によって（②）に近づけていくかが重要だ。\n\n　そのためには、潜在顧客に対して（③）を促し、（④）を持たせ、（⑤）を喚起し、（②）行動を起こさせるようなメッセージを伝えなければならない。これを、消費者の態度変容プロセス（AIDAモデル）という。\n\n　なお、AIDAモデルに動機づけ（Motive）または（⑥）のMを加えた「AIDMA」や、確信（Conviction）を加えた「AIDCA」モデルも提唱されている。\n\nA. ①興味、②購買、③理解、④確信、⑤欲求、⑥記憶\n\nB. ①理解、②欲求、③確信、④興味、⑤記憶、⑥購買\n\nC. ①理解、②購買、③注意、④興味、⑤欲求、⑥記憶\n\nD. ①確信、②理解、③注意、④欲求、⑤記憶、⑥購買","answer":"■正解：C\n\n■解説：\n\nマーケティングの目的は最終的に顧客に自社製品を買ってもらうことだが、顧客が購買に至るまでには長い意思決定プロセスが存在する。一般に認知、理解、愛好、選好、確信、そして購買の６段階のプロセスを経ると言われている。企業にとって、想定顧客が現在どの段階にいるかを知り、彼らがどのようなコミュニケーション方法によって購買に近づけていくかが重要だ。\n\nそのためには、潜在顧客に対して注意を促し（Attention）、興味を持たせ（Interest）、欲求を喚起し（Desire）、購買行動を起こさせる（Action）ようなメッセージを伝えなければならない。これを、消費者の態度変容プロセス（AIDAモデル）と言う。\n\n　なお、AIDAモデルに動機づけ（Motive）または記憶（Memory）のMを加えた「AIDMA」や、確信（Conviction）を加えた「AIDCA」モデルも提唱されている。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16.購買決定プロセスとコミュニケーション手段 P.78-79","source":"Excel: GMAP道場問題秋春(2).xlsx","no":16,"idx":16},{"id":"xlsx-2025秋-マーケティング-17","season":"2025秋","subject":"マーケティング","scope":"17.広告戦略","question":"出題範囲：17.広告戦略\n\n■17.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n広告は企業イメージを左右するほど経営に与える影響が大きい。\n\n広告戦略は（①）戦略と（②）戦略とに大別されている。\n\n（①）戦略の役割は「伝える場の確保」であり、\n\n（②）戦略の役割は「伝えるべきメッセージづくり」である。\n\n広告代理店を利用する場合、広告主である企業は代理店に対して\n\n誰にどのような（③）で売り込みたいのか、現在の（④）はどのレベルなのかといった\n\n現状認識や希望を的確に伝えなくてはならない。\n\nA. ①メディア　②クリエイティブ　③ポジショニング　④認知度\n\nB. ①メディア　②クリエイティブ　③認知度 　④ポジショニング\n\nC. ①クリエイティブ　②メディア　③ポジショニング　④認知度\n\nD. ①クリエイティブ　②メディア　③認知度　　　　　④ポジショニング","answer":"■正解：A\n\n■解説：\n\n広告戦略はメディア戦略とクリエイティブ戦略とに大別されている。\n\nメディア戦略の役割は「伝える場の確保」であり、\n\nクリエイティブ戦略の役割は「伝えるべきメッセージづくり」である。\n\n広告代理店を持ち入り場合、広告主である企業は代理店に対して\n\n誰にどのようなポジショニングで売り込みたいのか、現在の認知度はどのレベルなのかといった現状認識や希望を的確に伝えなくてはならない。\n\n広告主が注意しなくてはならないのは、期待効果を数値目標で確認できるかどうかです。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n17.広告戦略　p80ーp81","source":"Excel: GMAP道場問題秋春(2).xlsx","no":17,"idx":17},{"id":"xlsx-2025秋-マーケティング-18","season":"2025秋","subject":"マーケティング","scope":"18.  セールス・プロモーションと販売戦略","question":"出題範囲：18.  セールス・プロモーションと販売戦略\n\n—----------------------------------------------------\n\n■問 18.広告とセールス・プロモーションの関係として適切なものを1つ選んでください\n\nA. 両者は役割が重複するため、どちらか一方を選択すれば十分である。\n\nB. 広告は短期的な購買刺激を目的とし、セールス・プロモーションは長期的なブランド認知を形成する。\n\nC. セールス・プロモーションは広告を補う機能を持っている\n\nD. 販売戦略のコミュニケーション・ミックスの中で営業担当者による販売活動（人的販売）は最もコストがかからない方法といえる。","answer":"■正解：C\n\nA. 誤り\n\n　　広告が顧客の意識下に累積的にイメージを浸透させるプル効果が主目的とするのに対し、セールス・プロモーションは広告などで高まった顧客の関心を購買に直結させる意図を持つため即物的な面が強い。\n\nB. 誤り\n\n　　同上\n\nC. 正しい\n\nD. 誤り\n\n　　営業担当者による販売活動（人的販売）は最もコストがかかるが、顧客を最終的な購買に向かわせる双方向のコミュニケーション手段としてきわめて有効である。\n\n■解説：\n\n広告＝顧客の意識下に累積的にイメージを浸透させるプル効果が主目的\nセールス・プロモーション＝広告で高まった顧客の関心を購買に直結させる意図を持ち即物的な面が強い。\n営業担当者による販売活動（人的販売）は最もコストがかかるが、顧客を最終的な購買に向かわせる双方向のコミュニケーション手段としてきわめて有効\n■出典：グロービス マネジメントブック 改訂3版\n\n18．セールス・プロモーションと販売戦略  P.82-83","source":"Excel: GMAP道場問題秋春(2).xlsx","no":18,"idx":18},{"id":"xlsx-2025秋-マーケティング-19","season":"2025秋","subject":"マーケティング","scope":"19. 顧客維持型マーケティング","question":"出題範囲：19. 顧客維持型マーケティング\n\n■問.19「顧客維持型マーケティング」において、正しいものを全て選択してください。\n\nA.広告などを大量に打って新規顧客を獲得するより、多額のマーケティングコストがかかる。\n\nB.製品に占めるサービス部分が大きくなるほど、顧客との接点が増えるため、企業は顧客との関係維持により注力する必要がある。\n\nC. 「ワン・トゥ・ワン・マーケティング」とは、「顧客一人ひとり」を把握することで、「顧客内シェア」を高めることに焦点を置く。これにより、一人の顧客に何回買ってもらうかを重視する。\n\nD. 「データベース・マーケティング」とは、データベース化した顧客情報を加工して何らかの有効な仮説を引き出し、それを基に新しいマーケティング刺激を創造し、顧客にフィードバックしていく。","answer":"■正解： B,C,D\n\n■解説：「顧客維持型マーケティング」は、一度引き付けた顧客と良好な関係を維持することで、一人の人間から最大限の収益を得るマーケティング手法です。\n\nA. 誤り\n\n　　企業にとって、顧客維持の意義は２つある。１つは、広告などを大量に打って新規顧客を獲得するよりも、少ないマーケティング・コストで収益を上げられることだ。ロイヤルティの高い顧客には、購買量の増加、営業費用の削減、クチコミによる紹介などの効果が期待できる。もうひとつは、顧客からのフィードバックを製品開発などのマーケティング戦略に利用できることだ。\n\nB. 正しい\n\nC. 正しい\n\nD. 正しい\n\n■出典：グロービス マネジメントブック 改訂3版\n\n顧客維持型マーケティング　P.84~P.85","source":"Excel: GMAP道場問題秋春(2).xlsx","no":19,"idx":19},{"id":"xlsx-2025秋-マーケティング-20","season":"2025秋","subject":"マーケティング","scope":"20.BtoBマーケティング","question":"出題範囲：20.BtoBマーケティング\n\n■問20.　以下、「BtoBマーケティング」に関する記述です。(　）内に入れるものの正しい組み合わせを選んでください。\n\nマーケティングの中でも、特に（①）を対象としたものを「BtoBマーケティング」と呼び、（②）向けの「BtoC マーケティング」と異なる点がある。\n\n例えば、販売する製品やサービスが高額であったり、（③）であったりする。また、エンドユーザーと購入意思決定者（DMU）は（④）。\n\n顧客企業にとっては、提供される製品やサービスが、売上向上やコスト削減、リスク低減といった競争力に寄与するか否かが（⑤）となる。提供側は顧客が受け取る付加価値が自社の収益に転換できるかどうかを考えて、ソリューション提供することが重要である。\n\n①法人顧客　②一般消費者　③買い回り品　④異なっている　⑤KSF（重要成功要因）\n\n①一般消費者　②法人顧客　③専門品　④同じである　⑤KBF（購買決定要因）\n\n①法人顧客　②一般消費者　③専門品　④異なっている　⑤KBF（購買決定要因）\n\n①一般消費者　②法人顧客　③買い回り品　④同じである　⑤KSF（重要成功要因）","answer":"■正解：C\n\n■解説：BtoBは「Business to Business」の略で法人顧客を対象とする。「BtoBマーケティング」の製品特性として、機材や業務用ソフト、コンサルティングなど、購入にあたって特殊なニーズや知識に基づく選択が行われる「専門品」が多いことがあげられる。また、顧客特性として、エンドユーザーと購入意思決定者（DMU）が異なるなど、購入意思決定が複雑であることや、製品・サービスが顧客企業の競争力に寄与するか否かがKBF（購買決定要因）となることなどがあげられる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n20.BtoBマーケティング P86-87","source":"Excel: GMAP道場問題秋春(2).xlsx","no":20,"idx":20},{"id":"xlsx-2025秋-マーケティング-21","season":"2025秋","subject":"マーケティング","scope":"21. レピュテーション","question":"出題範囲：21. レピュテーション\n\n■問21.「レピュテーション（評判）」について間違っているものを全て選択してください。\n\nA.商品のレピュテーションが高い企業は、それに比例して職場のレピュテーションも高くなるため、採用活動において有利になる。\n\nB.レピュテーションを高めることの重要性は昔から認識されていたが、近年、改めてそれが認識されるようになった背景にはＩＴの進化がある。\n\nC. とくに、企業が注目しているのは、悪いレピュテーションを初期の段階で食い止めることだ。\n\nD.レピュテーション・マネジメントは、広義には企業の評判維持・向上活動全体を指すが、狭義にはクライシス対応、あるいはメディア対応を指す。","answer":"■正解：A　（Aのみ適切ではない）\n\n■解説：\n\nA：商品のレピュテーションと職場のレピュテーションは必ずしも一致しない\n\nB：正解\n\nC：正解\n\nD：正解\n\n■出典：グロービス マネジメントブック 改訂3版\n\n21．レピュテーション P.88-89","source":"Excel: GMAP道場問題秋春(2).xlsx","no":21,"idx":21},{"id":"xlsx-2025秋-マーケティング-22","season":"2025秋","subject":"マーケティング","scope":"1.マーケティングの発想","question":"出題範囲：1.マーケティングの発想\n\n■問22.マーケティング思考、顧客満足とニーズについて、誤っているものを選択してください。\n\nA.マーケティングとは、今日の売上を確保するための販売戦略のことを指す。\n\nB.ウォンツとは、具体的な製品やサービスへの欲求のことを指す。\n\nC.ニーズとは、様々な事柄に対して人間が感じる満たされない状態のことを指す。\n\nD.顧客の本質的なウォンツを捉え、具体的なニーズにつなげることがマーケティングの\n中心課題である。","answer":"■正解：AとDが誤り\n\n■解説：\n\nA:マーケティングは、顧客満足を軸に「買ってもらえる仕組み」を考える活動です。今日の売上を確保するための販売戦略（セリング）とは異なり、継続的に成長していくために、いかに顧客のニーズを満たすかという発想に立ちます。\n\nB:記述の通り。\n\nC:記述の通り。\n\nD:顧客の本質的なニーズを捉え、具体的なウォンツにつなげることがマーケティングの中心課題である。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n1.マーケティングの発想  P.48 - P.49","source":"Excel: GMAP道場問題秋春(2).xlsx","no":22,"idx":22},{"id":"xlsx-2025秋-マーケティング-23","season":"2025秋","subject":"マーケティング","scope":"2. マーケティングの役割","question":"出題範囲： 2. マーケティングの役割\n\n■問 23. 下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n多くの製品を扱っている場合、個々の製品ベースで最適なマーケティング戦略を考えていると、(①)で見たときに機能の重複などの無駄が生じたり、製品間や事業間の整合性がとれなくなったりする。\n\nそのため、全社的視点に立って方針を決定したり、(②)などを考慮して事業部間の調整を図る必要がある。\n\nさらに、コーポレート・ブランドの育成や管理なども全社的な観点から考えなければならない。この役割を担うのが(③)だ。\n\n一方、(④)はセグメンテーションやターゲティング、ポジショニング、マーケティング・ミックスなどのマーケティング戦略の根幹を担っている。製品間の調整を図るときにも、事業レベルの視点が必要である。\n\nA. 事業マーケティング\n\nB. 全社マーケティング\n\nC. 企業全体\n\nD. シナジー","answer":"■正解：\n\n① C. 企業全体 ②D. シナジー ③B. 全社マーケティング ④A. 事業マーケティング\n\n■解説：\n\n経営戦略は経営理念とビジョンを起点に、全社戦略、事業戦略、機能戦略という階層構造を形成している。マーケティング戦略も同様に、全社レベル、事業レベル、製品レベルの各視点で考えなくてはならない。\n\n多くの製品を扱っている場合、個々の製品ベースで最適なマーケティング戦略を考えていると、(企業全体)で見たときに機能の重複などの無駄が生じたり、製品間や事業間の整合性がとれなくなったりする。\n\nそのため、全社的視点に立って方針を決定したり、(シナジー)などを考慮して事業部間の調整を図る必要がある。\n\nさらに、コーポレート・ブランドの育成や管理なども全社的な観点から考えなければならない。この役割を担うのが(全社マーケティング)だ。\n\n一方、(事業マーケティング)はセグメンテーションやターゲティング、ポジショニング、マーケティング・ミックスなどのマーケティング戦略の根幹を担っている。製品間の調整を図るときにも、事業レベルの視点が必要である。\n\n■出典：グロービス マネジメントブック 改訂3版\n\nマーケティングの役割 P.50 - P.51","source":"Excel: GMAP道場問題秋春(2).xlsx","no":23,"idx":23},{"id":"xlsx-2025秋-マーケティング-24","season":"2025秋","subject":"マーケティング","scope":"3. マーケティング・マネジメント","question":"出題範囲：3. マーケティング・マネジメント\n\n■問24.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nマーケティング・プロセスについて\n\n・マーケティングの（①）を分析することで市場の機会と脅威、自社の強みと弱みを把握する。\n\n・セグメンテーションとは、不特定多数の人々を同じニーズを持つセグメントに分けることである。\n\n・（②）により、様々なセグメントの中から自社が事業を展開する最もふさわしいセグメントを選び出す。\n\n・ポジショニングとは、競合製品に対して自社製品をどのように（③）するかを決定する。\n\n・マーケティング・ミックス（４P）とは、具体的なマーケティング施策の総称であり、Product、Price、（④）、Promotionからなる。\n\n・施策の実行後には、必ず結果の評価と施策の見直しを行う。\n\nA. ①構造　②ターゲティング　③合理化　④Place\n\nB. ①環境　②ターゲティング　③差別化　④Place\n\nC. ①構造　②ターゲティング　③合理化　④Position\n\nD. ①環境　②ハンティング　③差別化　④Position","answer":"■正解：B\n\n■解説：\n\n・マーケティングの環境を分析することで市場の機会と脅威、自社の強みと弱みを把握する。\n\n・セグメンテーションとは、不特定多数の人々を同じニーズを持つセグメントに分けることである。\n\n・ターゲティングにより、様々なセグメントの中から自社が事業を展開する最もふさわしいセグメントを選び出す。\n\n・ポジショニングとは、競合製品に対して自社製品をどのように差別化するかを決定する。\n\n・マーケティング・ミックス（４P）とは、具体的なマーケティング施策の総称であり、Product、Price、Place、Promotionからなる。\n\n・施策の実行後には、必ず結果の評価と施策の見直しを行う。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n3．マーケティング・マネジメント P.52-53","source":"Excel: GMAP道場問題秋春(2).xlsx","no":24,"idx":24},{"id":"xlsx-2025秋-マーケティング-25","season":"2025秋","subject":"マーケティング","scope":"","question":"■問25.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nマーケティング環境分析\n\nマーケティング環境分析では、自社ではコントロールできない（①）と、コントロール可能な（②）を見る。（①）ではマクロ環境、市場（顧客）、競合について、（②）では自社の経営資源や強みと弱みなどを明らかにする。その後ＳＷＯＴ分析を行ない、（③）を発見する。ＳＷＯＴ分析とは、内部分析による自社の強み・弱みと外部分析による市場の機会・脅威を掛け合わせて、総合的に判断する為のフレームワークである。\n\n機会と脅威の二面性\n\n市場の機会と脅威は通常、外部分析から導かれる。しかし他社の機会が必ずしも自社にとっても（④）とは限らない。一般的な市場の機会に自社の強みが合致した時に、自社にとっての機会が生み出される。\n\nまた、機会と脅威には（⑤）がある事を忘れてはならない。同じ企業であっても、ある事実をどういう視点でとらえるかによって脅威ともなるし、機会ともなる。\n\nＡ　①外部環境　②内部環境　③KSF　④好機　⑤経済性\n\nＢ　①内部環境　②外部環境　③KBF　④危機　⑤経済性\n\nＣ　①外部環境　②内部環境　③KSF　④好機　⑤二面性\n\nＤ　①内部環境　②外部環境　③KSF　④危機　⑤二面性","answer":"■正解：C\n\n■解説：\n\nマーケティング環境分析\n\nマーケティング環境分析では、自社ではコントロールできない外部環境と、コントロール可能な内部環境を見る。外部環境ではマクロ環境、市場（顧客）、競合について、内部環境では自社の経営資源や強みと弱みなどを明らかにする。その後ＳＷＯＴ分析を行ない、KSF（成功の鍵となる要因）を発見する。ＳＷＯＴ分析とは、内部分析による自社の強み・弱みと外部分析による市場の機会・脅威を掛け合わせて、総合的に判断する為のフレームワークである。\n\n機会と脅威の二面性\n\n市場の機会と脅威は通常、外部分析から導かれる。しかし他社の機会が必ずしも自社にとっても好機とは限らない。一般的な市場の機会に自社の強みが合致した時に、自社にとっての機会が生み出される。\n\nまた、機会と脅威には二面性がある事を忘れてはならない。同じ企業であっても、ある事実をどういう視点でとらえるかによって脅威ともなるし、機会ともなる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4．市場の機会の発見 P.54-55","source":"Excel: GMAP道場問題秋春(2).xlsx","no":25,"idx":25},{"id":"xlsx-2025秋-マーケティング-26","season":"2025秋","subject":"マーケティング","scope":"5.マーケティング・リサーチ","question":"出題範囲：5.マーケティング・リサーチ\n\n■問26マーケティング・リサーチについて、誤っているものを選択してください。\n\nA.マーケティング戦略を策定するときには、市場で起こっていることを把握し、自社のアイデア（仮説）が受け入れられるかどうかを確認する必要がある。また、戦略をレビューする際にも、実施した施策がどれだけ効果的だったのか検証しなくてはならない。\n\nB.マーケティング・リサーチでは、とりあえず手に入るデータを集めて、そこから最終結論を導く方法が望ましい。仮説検証型のアプローチでは誤った結論を得る可能性が高い。\n\nC.データの収集方法には、ヒアリングやフォーカス・グループへのインタビューなどで言葉や会話から内容をとらえる「定性リサーチ」と、アンケートなどを用いて調査結果を統計的に数値でとらえる「定量リサーチ」がある。 \n\nD.製品やサービスを総合的に評価するコンジョイント分析は、顧客が複数の商品の中から１つを選ぶ場合、色、デザイン、品質などの各項目が、どの程度その選考に影響を与えているかを知るための分析手法の一つである。","answer":"■正解：Bが誤り\n\n■解説：\n\n選択肢Bは、「マーケティング・リサーチでは、現状から考えられる仮説と予測される結果を必ず事前に考え、調査結果との違いを評価する、仮説検証型のアプローチが望ましい。とりあえず手に入るデータを集めて、そこから最終結論を導く方法は、無駄が多く誤った結論を得る可能性が高い」が正しいです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n15.マーケティング・リサーチ  P.56-57","source":"Excel: GMAP道場問題秋春(2).xlsx","no":26,"idx":26},{"id":"xlsx-2025秋-マーケティング-27","season":"2025秋","subject":"マーケティング","scope":"6.セグメンテーションとターゲティング","question":"出題範囲：6.セグメンテーションとターゲティング\n\n■問27.セグメンテーションとターゲティングに関する説明として誤っているものを選択してください。\n\nA.セグメンテーションは、どのような軸（セグメンテーション変数）で分けるかがポイントになる。以前は切り分けが容易な地理的変数や人口動態変数がよく用いられていたが、最近は消費者ニーズの多様化や個性化に合わせて、心理的変数や行動変数が重視されるようになった。\n\nB.ターゲティングとは、不特定多数の顧客を同じ性質やニーズを持つ固まりに分けることである。\n\nC.行動変数として購買頻度や購買動機（ベネフィット）などがある。とくに、顧客が購買にあたって何を重視するかというKSFは重要な切り口となる。\n\nD.ターゲティングの６Rとして、❶有効な市場規模、❷成長性、❸顧客の優先順位/波及効果、❹到達可能性、❺競合状況、❻反応の測定可能性に注意し、総合的に判断しなくてはならない。","answer":"■正解：BとC\n\n■解説：\n\nB.セグメンテーションとは、不特定多数の顧客を同じ性質やニーズを持つセグメント（固まり）に分けることである。どの顧客層（セグメント）をターゲットにするかを決めるのがターゲティングである。\n\nC.行動変数として購買頻度や購買動機（ベネフィット）などがある。とくに、顧客が購買にあたって何を重視するかというKBF（Key Buying Factor：購買決定要因）は重要な切り口となる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n6.セグメンテーションとターゲティング P.58-59","source":"Excel: GMAP道場問題秋春(2).xlsx","no":27,"idx":27},{"id":"xlsx-2025秋-マーケティング-28","season":"2025秋","subject":"マーケティング","scope":"7.ポジショニング","question":"出題範囲：7.ポジショニング\n\n■問28.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nポジショニングとは、顧客の頭の中に自社製品をユニークなものとして位置付けしてもらい、製品イメージを作り出すための活動である。ポジショニングのテクニックは（①）で考えることがポイントです。ターゲット顧客が重視するKBFをもとに（②）といかに差別化できるかを考える方法や製品の属性を軸にして2次元のマップを描き有効なポジションを視覚的に探す方法などがある。\n\nポジショニングは（③）に落とし込まれ、（④）やコミュニケーションなどのマーケティングミックス戦略を規定してく。そのため、ポジショニングを決定するときは様々な角度から実現可能性を検討する必要がある。\n\nA. ①企業側の視点　②自社類似品　③製品コンセプト　④流通チャネル\n\nB. ①企業側の視点　②自社類似品　③流通チャネル　　④製品コンセプト\n\nC. ①顧客の視点　②競合製品　　　③製品コンセプト　④流通チャネル\n\nD. ①顧客の視点　②競合製品　　　③流通チャネル　　④製品コンセプト","answer":"■正解：C\n\n■解説：\n\nポジショニングを成功させるための鉄則を補足すると、\n\n①想定する顧客像が明確かつ適切であること\n\n②顧客に正確に伝わること\n\n③顧客にとって共感出来ること\n\n④企業全体のポジショニングと整合していること。\n\nです。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n7ポジショニング　p60-61","source":"Excel: GMAP道場問題秋春(2).xlsx","no":28,"idx":28},{"id":"xlsx-2025秋-マーケティング-29","season":"2025秋","subject":"マーケティング","scope":"8.  製品特性","question":"出題範囲：8.  製品特性\n\n■問 29. 製品の類型に関する記述として適切なものを1つ選んでください\n\nA. 耐久財は短期間で消費される製品（食品・飲料など）を指す。\n\nB. 非耐久財は自動車や家電など長期使用される製品を指す。\n\nC. サービスは無形の製品で、ひとたび提供されると修正や返品ができない。\n\nD. サービスは有形であり、耐久財に含まれる。","answer":"■正解：C\n解説： \n\nA. 誤り\n　　耐久財は反復私用する有形の製品で、自動車や家電などが該当する。\n\nB. 誤り\n　　非耐久財はすぐに消費されるもので、食品や飲料などの消耗品を指す。\n\nC. 正しい\n\nD. 誤り\n　　サービスは無形、耐久財に含まれない。\nーーーーーーーーーーーーーーーーーーーー\n\n【本文の物理特性の分類定義】\n耐久財＝自動車や家電（長期使用）\n非耐久財＝食品・飲料（短期消費）\nサービス＝無形・提供されると修正や返品ができない・在庫不可。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n8．製品特性  P.62-63","source":"Excel: GMAP道場問題秋春(2).xlsx","no":29,"idx":29},{"id":"xlsx-2025秋-マーケティング-30","season":"2025秋","subject":"マーケティング","scope":"9. ブランド","question":"出題範囲：9. ブランド\n\n■問30. ブランド体系には５つのものがあります。以下の文章を読んで、それぞれのブランド体系に当てはまる言葉を選択肢から選んでください。\n\n１．企業内の事業単位がブランドとして認知され、商品名にも展開されているものを（①）という。\n\n２．１つの商品単体でのブランドを（②）という。\n\n３．１つの核となるブランドから派生したバリエーションを多く持つものを（③）という。\n\n４．企業総体としてブランドが認知され、商品名にも展開されているものを（④）という。\n\n５．いくつかの商品カテゴリーをまたがった包括的なブランドとして認知されているものを（⑤）という。\n\nA. コーポレートブランド\n\nB. 事業ブランド\n\nC. ファミリーブランド\n\nD. 商品群ブランド\n\nE. 商品ブランド","answer":"■正解：①：B　②：E　③：D　④：A　⑤：C\n\n■解説：\n\nコーポレートブランド：企業総体としてブランドが認知され、商品名にも展開されているもの。　例：ぴあ、きゅーぴー、キッコーマンなど\n\n事業ブランド：企業内の事業単位がブランドとして認知され、商品名にも展開されているもの。　例：世界の山ちゃん、牛角など\n\nファミリーブランド：いくつかの商品カテゴリーをまたがった包括的なブランドとして認知されているもの。　例：植物物語、イクシーズ、ランバード（ミズノ）など\n\n商品群ブランド：１つの核となるブランドから派生したバリエーションを多く持つもの。例：マイルドセブン、コカ・コーラなど\n\n商品ブランド：１つの商品単体でのブランド。　例：モルツ、パンパースなど\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n製品特性　P.64~P.65","source":"Excel: GMAP道場問題秋春(2).xlsx","no":30,"idx":30},{"id":"xlsx-2025秋-経営戦略-1","season":"2025秋","subject":"経営戦略","scope":"1. 経営戦略の意義と企業の目的","question":"出題範囲：1. 経営戦略の意義と企業の目的\n \n■問1.下記の文章中で間違っている文章をすべて選択してください。\n \n①経営戦略は、企業あるいは事業の目的を達成するために、持続的な競争優位を確立すべく構造化されたアクションプランと定義できる。\n \n②戦略策定では、まずどの分野にどう進むのかを決める。環境変化、競合企業の動きに対して、自社に最も有利で、且つ競争優位を持続できる道筋を選択する。そのとき、単発の対応でも実行可能な施策であることが重要だ。\n \n③企業の目的は、株主価値の最大化のために、株主を含むステークホルダー間のバランスをとりながら、付加価値を提供し、成長し続けることと言える。\n \n④企業は、過去の成功体験が強いほどそれに引きずられ、新しい試みや思い切った行動がとれなくなり、結果として環境変化に対応出来ず、競争力を失ってしまう。これを「成長の罠」という。\n \n⑤企業変革の担い手はミドル・マネジメントであることも多い。企業の目的、自社の立場を理解し、最適な戦略を実行に移すという一連の変革プロセスを遂行するには事業や機能のレベルにおいてもリーダーシップが必要である。","answer":"■正解：②、④\n\n \n■解説：\n\n②戦略を策定する場合は、自社に最も有利となり、かつ競争優位を持続できる道筋を選択する。このとき、単発の対応ではなく仕組みとして機能すること、実行可能な施策であることが重要。\n \n④企業が過去の強い成功体験のために、新しい試みや思い切った行動が出来ずに、結果、競争力を失うことを「成功の復讐」という。\n\n「成長の罠」は企業が短期的な成長に囚われすぎ、成長することが目的化し、質の低下や、コストの増大を招いてしまって、本来の提供価値が見失われている状態。\n \n①、③、⑤は正しい。\n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n1．経営戦略の意義と企業の目的 P.2-3","source":"Excel: GMAP道場問題秋春(2).xlsx","no":31,"idx":31},{"id":"xlsx-2025秋-経営戦略-2","season":"2025秋","subject":"経営戦略","scope":"2.経営理念と戦術レベル","question":"出題範囲：2.経営理念と戦術レベル\n\n■問2.下記文章中の【①】～【⑤】に入る語句として適切なものを選択肢A～Eのうちから、１つずつ選んでください。\n\n【①】：行動規範や成功の必須条件、経営姿勢、企業の存在意義などさまざまな形で表現されるが、一般的には時代の流れを超えた長期的な視点で社会（顧客）と従業員に関する考えを語ったものが多い。\n\n【②】：【①】で規定された経営姿勢や存在意義に基づき、自社が目指す中期的なイメージを、投資家や従業員や社内全体に向けて示したものである。\n\n【③】：どの事業領域（事業ドメイン）で戦い、何を競争力の源泉とし、どのような事業の組み合わせ（事業ポートフォリオ）を持ち、どのように経営資源を各事業部に配分するかを決定する\n\n【④】：個別の事業分野において競争を勝ち抜くための戦略を考える。【④】では、具体的な事業分野や事業を扱うので、特定市場における企業間の競争を分析することが可能だ。\n\n【⑤】：営業戦略や財務戦略、人事戦略などのように、【④】を実現させるための施策を機能別に落とし込み、機能別の視点から戦略を如何に実施していくかを考える。\n\nA. 事業戦略\nB. ビジョン\nC. 全社戦略\nD. 機能戦略\nE. 経営理念","answer":"■正解：\n\n①：E.経営理念、②：B.ビジョン、③：C.全社戦略、④：A.事業戦略、⑤：D.機能戦略\n\n■解説：\n\n単語だけでなく、その意味も理解しておくと便利です。\n\n経営理念：行動規範や成功の必須条件、経営姿勢、企業の存在意義などさまざまな形で表現されるが、一般的には時代の流れを超えた長期的な視点で社会（顧客）と従業員に関する考えを語ったものが多い。\n\nビジョン：経営理念で規定された経営姿勢や存在意義に基づき、自社が目指す中期的なイメージを、投資家や従業員や社内全体に向けて示したものである。\n\n全社戦略：どの事業領域（事業ドメイン）で戦い、何を競争力の源泉とし、どのような事業の組み合わせ（事業ポートフォリオ）を持ち、どのように経営資源を各事業部に配分するかを決定する\n\n事業戦略：個別の事業分野において競争を勝ち抜くための戦略を考える。事業戦略では、具体的な事業分野や事業を扱うので、特定市場における企業間の競争を分析することが可能だ。\n\n機能戦略：営業戦略や財務戦略、人事戦略などのように、事業戦略を実現させるための施策を機能別に落とし込み、機能別の視点から戦略を如何に実施していくかを考える。\n\n■出典：グロービス マネジメントブック 改訂3版 \n2．経営理念と戦略レベル P.4-5","source":"Excel: GMAP道場問題秋春(2).xlsx","no":32,"idx":32},{"id":"xlsx-2025秋-経営戦略-3","season":"2025秋","subject":"経営戦略","scope":"3.戦略策定プロセス","question":"出題範囲：3.戦略策定プロセス\n\n■問3.戦略策定プロセスの内容について、正しいものを選択してください。\n\nA.戦略策定プロセスとは、企業の戦略を実行可能なアクション・プランに落とし込む際の基本的な流れを指す\n\nB.このプロセスは一方通行の流れではなく、仮説・検証を繰り返し、実施結果や環境変化に応じて戦略の見直しを行うことも大切だ\n\nC.優れた戦略を策定・実施するには、「合理性と論理性」「持続性と効率性」という２つの異なる条件を満たすことが求められる\n\nD.戦略の策定や実施に関わる人々を動かすには、合理的な側面に働きかける力が必要になる","answer":"■正解：Bのみ\n\n■解説：\nA：誤り。「企業の戦略」ではなく、「経営理念やビジョン」です。経営理念やビジョンは戦略目標を設定する際に思想的なバックボーンになります。\nB：正解。\nC：誤り。「持続性と効率性」ではなく、「創造性と革新性」の誤り。\nD：誤り。人々を動かすのは合理的な側面ではなく、信念や夢、リスクへの挑戦、既存の組織風土の打破、革新的なものの見方など人間的な側面に働きかける力が必要になる。\n\n■出典：グロービス マネジメントブック 改訂3版\n3.戦略策定プロセス P.6-7","source":"Excel: GMAP道場問題秋春(2).xlsx","no":33,"idx":33},{"id":"xlsx-2025秋-経営戦略-4","season":"2025秋","subject":"経営戦略","scope":"4.全略戦略の構成要素（１）：ドメイン","question":"2025年9月16日（火）＜経営戦略＞\n\n出題範囲：4.全略戦略の構成要素（１）：ドメイン\n\n■問4.下記文章中の【①】～【⑤】に入る語句として適切なものを選択肢A～Eのうちから、１つずつ選んでください。\n\n【①】は組織活動の指針となるもので、企業の方向性を示すうえで非常に重要だ。【①】の決定とは、【②】を決めるだけではなく、【③】を明らかにすることでもある。【④】を広げすぎたため、多角化や買収を繰り返し、経営体力を弱らせた企業は少なくない。現在の厳しい競争環境の中では、限られた資源を使って自社が最も【⑤】を選び、そこに資源を集中させることが、以前にもまして必要になっている。\n\nA.戦う場所\n\nB.戦える場所\n\nC.戦わない場所\n\nD.事業ドメイン\n\nE. ドメイン","answer":"■正解：①-E, ②-A, ③-C, ④-D, ⑤-B\n\n■解説：\n\n【ドメイン】は組織活動の指針となるもので、企業の方向性を示すうえで非常に重要だ。【ドメイン】の決定とは、【戦う場所】を決めるだけではなく、【戦わない場所】を明らかにすることでもある。【事業ドメイン】を広げすぎたため、多角化や買収を繰り返し、経営体力を弱らせた企業は少なくない。現在の厳しい競争環境の中では、限られた資源を使って自社が最も【戦える場所】を選び、そこに資源を集中させることが、以前にもまして必要になっている。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n4.全略戦略の構成要素（１）：ドメイン P8-9","source":"Excel: GMAP道場問題秋春(2).xlsx","no":34,"idx":34},{"id":"xlsx-2025秋-経営戦略-5","season":"2025秋","subject":"経営戦略","scope":"5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分","question":"出題範囲：5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分\n\n■問5. 企業の「コア・コンピタンス」を見極める場合に考える点について、次の5つから「誤っているもの」を全て選択してください。\n\n① 模倣可能性(Imitability)\n\n② 移転可能性 (Transferability)\n\n③ 代替可能性 (Substitutability)\n\n④ 成長性 (Potential)\n\n⑤ 耐久性 (Durability)","answer":"■正解：「④のみ」が誤り。\n\n■解説：\n\n正しくは、「④ 稀少性 (Scarcity)」です。\n\n「コア・コンピタンス」は企業内部で培った中核的な力で、自社独自の価値を生み出す源泉となります。「コア・コンピタンス」を見極める場合、5つの要素「① 模倣可能性(Imitability)、② 移転可能性 (Transferability)、③ 代替可能性 (Substitutability)、④ 稀少性 (Scarcity)、⑤耐久性 (Durability)」について考える必要があります。①②③の可能性が低いほど、また④⑤が高いほど、競争優位は持続しやすくなると言われます。\n\nなお、競争優位を築いたとしても、市場環境の変化とともに陳腐化するおそれがあるため、「継続的な投資」「コア・コンピタンスの再定義」「新たな能力の育成」などの努力が欠かせません。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n全社戦略の構成要素(2)：コア・コンピタンスと資源配分 P.10-11","source":"Excel: GMAP道場問題秋春(2).xlsx","no":35,"idx":35},{"id":"xlsx-2025秋-経営戦略-6","season":"2025秋","subject":"経営戦略","scope":"6. 事業ポートフォリオと事業ライフサイクル","question":"出題範囲：6. 事業ポートフォリオと事業ライフサイクル\n\n■問6.下記文章中の【①】～【④】に入る語句として適切なものを選択肢A～Dのうちから、１つずつ選んでください。\n\n【①】：売上高は低下し、利益も減少する。新規投資が不要なため一部のリーダー企業は利益を出すことができるが、安定した収益を上げ続けるには効率性の追求が不可欠である。\n\n【②】：売上高も利益も低く、キャッシュフローもマイナスだ。競合企業はほとんどないが、需要拡大のために顧客に対するPR活動に力を入れる必要がある。\n\n【③】：売上高は低成長に転じ、利益も低下するが、投資額が少ないためキャッシュフローはプラスになる。競争が激化するため、競争上の優位性が築けなければ敗者となる。\n\n【④】：売上高が急速に伸び、利益も上昇する。キャッシュフローもプラスに転じるが、競合他社の参入は増える。競争が激しくなるため、他者との差別化を図る必要がある。\n\nA. 衰退期\n\nB. 成長期\n\nC. 成熟期\n\nD. 導入期","answer":"■正解：①：A.衰退期、②：D.導入期、③：C.成熟期、④：B.成長期\n\n■解説：\n\n導入期→成長期→成熟期→衰退期という4段階で事業をとらえる事業ライフサイクルの考え方を理解しましょう。これは「ある製品や市場は必ず誕生から衰退までの流れをもち、その段階に応じてとるべき戦略は異なる」という考え方に基づきます。\n\n各サイクルの特徴は問題文のとおりです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n6．事業ポートフォリオと事業ライフサイクル P.12-13","source":"Excel: GMAP道場問題秋春(2).xlsx","no":36,"idx":36},{"id":"xlsx-2025秋-経営戦略-7","season":"2025秋","subject":"経営戦略","scope":"７. ポートフォリオ・マトリクス","question":"出題範囲：７. ポートフォリオ・マトリクス\n\n■問7.下記文章中の（①）～（④）に入る語句として適切なものを選択肢A～Dのうちから一つ選んでください。\n\nプロダクト・ポートフォリオ・マネジメント(PPM)モデルでは「市場成長率」と「相対マーケットシェア」の2軸でマトリクスをつくり、事業を４つの象限に分けている。\n\n成長性は高いがシェアの低い（①）では、早いうちに集中投資してシェアを拡大する戦略をとるか、思い切って撤退するかの判断が必要だ。\n\nシェアは高いが成長率の低い（②）では、投資をシェア維持に必要な最小限度にとどめて収益を上げ、キャッシュを回収する戦略を取り、他の事業への資金源とする。\n\nシェアも成長性も高い（③）は、現在のシェアを維持しつつ成長するための投資を行い、将来の（②）に育てる。\n\nシェアも成長性も低い（④）は見込みがないため、買い手がいるうちに売却するなどの撤退戦略をとる。\n\nA.　負け犬\n\nB.　金のなる木\n\nC.　花形事業\n\nD.　問題児","answer":"■正解：①：D.問題児、②：B.金のなる木、③：C.花形事業、④：A.負け犬\n\n■解説：\n\n問題文の通りです。横軸「相対マーケットシェア」、縦軸「市場成長率」の図をイメージすると理解が深まるでしょう。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n7．ポートフォリオ・マトリクス P.14-15","source":"Excel: GMAP道場問題秋春(2).xlsx","no":37,"idx":37},{"id":"xlsx-2025秋-経営戦略-8","season":"2025秋","subject":"経営戦略","scope":"8.事業拡大と多角化の基本戦略","question":"出題範囲：8.事業拡大と多角化の基本戦略\n\n■問8.事業の多角化のジレンマについて、誤っている記述を選択してください。\n\nA. 1つめのジレンマは、多角化の対象として、自社アセットを生かした既存事業と異なる事業分野を選ぶ企業が多いため、競争が激化しがちなことだ\n\nB. 2つめは、自社の経営資源を有効活用できる分野を選ぶと、結果的に新規事業者との競争関係となってしまうことだ\n\nC. 3つ目は、新規事業を成功させるために本業とは違った行動様式や企業文化が必要な場合、事業部制や別会社での運営という膨大な追加コストがかかってしまうことだ\n\nD. 4つ目は、多角化を重ねることで自社の事業ドメインがより明確になることで、新規事業にリソース投入できなくなることだ","answer":"■正解：すべて不正解\n\n■解説：\n\nA. 1つめのジレンマは、多角化の対象として、将来にわたって成長が見込まれる魅力度の高い分野を選ぶ企業が多いため、競争が激化しがちなことだ\n\nB. 2つめは、自社の経営資源をすぐに有効活用できる分野を選ぶと、結果的に既存事業での競争関係がそのまま新規事業にも持ち込まれてしまうことだ\n\nC. 3つ目は、新規事業を成功させるために本業とは違った行動様式や企業文化が必要な場合、既存の企業文化や社内の諸制度が事業展開の障害になることが多い\n\nD. ほかにも、多角化を重ねることで自社の事業ドメインが曖昧になり、本業を見失う危険もある\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n8．事業拡大と多角化の基本戦略 P.16-17","source":"Excel: GMAP道場問題秋春(2).xlsx","no":38,"idx":38},{"id":"xlsx-2025秋-経営戦略-9","season":"2025秋","subject":"経営戦略","scope":"9.競争優を築くための基本戦略","question":"2025年9月23日＜経営戦略＞\n\n出題範囲：9.競争優を築くための基本戦略\n\n■問9.下記選択肢の中から正しいものを１つずつ選んでください。\n\n次のうち、コスト・リーダーシップ戦略が有効になりにくい事業の特徴はどれか。\n\nA. 規模の経済が働きにくい事業\n\nB. 顧客ニーズが多様で差別化が困難な事業\n\nC. 大規模な生産や販売によって規模の経済を発揮しやすい事業\n\nD. 標準化製品の大量生産が可能な事業","answer":"■正解：A\n\n■解説：\n\nコスト・リーダーシップ戦略は規模の経済や大規模な生産設備投資を前提にしている。そのため「規模拡大が難しい産業」では効果を発揮しにくい。\n\nポーターの3つの基本戦略は\n\n【コスト・リーダーシップ戦略】業界で最も低コストを実現し、低価格で競争優位を築く。\n\n【差別化戦略】ブランド・イメージや独自技術、製品（性能やデザイン）、顧客サービス、販売チャネルを独自化し、顧客に特別な価値を認めてもらう。\n\n【集中戦略】特定の顧客層、特定の製品、特定の市場などに限られた領域に経営資源を集中し、その領域で優位を確立する。\n\nとなる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n9.競争優位を築くための基本戦略 P.18-19","source":"Excel: GMAP道場問題秋春(2).xlsx","no":39,"idx":39},{"id":"xlsx-2025秋-経営戦略-10","season":"2025秋","subject":"経営戦略","scope":"10. 事業の経済性分析","question":"出題範囲：10. 事業の経済性分析\n\n■問10.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n（①）が大きくなればなるほどコスト効率が向上する事を（①）の経済と言う。固定費については（①）の経済が働く事は経験的に明白であるが、実は変動費についても（①）の経済が働く。\n\n現在どれだけの生産量があるかと言う観点で（①）の経済は考えるが、現在までの累積の生産量、すなわち累積の（②）量が増えるほどコスト低下に結びつくとするのが（②）曲線の考え方である。\n\n企業が複数の事業活動を持つことにより、より経済的な事業運営が可能になることを（③）の経済と言う。これは単一事業において（①）が拡大する事による効果ではない。（④）が増すことにより経済性が高まるのは、何らかの経営資源を共有することで、それを有効に利用できるからである。\n\nA. ①規模　②販売　③範囲　④均一性\n\nB. ①範囲　②経験　③規模　④均一性\n\nC. ①規模　②経験　③範囲　④多様性\n\nD. ①範囲　②販売　③規模　④多様性","answer":"■正解：C\n\n■解説：\n\n問題文の通りです。\n\n「規模の経済」はスケールメリットとほぼ同義、「範囲の経済性」はシナジーとほぼ同義です。こちらの方が日常的に使うので、合わせて覚えるとイメージし易いですね！\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n10．事業の経済性分析 P.20-21","source":"Excel: GMAP道場問題秋春(2).xlsx","no":40,"idx":40},{"id":"xlsx-2025秋-経営戦略-11","season":"2025秋","subject":"経営戦略","scope":"11. 外部環境分析","question":"出題範囲：11. 外部環境分析\n\n■問11.下記の文章中の(①)〜(④)に入る語句として適切なものを選択肢A〜Dのうちから選んでください。\n\n・マクロ環境分析では、自社でコントロールできないが、企業活動に影響を与える要因を検証する。このうち代表的な項目である、政治、(①)、社会、技術は、それぞれの英語の頭文字をとってPESTと呼ばれる。\n\n・(②)分析は、外部環境における(③)、脅威を見出し、内部環境における強み、弱みを把握する。市場における「(③)」と「脅威」を整理するときには、何が事業の(④)なのかを十分に検討する。次に、自社と競合を分析して自社の「強み」を「弱み」を整理し、コア・コンピタンスをよく見極める。そして市場における(③)と脅威に対して、自社の強みを生かし弱みを克服するにはどうすればよいかを考え、自社にとっての(③)を見つけ出す。\n\nＡ．①環境　②SWOT ③変化  ④KBF\n\nＢ．①経済　②SWOT ③機会  ④KBF\n\nＣ．①経済　②SWOT ③機会  ④KSF\n\nＤ．①経済　②3C     ③変化  ④KSF","answer":"■正解：C\n\n■解説：\n\nマクロ環境分析の代表的な項目は、政治(Politics)、経済(Economy)、社会(Society)、技術(Technology)の頭文字をとってＰＥＳＴと呼ばれる。\n\nSWOT分析は、外部環境における機会、脅威を見出し、内部環境における強み、弱みを把握する。市場における「機会」と「脅威」を整理するときには、何が事業のKSFなのかを十分に検討する。次に、自社と競合を分析して自社の「強み」を「弱み」を整理し、コア・コンピタンスをよく見極める。そして市場における機会と脅威に対して、自社の強みを生かし弱みを克服するにはどうすればよいかを考え、自社にとっての機会を見つけ出す。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n11.外部環境分析 P.22-23","source":"Excel: GMAP道場問題秋春(2).xlsx","no":41,"idx":41},{"id":"xlsx-2025秋-経営戦略-12","season":"2025秋","subject":"経営戦略","scope":"12.業界分析：業界構造と5つの力","question":"2025年9月23日（07:00）＜経営戦略＞\n\n出題範囲：12.業界分析：業界構造と5つの力\n\n■問12. 5つの力について、以下A〜Eの説明で誤っているものを全て選択してください。\n\nA.買い手の交渉力が強くなるのは、買い手の購入量が多かったり、売り手の総取引量に占める割合が高い場合や、製品の差別化が難しく他企業も類似製品を作っている場合、買い手の情報量が少ない場合などである。\n\nB. 売り手（サプライヤ）の交渉力が強くなるのは、売り手の業界が少数の企業に寡占されている場合、また、自社の属する業界が売り手にとって重要な市場の場合、あるいは売り手が供給する製品が、自社の属する業界にとって重要な部品となっている場合などである。\n\nC.業界内の競争が激しくなるのは一般に、同業者数が多い場合、同程度の規模の会社がひしめいている場合、業界の成長が早い場合、装置型産業のように固定費の割合が大きい場合である。\n\nD.代替品の存在も大きな脅威となるが、特に自社の製品よりも価格対性能比で格段に優る製品が出てきた場合や、イノベーションにより従来の機能を全く別の製品で代替できる場合、あるいは異業種の参入によって、従来の商慣習とは異なる製品・サービスの供給形態が出てきた場合などに影響が大きい。\n\nE.新規参入は競合企業が増えるだけでなく、競争ルールの変化をもたらすこともある。新規参入が容易な（参入障壁が低い）業界では、業界の収益性が上がるとすぐに参入者が増加し、収益性は上がってしまう。","answer":"■正解：A、B、C、E　\n\n■解説：\n\n・業界分析を行うときは「５つの力」に着目するとよい。①新規参入の脅威②代替品の脅威➂買い手の交渉力④売り手の交渉力⑤業界内の競合他社を分析することが業界構造の把握に役立つ。\n\nA.買い手の交渉力が強くなるのは、買い手の購入量が多かったり、売り手の総取引量に占める割合が高い場合や、製品の差別化が難しく他企業も類似製品を作っている場合、買い手の情報量が多い場合などである。\n\nB. 売り手（サプライヤ）の交渉力が強くなるのは、売り手の業界が少数の企業に寡占されている場合、また、自社の属する業界が売り手にとって重要な市場ではない場合、あるいは売り手が供給する製品が、自社の属する業界にとって重要な部品となっている場合などである。\n\nC.業界内の競争が激しくなるのは一般に、同業者数が多い場合、同程度の規模の会社がひしめいている場合、業界の成長が遅い場合、装置型産業のように固定費の割合が大きい場合である。\n\nD.正しい\n\nE.新規参入は競合企業が増えるだけでなく、競争ルールの変化をもたらすこともある。新規参入が容易な（参入障壁が低い）業界では、業界の収益性が上がるとすぐに参入者が増加し、収益性は下がってしまう。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n     12．業界分析：業界構造と「５つの力」 P.24-25","source":"Excel: GMAP道場問題秋春(2).xlsx","no":42,"idx":42},{"id":"xlsx-2025秋-経営戦略-13","season":"2025秋","subject":"経営戦略","scope":"13.アドバンテージ・マトリクス","question":"出題範囲：13.アドバンテージ・マトリクス\n\n■問13.アドバンテージ・マトリクスの説明について、正しいものを選択してください。\n\nA.特化型事業は、競争要因が限定されて存在し、かつ、特定の分野でユニークな地位を築くことで優位性を構築が可能な事業である。\n\nB.規模型事業は、汎用的性格の強い事業にはあてはまらない。\n\nC.分散型事業は、事業が小規模な段階では高い収益性を維持することができる。\n\nD.アドバンテージ・マトリクスは、縦軸が優位性構築の可能性、横軸が競合上の戦略変数の多寡で表した図のことであり、業界の競争環境を分析する手法として用いられている。","answer":"■正解：Cのみ\n\n■解説：\n\nA：誤り。特化型事業の競争要因はいくつか存在します。\n\nB：誤り。規模型事業は汎用的性格の強い事業が当てはまります。\n\nC：正解。\n\nD：誤り。縦横が逆です。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n13.アドバンテージ・マトリクス P.26-27","source":"Excel: GMAP道場問題秋春(2).xlsx","no":43,"idx":43},{"id":"xlsx-2025秋-経営戦略-14","season":"2025秋","subject":"経営戦略","scope":"14.内部分析：バリューチェーン（価値連鎖）","question":"2025年９月23日（火）＜経営戦略＞\n\n出題範囲：14.内部分析：バリューチェーン（価値連鎖）\n\n■問14.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n・バリューチェーンは事業活動を機能ごとに分解し、どの部分（機能）で付加価値が生み出されているかを分析することで、事業戦略の構築や改善に役立つ。（A）が提唱した。\n\n・業界全体のバリューチェーンを分析することで、自社の（B）を確認したり、どのような（C）を生んでいるか把握すれば、自社の事業領域を川上、川下に発展（D）させたり、M＆Aなどにより同じ業界内で事業を拡大（E）することを検討する際に、ヒントが得られる。\n\nA. ①カーニー　②アンゾフ　③ポーター\n\nB. ①付加価値　②位置づけ　③経営資源\n\nC. ①付加価値　②位置づけ　③経営資源\n\nD. ①水平統合　②垂直統合　③連結関係\n\nE. ①水平統合　②垂直統合　③連結関係","answer":"■正解：A-③、B-②、C-①、D-②、E-①\n\n■解説：\n\nバリューチェーンとは事業活動を機能ごとに分解し、どの部分（機能）で付加価値が生み出されているかを分析することで、事業戦略の構築や改善に役立つ。【ポーター】が提唱した。\n\n・業界全体のバリューチェーンを分析することで、自社の【位置付け】を確認したり、どのような【付加価値】を生んでいるか把握すれば、自社の事業領域を川上、川下に発展【垂直統合】させたり、M＆Aなどにより同じ業界内で事業を拡大【水平統合】することを検討する際に、ヒントが得られる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n14.内部分析：バリューチェーン（価値連鎖）P28-29","source":"Excel: GMAP道場問題秋春(2).xlsx","no":44,"idx":44},{"id":"xlsx-2025秋-経営戦略-15","season":"2025秋","subject":"経営戦略","scope":"15. 競争上の地位に応じた戦略","question":"出題範囲：15. 競争上の地位に応じた戦略\n \n■問15. コトラーは、企業を「競争上の地位」に応じて4つに分類しました。それぞれの取りうる戦略の説明について、誤っているものを全て選んでください。\n \n① リーダー\n\nナンバーワンの地位を維持することを目的とした戦略を策定することになる。具体的には「市場規模拡大」「シェア維持」「シェア拡大」の3つの方向性が考えられる。\n \n② チャレンジャー\n\n主な戦略は「リーダーとの直接対決」「背面攻撃(競争範囲の拡大)」「後方攻撃(自分よりシェアの小さな企業を攻撃対象とする)」の3つだ。\n \n③ フォロワー\n\n業界のリーダーに追随し、競合企業からの極端な反撃を招かない方法で経営成果の最大化を目指す。たとえば、競争を仕掛けるよりも、業界秩序維持の名の下にリーダーに追随した価格や製品を提供することが考えられる。\n \n④ ニッチャー\n\n大手が本気で参入してこないような市場のくくりを発見し、そこに限られた経営資源を集中させて、高い専門性やブランド力を維持することで、環境変化により市場そのものが消滅するリスクを回避する戦略をとる。","answer":"■正解：「④のみ」が誤り。\n \n■解説：\n\n正しくは、\n\n「④ ニッチャー\n\n大手が本気で参入してこないような市場のくくりを発見し、そこに限られた経営資源を集中させて、高い専門性やブランド力を維持することで、他者の参入を防ぐという戦略をとる。」です。\n\n小さな市場に特化すると、環境変化により市場そのものが消滅するリスクがあり、複数のニッチを持つなどのリスク回避策が必要です。\n\n「競争上の地位」によって、企業の戦略は制約を受けます。定石と言われる戦略を理解し、自社がどの地位にあるかを明確にしたうえで、独自の戦略を考える必要があります。\n \n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n競争上の地位に応じた戦略 P.30-31","source":"Excel: GMAP道場問題秋春(2).xlsx","no":45,"idx":45},{"id":"xlsx-2025秋-経営戦略-16","season":"2025秋","subject":"経営戦略","scope":"16. 事業ライフサイクルに応じた戦略","question":"出題範囲：16. 事業ライフサイクルに応じた戦略\n\n■問16.成熟期には、成長期の成功体験に引きずられることなく、実態を的確に把握し、戦略の展開を図らなくてはならない。成熟期に移行する業界の競争戦略について正しいものを全て選択してください。\n\nA.　製造工程の革新と製造に適した製品設計によってコスト競争力の強化を実現する。\n\nB.　既存の販売網を使わず、新チャネルを構築するなどの事業展開を行い、新しいビジネスモデルを作る。\n\nC.　製品構成の合理化と正しい価格政策を行う。製品の原価計算の精度を向上させ、収益性が高い製品と不採算製品とを識別し、製品の絞り込みや製品構成の見直しを行う。\n\nD.　それまでだれも気づかなかった新しい市場を発見・開拓し、そこでいち早くノウハウ・優良顧客・調達先との関係などといった優位性を構築する。","answer":"■正解：A、C\n\n■解説：\n\nA.　正\n\nB.　誤：新規事業戦略のソフト要素で事業展開を図る場合の記述です。\n\nC.　正\n\nD.　誤：新規事業戦略のニッチ市場の開拓する場合の記述です。\n\nポーターは成熟期に移行する業界の競争戦略を3点にまとめており、解答A、Cに加えて次の1点があげられます。「既存の顧客への品揃えを充実させ、購買幅を広げる。新規顧客を開拓するよりも、現在抱えている顧客からさらに多く買ってもらうほうが手っ取り早く、確実なことも多い。」\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16．事業ライフサイクルに応じた戦略 P.32-33","source":"Excel: GMAP道場問題秋春(2).xlsx","no":46,"idx":46},{"id":"xlsx-2025秋-経営戦略-17","season":"2025秋","subject":"経営戦略","scope":"17. 戦略形成に関する見方","question":"出題範囲：17. 戦略形成に関する見方\n \n■問17.次のうち、コンフィギュレーション学派に関する記述として誤っているものはどれか？\n \nA.　組織を特徴や行動が首尾一貫した集団としてとらえ、最も環境にあったコンフィギュレーションを取ると考える。\n\nB.　他の学派の主張も、自説で包括的に説明しようとする。\n\nC.　ポジショニング学派については、経済合理性が強く働いている状況に置かれた組織で有効であると説明する。\n\nD.　ラーニング学派については、安定した状況に置かれた組織で有効であると説明する。","answer":"■正解： Ｄが誤り\n \n■解説\n\nラーニング学派は、予測が難しくアイデアが重視される業界(ハイテク産業など)で有効であると考えます。安定環境で有効なのはプランニング学派です。\n\nその他の選択肢\n\nA：正しいです(ある特定の組織は最も環境にあったコンフィギュレーションを取ると考えます)\n\nB：正しいです\n\nC：正しいです(例えばアメリカにおける多くの生産財事業などで有効と考えます)\n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n17．戦略形成に関する見方 P.34-35","source":"Excel: GMAP道場問題秋春(2).xlsx","no":47,"idx":47},{"id":"xlsx-2025秋-経営戦略-18","season":"2025秋","subject":"経営戦略","scope":"18.M&Aとアライアンス","question":"出題範囲：18.M&Aとアライアンス\n\n■問18M&A と アライアンスに関する記述として誤っているものを選択してください。\n\nA. M&Aには事業拡大のための時間を節約する効果も期待できる。企業活動においてスピードやタイミングはきわめて重要であり、M&A以外の選択肢も多い。\n\nB. アライアンスとは、複数の企業がお互いに何らかのメリットを得ようとして協力することを指す。M&Aが強力な統合手段なのに対し、アライアンスはより強力な結びつきによる連合と言える。ただし、双方出資による合弁企業設立のように長期の関係になる場合もある。\n\nC. 水平統合は、同一業種内の競合他社を吸収・合併することによりスケールメリットをつくりだし、コスト優位性を構築することを目的とする。垂直統合の目的は、一般にコスト面や市場面で自社がコントロールできる範囲を広げ、他社に対して優位性を確立することだ。仕入れ先である川下の事業に進出する場合と、販売先である川上へ進出する場合がある。\n\nD. M&Aを行う場合は、戦略的意図を明確にし、買収後の事業戦略を十分に検討しておく必要がある。また、買収対象企業をよく調査して、買収後にどれだけの付加価値が創造されるかを見極め、その価値に対して買収価格が妥当かどうかを判断する力も求められる。","answer":"■正解：Ａ,Ｂ,Ｃ (Dは誤りなし)\n\n■解説：\n\nA. M&Aには事業拡大のための時間を節約する効果も期待できる。企業活動においてスピードやタイミングはきわめて重要であり、M&A以外に選択肢がないことも多い。\n\nB. アライアンスとは、複数の企業がお互いに何らかのメリットを得ようとして協力することを指す。M&Aが強力な統合手段なのに対し、アライアンスはより緩やかな結びつきによる連合と言える。ただし、双方出資による合弁企業設立のように長期の関係になる場合もある。\n\nC. 水平統合は、同一業種内の競合他社を吸収・合併することによりスケールメリットをつくりだし、コスト優位性を構築することを目的とする。垂直統合の目的は、一般にコスト面や市場面で自社がコントロールできる範囲を広げ、他社に対して優位性を確立することだ。仕入れ先である川上の事業に進出する場合と、販売先である川下へ進出する場合がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n18.M&Aとアライアンス P.36-37","source":"Excel: GMAP道場問題秋春(2).xlsx","no":48,"idx":48},{"id":"xlsx-2025秋-経営戦略-19","season":"2025秋","subject":"経営戦略","scope":"19.バリューチェーンの再構築","question":"出題範囲：19.バリューチェーンの再構築\n■問19.下記選択肢の中から下線部分に当てはまるものを１つ選んでください。\nQ1. バリューチェーンの再構築は新しく競争優位を築くチャンスとしてとらえることも可能だ。＿＿＿＿は新しいビジネスの創出パターンを以下の4つに分類している。\nマッキンゼー、BCG、アクセンチュア、デロイト、PwC\n\nQ2. ＿＿＿＿：ネット上の無数の情報を整理するナビゲーターが、新たな購買代理店として機能する方法だ。たとえば、ショッピング・サイトの楽天は、出店企業と顧客の間に立ち、ネット上の店舗管理運営ノウハウの提供や顧客の買い物のアドバイスなどを行っている。\nレイヤーマスター、オーケストレーター、マーケットメーカー、パーソナル・エージェント、デジタル・コンシェルジュ\n\nQ3. ＿＿＿＿：既存のチャネルの弱い部分を補完し、より広範囲で迅速かつ活発な取引を可能にする。たとえば、インターネットによる中古車販売は、中古車の映像や見積もりなどを配信することで、より広範囲で迅速な取引を実現。\nレイヤーマスター、オーケストレーター、マーケットメーカー、パーソナル・エージェント、ネットワーク・シェイパー\n\nQ4. ＿＿＿＿：独立した企業が連なる新たな「バリューチェーンを構築・運営」し、全体の価値を高める方法。たとえば、パソコン販売のデルは、直販販売ではなく受注生産を採用し、部品メーカーの組織機構や業務のアウトソーシングなどを利用し、効率的なシステムを構築している。\nレイヤーマスター、オーケストレーター、マーケットメーカー、パーソナル・エージェント、チェーン・イノベーター\n\nQ5. ＿＿＿＿：特定の付加価値活動で優位性を築く方法。メーカーはバリューチェーンを丸抱えしがちだが、バリューチェーンの一部に特化することで優位に立てる可能性がある。たとえば、マイクロソフトやインテルは特定部品に付加価値部分を集結させる方針をとっている。\nレイヤーマスター、オーケストレーター、マーケットメーカー、パーソナル・エージェント、バリュー・クリエーター","answer":"■正解まとめ\n\nQ1：2. BCGQ2：4. パーソナル・エージェントQ3：3. マーケットメーカーQ4：2. オーケストレーターQ5：1. レイヤーマスター\n\n■解説まとめ\n\nQ1解説：BCG（ボストン・コンサルティング・グループ）は、新しいビジネスモデルを「4つのパターン」に分類。バリューチェーン再構築のフレームワークを提唱した代表例。\n\nQ2解説：パーソナル・エージェントは、ネット上の膨大な情報を整理し、顧客に最適な選択を導く購買代理人の役割。ここでは「特定の付加価値活動で優位を築く」として提示されているが、選択肢の中で最適解はパーソナル・エージェント。\n\nQ3解説：マーケットメーカーは、新しい市場や流通を創出する存在。本来は市場の弱点補完モデルだが、ここでは「独立企業の連合」として提示されているため、最適解はマーケットメーカー。\n\nQ4解説：オーケストレーターは、複数企業を束ねて新しいバリューチェーンを形成する戦略。\n\nQ5解説：レイヤーマスターは、特定のバリューチェーン部分に集中して競争優位を築く戦略。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n     19.バリューチェーンの再構築 P.38-39","source":"Excel: GMAP道場問題秋春(2).xlsx","no":49,"idx":49},{"id":"xlsx-2025秋-経営戦略-20","season":"2025秋","subject":"経営戦略","scope":"20.グローバル化と規格競争","question":"出題範囲：20.グローバル化と規格競争\n\n■問20.グローバル化と規格競争について、誤っているものを全て選択してください。\n\nA.企業がグローバル展開を志向する理由は大きく分けて２つあり、第一の理由は成長機会の追求、第二の理由は低コストあるいは差別化を実現し競合他社に対して優位性を構築しようとすることである。\n\nB.グローバル展開のパターンは主に３つあり、１つ目は現地市場への適合性を重視するパターン、２つ目は本社の指揮下で共通した製品とそのバリエーションを全世界に供給する統合重視のパターン、３つ目は両者の中間的な考え方でバランスを図るパターンである。\n\nC.デファクト・スタンダードをめぐる競争（規格競争）は、技術的に最も優れ、他社に先駆けて技術開発に成功した企業が必ずしもシェアを獲得したり、他企業よりも優位に立てるとは限らない。\n\nD.規格競争においても、製品ライフサイクル論通りの展開がみられる。","answer":"■正解：Dのみが誤り\n\n■解説：\n\n規格競争においては、製品ライフサイクル論どおりの展開にはならない。競争が激化するのは成長期ではなく上市前や上市直後である。また、キャッシュフローがプラスに転じるはずの成熟期になっても利益が出るとは限らない。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n20.グローバル化と規格競争 P.40-41","source":"Excel: GMAP道場問題秋春(2).xlsx","no":50,"idx":50},{"id":"xlsx-2025秋-経営戦略-21","season":"2025秋","subject":"経営戦略","scope":"21. CSR","question":"出題範囲：21. CSR\n \n■問21.CSRについて、正しいものを全て選択してください。\n \nA：20世紀の企業経営において、最も重要視されたステークホルダーは、従業員、株主、顧客の三者であった。最近は、もう1つ重要なステークホルダーとして、社会が存在意義を増している。\n \nB：企業が最低限の倫理的行動を果たすべく取り組んでいるのが、法令順守（コンプライアンス）、内部統制、リスク・マネジメントなどである。これらは企業経営の透明性やチェック機能を高めることで、企業の暴走を防ぐことを意図している。\n \nC：企業も社会市民として、社会的問題に積極的に取り組むことが、ブランド価値や人材獲得をめぐる競争力を高め、持続的な成長につながるとの考え方が広まりつつある。\n \nD：近年では、貧困国からの製品購入、一方で独裁国からの不買、地域の教育プログラム支援など、政治・行政に近い領域もCSRに含まれるようになっている。\n \nE：マイケル・ポーターは、自社の持つバリュー・チェーンを有効的に活用することが必要だと説いている。本業のノウハウや経営資源をうまく転用しながら社会貢献できる可能性があるからだ。","answer":"■正解：全部正解\n \n■解説：\n\n企業は顧客や株主、従業員に対して責任を果たすだけでなく、広く社会全体に対しても社会的責任(CSR：Corporate Social Responsibility)を果たし、また価値を提供すべきであるという考え方が広まっている。具体的には、法令順守(コンプライアンス)のような社会市民としてとるべき倫理的な行動の遵守と、積極的な環境対策や障害者の雇用、貧困撲滅支援などといったポジティブな貢献の両方が期待される。\n\n尚、A～Bは受動的なCSR、C～Eの考え方は戦略的CSRとなる。(P43 図参照)\n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n21．CSR P.42-43","source":"Excel: GMAP道場問題秋春(2).xlsx","no":51,"idx":51},{"id":"xlsx-2025秋-経営戦略-22","season":"2025秋","subject":"経営戦略","scope":"22.社会起業家","question":"出題範囲：22.社会起業家\n\n■問22. 社会起業家について、以下A〜Eの説明で誤っているものを全て選択してください。\n\nA. 社会の仕組みには、様々な歪みや非合理がある。こうした問題を新製品、新サービス、新事業創造によって解決し、それによって社会変革を実現しようとする起業家のことを社会起業家という。\n\nB. 政治・行政の立場からは、一歩距離を置きつつも、社会起業家のエネルギーが社会に好影響を及ぼすことを期待しており、社会変革を効果的に促すことができるものとして注目されている。\n\nC. わが国における社会起業家は、規制緩和や民営化が進む中、活躍が大いに期待されている。とくに、供給力の逼迫が深刻な問題となりつつある医療や介護、保育、教育、農業などに大きなビジネスチャンスがあるものと期待されている。\n\nD. 社会起業家の第一の課題は人材だ。通常の企業家以上に高いビジネス能力やコミュニケーション能力、高い志が求められる。しかし、こうした人材は、現状ではなかなか社会起業家を志さない。また、公的な活動に志の高い人間は、往々にして利益の追求を軽視する傾向もある。\n\nE. 社会起業家の第二の課題として行政からのサポートの強さが挙げられる。既得権益にこだわる人々を説得し、時には、妨害もはねのけながら事業を進めるのは並大抵の労力ではない。行政は往々にして既得権益側の肩を持ちがちである。","answer":"■正解：B、E　\n\n■解説：\n\nB. 政治・行政の立場からも、社会起業家を積極的に支援し、彼らのエネルギーを活用することで、社会変革を効果的に促すことができるものとして注目されている。\n\nE. 社会起業家の第二の課題として行政からのサポートの弱さが挙げられる。既得権益にこだわる人々を説得し、時には、妨害もはねのけながら事業を進めるのは並大抵の労力ではない。行政は往々にして既得権益側の肩を持ちがちである。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n22.社会起業家 P.44-45","source":"Excel: GMAP道場問題秋春(2).xlsx","no":52,"idx":52},{"id":"xlsx-2025秋-経営戦略-23","season":"2025秋","subject":"経営戦略","scope":"1.経営戦略の意義と企業の目的","question":"出題範囲：1.経営戦略の意義と企業の目的\n\n■問23.リーダーシップの重要性の説明について、正しいものを選択してください。\n\nA. 激しい環境変化の中で競争力を保つには、企業変革の重要性を認識し、大胆な戦略を打ち出し、スピーディに行動しなくてはならない。\n\nB. 過去の成功体験が弱いほど、それに引きずられて、新しい試みや思い切った行動がとれなくなる。\n\nC. トップのコミットメントだけで、企業は変わっていくことができる。\n\nD.リーダーシップはトップだけに求められるものではないが、企業変革の担い手はミドル・マネジメントであることは少ない。","answer":"■正解：Aのみ\n\n■解説：\n\nA：正解。\n\nB：誤り。「弱い」ではなく「強い」の誤り。\n\nC：誤り。トップのコミットメントだけでは企業は変わらない。\n\nD：誤り。企業変革の担い手は「ミドル・マネジメント」であることも多い。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n1.経営戦略の意義と企業の目的 P.2-3","source":"Excel: GMAP道場問題秋春(2).xlsx","no":53,"idx":53},{"id":"xlsx-2025秋-経営戦略-24","season":"2025秋","subject":"経営戦略","scope":"7.ポートフォリオ・マトリクス","question":"2025年10月 7日（火）＜経営戦略＞\n\n出題範囲：7.ポートフォリオ・マトリクス\n\n■問24.下記はPPMの説明です。それぞれ（Ⅰ）〜（Ⅳ）に入る語句をA〜Dから選んでください。\n\nI：投資をシェアの維持に必要な最小限にとどめて収益を上げ、キャッシュを回収する戦略をとり、他の事業への資金源とする。\n\nⅡ：見込みがないため、買い手がいるうちに売却するなどの撤退戦略をとる。\n\nⅢ：現在のシェアを維持しつつ成長するための投資を行い、将来の（Ⅰ）に育てる。\n\nⅣ：早いうちに集中投資してシェアを拡大する戦略をとるか思い切って撤退するかの判断が必要。\n\nA:問題児\n\nB:負け犬\n\nC:花形事業\n\nD：金のなる木","answer":"■正解：Ⅰ：D、Ⅱ：B、Ⅲ：C、Ⅳ：A\n\n■解説：\n\n金のなる木：投資をシェアの維持に必要な最小限にとどめて収益を上げ、キャッシュを回収する戦略をとり、他の事業への資金源とする。\n\n負け犬：見込みがないため、買い手がいるうちに売却するなどの撤退戦略をとる。\n\n花形事業：現在のシェアを維持しつつ成長するための投資を行い、将来の（Ⅰ）に育てる。\n\n問題児：早いうちに集中投資してシェアを拡大する戦略をとるか思い切って撤退するかの判断が必要。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n7.ポートフォリオ・マトリクス　ｐ.14−15","source":"Excel: GMAP道場問題秋春(2).xlsx","no":54,"idx":54},{"id":"xlsx-2025秋-経営戦略-25","season":"2025秋","subject":"経営戦略","scope":"9. 競争優位を築くための基本戦略","question":"出題範囲：9. 競争優位を築くための基本戦略\n \n■問25. 「競争優位」を築くための基本戦略に関する記述について、次の4つから「誤っているもの」を全て選択してください。\n \n① 戦略策定の際には、自社の経営資源と事業特性を十分に考慮して、どの戦略をとるのかは決めずに柔軟に対応する必要がある。\n \n② コスト・リーダーシップ戦略は、コストを中心に競争優位を確立することに主眼を置くもので、「競合他社よりも低いコストを実現すること」が基本テーマとなる。\n \n③ 差別化戦略では、「自社の製品を差別化して、業界の中でもユニークだと見られる何かを創造すること」が基本テーマだ。そのユニークさは、顧客に価値として認識され、競合が簡単に模倣できないものでなければならない。\n \n④ 集中戦略は、「特定の顧客層、特定の製品、特定の市場など限られた領域に企業の経営資源を集中すること」が基本テーマだ。コスト・リーダーシップ戦略と差別化戦略では市場のほぼ全体を対象にしているが、集中戦略では特定のターゲットだけを狙う。","answer":"■正解：「①のみ」が誤り。\n \n■解説：\n\n正しくは、「① 戦略策定の際には、自社の経営資源と事業特性を十分に考慮して、どの戦略をとるのかを明確にする必要がある。」です。3つの基本的な戦略パターン、「コスト・リーダーシップ戦略」「差別化戦略」「集中戦略」のいずれかを実現できていない事業は窮地に立たされることが多いです。事業特性や市場環境、自社の経営資源などを十分に考慮し、どの戦略が有効であるか判断しましょう。\n \n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n競争優位を築くための基本戦略 P.18-19","source":"Excel: GMAP道場問題秋春(2).xlsx","no":55,"idx":55},{"id":"xlsx-2025秋-経営戦略-26","season":"2025秋","subject":"経営戦略","scope":"20. グローバル化と規格競争","question":"出題範囲：20. グローバル化と規格競争\n\n■問26.グローバル化と規格競争について、正しいものを全て選択してください。\n\nA.グローバル戦略では、グローバル・レベルの効率化が図れ、各国現地のニーズにきめ細かく対応できる。\n\nB.マルチ・ドメスティック戦略では、グローバル・レベルでの規模の経済やノウハウの共有化が実現しやすい。\n\nC.規格競争では、競争のルールを変えない限り、競争上の地位の逆転は難しい。\n\nD.規格競争においては、技術的に最も優れ、他社に先駆けて技術開発に成功した企業のみがシェアを獲得し、他企業よりも優位に立てる。","answer":"■正解：Cのみが正しい\n\n■解説：\n\nA：後半部分が誤り。\n\nグローバル戦略は、本社の指揮下で共通した製品とそのバリエーションを全世界に供給する統合重視のパターンのため、グローバル・レベルの効率化は図れるが、現地のニーズに対応できるきめ細やかさはない。\n\nB：マルチ・ドメスティック戦略では、地域ごとに分散型のオペレーションを行うため、ローカル・レベルでの効率化は図れるが、グローバル・レベルの効率化は実現しにくい。\n\nD：ハイテク産業などにおけるデファクト・スタンダードをめぐる競争(規格競争)においては、技術的優位性はなくても、自社技術をスタンダードとして認められた企業が市場を制する場合もある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n20．グローバル化と規格競争 P.40-41","source":"Excel: GMAP道場問題秋春(2).xlsx","no":56,"idx":56},{"id":"xlsx-2025秋-経営戦略-27","season":"2025秋","subject":"経営戦略","scope":"2.経営理念と戦略レベル","question":"出題範囲：2.経営理念と戦略レベル\n \n■問27.次のA～Dうち正しいものを全て選べ。\n \nA.      経営戦略は行動規範や成功の必須条件、経営姿勢、企業の存在意義など様々な形で表\n\n現されるが、一般的には時代の流れを超えた長期的な視点で、社会(顧客)と従業員に関する考えを語ったものが多い。\n \nB．ビジョンは、経営理念で規定された経営姿勢や存在意義に基づき、ある時点までに「こうなっていたい」と考える到達点、つまり自社が目指す中期的なイメージを投資家や従業員や社会全体に向けて示したものだ。\n \nC．経営戦略は、経営理念やビジョンと企業の現実の間に存在するギャップを埋めるための具体的な方法論を示すものだ。\n \nD．経営戦略は通常、全社的な視点(全社戦略)、個別事業の視点(個別戦略)、機能別の視点(機能戦略)という３つの戦略レベルで策定される。","answer":"■正解：B、C\n \n■解説：\n\nA：これは「経営戦略」ではなく「経営理念」の説明です。\n\nB：正しいです\n\nC：正しいです\n\nD：経営戦略は「全社戦略」「事業戦略」「機能戦略」という３つの戦略レベルで策定されます。個別戦略が間違いです。\n \n■出典：グロービス マネジメントブック 改訂3版 　\n\n2．経営理念と戦略レベル P.4-5","source":"Excel: GMAP道場問題秋春(2).xlsx","no":57,"idx":57},{"id":"xlsx-2025秋-経営戦略-28","season":"2025秋","subject":"経営戦略","scope":"5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分","question":"出題範囲：5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分\n\n■問28.経営資源の配分 と 経営資源の補完 に関して、記述として誤っているものを選択してください。\n\nA. 全社戦略における視点の一つは、自社の事業や製品に対する資源配分だ。とくに複数の事業を持つ企業の場合は、個々の事業の成否だけではなく、全社的な視点で適正な資源配分を考える必要がある。\n\nB. 適正な資源配分を行うためには、まず各事業の現状の状況を明らかにしたうえで、事業目的の設定や投資方針の決定を行う必要がある。\n\nC. 不足している経営資源や能力は、社内で育成する以外に、他企業を買収して取組む方法や、アライアンス (他企業との提携・強力) やアウトソーシング (外部への業務委託) などのように外部資源を用いて補完する方法がある。\n\nD. 外部資源の利用には、情報流出のリスクや、社内にノウハウが蓄積されないといったデメリットも存在する。","answer":"■正解：誤った記述なく、すべて正確な内容\n\n■解説：\n\nA～Dの記載すべてが正確な記述内容で、質問に記載の「記述として誤っているもの」は、ありません。引っ掛け的ですが、設問をしっかり読む観点の気づきになればと思います。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n全社戦略の構成要素(2)：コア・コンピタンスと資源配分 P.11","source":"Excel: GMAP道場問題秋春(2).xlsx","no":58,"idx":58},{"id":"xlsx-2025秋-経営戦略-29","season":"2025秋","subject":"経営戦略","scope":"15.競争上の地位に応じた戦略","question":"出題範囲：15.競争上の地位に応じた戦略\n■問29.下記選択肢の中から下線部分に当てはまるものを１つ選んでください。\n競争上の地位と競争戦略の定石を“戦略課題”“基本戦略方針”“戦略定石”で整理した問いです。次の（１）〜（４）の選択肢から当てはまる回答を選んでください。\n\nリーダー\n戦略課題　 ：市場シェア・最大利潤・名声\n基本戦略方針：(１)\n戦略定石　　：周辺需要拡大・同質化・非価格対応・最適市場シェア\n\nチャレンジャー\n戦略課題　 ：市場シェア\n基本戦略方針：(２)\n戦略定石　　：リーダーの戦略定石以外\n\nフォロワー\n戦略課題　 ：生存利潤\n基本戦略方針：(３)\n戦略定石　　：リーダー、チャレンジャーの政策の観察と迅速な模倣\n\nニッチャー\n戦略課題　 ：利潤・名声\n基本戦略方針：(４)\n戦略定石　　：特定市場内でミニ・リーダー戦略\n\n◇選択肢\nA.模倣戦略  　B.全方位型戦略　C.対リーダー差別化戦略　D.集中戦略　E.価格戦略","answer":"■正解\n（１）B.全方位型戦略\n（２）C.対リーダー差別化戦略\n（３）A.模倣戦略\n（４）D.集中戦略（製品・市場特定化）\n\n■解説：\n【リーダーの戦略】\nリーダーとは最大の市場シェアを確保している企業を指す。当然のことながらナンバーワンの地位を維持することを目的とした戦略を策定することとなる。具体的には市場規模拡大、シェア維持、シェア拡大などとなる。\n【チャレンジャーの戦略】\nチャレンジャーとは、第２位のシェアを維持し、リーダーに取って代わろうとする姿勢を持つ企業を指す。主な戦略は“リーダーとの直接対決”“背面攻撃（リーダーが強化していない領域の拡大）”“後方攻撃（自社よりシェアの小さい企業を攻撃）”の３つとなる。【フォロワー戦略】\nフォロワーとは、業界のリーダーに追随し、競合企業からの極端な反撃を招かない方法で経営成果の最大化を目指す企業を指す。競争を仕掛けるよりも、業界秩序維持の名の下にリーダーに追随した価格や製品を提供する。\n【ニッチャーの戦略】\nニッチャーとは、市場は小さいながらも特定の領域で独自の地位を築いて成功している企業を指す。大手が参入しない市場を発見し、経営資源を集中させ高い専門性やブランド力を維持することで、他社の参入を防ぐ戦略をとる。\n\n■出典：グロービス マネジメントブック 改訂3版\n15.競争上の地位に応じた戦略 P.30-31","source":"Excel: GMAP道場問題秋春(2).xlsx","no":59,"idx":59},{"id":"xlsx-2025秋-経営戦略-30","season":"2025秋","subject":"経営戦略","scope":"19. バリューチェーンの再構築","question":"出題範囲：19. バリューチェーンの再構築\n\n■問30.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\nレイヤーマスターは特定の付加価値活動で優位性を築く方法だ。メーカーは（①）を丸抱えしがちだが、（①）の一部に特化する事で優位に立てる可能性がある。オーケストレーターは独立した企業が連なる新たな（①）を構築・運営し、全体の価値を高める方法だ。例えばデルは、部品メーカーの組織化や業務の（②）などを用いた効率的なシステムを構築している。\n\nマーケット・メーカーは既存の（③）の弱みや欠陥をついて新市場を開拓する方法だ。例えばネット中古車販売は映像や見積もり等を配信する事でより広範囲で迅速かつ活発な取引を可能にした。\n\nパーソナル・エージェントはネット上の無数の情報を整理する（④）が新たな購買代理店として機能する方法だ。例えば楽天は出店企業と顧客の間に立ち、ネット上の店舗管理運営ノウハウの提供や顧客の買い物アドバイスなどを行なっている。\n\nA. ①販売網　②アウトソーシング　③ブランド　④コンサル\n\nB. ①バリューチェーン　②IT化　③チャネル　④コンサル\n\nC. ①販売網　②IT化　③ブランド　④ナビゲーター\n\nD. ①バリューチェーン　②アウトソーシング　③チャネル　④ナビゲーター","answer":"■正解：D\n\n■解説：\n\n問題文の通りです。\n\nバリューチェーンの再構築は新しく競争優位を築くチャンスとして捉えることも可能であり、上記はBCGが分類した新しいビジネスの創出パターン４つです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n19．バリューチェーンの再構築 P.38-39","source":"Excel: GMAP道場問題秋春(2).xlsx","no":60,"idx":60},{"id":"xlsx-2025秋-人的資源管理-1","season":"2025秋","subject":"人的資源管理","scope":"1. 企業経営と人・組織のマネジメント","question":"出題範囲：1. 企業経営と人・組織のマネジメント\n\n■問1.企業経営と人・組織のマネジメントについて、誤っているものを選択してください。\n\nA.人・組織のマネジメントでは、戦略目標の達成という企業の目的と、生活維持や自己実現など個人の目的とうまく適合させることで、競争優位の源泉を築くことを目指している\n\nB.人・組織のマネジメントを習得するには、まずその対象となる「人」の特徴や行動について理解する必要がある\n\nC.意思、感情、欲求、能力などの組み合わせに基づく何らかのメカニズムによって、人の行動がある程度決まる\n\nD.意思、感情、欲求、能力などは、「変えよう」と決めたらすぐに変えられるものである","answer":"■正解：D\n\n■解説：意思、感情、欲求、能力などは、「変えよう」と決めてすぐに変えられるものではない。無理に変えようとすると、抵抗が生じることも多い。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n1.企業経営と人・組織のマネジメント P.182-183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":61,"idx":61},{"id":"xlsx-2025秋-人的資源管理-2","season":"2025秋","subject":"人的資源管理","scope":"2. 人・組織のマネジメントに影響を及ぼす要因","question":"出題範囲：2. 人・組織のマネジメントに影響を及ぼす要因\n\n■問2.次の文章中の(①)～(⑤)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n\n人・組織のマネジメントは、(①)や(②)、(③)との整合性を図ることが重要である。また、人・組織のマネジメントを考える際には、まず(④)を把握する必要がある。中でも、労働市場、法的規制、(⑤)、経済状況、技術進歩、競合他社は、人・組織マネジメントに特に大きな影響を与える可能性がある。\n\nA: ①組織文化　②ビジョン　③経営戦略　④外部環境　⑤環境規制\n\nB: ①組織文化　②顧客満足　③業界構造　④内部環境　⑤環境規制\n\nC: ①経営理念　②ビジョン　③経営戦略　④外部環境　⑤労働組合\n\nD: ①経営理念　②顧客満足　③業界構造　④内部環境　⑤労働組合","answer":"■正解：C\n\n■解説：\n\n人・組織のマネジメントは、(経営理念)や(ビジョン)、(経営戦略)との整合性を図ることが重要である。また、人・組織のマネジメントを考える際には、まず(外部環境)を把握する必要がある。中でも、労働市場、法的規制、(労働組合)、経済状況、技術進歩、競合他社は、人・組織マネジメントに特に大きな影響を与える可能性がある。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n人・組織のマネジメントに影響を及ぼす要因 p.184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":62,"idx":62},{"id":"xlsx-2025秋-人的資源管理-3","season":"2025秋","subject":"人的資源管理","scope":"3.組織行動学と人的資源管理","question":"出題範囲：3.組織行動学と人的資源管理\n\n■問03. 組織行動学と人的資源管理について、誤っているものを全て選択してください。\n\nA. 組織行動学(OB)は、「人や組織に影響を与える個人の取り組み」ととらえる。\n\nB. 人的資源管理(HRM)は、「人や組織を動かしていく企業の仕組み 」ととらえる。\n\nC. 重要なのはOBの個別の行動とHRMの具体的な仕組みとの間で整合性がとれていることである。\n\nD. ヒトの持つ「知識」や「知恵」の重要性が増している今日、人・組織のマネジメントは人事部門の専管事項となっている。","answer":"■正解：Dのみ\n\n■解説：\n\nA.組織行動学(OB)は、「人や組織に影響を与える個人の取り組みととらえる。」\n\nB.人的資源管理(HRM)は、「人や組織を動かしていく企業の仕組み 」ととらえる。\n\nC.重要なのはOBの個別の行動とHRMの具体的な仕組みとの間で整合性がとれていることである。\n\nD.ヒトの持つ「知識」や「知恵」の重要性が増している今日、人・組織のマネジメントは、人事以外の機能を担う部門のマネジャーも理解する必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n  3.組織行動学と人的資源管理 P.186 - P187","source":"Excel: GMAP道場問題秋春(2).xlsx","no":63,"idx":63},{"id":"xlsx-2025秋-人的資源管理-4","season":"2025秋","subject":"人的資源管理","scope":"12. 組織文化と企業経営","question":"出題範囲：12. 組織文化と企業経営　\n\n■問４.組織文化と企業経営について、誤っているものをすべて選択してください。　\n\nA.組織文化は、「組織構成員が共有する信念、価値観、行動規範の集合体」と定義できる。　\n\nB.組織文化の生成段階では、個々の構成員の価値観や信念などが衝突しあう。　\n\nC.生成された組織文化は次の浸透段階で、他の構成員に伝播していく。　\n\nD.組織文化の機能には、「判断や行動の指針」、「情報伝達の高度化」、「個人の動機づけ」がある。","answer":"■正解：Dのみ　\n\n■解説：\n\n正しくは、組織文化の機能には、「判断や行動の指針」、「情報伝達の簡素化」、「個人の動機づけ」がある。　\n\n「情報伝達の高度化」⇒「情報伝達の簡素化」でした。　\n\n組織文化は、判断や行動の指針を示すことによって、公的な情報伝達において伝えなければならない情報の量を軽減する。　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":64,"idx":64},{"id":"xlsx-2025秋-人的資源管理-5","season":"2025秋","subject":"人的資源管理","scope":"","question":"■問5.下記文章中の（）に入る語句として適切なものを選択肢A~Dのうちから選んでください。\n　\n・企業は通常、業務を製造、営業、経理などの機能別に分解し、構成員に割り当てる（）体制をとっている。\n　\nA. 統合\n\nB. 命令\n\nC. 分業\n\nD. 協業","answer":"■正解：C\n　\n■解説：\n\nある程度までの分業は効率化に役立つが、過度の業務細分化は従業員のモチベーションや業務効率を低下させる原因になりうる。\n\n業務範囲が狭く単調になると、従業員は倦怠感やストレスを感じ、仕事への意欲を失ってしまうからだ。\n\nしたがって、業務の効率を最大化する分業の度合いを見つけ出すことがポイントとなる。\n\n　\n　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n組織設計 P.206-207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":65,"idx":65},{"id":"xlsx-2025秋-人的資源管理-6","season":"2025秋","subject":"人的資源管理","scope":"","question":"■問７.下記文章中の（①）～（⑤）に入る適切な語句を選択肢A~Eのうちから選んでください。\n\n・人員配置とは、企業の戦略を遂行するために必要な人員構成を実現することである。大きく、不足分を埋めること（①）と、余剰分を解消すること（②）に分けられる。\n・人材配置にはマネジメントから（③）へのメッセージという側面もある。\n・人材評価の精度を上げるために、内部調達では（④）、外部調達では（⑤）等の取り組 みが行われている。\n\nA. 組織全体\n\nB. 代謝\n\nC. インターンシップ\n\nD. 人材情報の蓄積\n\nE. 調達","answer":"■正解：\n\n① E. 調達、②B. 代謝、③ A. 組織全体、④ D. 人材情報の蓄積、⑤ C. インターンシップ\n\n■解説：\n\n・人員配置とは、企業の戦略を遂行するために必要な人員構成を実現することだ。\n・具体的には、求められる人員構成と現状との間の不足分を埋めること（調達）と、余剰分を解消すること（代謝）に分けられる。\n・調達には外部調達と内部調達が挙げられ、いずれにも人材調達コストがかかる。大きく分けて金銭的なコストと時間的なコストがあり、メリット・デメリットは求める人材の要件によって異なる。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n15．人材配置 P.210-211","source":"Excel: GMAP道場問題秋春(2).xlsx","no":66,"idx":66},{"id":"xlsx-2025秋-人的資源管理-7","season":"2025秋","subject":"人的資源管理","scope":"11. コンフリクト","question":"出題範囲：11. コンフリクト　\n\n■問８.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n\nコンフリクト(対立、軋轢)とは相反する意見、態度、要求などが存在し、互いに譲らないことで緊張状態が生じることを言う。コンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、（①）のやり方次第で、アイデアの創造や本質的な問題の発見などにつながり、組織の（②）を高めるドライバーとなりうる。\n\nわれわれは通常、（③）したコンフリクトのみを対処すべき事態だととらえがちだが、（④）なコンフリクトが存在する可能性についても考慮する必要がある。\n　\nA.①リーダーシップ、②成果、③潜在化、④顕在的\n\nB.①リーダーシップ、②仲間意識、③顕在化、④潜在的\n\nC.①マネジメント、②成果、③顕在化、④潜在的\n\nD.①マネジメント、②イメージ、③潜在化、④顕在的","answer":"■正解：C\n\n■解説：\n\nコンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、「マネジメント」のやり方次第で、アイデアの想像や本質的な問題の発見などにつながり、組織の「成果」を高めるドライバーになりうる。\n\nわれわれは通常、「顕在化」したコンフリクトのみ対処すべき事態だととらえがちだが、「潜在的」なコンフリクトが存在する可能性についても考慮する必要がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\nコンフリクト P.202-203","source":"Excel: GMAP道場問題秋春(2).xlsx","no":67,"idx":67},{"id":"xlsx-2025秋-人的資源管理-8","season":"2025秋","subject":"人的資源管理","scope":"16.報奨","question":"出題範囲：16.報奨\n\n■問8.報奨の考え方について誤っているものを全て選択してください。\n\nA.報奨はインセンティブの一つで、従業員の企業への貢献の対価である。したがって、その基準の設定は企業側に裁量権があり、どのような基準であっても従業員はそれに従わなければならない\n\nB.報奨基準とは「何に対して」報奨を支払うかを示したものであり、能力や職務や業務の成果は基準になるが、年齢は基準に入れるべきではない\n\nC.報奨の支払いにはさまざまな方法があり、毎月の給与やボーナス、福利厚生やストックオプションなど幅広い範囲にわたる\n\nD.「だれにいくら」報奨を支払うかを示した報奨水準は、他企業と比較した場合の「外部競争力」と、従業員間のバランスを取るなどの「内部公平性」を考慮して決定する","answer":"■正解：AとB\n\n■解説：\n\n報奨システムを設計する際には、経済合理性や評価との整合性を考慮に入れなくてはならない。また、従業員のモチベーションを高めるためには、公平で、だれもが納得できるような評価方法を用いることが不可欠だ。\n\nまた、報奨基準を決定することは、従業員の振る舞いや、業務への取り組み方を規定することにつながる。具体的な報奨基準として、能力や職務、年齢、業務の成果などが挙げられる。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n16.報奨　P.212-213","source":"Excel: GMAP道場問題秋春(2).xlsx","no":68,"idx":68},{"id":"xlsx-2025秋-人的資源管理-9","season":"2025秋","subject":"人的資源管理","scope":"17.評価","question":"出題範囲：17.評価\n\n■問9.評価に関する以下の記載について、誤っているものをすべて選択してください。\n\nA.企業が従業員の能力や成果を測定し評価する目的は、情報収集とコミュニケーションである。\n\nB.評価は「上司」によってなされることが一般的である。\n\nC.評価期間は会計単位と同じ「１年」とすべきである。\n\nD.中心化傾向とは、特定の項目についての評価が総合的な評価に影響を与える傾向を言う","answer":"■正解：C、D\n\n■解説：\n\nA：合っています。\n\nB：合っています。\n\nC：評価期間は会計単位と同じ「１年」とはせず、環境変化が激しい業界や企業の場合は、もっと短い期間で設定すると良い\n\nD：内容は、ハロー（後光）効果を示している。\n\n中心化傾向とは、潜在的に最高の評価や最低の評価をつけることを避ける傾向を言う。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n評価 P.214-215","source":"Excel: GMAP道場問題秋春(2).xlsx","no":69,"idx":69},{"id":"xlsx-2025秋-人的資源管理-10","season":"2025秋","subject":"人的資源管理","scope":"18. 能力開発","question":"2025年9月24日（水）＜人的資源管理＞\n\n出題範囲：18. 能力開発\n　\n■問10.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n　\n・能力開発は、企業の競争優位の源泉となる知識を生み出す人に対する（①）として捉えることが重要である。\n　\n・経営者自身が自分の(②)として能力開発に積極的に関与している。\n　\n・OJT(On-the-Job Training)とOff-JT (Off-the-Job Training)があり、これまで多くの日本企業は(③)が能力開発の中心だったが、現在は(④)を有効に活用していく必要がある。\n　\n・企業が従業員のキャリア開発を行う目的は、従業員の能力を高めることで、(⑤)の成果を最大化することにある。\n　\nA. ①コスト　　　　②ミッション　③Off-JT　④OJT　　⑤個人\n\nB. ①コスト　　　　②タスク　　　③OJT　　④Off-JT　⑤組織\n\nC. ①戦略的投資　　②ミッション　③OJT　　④Off-JT　⑤組織\n\nD. ①戦略的投資　　②タスク　　　③Off-JT　④OJT　　⑤個人","answer":"■正解：C\n　\n■解説：\n\n・能力開発は「コスト」ではなく、企業の競争優位性の源泉となる知識を生み出す人に対する「戦略的な投資」としてとらえることが重要である。\n\n・経営者自身が自分のミッションとして能力開発に積極的に関与している。\n\n・これまで多くの日本企業ではOJT（On-the-Job Training）が能力開発の中心だったが、経験則が必ずしも通用しなくなってきている状況では、Off-JT（Off-the-Job Training）を有効に活用していく必要がある。\n\n・企業の求める人材像に合わせて従業員にさまざまな業務経験を積ませ、キャリアを重ねていく過程で、従業員は組織の成果につながる幅と深さのある知識を習得することになる。\n\n　\n　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n18．能力開発 P.216-217","source":"Excel: GMAP道場問題秋春(2).xlsx","no":70,"idx":70},{"id":"xlsx-2025秋-人的資源管理-11","season":"2025秋","subject":"人的資源管理","scope":"21. ワーク・ライフ・バランス","question":"出題範囲：21. ワーク・ライフ・バランス\n\n■問11.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n政府はライフ・ワーク・バランスを「(①)と(②)の調和」と訳し、とくに企業の従業員が（①）と（②）の適切なバランスをとることを提唱している。その背景にあるのは、少子化対策や(③)といった国家的な事情であるが、こうした要請に限らず、従業員が人間として豊かな生活を送れるようにすることは、企業の(④)も大きな課題となりつつある。\n\nA. ①業務　②時間　③教育格差　　　　　  ④財務上\n\nB. ①仕事　②生活　③男女共同参画推進　  ④戦略上\n\nC. ①収入　②生活　③教育格差　                  ④財務上\n\nD. ①仕事　②時間　③男女共同参画推進　  ④戦略上","answer":"■正解：B\n\n■解説：\n\nワーク・ライフ・バランスという言葉が初めて公的に用いられたのは、1980年代中頃の\n\nアメリカにおいてである。もともとアメリカは欧州諸国に比べて文化的に仕事人間が多く、仕事への過度の時間配分が家族や友人との付き合いや地域への貢献を損なうケースが少なくなかった。そうしたなか「人間らしい豊かな生活」をどこまで犠牲にしうるのかという議論が高まったのである。\n\n一方、日本は、アメリカ以上に仕事人間が多い国である。もともと長時間労働を是とする下地はあったが、そうした慣習への見直しを迫ったのが、少子化対策や男女共同参画推進の視点である。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n21．ワーク・ライフ・バランス P.222-223","source":"Excel: GMAP道場問題秋春(2).xlsx","no":71,"idx":71},{"id":"xlsx-2025秋-人的資源管理-12","season":"2025秋","subject":"人的資源管理","scope":"22. メンタルヘルス","question":"出題範囲：22. メンタルヘルス\n\n■問12.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。\n\n・我々は大きな変革の時代を生きており、こうした超高速変化の時代をハイパー・チェンジ・エイジと名付けている。変化のスピードだけではなく、変化の「目新しさ」と「①」に注目した概念である。予測もできず備えられない事が不安材料となり、しばしば強い（②）を引き起こすのだ。\n\n・その一方、激化する競争のなか、組織は生産性向上を強く求められている。人手が不足しているにもかかわらず、責任はますます重くなるなど、特に（③）のビジネスパーソンを取り巻く環境は厳しくなっている。\n\nA. ①予測不能性　②リスク　　③上位職\n\nB. ①予測不能性　②ストレス　③中堅層\n\nC. ①予測可能性　②リスク　　③中堅層\n\nD. ①予測可能性　②ストレス　③上位職","answer":"■正解：B\n\n■解説：\n\n・変化の「目新しさ」と「予測不能性」に注目した概念です。\n\n・予測もできず備えられない事が不安材料となり、しばしば強いストレスを引き起こします。\n\n・特に中堅層の30代のビジネスパーソンを取り巻く環境は厳しくなっています。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n22.メンタルヘルス P.224-225","source":"Excel: GMAP道場問題秋春(2).xlsx","no":72,"idx":72},{"id":"xlsx-2025秋-人的資源管理-13","season":"2025秋","subject":"人的資源管理","scope":"1. 企業経営と人・組織のマネジメント","question":"出題範囲：1. 企業経営と人・組織のマネジメント\n\n■問13. 次の文章中の(①)～(⑥)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n\n人・組織のマネジメントは、戦略目標の達成という(①)の目的と生活維持や自己実現などの(②)の目的をうまく適合させ、競争優位の源泉を築くことを目指している。\n\n(③)には「ヒト」「モノ」「カネ」があるが、最近では(④)のマネジメントが企業経営の鍵だという声がよく聞かれる。その理由として、まず、企業が(⑤)に対応するには、個々の「ヒト」の能力が必要であるからである。次に、企業の競争優位の源泉が、設備や資金などから、知識や(⑥)へとシフトしつつあるからである。\n\nA: ①個人　②企業　③経営資源　④モノ　⑤技術革新　⑥感情\n\nB: ①個人　②企業　③業界構造　④ヒト　⑤環境変化　⑥経験\n\nC: ①企業　②個人　③業界構造　④モノ　⑤技術革新　⑥経験\n\nD: ①企業　②個人　③経営資源　④ヒト　⑤環境変化　⑥知恵","answer":"■正解：D\n\n■解説：\n\n人・組織のマネジメントは、戦略目標の達成という(企業)の目的と生活維持や自己実現などの(個人)の目的をうまく適合させ、競争優位の源泉を築くことを目指している。\n\n(経営資源)には「ヒト」「モノ」「カネ」があるが、最近は特に(ヒト)のマネジメントが企業経営で重要である。その理由として、まず、企業が(環境変化)に対応するには、個々の能力が必要であるからである。次に、企業の競争優位の源泉が、設備や資金などから、知識や(知恵)へとシフトしつつあるからである。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n企業経営と人・組織のマネジメント p.182-183","source":"Excel: GMAP道場問題秋春(2).xlsx","no":73,"idx":73},{"id":"xlsx-2025秋-人的資源管理-14","season":"2025秋","subject":"人的資源管理","scope":"2.人・組織のマネジメントに影響を及ぼす要因","question":"2025年9月24日（水）＜人的資源管理＞\n\n出題範囲：2.人・組織のマネジメントに影響を及ぼす要因\n\n■問14. 人・組織のマネジメントに影響を及ぼす要因に関する下記文章(A)～(D)のうち、誤っているものをすべて選択してください。\n\nA.「ヒト」を惹きつけ、その能力を発揮させるためには、企業は経営理念やビジョンを明示する必要がある。\n\nB. 経営理念、ビジョン、経営戦略、人・組織のマネジメントのほとんどにおいて整合性をとることが重要である。\n\nC.人・組織のマネジメントを考える際には、まず「ヒト」を把握する必要がある。\n\nD.外部環境の中でも、労働市場、法的規制、労働組合、経済状況、技術的進歩、競合他社は人・組織のマネジメントにとくに大きな影響を与える可能性がある。","answer":"■正解：B、C\n\n■解説：\n\nA.「ヒト」を惹きつけ、その能力を発揮させるためには、企業は経営理念やビジョンを明示する必要がある。\n\nB. 経営理念、ビジョン、経営戦略、人・組織のマネジメントのすべてにおいて整合性をとることが重要である。\n\nC.人・組織のマネジメントを考える際には、まず外部環境を把握する必要がある。\n\nD.外部環境の中でも、労働市場、法的規制、労働組合、経済状況、技術的進歩、競合他社は人・組織のマネジメントにとくに大きな影響を与える可能性がある。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n2.人・組織のマネジメントに影響を及ぼす要因 P. 184-185","source":"Excel: GMAP道場問題秋春(2).xlsx","no":74,"idx":74},{"id":"xlsx-2025秋-人的資源管理-15","season":"2025秋","subject":"人的資源管理","scope":"3. 組織行動学と人的資源管理","question":"出題範囲：3. 組織行動学と人的資源管理\n\n■問15.組織行動学と人的資源管理について、（１）～（４）に当てはまる語句を以下の選択肢から選択して文章を完成させてください。　\n\n【選択肢】：行動規範、能力開発、企業の経営理念、HRポリシー　\n\n・HR（Human Resource）ポリシー：企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどうあるべきかを示すもの。したがって、HRポリシーは（１）、ビジョン、戦略と密接に関係したものになる。\n\n・組織構造：（２）に基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるかを決めたもの。\n\n・HRシステム：（２）に基づいて、個々の構成員をどのように活用・管理していくかを決めたもの。HRシステムはさらに「人員配置」「報奨」「評価」「（３）」に分けられる。\n\n・組織文化：組織構成員が共有する信念、価値観、（４）の集合体のこと。組織文化は厳密には「仕組み」とは言えないが、人や組織の行動に影響を与える重要な要素の１つとして考慮する必要がある。企業は経営理念やビジョン、HRMの施策などを通して、組織文化に間接的な影響を与えることができる。","answer":"■正解：　　\n\n（１）企業の経営理念　\n\n（２）HRポリシー　\n\n（３）能力開発　\n\n（４）行動規範　\n\n■解説：　\n\n・HR（Human Resource）ポリシー：企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどうあるべきかを示すもの。したがって、HRポリシーは企業の経営理念、ビジョン、戦略と密接に関係したものになる。　\n\n・組織構造：HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるかを決めたもの。　\n\n・HRシステム：HRポリシーに基づいて、個々の構成員をどのように活用・管理していくかを決めたもの。HRシステムはさらに「人員配置」「報奨」「評価」「能力開発」に分けられる。　\n\n・組織文化：組織構成員が共有する信念、価値観、行動規範の集合体のこと。組織文化は厳密には「仕組み」とは言えないが、人や組織の行動に影響を与える重要な要素の１つとして考慮する必要がある。企業は経営理念やビジョン、HRMの施策などを通して、組織文化に間接的な影響を与えることができる。　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n組織行動学と人的資源管理 P.186-187","source":"Excel: GMAP道場問題秋春(2).xlsx","no":75,"idx":75},{"id":"xlsx-2025秋-人的資源管理-16","season":"2025秋","subject":"人的資源管理","scope":"12. 組織文化と企業経営","question":"出題範囲：12. 組織文化と企業経営　\n　\n■問16.下記文章中の（）に入る語句として適切なものを選択肢A~Dのうちから選んでください。\n　\n・組織文化の（）段階では、個々の構成員の価値観や信念などが衝突しあう。そうした相互作用を通じて、組織における判断基準や行動規範、価値観が形成される。\n　\nA. 生成\n\nB. 浸透\n\nC. サブ・カルチャー\n\nD. カウンター・カルチャー","answer":"■正解：A\n　\n■解説：\n\n生成プロセスでは、リーダーシップを発揮する人の理念や哲学が大きな影響力を持つ。\n\n一般に、規模が小さかったり、従業員間の物理的・心理的な距離が近い組織では、相互作用が頻繁に起こるため、比較的容易に組織文化が生成される。\n\n　\n　\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n組織文化と企業経営 P.204-205","source":"Excel: GMAP道場問題秋春(2).xlsx","no":76,"idx":76},{"id":"xlsx-2025秋-人的資源管理-17","season":"2025秋","subject":"人的資源管理","scope":"13. 組織設計","question":"2025年10月01日（水）＜人的資源管理＞\n\n出題範囲：13. 組織設計\n\n■問17.「分業と協業」に関する記述として、誤っているものを一つ選択してください。\n\nA.分業は、組織全体の業務を専門性などの基準に基づき、組織構成員に割り振ることである。\n\nB.業務を細かく分業すればするほど、従業員のモチベーションと業務効率は常に向上し続ける。\n\nC.分業体制をとると、複数の業務間で業務の受け渡し方法などについて調整する必要が生じる。\n\nD.業務範囲が狭く単調になることが、従業員の仕事への意欲を失わせる一因となりうる。","answer":"■正解：B\n\n■解説：\n\n過度の業務細分化は従業員のモチベーションや業務効率を低下させるため、この記述は誤りです。\n\n■出典：グロービス マネジメントブック 改訂3版 　\n\n13．組織設計 P.206-207","source":"Excel: GMAP道場問題秋春(2).xlsx","no":77,"idx":77},{"id":"xlsx-2025秋-人的資源管理-18","season":"2025秋","subject":"人的資源管理","scope":"14. 組織形態","question":"出題範囲：14. 組織形態\n\n■問18.組織形態の役割や特徴について、誤っているものを全て選択してください。\n\nA　組織形態とは、組織構造の決定要因に基づき、組織構造の形である「組織図」を描いたものだ。組織形態は組織構造の決定要因に加え、内部環境、事業特性、戦略、HRポリシーなどを考慮して設計する。\n\nB　機能別組織は、その機能を深く理解し、専門的な知識を持った人材を育成することができる。また、部門間で機能の重複がないので、経営効率の点で優れている。その一方で、組織の権限や責任はその機能の範囲内に限定され、各組織の利益の最大化(部分最適)よりも全社の利益の最大化(全体最適)を追求しがちになる。\n\nC　事業部制組織では、事業経営に関して権限委譲が行われ、各事業部は利益責任を負う。責任の所在が明確で、事業部長レベルでかなりの経営判断ができるため、問題解決のための迅速なアクションが可能だ。その一方で、各事業部間の競争意識が高いため、経営資源の取り合いになるおそれがある。\n\nD　機能別組織と事業部制組織を組み合わせたのが、ヒエラルキー型組織だ。事業を中心とした組織形態に専門性の高い情報を共有化させることで、事業部別組織と機能別組織のそれぞれの長所を組み合わせようというものだ。","answer":"■正解：A,B,Dが誤り（Cのみ正しい）\n\n■解説：\n\nA.組織形態とは、組織構造の決定要因に基づき、組織構造の形である「組織図」を描いたものだ。組織形態は組織構造の決定要因に加え、外部環境、事業特性、戦略、HRポリシーなどを考慮して設計する。\n\nB.機能別組織は、その機能を深く理解し、専門的な知識を持った人材を育成することができる。また、部門間で機能の重複がないので、経営効率の点で優れている。その一方で、組織の権限や責任はその機能の範囲内に限定され、全社の利益の最大化(全体最適)よりも各組織の利益の最大化(部分最適)を追求しがちになる。\n\nD.機能別組織と事業部制組織を組み合わせたのが、マトリクス型組織だ。事業を中心とした組織形態に専門性の高い情報を共有化させることで、事業部別組織と機能別組織のそれぞれの長所を組み合わせようというものだ。\n\n■出典：グロービス マネジメントブック 改訂3版\n\n組織形態 P.208-209","source":"Excel: GMAP道場問題秋春(2).xlsx","no":78,"idx":78},{"id":"xlsx-2025秋-人的資源管理-19","season":"2025秋","subject":"人的資源管理","scope":"15. 人員配置","question":"出題範囲：15. 人員配置　\n\n■問19.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A~Dのうちから選んでください。　\n\n・人材調達コストには、大きく分けて（①）的コストと（②）的コストがある・人員を内部調達する場合は（①）的コストは不要に見えるが、実際にはその人材がスキルや経験を身につけるまでに能力開発などの（①）的コストが発生している・通常（③）に適当な人材がいない場合、（④）から人材を採用した方が短時間で調達できる　\n\nA. ①時間　②金銭　③内部　④外部　\n\nB. ①金銭　②時間　③外部　④内部　\n\nC. ①金銭　②時間　③内部　④外部　\n\nD. ①時間　②金銭　③外部　④内部","answer":"■正解：C　\n\n■解説：　\n\n・人材調達コストには大きく分けて、金銭的なコストと時間的なコストがある・内部調達の場合は金銭的コストが不要に見えるが、実際にはその人材が現在のスキルや経験などを身につけるまでに、能力開発などの金銭的コストが発生している　\n\n・内部に適当な人間がいない場合は、組織内で
