組織文化の摩擦が致命的な問題となりやすいが、アライアンスはM&Aほど致命的ではない。\nD. M&Aは解消が困難だが、アライアンスは解消が容易(結束が弱い)。","answer":"■正解：A.とB.\n■解説：\nA. M&Aは時間・資金を要するが、アライアンスは時間・資金をそれほど要さない。\nB. M&Aは事後にスピーディな意思決定が可能だが、アライアンスは事後の意思決定に時間がかかる場合がある。\nC. M&Aは組織文化の摩擦が致命的な問題となりやすいが、アライアンスはM&Aほど致命的ではない。\nD. M&Aは解消が困難だが、アライアンスは解消が容易(結束が弱い)。\n■出典：グロービス マネジメントブック 改訂3版\n18.M&Aとアライアンス P.36-37","source":"Word: GMAP道場2026春 (1)(1).docx","no":455,"idx":455},{"id":"docx-2026春-経営戦略-eb904718","season":"2026春","subject":"経営戦略","scope":"17.戦略形成に関する見方","question":"2026年4月14日（火）＜経営戦略＞\n出題範囲：17.戦略形成に関する見方\n■問17.次のうち、コンフィギュレーション学派に関する記述として誤っているものはどれか？\nA.ラーニング学派については、安定した状況に置かれた組織で有効であると説明する。\nB.ポジショニング学派については、経済合理性が強く働いている状況に置かれた組織で有効であると説明する。\nC.他の学派の主張も、自説で包括的に説明しようとする。\nD.組織を特徴や行動が首尾一貫した集団としてとらえ、最も環境にあったコンフィギュレーションを取ると考える。","answer":"■正解：A が誤り\n■解説：\nラーニング学派は、予測が難しくアイデアが重視される業界(ハイテク産業など)で有効であると考えます。安定環境で有効なのはプランニング学派です。\nその他の選択肢\nB：正しいです(例えばアメリカにおける多くの生産財事業などで有効と考えます)\nC：正しいです\nD：正しいです(ある特定の組織は最も環境にあったコンフィギュレーションを取ると考えます)\n■出典：グロービス マネジメントブック 改訂3版\n17.戦略形成に関する見方 P.34-35","source":"Word: GMAP道場2026春 (1)(1).docx","no":456,"idx":456},{"id":"docx-2026春-経営戦略-3c203257","season":"2026春","subject":"経営戦略","scope":"16.事業ライフサイクルに応じた戦略","question":"2026年4月14日（火）＜経営戦略＞\n出題範囲：16.事業ライフサイクルに応じた戦略\n　\n■問16.事業ライフサイクルの成熟期における競争戦略の説明として、誤っているものを1つ選択してください。\nA.製品の原価計算の精度を向上させる。\nB.コスト競争力の強化をする。\nC.新規顧客を開拓する。","answer":"■正解：C\n■解説：\nポーターは、成熟期に移行する業界の競争戦略を次の3点にまとめている。まず、製品構成の合理化と正しい価格政策だ。製品の原価計算の精度を向上させ、収益性が高い製品と不採算製品とを識別し、製品の絞り込みや製品構成の見直しを行う。第2はコスト競争力の強化だ。製造工程の革新と製造に適した製品設計によって実現する。第3は既存顧客への品揃えを充実させ、購買層を広げることである。新規顧客を開拓するよりも、現在抱えている顧客からさらに多く買ってもらうほうが、手っ取り早く、確実なことも多い。\n■出典：グロービス マネジメントブック 改訂3版\n16.事業ライフサイクルに応じた戦略 P.32-33（P32中段の■成熟期の戦略より）","source":"Word: GMAP道場2026春 (1)(1).docx","no":457,"idx":457},{"id":"docx-2026春-経営戦略-7145e8c0","season":"2026春","subject":"経営戦略","scope":"15. 競争上の地位に応じた戦略","question":"2026年4月14日（火）＜経営戦略＞\n出題範囲：15. 競争上の地位に応じた戦略\n■問15. コトラーは、企業を「競争上の地位」に応じて4つに分類しました。それぞれの取りうる戦略の説明について、誤っているものを全て選んでください。\n① リーダー\nナンバーワンの地位を維持することを目的とした戦略を策定することになる。具体的には「市場規模拡大」「シェア維持」「シェア拡大」の3つの方向性が考えられる。\n② チャレンジャー\n主な戦略は「リーダーとの直接対決は極力避ける」「背面攻撃(競争範囲の拡大)」「後方攻撃(自分よりシェアの小さな企業を攻撃対象とする)」の3つだ。\n③ フォロワー\n業界のリーダーに追随し、競合企業からの極端な反撃を招かない方法で経営成果の最大化を目指す。たとえば、競争を仕掛けるよりも、業界秩序維持の名の下にリーダーに追随した価格や製品を提供することが考えられる。\n④ ニッチャー\n大手が本気で参入してこないような市場のくくりを発見し、そこに限られた経営資源を集中させて、高い専門性やブランド力を維持することで、環境変化により市場そのものが消滅するリスクを回避する戦略をとる。","answer":"■正解：「②、④」が誤り。\n■解説：\n正しくは、\n「② チャレンジャー\n主な戦略は「リーダーとの直接対決を挑む」「背面攻撃(競争範囲の拡大)」「後方攻撃(自分よりシェアの小さな企業を攻撃対象とする)」の3つだ。」\nチャレンジャーとは第2位のシェアを維持し、リーダーに取って代わろうとする企業を示す。いずれの場合もリーダー以上の一過性ではない優位性を築く必要がある。\n「④ ニッチャー\n大手が本気で参入してこないような市場のくくりを発見し、そこに限られた経営資源を集中させて、高い専門性やブランド力を維持することで、他者の参入を防ぐという戦略をとる。」\n小さな市場に特化すると、環境変化により市場そのものが消滅するリスクがあり、複数のニッチを持つなどのリスク回避策が必要である。\n■出典：グロービス マネジメントブック 改訂3版\n15.競争上の地位に応じた戦略 P.30-31","source":"Word: GMAP道場2026春 (1)(1).docx","no":458,"idx":458},{"id":"docx-2026春-経営戦略-47c51690","season":"2026春","subject":"経営戦略","scope":"14.内部分析：バリューチェーン","question":"おはようございます。2025期EONL-Aの鎌田晃造（かまてぃ）です。\n春の陽気が気持ちいい日々ですね！道場も中盤です。気合い入れ過ぎて5月病にならないよう個々人のペースでいきましょう！\n　\n#GMAP2026S_STR\n2026年4月14日（火）＜経営戦略＞\n出題範囲：14.内部分析：バリューチェーン\n　\n■問14.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n　\nバリューチェーン（価値連鎖）という考え方は、事業活動を機能ごとに分解し、どの部分（機能）で(①)が生み出されているかを分析することで事業戦略の構築や改善に役立てようというものだ。\n自社の活動において(②)の源泉を探ることは、資源配分の検討や(③)の決定に役立つ。\n　\nA. ①生産量　②売上高　③会計方針\nB. ①利益率　②弱点　③人事制度\nC. ①付加価値　②優位性構築　③基本戦略\nD. ①ブランド力　②市場占有率　③組織階層","answer":"■正解：C\n　\n■解説：\n内部分析の目的は、競合と比較したときの自社の強みと弱みを把握することにある。それにより、自社の優位性を生かす方向や克服すべき課題が見えてくる。内部分析に役立つのが、ポーターのバリューチェーン（価値連鎖）という考え方だ。これは、事業活動を機能ごとに分解し、どの部分（機能）で付加価値が生み出されているかを分析することで、事業戦略の構築や改善に役立てようというものだ。\n自社の活動において優位性構築の源泉を探ることは、資源配分の検討や基本戦略の決定に役立つ。たとえば、優位性構築にそれほど影響を与えない機能は外部資源の利用を検討するなどして、戦略上より有効な機能に自社の経営資源を投入することが可能になる。\n　\n■出典：グロービス マネジメントブック 改訂3版\n14.内部分析：バリューチェーン P.28-29","source":"Word: GMAP道場2026春 (1)(1).docx","no":459,"idx":459},{"id":"docx-2026春-経営戦略-53ed18d7","season":"2026春","subject":"経営戦略","scope":"13. 業界分析：アドバンテージ・マトリクス","question":"2026年4月14日（火）＜経営戦略＞\n出題範囲：13. 業界分析：アドバンテージ・マトリクス\n■問13.アドバンテージ・マトリクスについて、下記（①）～（④）は、選択肢A～Dのどれを指しますか。\n　\n（①）：規模の利益を追求することで優位性を構築できる事業である。汎用的性格の強い商品がこの業界に当てはまる。シェア拡大により、規模を追求することが基本戦略となる。\n　\n（②）：過去には規模による格差が存在したものの、コスト低下が進み、大差がなくなってしまっている。成熟期／衰退期の産業で大規模化の限界に至った業界や、慢性的な供給過剰の状態にある業界などが挙げられる。\n　\n（③）：競争要因がいくつか存在し、かつ、特定の分野でユニークな地位を築くことで優位性構築が可能な事業である。事業全体の規模と収益性に相関関係はない。\n　\n（④）：競争要因が数多く存在するものの、圧倒的な優位性構築が困難な事業である。事業が小規模な段階では高い収益性を維持できるが、事業規模を拡大すると強みが薄れ、収益性を維持できない。地域密着型の事業および事業拡大によるコストダウンの余地が小さい事業がこれに該当する。\nA. 分散型事業\nB. 手づまり型事業\nC. 規模型事業\nD. 特化型事業","answer":"■正解：①C、②B、③D、④A\n■解説：\nアドバンテージ・マトリクスというフレームワークでは、売上規模と収益性の相関関係を表示し、業界の「競争要因が多いか少ないか」の観点と、競争要因が「優位性構築につながる可能性の大きいか小さいか」の観点から4つのタイプに分けて考える。\n　\n（① C. 規模型事業）：規模の利益を追求することで優位性を構築できる事業である。汎用的性格の強い商品がこの業界に当てはまる。シェア拡大により、規模を追求することが基本戦略となる。\n　\n（② B. 手づまり型事業）：過去には規模による格差が存在したものの、コスト低下が進み、大差がなくなってしまっている。成熟期／衰退期の産業で大規模化の限界に至った業界や、慢性的な供給過剰の状態にある業界などが挙げられる。\n　\n（③ D. 特化型事業）：競争要因がいくつか存在し、かつ、特定の分野でユニークな地位を築くことで優位性構築が可能な事業である。事業全体の規模と収益性に相関関係はない。\n　\n（④ A. 分散型事業）：競争要因が数多く存在するものの、圧倒的な優位性構築が困難な事業である。事業が小規模な段階では高い収益性を維持できるが、事業規模を拡大すると強みが薄れ、収益性を維持できない。地域密着型の事業および事業拡大によるコストダウンの余地が小さい事業がこれに該当する。\n　\n　 \n■出典：グロービス マネジメントブック 改訂3版\n13.業界分析：アドバンテージ・マトリクス  P.26-27","source":"Word: GMAP道場2026春 (1)(1).docx","no":460,"idx":460},{"id":"docx-2026春-マーケティング-c157e519","season":"2026春","subject":"マーケティング","scope":"18. セールス・プロモーションと販売戦略","question":"2026年4月13日（月）＜マーケティング＞\n出題範囲：18. セールス・プロモーションと販売戦略\n■問18. セールス・プロモーションの特徴について、誤っているものを1つ選択してください。\nA.広告が顧客の意識下に累積的にイメージを浸透させるプル効果を主目的とするのに対し、セールス・プロモーションは広告などで高まった顧客の関心を購買に直結させる意図を持つため、即物的な面が強い\nB.流通チャネル向けのセールス・プロモーションは、報奨金や報奨旅行、コンテスト、リベートなど、卸売業者や小売業者に対するインセンティブがあり、消費者の目には触れない形で行われるケースも多い\nC.消費者向けのセールス・プロモーションは、製品の試用や値引き、景品（おまけ）の提供等を通じて直接的な購入を促す活動であり、サンプリングや店頭ディスプレイ、イベントへのスポンサーシップなど多岐にわたる\nD.セールス・プロモーションは、長期的なブランドイメージを構築するための最も効果的な手段であり、広告よりも累積的な効果が高い","answer":"■正解：D\n■解説：\nセールス・プロモーションは、顧客の関心を購買に直結させる意図を持つため「即物的な面」が強い手段です。\nこれに対し、広告は顧客の意識下に累積的にイメージを浸透させるプル効果を主目的としており、セールス・プロモーションはむしろ広告を補う機能として位置づけられます。\n■出典：グロービス マネジメントブック 改訂3版\n18.セールス・プロモーションと販売戦略 P.82-83","source":"Word: GMAP道場2026春 (1)(1).docx","no":461,"idx":461},{"id":"docx-2026春-マーケティング-6d8b4d53","season":"2026春","subject":"マーケティング","scope":"17.広告戦略","question":"2026年4月13日（月）＜マーケティング＞\n出題範囲：17.広告戦略\n \n■問17.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・（①）戦略の役割は、「伝える場の確保」だ。ターゲットのプロフィールやサイズ、エリアに合わせて、さまざまな長所・短所を併せ持つ（①）を戦略的に組み合わせ（①・ミックス）、予算内で最大限の費用対効果を得なくてはならない。\n・（②）戦略の第一歩は、企業が伝えるべき製品の属性を選び出すことだ。\n・製品コンセプトを決める際、（③）が明確であれば、それをマーケットにコミュニケートするという観点から確認・検証する。\n・（③）が曖昧なときは、どの属性を訴えれば（④）の達成に最も効果的であるかを見極めなくてはいけない。\n \n \nA. ①クリエイティブ　②メディア　③マーケティング目標　④ポジショニング\nB. ①メディア　②クリエイティブ　③ポジショニング　④マーケティング目標\nC. ①クリエイティブ　②広告　③ポジショニング　④マーケティング目標\nD. ①メディア　②マーケティング目標　③ポジショニング　④クリエイティブ","answer":"■正解：B\n \n■解説：\n・メディア戦略の役割は、「伝える場の確保」だ。ターゲットのプロフィールやサイズ、エリアに合わせて、さまざまな長所・短所を併せ持つメディアを戦略的に組み合わせ、（メディア・ミックス）、予算内で最大限の費用対効果を得なくてはならない。\n・クリエイティブ戦略の第一歩は、企業が伝えるべき製品の属性を選び出すことだ。製品コンセプトを決める際、ポジショニングが明確であれば、それをマーケットにコミュニケートするという観点から確認・検証する。また、ポジショニングが曖昧なときは、どの属性を訴えればマーケティング目標の達成に最も効果的であるかを見極めなくてはいけない。\n \n■出典：グロービス マネジメントブック 改訂3版\n17.広告戦略 P.80-81","source":"Word: GMAP道場2026春 (1)(1).docx","no":462,"idx":462},{"id":"docx-2026春-マーケティング-0428f18c","season":"2026春","subject":"マーケティング","scope":"16 . 購買決定プロセスとコミュニケーション手段","question":"2026年4月13日（月）＜マーケティング＞\n出題範囲：16 . 購買決定プロセスとコミュニケーション手段\n■問 16. 下記文章中のうち、誤っているものを選択肢AからDの中から選んでください。\nＡ．顧客が購買に至るまでには、一般に認知、理解、愛好、選好、確信、購買の6段階のプロセスを経ると言われている。\nＢ．企業は自社製品を顧客に購入してもらうために、注意を促し(Attention)、興味を持たせ(Interest）、欲求を喚起し(Desire)、購買行動を起こさせる(Action)ようなメッセージを伝えなければならない。これを消費者の態度変容プロセスという。\nC．企業は顧客とのコミュニケーションを通じ顧客に態度変容を促すが、これらのコミュニケーション手段は、広告、セールス・プロモーション(販売促進)、人的販売、パブリシティ、クチコミの５つに大別される。\nD．コミュニケーション戦略のうち、広告やパブリシティ を利用してメーカーが直接顧客に働きかける戦略をプッシュ戦略、メーカーから卸売→小売業者→顧客に働きかける戦略をプル戦略という。","answer":"■正解： D が誤り\n■解説：\n・メーカーから卸売業者、小売業者を経て製品が顧客に到着する過程において、流れの上から下へ働きかける戦略をプッシュ戦略と言う。\n・一方プル戦略では、広告やパブリシティなどを利用してメーカーが直接顧客に働きかけて購買意欲を喚起し、指名買いさせることを狙う。\n■出典：グロービス マネジメントブック 改訂3版\n16 . 購買決定プロセスとコミュニケーション手段 p.78- 79","source":"Word: GMAP道場2026春 (1)(1).docx","no":463,"idx":463},{"id":"docx-2026春-マーケティング-4cd755b4","season":"2026春","subject":"マーケティング","scope":"15.流通チャネルの構築プロセス","question":"2026年4月13日（月）＜マーケティング＞\n出題範囲：15.流通チャネルの構築プロセス\n \n■問15.流通チャネルの構築プロセスについて①～⑤の内容が適切なものをAからDより選択してください。\n \n流通チャネルの構築は、流通チャネルの「①」、流通チャネルの「②」、展開「③」の決定、チャネル・「④」の選定、チャネルの「⑤」政策の決定という視点から行う。\nA：①メンバー、②動機づけ、③長さ、④幅、⑤エリア\nB：①幅、②エリア、③メンバー、④動機づけ、⑤長さ\nC：①長さ、②幅、③エリア、④メンバー、⑤動機づけ\nD：①動機づけ、②長さ、③幅、④エリア、⑤メンバー","answer":"■正解：C\n  \n■解説：\n流通チャネルの構築は、流通チャネルの「長さ」、流通チャネルの「幅」、展開「エリア」の決定、チャネル「メンバー」の選定、チャネルの「動機づけ」政策の決定という視点から行う。です！\n■出典：グロービス マネジメントブック 改訂3版\n15.流通チャネルの構築プロセスP.76-77","source":"Word: GMAP道場2026春 (1)(1).docx","no":464,"idx":464},{"id":"docx-2026春-マーケティング-4bb57ea6","season":"2026春","subject":"マーケティング","scope":"13.戦略的価格設定","question":"2026年4月13日（月）＜マーケティング＞\n出題範囲：13.戦略的価格設定\n \n■問13.価格に影響を及ぼす要因にはさまざまなものがありますが、価格設定の際にとくに注意したいのが、①コスト、②カスタマー・バリュー、③競争環境 です。それぞれの記述について、誤っているものを1つ選択して下さい。\n \n①コスト：\n利益を確保するためにはコストを上回る価格が必要なので、\nコストが価格の最低限度(価格の下限)となる。\n②カスタマー・バリュー：\n「企業が適性と認める金額」のことであり、価格設定における上限となる。\n③競争環境：\n競争上、自社の都合だけで価格を設定できず、\n競合の価格やその動向に影響を受ける場合がある。","answer":"■正解：②が誤り\n  \n■解説：\n正しくは、\n②カスタマー・バリュー：\n「顧客が適性と認める金額」のことであり、価格設定における上限となる。\nとなります。(×企業 〇顧客)\nカスタマー・バリューを決定することは難しく、リサーチ力などマーケターのスキルが問われる分野でもあります。\n \n \n■出典：グロービス マネジメントブック 改訂3版\n13.戦略的価格設定 P.72-73","source":"Word: GMAP道場2026春 (1)(1).docx","no":465,"idx":465},{"id":"docx-2026春-ファイナンス-7dec18e6","season":"2026春","subject":"ファイナンス","scope":"10. 資本コスト","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：10. 資本コスト\n■問12. 加重平均資本コスト(WACC)について誤っているものをすべて選択してください。\nA. 資金を1円調達するのにいくらのコストがかかっているかを示している。ビジネスではWACC以下の利回りを上げることができれば負債コストと株主資本コストの両方をカバーでき、債権者と株主を共に満足させることができる。\nB. WACCの式は「WACC= D/(D+E)×rD×(1－税率)＋E/(D+E)×rE」で表される。\nC. WACCの式のDは負債総額、Eは株式の簿価総額である。\nD. rDは負債コスト、rEは株主資本コストと呼ばれる。現在ではCAPMなどのモデルを使い、株主資本コストを推定することが実務的におこなわれるようになっている。\nE. 支払利息は税額控除となるため、税引後の実質負債コストはrD(1－税率)と低くなる。","answer":"■正解：A,Cが誤り\n■解説：\nA：誤り\nビジネスではWACC以上の利回りを上げることができれば負債コストと株主資本コストの両方をカバーでき、債権者と株主を共に満足させることができる。\nB：正しい\nC：誤り\nEは株式の簿価ではなく時価総額（株価×発行済株式数）で表す。\nD；正しい\n社債の購入で企業に資金を貸し付ける場合、投資家は企業が行っているビジネスのリスクを見ることにより、そのリスクに応じた借入に対する利息を要求する。一方、株式に投資する場合は、ビジネス上のリスクの他に、どの程度の負債を抱えているかという財務状況も勘案して利回りを期待する。この利回りのことを株主期待利回り（株主要求利回り）rEと呼ぶ。\nE：正しい\n【参考】設問のrD(1－税率)は節税効果を表しており、有利子負債を増やすほどWACCが下がり、企業価値を高めることができる。しかし過度の有利子負債は企業価値を損なう可能性がある。\n■出典：グロービス マネジメントブック 改訂3版\n資本コスト P.154-155","source":"Word: GMAP道場2026春 (1)(1).docx","no":466,"idx":466},{"id":"docx-2026春-ファイナンス-53f01f7a","season":"2026春","subject":"ファイナンス","scope":"9. 企業の資金調達手段","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：9. 企業の資金調達手段\n■問11.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n一般的に企業の資金調達は大きく二つに分類される。それは負債と株主資本である。\n（①）は企業が存在する限り原則的に返済されることはない。また企業が倒産した際には（②）の支払いが優先される。\nまた（②）においては金融機関からの借入や社債以外にも、現金決済を一定期間猶予してもらうという形で資金を調達している（③）も含む。\nA. ①株主資本　②負債　③買掛金や手形\nB. ①負債　②株主資本　③売掛金や受け取り手形\nC. ①株主資本　②負債　③ワラント債\nD. ①株主資本　②負債　③配当\n（正解は下にあります）","answer":"■正解：A\n■解説：\n企業は株主資本（株式）や負債（債券、銀行借入）といった手法で資金を集めます。負債は返済期限や決済期限を持っており、その期限までに債権者に対して返済をしなければなりません。\n買掛金や手形についても一定期間、支払いを猶予してもらう仕組みのため負債の一部として認識されます。\n■出典：グロービス マネジメントブック 改訂3版\n企業の資金調達手段 P.152-153","source":"Word: GMAP道場2026春 (1)(1).docx","no":467,"idx":467},{"id":"docx-2026春-ファイナンス-a389bee4","season":"2026春","subject":"ファイナンス","scope":"8.分散投資の効果(3)：CAPM(資本資産価格モデル)","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：8.分散投資の効果(3)：CAPM(資本資産価格モデル)\n■問10.国債の利回りが2.5%、マーケット・リスク・プレミアムが5%であるとすると、β=0.8の資産（株式）の期待利回りRは何%になるでしょうか。\n　\nA.　6.0%\nB.　6.5%\nC.　7.0%\nD.　7.5%","answer":"■正解：\nB.　6.5%\n■解説：\n個別資産のβと期待利回りの関係は、以下のようなCAPMの計算式で求められます。\n個別資産の期待利回り = 無リスク資産の利回り +\nβ × (マーケット・ポートフォリオの期待利回り - 無リスク資産の利回り)\nなお、マーケット・ポートフォリオの期待利回りと無リスク資産の利回りとの差を、マーケット・リスク・プレミアムと言います。\nそのため当該資産（株式）の期待利回りRは、2.5% (国債利回り) + 0.8 (β) × 5% (マーケット・リスク・プレミアム)から6.5%と算出できます。\n■出典：グロービス マネジメントブック 改訂3版\n8．分散投資の効果(3)：CAPM(資本資産価格モデル) P.150-151","source":"Word: GMAP道場2026春 (1)(1).docx","no":468,"idx":468},{"id":"docx-2026春-ファイナンス-82dab99a","season":"2026春","subject":"ファイナンス","scope":"8.分散投資の効果(3)：CAPM(資本資産価格モデル)","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：8.分散投資の効果(3)：CAPM(資本資産価格モデル)\n■ 問9.CAPM(資本資産価格モデル)に関する以下の記述のうち、最も適切なものを1つ選択してください。\nA. 個別資産の期待利回りは、無リスク資産の利回りとマーケット・リスク・プレミアムの和によって決まり、βの大きさには影響されない\nB. 個別資産のアンシステマティック・リスクは、ポートフォリオを組んでもなくすことができないため、期待利回りに影響を与える\nC. βは個別資産の市場全体に対する感応度を表し、市場全体の利回りが1％変動したとき、βに応じて個別資産の利回りも変動する\nD. 証券市場線は右下がりの直線であり、βが大きいほど期待利回りは低くなる","answer":"■正解：C\n■解説：\nβは個別資産の市場全体（マーケット・ポートフォリオ）に対する感応度を表す。\n市場全体の利回りが1％変動したとき、βに応じて個別資産の利回りも変動する。\nたとえば、市場全体の利回りが1％変動（上昇または下落）したとき、β＝1.5の資産の利回りは1.5％変動（上昇または下落）することが期待される。\nAは、期待利回りの式にβが含まれるため誤り。\nBは、アンシステマティック・リスクはポートフォリオを組むことでなくせるため誤り。\nDは、証券市場線は無リスク資産を通る右上がりの直線であるため誤り。\n■出典：グロービス マネジメントブック 改訂3版\n8.分散投資の効果(3)：CAPM(資本資産価格モデル) P.150-151","source":"Word: GMAP道場2026春 (1)(1).docx","no":469,"idx":469},{"id":"docx-2026春-ファイナンス-c9d71918","season":"2026春","subject":"ファイナンス","scope":"7.分散投資の効果(2)：効率的フロンティアと資本市場線","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：7.分散投資の効果(2)：効率的フロンティアと資本市場線\n■問8.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A\\~Dのうちから選んでください。\n・ポートフォリオを構成するリスク資産には、資産の数を増やすことで低減されるリスク（①）と資産の数を増やしても除去できないリスク（②）がある。前者は、個別資産に固有の原因により、後者は、景気など、すべての資産に影響を与える原因により発生する。\n・この世に存在するすべてのリスク資産を組み合わせたポートフォリオの期待利回りとリスクをプロットしたとき、その上縁部分を（③）という。すべての投資家は自分が許容できるリスクに応じて、最大の期待利回りが上げられる（③）にあるポートフォリオのどれかを保有することになる。\n・現実には、国債のように、満期まで保有すれば一定の利回りがあらかじめ保証されている資産、すなわちリスクのない資産（無リスク資産）が存在する。無リスク資産とリスク資産を組み合わせる場合、すべての投資家は、（③）上の唯一のリスク資産ポートフォリオであるマーケット・ポートフォリオと無リスク資産を組み合わせるべきである。\n・無リスク資産とマーケット・ポートフォリオの組み合わせをプロットすると「（④）」と呼ばれる直線（無リスク資産から効率的フロンティアに引いた接線）になる。\nA. ①アンシステマティック・リスク　②システマティック・リスク　③効率的フロンティア　④資本市場線\nB. ①アンシステマティック・リスク　②システマティック・リスク　③効率的ポートフォリオ　④証券市場線\nC. ①システマティック・リスク　②アンシステマティック・リスク　③効率的フロンティア　④資本市場線\nD. ①システマティック・リスク　②アンシステマティック・リスク　③効率的ポートフォリオ　④証券市場線","answer":"■正解：A\n■解説：\n・資産の数を増やすことで低減されるリスクは、「アンシステマティック・リスク」（ユニークリスクや分散可能なリスクとも言う）と言う。\n・資産の数を増やしても除去できないリスクはを「システマティック・リスク」（マーケット・リスクや分散不能なリスクとも言う）と言う。\n・この世に存在するすべてのリスク資産を組み合わせたポートフォリオの期待利回りとリスクをプロットしたとき、その上縁部分を「効率的フロンティア」と言う。\n・効率的フロンティア上の一群のポートフォリオを「効率的ポートフォリオ」と言う。\n・無リスク資産とマーケット・ポートフォリオの組み合わせをプロットすると「資本市場線」と呼ばれる直線（無リスク資産から効率的フロンティアへ引いた接線）になる。\n・個別資産リスク（β）と期待利回りの関係は、無リスク資産を通る右上上がりの直線になる。この直線のことを「証券市場線」と言う。（P.151に記載あり）\n■出典：グロービス マネジメントブック 改訂3版\n7.分散投資の効果(2)：効率的フロンティアと資本市場線 P.148-149","source":"Word: GMAP道場2026春 (1)(1).docx","no":470,"idx":470},{"id":"docx-2026春-ファイナンス-e1949f0f","season":"2026春","subject":"ファイナンス","scope":"６.分散投資の効果（１）：ポートフォリオ理論","question":"2026年4月11日（土）＜ファイナンス＞\n出題範囲：６.分散投資の効果（１）：ポートフォリオ理論\n　\n■問7.下記文章中の（①）から（⑤）に入る語句の組み合わせとして適切なものを選択肢AからDの中から選んでください。\n　\n・ファイナンスにおいて、将来の利回りの不確実性を（①）と呼び、統計学における（②）を用いて数値化する。（②）は、統計で分布のばらつきを表す指標として用いられる概念。利回りにばらつきがある資産のことを（①）資産と言う。\n・保有資産すべてを１つの資産に集中させず、多数の資産を組み合わせて保有し分散投資することを（③）を組むと言う。（③）全体の期待利回りは、個別資産の期待利回りを保有比率で（④）した値となる。\n・たとえば、２つの資産から構成されている（③）で、２つの資産の（⑤）が小さくなるほど、（③）のリスク低減効果は大きくなる。\n　\n＜選択肢＞\nA. ①リスク 　②標準偏差 ③ポートフォリオ 　④加重平均 ⑤相関係数\nB. ①リスク 　②相関係数 ③ポートフォリオ 　④単純平均 ⑤標準偏差\nC. ①リターン ②標準偏差 ③インベストメント ④加重平均 ⑤分散\nD. ①リターン ②期待値 　③ポートフォリオ 　④加重平均 ⑤相関係数","answer":"■正解：A\n■解説：\n・投資のリスクとは、不確実性のこと。ファイナンスでは予測される利回りの分布の標準偏差（または標準偏差の２乗である分散）を投資リスクと定義する。\n　\n・ポートフォリオ全体の「期待利回り」は、個別資産の期待利回りをそれぞれの資産が投資全体に占める割合で重み付けした「加重平均」により求められます。\n　\n・一方で、ポートフォリオ全体の「リスク」は、標準偏差を単純に構成比で加重平均したものにはなりません。ここに相関係数が関わってきます。相関係数とは、たとえば、２つの資産から構成されているポートフォリオで、2つの資産の利回りが互いにどのくらい関係して変動するかを測る尺度で、「＋1から－1」の値をとります。相関係数が「＋1」の場合、２つの資産の利回りは完全なる「正の相関関係」を持つと言い（同じ方向に動く）、「－1」の場合は、完全なる「負の相関関係」を持つと言います（逆方向に動く）。「0」の場合は、「無関係」となります。\n　\n・リスク低減の条件として、相関係数が ＋1（完全に同じ動き）でない限り、資産を組み合わせることで、単独で持つよりもリスクを抑えることができます。つまり、相関係数が小さくなるほど、逆の動きをする資産同士がリスクを打ち消し合うため、ポートフォリオのリスク低減効果は大きくなります。\n■出典：グロービス マネジメントブック 改訂3版\n6.分散投資の効果(1)：ポートフォリオ理論 P.146-147","source":"Word: GMAP道場2026春 (1)(1).docx","no":471,"idx":471},{"id":"docx-2026春-アカウンティング-03ab402c","season":"2026春","subject":"アカウンティング","scope":"12.総合力分析：ROAとROE※計算問題","question":"2026年4月10日（金）＜アカウンティング＞\n出題範囲：12.総合力分析：ROAとROE※計算問題\n　\n■問12.A〜Dに示す各指標を算出してください。（計算式の答えは小数点第二位を四捨五入してください）\n　\n2025年\n売上高　　　　　　：10,000\n売上高総利益　　　：4,000\n当期純利益　　　　：1,000\n総資産　　　　　　：5,000\n流動負債　　　　　：1,000\n固定負債　　　　　：2,000\nA.　ROE\nB.　売上高当期純利益率\nC.　ROA\nD.　財務レバレッジ","answer":"■正解：\nA.　ROE：50.0%\nB.　売上高当期純利益率：10.0%\nC.　ROA：20.0%\nD.　財務レバレッジ：2.5\n　\n■解説：\nROE：当期純利益(1,000)÷自己資本(総資産5,000-流動負債1,000-固定負債2,000)x100\n売上高当期純利益率：当期純利益(1,000)÷売上高(10,000)×100\nROA：当期純利益(1,000)÷総資産(5,000)×100\n財務レバレッジ：総資産(5,000)÷自己資本(2,000)\n暗算しやすいようにしています。数値は覚えてしまいやすいですが、計算式は思い出せるようにしておきましょう。\n　\n■出典：グロービス マネジメントブック 改訂3版\n12.総合力分析：ROAとROE P.114-115","source":"Word: GMAP道場2026春 (1)(1).docx","no":472,"idx":472},{"id":"docx-2026春-アカウンティング-110af93d","season":"2026春","subject":"アカウンティング","scope":"11. 有価証券（時価会計）","question":"2026年4月10日(金)＜アカウンティング＞\n出題範囲：11. 有価証券（時価会計）\n■問11.日本では会計基準変更後、保有目的別に4つの基準が適用される。有価証券の計上方法について、下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。なお、同じ語句が入る場合があります。\n・売買目的有価証券：（①）\n・満期保有目的の債券：（②）\n・子会社・関連会社株式：（③）\n・その他有価証券：（④）\nA. ①時価法　②時価法　③償却原価法　④原価法\nB. ①原価法　②償却原価法　③原価法　④原価法\nC. ①原価法　②時価法　③償却原価法　④時価法\nD. ①時価法　②償却原価法　③原価法　④時価法","answer":"■正解：Ｄ\n■解説：\n・売買目的有価証券：時価法で計上\n→貸借対照表には市場価格で評価計上し、損益計算書には市場価格が取得価格より高ければ有価証券評価益として、低ければ有価証券評価損として計上しなければなりません\n・満期保有目的の債券：償却原価法で計上\n→償却原価法とは、例えば1年前に97円で購入した債権が、満期時に100円で償還されると仮定します。その価値が1年ごとに98年、99円、100円と1円ずつ増加する場合、今期の決算期末には98円として計上されます\n・子会社・関連会社株式：原価法で計上\n→記載の通りです\n・その他有価証券：時価法で計上\n→記載の通りです。貸借対照表上に市場価格を反映させなくてはなりませんが、損益計算書上に有価証券損益を計上しない点が、売買目的有価証券と異なります。\n■出典：グロービス マネジメントブック 改訂3版\n11.有価証券（時価会計）P.112-113","source":"Word: GMAP道場2026春 (1)(1).docx","no":473,"idx":473},{"id":"docx-2026春-アカウンティング-0546c834","season":"2026春","subject":"アカウンティング","scope":"10.税効果会計と退職給付会計","question":"2026年4月10日（金）＜アカウンティング＞\n出題範囲：10.税効果会計と退職給付会計\n■問1.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A\\~Dのうちから選んでください。\n・税効果会計と退職給付会計はともに会計制度の国際化の潮流から導入された会計制度だ。\n・税効果会計の適用により、貸借対照表には「(①)資産」や「(①)負債」が、損益計算書には「法人税等調整額」が記載されることになった。\n・退職給付金会計とは、従業員が退職するときに企業が支払う退職金や企業年金を厳格に見積もり、これに対する企業の対応状況を開示する(②)制度だ。\n・「(③)給付型」を採用していることから生じる問題に対応するため、将来の企業年金の給付水準が上下するリスクを従業員が負う「(③)拠出型」の企業年金制度の検討する企業も増えている。\nA. ①繰延税金　②福利厚生　③ポイント\nB. ①繰延税金　②会計　③確定\nC. ①固定　②繰延税金　③ポイント\nD. ①流動　②福利厚生　③ポイント","answer":"■正解：B\n■解説：\n・税効果会計では法人税等を、退職給付会計では退職一時金と企業年金の積立不足分を費用としてとらえ、財務諸表に反映させる。\n・現在の会計制度では、将来の支払いに必要な退職一時金と年金給付を一体のものとして考え、現時点で必要な運用原資を退職給付債務に一本化して会計処理を行う。\n・いまの会計規則では、年金の積立不足額も退職一時金とともに「退職給付引当金」として計上するようになった。\n■出典：グロービス マネジメントブック 改訂3版\n10.税効果会計と退職給付会計 P110-111","source":"Word: GMAP道場2026春 (1)(1).docx","no":474,"idx":474},{"id":"docx-2026春-アカウンティング-f4713d16","season":"2026春","subject":"アカウンティング","scope":"9. 連結会計","question":"2026年4月10日（金）＜アカウンティング＞\n出題範囲：9. 連結会計\n■問09.連結会計について説明した文章のうち、誤っているものを選択してください。\nA.医薬品事業も営んでいる食品メーカーの場合、医薬品事業からの売上高が全体の売上高の10%を超えていれば、食品事業と併せて医薬品事業のセグメント情報も開示しなくてはならない\nB.親会社が子会社に商品を販売した場合（内部取引）、親会社の売上高と子会社の仕入れは「内部取引の相殺消去」として処理される\nC.親会社が子会社を買収した場合、買収金額と子会社の簿価が異なるのが普通であり、この差額を表す科目を「持分法」と言う\nD.2000年3月期より日本の会計制度は、企業会計のグローバル・スタンダードである連結会計に転換した","answer":"■正解：Cのみが誤り\n■解説：\nCは「のれん」について説明している文章です。\n「持分法」とは、関連会社利益のうち親会社持株比率相当分だけを企業集団の利益として連結財務諸表に含める会計処理を指します。\n■出典：グロービス マネジメントブック 改訂3版\n9.連結会計 P.108-109","source":"Word: GMAP道場2026春 (1)(1).docx","no":475,"idx":475},{"id":"docx-2026春-アカウンティング-6a7bf281","season":"2026春","subject":"アカウンティング","scope":"7. 貸借対照表（負債+純資産）","question":"2026年4月10日（金）＜アカウンティング＞\n出題範囲：7. 貸借対照表（負債+純資産）\n■問07.貸借対照表における負債、純資産について、誤っているものを全て選択してください。\nA.貸借対照表の負債と純資産は、企業活動に必要な資金をどこから用立てたのかという資金調達の源泉を示す。負債は第三者からの借り入れ、つまり将来決められた期日に支払うべき債務である。純資産は株主からの借入金である。\nB.流動負債とは、企業の通常の営業サイクル中または短期間（1年以内）に支払わなくてはならない負債である。代表的な勘定科目として支払手形、買掛金、未払費用、未払金、前受収益、未払法人税、短期借入金などがある。\nC.固定負債とは、支払猶予期間が長期的な（1年を超える）負債である。企業の資金調達である長期借入金・社債に加えて、退職給付引当金、賞与引当金などの各種引当金から構成される。\nD.株主資本とは、株主が企業に拠出した資金のみを指し、資本金、資本剰余金、自己株式からなる、財務活動に対応する。","answer":"■正解：A、Dが誤り\n■解説：\nA：純資産は株主からの出資（返済義務なし）であり、返済義務のある借入金ではないので注意。\nD：株主資本とは、株主が企業に拠出した資本金のほか、過去の利益の蓄積分である利益剰余金を含む。利益剰余金は、営業活動に対応する。\n■出典：グロービス マネジメントブック 改訂3版\n貸借対照表（負債+純資産） P.104-105","source":"Word: GMAP道場2026春 (1)(1).docx","no":476,"idx":476},{"id":"docx-2026春-組織行動-69e4da5c","season":"2026春","subject":"組織行動","scope":"7. モチベーションとインセンティブ","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：7. モチベーションとインセンティブ\n■問12. 以下は代表的なモチベーション理論について述べたものである。以下の(1)〜(6)にあてはまるものを以下の選択肢A〜Fからそれぞれ選んでください。\n①マズローの欲求５段階説：人間の欲求を「生理的」「安全」「(1)」「尊厳」「(2)」という、低次から高次への５段階に分けて考えた。低次の欲求が満たされるとより高次の欲求へと移行する。それと同時に、低次の欲求によるモチベーション形成へのインパクトは弱まる。\n②マクレガーの(3)理論・(4)理論：人間を(3)理論と(4)理論で説明している。(3)理論では「人間は本来怠け者で、責任を回避しようとするものだ」、(4)理論では、「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。近年では(4)理論に基づいて動機づけを考えることが必要だと言われている。\n③ハーズバーグの動機づけ・衛生理論：仕事に対する満足をもたらす要因と、不満をもたらす要因が異なることを示し、前者を(5)、後者を(6)と呼んだ。(5)を与えることにより、満足を高め、モチベーションを向上させることができる。一方、(6)に対して手を打つことにより、不満は解消されるが、そのことが満足感やモチベーションを高めるとは限らない。\nA. X、 B. 社会的、 C. 自己実現、D. 動機づけ要因、 E. Y、 F. 衛生要因","answer":"■正解：(1) B, (2) C, (3)A, (4)E, (5)D, (6)F\n■解説：\n①マズローの欲求５段階説：人間の欲求を「生理的」「安全」「社会的」「尊厳」「自己実現」という、低次から高次への５段階に分けて考えた。低次の欲求が満たされるとより高次の欲求へと移行する。それと同時に、低次の欲求によるモチベーション形成へのインパクトは弱まる。\n②マクレガーのX理論・Y理論：人間をX理論とY理論で説明している。X理論では「人間は本来怠け者で、責任を回避しようとするものだ」、Y理論では、「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。近年ではY理論に基づいて動機づけを考えることが必要だと言われている。\n③ハーズバーグの動機づけ・衛生理論：仕事に対する満足をもたらす要因と、不満をもたらす要因が異なることを示し、前者を動機づけ要因、後者を衛生要因と呼んだ。動機づけ要因を与えることにより、満足を高め、モチベーションを向上させることができる。一方、衛生要因に対して手を打つことにより、不満は解消されるが、そのことが満足感やモチベーションを高めるとは限らない。\n■出典：グロービス マネジメントブック 改訂3版\nモチベーションとインセンティブ P.194-195","source":"Word: GMAP道場2026春 (1)(1).docx","no":477,"idx":477},{"id":"docx-2026春-組織行動-bffd065b","season":"2026春","subject":"組織行動","scope":"8. 集団のメカニズム","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：8. 集団のメカニズム\n \n■問11.以下はグループシンクの考え方を説明した文章となります。①から④を埋める組み合わせとして正しいものを、下記A～Dから選んでください。\n一般に、集団における意思決定は個人で行う意思決定より優れている。それは、多様な意見や情報を収集できたり、決定内容がより多くの人に受け入れられる可能性が高いからだ。\n一方、集団ゆえに陥りやすい問題もある。その1つである「グループシンク」は合意に至ろうとするプレッシャーから、集団において物事を多様な視点から批判的に評価する能力が欠落する傾向である。とくに集団の（①）が高い場合や、外部と隔絶している場合、（②）なリーダーが存在する場合などに起きやすい。グループシンクを避けるためには、異なった意見を十分に受け入れ、（③）な批判を重視し、（④）の分析に時間をかけるなどの配慮が必要だ。\nA. ①凝集性　②理想的　③内省　④要因\nB. ①凝集性　②支配的　③建設的　④選択肢\nC.①地位　②理想的　③建設的　④要因\nD.①地位　②支配的　③内省　④選択肢","answer":"■正解：B\n \n■解説：\n「グループシンク」は合意に至ろうとするプレッシャーから、集団において物事を多様な視点から批判的に評価する能力が欠落する傾向である。とくに集団の凝集性が高い場合や、外部と隔絶している場合、支配的なリーダーが存在する場合などに起きやすい。グループシンクを避けるためには、異なった意見を十分に受け入れ、建設的な批判を重視し、選択肢の分析に時間をかけるなどの配慮が必要だ。\n \n■出典：グロービス マネジメントブック 改訂3版\n8.集団のメカニズム． P.196-197","source":"Word: GMAP道場2026春 (1)(1).docx","no":478,"idx":478},{"id":"docx-2026春-組織行動-b24b84de","season":"2026春","subject":"組織行動","scope":"20.組織学習","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：20.組織学習\n \n■問10.センゲは、「学習する組織」の実現のために必要な要素として「5つのディシプリン」(構成技術)を挙げました。以下の要素で誤っているものをすべて選択してください。\n \nA.システム思考：独立した事象に目を奪われずに、各要素間の相互依存性、相互関連性に着目し、全体像とその動きをとらえる思考方法を言います。\n \nB.自己実現と自己研鑽：自らのビジョンや欲求が何であるか探り続けると同時に、現状を的確に見極めることによって両者のギャップを認識し、ビジョンや欲求の実現に向けて行動することを言います。\n \nC.メンタル・モデルの克服：物事の見方や行動に大きく影響を与える固定観念や暗黙の前提をメンタル・モデルと言います。自社や競合、市場に関して組織で共有しているメンタル・モデルを認識し、それを打破するための取り組みは必要です。\n \nD.共有ビジョンの構築：各個人のビジョンから共有されたビジョンを導くことにより、お題目ではなく、組織の構成員が心底望む将来像を構築することを言います。\nE.個人学習：学習の基礎単位はチームではなく、個人です。個人で考えることにより、構成員間のダイアローグ（対話）を通して複雑な問題を探求するときよりも優れた解決方法の発見につながります。","answer":"■正解：Eのみ誤り\n  \n■解説：\n個人学習ではなく、チーム学習です。学習の基礎単位は個人ではなく、チームです。優れた解決方法の発見につながるのは、個人で考えるときよりも、構成員間のダイアローグ（対話）を通じて複雑な問題を探求するときです。\n■出典：グロービス マネジメントブック 改訂3版\n20．組織学習 P.220-221","source":"Word: GMAP道場2026春 (1)(1).docx","no":479,"idx":479},{"id":"docx-2026春-組織行動-eed666c0","season":"2026春","subject":"組織行動","scope":"19.変革のマネジメント","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：19.変革のマネジメント\n■問9.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n<組織変革の方法とプロセス>\n組織変革は直ぐにできるものではなく、次の３つの段階を踏んで進めていくことが重要であると社会心理学者のクルト・レビンは、謳っている。\n●①：メンバーに変革の必要性を理解させ、現状を打破して、変化へ向けて準備させる段階。\n●②：変化のための具体的な方策を実施し、新たな行動や考え方を学習させていく段階。\n●③：新しく導入された変化を定着させる段階。\n　\n　\nA. ①解凍　②移動　③再凍結\nB. ①説得　②納得　③定着\nC. ①解凍　②浸透　③再凍結\nD. ①説得　②学習　③理解","answer":"■正解：A\n　\n■解説：\n社会心理学者のクルト・レビンは、変革のプロセスを「解凍・移動・再凍結」の三段階にまとめている。\n●解凍：メンバーに変化の必要性を理解させ、現状を打破して、変化へ向けて準備させる段階。\n●移動：変化のための具体的な方策を実施し、新たな行動や考え方を学習させていく段階。\n●再凍結：新しく導入された変化を定着させる段階。\n企業は推進役となるリーダーの強い意志の下、このプロセスに沿って変革を進めていくことが重要。\n　\n■出典：グロービス マネジメントブック 改訂3版\n19.変革のマネジメント P.218-219","source":"Word: GMAP道場2026春 (1)(1).docx","no":480,"idx":480},{"id":"docx-2026春-組織行動-a2c9458a","season":"2026春","subject":"組織行動","scope":"11.コンフリクト","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：11.コンフリクト\n \n■問8.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・コンフリクト（対立、軋轢）とは、相反する意見、態度、要求などが存在し、互いに譲らないことで緊張状態が生じることを言う。\n・コンフリクトは通常、そのマイナス面ばかりに目が向きがちだが、マネジメントのやり方次第で、アイデアの創造や本質的な問題の発見などにつながり、組織の成果を高めるドライバーとなりうる。\n・コンフリクトのプラス面として、互いに（①）で意欲が高まる、相互の意見交換の過程で相手への理解が深まる、その過程において自己の考えを明確にして当初のアイデアを発展させたり、新たな視点や本質的な問題が発見出来ることなどが挙げられる。\n・マイナス面としては、不快感を味わう、非効率的な（②）が増える、情報が正しく伝達されず（③）に歪みが生じる、などがある。\n \nA. ①同調すること　②コミュニケーション　③意思決定\nB. ①同調すること　②共同作業　③役割分担\nC. ①競い合うこと　②共同作業　③役割分担\nD. ①競い合うこと　②コミュニケーション　③意思決定","answer":"■正解：D\n \n■解説：\n・コンフリクトのプラス面として、互いに競い合うことで意欲が高まる、相互の意見交換の過程で相手への理解が深まる、その過程において自己の考えを明確にして当初のアイデアを発展させたり、新たな視点や本質的な問題が発見出来ることなどが挙げられる。\n・マイナス面としては、不快感を味わう、非効率的なコミュニケーションが増える、情報が正しく伝達されず意思決定に歪みが生じる、などがある。\n \n■出典：グロービス マネジメントブック 改訂3版\n11.コンフリクト　P.202-203","source":"Word: GMAP道場2026春 (1)(1).docx","no":481,"idx":481},{"id":"docx-2026春-組織行動-77d73884","season":"2026春","subject":"組織行動","scope":"10. コミュニケーション","question":"2026年4月9日（木）＜組織行動学＞\n出題範囲：10. コミュニケーション\n \n■問7.円滑なコミュニケーションを行うプロセスのAからDを順番に並べてください。\nA.伝達\nB.解読\nC.記号化\nD. フィードバック","answer":"■正解：C→A→B→D\n \n■解説：\n記号化→伝達→解読→フィードバックの順となる。\n・記号化：メッセージを記号に変換すること。大きく言語、非言語の２種類ある。言語にすることにより、話す、聞く、書く、読むといった方法が可能になる。非言語は表情や態度、行動、相手との距離のとり方など言語以外の記号である。\n・伝達：さまざまなチャネル（伝達経路）を通じてメッセージを受け手に伝えること。チャネルは、電話や電子メールなどの具体的な方法を指すこともあれば、組織における公式／非公式な伝達経路を指すこともある。チャネルの選択はコミュニケーションの目的と大きく関係する。ビジネス上の公式なメッセージは、組織のルールに則して正規のチャネルに乗せることが重要になる。特に業務上の指示・命令、報告・連絡などは、チャネルの正当性がメッセージの信頼性に影響を与える。\n・解読：受け手が記号化されたメッセージの意味を読み取ること。送り手と受け手は通常、それぞれの個人的経験や組織内における地位や役割などが異なっているため、両者が同じ記号から読み取るメッセージが完全に同じなることは稀である。\n・フィードバック：受け手が解読したメッセージを送り手とともに確認すること。具体的には、ポイントを繰り返したり、言い換えたりすることによって、お互いの理解する意味合いがほぼ一致していることを確認する。\n \n■出典：グロービス マネジメントブック 改訂3版\n10．コミュニケーション P.200-201","source":"Word: GMAP道場2026春 (1)(1).docx","no":482,"idx":482},{"id":"docx-2026春-人的資源管理-26dbdc74","season":"2026春","subject":"人的資源管理","scope":"22. メンタルヘルス","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：22. メンタルヘルス\n　\n■問12.適応アプローチについて、誤っているものを選択してください。\n　\nA.メンタル不調は、無断欠勤が続く、情緒が不安定になるなど、さまざまな形で現れる。健康や生命への危険を及ぼすような状況が見られ、上司として「安全配慮義務」を履行すべきならば、医師による健康診断を最優先で勧めることが望まれる。\nB.適応アプローチで重要なのは、職場において対応可能なケースをしっかり見極め、組織行動学、人的資源管理の両面から適切な対策を打つということだ。\nC.組織行動学的なものとしては、カウンセリング・マインドを持ち、部下の話にしっかり耳を傾けるなどがある。\nD.人的資源管理に関連する打ち手としては、まず研修を行えば良い。","answer":"■正解：D\n　\n■解説：\nD：研修だけではない。\nたとえば、評価の際に部下に対して納得性の高いフィードバックを行ったり、能力開発のヒントを適切に提示したりすることも、ストレス削減につながる。\n　\n■出典：グロービス マネジメントブック 改訂3版\n22.メンタルヘルス P.224-225","source":"Word: GMAP道場2026春 (1)(1).docx","no":483,"idx":483},{"id":"docx-2026春-人的資源管理-adb4c41b","season":"2026春","subject":"人的資源管理","scope":"21. ワーク・ライフ・バランス","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：21. ワーク・ライフ・バランス\n■問 11. 下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A\\~Dのうちから選んでください。\n・政府はワーク・ライフ・バランスを「仕事と生活の調和」と訳し、とくに企業の従業員が仕事と生活の適切なバランスをとることを提唱している。その背景にあるのは、（①）や男女共同参画推進といった国家的な事情であるが、こうした要請に限らず、従業員が人間として豊かな生活を送れるようにすることは、企業の（②）上も大きな課題となりつつある。\n・一方、日本は、アメリカ以上に仕事人間が多い国である。もともと（③）を是とする下地はあったが、そうした慣習への見直しを迫ったのが、（①）や男女共同参画推進の視点である。\n・少子化を例にとると、その原因はさまざまあるが、従業員（とくに男性）が会社に時間をとられてしまい、（④）への参加がなかなかできないことが夫婦が出産に踏み切れない大きな要因とされた。\nA. ①高齢化対策　②倫理　③長時間労働　④介護\nB. ①高齢化対策　②戦略　③成果主義　④介護\nC. ①少子化対策　②倫理　③成果主義　④育児\nD. ①少子化対策　②戦略　③長時間労働　④育児","answer":"■正解： D\n■解説：\nワーク・ライフ・バランスが提唱される背景には「少子化対策」や男女共同参画推進があり、これは企業の「戦略」上も大きな課題です。日本ではもともと「長時間労働」を是とする下地がありましたが、見直しが迫られています。男性が「育児」に参加できないことが少子化の要因とされています。\n■出典：グロービス マネジメントブック 改訂3版\n21． ワーク・ライフ・バランス P.222- 223","source":"Word: GMAP道場2026春 (1)(1).docx","no":484,"idx":484},{"id":"docx-2026春-人的資源管理-405a6a9d","season":"2026春","subject":"人的資源管理","scope":"18. 能力開発","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：18. 能力開発\n　\n■問10.能力開発に関する記載について、誤っているものを一つ選択してください。\nA.企業にとっての能力開発は、「コスト」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「戦略的な投資」としてとらえることが重要である。\n　\nB.企業が行う能力開発には、業務を行いながら業務知識や仕事のやり方を身につけるOJTと、業務時間外に業務知識などを学ぶOff-JTがある。これまで多くの日本企業ではOJTが能力開発の中心だったが、Off-JTを有効に活用していく必要がある。\n　\nC.従業員は自分のキャリアについて、自ら考えていくことも必要だ。自分に「エンプロイアビリティー」（雇用されうるだけの能力）があるかを常に問い続け、戦略的にキャリア・デザインを考えなくてはならない。\n　\nD.企業が従業員のキャリア開発を行う目的は、従業員の能力を高めることで、組織文化への理解を最大化することにある。","answer":"■正解：D\n　\n■解説：\nA.正しい\nB.正しい\nC.正しい\nD.誤り\n　\n正しくは、企業が従業員のキャリア開発を行う目的は、従業員の能力を高めることで、組織の成果を最大化することにある。\n　\n補足：具体的には、企業の求める人材像に合わせて、異なる領域をいくつか経験させたり、特定領域で難易度の高い業務を与えたりして、さまざまな業務経験を積ませる。キャリアを重ねる過程で、組織の成果に繋がる幅と深さのある知識を習得し、部門横断的な知識の交換や従業員間の相互作用が起こる場合もある。その結果、新しい付加価値が生まれたり、組織文化への理解が深まる。\n　\n■出典：グロービス マネジメントブック 改訂3版\n18.能力開発 P.216-217","source":"Word: GMAP道場2026春 (1)(1).docx","no":485,"idx":485},{"id":"docx-2026春-人的資源管理-700d1d89","season":"2026春","subject":"人的資源管理","scope":"17. 評価","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：17. 評価\n■問9.評価方法を設計する際に、「何を」(評価項目)、「誰が」(評価者)、「どれくらいの期間で」(評価期間)評価するかを考える必要がありますが、下記の中から最も適切なものを選択してください。\nA.[評価項目]企業は一般に、「成果」と「能力」のみを評価項目として組み合わせて用いている。\nB.[評価項目]評価項目を考える際は、最も重要である「人事制度との整合性」のみをおさえていればよい。\nC.[評価者]「上司」による評価が一般的だが、近年では部下や同僚による評価、顧客による評価を実施している企業もある。\nD.[評価期間]評価期間は、会計年度の単位である「1年」が絶対とされる。","answer":"■正解：C\n■解説：\nAは誤りです。正しくは、企業は一般に、「成果」「能力」の他に、「勤務態度」などの評価項目を組み合わせて用いています。\nBは誤りです。正しくは、評価項目を考える際に最も重要なのは、企業戦略との整合性です。人事制度との整合性だけを最も重要とするのは適切ではありません。\nDは誤りです。正しくは、評価期間は一律に1年を絶対とするのではなく、環境変化が激しい業界や企業では、1年より短い期間で設定することが適切な場合もあります。\n■出典：グロービス マネジメントブック 改訂3版\n17.評価 P.214-215","source":"Word: GMAP道場2026春 (1)(1).docx","no":486,"idx":486},{"id":"docx-2026春-人的資源管理-b75ccf7d","season":"2026春","subject":"人的資源管理","scope":"16. 報奨","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：16. 報奨\n■問8.下記文章中の（①）から（④）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n・報奨は（①）の1つで、従業員の企業への貢献の対価である。\n・報奨システムを設計する際は、（②）や評価との整合性を考慮に入れなくてはならない。\n・報奨を考える際の基本要素は、「何に対して」支払うかを示す「報奨（③）」、「どのように」支払うかを示す「報奨項目」、「だれにいくら」支払うかを示す「報奨（④）」の3つだ。\nA. ①フリンジ・ベネフィット　②社会的責任　③基準　④水準\nB. ①インセンティブ　②経済合理性　③基準　④水準\nC. ①インセンティブ　②社会的責任　③水準　④基準\nD. ①フリンジ・ベネフィット　②経済合理性　③水準　④基準","answer":"■正解：B\n■解説：\n・報奨は「インセンティブ」の1つで、給与やボーナス、福利厚生など、従業員の企業への貢献の対価として企業から従業員に提供されるもの。\n・報奨システムを設計する際は、「経済合理性」や評価との整合性を考慮に入れる。また従業員のモチベーションを高めるためには、公平で、誰もが納得できるような評価方法を用いることが不可欠。\n・報奨を考える際の基本要素について、具体的な報奨「基準」としては、能力や職務、年齢、業務の成果などが挙げられる。また、報奨「水準」は、「外部競争力」と「内部公平性」を考慮して決定する。\n■出典：グロービス マネジメントブック 改訂3版\n16．報奨 P.212-213","source":"Word: GMAP道場2026春 (1)(1).docx","no":487,"idx":487},{"id":"docx-2026春-人的資源管理-b47c7edb","season":"2026春","subject":"人的資源管理","scope":"15.人員配置","question":"2026年4月8日（水）＜人的資源管理＞\n出題範囲：15.人員配置　\n　\n■問7.人員配置とは、企業の戦略を遂行するために必要な人員構成を実現することだ。「人員配置」について、誤っているものを全て選びなさい。\nA.求められる人員構成と現状との間の不足分を埋めることである。\n　\nB.求められる人員構成と現状との間の余剰分を解消することである。\n　\nC.戦略を遂行するために最適な人員構成を実現する際には、短期的視点だけではなく、中長期的な視点も必要である。\n　\nD.人材配置にはマネジメントから組織全体へのメッセージという側面はない。","answer":"■正解：Dのみ\n　\n■解説：\nA.正しい\n　\nB.正しい\n　\nC.正しい\nD.誤り\n人員配置にはマネジメントから組織全体へのメッセージという側面もある。たとえば、組織内で評価の高い人材を特定部門に重点的に配置した場合、「その部門が戦略上、重視されている」というメッセージになる。その結果、その部門のメンバーのモチベーションは高まることになる。\n　\n■出典：グロービス マネジメントブック 改訂3版\n15.人員配置 P.210-211","source":"Word: GMAP道場2026春 (1)(1).docx","no":488,"idx":488},{"id":"docx-2026春-経営戦略-1a4d3d36","season":"2026春","subject":"経営戦略","scope":"12. 業界分析：業界構造と5つの力","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：12. 業界分析：業界構造と5つの力\n■問12.下記文章中の（①）～（⑤）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n　\n・「５つの力」分析は、（①）を分析するときに役立つフレームワークである。\n・「５つの力」とは、（②）の脅威、（③）の脅威、（④）の交渉力、（⑤）の交渉力、業界内の競合他社を指す。\n・（②）が容易な業界では、業界の収益性が上がるとすぐに参入者が増加し、収益性が下がってしまう。\n・（③）の脅威とは、（③）の存在だけでなく、イノベーションにより従来の機能をまったく別の製品で代替できる場合なども含む。\n・（④）の交渉力が強くなるのは、製品の差別化が難しく他企業も類似製品をつくっている場合や、（④）の情報量が多い場合などである。\n・（⑤）の交渉力が強くなるのは、（⑤）の業界が寡占されている場合などである。\n　\nA. ①自社の強み　②異業種の参入　③新規参入　④売り手　⑤買い手\nB. ①市場規模　②新規参入　③既存競合　④買い手　⑤売り手\nC. ①業界構造　②新規参入　③代替品　④買い手　⑤売り手\nD. ①競争優位性の源泉　②代替品　③新規参入　④売り手　⑤買い手","answer":"■正解：C\n■解説：\n・企業の収益性は業界内での競争力のみで決まるものではなく、業界そのものの収益性にも影響を受け、業界の収益性は業界構造によって規定される。\n・５つの力のうち、どれが構造を決める重要な要因になるかは業界によって異なる。\n・５つの力を分析することで、業界の収益構造や競争の鍵を発見したり、将来の競争の変化を予測することが可能となる。\n■出典：グロービス マネジメントブック 改訂3版\n12．業界分析：業界構造と5つの力 P.24-25","source":"Word: GMAP道場2026春 (1)(1).docx","no":489,"idx":489},{"id":"docx-2026春-経営戦略-a6625a1e","season":"2026春","subject":"経営戦略","scope":"11.外部環境分析","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：11.外部環境分析\n■問11.空欄に入る言葉を以下の選択肢から選んで答えなさい。\n外部環境を分析する目的は、市場における(1)を探り、自社にとっての(2)を見つけることである。また、内部分析では自社の(3)と(4)を把握することに主眼が置かれる。この4つの要素を組み合わせたものが「SWOT分析」だ。環境分析の最終目標は自社にとっての(5)を発見することだが、SWOTを整理することにより、(6)や、自社にとっての(5)を導きやすくなる。\n選択肢：\na成功要因(KSF)\nb強み\nc脅威\nd存在意義\ne弱み\nf事業機会\ng顧客KBF\nh機会\ni利益","answer":"■正解：\n(1)-h (2)-c (3)-b or e(4)-e or b (5)-f (6)-a\n■解説：\n外部環境を分析する目的は、市場における機会(Opportunities)を探り、自社にとっての脅威(Threats)を見つけることである。また、内部分析では自社の強み(Strengths)と弱み(Weaknesses)を把握することに主眼が置かれる。この4つの要素を組み合わせたものが「SWOT分析」だ。環境分析の最終目標は自社にとっての事業機会を発見することだが、SWOTを整理することにより、成功要因(KSF)や、自社にとっての事業機会を導きやすくなる。\n■出典：グロービス マネジメントブック 改訂3版\n11.外部環境分析 P.22-23","source":"Word: GMAP道場2026春 (1)(1).docx","no":490,"idx":490},{"id":"docx-2026春-経営戦略-66b66418","season":"2026春","subject":"経営戦略","scope":"10. 事業の経済性分析","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：10. 事業の経済性分析\n　\n■問10.規模の経済、経験曲線、範囲の経済について、誤っているものを全て選択してください。\n　\nA.規模の経済とは、単位当たりの変動費は製品の生産量が増えても一定であるが、単位当たりの固定費は生産量が増えると低下する。すなわち、固定費の部分は規模が大きくなればなるほどコスト効率が向上することである。\nB.規模の経済は固定費にしか働かず、変動費については働かない。\nC.経験曲線とは、現時点までの累積の生産量、すなわち累積の経験量が増えるほどコスト低下に結びつくとする考え方である。\nD.範囲の経済とは、単一事業において規模が拡大することで、より経済的な事業運営が可能になることである。","answer":"■正解：BとD\n　\n■解説：\nA：正しい\nB：変動費についても規模の経済が働く。たとえば、会計上は変動費とされる原材料の仕入価格も、生産量が増えれば購買量も増えるので、買い手の交渉力が増して値引き要求ができるようになる。\nC：正しい\nD：範囲の経済とは複数の事業活動を持つことにより、より経済的な事業運営が可能になること。たとえば、既存事業において有する販売チャネル、ブランド、固有技術、生産設備などの経営資源やノウハウを複数事業に共用できれば、それだけ経済的と言える。\n■出典：グロービス マネジメントブック 改訂3版\n10．事業の経済性分析 P.20-21","source":"Word: GMAP道場2026春 (1)(1).docx","no":491,"idx":491},{"id":"docx-2026春-経営戦略-a3b3e75f","season":"2026春","subject":"経営戦略","scope":"9.競争優位を築くための基本戦略","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：9.競争優位を築くための基本戦略\n■問9. 競争優位を築くための基本戦略の1つである差別化戦略について、下記文章中の\n（①）～（④）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n・差別化戦略の差別化の源泉としては、（①）、（②）、（③）、（④）などが挙げられる。\nA. ①ブランド・イメージや独自開発　②高品質素材　③アフターサービス　④販売チャネル\nB. ①ブランド・イメージや独自技術　②製品（性能やデザイン）　③顧客サービス　④販売チャネル\nC. ①ブランド・イメージや独自技術　②製品（性能やデザイン）　③アフターサービス　④販売チャネルA\nD. ①ブランド・イメージや独自開発　②高品質素材　③顧客サービス　④販売チャネル","answer":"■正解：B\n■解説：\n差別化戦略では「自社の製品を差別化して、業界の中でもユニークだと見られる何かを創造すること」が基本テーマである。そのユニークさは、顧客に価値として認識され、競合に簡単に模倣できないのでなければならない。差別化の源泉としては、ブランド・イメージや独自技術、製品（性能やデザイン）、顧客サービス、販売チャネルなど、さまざまなものが挙げられる。\n■出典：グロービス マネジメントブック 改訂3版\n9．競争優位を築くための基本戦略　P.18-19","source":"Word: GMAP道場2026春 (1)(1).docx","no":492,"idx":492},{"id":"docx-2026春-経営戦略-53fb3f92","season":"2026春","subject":"経営戦略","scope":"8.事業拡大と多角化の基本戦略","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：8.事業拡大と多角化の基本戦略\n■問8.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A\\~Dのうちから選んでください。\nアンゾフの事業拡大マトリクスには、次の３つの方向がある。1つめは、同じ市場に対して新しい（①）を行い、製品群の守備範囲を広げる方向である。２つめは、製品は変えずに新たな（②）を取り込み、市場拡大を図る方向である。３つめは、新製品を新市場に展開する拡大で、一般的に言われる「（③）」に相当する方向である。\nA. ①ブランド創出　　②技術　　　③ポジショニング\nB. ①コスト削減　　　②資源　　　③新規参入\nC. ①製品開発　　　　②顧客　　　③多角化\nD. ①マーケティング　②チャネル　③差別化","answer":"■正解：C.\n■解説：\nアンゾフの事業拡大マトリクスは、事業拡大を製品軸と市場軸でとらえる。製品軸を左右（左に既存製品、右に新製品）に置き、市場軸を上下（上に既存市場、下に新市場）を置いて、事業拡大を考える。１つめは、同じ市場に対して新しい製品開発を行い、製品群の守備範囲を広げる右方向への拡大だ。２つめは、製品は変えずに新たな顧客を取り込み、市場拡大を図る下方向への拡大だ。３つめは新製品を新市場に展開する右下方向への拡大で、これが一般的に言われる「多角化」に相当する。\n■出典：グロービス マネジメントブック 改訂3版\n8.事業拡大と多角化の基本戦略 P.16-17","source":"Word: GMAP道場2026春 (1)(1).docx","no":493,"idx":493},{"id":"docx-2026春-経営戦略-2883d2bb","season":"2026春","subject":"経営戦略","scope":"7.ポートフォリオ・マトリクス","question":"2026年4月7日（火）＜経営戦略＞\n出題範囲：7.ポートフォリオ・マトリクス\n■問7.下記文章中の（①）～（④）に入る語句として適切なものを選択肢A～Dのうちから一つ選んでください。\nプロダクト・ポートフォリオ・マネジメント(PPM)モデルでは「市場成長率」と「相対マーケットシェア」の2軸でマトリクスをつくり、事業を４つの象限に分けている。\n成長性は高いがシェアの低い（①）では、早いうちに集中投資してシェアを拡大する戦略をとるか、思い切って撤退するかの判断が必要だ。\nシェアは高いが成長率の低い（②）では、投資をシェア維持に必要な最小限度にとどめて収益を上げ、キャッシュを回収する戦略を取り、他の事業への資金源とする。\nシェアも成長性も高い（③）は、現在のシェアを維持しつつ成長するための投資を行い、将来の（②）に育てる。\nシェアも成長性も低い（④）は見込みがないため、買い手がいるうちに売却するなどの撤退戦略をとる。\nA. 負け犬\nB. 金のなる木\nC. 花形事業\nD. 問題児","answer":"■正解：①：D.問題児、②：B.金のなる木、③：C.花形事業、④：A.負け犬\n■解説：\n横軸「相対マーケットシェア」、縦軸「市場成長率」の図をイメージすると理解が深まるでしょう。\n■出典：グロービス マネジメントブック 改訂3版\n7.ポートフォリオ・マトリクス P.14-15","source":"Word: GMAP道場2026春 (1)(1).docx","no":494,"idx":494},{"id":"docx-2026春-マーケティング-0d0a94ac","season":"2026春","subject":"マーケティング","scope":"12. 価格と事業経済性","question":"2026年4月6日（月）＜マーケティング＞\n出題範囲：12. 価格と事業経済性\n \n■問12.マーケティングにおける価格と事業経済性について、誤っているものをすべて選択してください。\n \nA.価格は企業が得るキャッシュに直結し、企業収益を直接的に規定する要因だ。また、最もダイレクトに消費者に訴えることができるメッセージ手段でもある。\n \nB.企業は提供する製品の価値レベルを何らかの方法で表示し、消費者に伝える必要があるが、その際に最もわかりやすい共通の尺度が金銭的尺度、つまり価格だ。\n \nC.価格は競合企業に対するシグナルの役目も果たす。\n \nD.価格を決める場合、競合企業の価格は無視することができる。同様に自社の価格もまた相手の価格戦略に影響は特に与えない。","answer":"■正解：Dのみ誤り\n  \n■解説：\nA.価格は企業が得るキャッシュに直結し、企業収益を直接的に規定する要因だ。\nまた、最もダイレクトに消費者に訴えることができるメッセージ手段でもある。\nB.企業は提供する製品の価値レベルを何らかの方法で表示し、消費者に伝える必要があるが、その際に最もわかりやすい共通の尺度が金銭的尺度、つまり価格だ。\nC.価格は競合企業に対するシグナルの役目も果たす。\nD.価格を決める場合、競合企業の価格を無視することはできない。\n同様に自社の価格もまた相手の価格戦略に影響を与える。\n \n■出典：グロービス マネジメントブック 改訂3版\n12．価格と事業経済性 P.70-71","source":"Word: GMAP道場2026春 (1)(1).docx","no":495,"idx":495},{"id":"docx-2026春-マーケティング-733072e3","season":"2026春","subject":"マーケティング","scope":"11. 製品ライフサイクル","question":"2026年4月6日（月）＜マーケティング＞\n出題範囲：11. 製品ライフサイクル\n　\n■問11. 市場の発達段階によって顧客のタイプが異なる。社会学者のE.M.ロジャースが新製品をどれだけ早く買ったかに注目して5つに分類している。時間軸で並べたときに、正しいものを選んでください。\n　\nA. イノベーター→アーリー・アダプター→フォロワー→レイト・フォロワー→ラガード\nB.イノベーター→ラガード→フォロワー→レイト・フォロワー→アーリー・アダプター\nC.アーリー・アダプター→イノベーター→フォロワー→レイト・フォロワー→ラガード\nD.ラガード→アーリー・アダプター→フォロワー→レイト・フォロワー→イノベーター","answer":"■正解：A\n　\n■解説：\nイノベーター→アーリー・アダプター→フォロワー→レイト・フォロワー→ラガード\nイノベーター　改革者\nアーリー・アダプター　初期採用者\nフォロワー　初期大衆\nレイト・フォロワー　後期大衆\nラガード　採用遅滞者\n市場の発達段階によって顧客のタイプが異なるのは、新商品の受容において、顧客の性格や価値観が反映されるからである。\n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n11．製品ライフサイクル P.68-69","source":"Word: GMAP道場2026春 (1)(1).docx","no":496,"idx":496},{"id":"docx-2026春-マーケティング-49847f15","season":"2026春","subject":"マーケティング","scope":"10. 新製品開発","question":"2026年4月6日（月）＜マーケティング＞\n出題範囲：10. 新製品開発\n \n■問10.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・こんな新しい技術が開発されたが、何か利用できる方法はないだろうかと発想する開発を（①）型開発と言う。\n・顧客の（②）を発見し、何か解決できる方法はないだろうかと発想する開発を（②）型開発と言う。\n・想定するユーザーがそれを使っている場面をイメージできるまで具体化されたものを製品（③）と言う。\n・市場に提供するその製品固有の機能や特徴を製品（④）と言う。\n \nA. ①アイデア　②コンセプト　③シーズ　④ニーズ\nB. ①コンセプト　②アイデア　③ニーズ　④シーズ\nC. ①シーズ　②ニーズ　③コンセプト　④アイデア\nD. ①ニーズ　②シーズ　③アイデア　④コンセプト","answer":"■正解：C\n \n■解説：\n・こんな新しい技術が開発されたが、何か利用できる方法はないだろうかと発想する開発をシーズ型開発と言う。\n・顧客のニーズを発見し、何か解決できる方法はないだろうかと発想する開発をニーズ型開発と言う。\n・想定するユーザーがそれを使っている場面をイメージできるまで具体化されたものを製品コンセプトと言う。\n・市場に提供するその製品固有の機能や特徴を製品アイデアと言う。\n \n■出典：グロービス マネジメントブック 改訂3版 　\n　10.新製品開発 P.66-67","source":"Word: GMAP道場2026春 (1)(1).docx","no":497,"idx":497},{"id":"docx-2026春-マーケティング-aa2ad4eb","season":"2026春","subject":"マーケティング","scope":"9. ブランド","question":"2026年４月６日（月）＜マーケティング＞\n出題範囲：9. ブランド\n \n■問9.下記、文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・ブランドには主に３つの機能がある。\n第1は、購買に関する情報処理の時間やコストを節約する「（①）」機能だ。顧客は購買にあたって、リスク回避のためにさまざまな情報を収集する。だが、製品のすべてを完全に理解することは難しいので、ブランドを目印に製品を認識することも多い。\n　\n第2は、購買リスクの軽減・回避に役立つ「（②）」機能だ。顧客は過去の評判などから、そのブランドが信頼できると確信すれば、それ以上の情報探索はしなくなる。\n　\n第3は、ブランドによって満足感が高まったり、自己実現の手段となる「（③）」機能である。不況時でもグッチやエルメスの人気が衰えないのは、ブランドから連想されるイメージが好ましく、忠誠心の高い顧客が存在するからだ。\n　\nA. ①識別　　　②品質保証　③意味づけ\nB. ①識別　　　②意味づけ　③品質保証\nC. ①意味付け　②識別　　　③品質保証\nD. ①品質保証　②品質保証　③識別","answer":"■正解：A\n \n■解説：\n・ブランドには主に３つの機能がある。\n第1は、購買に関する情報処理の時間やコストを節約する「①識別」機能だ。顧客は購買にあたって、リスク回避のためにさまざまな情報を収集する。だが、製品のすべてを完全に理解することは難しいので、ブランドを目印に製品を認識することも多い。\n第2は、購買リスクの軽減・回避に役立つ「②品質保証」機能だ。顧客は過去の評判などから、そのブランドが信頼できると確信すれば、それ以上の情報探索はしなくなる。\n第3は、ブランドによって満足感が高まったり、自己実現の手段となる「③意味づけ」機能である。不況時でもグッチやエルメスの人気が衰えないのは、ブランドから連想されるイメージが好ましく、忠誠心の高い顧客が存在するからだ。\n \n■出典：グロービス マネジメントブック 改訂3版\n9.ブランド　P64-65","source":"Word: GMAP道場2026春 (1)(1).docx","no":498,"idx":498},{"id":"docx-2026春-マーケティング-6ce69b38","season":"2026春","subject":"マーケティング","scope":"8. 製品特性","question":"2026年4月6日（月）＜マーケティング＞\n出題範囲：8. 製品特性\n■問8.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n・製品はその構成要素を3つに分解できる。\n・（①）は顧客の本質的なニーズを満たすための、根本となる機能や価値のことである。\n・（②）は（①）に付随する製品特性やスタイル、品質、ブランド、パッケージなどのことである。\n・（③）はアフターサービスや保証など付加的な要素のうち、顧客が価値を認めるものを言う。\n・市場が発達して競合の類似製品が出回るようになると、（③）での差別化が重要になったりする。\nA. ①形態　②コア　③付随機能\nB. ①コア　②付随機能　③形態\nC. ①コア　②形態　③付随機能\nD. ①付随機能　②形態　③コア","answer":"■正解：C\n■解説：\n・製品は「コア」「形態」「付随機能」の3要素で構成されます 。\n・自動車の場合、「コア」は人や物を載せて運ぶという運搬機能を指し、「形態」は自動車の色やスタイル、モデル名、燃費、安全性、最高速度がこれに当り、「付随機能」は保証や保険、カーローン、アフターサービスなどが該当する。\n■出典：グロービス マネジメントブック 改訂3版\n8.製品特性 P.62-63","source":"Word: GMAP道場2026春 (1)(1).docx","no":499,"idx":499},{"id":"docx-2026春-マーケティング-618f94b3","season":"2026春","subject":"マーケティング","scope":"7. ポジショニング","question":"2026年4月6日（月）＜マーケティング＞\n出題範囲：7. ポジショニング\n \n■問7.ポジショニングの役割や特徴について、誤っているものをすべて選択してください。\n \nA.ポジショニングは、ターゲット顧客の頭の中に独自のポジションを築き、明確でユニークな差別化イメージを植え付けるための活動である\n \nB.まったく同じ内容の製品やサービスであれば、ポジショニングが変わってもマーケティングの施策は変わらない\n \nC.ポジショニングを検討するときには、顧客視点で考えることがポイントであり、ターゲット顧客が重視するKSFをもとに競合製品といかに差別化できるかを考える方法や、製品の属性を軸にして2次元のマップを描き、有効なポジションを視覚的に探す方法などがある\n \nD.製品のポジショニングが売り手企業自体やその既存製品のポジショニングと整合していないと、顧客に混乱した印象を与えるだけでなく、既存製品の売上や企業全体のイメージにもダメージを与える可能性がある","answer":"■正解：BとCが誤り\n  \n■解説：\nB.まったく同じ内容の製品やサービスであっても、ポジショニングが変わればマーケティングの施策は異なったものになるので不正解。\nC.ターゲット顧客が重視するKSFをもとに競合製品といかに差別化できるかを考える方法とあるが、KSFではなくKBFが正解。\n \n■出典：グロービス マネジメントブック 改訂3版\n7.ポジショニング P.60‐61","source":"Word: GMAP道場2026春 (1)(1).docx","no":500,"idx":500},{"id":"docx-2026春-ファイナンス-a211b571","season":"2026春","subject":"ファイナンス","scope":"4.DCF法","question":"2026年4月4日（土）＜ファイナンス＞\n出題範囲：4.DCF法\n■問6.ある事業で1年後と2年後に200万円ずつ受け取るとします。割引率が3％の場合、２年間で受け取る金額の現在価値はいくらでしょう。（小数点以下は四捨五入）\n　\nA.　328万円\nB.　383万円\nC.　418万円\nD.　431万円","answer":"■正解：\nB . 383万円\n■解説：\n現在価値を求める公式は、\nPV＝C1/(1+r)＋C2/(1+r)^2+C3/(1+r)^3+・・・+Cn/(1+r)^n=Σ[n,i=1]Ci/(1+r)^i\nPV=現在価値\nCn＝n年後に受け取るキャッシュ\nr=割引率\nn＝期間\n今回は、「毎年200万を2年間で受け取る、割引率は3%」なので、\nPV＝200/(1+0.03)+200/(1+0.03)^2= 383万円　となります。\n■出典：グロービス マネジメントブック 改訂3版\nDCF法 p.142-143","source":"Word: GMAP道場2026春 (1)(1).docx","no":501,"idx":501},{"id":"docx-2026春-ファイナンス-cac1eb79","season":"2026春","subject":"ファイナンス","scope":"5. 投資評価のさまざまな方法","question":"#GMAP2026S_FIN\n2026年4月4日（土）＜ファイナンス＞\n出題範囲：5. 投資評価のさまざまな方法\n■問5.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n代表的な投資の意思決定方法は（①）（②）（③）がある。\n（①）は、同程度のリスクを持つ投資案件の利回りと当該投資期間の利回りを比較することで評価する。（②）は、初期投資額は特定の期間内に回収するべきという考え方で評価する。（③）は、投資により生み出されるキャッシュフローの現在価値と初期投資額を比較することで評価する。（②）は直感的に理解しやすいが金銭の時間的価値の概念は考慮されていないため、望ましい評価手法とはいえない。（①）と（③）はキャッシュフローや金銭の時間的価値の考え方が反映され、基本的には同じ結果になる。\nA. ①NPV法　②IRR法　③ペイバック法\nB. ①ペイバック法　②NPV法　③IRR法\nC. ①IRR法　②ペイバック法　③NPV法\nD. ①NPV法　②ペイバック法　③IRR法","answer":"■正解：C\n■解説：\n● IRR法の評価ステップ：\n１．ハードルレートを設定\n２．投資で生み出されるキャッシュフローを予測\n３．IRRを計算\n４．IRRがハードルレートより大きければ投資、小さければ投資しない\n●NPV法の評価ステップ\n１．投資で生み出されるCFを予測\n２．キャッシュフローの現在価値を計算\n３．NPVを計算\n４．NPV＞0なら投資、NPV＜0なら投資しない\n●ペイバック法の評価例\n1000億円投資すると毎年100億円生み出す場合の回収期間は10年\n■出典：グロービス マネジメントブック 改訂3版\n投資評価のさまざまな方法　P144-145","source":"Word: GMAP道場2026春 (1)(1).docx","no":502,"idx":502},{"id":"docx-2026春-ファイナンス-c2005e1b","season":"2026春","subject":"ファイナンス","scope":"4.DCF法","question":"2026年4月4日（土）＜ファイナンス＞\n出題範囲： 4.DCF法\n　\n■問4.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n　\n・毎年の受取額がある一定の割合で永久に増えていくキャッシュフローを ( ① ) と呼び、成長が著しい新興企業の ( ② ) の計算などに用いられる。\n　\n・1年目の受取額をCF1、キャッシュフローの成長率をg、割引率をrとすると、( ① ) の現在価値は以下のようになる。\n　\n・PV= ( ③ )\n　\n　\n　\nA. ①永久年金　②現在価値　③CF1/(r-g)\nB. ①割増永久年金　②企業価値　③CF1/(r-g)\nC. ①割増永久年金　②企業価値　③CF1/(r+g)\nD. ①永久年金　②企業価値　③CF1/(r+g)","answer":"■正解：B\n■解説：\n・ファイナンスでは資産の価値を「その資産が生み出すキャッシュフローの現在価値」としてとらえ、算出の際に用いる手法がDCF法 (割引キャッシュフロー法) です。\n・DCF法では価値を「将来のキャッシュフロー」と定義し、それ以外に価値は認められていません。\n・キャッシュフローには様々なパターンがあり、割増永久年金は3つある典型的なパターンの1つです。\n・永久年金を生み出す資産価値として土地や耐用年数の十分長い不動産が挙げられますが、成長が著しい新興企業の企業価値の計算には割増永久年金が用いられます。\n■出典：グロービス マネジメントブック 改訂3版\n4．DCF法 P.142-143","source":"Word: GMAP道場2026春 (1)(1).docx","no":503,"idx":503},{"id":"docx-2026春-ファイナンス-a2e2f68b","season":"2026春","subject":"ファイナンス","scope":"3.金銭の時間的価値：現在価値","question":"2026年4月4日（土）＜ファイナンス＞\n出題範囲：3.金銭の時間的価値：現在価値\n■問3.下記文章中の（①）〜（④）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n・将来に受け取る（①）の（②）価値は、（③）を用いて計算することができる。\n不確実性が高いほど（③）は高くなり、現在価値は（④）なる。\nA.①株式、②未来、③割引率、④小さく\nB.①株式、②現在、③利益率、④大きく\nC:①現金、②未来、③割引率、④大きく\nD.①現金、②現在、③割引率、④小さく","answer":"■正解：D\n■解説：\n・ファイナンスでは「今日の１円は明日の１円よりも価値がある」という考え方をする。将来のある金額と同等の価値がある今日の金額のことを（将来のある金額の）現在価値という。\n・今日の１円に比べて明日の１円が不確実となる理由は、期待していた額面の金銭が手に入らない場合や、インフレーションやデフレーションにより金銭の購買力が変化する場合があるからである。\n・将来ｎ年後に受け取る現金Cの現在価値（PV）は、割引率（r）を用いて計算することができる。\nPV= C/(1+ｒ)^n\n・割引率は将来受け取るキャッシュフローのリスクに応じて決められる。不確実性（リスク）が高いほど、割引率は高くなり、現在価値は小さくなる。\n■出典：グロービス マネジメントブック 改訂3版\n3.金銭の時間的価値：現在価値 P.140-141","source":"Word: GMAP道場2026春 (1)(1).docx","no":504,"idx":504},{"id":"docx-2026春-ファイナンス-cf9581db","season":"2026春","subject":"ファイナンス","scope":"2. ファイナンス理論の体系","question":"2026年4月4日（土）＜ファイナンス＞\n出題範囲：2. ファイナンス理論の体系\n■問2.下記文章中の（①）～（ ⑤）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\nファイナンス理論は大きく、（①）と（②）の2つに分けられる。前者は企業に余剰資金を提供して運用したいと思っている投資家の理論、後者は事業に必要な資金を金融市場から調達したいと思っている企業側の理論ということができる。\n（①）では、投資家が投資した際のリスクと利回り（リターン）の関係や、投資対象資産の価値・価格が主要なテーマとなる。\n（②）の中心的なテーマは、企業が資金調達を行う際、どのような手段で調達すれば（③）を最大化できるかということだ。企業の資金調達方法としては大きく（④）（社債や銀行借入れ）による調達と、（⑤）による調達という2つの手段がある。\nA. ①投資理論　②企業金融理論　③収益　④負債　⑤株主資本\nB. ①企業金融理論　②投資理論　③企業価値　④株主資本　⑤負債\nC. ①投資理論　②企業金融理論　③企業価値　④負債　⑤株主資本\nD. ①企業金融理論　②投資理論　③収益　④株主資本　⑤負債","answer":"■正解：C\n■解説：\nファイナンス理論は大きく、投資理論（インベストメント）と企業金融理論（コーポレート・ファイナンス）の２分野で構成されています。\n投資理論では、投資家が投資した際のリスクと利回り（リターン）の関係や、投資対象資産の価値・価格が主要なテーマとなります。\n企業金融理論では、いろいろな資金調達手法を組み合わせて、企業の価値を最大にすることが中心的なテーマとなり、企業経営者は、企業価値を最大化するという経営目標の達成を目指します。企業の価値について考えるときの前提となるのが、「企業価値は、将来その企業が生み出すと予想されるキャッシュフローを現時点の価値に換算したものに等しい」という考え方です。\n計算上の企業価値が最大になる最適資本構成（負債と株主資本の割合）を検討します。その結果を踏まえて、企業経営者は戦略的な意思決定を行なわなくてはなりません。\n■出典：グロービス マネジメントブック 改訂3版\n2.  ファイナンス理論の体系 P.138-139","source":"Word: GMAP道場2026春 (1)(1).docx","no":505,"idx":505},{"id":"docx-2026春-ファイナンス-422235b1","season":"2026春","subject":"ファイナンス","scope":"1. 企業経営と企業財務","question":"2026年4月4日（土）＜ファイナンス＞\n出題範囲：1. 企業経営と企業財務\n■問1.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n企業経営における財務の役割は経営目標の実現のために、どのような投資対象にいくら投資するか、どのような手段で必要な資金を調達するかを判断し実行することである。\n企業は資金を得るために（①）を投資家向けに発行したり、銀行から借り入れを行う。この資金が主に企業の事業活動に要する資産の購入などの事業投資活動に充てられる。\nその後、事業活動が成功すれば事業投資が（②）を生み出す。\nこの（②）は企業内で保留されて再び事業投資に振り向けられるかこの企業に資金を提供した（③）に還元される。\nA. ①有価証券　②売上　③従業員\nB. ①有価証券　②収益（キャッシュフロー）③投資家や銀行\nC. ①インベストメント　②収益（キャッシュフロー）　③従業員\nD. ①クーポン券　②キャピタルゲイン　③社会\n（正解は下にあります）","answer":"■正解：Ｂ\n■解説：\n・企業は株式や債券などの有価証券を発行し市場を通じて投資家から資金を集めます。\n・事業活動が生み出した収益（キャッシュフロー）は、事業へ再投資を行うか、資金の\n提供者である株主や債権者（銀行など）への還元を行うか決める必要があります。\n企業の資金の調達と還元を管理しながら、企業価値の最大化を図ることが、\n企業財務の役割と言えます。\n■出典：グロービス マネジメントブック 改訂3版\n1．企業経営と企業財務 P.136-137","source":"Word: GMAP道場2026春 (1)(1).docx","no":506,"idx":506},{"id":"docx-2026春-アカウンティング-32a22873","season":"2026春","subject":"アカウンティング","scope":"6. 貸借対照表（資産）","question":"2026年4月3日（金）＜アカウンティング＞\n出題範囲：6. 貸借対照表（資産）\n \n■問6.流動資産と固定資産の説明について次のうち誤っているものを選択してください。\n \nA. 流動資産は短期間に現金化するものと短期間に費用となるものから構成される。\n \nB．流動資産は当座資産、たな卸資産、繰延資産、その他流動資産の４つに分類される。\n \nC．有形固定資産とは建物・機械装置などの償却資産と、土地・建設仮勘定などの非償却資産から成る。\n \nD．たな卸資産とは営業活動の仕入れ・生産段階で生じる完成品・半製品などのように販売されることで初めて現金化される資産を指す。","answer":"■正解：B\n \n■解説：\n流動資産とは当座資産、たな卸資産、その他流動資産の３つに分類される。当座資産とは売掛金や受取手形など営業活動の販売段階で生じる売掛金・受取手形など、営業活動の回収段階で生じる現金・預金に近い資産を指す。たな卸資産については問題の選択肢Dを参照。その他流動資産とは１年以内に費用として損益計算書に計上される（費用化される）前払費用などを指す。なお、繰延資産とは固定資産と同じく短期に費用化できない資産として特別に認められているもの。社債発行差金や研究開発費などを繰延資産として計上する場合があるが、実際には公開企業ではあまり見られない科目である。\n■出典：グロービス マネジメントブック 改訂3版\n貸借対照表（資産）Ｐ102～103","source":"Word: GMAP道場2026春 (1)(1).docx","no":507,"idx":507},{"id":"docx-2026春-アカウンティング-05354ad7","season":"2026春","subject":"アカウンティング","scope":"5. 損益計算書","question":"2026年4月3日（金）＜アカウンティング＞\n出題範囲：5. 損益計算書\n■問05. 次に基づき、A社の「税引等調整前当期純利益」を計算してください（単位：億円）。\n・売上高：1,000\n・売上原価：600\n・販売費及び一般管理費：250\n・受取利息：10\n・受取配当金：20\n・支払利息：15\n・社債利息：5\n・特別利益：40\n・特別損失：10\nA：190\nB：160\nC：400\nD：150","answer":"■正解：A\n■解説：売上総利益400➡営業利益150➡経常利益(150+30-20)=160 ➡税引等調整前当期純利益 (160+40-10)=190\n■出典：グロービス マネジメントブック 改訂3版\n5．損益計算書      P.100-101","source":"Word: GMAP道場2026春 (1)(1).docx","no":508,"idx":508},{"id":"docx-2026春-アカウンティング-bbeb4e2c","season":"2026春","subject":"アカウンティング","scope":"4.財務諸表の成り立ち","question":"2026年4月3日（金）＜アカウンティング＞\n出題範囲：4.財務諸表の成り立ち\n　\n■問4. 財務諸表（財務三表）の定義や特徴について、誤っているものを選択してください。\n　\nA.損益計算書（P/L）は、ある一定の期間における企業の経営成績を示したもので、企業の1年間の活動をまとめたビデオテープに例えられる。\n　\nB.企業会計は「発生主義・実現主義」をとっているため、キャッシュフロー計算書における現金の増減は、帳簿上の利益（損失）の額と必ず一致する。 \n　\nC.貸借対照表（B/S）は、ある時点（決算期末時点）での企業の資産内容を明らかにしたもので、スナップ写真に例えられる。\n　\nD.損益計算書（P/L）では、企業活動を内容別に分けて費用と収益を対応させており、営業活動の成果を表す営業利益や、財務活動の成果を表す経常利益などを把握できる。","answer":"■正解：B\n　\n■解説：\n　\n企業会計は一般に、発生主義・実現主義がとられているため、必ずしも利益（損失）と現金の増減が一致するとは限らない。帳簿上は利益が出ていても、資金繰りの問題で倒産に追い込まれるケース（いわゆる黒字倒産）もある。したがって、事業を継続させるには、利益（損失）だけでなく、実際の現金の動きを把握する必要がある。\n　\n■出典：グロービス マネジメントブック 改訂3版\n財務諸表の成り立ち P.98-99","source":"Word: GMAP道場2026春 (1)(1).docx","no":509,"idx":509},{"id":"docx-2026春-アカウンティング-8b9e68f1","season":"2026春","subject":"アカウンティング","scope":"3. 収益および費用の認識","question":"2026年４月３日（金）＜アカウンティング＞\n出題範囲：3. 収益および費用の認識\n■問３. 会計年度の経営成績を正しく示すためには、期間損益計算に基づく必要があります。その認識基準として、現金主義、発生主義、実現主義の3つの方法がありますが、以下のうち、収益と費用の認識として、正しいものを全て選んでください。\nA.費用収益対応原則とは、発生した費用のうち、その期の収益獲得に貢献した部分だけをその期の費用として測定・認識することである。\nB.現金主義では、現金の収入（入金）・支出（支払い）と同時に収益・費用を認識する。企業活動の実態においては、現金主義による期間損益計算では経営成績を正しく示すことができない場合が多い。\nC.実現主義は、経済的価値の増加が実現したときに収益を認識する。たとえば、顧客から注文を受けた段階で企業経済価値は増加したことになるが、実現主義ではこの段階で収益を計上し、発生主義の場合は、確実に商品を顧客宛に発送した段階で収益を計上する。\nD.家賃を後払いする場合は、まだ現金を支払っていなくても、使用期間相当分は今期の費用として計上されることは、現金主義に基づく。","answer":"■正解：Ａ，Ｂ\n■解説：\nＡ.正しい\nＢ.正しい\nC.たとえの説明が発生主義と実現主義が逆。注文を受けた段階で収益計上するのが発生主義で、確実に商品を顧客宛に発送した段階で収益を計上するのが実現主義。\nD.現金主義ではなく発生主義に関する説明。\n■出典：グロービス マネジメントブック 改訂3版\n3.収益および費用の認識 P.96-97","source":"Word: GMAP道場2026春 (1)(1).docx","no":510,"idx":510},{"id":"docx-2026春-アカウンティング-e1b4a38a","season":"2026春","subject":"アカウンティング","scope":"2. アカウンティングの目的","question":"2026年4月3日（金）＜アカウンティング＞\n出題範囲：2. アカウンティングの目的\n■問2.アカウンティングの目的や特徴について、正しいものを選択してください。\nA.管理会計はさまざまな法律や規則（会社法・金融商品取引法・税法など）によって厳格に規定されている。\nB.財務会計上の利益と税務会計上の課税対象所得は必ず一致する。\nC.企業活動のグローバル化やステークホルダーの多国籍化に伴い、日本でも会計基準の見直しが行われてきている。その一例として、連結を主、単体を従とした開示制度が挙げられる。\nD.経営者が自社の経営状況を把握したり、戦略を策定する際に、どの部門も納得するような合理的な計算を行うことは求められない。","answer":"■正解：Cのみ\n■解説：\nA不正解：管理会計ではなく財務会計の内容です。\nB不正解：必ず一致するというのは誤りです。「必ずしも一致しない」が正解です。\nC正解：正解です。他にも連結キャッシュフロー計算書の義務化、税効果会計や退職給付会計などの導入があります。\nD不正解：どの部門も納得するような合理的な計算を行うことが求められます。そこに管理会計の意義があります。\n■出典：グロービス マネジメントブック 改訂3版\n2.アカウンティングの目的 P.94-95","source":"Word: GMAP道場2026春 (1)(1).docx","no":511,"idx":511},{"id":"docx-2026春-アカウンティング-cd62d55c","season":"2026春","subject":"アカウンティング","scope":"1. 企業経営とアカウンティング","question":"2026年4月3日(金)＜アカウンティング＞\n出題範囲：1. 企業経営とアカウンティング\n■問01.企業経営とアカウンティングについて説明した文章のうち、誤っているものを選択してください\nA.アカウンティングは企業の経済活動を映す鏡であり、ステークホルダーに対して説明責任を果たすことを目的にしている\nB.ステークホルダーとは、企業の活動によって直接的に影響を受ける人々や団体のことを指し、具体的には株主や経営者、従業員、債権者のみを指す。間接的に影響を受ける地域住民や行政官庁などは含まない。\nC.経営活動に関する情報収集という点では、株主よりも経営者のほうが優位に立ちやすい。このように受け取る情報に格差があることを、「情報の非対称性」という。\nD.企業のディスクロージャーとしては、会社法や金融商品取引法、企業会計原則、法人税法などで開示が義務付けられている制度的ディスクロージャーに加えて、株式市場に自社をアピールするためにコミュニケーション戦略の一部として行われるＩＲ活動がある。ＩＲ活動は、自発的ディスクロージャーに分類される。","answer":"■正解：Bが誤り\n■解説：\nステークホルダーとは、企業の活動によって直接的・間接的に影響を受ける人々や団体のことを指します。具体的には株主や経営者、従業員、金融機関、債権者、取引先、競合企業、顧客、地域住民、環境保護団体、格付け機関、税務当局、行政官庁などです。\n■出典：グロービス マネジメントブック 改訂3版\n1.企業経営とアカウンティング P.92-93","source":"Word: GMAP道場2026春 (1)(1).docx","no":512,"idx":512},{"id":"docx-2026春-組織行動-9a060355","season":"2026春","subject":"組織行動","scope":"9. チーム・マネジメント","question":"2026年4月2日（木）＜組織行動学＞\n出題範囲：9. チーム・マネジメント\n \n■問     6.リーダーが高い成果を上げるチームをつくるために重要なことの１つに「凝集性」がある。賛同するメンバー、そうでないメンバーを見極める中で、リーダーは「集団の発展段階」を考慮に入れ、構成員に働きかけていくことを求められる。「集団の発展段階」の５つの形成プロセスである下記のA～Eをプロセス順に並び替えなさい。\n \nA.規範形成期\nB.終了期\nC.形成期\nD. 実現期\nE.激動期","answer":"■正解：C→E→A→D→B\n \n■解説：\n形成期→激動期→規範形成期→実現期→終了期\n形成期：集団結成が明示され、構成員が顔合わせする段階。人が集まっただけで、集団の機能もなく、目的や規範も共有されていない。\n激動期：議論・緊張・衝突が生まれる段階。構成員間での考え方や主張がぶつかり、集団内での自分の役割や地位についてイメージができる。\n規範形成期：構成員が規範を作り出す段階。集団の目的・各自の役割を明確にし共有する。\n実現期：特定の目的を持った集団として構成員が統合され、集団が機能する段階。マネジメントの巧拙によっては、このステップに至らないまま解散することもある。\n終了期：集団目的の達成や目的の分化などの理由によって集団が解散する段階。\n \n■出典：グロービス マネジメントブック 改訂3版\n9．チーム・マネジメントP.198-199","source":"Word: GMAP道場2026春 (1)(1).docx","no":513,"idx":513},{"id":"docx-2026春-組織行動-171d7eb2","season":"2026春","subject":"組織行動","scope":"8.集団のメカニズム","question":"2026年4月2日(木)＜組織行動学＞\n出題範囲：8.集団のメカニズム\n \n■問5.下記文章中の（①）から（⑥）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n＜集団を捉える視点＞\n■①：集団の構成員間で共有する行動基準を指す。\n■②：集団において期待される行動様式を指す。\n■③：集団内における相対的な位置付けを指す。\n■④：集団の構成員数を指す。\n■⑤：集団の構成員の組み合わせの多様さを指す。\n■⑥：集団が構成員を引きつけ、その集団の一員であり続けるように動機づける度合いを指す。\nA. ①役割　②規範　③凝集性　④多様性　⑤規模　⑥地位\nB. ①役割　②規範　③凝集性　④規模　⑤多様性　⑥地位\nC. ①規範　②役割　③地位　④規模　⑤多様性　⑥凝集性\nD. ①規範　②役割　③地位　④多様性　⑤規模　⑥凝集性","answer":"■正解：C\n■解説：\n①規範：たとえば、構成員間で「役職が上位の人に対して批判的意見を言うべきではない」という意識が浸透している場合、それがその集団の規範と言える。\n②役割：人はさまざまな集団に属するが、集団によって期待される役割が対立したり矛盾することがある。その結果、強いストレスが生じたり、期待される役割を果たせなかったりする。\n③地位：地位は、公式に規定される場合と集団の規範や価値観に基づき、個人の能力や経験などによって非公式に与えられる場合がある。地位の獲得は重要なモチベーションの１つである。\n④規模：一般に、人数が多ければより多様な意見や情報を入手でき、少なければ意思決定や行動がより迅速になる。\n⑤多様性：構成員のバックグラウンドや文化、価値観などが多様な集団は、同質的な人々から成る集団よりも、個人間の相違が大きいため、短期的にはコンフリクトを生むことが多い。しかし、そうした困難をいったん克服できれば、構成員がさまざまな情報や能力を持っていることの利点が発揮され、より高い成果を生み出す可能性が高い。\n⑥凝集性：凝集性の高さは、各構成員の魅力や構成員間の相互作用、集団の目標や規模などの要素によって決まる。集団の凝集性が高いとき、共有する目標に対する集団としての成果が大きくなる傾向がある。\n■出典：グロービス マネジメントブック 改訂3版\n8.集団のメカニズム　P196-197","source":"Word: GMAP道場2026春 (1)(1).docx","no":514,"idx":514},{"id":"docx-2026春-組織行動-8d276e53","season":"2026春","subject":"組織行動","scope":"7. モチベーションとインセンティブ","question":"2026年4月2日（木）＜組織行動学＞\n出題範囲：7. モチベーションとインセンティブ\n \n■問4.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n \n・(①)は、人間を「本来怠け者で責任を回避しようとする」(②)理論と、\n「本来勤勉で、進んで仕事を行い、責任を取ろうとする」(③)理論と考える。\n・近年では(④)理論に基づいて(⑤)を考えることが必要だと言われている。\nA. ①マグレガー　②X　③Y　④Y　⑤動機づけ\nB. ①ポーター　②X　③Y　④X　⑤動機づけ\nC. ①マグレガー　②Y　③X　④Y　⑤報酬\nD. ①ポーター　②Y　③X　④X　⑤報酬","answer":"■正解：A\n  \n■解説：\nD.マグレガーは、人間をX理論とY理論で説明している。\nX理論では「人間は本来怠け者で、責任を回避しようとするものだ」と考えるのに対し、\nY理論では「人間は本来勤勉で、進んで仕事を行い、責任を取ろうとするものだ」と考える。\n近年では、Y理論に基づいて動機づけを考えることが必要だと言われている。\n \n■出典：グロービス マネジメントブック 改訂3版\n7．モチベーションとインセンティブ　P.194-195","source":"Word: GMAP道場2026春 (1)(1).docx","no":515,"idx":515},{"id":"docx-2026春-組織行動-1714a17b","season":"2026春","subject":"組織行動","scope":"6. パワー","question":"2026年4月2日（木）＜組織行動学＞\n出題範囲：6. パワー\n \n■問3.多様なステークホルダーに影響を与える「パワー」、すなわち「人や組織の行動に影響を与える力」に関する記述として、正しいものはどれか。\n \nA.パワーを構成する要素は「強制力」「報酬力」「正当権力」「専門力」の4つである。\n \nB.戦略の実現には必ずしも1人で全てのパワーの源泉を兼ね備えている必要はない。\n \nC.パワーの受け手と与え手の関係によって、影響力の度合いは変化するが、こうした関係は不変ではない。\n \nD.社会的・倫理的に問題のある方法を用いることを避けるために、企業が求める行動規範や価値観を明確にし、社内に浸透させる必要がある。","answer":"■正解：B,C,D\n  \n■解説：\nA.アメリカの社会心理学者のジョン・フレンチとバートラム・ラーベンによると、パワーを構成する5つの要素は「強制力」「報酬力」「正当権力」「専門力」、そして「同一視力」である。\n \n■出典：グロービス マネジメントブック 改訂3版\n6.パワー p.192-193","source":"Word: GMAP道場2026春 (1)(1).docx","no":516,"idx":516},{"id":"docx-2026春-組織行動-b83cbc19","season":"2026春","subject":"組織行動","scope":"5. エンパワーメント","question":"2026年4月2日（木）＜組織行動学＞\n出題範囲：5. エンパワーメント\n \n■問2.エンパワーメントの成功要件として誤っているものを全て選んでください。 \n \nA.経営理念、ビジョンの共有：「組織は何のために存在するのか」という組織の存在意義や使命と、ある時点までに「こうなっていたい」と思う組織の到達目標を通して、「必ずすべきこと」や「すべきではないこと」などの行動規範を共有する。\n \nB.正当な評価と報奨：OBの取り組みとしては、行動規範にかなった行動はほめ、反する行動に対しては適切な罰を与えるなどが挙げられる。これら評価と報奨が対象とする行動と、経営理念やビジョンが求める行動規範が乖離している場合、構成員は困惑し、エンパワーメントを行っても組織目標の実現に結びつかない。\n \nC.能力の把握と資源の提供：エンパワーメントを行う際には、業務を任せる相手の性格を見極めることが重要である。構成員の性格を把握したうえで、自律的に動くために必要な情報や経営資源を提供し、成功体験を積ませることにより、構成員のモチベーションをさらに高めることができる。","answer":"■正解：B,C\n  \n■解説：\nＢ：(正) 改善を求める　（誤）適切な罰を与える\n正当な評価と報奨：OBの取り組みとしては、行動規範にかなった行動はほめ、反する行動に対して改善を求めることなどが挙げられる。これら評価と報奨が対象とする行動と、経営理念やビジョンが求める行動規範が乖離している場合、構成員は困惑し、エンパワーメントを行っても組織目標の実現に結びつかない。\nＣ：（正）能力　（誤）性格\n能力の把握と資源の提供：エンパワーメントを行う際には、業務を任せる相手の能力を見極めることが重要である。構成員の能力を把握したうえで、自律的に動くために必要な情報や経営資源を提供し、成功体験を積ませることにより、構成員のモチベーションをさらに高めることができる。\n■出典：グロービス マネジメントブック 改訂3版\n5．エンパワーメント P.190-191","source":"Word: GMAP道場2026春 (1)(1).docx","no":517,"idx":517},{"id":"docx-2026春-組織行動-7617f59a","season":"2026春","subject":"組織行動","scope":"4. リーダーシップとマネジメント","question":"2026年4月2日（木）＜組織行動学＞\n出題範囲：4. リーダーシップとマネジメント\n \n■問1.下記A～Dの選択肢のうち、リーダーシップのステップとして正しいものを選んでください。\nA. ①短期的な計画や予算を立案する　②組織構造の設計、人員の配置、詳細計画のコミュニケーションなどを行う　③予算や実績管理などを行い、問題解決を図る\nB. ①短期的なビジョンを提示する　②ビジョンを伝達することにより、メンバーを統合する　③予算や実績管理などを行い、問題解決を図る\nC. ①長期的な計画や予算を立案する　②組織構造の設計、人員の配置、詳細計画のコミュニケーションなどを行う　③メンバーの動機づけを行う\nD. ①長期的なビジョンを提示する　②ビジョンを伝達することにより、メンバーを統合する　③メンバーの動機づけを行う","answer":"■正解：D\n \n■解説：\nAはマネジメントに対する記述となる 。BとCはステップも内容も誤り。グロービスマネジメントブックでは、マネジメントとリーダーシップを異なる機能としてとらえるハーバード・ビジネススクールのJ.コッター教授の理論に従う。コッターは、経営陣やマネジャーに求められる機能を「変革を推し進める機能」と「効率的に組織を運営する機能」の2つに分け、前者をリーダーシップ、後者をマネジメントと定義した。\n \n■出典：グロービス マネジメントブック 改訂3版\n4．リーダーシップとマネジメント P.188-189","source":"Word: GMAP道場2026春 (1)(1).docx","no":518,"idx":518},{"id":"docx-2026春-人的資源管理-bda2b0e2","season":"2026春","subject":"人的資源管理","scope":"14.組織形態","question":"2026年4月1日（水）＜人的資源管理＞\n出題範囲：14.組織形態\n■問6. 「マトリクス型組織」についての説明で誤っているものを1つ選びなさい。\nA. 「マトリクス型組織」には、事業を中心とした組織形態に、専門性の高い情報を共有化させる特徴がある。\nB.「マトリクス型組織」では、その組織の構成員は役割の違う2つの組織に属することになる。\nC. 「マトリクス型組織」では、権限や責任が明確になり、専門性の高い組織運営が可能になる。\nD. 「マトリクス型組織」では、1人の人間が2つの役割を同時に効果的に果たすことが期待される。","answer":"■正解：C\n■解説：\n「マトリクス型組織」とは、\n「事業部制組織」と「機能別組織」のそれぞれの長所を組み合わせて専門性の高い情報の伝達を円滑に行うことで、\n1人の人間が2つの役割を同時に効果的に果たすことが期待される組織形態である。\n（A・B・Dが正しい）\n一方で、デメリットとして、各構成員は「事業部制」のボスと「機能別」のボスの2名のボスを持つことになる。その結果として、権限や責任があいまいかつ流動的になることがあり、指揮命令系統が混乱したり、業務に支障が生じたりする恐れがある。\n（Cの「権限や責任が明確」が誤り）\n■出典：グロービス マネジメントブック 改訂3版\n14.組織形態　P.208-209","source":"Word: GMAP道場2026春 (1)(1).docx","no":519,"idx":519},{"id":"docx-2026春-人的資源管理-69f055e9","season":"2026春","subject":"人的資源管理","scope":"13.組織設計","question":"2026年4月1日（水）＜人的資源管理＞\n出題範囲：13.組織設計\n■問5. 組織設計についての説明で誤っているものを1つ選びなさい。\nA. 組織設計とは、企業戦略を遂行するために、個々の業務をどのように組み合わせ、どのように実行するかを決定することである。\nB. 組織設計では、業務プロセスや意思決定プロセスなどの動的な側面も考慮する。\nC. 一度出来上がった組織を変えることは難しく、しばしば現状維持へと走りがちになる。\nD. 組織設計は、外部環境や戦略との整合性を考慮せず、組織内部の状況に合わせて決定すべきである。","answer":"■正解：D\n■解説：\n企業は、外部環境や企業戦略との整合性を常に問い続けながら、競争優位の源泉を生み出し、それを維持できるような組織構造の構築を目指していく必要がある。\n■出典：グロービス マネジメントブック 改訂3版\n13.組織設計　P.206-207","source":"Word: GMAP道場2026春 (1)(1).docx","no":520,"idx":520},{"id":"docx-2026春-人的資源管理-6a89b91d","season":"2026春","subject":"人的資源管理","scope":"12. 組織文化と企業経営","question":"#GMAP2026S_HRM\n2026年4月1日（水）＜人的資源管理＞\n出題範囲：12. 組織文化と企業経営\n■問4.組織文化と企業経営について、誤っているものをすべて選択してください。\nA.企業文化は、「組織構成員が共有する信念、価値観、行動規範の集合体」と定義できる。\nB.組織文化の生成段階では、個々の構成員の価値観や信念などが衝突しあう。\nC.生成された組織文化は次の浸透段階で、儀式や逸話、経営陣のメッセージなど具体的になったものや、すでに組織文化を共有している構成員との交流などを通して他の構成員に伝播していく。\nD.組織文化の機能には、「判断や行動の指針」、「情報伝達の複雑化」、「個人の動機づけ」がある。","answer":"■正解：Dのみ\n■解説：\n正しくは、組織文化の機能には、「判断や行動の指針」、「情報伝達の簡素化」、「個人の動機づけ」がある。\n「情報伝達の複雑化」⇒「情報伝達の簡素化」でした。\n組織文化は、判断や行動の指針を示すことによって、公的な情報伝達において伝えなければならない情報の量を軽減する。\n■出典：グロービス マネジメントブック 改訂3版 　\n12.組織文化と企業経営 　P.204-205","source":"Word: GMAP道場2026春 (1)(1).docx","no":521,"idx":521},{"id":"docx-2026春-人的資源管理-bdc332dc","season":"2026春","subject":"人的資源管理","scope":"3.組織行動学と人的資源管理","question":"2026年4月1日（水）＜人的資源管理＞\n出題範囲：3.組織行動学と人的資源管理\n　\n■問3.人的資源管理（HRM）における4つの要素の説明のなかで、誤っているものを選択してください。\nA.HRポリシーとは、企業の経営理念をもとに戦略を遂行し、ビジョンを実現していくために、組織と人がどうあるべきかを示すもの。企業の経営理念、ビジョン、戦略と密接に関係したものになる。\nB.HRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるか決めたものが経営戦略である。\nC.HRポリシーに基づいて、個々の構成員をどのように活用・管理していくかを決めたものがHRシステムで、「人員配置」「報奨」「評価」「能力開発」に分けられる。\nD.組織文化とは、組織構成員が共有する信念、価値観、行動規範の集合体のこと。企業は経営理念やビジョン、HRMの施策などを通して、組織文化に間接的な影響を与えることができる。","answer":"■正解：B\n　\n■解説：\nHRポリシーに基づいて、個々の構成員をどのように組み合わせて戦略を遂行させるか決めたものは組織構造です。\n経営戦略は、企業が競争優位を築くための「目的」や「方向性」であり、HRMが整合させるべき外部の前提条件ですが、HRMそのものの構成要素には含まれません。\n■出典：グロービス マネジメントブック 改訂3版\n3.組織行動学と人的資源管理 P.186-187","source":"Word: GMAP道場2026春 (1)(1).docx","no":522,"idx":522},{"id":"docx-2026春-人的資源管理-3dee93e9","season":"2026春","subject":"人的資源管理","scope":"2. 人・組織のマネジメントに影響を及ぼす要因","question":"2026年4月1日（水）＜人的資源管理＞\n出題範囲：2. 人・組織のマネジメントに影響を及ぼす要因\n　\n■問2.人・組織のマネジメントに影響を及ぼす要因について、正しいものを選択してください。\n　\nA.人・組織のマネジメントは、経営理念やビジョンとの整合性を図ることが重要であり、経営戦略との整合性を図る必要はない。\nB.人・組織のマネジメントを考える際には、まず外部環境を把握する必要がある。\nC.外部環境の中でも、労働市場、法的規制、労働組合、経済状況、技術的進歩、競合他社は人・組織のマネジメントにとくに大きな影響を与える可能性がある。\nD.競争力を維持するためには、競合他社の従業員と同等もしくはそれ以上の能力・資質を持った従業員を獲得すれば、育てるような施策を用意する必要はない。","answer":"■正解：BとC\n　\n■解説：\nA：経営戦略との整合性も必要。\n組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求めていることを、具体的な施策を通して伝えなくてはならない。それには、経営理念やビジョンを実現するための経営戦略と、それを支援する人・組織のマネジメントが必要となる。このとき、経営理念、ビジョン、経営戦略、人・組織のマネジメントのすべてにおいて整合性をとることが重要だ。これらの間で整合性がとれていなければ、経営理念に共感を覚えて入社した従業員のモチベーションが下がったり、戦略目標の実現を妨げるような行動をとるなどの副作用が生じる恐れがある。\nD：育てるような施策を用意する必要がある。\n競争力を維持するためには、競合他社の従業員と同等もしくはそれ以上の能力・資質を持った従業員を獲得し、育てるような施策を用意する必要がある。\n　\n■出典：グロービス マネジメントブック 改訂3版\n2.人・組織のマネジメントに影響を及ぼす要因 P.184-185\nおはようございます。2026期ENAG-Aの笹林良晃（ささばやし）です。","source":"Word: GMAP道場2026春 (1)(1).docx","no":523,"idx":523},{"id":"docx-2026春-経営戦略-c04e0739","season":"2026春","subject":"経営戦略","scope":"6.事業ポートフォリオと事業ライフサイクル","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：6.事業ポートフォリオと事業ライフサイクル\n　\n■問6.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n・事業ポートフォリオは、事業の（①）、自社の（②）、他の事業との（③）という3つの視点から考える必要がある。\n　\nA. ①ライフサイクル　②ブランド力　③エナジー\nB. ①魅力度　②競争優位　③シナジー\nC. ①実現性　②株主　③カニバリズム\nD. ①多角化　②顧客　③収益性","answer":"■正解：B\n■解説：\n・事業ポートフォリオとは、①事業の魅力度、②自社の競争優位、③他の事業とのシナジーという3つの視点から考える必要がある。\n■出典：グロービス マネジメントブック 改訂3版\n6.事業ポートフォリオと事業ライフサイクル P.12-13（タイトル下にあるPOINTより）\nおはようございます。2026EONL-Bの寺本直喜です。\n今春からGMAP幹事団に参戦させて頂きました！宜しくお願い致します。\n皆さん、7月期の履修登録はお済みでしょうか。\nマネジメントブックを購入して満足していた方、開けても数分で閉じてた方。今がチャンスです。問題を解くためにはマネジメントブックは必須で、使えます…それでは問題です。","source":"Word: GMAP道場2026春 (1)(1).docx","no":524,"idx":524},{"id":"docx-2026春-経営戦略-88269e3f","season":"2026春","subject":"経営戦略","scope":"5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：5. 全社戦略の構成要素(2)：コア・コンピタンスと資源配分\n■問5. 企業の「コア・コンピタンス」を見極める場合に考える点について、次の5つから「誤っているもの」を全て選択してください。\n①　模倣可能性(Imitability)\n②　移転可能性 (Transferability)\n③　代替可能性 (Substitutability)\n④　信頼性 (Reliability)\n⑤　耐久性 (Durability)","answer":"■正解：「④のみ」が誤り。\n■解説：\n正しくは、「④ 稀少性 (Scarcity)」です。\n「コア・コンピタンス」は企業内部で培った中核的な力で、自社独自の価値を生み出す源泉となります。「コア・コンピタンス」を見極める場合、5つの要素「①　模倣可能性(Imitability)、②　移転可能性 (Transferability)、③　代替可能性 (Substitutability)、④　稀少性 (Scarcity)、⑤　耐久性 (Durability)」について考える必要がある。①②③の可能性が低いほど、また④⑤が高いほど、競争優位は持続しやすくなると言われる。\nなお、競争優位を築けたとしても、市場環境の変化とともに陳腐化するおそれがあるため、「継続的な投資」「コア・コンピタンスの再定義」「新たな能力の育成」などの努力が欠かせません。\n■出典：グロービス マネジメントブック 改訂3版\n全社戦略の構成要素(2)：コア・コンピタンスと資源配分 P.10-11\nおはようございます。2025期EONL-Aの鎌田晃造（かまてぃ）です。\n昨年はGMAP道場にとてもお世話になりました。今年は一つでもGIVEを増やす活動に取り組んでいきます。","source":"Word: GMAP道場2026春 (1)(1).docx","no":525,"idx":525},{"id":"docx-2026春-経営戦略-0845090c","season":"2026春","subject":"経営戦略","scope":"4.全社戦略の構成要素(1)：ドメイン","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：4.全社戦略の構成要素(1)：ドメイン\n　\n■問4.全社戦略で主に注目すべき3つの要素はどれか。\n　\nA.ドメイン、コア・コンピタンス、資源配分\n　\nB.売上高、利益率、株価\n　\nC.製品価格、広告宣伝、在庫管理\n　\nD.採用、教育、評価制度","answer":"■正解：A\n　\n■解説：\n全社戦略では主に、 ドメイン（事業を展開する領域）、 コア・コンピタンス（企業の中核的な力）、 資源配分（経営資源の全体的な最適化）に注目する必要がある。これらは持続的な競争優位を構築するために不可欠な要素だ。つまり、 どこで戦うのか「戦う土俵」を決め、 そこで他社より優位に立てる能力を発揮し、 その優位性を維持・発展できるように経営資源（ヒト、モノ、カネなど）を配分することによって、その企業の競争優位は確固たるものになる。\n　\n■出典：グロービス マネジメントブック 改訂3版\n4.全社戦略の構成要素(1)：ドメイン P.8-9\nおはようございます。2025期ETKY-Fの仲田淳子（じゅんこ）です。2026期の皆さん、ご入学おめでとうございます！一緒に学んでいきましょうね！","source":"Word: GMAP道場2026春 (1)(1).docx","no":526,"idx":526},{"id":"docx-2026春-経営戦略-4e73c3f6","season":"2026春","subject":"経営戦略","scope":"3. 戦略策定プロセス","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：3. 戦略策定プロセス\n■問3.下記文章中の（①）～（⑦）に入る語句を選択肢A～Gのうちから選んでください。\n戦略策定プロセスは通常、以下の流れをたどる。このプロセスは一方通行の流れではなく、仮説・検証を繰り返したり、実施結果や環境変化に応じて戦略の見直しを行うことも大切だ。\n　\n・（①）：戦略目標を策定する際の思想的なバックボーンとなる。\n・（②）：自社を取り巻く内外の環境に目を配る。市場における機会と脅威の発見、経営資源や自社の構造上の強みや弱みの把握によって、自社にとってのビジネスチャンスを見つける。\n・（③）：②を踏まえて、当該事業を成功させるための要件を探り、それを実現するために何をすべきかを検討する。\n・（④）：事業目標に到達するために戦略案を何通りか考え出し、事業展開の可能性を探る。\n・（⑤）：予想される結果や必要となる資源、実行の難易度などを検討し、実行すべき戦略を絞り込む。\n・（⑥）：戦略の遂行度合いを示す指標を設定し、どの程度実行されているかを把握できるようにする。複数のアクションプランが整合性を保ちながら実行できるように、評価・報奨制度、コミュニケーション、意思決定のルールなども整備する。\n・（⑦）：当初設定した期間終了後に、期待された効果を上げたか確認する。うまくいかなかった場合はその原因を解明し、必要に応じて修正案を考える。\n　\nA. 戦略の選択\nB. 環境分析\nC. 戦略オプションの立案\nD. 経営理念・ビジョン\nE. 戦略のレビュー\nF. 成功要因（Key Success Factor）の抽出\nG. 戦略の実行","answer":"■正解：①D、②B、③F、④C、⑤A、⑥G、⑦E\n■解説：\n・①D. 経営理念・ビジョン：戦略目標を策定する際の思想的なバックボーンとなる。\n・②B.環境分析：自社を取り巻く内外の環境に目を配る。市場における機会と脅威の発見、経営資源や自社の構造上の強みや弱みの把握によって、自社にとってのビジネスチャンスを見つける。\n・③F. 成功要因（Key Success Factor）の抽出：環境分析を踏まえて、当該事業を成功させるための要件を探り、それを実現するために何をすべきかを検討する。\n・④C. 戦略オプションの立案：事業目標に到達するために戦略案を何通りか考え出し、事業展開の可能性を探る。\n・⑤A. 戦略の選択：予想される結果や必要となる資源、実行の難易度などを検討し、実行すべき戦略を絞り込む。\n・⑥G. 戦略の実行：戦略の遂行度合いを示す指標を設定し、どの程度実行されているかを把握できるようにする。複数のアクションプランが整合性を保ちながら実行できるように、評価・報奨制度、コミュニケーション、意思決定のルールなども整備する。\n・⑦E.戦略のレビュー：当初設定した期間終了後に、期待された効果を上げたか確認する。うまくいかなかった場合はその原因を解明し、必要に応じて修正案を考える。\n■出典：グロービス マネジメントブック 改訂3版\n3．戦略策定プロセス P.6-7\n西の福岡からおはようございます。2025期TFKOのきりこです。いよいよ明日から4月ですね！26期の皆様は久しぶりの学生生活、便利に学割を活用して楽しみましょー🏫きっと諸先輩方がおすすめの学割をコメントで教えてくれるはず（他力本願）","source":"Word: GMAP道場2026春 (1)(1).docx","no":527,"idx":527},{"id":"docx-2026春-経営戦略-62c4855f","season":"2026春","subject":"経営戦略","scope":"2.経営理念と戦術レベル","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：2.経営理念と戦術レベル\n■問2.経営理念、経営戦略、全社戦略、事業戦略について、正しいものを全て選択してください。\nA.経営理念は、企業の存在意義や使命を普遍的な形で表した基本的価値観であり、従業員の求心力を高めたり、企業文化の形成に役割を果たしたりするもので、ビジョンとも言う。\nB.経営戦略とは、経営理念を実現するために、企業がどの事業領域でどのように戦うのかを示す具体的な方法論のことである。\nC.全社戦略とは、経営戦略の3つの戦略レベルのうち、どのように事業を組み合わせ、どのように各事業に経営資源を配分するかを決定することである。\nD.事業戦略とは、経営戦略の3つの戦略レベルのうち、個別の事業分野において競争に勝ち抜くための戦略をいう。事業の組み合わせや相乗効果を考慮し、事業間の整合性を保ちつつ事業戦略を構築することが、多角化企業の事業戦略において求められる。","answer":"■正解：Cのみ\n■解説：\nA：前段は正しい。経営理念は企業の存在意義や使命を普遍的な形で表した基本的価値観。一方ビジョンは、経営理念に基づき、自社が目指す中期的なイメージを示すもの。\nB：説明は全社戦略について。経営戦略は、経営理念と現実との間のギャップを埋めるための具体的な方法論をいい、全社戦略だけでなく事業戦略や機能戦略も含む。\nC：正しい\nD：前段は正しい。事業の組み合わせや資源配分について、事業間の調整を図り、相乗効果の発揮を検討し、事業間の整合性を考慮するのは全社戦略の役割。\n■出典：グロービス マネジメントブック 改訂3版\n2.経営理念と戦術レベル P.4-5\nおはようございます。25期TNAG-Aの梶野祐希子(ゆきりん)です。\n今日から経営戦略パートが始まりますよ〜\n経営戦略はSTRと略していますね^^","source":"Word: GMAP道場2026春 (1)(1).docx","no":528,"idx":528},{"id":"docx-2026春-経営戦略-aaa5500c","season":"2026春","subject":"経営戦略","scope":"1.経営戦略の意義と企業の目的","question":"2026年3月31日（火）＜経営戦略＞\n出題範囲：1.経営戦略の意義と企業の目的\n■問1.「経営者の第一の使命は〇〇価値の最大化である。」\n〇〇に入る言葉を以下の選択肢から選んで答えなさい。\nA.顧客\nB.株主\nC.自社\nD.市場","answer":"■正解：B.株主\n■解説：\n戦略策定では方向性を示さなくてはならないが、その前にまず企業の目的を知っておく必要がある。そもそも企業は何のために日々の活動を行っているのだろうか。経営者の第一の使命は株主価値の最大化である。欧米では「企業は株主のもの」という考え方が一般的だ。日本でもグローバル化や市場の要請を受けて、IR （インベスターズ・リレーションズ：投資家向け広報活動）の強化や利益重視の経営指標の導入など、企業経営の透明性を高め、株主重視の姿勢を打ち出そうとする企業が増えている。\n■出典：グロービス マネジメントブック 改訂3版\n1.経営戦略の意義と企業の目的 P.2-3","source":"Word: GMAP道場2026春 (1)(1).docx","no":529,"idx":529},{"id":"docx-2026春-マーケティング-d56038f0","season":"2026春","subject":"マーケティング","scope":"6.セグメンテーションとターゲティング","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：6.セグメンテーションとターゲティング\n■問6.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n・不特定多数の顧客を、同じ性質やニーズを持つ小集団に切り分け、整理する事を(①)という。\n・(①)の切り分ける際の軸(変数)として、地理的変数・人口動態変数に加え、昨今では(②)も重要視されている。\n・切り分けた顧客層のうち、どの層にアプローチするかを決めることを(③)という。\nA. ①セグメンテーション　②ターゲティング　　　　③心理的変数・行動変数\nB. ①セグメンテーション　②心理的変数・行動変数　③ターゲティング\nC. ①ターゲティング　　　②セグメンテーション　　③心理的変数・行動変数\nD. ①ターゲティング　　　②心理的変数・行動変数　③セグメンテーション","answer":"■正解：B\n■解説：\n・市場を軸（変数）で切り分ける際には、以前は容易な地理的変数、人口動態変数がよく用いれらていたが、最近は消費者ニーズの多様化や個性化にあわせ、心理的変数、行動変数が重視されるようになった。\n■出典：グロービス マネジメントブック 改訂3版 　\n6 .セグメンテーションとターゲティング p.58-59\nおはようございます。2025期ETKY-Dの長井真一郎（ボス）です。\nGMAP道場がスタートしました。\n私はGMAP苦手ですが合格のために一緒に頑張りましょう。","source":"Word: GMAP道場2026春 (1)(1).docx","no":530,"idx":530},{"id":"docx-2026春-マーケティング-03fc4367","season":"2026春","subject":"マーケティング","scope":"5.マーケティング・リサーチ","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：5.マーケティング・リサーチ\n \n■問5.マーケティング・リサーチについて適切なものを選択してください。\n \nA.リサーチに使われるデータには、新聞などで一般に公表されているデータのように他の目的のために収集された「1次データ」と、特定の目的のために収集する「2次データ」がある。\n \nB. リサーチに使われるデータの収集方法には、ヒアリングやフォーカスグループへのインタビューなどで言葉や会話から内容をとらえる「定量リサーチ」、アンケートなどを用いて調査結果を統計的に数値でとらえる「定性リサーチ」がある。\n \nC.リサーチでは、現状から考えられる仮説と予測される結果を必ず事前に考え、調査結果との違いを評価する、データ駆動型のアプロ―チが望ましい。\n \nD.製品やサービスを統合的に評価する時には、コンジョイント分析を用いる。これは顧客が複数の商品の中から１つを選ぶ場合、価格や色、デザイン、品質などの各項目が、どの程度その選考に影響を与えているかを知るための分析手法の１つである。","answer":"■正解：D\n  \n■解説：\nA:「1次データ」と「2次データ」が逆です。\nB:「定性リサーチ」と「定量リサーチ」が逆です。\nC:「データ駆動型」でなく「仮説検証型」のアプローチが正解です。\n最初は仮説検証が大切です。とりあえず手の入るデータを集めて導くのは、誤った結論を得る可能性が高いです。\n■出典：グロービス マネジメントブック 改訂3版\n5.マーケティング・リサーチP.56-57\nおはようございます。2025期TNAG-Aの八木なつみ（🐐）です。","source":"Word: GMAP道場2026春 (1)(1).docx","no":531,"idx":531},{"id":"docx-2026春-マーケティング-4e77c211","season":"2026春","subject":"マーケティング","scope":"4.市場の機会の発見","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：4.市場の機会の発見\n　\n■問4.機会と脅威の捉え方に関する説明として、正しいものを全て選びなさい。\n　\nA. 市場の機会と脅威は通常、外部分析から導かれるが、他社の機会が必ずしも自社にとっても好機であるとは限らない。\n　\nB. 規制緩和は、競争激化という脅威にも、新たな参入機会にもなりうる。\n　\nC. 企業は、発見した事実をすぐ脅威と決めつけず、機会にできないかを考える姿勢が大切である。\n　\nD. 機会と脅威を見つける際には、環境変化を本質まで掘り下げて分析することがポイントだ。単に売上高だけを見て判断するのは早計である。","answer":"■正解：全て正解\n　\n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n4.市場の機会の発見 P.54-55\nおはようございます！2025期TTKY-Gの中村要（かなめ）です。\n年度末ということもあり、勉強もプライベートも忙しくされている方が多いでしょう。","source":"Word: GMAP道場2026春 (1)(1).docx","no":532,"idx":532},{"id":"docx-2026春-マーケティング-39b53d92","season":"2026春","subject":"マーケティング","scope":"3.マーケティング・マネジメント","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：3.マーケティング・マネジメント\n \n■問3.マーケティングの観点からビジネスを構築していくためのプロセスは、6つのステップに大別されます。マーケティング戦略立案の流れに沿うように、並べて下さい。\n \nA.マーケティング・ミックス(4P)\nB.マーケティング施策の実行と評価\nC.セグメンテーション(市場細分化)\nD.マーケティング環境分析と市場機会の発見\nE.ポジショニング\nF.ターゲティング(標的市場の選定)","answer":"■正解：D→C→F→E→A→B\n  \n■解説：\nマーケティング戦略立案の流れは、以下の通りです。\n①マーケティング環境分析と市場機会の発見\n②セグメンテーション(市場細分化)\n③ターゲティング(標的市場の選定)\n④ポジショニング\n⑤マーケティング・ミックス(4P)\n⑥マーケティング施策の実行と評価\nただし、このプロセスは必ずしも一方向的な流れではなく、行きつ戻りつすることもあります。\n実際には、制約条件などによりどれか動かせない要素があるため、さかのぼって整合性をとることも多いことを、覚えておきましょう。\n \n \n■出典：グロービス マネジメントブック 改訂3版\n3.マーケティング・マネジメント P.52-53\nおはようございます。2025期EONL-Bの石崎香織（じゃっきー）です。\n新しいことが始まる春、ワクワクしますね。\n皆さまの学びに貢献できるよう、頑張ります！楽しんでまいりましょう♪","source":"Word: GMAP道場2026春 (1)(1).docx","no":533,"idx":533},{"id":"docx-2026春-マーケティング-95e2de4a","season":"2026春","subject":"マーケティング","scope":"2. マーケティングの役割","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：2. マーケティングの役割\n■問2.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n・企業は経営理念という枠組みの中で、（①）と自社の経営資源から戦略を特定していくが、（①）の中で最も重要な要素の1つは市場環境である。\n・市場環境の変化を踏まえて企業の進むべき方向性を見出し、経営戦略や事業活動に落とし込んでいく役割を果たすのが（②）である。\n・企業は生産、営業、開発、財務、人事などのさまざまな機能の集合体だ。（③）がすべての企業活動の原点であるという考え方に立てば、（③）を中心に据えて、（③）の期待に応えるべく各機能がそれぞれの役割を最大限に果たさなくてはならない。\n・（②）は、（③）の期待を明確化し、（③）ニーズの充足を保証するために、企業内のさまざまな機能を統合する役割を担っている。\nA. ①内部環境　②全社戦略　③社会\nB. ①外部環境　②マーケティング　③顧客\nC. ①外部環境　②事業戦略　③社員\nD. ①関連会社　②マーケティング　③顧客","answer":"■正解：B\n■解説：\n・企業は経営理念という枠組みの中で、外部環境と自社の経営資源から戦略を特定していくが、外部環境の中で最も重要な要素の1つは市場環境である。\n・市場環境の変化を踏まえて企業の進むべき方向性を見出し、経営戦略や事業活動に落とし込んでいく役割を果たすのがマーケティングである。\n・企業は生産、営業、開発、財務、人事などのさまざまな機能の集合体だ。\n顧客がすべての企業活動の原点であるという考え方に立てば、顧客を中心に据えて、顧客の期待に応えるべく各機能がそれぞれの役割を最大限に果たさなくてはならない。\n・マーケティングは、顧客の期待を明確化し、顧客ニーズの充足を保証するために、企業内のさまざまな機能を統合する役割を担っている。\n　　\n■出典：グロービス マネジメントブック 改訂3版\n2．マーケティングの役割 P.50-51\nおはようございます。　2025期EONL-Eの石黒　太一（ぐろりん）です。\nいよいよGMAP道場がスタートしましたね。\nGMAP幹事団全員があなたの合格を全力で応援しています。\n一緒にがんばりましょう。","source":"Word: GMAP道場2026春 (1)(1).docx","no":534,"idx":534},{"id":"docx-2026春-マーケティング-cc24bc3f","season":"2026春","subject":"マーケティング","scope":"1.マーケティングの発想","question":"2026年3月30日（月）＜マーケティング＞\n出題範囲：1.マーケティングの発想\n■問1.マーケティング思考について誤っているものを選択してください。\n　\nA.マーケティングの活動範囲は営業活動や広告、市場調査などに限定されているわけではない。\nB.マーケティングとは「顧客に買ってもらえる仕組みをつくること」と定義される。\nC.マーケティングの目的は今日の売上を確保することにあるので、短期志向に陥りやすい。\nD.継続的な成長のためには、既存の顧客に繰り返し買ってもらうことが重要だ。","answer":"■正解：Ｃ\n　\n■解説：\n「セリング」の説明のため誤り。\n　\nセリングは「売り込む手段」を考える活動。セリングの目的は今日の売上げを確保することにあるので、短期志向に陥りやすい。マーケティングは顧客満足を軸に「買ってもらえる仕組み」を考える活動。マーケティングの目的は継続的な成長である。\n　\n■出典：グロービス マネジメントブック 改訂3版\n1.マーケティングの発想 P.48-49","source":"Word: GMAP道場2026春 (1)(1).docx","no":535,"idx":535}]</script>

<script>
(function(){
'use strict';

var DATA=[], filtered=[], current=0, showAnswer=false, records={};
var storeOK=false, listOpen=false;
var KEY='gmap_pc_records_v2_improved';
var touchStartX=0, touchStartY=0, touchStartTime=0, lastTap=0;

function $(id){return document.getElementById(id);}
function text(v){return v==null?'':String(v);}
function esc(s){return text(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeJSON(s,fb){try{return JSON.parse(s);}catch(e){return fb;}}
function setText(id,v){var e=$(id); if(e)e.textContent=text(v);}
function showErr(m){var e=$('error'); if(e){e.style.display='block';e.textContent=text(m);}}
function toast(m){var e=$('toast'); if(!e)return; e.textContent=m; e.classList.add('show'); setTimeout(function(){e.classList.remove('show');},900);}
window.onerror=function(msg,src,line){showErr('エラー: '+msg+(line?' / line '+line:'')); return false;};

function canStore(){try{localStorage.setItem(KEY+'_test','1');localStorage.removeItem(KEY+'_test');storeOK=true;}catch(e){storeOK=false;}}
function loadAll(){
  var n=$('quiz-json');
  DATA=safeJSON(n?n.textContent:'[]',[]);
  if(!DATA.length)showErr('問題データを読み込めませんでした。');
  canStore();
  if(storeOK)records=safeJSON(localStorage.getItem(KEY)||'{}',{})||{};
}
function saveRecords(){if(storeOK)try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){}}
function rec(id){
  if(!records[id])records[id]={status:'unanswered',review:false,attempts:0,corrects:0};
  if(records[id].attempts==null)records[id].attempts=0;
  if(records[id].corrects==null)records[id].corrects=0;
  if(records[id].status==null)records[id].status='unanswered';
  if(records[id].review==null)records[id].review=false;
  return records[id];
}
function curIndex(){return filtered.length?filtered[Math.max(0,Math.min(current,filtered.length-1))]:-1;}
function cur(){var i=curIndex(); return i>=0?DATA[i]:null;}

function cleanHeading(s){
  return text(s).trim()
    .replace(/^■\s*正解\s*[:：]?\s*/,'')
    .replace(/^▪️\s*正解\s*[:：]?\s*/,'')
    .replace(/^▪\s*正解\s*[:：]?\s*/,'')
    .replace(/^正解\s*[:：]?\s*/,'')
    .replace(/^■\s*解説\s*[:：]?\s*/,'')
    .replace(/^▪️\s*解説\s*[:：]?\s*/,'')
    .replace(/^▪\s*解説\s*[:：]?\s*/,'')
    .replace(/^解説\s*[:：]?\s*/,'');
}
function normalizeQuestion(q){
  var parts=[];
  var body=text(q.question).replace(/\n{3,}/g,'\n\n').trim();
  parts.push(body);
  if(q.choices&&q.choices.length)parts.push(q.choices.map(function(c){return text(c).trim();}).join('\n'));
  return parts.join('\n\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');
}
function answerText(q){
  var a=cleanHeading(q.answer), ex=cleanHeading(q.explanation), out='';
  if(a)out+='■正解\n'+a;
  if(ex)out+=(out?'\n\n':'')+'■解説\n'+ex;
  return out||'答え・解説データがありません。';
}
function statusLabel(r){
  var s=r.status||'unanswered';
  var base=s==='correct'?'正解':s==='wrong'?'不正解':'未回答';
  return r.review?base+'・復習':base;
}
function unique(key){
  var m={}, arr=[];
  DATA.forEach(function(q){var v=text(q[key]||''); if(v&&!m[v]){m[v]=1;arr.push(v);}});
  return arr;
}
function fillSelect(id, values){
  var e=$(id); if(!e)return;
  var old=e.value;
  e.innerHTML='<option value="">すべて</option>'+values.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  if(old)e.value=old;
}

function isLowRateRecord(r){
  return !!(r && r.attempts && ((r.corrects||0)/r.attempts)<0.7);
}
function downloadText(filename, content){
  try{
    var blob=new Blob([content],{type:'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url); if(a&&a.parentNode)a.parentNode.removeChild(a);},200);
    toast('学習記録を保存しました');
  }catch(e){
    showErr('記録保存に失敗しました: '+e.message);
  }
}
function exportRecords(){
  var payload={
    exportedAt:new Date().toISOString(),
    records:records,
    summary:{}
  };
  DATA.forEach(function(q,i){
    var subj=(q&&q.subject)||'科目未設定';
    var r=rec((q&&q.id)||i);
    if(!payload.summary[subj])payload.summary[subj]={total:0,answered:0,correct:0};
    payload.summary[subj].total++;
    if(r.status&&r.status!=='unanswered')payload.summary[subj].answered++;
    if(r.status==='correct')payload.summary[subj].correct++;
  });
  downloadText('GMAP問題集_学習記録.json',JSON.stringify(payload,null,2));
}
function updateScopeOptions(){
  var subj=$('subjectFilter')?$('subjectFilter').value:'';
  var scopeEl=$('scopeFilter');
  if(!scopeEl)return;
  var old=scopeEl.value;
  var m={}, arr=[];
  DATA.forEach(function(q){
    if(subj && q.subject!==subj)return;
    var v=text(q.scope||'');
    if(v&&!m[v]){m[v]=1;arr.push(v);}
  });
  scopeEl.innerHTML='<option value="">すべて</option>'+arr.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  scopeEl.value = arr.indexOf(old)>=0 ? old : '';
}

function applyFilters(){
  var subj=$('subjectFilter')?$('subjectFilter').value:'';
  var scope=$('scopeFilter')?$('scopeFilter').value:'';
  var st=$('statusFilter')?$('statusFilter').value:'all';
  var kw=($('search')?$('search').value:'').toLowerCase();
  filtered=[];
  DATA.forEach(function(q,i){
    var r=rec(q.id||i);
    if(subj&&q.subject!==subj)return;
    if(scope&&q.scope!==scope)return;
    if(st==='unanswered'&&r.status&&r.status!=='unanswered')return;
    if(st==='correct'&&r.status!=='correct')return;
    if(st==='wrong'&&r.status!=='wrong')return;
    if(st==='review'&&!r.review)return;
    if(st==='lowrate'){
      if(!r.attempts)return;
      if(!isLowRateRecord(r))return;
    }
    if(kw){
      var hay=[q.subject,q.scope,q.question,(q.choices||[]).join(' '),q.answer,q.explanation].join(' ').toLowerCase();
      if(hay.indexOf(kw)<0)return;
    }
    filtered.push(i);
  });
  current=0;
  showAnswer=false;
  render();
}
var SUBJECT_ORDER=['マーケティング','経営戦略','人的資源管理','組織行動学','アカウンティング','ファイナンス'];
  function subjectRank(name){
    for(var i=0;i<SUBJECT_ORDER.length;i++){
      if(String(name).indexOf(SUBJECT_ORDER[i])>=0)return i;
    }
    return 999;
  }
function renderStats(){
  var bySubject={};
  DATA.forEach(function(q,idx){
    var r=rec((q&&q.id)||idx);
    var subj=(q&&q.subject)||'科目未設定';
    if(!bySubject[subj])bySubject[subj]={total:0,correct:0,answered:0};
    bySubject[subj].total++;
    if(r.status&&r.status!=='unanswered')bySubject[subj].answered++;
    if(r.status==='correct')bySubject[subj].correct++;
  });
  var q=cur();
  var currentSubject=q?(q.subject||'科目未設定'):'';
  var html='';
  Object.keys(bySubject).sort(function(a,b){var ra=subjectRank(a), rb=subjectRank(b); if(ra!==rb)return ra-rb; return String(a).localeCompare(String(b),'ja');}).forEach(function(subj){
    var s=bySubject[subj];
    var correctRate=s.total?Math.round(s.correct/s.total*100):0;
    var progressRate=s.total?Math.round(s.answered/s.total*100):0;
    var cls='subject-card'+(subj===currentSubject?' current':'');
    html+='<div class="'+cls+'" data-subject="'+esc(subj)+'" role="button" tabindex="0">'
      +'<div class="subject-name">'+esc(subj)+'</div>'
      +'<div class="subject-metrics"><span>正答率 <b>'+correctRate+'%</b></span><span>'+s.correct+'/'+s.total+'</span></div>'
      +'<div class="bar"><i style="width:'+correctRate+'%"></i></div>'
      +'<div class="subject-metrics"><span>進捗 <b>'+progressRate+'%</b></span><span>'+s.answered+'/'+s.total+'</span></div>'
      +'<div class="bar progress"><i style="width:'+progressRate+'%"></i></div>'
      +'</div>';
  });
  var box=$('subjectRates');
  if(box)box.innerHTML=html;
}
function render(){
  var total=filtered.length;
  if(current<0)current=0;
  if(current>=total)current=Math.max(0,total-1);
  setText('pos',total?((current+1)+' / '+total):'0 / 0');
  renderStats();
  var q=cur();
  if(!q){
    setText('qText','絞り込み条件に該当する問題がありません。');
    var a=$('aText'); if(a)a.innerHTML='<div class="placeholder">条件を変更してください。</div>';
    var qm0=$('questionMetric'); if(qm0)qm0.textContent='回答 0回｜正答率 -';
    return;
  }
  var r=rec(q.id||curIndex());
  setText('statusLabel',statusLabel(r));
  var qr=r.attempts?Math.round((r.corrects||0)/r.attempts*100)+'%':'-';
  var meta=$('meta');
  if(meta)meta.innerHTML='<span>'+esc(q.subject||'科目未設定')+'</span><span>'+esc(q.scope||'出題範囲未設定')+'</span>';
  var low=isLowRateRecord(r); var qm=$('questionMetric'); if(qm){qm.innerHTML='この問題　回答 '+(r.attempts||0)+'回｜正答率 '+qr+(low?' <span class="lowrate-mark">低正答率</span>':'');}
  setText('qText',normalizeQuestion(q));
  var answerPanel=$('answerPanel');
  if(showAnswer){
    if(answerPanel)answerPanel.classList.remove('hidden');
    setText('answerLabel','表示中');
    setText('aText',answerText(q));
  }else{
    if(answerPanel)answerPanel.classList.add('hidden');
    setText('answerLabel','非表示');
    var at=$('aText'); if(at)at.innerHTML='<div class="placeholder">中央タップ、またはSpaceキーで答え・解説を表示します。</div>';
  }
  var bc=$('btnCorrect'), bw=$('btnWrong'), br=$('btnReview');
  if(bc)bc.classList.toggle('status-on',r.status==='correct');
  if(bw)bw.classList.toggle('status-on',r.status==='wrong');
  if(br)br.classList.toggle('status-on',!!r.review);
  renderList();
  setTimeout(fitAllText,0);
}
function fitOne(textEl, boxEl, baseSize, baseLine, minSize, minLine){
  if(!textEl||!boxEl)return;
  textEl.style.fontSize=baseSize+'px';
  textEl.style.lineHeight=baseLine;
  var available=boxEl.clientHeight-2;
  var size=baseSize, guard=0;
  while(available>0 && textEl.scrollHeight>available && size>minSize && guard<42){
    size-=1;
    textEl.style.fontSize=size+'px';
    if(size<=13)textEl.style.lineHeight=minLine;
    guard++;
  }
}
function fitAllText(){
  fitOne($('qText'),$('qBox'),18,1.24,10,1.05);
  if(showAnswer)fitOne($('aText'),$('aBox'),16,1.34,9,1.03);
}
function toggleAnswer(){showAnswer=!showAnswer; render();}
function move(d){
  if(!filtered.length)return;
  current=(current+d+filtered.length)%filtered.length;
