00－500＝470\n■出典：グロービス マネジメントブック 改訂3版\n16.フリー・キャッシュフロー P.166-167","source":"Word: GMAP道場2026春 (1)(1).docx","no":362,"idx":362},{"id":"docx-2026春-ファイナンス-4307ad85","season":"2026春","subject":"ファイナンス","scope":"8.分散投資の効果(3)：CAPM(資本資産価格モデル)","question":"2026年5月2日（土）＜ファイナンス＞\n出題範囲：8.分散投資の効果(3)：CAPM(資本資産価格モデル)\n■問28.国債の利回りが2.5%、マーケットポートフォリオの期待利回りが6%であるとすると、β=1.5の資産（株式）の期待利回りRは何%になるでしょうか？\nA：9.75％\nB：7.75％\nC：12.75％\nD：6.25％","answer":"■正解：B\n■解説：個別資産のもつシステマティック・リスク（マーケット・リスク）をβで測定すると、個別資産のβと期待利回りの関係は、以下のような単純な計算式（CAPMの計算式）で求められます。\n個別資産の期待利回り（R）＝ 無リスク資産の利回り ＋ β × （マーケット・ポートフォリオの期待利回り － 無リスク資産の利回り）\n無リスク資産（国債）の利回り2.5%、マーケット・ポートフォリオの期待利回り6%、β ＝ 1.5より\nR ＝ 2.5 ＋ 1.5 × （6-2.5）\nR ＝ 7.75\n■出典：グロービス マネジメントブック 改訂3版\n8.分散投資の効果(3)：CAPM(資本資産価格モデル) P.150-151","source":"Word: GMAP道場2026春 (1)(1).docx","no":363,"idx":363},{"id":"docx-2026春-ファイナンス-788e6df1","season":"2026春","subject":"ファイナンス","scope":"10.資本コスト：計算問題（WACC）","question":"2026年5月2日（土）＜ファイナンス＞\n出題範囲：10.資本コスト：計算問題（WACC）\n　\n■問27.以下の条件に基づき、税引後の加重平均資本コスト(WACC：Weighted Average Cost of Capital)として最も適切なものを、選択肢AからDの中から選んでください。\n　\n【条件】\n・株主資本コスト：12.0%\n・負債コスト（税引前）：5.0%\n・法人税率：30%\n・有利子負債：60,000百万円\n・無利子負債：10,000百万円\n・株式の時価総額：30,000百万円\n \n【選択肢】\nA：6.33％\nB：5.70%\nC：7.33%\nD：6.10%","answer":"■正解：A：6.33%\n　\n■解説：\nWACCは、負債D /（負債D + 株式の時価総額E）× 負債コストrD×（1 - 税率）+ 株式の時価総額E / (負債D + 株式の時価総額E) × 株主資本コストrE　の式で求められます。\nよって、計算は、60,000 / (60,000 + 30,000) × 5.0％ ×（1-30％）+ 30,000 / (60,000 + 30,000) × 12.0％ ＝ 6.33%\n　\n解き方のポイントは以下の通りです。\nWACCを解く際は、以下の3ステップを意識すると間違いが減ります。\n　\n1.資本構成を特定する\n分母となるのは「負債D」と「株式の時価総額E」の合計です。なお、負債は有利子負債であり、買掛金などの無利子負債はコスト（利息）が発生しないため通常含まれません。\n・分母 = 60,000 + 30,000 = 90,000\n　\n 2.負債の税引後コストを出す\n支払利息が税額控除となるため、税引後の実質負債コストは、負債コスト「rD×（1-税率）」と低くなります。\n・税引後負債コスト = 5.0% × (1 - 30%) = 3.5%\n　\n 3.加重平均する\n・負債の寄与：3.5% × (60,000 / 90,000) = 2.33%\n・株主資本の寄与：12.0% × (30,000 / 90,000) = 4.0%\n・WACC = 2.33% + 4.0%= 6.33%\n　\nなお、他の選択肢の解説もご参考まで。\nB：5.70%（無利子負債を分母に入れた間違い）分母を「有利子負債＋無利子負債＋株主資本＝100,000」で計算してしまった場合。\nC：7.33%（節税効果を忘れた間違い）負債コストを税引前（5.0%）のまま計算してしまった場合。\nD：6.10%（無利子負債をコスト0%として算入した間違い）分母を100,000とし、分子に「無利子負債10,000 × 0%」を加えて計算してしまった場合。\n■出典：グロービス マネジメントブック 改訂3版\n10．資本コスト P.154-155","source":"Word: GMAP道場2026春 (1)(1).docx","no":364,"idx":364},{"id":"docx-2026春-ファイナンス-0926d3c6","season":"2026春","subject":"ファイナンス","scope":"4. DCF法","question":"2026年5月02日（土）＜ファイナンス＞\n出題範囲：4. DCF法\n■問.25\n割引率を10％とし、以下のオプションAとオプションBのどちらにするべきか選択してください。今日は2020年1月1日とし、その後のお金の受け取りは毎年1月1日になされると仮定してください。\nオプションA：\n今日500万円受け取る\nオプションB：\n2021年から3年間200万円ずつ受け取る","answer":"■正解：A\n■解説：\nDCF法とはキャッシュフローの現在価値を算出する方法。\nある資産が、1年後、2年後…n年後に、C1、C2…Ｃnのキャッシュを生み出すと想定する。このときのリスク（割引率）を「r」として資産の現在価値（PV）を求める。\nPV=C1/(1+r)＋C2/(1+r)2乗＋C3/(1+r)3乗＋…Cn/(1+r)n乗\n●オプションＡの場合：\nすでに現在価値であり\nPV=500万円\n●オプションＢの場合：\n1年後　2021/1/1：200万円\n2年後　2022/1/1：200万円\n3年後　2023/1/1：200万円\nPV\n=200/(1+10%)+200/(1+10%)2乗+200/(1+10%)3乗\n=200/1.1+200/1.21+200/1.3331\n=181.8+165.3+150.3\n=497.4万円\n■出典：グロービス マネジメントブック 改訂3版\nDCF法　P142-143","source":"Word: GMAP道場2026春 (1)(1).docx","no":365,"idx":365},{"id":"docx-2026春-ファイナンス-aa99bd19","season":"2026春","subject":"ファイナンス","scope":"22.投資ファンド","question":"2026年5月2日（土）＜ファイナンス＞\n出題範囲：22.投資ファンド\n■問26.次の文章の（）に当てはまる単語の組み合わせとして、正しいものを選びなさい。\n投資ファンドは、広く資金を集めて企業(あるいはプロジェクトなど)へ投資し、企業再生や育成、分割などを行って（A）を向上させたうえで、売却益による利益獲得を狙う。\n（A）を向上させる方法論や投資先のタイプ、投資回収の方法などによって、再生ファンド、（B）、ベンチャー・キャピタル、不動産ファンドなどがある。\n投資ファンドは、バイアウトファンドあるいは（C）と呼ばれることもある。（C）と呼ばれる場合は、未公開企業を対象に投資を行う場合が多い。\n（B）は、主に資産や事業の切り売りをすることで資金回収を図る。\nA：企業価値　B：ハゲタカファンド　C：プライベート・エクイティ・ファンド\nA：株価　B：政府系ファンド　C：再生ファンド\nA：株価　B：ハゲタカファンド　C：プライベート・エクイティ・ファンド\nA：企業価値　B：政府系ファンド　C：再生ファンド","answer":"■正解：1\n■解説：\n投資ファンドは、広く資金を集めて企業へ投資し、企業再生や育成、分割などを行って企業価値を向上させたうえで、売却益による利益獲得を狙う。\n企業価値を向上させる方法論や投資先のタイプ、投資回収の方法などによって、再生ファンド、ハゲタカファンド、ベンチャーキャピタル、不動産ファンドなどがある。\n投資ファンドは、バイアウトファンドあるいはプライベート・エクイティ・ファンドと呼ばれることもある。プライベート・エクイティ・ファンドと呼ばれる場合は、未公開企業を対象に投資を行う場合が多い。\nハゲタカファンドは、主に資産や事業の切り売りをすることで資金回収を図る。\n＜選択肢内の単語解説＞\n再生ファンドは、経営状況が悪化した企業の株式を買収し、資金や経営陣を投入することで会社の再建を図り、株式公開や事業売却の形で資金回収を図るファンド。\n政府系ファンドは、国家が深く関わっている、投資ファンドの一種。通常の投資ファンドよりは長期的、安定的なリターンを求めている。\n■出典：グロービス マネジメントブック 改訂3版\n22.投資ファンド P.178-179","source":"Word: GMAP道場2026春 (1)(1).docx","no":366,"idx":366},{"id":"docx-2026春-アカウンティング-5cf20498","season":"2026春","subject":"アカウンティング","scope":"19. 原価計算","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：19. 原価計算\n■問30.問題：ある会社の年間間接費は次の通りです。\n調査活動費　：1,000,000円\n研究活動費　：2,000,000円\n生産活動費　：3,000,000円\n合計：6,000,000円\n製品Aの売上高構成比は40%。また、会社全体に占める製品Aの活動消費割合はそれぞれ、調査30％、研究50％、生産10％、である。\n次の組合せのうち、\n（①）従来配賦（売上高基準）による製品Aの配賦額\n（②）ABC（活動基準原価計算）による製品Aの配賦額\nをそれぞれ算出してください","answer":"■正解：\n① 2,400,000円　② 1,600,000円\n■解説：\n従来配賦：6,000,000×40%＝2,400,000円\nABC配賦：\n1,000,000×0.30＝300,000\n2,000,000×0.50＝1,000,000\n3,000,000×0.10＝300,000\n合計＝1,600,000円\n■出典：グロービス マネジメントブック 改訂3版\n19．原価計算： P.128-129","source":"Word: GMAP道場2026春 (1)(1).docx","no":367,"idx":367},{"id":"docx-2026春-アカウンティング-4e51c5d9","season":"2026春","subject":"アカウンティング","scope":"18. 損益分岐点分析","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：18. 損益分岐点分析\n　\n■問29.製品Xの販売単価は1個あたり2,000円、変動費は1個あたり1,200円です。固定費が400万円である時、次のA～Cの問いに答えよ。（計算式の答えは小数点第二位を四捨五入してください）\nA.　製品Xの1個あたりの限界利益を求めよ\nB.　製品Xの限界利益率を求めよ\nC.　製品Xの損益分岐点売上高を求めよ","answer":"■正解：\nA.　800円/個\nB.　0.4(40%)\nC.　1000万円\n■解説：\nA：製品Xの1個あたりの限界利益は、1個あたりの売価(2,000円)－1個あたりの変動費(1,200円)＝800円/個。\nB：限界利益率は、1個あたりの限界利益(800円)÷1個あたりの売価(2,000円)＝0.4となる。\nC：損益分岐点売上高は、固定費(400万円)÷限界利益率(0.4)＝1000万円となる。\n■出典：グロービス マネジメントブック 改訂3版\n損益分岐点分析P.126-127","source":"Word: GMAP道場2026春 (1)(1).docx","no":368,"idx":368},{"id":"docx-2026春-アカウンティング-f61a8311","season":"2026春","subject":"アカウンティング","scope":"17.減価償却と固定資産","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：17.減価償却と固定資産\n■問28.減価償却と固定資産の説明として正しいものを全て答えよ。\nA.減価償却とは、時が経つにつれ使用価値（収益力）が減少していく機械や建物、土地等の有形固定資産に対し、使用期間（耐用年数）にわたって費用処理を行うことである。その価値の減少分が減価償却費であり、徐々に取得原価から差し引いていく。最終的には所定の残存価値が残るように償却していく。\nB.定額法とは、固定資産の耐用期間中、毎期均等額の減価償却費を計上する方法である。その長所は、計算が容易であり、毎期の減価償却費が均等額で毎年の費用の見積もりが容易であることである。短所は、設備など後年度ほど収益力が衰えるものは修繕費も増加するため、後年度の費用負担が過大となることである。\nC.定率法は、固定資産の耐用期間中、毎期首償却残高に一定率を乗じた減価償却費を計上する方法である。長所は機械等の能率が高いとき、すなわち収益の多いときに償却費が多く計上されるため、後年度になって修繕費が多くなるときに償却費が低減し、費用配分が合理的になることである。短所は、設備投資が多いときに当初の償却費負担が過大となり、費用の配分が毎期均等化しないことである。\nD.無形固定資産は償却しなくてよい。","answer":"■正解：B、C\n■解説：\nA：誤り。減価償却とは、時が経つにつれ使用価値が減少していく機械や建物等の有形固定資産に対し、使用期間（耐用年数）にわたって費用処理を行うことである。ただし、有形固定資産であってもその使用価値が減少しないと考えられる土地等は、償却の対象とはならない。\nB：正しい。記載の通り。\nC：正しい。記載の通り。\nD：誤り。無形固定資産も償却しなければならない。特許権、商標権などの法律上の権利である資産は、有形固定資産の減価償却と同様の償却を行う。ただし、一般には定額法により、残存価額ゼロで償却される。耐用年数も法定有効期間内が望ましいとされている。\n■出典：グロービス マネジメントブック 改訂3版\n17.減価償却と固定資産 P.124-125","source":"Word: GMAP道場2026春 (1)(1).docx","no":369,"idx":369},{"id":"docx-2026春-アカウンティング-04a6ec67","season":"2026春","subject":"アカウンティング","scope":"16. たな卸資産","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：16. たな卸資産\n■問27.たな卸資産について、誤っているものを全て選択してください。\nA.たな卸資産は、先入先出法、後入先出法、平均法などがあり、どの方法を用いるかによって売上原価や期末残高が変わる。\nB.先入先出法（FIFO）は、たな卸資産に加わった古い順から販売（払い出し）していくと仮定した方法で、結果的に在庫として残るのは新しく取得・製造した製品となる。物価が上昇し製造コストも販売単価も上昇している時期には、FIFOでは、利益が小さく計上されることが多い。\nC.後入先出法（LIFO）は、FIFOとは逆に最新の仕入在庫から順に販売していくと仮定した方法で、売上総利益は常に最新の状況を示すこととなり、会計上の利益は大きくなることが多い。\nD.平均法は、個別の仕入（製造）原価に注目せず、1期間の期首在庫を含めた総仕入金額と総仕入数量からその期の平均単価（簿価）を算出し、その期中に販売されたすべての製品についてその価格（簿価）を原価とする総平均法と、仕入れのたびに平均単価を算出し直し、払出原価を計算する移動平均法がある。","answer":"■正解：B、Cが誤り\n■解説：\nB：物価が上昇し製造コストも販売単価も上昇している時期には、FIFOでは「現在の販売価格（高い）-昔の原価（安い）=営業利益（大きい）」となるため、結果として利益が大きく計上されることが多い。\nC：FIFOとは逆に最新の仕入在庫から順に販売していくと仮定した方法で、売上総利益（販売価格ー原価）は常に最新の状況を示すこととなり、会計上の利益は小さくなることが多い。\n■出典：グロービス マネジメントブック 改訂3版\nたな卸資産  P.122-123","source":"Word: GMAP道場2026春 (1)(1).docx","no":370,"idx":370},{"id":"docx-2026春-アカウンティング-ffb739c4","season":"2026春","subject":"アカウンティング","scope":"26. 総合力分析：ROAとROE","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：26. 総合力分析：ROAとROE\n■問26.この会社のROEを求め、正しい選択肢を選びなさい。（ROEは少数第一位を四捨五入して計算してください）\n売上高：10,000\n売上原価：7,000\n広告宣伝費：2,000\n支払利息：300\n総資産：3,000\n自己資本比率：40％\nA．58.3％\nB．87.5％\nC．83.3％\nD．50.0％","answer":"■正解：A\n■解説：\n①まずは売上総利益をもとめましょう。\n売上（10,000）―売上原価（7,000）＝3,000\n※売上原価は小売業では販売された仕入原価であり、製造業では仕入れた原材料や部品などの代金だけでなく、製造ラインの人件費、機械の減価償却費、電気代などの製造経費も含まれます。\n②売上総利益を算出したら、営業利益をもとめましょう。\n売上総利益（3,000）－販売費及び一般管理費（ここでは広告宣伝費）（2,000）＝1,000\n③営業利益を算出したら、支払利息を差し引いて当期純利益をもとめましょう。\n営業利益（1,000）－支払利息（300）＝700\n※本来は経常利益を算出した後、特別利益、特別損失を差し引き、税金等調整前当期純利益を算出、法人税、住民税などの税金を差し引いて当期純利益を算出しますが、今回はないので経常利益＝当期純利益となります。\n④自己資本をもとめましょう。\n総資産（3,000）×自己資本比率（40％）＝1,200\n※自己資本比率を求める公式は・・・自己資本比率＝自己資本÷（負債＋総資産）\n⑤ROE（自己資本利益率）をもとめましょう。\n当期純利益（700）÷自己資本（1,200）＝58.3％\n■出典：グロービス マネジメントブック 改訂3版\n総合力分析：ROAとROE　Ｐ114～115","source":"Word: GMAP道場2026春 (1)(1).docx","no":371,"idx":371},{"id":"docx-2026春-アカウンティング-0b266b5c","season":"2026春","subject":"アカウンティング","scope":"8. キャッシュフロー計算書","question":"2026年5月1日（金）＜アカウンティング＞\n出題範囲：     8. キャッシュフロー計算書\n■問25. 貸借対照表との関係で現金の動きを考えると、おおむね資産の増加は現金の（➀）を、負債・純資産の増加は現金の（➁）を意味する。現金を必要以上に多く持っていることは企業活動に活用すべき資金を遊ばせているわけで、この場合、将来の収益に貢献するような投資や借入金の返済、配当の（③）などを検討すべきである。\n上記➀～③を埋める言葉として正しい組み合わせを選んでください。\nA. ➀増加　➁減少　③増額\nB. ➀減少　➁増加　③減額\nC. ➀減少　➁増加　③増額\nD. ➀増加　➁減少　③減額","answer":"■正解：C\n■解説：貸借対照表との関係で現金の動きを考えると、おおむね資産の増加は現金の（減少）を、負債・純資産の増加は現金の（増加）を意味する。現金を必要以上に多く持っていることは企業活動に活用すべき資金を遊ばせているわけで、この場合、将来の収益に貢献するような投資や借入金の返済、配当の（増額）などを検討すべきである。\n■出典：グロービス マネジメントブック 改訂3版\nキャッシュフロー計算書 P.106-107","source":"Word: GMAP道場2026春 (1)(1).docx","no":372,"idx":372},{"id":"docx-2026春-組織行動-a1fcd867","season":"2026春","subject":"組織行動","scope":"4. リーダーシップとマネジメント","question":"2026年4月30日（木）＜組織行動学＞\n出題範囲：4. リーダーシップとマネジメント\n \n■問30.下記A～Dの選択肢のうち、マネジメントのステップとして正しいものを選んでください。\nA. ①短期的な計画や予算を立案する　②組織構造の設計、人員の配置、詳細計画のコミュニケーションなどを行う　③予算や実績管理などを行い、問題解決を図る\nB. ①短期的なビジョンを提示する　②ビジョンを伝達することにより、メンバーを統合する　③予算や実績管理などを行い、問題解決を図る\nC. ①長期的な計画や予算を立案する　②組織構造の設計、人員の配置、詳細計画のコミュニケーションなどを行う　③メンバーの動機づけを行う\nD. ①長期的なビジョンを提示する　②ビジョンを伝達することにより、メンバーを統合する　③メンバーの動機づけを行う","answer":"■正解：A\n \n■解説：\nBとCはステップも内容も誤り。Dは「リーダーシップ」に対する記述となる 。グロービスマネジメントブックでは、リーダーシップとマネジメントを異なる機能としてとらえるハーバード・ビジネススクールのJ.コッター教授の理論に従う。コッターは、経営陣やマネジャーに求められる機能を「変革を推し進める機能」と「効率的に組織を運営する機能」の2つに分け、前者をリーダーシップ、後者をマネジメントと定義した。\n \n■出典：グロービス マネジメントブック 改訂3版\n4．リーダーシップとマネジメント P.188-189","source":"Word: GMAP道場2026春 (1)(1).docx","no":373,"idx":373},{"id":"docx-2026春-組織行動-3951617a","season":"2026春","subject":"組織行動","scope":"5.エンパワーメント","question":"2026年4月30日（木）＜組織行動学＞\n出題範囲：5.エンパワーメント\n　\n■問29.下記文章中の（①）から（④）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n　\nエンパワーメントは組織構成員の（①）的な行動を促すために用いられる（②）の技法の1つである。エンパワーメントを（③）に活用するには、構成員の（①）性を促すと同時に、その（④）を制御することも必要だ。\n　\nA.①自律　②リーダーシップ　③有効　　④行動\nB.①積極　②マネジメント　　③最大限　④プラスの感情\nC.①自律　②マネジメント　　③最大限　④問題行動\nD.①積極　②リーダーシップ　③有効　　④マイナスの感情","answer":"■正解：A\n 　\n■解説：\nエンパワーメントは組織構成員の自律的な行動を促すために用いられるリーダーシップの技法の1つである。エンパワーメントを有効に活用するには、構成員の自律性を促すと同時に、その行動を制御することも必要だ。\n■出典：グロービス マネジメントブック 改訂3版\n5.エンパワーメントP.190-191","source":"Word: GMAP道場2026春 (1)(1).docx","no":374,"idx":374},{"id":"docx-2026春-組織行動-5681324d","season":"2026春","subject":"組織行動","scope":"9.チーム・マネジメント","question":"2026年4月30日（木）＜組織行動学＞\n出題範囲：9.チーム・マネジメント\n \n■問28.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・高い成果を上げるチームをつくるには、「構成員の組み合わせ」と「凝集性」が重要だ。\n・多様な能力を持つ構成員で編成されているチームは、より大きな成果を生み出す可能性を持つ。なぜなら、（①）というスキル、（②）のスキル、（③）のスキル、という３つの重要なスキルがチームとして十分に発揮されるからだ。\n \nA. ①技術的な専門知識　②共創　③社内政治\nB. ①技術的な専門知識　②問題解決や意思決定　③対人関係上\nC. ①ビジョン構築　②問題解決や意思決定　③社内政治\nD. ①ビジョン構築　②共創　③対人関係上","answer":"■正解：B\n \n■解説：\n・多様な能力を持つ構成員で編成されているチームは、より大きな成果を生み出す可能性を持つ。なぜなら、技術的な専門知識というスキル、問題解決や意思決定のスキル、対人関係上のスキル、という３つの重要なスキルがチームとして十分に発揮されるからだ。\n \n■出典：グロービス マネジメントブック 改訂3版\n9.チーム・マネジメント　P.198-199","source":"Word: GMAP道場2026春 (1)(1).docx","no":375,"idx":375},{"id":"docx-2026春-組織行動-3f727dd8","season":"2026春","subject":"組織行動","scope":"11. コンフリクト","question":"2026年４月30日（木）＜組織行動学＞\n出題範囲：11. コンフリクト\n \n■問27.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n \n・コンフリクト（対立、軋轢）とは、相反する意見、態度、（①）などが存在し、互いに譲らないことで緊張状態が生じることを言う。\n・コンフリクトのプラス面として、互いに競い合うことで意欲が高まる、相互の意見交換の過程で相手への理解が深まる、その過程において（②）を明確にして当初のアイデアを発展させたり、新たな視点や本質的な問題が発見できることなどが挙げられる。\n・ハーバード大学ビジネススクールのジェームズ・ウェアとルイス・バーンズは、個人間のコンフリクトに対処するには、まず状況をよく理解し、状況そのものを変えるか、当事者の態度や対応を変える必要があるとしている。その具体的な方法として、交渉、制御、（③）を挙げている。\nA. ①要求　②自己の考え　③（建設的）対峙\nB. ①利益　②組織の目標　③（建設的）対峙\nC. ①要求　②他者の意見　③妥協\nD. ①感情　②自己の考え　③競争","answer":"■正解：A\n \n■解説：\n・コンフリクト(対立、軋轢）とは、相反する意見、態度、（①要求）などが存在し、互いに譲らないことで緊張状態が生じることを言う。\n・コンフリクトのプラス面として、互いに競い合うことで意欲が高まる、相互の意見交換の過程で相手への理解が深まる、その過程において（②自己の考え）を明確にして当初のアイデアを発展させたり、新たな視点や本質的な問題が発見できることなどが挙げられる。\n・ハーバード大学ビジネススクールのジェームズ・ウェアとルイス・バーンズは、個人間のコンフリクトに対処するには、まず状況をよく理解し、状況そのものを変えるか、当事者の態度や対応を変える必要があるとしている。その具体的な方法として、交渉、制御、(③（建設的）対峙)を挙げている。\n■出典：グロービス マネジメントブック 改訂3版\n11．コンクリフト P.202-203","source":"Word: GMAP道場2026春 (1)(1).docx","no":376,"idx":376},{"id":"docx-2026春-組織行動-3d23783f","season":"2026春","subject":"組織行動","scope":"19.変革のマネジメント","question":"2026年4月30日（木）＜組織行動学＞\n出題範囲：19.変革のマネジメント\n \n■問26.変革に対する抵抗や対処について、誤りである文章を一つ選択しなさい。\n \nA.変革の実行は通常、大きな困難を伴う。なぜなら、人の行動にも、内からの力を受けない限り同じ状態にとどまろうという「慣性の法則」が働くからだ。\n \nB.変革に対する抵抗を克服するためには、その原因を突き止め、状況に応じた対策を講じる必要がある。\n \nC.変革の必要性に対する認識が不足している場合は、理解を促すためのコミュニケーションを強化したり、変革の計画や実行段階に構成員を参加させることで対応する。\n \nD.変化に対する不安が原因であれば、新たに必要とされるスキルを身につける機会を提供するなど、不安感を取り除く措置を講じるのである。","answer":"■正解：A\n  \n■解説：\nB～Dはすべて正解。\nA.が誤り。\n変革の実行は通常、大きな困難を伴う。なぜなら、人の行動にも、「外」からの力を受けない限り同じ状態にとどまろうという「慣性の法則」が働くからだ。\n■出典：グロービス マネジメントブック 改訂3版\n19.変革のマネジメントP.218-219","source":"Word: GMAP道場2026春 (1)(1).docx","no":377,"idx":377},{"id":"docx-2026春-組織行動-d357f8c0","season":"2026春","subject":"組織行動","scope":"10. コミュニケーション","question":"2026年4月30日(木)＜組織行動学＞\n出題範囲：10. コミュニケーション\n \n■問25.コミュニケーション・プロセスの説明について、A群のプロセスとB群の説明を繋げ、適切な組み合わせをつくりなさい。\n \n＜A群：プロセス＞\n①記号化\n②フィードバック\n③伝達\n④解読\n＜B群：説明＞\n[a] メッセージを記号に変換すること\n[b] さまざまなチャネルを通してメッセージを受け手に伝えること\n[c] 受け手が記号化されたメッセージの意味を読み取ること\n[d] 受け手が解読したメッセージを送り手とともに確認すること","answer":"■正解：\n①ー[a]\n③ー[b]\n④ー[c]\n②ー[d]\n■解説：\n①記号化　　　　：[a] メッセージを記号に変換すること\n③伝達　　　　　：[b] さまざまなチャネルを通してメッセージを受け手に伝えること\n④解読　　　　　：[c] 受け手が記号化されたメッセージの意味を読み取ること\n②フィードバック：[d] 受け手が解読したメッセージを送り手とともに確認すること\nなお、A群のプロセスの順番に注意。\n記号化→伝達→解読→フィードバック　が正しい。\n■出典：グロービス マネジメントブック 改訂3版\nコミュニケーション P.200-201","source":"Word: GMAP道場2026春 (1)(1).docx","no":378,"idx":378},{"id":"docx-2026春-人的資源管理-3f4d2928","season":"2026春","subject":"人的資源管理","scope":"14. 組織形態","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：14. 組織形態\n　\n■問30.それぞれの組織形態のデメリットに関する記載について、正しいものを選択してください。\nA.機能別組織は、幅広い知識を持ったマネジャーが育ちにくく、組織間のコンフリクトが起きやすい。その結果、最終的な意思決定がトップ・マネジメントに委ねられることが多くなり、意思決定に時間を要する。\n　\nB.事業部制組織は、各事業部間の競争意識が高いため、全社的に協力すべきときに協力しなかったり、経営資源を各事業部に分配する際に資源の取り合いになるおそれがある。\n　\nC.マトリクス型組織の構成員は、通常2人のボスを持つことになるので、権限や責任が曖昧かつ流動的になり、指揮命令系統が混乱したり、業務に支障が生じるおそれがある。\n　\nD.機能別組織は、個別の事業や製品について各機能部門の意思決定への関与が不明確なため、事業責任の所在が曖昧になりやすい。","answer":"■正解：全て\n　\n■解説：\nA.正しい\nB.正しい\nC.正しい\nD.正しい\n■出典：グロービス マネジメントブック 改訂3版\n14.組織形態 P.208-209","source":"Word: GMAP道場2026春 (1)(1).docx","no":379,"idx":379},{"id":"docx-2026春-人的資源管理-da8a164f","season":"2026春","subject":"人的資源管理","scope":"13 組織設計","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：13 組織設計\n■問29.組織設計にあたって考慮すべき要素には、分業と協業、指揮命令系統、管理範囲、意思決定権限、分化と統合が挙げられます。以下の記載の中で誤っているものを1つ選んでください。\nA.「問題が生じたときに、だれに報告・相談すればよいか」といった指揮命令系統の一貫性と明確さは業務を行ううえで不可欠である。\nB.管理範囲とは、1人のマネジャーが統制できる構成員の数を示したものである。管理範囲が広すぎると、組織の階層が増えて意思決定に時間がかかるなどの弊害が生じる。\nC.意思決定権限とは、組織のどこで意思決定を行うかを示したものである。組織の上位レベルである経営陣が組織の意思決定権限を独占的に持っている場合、その組織は「集権化されている」と言う。\nD.意思決定権限において、組織の下位レベルの者が主要な意思決定を行う機会が多いほど、その組織は「分権化されている」ことになる。","answer":"■正解：B\n■解説：\nA：正しい\nB：誤り\nC：正しい\nD；正しい\nBは誤りです。正しくは、組織の階層が増えて意思決定に時間がかかるなどの弊害が生じるのは、管理範囲が狭い場合です。一方、管理範囲が広い場合は、統制が効かず、不適切な行動が発生し、業務に支障をきたします。\n■出典：グロービス マネジメントブック 改訂3版\n13.組織設計 P.206-207","source":"Word: GMAP道場2026春 (1)(1).docx","no":380,"idx":380},{"id":"docx-2026春-人的資源管理-3a946b6f","season":"2026春","subject":"人的資源管理","scope":"12.組織文化と企業経営","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：12.組織文化と企業経営\n■問28.下記の「組織文化の機能」に関する文章中の（①）から（④）に入る語句の組み合わせとして適切なものを、選択肢AからDより選んでください。\n・組織文化は、とるべき判断や行動の指針を与える。その結果、（①）のスピードを速め、学習コストを低減する。\n・組織文化は、（②）の簡素化の機能を持つ。これにより、情報の解釈における不確実性も小さくなるので、構成員間の誤解やコンフリクトを回避することができる。\n・組織文化によって、構成員は何を行えば組織で評価されるかを学び、自ら目標を設定し、実践するための（③）を高めることができる。\n・組織文化の機能は企業にとってよい影響を与えているように見えるが、あまりに強烈な価値観が組織内で共有化されている場合、構成員のものの見方が固定化し、（④）を見過ごす原因になることがある。\nA. ①成長　②組織構造③スキル　④企業価値\nB. ①成長　②情報伝達　③モチベーション　④企業価値\nC. ①意思決定　②組織構造　③スキル　④環境変化\nD. ①意思決定　②情報伝達　③モチベーション　④環境変化","answer":"■正解：D\n■解説：\n・組織文化は、とるべき判断や行動の指針を与える。その結果、「意思決定」のスピードを速め、学習コストを低減する。\n・組織文化は、「情報伝達」の簡素化の機能を持つ。これにより、情報の解釈における不確実性も小さくなるので、構成員間の誤解やコンフリクトを回避することができる。\n・組織文化によって、構成員は何を行えば組織で評価されるかを学び、自ら目標を設定し、実践するための「モチベーション」を高めることができる。\n・組織文化の機能は企業にとってよい影響を与えているように見えるが、あまりに強烈な価値観が組織内で共有化されている場合、構成員のものの見方が固定化し、「環境変化」を見過ごす原因になることがある。\n■出典：グロービス マネジメントブック 改訂3版\n12.組織文化と企業経営  P.204-205","source":"Word: GMAP道場2026春 (1)(1).docx","no":381,"idx":381},{"id":"docx-2026春-人的資源管理-35a9dba0","season":"2026春","subject":"人的資源管理","scope":"3.組織行動学と人的資源管理","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：3.組織行動学と人的資源管理\n　\n■問27.人・組織のマネジメントは、「組織行動学」（OB）と「人的資本管理」（HRM）に分けて考えることができる。OBとHRMの説明について、正しいものを全て選びなさい。\n　　\nA.OBとHRMは、社会学や心理学などから導き出された「人の行動メカニズム」に基づいている。\n　\nB.人の行動メカニズムを考慮しながら、HRMではマネージャーなどの「個人の取り組み」によって、OBでは評価制度などの「仕組み」をつくることによって、組織や人に働きかける。\n　\nC.企業はOBの考え方とHRMの考え方とを組み合わせて、人・組織のマネジメントを行うが、そのときに重要なのは、OBの個別の行動とHRMの具体的な仕組みとの間で整合性がとれていることである。\n　\nD.人・組織のマネジメントは人事部門の専管事項と見なされることが多く、企業の競争優位の源泉となる「ヒト」と、ヒトの持つ「知識」や「知恵」の重要性が増している今日、人事部門以外の機能を担う部門のマネージャーもOBとHRMを理解する必要がある。","answer":"■正解：A, C, D\n　\n■解説：\nA.正しい\n　\nB.誤り\n人の行動メカニズムを考慮しながら、OBではマネージャーなどの「個人の取り組み」によって、HRMでは評価制度などの「仕組み」をつくることによって、組織や人に働きかける。\n　\nC.正しい\n　　\nD.正しい\n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n3.組織行動学と人的資源管理 P.186-187","source":"Word: GMAP道場2026春 (1)(1).docx","no":382,"idx":382},{"id":"docx-2026春-人的資源管理-6368cc4a","season":"2026春","subject":"人的資源管理","scope":"2.人・組織のマネジメントに影響を及ぼす要因","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：2.人・組織のマネジメントに影響を及ぼす要因\n■問26.「外部環境要因」に関連する内容についての説明で誤っているものを1つ選びなさい。\nA. 法的規制とは、法律や条令、裁判所が下した判例のことである。これに従って、人と組織のマネジメントを行わなければならない。\nB. 企業が従業員の賃金レベルや就業条件など、人・組織のマネジメントの具体的施策を決定するには、従業員の同意を得る必要があるが、労働組合と交渉を行う必要はない。\nC. 景気動向や金利・為替の変動などの経済状況も、人・組織のマネジメントに影響を及ぼす。\nD. 企業の競争力を維持するためには、競合他社の従業員と同等もしくはそれ以上の能力・資質を持った従業員を獲得し、育てるような施策を用意する必要がある。","answer":"■正解：B\n■解説：\nA・C・Dは正しい。\nBは「従業員の同意を得る必要があるが、労働組合と交渉を行う必要はない」が誤り。\n従業員の同意を得るために、従業員の代表である労働組合と交渉を行う必要がある。\n■出典：グロービス マネジメントブック 改訂3版\n2.人・組織のマネジメントに影響を及ぼす要因　P.184-185","source":"Word: GMAP道場2026春 (1)(1).docx","no":383,"idx":383},{"id":"docx-2026春-人的資源管理-40aa3eaa","season":"2026春","subject":"人的資源管理","scope":"1.企業経営と人・組織のマネジメント","question":"2026年4月29日（水）＜人的資源管理＞\n出題範囲：1.企業経営と人・組織のマネジメント\n■問25. 以下は「人の行動メカニズム」に関する記述である。誤っているものを1つ選択してください。\nA.企業は通常、人・組織のマネジメントの具体的な施策（報奨や評価制度など）を用いて、従業員やその集合である組織に影響を与え、企業の戦略目標の実現につながる行動を促そうとする。\nB.従業員に期待どおりに動いてもらうためには、人の行動のメカニズム（法則性）を理解しておくことが重要である。\nC.人の行動メカニズムを理解しないまま施策を打つと、弊害が生じることもある。\nD.個人の考え方や価値観は、属している企業の影響を受けて類似する傾向があるため、一定の傾向として整理することで、行動の予測に活用できる。","answer":"■正解：D\n■解説：\nA：正しい\nB：正しい\nC：正しい\nD：誤り\n個人の考え方や価値観は多様性に富む。したがって、多面的な視点からさまざまな可能性を予測するよう心がけることも大切。\n■出典：グロービス マネジメントブック 改訂3版\n1.企業経営と人・組織のマネジメント P.182-183","source":"Word: GMAP道場2026春 (1)(1).docx","no":384,"idx":384},{"id":"docx-2026春-経営戦略-881c47b5","season":"2026春","subject":"経営戦略","scope":"17. 戦略形成に関する見方","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：17. 戦略形成に関する見方\n　\n■問30.より現場に近いところからの戦略立案を重視するのがラーニング学派です。ピーター・センゲ、ゲーリー・ハメル、K・プラハラードがこのラーニング学派の代表ですが、彼らが大前提とした以下の5つの考え方の中で正しいものを全てあげてください。\n　\nA.戦略は創発的なものであり、形式的な計画で生まれるものではない。\nB.戦略家は組織のいたるところに存在している。\nC.戦略の形成と実行は互いに独立した関係である。\nD.組織内で創発したアイデアや行動を戦略にまとめ、組織に展開することは重要ではない。\nE.組織学習が創発的戦略の立案・実行・修正を促進する。","answer":"スーパーではいろいろな産地の「コシヒカリ」が並んでいますが、見かけた際には福井県で生まれたお米と思っていただけると幸いです。\n　\n■正解：A、B、E\n　\n■解説：\nA：正しい\nB：正しい\nC：戦略の形成と実行は相互に絡み合っている。\nD：組織内で創発したアイデアや行動を戦略にまとめ、組織に展開することが重要である。\nE：正しい \n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n17．戦略形成に関する見方 P.34-35","source":"Word: GMAP道場2026春 (1)(1).docx","no":385,"idx":385},{"id":"docx-2026春-経営戦略-f2d2fe4f","season":"2026春","subject":"経営戦略","scope":"12.業界分析：業界構造と「5つの力」","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：12.業界分析：業界構造と「5つの力」\n■問29. 新規参入の脅威　新規参入は競合企業が増えるだけでなく、競争ルールの変化をもたらすこともある。新規参入が容易（参入障壁が低い）業界では、業界の収益性が上がるとすぐに参入者が増加し、収益性は下がってしまう。参入障壁には、（A）の障壁、（B）の障壁、（C）の障壁などさまざまなものがある。海外メーカーの新規参入が脅威となるケースも多い。\n上記（A）（B）（C）に当てはまる語句の組み合わせで合っている番号を答えてください。\n（A）技術上（B）マーケティング上（C）人材投資\n（A）技術上（B）事業規模（C）設備投資\n（A）開発上（B）事業規模（C）人材投資\n（A）技術上（B）マーケティング上（C）設備投資\n（A）開発上（B）事業規模（C）人材投資","answer":"■正解：4\n■解説：\n新規参入の脅威　新規参入は競合企業が増えるだけでなく、競争ルールの変化をもたらすこともある。新規参入が容易（参入障壁が低い）業界では、業界の収益性が上がるとすぐに参入者が増加し、収益性は下がってしまう。参入障壁には、技術上の障壁、（B）マーケティング上の障壁、設備投資の障壁などさまざまなものがある。海外メーカーの新規参入が脅威となるケースも多い。\n■出典：グロービス マネジメントブック 改訂3版\n12．業界分析：業界構造と「５つの力」　P.24-25","source":"Word: GMAP道場2026春 (1)(1).docx","no":386,"idx":386},{"id":"docx-2026春-経営戦略-d2babbf1","season":"2026春","subject":"経営戦略","scope":"6.事業ポートフォリオと事業ライフサイクル","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：6.事業ポートフォリオと事業ライフサイクル\n■問28.下記文章中の（①）～（⑤）に入る語句を選択肢A～Eのうちから選んでください。\n・導入期：（①）も（②）も低く、（③）もマイナスだ。競合企業はほとんどないが、需要拡大のために顧客に対するPR活動に力を入れる必要がある。\n・成長期：（①）が急速に伸び、（②）も上昇する。（③）もプラスに転じるが、競合他社の参入は増える。競争が激しくなるため、他社との差別化を図る必要がある。\n・成熟期：（①）は低成長に転じ、（②）も低下するが、（④）額が少ないため（③）はプラスになる。競争が激化するため、（⑤）が築けなければ敗者となる。\n・衰退期：（①）は低下し、（②）も減少する。新規（④）が不要なため一部のリーダー企業は（②）を出すことができるが、安定した収益を上げ続けるには効率性の追求が不可欠となる。\nA. キャッシュフロー\nB. 投資\nC. 競争上の優位性\nD. 売上高\nE. 利益","answer":"■正解：①D、②E、③A、④B、⑤C\n■解説：\n事業ライフサイクルの各段階で競争環境や顧客のニーズ、必要な資金、戦略課題が変わることに注意が必要だ。\n・導入期：売上高も利益も低く、キャッシュフローもマイナスだ。競合企業はほとんどないが、需要拡大のために顧客に対するPR活動に力を入れる必要がある。\n・成長期：売上高が急速に伸び、利益も上昇する。キャッシュフローもプラスに転じるが、競合他社の参入は増える。競争が激しくなるため、他社との差別化を図る必要がある。\n・成熟期：売上高は低成長に転じ、利益も低下するが、投資額が少ないためキャッシュフローはプラスになる。競争が激化するため、競争上の優位性が築けなければ敗者となる。\n・衰退期：売上高は低下し、利益も減少する。新規投資が不要なため一部のリーダー企業は利益を出すことができるが、安定した収益を上げ続けるには効率性の追求が不可欠となる。\n■出典：グロービス マネジメントブック 改訂3版\n6.事業ポートフォリオと事業ライフサイクル P.12-13","source":"Word: GMAP道場2026春 (1)(1).docx","no":387,"idx":387},{"id":"docx-2026春-経営戦略-ebea9f5d","season":"2026春","subject":"経営戦略","scope":"2.経営理念と戦略レベル","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：2.経営理念と戦略レベル\n■問27.次のA～Dのうち正しいものを全て選べ。\nA. 経営戦略は、経営理念やビジョンと企業の現実の姿との間に存在するギャップを埋めるための具体的な方法論を示すものだ。\nB. 経営戦略は通常、全社的な視点(全社戦略)、個別事業の視点(個別戦略)、機能別の視点(機能戦略)という3つの戦略レベルで策定される。\nC. ビジョンは、経営理念で規定された経営姿勢や存在意義に基づき、ある時点までに「こうなっていたい」と考える到達点、つまり自社が目指す中期的なイメージを投資家や従業員や社会全体に向けて示したものだ。\nD. 経営戦略は行動規範や成功の必須条件、経営姿勢、企業の存在意義など様々な形で表現されるが、一般的には時代の流れを超えた長期的な視点で、社会(顧客)と従業員に関する考えを語ったものが多い。","answer":"■正解：A、C\n■解説：\nA：正しいです\nB：経営戦略は「全社戦略」「事業戦略」「機能戦略」という3つの戦略レベルで策定されます。「個別戦略」が誤りです。\nC：正しいです\nD：これは「経営戦略」ではなく「経営理念」の説明です。\n■出典：グロービス マネジメントブック 改訂3版\n2．経営理念と戦略レベル P.4-5","source":"Word: GMAP道場2026春 (1)(1).docx","no":388,"idx":388},{"id":"docx-2026春-経営戦略-b3bd8f04","season":"2026春","subject":"経営戦略","scope":"26.M&Aとアライアンス","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：26.M&Aとアライアンス\n■問26.M&Aとアライアンスを比較した記述として、M&Aに当てはまる記述は次のA～Dのうち、どれか？\nA.時間・資金はそれほど要さない\nB.法的手続きが容易\nC.組織文化の摩擦が致命的な問題となりやすい\nD.解消が容易（結束が弱い）","answer":"■正解：C\n■解説：\n企業文化あるいは組織面での適合性がなく、有機的に統合されずにシナジーを発揮できないケースや、社風の違いにより従業員が強い拒否反応を示し、長期にわたって経営の阻害要因となるケースも多い。\n■出典：グロービス マネジメントブック 改訂3版\n26.M&Aとアライアンス　P.36-37（P37のM&A注意点、M&Aとアライアンスの比較の表より）","source":"Word: GMAP道場2026春 (1)(1).docx","no":389,"idx":389},{"id":"docx-2026春-経営戦略-b2bf8adb","season":"2026春","subject":"経営戦略","scope":"9. 競争優位を築くための基本戦略","question":"2026年4月28日（火）＜経営戦略＞\n出題範囲：9. 競争優位を築くための基本戦略\n■問25. 「競争優位」を築くための基本戦略に関する記述について、次の4つから「誤っているもの」を全て選択してください。\n① 戦略策定の際には、自社の経営資源と事業特性を十分に考慮して、どの戦略をとるのかは決めずに柔軟に対応する必要がある。\n② コスト・リーダーシップ戦略は、コストを中心に競争優位を確立することに主眼を置くもので、「競合他社よりも低いコストを実現すること」が基本テーマとなる。\n③ 差別化戦略では、「自社の製品を差別化して、業界の中でもユニークだと見られる何かを創造すること」が基本テーマだ。そのユニークさは、顧客に価値として認識され、競合が簡単に模倣できないものでなければならない。\n④ 集中戦略は、「特定の顧客層、特定の製品、特定の市場など限られた領域に企業の経営資源を集中すること」が基本テーマだ。コスト・リーダーシップ戦略と差別化戦略では市場のほぼ全体を対象にしているが、集中戦略では特定のターゲットだけを狙う。","answer":"■正解：「①のみ」が誤り。\n■解説：\n正しくは、「① 戦略策定の際には、自社の経営資源と事業特性を十分に考慮して、どの戦略をとるのかを明確にする必要がある。」です。3つの基本的な戦略パターン、「コスト・リーダーシップ戦略」「差別化戦略」「集中戦略」のいずれかを実現できていない事業は窮地に立たされることが多いです。事業特性や市場環境、自社の経営資源などを十分に考慮し、どの戦略が有効であるか判断しましょう。\n■出典：グロービス マネジメントブック 改訂3版\n競争優位を築くための基本戦略 P.18-19","source":"Word: GMAP道場2026春 (1)(1).docx","no":390,"idx":390},{"id":"docx-2026春-マーケティング-f39b6ac2","season":"2026春","subject":"マーケティング","scope":"9. ブランド","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：9. ブランド\n \n■問30.強いブランドを持つことで企業が得られる効果について、誤っているものをすべて選択してください。\n \nA.商標権を設定することで法的保護が受けられ、競合と差別化できる\n \nB.顧客のブランド・ロイヤルティを得て、安定的な売上げを確保できる\n \nC.低価格が設定可能になり、プロモーションへの依存度が小さくなり、販売数量の増加を実現できる\n \nD.新規参入者に対する障壁となり、競争優位の構築に貢献する","answer":"■正解：Cが誤り\n  \n■解説：\nAとBとDは記載の通り。\nCの「低価格設定」と「販売数量の増加」が誤り。強いブランドによってプレミアム価格が設定可能になり、プロモーションへの依存度が小さくなり、高マージンを実現できる。\n \n■出典：グロービス マネジメントブック 改訂3版 　\n　9.ブランド P.64-65","source":"Word: GMAP道場2026春 (1)(1).docx","no":391,"idx":391},{"id":"docx-2026春-マーケティング-d8747923","season":"2026春","subject":"マーケティング","scope":"8. 製品特性","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：8. 製品特性\n \n■問29.マーケティング・ミックスにおける「製品の類型」について、誤っているものをすべて選択してください。\n \nA. 実務でよく使われる製品分類は、「物理特性」・「使用目的」・「顧客の購買プロセス」という切り口で分けたものである。\n \nB. 物理特性は、「非耐久財」・「耐久財」・「サービス」の３つに分類される。\n \nC. 使用目的は、個人消費のための「生産財」と、原材料や部品、設備品などの生産のために使用される「消費財」に分類される。\n \nD. 顧客の購買プロセスは、「最寄品」「買回品」「専門品」に分類される。","answer":"■正解：Cのみ誤り\n  \n■解説：\nC. 使用目的は、個人消費のための「消費財」と、原材料や部品、設備品などの生産のために使用される「生産財」に分類される。生産財はさらに、「材料・部品」、「道具や機械などの「資本財」、保守・修繕に用いる「備品・サービス」に分けられる。\n■出典：グロービス マネジメントブック 改訂3版\n製品特性  P.62-63","source":"Word: GMAP道場2026春 (1)(1).docx","no":392,"idx":392},{"id":"docx-2026春-マーケティング-2c680d44","season":"2026春","subject":"マーケティング","scope":"7. ポジショニング","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：7. ポジショニング\n■問28. ポジショニングを決定する際の留意点として、誤っているものを1つ選択してください。\nA.優れたポジショニングが想定する顧客イメージは、実際にその商品を購入すると想定されるターゲット顧客とは異なる場合がある。\nB.どんなに魅力的なポジショニングを考えていても、それを顧客にきちんと伝えるコミュニケーションの努力がなければ、顧客の頭の中に像は結ばれない。\nC.ポジショニングにおいては、売り手の意図が顧客に正確に伝わることが最優先であり、内容が売り手の独りよがりであっても、製品そのものが優れていれば成功する。\nD.製品のポジショニングが売り手企業自体やその既存製品のポジショニングと整合していないと、顧客に混乱した印象を与えるだけでなく、企業イメージを損なう可能性がある。","answer":"■正解：C\n■解説：\nポジショニングを決定する際の留意点の一つには、「顧客にとって共感できること」が挙げられる。\n売り手の意図を正確に伝えられたとしても、それが売り手の独りよがりな内容であれば成功しない。製品を購入する顧客にとって意味がある、重要なポジショニングでなければならない\n■出典：グロービス マネジメントブック 改訂3版 　\n7 ポジショニング P.60-61","source":"Word: GMAP道場2026春 (1)(1).docx","no":393,"idx":393},{"id":"docx-2026春-マーケティング-7a4ae91b","season":"2026春","subject":"マーケティング","scope":"6.セグメンテーションとターゲティング","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：6.セグメンテーションとターゲティング\n \n■問27.どの顧客層（セグメント）をターゲットにするかを決めるのがターゲティングである。ターゲティングの際に注意すべき“6R”について、下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢AからCより選んでください。\n \n・有効な市場規模：その事業あるいは商売が成立する最低限の規模を獲得できる（①）でなければならない\n・（②）：一般的に、市場の生成期や成長段階の初期に、売上げやシェア獲得の大きなチャンスがある。\n・顧客の優先順位／波及効果：もし周囲への影響力の強い（①）があるならば優先的にアプローチをすべきである。\n・到達可能性：たとえ魅力的な（①）があっても、地理的に遠かったり、名簿を入手できなかったりすると、顧客に的確なアプローチができない。\n・（③）：すでに競合がその市場で大きな地位を占めている場合、市場の魅力度は低減する。競合の優位性が小さい領域で差別化できれば、新たな地位を獲得する可能性が広がる\n・（④）：実行されたアクションに対し、適切な結果がもたらされたかを測定すべきである。広告の効果や、商品に対する満足度の調査などが挙げられる。\n \n \nA. ①成長性　②セグメント　③競合状況　④反応の測定可能性\nB. ①セグメント　②成長性　③競合状況　④反応の測定可能性\nC. ①成長性　②セグメント　③反応の測定可能性　④競合状況","answer":"■正解：B\n \n■解説：\nターゲティングを行うときは、特に以下の6点(6R)に注意し、総合的に判断しなくてはならない。\n有効な市場規模（Realistic Scale）\n成長性（Rate of Growth）\n顧客の優先順位／波及効果（Rank／Ripple Effect）\n到達可能性（Reach）\n競合状況（Rival）\n反応の測定可能性（Response）\n \n■出典：グロービス マネジメントブック 改訂3版\n6.セグメンテーションとターゲティングP.58-59","source":"Word: GMAP道場2026春 (1)(1).docx","no":394,"idx":394},{"id":"docx-2026春-マーケティング-ca4f2290","season":"2026春","subject":"マーケティング","scope":"5 .マーケティング・リサーチ","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：5 .マーケティング・リサーチ\n■問 26. 下記選択肢AからDの文章の中から、誤っているものを全て選んでください。\nＡ．マーケティング戦略を策定する際、市場で起こっていることを把握し、自社のアイディアが市場に受け入れられるかどうかを確認する必要がある。そのため、考えられる仮説と予測される結果を事前に考え、調査結果との違いを評価する「仮説検証型のリサーチ」を実施する事が望ましい。\nＢ．リサーチは通常、1、仮説の設定　→　2、リサーチ目的の設定　→　3、リサーチの設計と実施　→ 4、仮説の検証という手順で行われる。\nC．仮説を検証するために必要なデータを収集する際、新聞等で一般に公表されているデータのように他の目的のために集められたデータを「1次データ」 、特定の目的のために自らリサーチして集めるデータを「2次データ」と呼ぶ。\nD．自らリサーチしてデータを集める際、品質(正確さ)とコスト(金銭・時間的)のトレードオフを考える必要がある。また、調査の精度や回答率に影響を与える質問形式(記述か選択か)や、質問数等にも留意する必要がある。","answer":"■正解： ＢとＣが誤り\n■解説：\nＡ：正しい\nＢ：1、リサーチ目的の設定　→　2、仮説の設定 　の順番が正しい。まず誰がどのような目的でどのような情報を必要としているのか明確にして初めて、リサーチすべき問題や必要なデータを特定することができる。\nＣ：特定の目的のために集める情報を「1次データ」、一般に公表されているデータを「2次データ」と呼ぶ。\nＤ：正しい\n■出典：グロービス マネジメントブック 改訂3版\n5 .マーケティング・リサーチ 　 p.56- 57","source":"Word: GMAP道場2026春 (1)(1).docx","no":395,"idx":395},{"id":"docx-2026春-マーケティング-6fcc2ba0","season":"2026春","subject":"マーケティング","scope":"4.市場の機会の発見","question":"2026年4月27日（月）＜マーケティング＞\n出題範囲：4.市場の機会の発見\n \n■問25.市場の機会の発見について①～④に入る語句の組み合わせとして適切なものを、選択肢A～Dより選択してください。\n \n外部環境ではマクロ環境、「①」について、内部環境では自社の「②」などを明らかにする。その後SWOT分析を行い、「③」を発見する。SWOT分析とは内部分析による自社の強み・弱みと、外部分析による市場の「④」をかけ合わせて総合的に判断するためのフレームワークである。\nA. ①経営資源、強み・弱み　②KSF　③機会・脅威　④競合\nB. ①市場(顧客)、競合　②経営資源や強み・弱み　③KSF　④機会・脅威\nC. ①機会・脅威　②市場(顧客)、競合　③強み・弱み　④KSF\nD. ①KSF　②機会・脅威　③市場(顧客)　④強み・弱み","answer":"■正解：B\n  \n■解説：\n外部環境ではマクロ環境、「市場(顧客)、競合」について、内部環境では自社の「経営資源や強み・弱み」などを明らかにする。その後SWOT分析を行い、「KSF」を発見する。SWOT分析とは内部分析による自社の強み・弱みと、外部分析による市場の「機会・脅威」をかけ合わせて総合的に判断するためのフレームワークである。です！\n■出典：グロービス マネジメントブック 改訂3版\n4.市場の機会の発見P.54-55","source":"Word: GMAP道場2026春 (1)(1).docx","no":396,"idx":396},{"id":"docx-2026春-ファイナンス-7f1f79a3","season":"2026春","subject":"ファイナンス","scope":"20. オプション理論の基礎","question":"2026年4月25日（土）＜ファイナンス＞\n出題範囲： 20. オプション理論の基礎\n　\n■問24. オプション理論の説明について、誤っているものを選択してください。\nA.オプションとは、ある資産(株式や債券など)を将来の定められた時点に一定の価格で売買する義務である。\n　\nB.オプションの保有者(「買い手」)はオプションが行使できればリスクなしで必ず利益を上げられる。(中略)そのため、契約成立時に、オプションの買い手は「プレミアム」と呼ばれる対価を売り手に支払う。\n　\nC.オプションには大きく分けてコール・オプションとプット・オプションの2種類がある。さらに、オプションにはその権利を行使できるタイミングであらかじめ定めた期限1回のみの「ヨーロピアン型」と、期限以前であればいつでも行使できる「アメリカン型」の2タイプがある。\n　\nD.一定の前提の下でオプションのプレミアムを数式化したのが、ブラック＝ショールズのオプション価格式だ。この式に、❶現在の対象資産価格、❷行使価格、❸満期までの時間、❹金利、❺対象資産の変動率(ボラティリティ)というデータを入力すれば、表計算ソフトを使ってだれでもオプション価格を求めることができる。","answer":"■正解：A\n　\n■解説：\n・A.オプションとは、ある資産(株式や債券など)を将来の定められた時点に一定の価格で売買できる権利(義務ではない)で、保険のようなものです。\n・コール・オプションとプット・オプションの種類と取引内容は下記のとおりです。\nコール・オプション→買い手:資産を買う権利を持つ、売り手:資産を売る義務を負う。\nプット・オプション→買い手:資産を売る権利を持つ、売り手:資産を買う義務を負う。\n・一般にコール・オプションの場合、資産価格が行使価格よりも上昇していれば、時価よりも安く買えるので、オプションを行使して利得を確保しますが、行使価格以下であればオプションを行使しません。プット・オプションの場合は、資産価格が行使価格よりも下落していれば、時価よりも高く売れるのでオプションを行使して利得を確保しますが、行使価格以上であれば放棄します。\n　\n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n20．オプション理論の基礎 P.174-175","source":"Word: GMAP道場2026春 (1)(1).docx","no":397,"idx":397},{"id":"docx-2026春-ファイナンス-c5ace198","season":"2026春","subject":"ファイナンス","scope":"19. EVA","question":"2026年4月23日（木）＜ファイナンス＞\n出題範囲：19. EVA\n■問23.下記文章のうち EVAの説明として正しいものはどれか。\n・A：大きな投資をした年度は必ずEVAがマイナスになる。\n・B：EVAは経常的な企業活動による利益から、資金調達にかかるすべての資本コストを差し引いたものを企業の真の利益として認識する。\n・C：EVAは税引後営業利益から過去の投下総資本にWACCを掛けたものを差し引いたものである。\n・D：EVAは単年度業績評価などに利用するためにアレンジされた利益ベースの指標である。","answer":"■正解：C\n■解説：\nA：大きな投資をした年度は必ずEVAがマイナスになる。\n⇒誤り：増加した資本分に見合う資本コストの実額さえ稼いでいればEVAがマイナスになることはまずない。\nB：EVAは経常的な企業活動による利益から、資金調達にかかるすべての資本コストを差し引いたものを企業の真の利益として認識する。\n⇒誤り：営業活動による利益から資本コストを差し引く。経常的な活動だと支払金利が含まれるため。\nC：EVAは税引後営業利益から期初の投下総資本にWACCを掛けたものを差し引いたものである。\n⇒正しい：EVA = NOPAT - WACC × 期初の投下総資本\nD：EVAは単年度業績評価などに利用するためにアレンジされた利益ベースの指標である。\n⇒誤り：利益ベースではなく、キャッシュフローベースの指標のため。\n■出典：グロービス マネジメントブック 改訂3版\n19．EVA P.172-173","source":"Word: GMAP道場2026春 (1)(1).docx","no":398,"idx":398},{"id":"docx-2026春-ファイナンス-ba37bc41","season":"2026春","subject":"ファイナンス","scope":"17.企業価値の算出","question":"2026年4月25日（土）＜ファイナンス＞\n出題範囲：17.企業価値の算出\n■問21.下記文章のうち、誤っているものを選択肢A～Dの中から選んでください。\n（回答は一つとは限りません。）\nA.企業価値算定を行う場合、大きく分けて今後ともこの企業が事業活動を継続していくことを前提とする価値（継続価値）と、解散するとした場合の価値（清算価値）の2つの考え方がある。\nB. 一般的には企業は永続的な存在であると考えられるため、企業価値の算定は①予測財務諸表を作成し、そこから求められるFCFとWACCから価値を算定する期間と②それ以降の期間に分けて行われる。後者の期間の価値を継続価値と呼ぶ。\nC.財務諸表上の企業の利益をもとにして企業の価値を推定しようという考え方はその簡便さゆえにかなり多くの投資家に利用されている。その考え方の一つであるPERは単純に現在の営業利益の何倍かがその企業の価値であるという考え方である。ここで、この考え方は企業価値は株式時価総額と一致するとの立場に立っていることに注意する必要がある。\nD.清算価値とは企業を今解散するとして、資産を個別に洗いなおして処分価値を合計したものから、負債を差し引いた金額を価値とする考え方だ。資産の評価額は通常Ｂ/Ｓ（貸借対照表）に記載されている簿価額を用い算定を行う。","answer":"■正解：ＣとＤ\n■解説：\nＣ.PERは営業利益ではなく株主にとっての企業価値という観点から、金利や税金などを差し引いた【税引き後利益】を用い算定します。\nＤ.資産の処分価格は通常貸借対照表上の簿価とは異なります(時価をもちいます)。土地などでいわゆる「含み」がある場合は簿価よりも高くなったり低くなったりします。\n■出典：グロービス マネジメントブック 改訂3版\n17.企業価値の算出　 P168-169","source":"Word: GMAP道場2026春 (1)(1).docx","no":399,"idx":399},{"id":"docx-2026春-ファイナンス-bcff1dff","season":"2026春","subject":"ファイナンス","scope":"16. フリー・キャッシュフロー","question":"2026年4月25日（土）＜ファイナンス＞\n出題範囲：16. フリー・キャッシュフロー\n　\n■問20.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n　\nフリー・キャッシュフロー（FCF）とは、DCF法により企業価値を計算する時に使われるキャッシュフローのことであり、以下のように定義される。\n　\nFCF＝（①）×（1ー法人税率）＋（②）ー 投資 ー （③）\n　\nA. ①EBITDA　②支払利息　　③ΔWC\nB. ①EBIT　　 ②減価償却費　③ΔWC\nC. ①EBIT　　 ②支払利息　　③WC\nD. ①EBITDA　②減価償却費　③ΔWC","answer":"■正解：B\n　\n■解説：\n・EBIT（Earning Before Interest and Tax：支払金利前税引前利益）は営業利益に金利以外で恒常的に発生する営業外損益を加えた額です。\n・減価償却は実際にはキャッシュの流出を伴わないため減価償却費を足し戻します。\n・ΔWCはワーキング・キャピタル（Working Capital：運転資本）の前年度との差額（増加運転資本）です。\n　\n　\n■出典：グロービス マネジメントブック 改訂3版\n16．フリー・キャッシュフロー P.166-167","source":"Word: GMAP道場2026春 (1)(1).docx","no":400,"idx":400},{"id":"docx-2026春-ファイナンス-346d91c5","season":"2026春","subject":"ファイナンス","scope":"18.株式評価モデル","question":"2026年4月25日（土）＜ファイナンス＞\n出題範囲：18.株式評価モデル\n■問19.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n・キャッシュフロー割引モデルでは、企業活動から発生すると予想される毎年の（①）を（②）で割り引いた現在価値をすべて合計することで、企業の総資産価値（TEV）が得られる。\n・TEVはキャッシュフローから割り出された企業の価値なので、そこから負債の価値を差し引けば、（③）の価値が得られる。\nA. ①営業利益　②株主資本コスト　③純利益\nB. ①配当　②加重平均資本コスト　③有利子負債\nC. ①フリー・キャッシュフロー　②加重平均資本コスト　③株主資本\nD. ①フリー・キャッシュフロー　②負債コスト　③現金同等物","answer":"■正解：C\n■解説：\n・キャッシュフロー割引モデルでは、企業価値は将来にわたって生み出されるフリー・キャッシュフローを基準に評価する。フリー・キャッシュフローは、企業が事業活動によって実際に生み出す現金であり、株主・債権者の双方に帰属しうるキャッシュである。\n・これらのフリー・キャッシュフローを現在価値に割り引く際には、株主と債権者の双方の期待リターンを反映した加重平均資本コスト（WACC）を用いる。これにより、企業の総資産価値（TEV）が算出される。\n・TEVは企業全体の価値であるため、そこから負債の価値（厳密には純有利子負債）を差し引くことで、最終的に株主に帰属する価値、すなわち株主資本の価値が求められる。\n・したがって、「①フリー・キャッシュフロー」「②加重平均資本コスト」「③株主資本」の組み合わせが正しい。\n■出典：グロービス マネジメントブック 改訂3版\n18.株式評価モデル P.170-171","source":"Word: GMAP道場2026春 (1)(1).docx","no":401,"idx":401},{"id":"docx-2026春-アカウンティング-1ed61b9c","season":"2026春","subject":"アカウンティング","scope":"7. 貸借対照表（負債＋純資産）","question":"2026年4月24日（金）＜アカウンティング＞\n出題範囲：7. 貸借対照表（負債＋純資産）\n■問24.貸借対照表の「負債」および「純資産」に関する記述として、正しいものをすべて選択してください。\n　\nA. 貸借対照表の「負債」と「純資産」の合計は、企業活動に必要な資金をどこから用立てたかという「資金調達の源泉」を示している。\n　\nB. 純資産は、株主が企業に拠出した資金(資本金、資本剰余金、自己株式)や、過去の利益(利益剰余金)の蓄積で構成される。\n　\nC. 流動負債とは、支払猶予期間が1年を超える長期的な負債のことであり、代表的なものに長期借入金がある。\n　\nD. 株主資本のうち、資本金や資本剰余金は「財務活動」に対応し、過去の利益の蓄積分である利益剰余金は「営業活動」に対応する。","answer":"■正解：A,B,D\n■解説：\n1年以内に支払わなくてはならない負債を「流動負債」、支払猶予期間が1年を超える長期的な負債を「固定負債」と呼ぶ。長期借入金は固定負債に該当するため、Cの「流動負債」という記述は誤りである。\n　\n■出典：グロービス マネジメントブック 改訂3版\n貸借対照表（負債＋純資産） P.104-105","source":"Word: GMAP道場2026春 (1)(1).docx","no":402,"idx":402},{"id":"docx-2026春-アカウンティング-3d308596","season":"2026春","subject":"アカウンティング","scope":"6. 貸借対照表（資産）","question":"2026年４月24日（金）＜アカウンティング＞\n出題範囲：6. 貸借対照表（資産）\n■問23. 貸借対照表は大きく資産の部と負債・純資産の部に分けられる。そのうち資産は企業が保有する資金の具体的形態を示すもので、通常、流動資産、固定資産、繰延資産に分類される。下記のそれぞれの説明から誤っているものを選んでください。\nA.流動資産の「流動」とは主に短期間（１年以内）に現金化できることを意味し、流動資産とは「短期間に現金化するもの」の意味合いを持つ。一方、「短期間に費用になるもの」については「流動負債」に分類される。\nB.流動資産のうち、「当座資産」は営業活動の仕入れ・生産段階で生じる完成品・半製品などのように販売されることで初めて現金化される資産を指す。\nC.固定資産の「固定」とは、主に１年以内に費用化または現金化しないことを意味する。固定資産のほとんどが「長期にわたり費用になるもの」である。固定資産は有形固定資産および無形固定資産の２つに分類される。一方、企業本来の事業活動とは関係のない投資や、支配することを目的として長期的に保有する資産については「繰延資産」に分類される。\nD.繰延資産とは固定資産と同じく短期に費用化できない資産として特別に認められているものだ。その効果が一定期間継続すると考えらえるものについて、支出時に一度に費用化するのではなく、一時的に資産として計上する。そしてその効果が及ぶ期間にわたって徐々に費用化していく。公開企業の財務諸表の中ではあまり見られない科目である。","answer":"■正解：A,B,Ｃが誤り\n■解説：\nＡ.「流動資産」は「短期間に現金化するもの」と「短期間に費用となるもの」から構成される。\nＢ.流動資産のうち「当座資産」は、営業活動の販売段階で生じる売掛金・受取手形など、営業活動の回収段階で生じる現金・預金のように現金および現金に近い形の資産を指す。設問は「たな卸資産」に関する説明なので誤り。\nC. 固定資産は有形固定資産、無形固定資産、投資その他資産の３つに分類される。企業本来の事業活動とは関係のない投資や、支配することを目的として長期的に保有する資産については「投資その他資産」に分類される。\nD.正しい\n■出典：グロービス マネジメントブック 改訂3版\n貸借対照表（資産） P.102-103","source":"Word: GMAP道場2026春 (1)(1).docx","no":403,"idx":403},{"id":"docx-2026春-アカウンティング-2dbc9b6d","season":"2026春","subject":"アカウンティング","scope":"5. 損益計算書","question":"2026年4月24日（金）＜アカウンティング＞\n出題範囲：5. 損益計算書\n　\n■問22.A〜Dに示す各指標を算出してください。（計算式の答えは小数点第二位を四捨五入してください）\n　\n2025年\n売上高：10,000\n本社建物の減価償却費：500\n製造ラインの材料、労務、経費：6,000\n広告宣伝費：1,500\n持ち合い株売却益：300\n支払利息：200\n　\n　\nA.　売上高総利益率\nB.　売上高営業利益率\nC.　売上高経常利益率\nD.　売上高税引前当期純利益率","answer":"■正解：\nA:40％\nB:20％\nC:18％\nD:21％\n　\n■解説：\n（A）売上高総利益率\n売上総利益＝売上高（10,000）ー製造原価※製造ラインの材料、労務、経費（6,000）＝4,000\n売上高総利益率：売上総利益（4,000）÷売上高（10,000）＝40％\n（B）売上高営業利益率\n営業利益＝総利益（4,000）ー販管費（本社建物の減価償却費：500+広告宣伝費：1,500）＝2,000\n売上高営業利益率＝営業利益（2,000）÷売上高（10,000）＝20％\n（C）売上高経常利益率\n経常利益＝営業利益（2,000）ー営業外費用（支払利息：200）＝1,800\n売上高経常利益率＝経常利益（1,800）÷売上高（10,000）＝18％\n（D）売上高税引前当期純利益率\n税引前当期純利益＝経常利益（1,800）+特別利益（持ち合い株売却益：300）＝2,100\n売上高税引前当期純利益率＝税引前当期純利益（2,100）÷売上高（10,000）＝21％\n暗算しやすいようにしています。数値は覚えてしまいやすいですが、利益の構造と計算の流れは思い出せるようにしておきましょう。\n　\n■出典：グロービス マネジメントブック 改訂3版\n5.損益計算書 P.100-101","source":"Word: GMAP道場2026春 (1)(1).docx","no":404,"idx":404},{"id":"docx-2026春-アカウンティング-160ad831","season":"2026春","subject":"アカウンティング","scope":"21. 内部統制","question":"2026年4月24日(金)＜アカウンティング＞\n出題範囲：21. 内部統制\n■問21.内部統制について説明した文章のうち、正しいものを選択してください\nA.内部統制とは企業の財務報告の信頼性を確保し、かつ事業経営に関わる法規の遵守を促すことを目的として企業内部に設けられ運用される仕組みであり、事業経営の有効性や効率性を高めることは目的ではない\nB.内部統制は6つの構成要素に大別されアメリカ・日本ともに同じ要素で構成されている\nC.日本における内部統制の構成要素には、「ＩＴによる効率化」は手段の話なので含まれていない。\nD.それぞれの企業においてどのような内部統制の仕組みを構築し、運用するかは各国の法制や社会慣行、あるいは個々の企業が置かれた環境や事業特性などを踏まえ、工夫していくべきものだ。","answer":"■正解：Ｄ\n■解説：\n・A：内部統制とは、企業の財務報告の信頼性を確保し、事業経営の有効性と効率性を高め、かつ事業経営に関わる法規の順守を促すことを目的として企業内部に設けられ、運用される仕組みのことです。\n・Ｂ・Ｃ：６つの構成要素は、①統制環境、②リスク評価の機能、③統制活動、④情報・伝達の機能、⑤監視活動、⑥①～⑤の諸要素がＩＴによって効率的に実施されること。アメリカのＳＯＸ法では①～⑤を定めており、このうち⑥は日本独自に追加されたものです。\n■出典：グロービス マネジメントブック 改訂3版\n21.内部統制P.132-133","source":"Word: GMAP道場2026春 (1)(1).docx","no":405,"idx":405},{"id":"docx-2026春-アカウンティング-19011b84","season":"2026春","subject":"アカウンティング","scope":"20. マネジメント・コントロール","question":"2026年4月24日（金）＜アカウンティング＞\n出題範囲：20. マネジメント・コントロール\n■問20.一般、マネジメント・コントロールのプロセスは以下の4段階からなる。上流から順に並べなさい。\nA.経営資源配分計画策定（プログラミング）\nB.予算編成（バジェッティング）\nC.部門別実行計画策定\nD. 実績分析・業績評価・報告（レポーティング）","answer":"■正解：C→A→B→D\n■解説：\n部門別実行計画策定：全社の戦略計画を各部門の実行計画に翻訳し、方向付けするプロセスである。\n経営資源配分計画策定：具体的にどのプロジェクト、セクションにどれだけの資源を配分するか決定する。\n予算編成：各種の課題別実行計画を、各管理責任単位の管理者が責任を負えるような形の収益や費用に置き換えるプロセスである。\n実績分析・業績評価・報告：業績をプロジェクト別、管理責任単位別に記録集計し、予算との差異を分析することにより、業績評価や行動修正のための資料として活用する。\n■出典：グロービス マネジメントブック 改訂3版\n20．マネジメント・コントロール P.130-131","source":"Word: GMAP道場2026春 (1)(1).docx","no":406,"idx":406},{"id":"docx-2026春-アカウンティング-ed7764fd","season":"2026春","subject":"アカウンティング","scope":"19. 原価計算","question":"2026年4月24日（金）＜アカウンティング＞\n出題範囲：19. 原価計算\n　\n■問19.X社は単一製品を製造している。202X年の予算は次の通りである時、次のA～Cの問いに答えよ。（X社は全部原価計算を採用しているものとする。また、計算式の答えは小数点第二位を四捨五入してください）\n　\n202X年\n予定生産量　　　　：10,000個\n変動費合計　　　　：3,000,000円\n固定費合計　　　　：2,000,000円\n　\nA.　予定生産量が予定通り10,000個であった場合の1個あたりの製造原価を求めよ\nB.　予定生産量が20,000個に増えた場合の1個あたりの固定費を求めよ\nC.　予定生産量が20,000個に増えた場合の1個あたりの製造原価を求めよ","answer":"■正解：\nA.　500円/個\nB.　100円/個\nC.　400円/個\n　\n■解説：\nA：1個あたりの変動費は、変動費合計(3,000,000)÷予定生産量(10,0000)＝300円/個。1個あたりの固定費は、固定費合計(2,000,000)÷予定生産量(10,000)＝200円/個。よって、1個あたりの製造原価は、300円/個＋200円/個＝500円/個となる。\nB：予定生産量が20,000個の時の固定費は、固定費合計(2,000,000)÷予定生産量(20,000)＝100円/個となる。\nC：予定生産量が20,000個の時の1個あたりの製造原価は、1個あたりの変動費が変わらないため、300円/個+100円/個＝400円/個となる。\nこのように「全部原価計算」では、生産量の増加に伴って製品単位当たりの原価が下がる傾向がある。\n　\n■出典：グロービス マネジメントブック 改訂3版\n19．原価計算P.128-129","source":"Word: GMAP道場2026春 (1)(1).docx","no":407,"idx":407},{"id":"docx-2026春-組織行動-0dd4e97a","season":"2026春","subject":"組織行動","scope":"20. 組織学習　P. 220-221","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲： 20. 組織学習　P. 220-221\n■問24.下記文章中の（①）から（⑤）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n「学習する組織」の特徴は次の通りだ。\n過去の（①）や戦略の枠に思考や行動を縛られることなく、変化に対応し、（②）していく機能を備えている。\nすべての構成員が（③）と（④）を持ち、現在の環境に適応する強さと将来の変化に対応する（⑤）を理解し実践する。つまり、組織全体が学習する能力を備えている。\nここでいう「学習」とは単に知識を習得することに留まらず、思考や行動のパターンを変えていくことを指す。\nA. ①組織文化　②自己改革　③自律性　④協調性　⑤柔軟性\nB. ①外部環境　②エンパワーメント　③リーダーシップ　④適応能力　⑤可能性\nC. ①企業風土　②自己改革　③リーダーシップ　④協調性　⑤可能性\nD. ①内部環境　②エンパワーメント　③自律性　④適応能力　⑤柔軟性","answer":"■正解：A\n \n■解説：\n「学習する組織」の特徴について答えてください。\n過去の組織文化や戦略の枠に思考や行動を縛られることなく、変化に対応し、自己改革していく機能を備えている。\nすべての構成員が自律性と協調性を持ち、現在の環境に適応する強さと将来の変化に対応する柔軟性を理解し実践する。つまり、組織全体が学習する能力を備えている。\nここでいう「学習」とは単に知識を習得することに留まらず、思考や行動のパターンを変えていくことを指す。\n■出典：グロービス マネジメントブック 改訂3版\n組織学習　P. 220-221","source":"Word: GMAP道場2026春 (1)(1).docx","no":408,"idx":408},{"id":"docx-2026春-組織行動-a3df8238","season":"2026春","subject":"組織行動","scope":"7. モチベーションとインセンティブ","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲：7. モチベーションとインセンティブ\n \n■問23.モチベーションとインセンティブに関する記述として、正しいものを全て選べ。\n \nA.代表的なインセンティブとして、金銭的報奨、社会的評価、自己実現の場の提供などがある。\nB.金銭的報奨は具体的・定量的でわかりやすく、不足すれば不満の原因となり、充足すればした分だけモチベーションを高める効果がある。\nC.魅力あるリーダや気心の知れた仲間などの社会的関係も、個人の安心感や余裕を生み、組織への帰属意識やコミットメントを引き出す。\nD.モチベーションの代表的な例として社会的動機があるが、これは「生活に必要な金銭を得たい」という最も一般的・根本的なものである。","answer":"■正解：AとC\n  \n■解説：\nB.金銭的報奨はあるレベルを超えるとモチベーションを高める効果が薄れる傾向もある。\nD.問題文は金銭的動機を示しており、社会的動機とは「一定の価値観を共有できる集団（組織）の中で社会生活を営み、その中で注目や評価を受けたり、権力を得たい」という欲求から生じる。\n■出典：グロービス マネジメントブック 改訂3版\n7.モチベーションとインセンティブ p.194-195","source":"Word: GMAP道場2026春 (1)(1).docx","no":409,"idx":409},{"id":"docx-2026春-組織行動-922847d8","season":"2026春","subject":"組織行動","scope":"8. 集団のメカニズム","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲：8. 集団のメカニズム\n \n■問22. 以下は集団のメカニズムについて述べたものである。空欄(1)〜(6)にあてはまるものを選択肢A〜Fからそれぞれ選んでください。\n集団における意思決定\n一般に、集団における意思決定は個人で行う意思決定より優れている。それは、多様な意見や情報を収集できたり、決定内容がより多くの人に受け入れられる可能性が高いからだ。\n一方、集団ゆえに陥りやすい問題もある。その1つである「（1）」は、合意に至ろうとするプレッシャーから、集団において物事を多様な視点から批判的に評価する能力が欠落する傾向である。とくに集団の「（2）」が高い場合や、外部と隔絶している場合、支配的なリーダーが存在する場合などに起きやすい。グループシンクを避けるためには、異なった意見を十分に受け入れ、「（3）」を重視し、選択肢の分析に時間をかけるなどの配慮が必要だ。\n公式集団（フォーマル・グループ）と非公式集団（インフォーマル・グループ）\n企業には通常、公式集団と非公式集団が存在する。企業が公式に形成する「（4）」では、達成すべき目標と職務や役割が組織によって明確に定められる。一方、非公式集団は自然発生的に形成されるもので、多くの場合、「（5）」に基づいている。\nそこには、組織によって公式に定められた目標や役割はなく、集団構成員間の非公式な交流の中で共有された共通の利害や関心が存在する。非公式集団における人間関係や交流は、公式集団における行動や「（6）」に影響を及ぼす。\nA. 業績\nB. 建設的な批判\nC. 公式集団\nD. グループシンク\nE. 個人的な人間関係\nF. 凝集性","answer":"■正解：\n（1） D（グループシンク）\n（2） F（凝集性）\n（3） B（建設的な批判）\n（4） C（公式集団）\n（5） E（個人的な人間関係）\n（6） A（業績）\n■解説：\n複数の人が集まって形成される集団（グループ）の「行動」と「その基本原理」は、個人のそれとは異なる。組織の目標を実現するために、規範、役割、地位、規模、多様性、凝集性などの集団の特徴を理解する必要がある。\n■出典：グロービス マネジメントブック 改訂3版\n集団のメカニズム  P.196-197","source":"Word: GMAP道場2026春 (1)(1).docx","no":410,"idx":410},{"id":"docx-2026春-組織行動-f380ea89","season":"2026春","subject":"組織行動","scope":"6. パワー","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲：6. パワー\n \n■問21.下記A～Dの選択肢のうち、パワーの源泉についての説明として正しいものを選んでください。\nA. 強制力：相手にとって励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、インセンティブなどが該当する。\nB. 報酬力：受け手に対し影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する。\nC. 正統権力：受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。\nD. 同一視力：受け手にとって魅力のある人物、理想像であること。たとえば、業務経験、実績などが要素となりうる。","answer":"■正解：D\n \n■解説：\nパワーは5つの源泉で構成される。\nA.強制力は、受け手にとって苦痛になるものを与えることで、影響を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する\nB.報酬力は、受け手にとって励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、インセンティブなどが該当する\nC.正統権力は、受け手に対し影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する\nD.同一視力に関する正解\nこのほか、専門力は、受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。\n■出典：グロービス マネジメントブック 改訂3版\n６．パワー　 P192-193","source":"Word: GMAP道場2026春 (1)(1).docx","no":411,"idx":411},{"id":"docx-2026春-組織行動-692d8260","season":"2026春","subject":"組織行動","scope":"9. チーム・マネジメント","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲：9. チーム・マネジメント\n \n■問20.集団の特徴をその形成プロセスに沿ってとらえておくと、新たにチームを結成し、発展させていく際に役立つ。集団の発展は5つの段階に分けることができる。\n以下の5つの段階の説明として誤っているものをすべて選んでください。\n \nA．形成期：構成員が規範を作り出す段階。集団の目的・各自の役割を明確にし共有する。\nB．激動期：議論・緊張・衝突が生まれる段階。構成員間での考え方や主張がぶつかり、集団内での自分の役割や地位についてイメージを形づくっていく。\nC．規範形成期：集団結成が明示され、構成員が顔合わせする段階。人が集まっただけで、集団の機能もなく、目的や規範も共有されていない。\nD．実現期：特定の目的を持った集団として構成員が統合され、集団が機能する段階。マネジメントの巧拙によっては、このステップに至らないまま解散することもある。\nE．終了期：集団目的の達成や目的の分化などの理由によって集団が解散する段階。","answer":"■正解：AとC\n \n■解説：\nAの説明とCの説明が真逆になっている。\n正しくは、\nA．形成期：集団結成が明示され、構成員が顔合わせする段階。人が集まっただけで、集団の機能もなく、目的や規範も共有されていない。\nC．規範形成期：構成員が規範を作り出す段階。集団の目的・各自の役割を明確にし共有する。\n■出典：グロービス マネジメントブック 改訂3版\n9．チーム・マネジメントP.198-199","source":"Word: GMAP道場2026春 (1)(1).docx","no":412,"idx":412},{"id":"docx-2026春-組織行動-6cac6468","season":"2026春","subject":"組織行動","scope":"11.コンフリクト","question":"2026年4月23日（木）＜組織行動学＞\n出題範囲：11.コンフリクト\n■問19.下記文章中の（①）から（④）に入る語句の組み合わせとして適切なものを選択肢AからDのうちから選んでください。\n<コンフリクトが個人および組織に及ぼしている効果>\nコンフリクトにはプラスの効果もマイナスの効果もある。対策を打つ前に、①の効果がより強く表れているかを分析する。\n　\n<コンフリクトのパターン>\nコンフリクトの最初の②に対して、どのような対応を示し、そこからどのようにコンフリクトが深まったのかというパターンをつかむ。これにより、コンフリクトの根本原因と対処の糸口が見えてくることが多い。\nまた、当事者がどのように③を表現しているかも重要だ。コンフリクトは必ずしも④に表現されるとは限らない。表面化していないコンフリクトを発見するほうが困難かつ重要である場合が多い。\nA. ①どちら　　②きっかけとなる行動　③相違点　④直接的\nB. ①マイナス　②きっかけとなる行動　③不満　　④攻撃的\nC. ①プラス　　②不満　　　　　　　　③問題　　④直接的\nD. ①マイナス　②不満　　　　　　　　③相違点　④攻撃的","answer":"■正解：A\n■解説：\n<コンフリクトが個人および組織に及ぼしている効果>\nコンフリクトにはプラスの効果もマイナスの効果もある。対策を打つ前に、どちらの効果がより強く表れているかを分析する。\n　\n<コンフリクトのパターン>\nコンフリクトの最初のきっかけとなる行動に対して、どのような対応を示し、そこからどのようにコンフリクトが深まったのかというパターンをつかむ。これにより、コンフリクトの根本原因と対処の糸口が見えてくることが多い。\nまた、当事者がどのように相違点を表現しているかも重要だ。コンフリクトは必ずしも直接的に表現されるとは限らない。表面化していないコンフリクトを発見するほうが困難かつ重要である場合が多い。\n　\n■出典：グロービス マネジメントブック 改訂3版\n11.コンフリクトP.202-203","source":"Word: GMAP道場2026春 (1)(1).docx","no":413,"idx":413},{"id":"docx-2026春-人的資源管理-ab2717f0","season":"2026春","subject":"人的資源管理","scope":"22.メンタルヘルス","question":"#GMAP2026S_HRM\n2026年4月22日（水）＜人的資源管理＞\n出題範囲：22.メンタルヘルス\n■問24.次の文章中の(①)～(④)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n・現代は、予想もしない急激な変化が常態化しているハイパー・チェンジの時代であり、こうした時代には、社員の疲労、うつ状態、感情障害などが増加し、多大な(①)を引き起こしかねない。従業員のメンタルな健康に十分な配慮をすることで、組織の(②)を高く維持することが求められている。\n・1980年代以降、だれもがストレス性疾患のリスクにさらされるようになり、社内に(③)を常駐させる企業が増えた。\n・あらゆるメンタル不調を医学の領域に押し込め、医学的に対応しようとするアプローチに対する反省から生まれたのが、適応アプローチだ。このアプローチで重要なのは、職場において対応可能なケースをしっかり見極め、(④)、人的資源管理の両面から適切な対策を打つということだ。\nA：①人件費増大　②評判　③保健師　④心理学\nB：①経済的損失　②生産性　③産業医　④組織行動学\nC：①人件費増大　②生産性　③産業医　④心理学\nD：①経済的損失　②評判　③保健師　④組織行動学","answer":"■正解：B\n①経済的損失　②生産性　③産業医　④組織行動学\n■解説：\n・現代は、予想もしない急激な変化が常態化しているハイパー・チェンジの時代であり、こうした時代には、社員の疲労、うつ状態、感情障害などが増加し、多大な経済的損失を引き起こしかねない。従業員のメンタルな健康に十分な配慮をすることで、組織の生産性を高く維持することが求められている。\n・適応アプローチで重要なのは、組織行動学、人的資源管理の両面から適切な対策を打つということだ。組織行動学的なものとしては、カウンセリング・マインドを持ち、部下の話にしっかり耳を傾けるなどがある。人的資源管理に関連する打ち手としては、研修や、評価の際に部下に対して納得性の高いフィードバックを行ったり、能力開発のヒントを適切に提示することなどがある。\n■出典：グロービス マネジメントブック 改訂3版\nメンタルヘルスP.224-225","source":"Word: GMAP道場2026春 (1)(1).docx","no":414,"idx":414},{"id":"docx-2026春-人的資源管理-ce4d89ea","season":"2026春","subject":"人的資源管理","scope":"21.ワーク・ライフ・バランス","question":"おはようございます。2025期ETKY-Cのなおみんです。私からの問題もこちらで3問目。みなさん、そろそろ「なおみん＝イチゴ」が刷り込まれましたか？さて、イチゴ大好きな私から、出題です。\n　\n#GMAP2026S_HRM\n2026年4月22日（水）＜人的資源管理＞\n出題範囲：21.ワーク・ライフ・バランス\n　\n■問23.ワーク・ライフ・バランスの説明のなかで、誤っているものを選択してください。\n　\nA.近年、副業や兼業などを積極的に支援する企業も増えているが、そうした活動を加速するためにも、ワーク・ライフ・バランスは重要である。\n　\nB.多くの組織ではフレックスタイムでの勤務、在宅での勤務、弾力的な休職制度、退職した社員の再雇用、パートタイム労働の多様化など、多様かつ柔軟な働き方ができるような制度を設け始めている。\n　\nC.人間は、組織の構成員である以前にひとつの人格であり、組織で働くことは生活の一部にすぎない。家族や地域社会、学校の同窓会などの組織や社会において一定の役割を担うことを期待されているし、また貢献したいと望んでいる。\n　\nD.マネジメントにおいて、従業員が組織における役割とそれ以外の社会における役割をメリハリをもって担えるようサポートすることが求められる。それは長い目でみればCSRを果たすことにもつながり、人材獲得の競争力や企業業績にもつながっていく。","answer":"■正解：A\n　\n■解説：\nA.誤り\nB.正しい\nC.正しい\nD.正しい\n　\nAの内容が誤っており、正しくは以下の通り。\n　\n近年、ボランティア活動などを積極的に支援する企業も増えているが、そうした活動を加速するためにも、ワーク・ライフ・バランスは重要です。\n日々の生活が充実していなければ、従業員もボランティア活動に取り組もうなどとは考えないためです。\n■出典：グロービス マネジメントブック 改訂3版\n21.ワーク・ライフ・バランス P.222-223","source":"Word: GMAP道場2026春 (1)(1).docx","no":415,"idx":415},{"id":"docx-2026春-人的資源管理-bcb6ee3e","season":"2026春","subject":"人的資源管理","scope":"18. 能力開発","question":"2026年4月22日（水）＜人的資源管理＞\n出題範囲：18. 能力開発\n　\n■問22.能力開発は「コスト」ではなく、企業の競争優位の源泉となる知識を生み出す人に対する「戦略的な投資」としてとらえることが重要だ。こうした視点を持ち、持続的に好調な業績を上げている企業に見られる特徴について正しいものを選択してください。\n　\nA.経営者自身が自分のミッションとして能力開発に積極的に関与していない。\nB.継続的な能力開発の仕組みを作り上げることを意識し、短期での静態的な計画に基づいて育成を進めている。\nC.変化に追従するための最新知識（フロー）を得ることではなく、変化そのものの意味合いをとらえ、進むべき方向を自ら考える自律的な思考力（ストック）を開発することに投資をしている。","answer":"■正解：C\n　\n■解説：\nA：経営者自身が自分のミッションとして能力開発に積極的に関与している。\nB：継続的な能力開発の仕組みをつくり上げることを意識し、短期から中長期にかけての動態的な計画に基づいて育成を進めている。\n　\n■出典：グロービス マネジメントブック 改訂3版\n18.能力開発 P.216-217","source":"Word: GMAP道場2026春 (1)(1).docx","no":416,"idx":416},{"id":"docx-2026春-人的資源管理-4cd2a671","season":"2026春","subject":"人的資源管理","scope":"17. 評価","question":"2026年4月22日（水）＜人的資源管理＞\n出題範囲：17. 評価\n■問21. 評価に関する留意事項について、最も適切なものを選択してください。\nA.評価を誤らせる原因を完全に取り除くことは容易であるため、評価者が陥りがちな傾向を認識する必要はあまりない。\nB.特定の項目についての評価が総合的な評価に影響を与える傾向を「中心化傾向」という。\nC.ハロー（後光）効果とは、際立って高い評価を受けた項目があった場合、その評価に引っ張られて、他の項目についても優れていると判断してしまうことなどを指す。\nD.従業員の評価を5段階で行うと、自然と最高の「5」や最低の「1」に評価が集中する傾向があり、これを中心化傾向と呼ぶ。","answer":"■正解：C\n■解説：\n・Aは誤りです。評価を誤らせる原因を完全に取り除くことは難しいため、評価者が陥りがちな傾向を認識し誤差や偏りを減らすことが重要です。\n・Bは誤りです。これは「ハロー（後光）効果」の説明です。\n・Dは誤りです。中心化傾向とは、潜在的に最高の評価や最低の評価をつけることを避け、3や4に評価が集中する傾向のことです。\n■出典：グロービス マネジメントブック 改訂3版\n17．評価 P.214-215","source":"Word: GMAP道場2026春 (1)(1).docx","no":417,"idx":417},{"id":"docx-2026春-人的資源管理-6e4314ae","season":"2026春","subject":"人的資源管理","scope":"16.報奨","question":"#GMAP2026S_HRM\n2026年4月22日（水）＜人的資源管理＞\n出題範囲：16.報奨\n■問20 報奨に関する説明のなかで、誤っているものを選択してください。\nA.報奨はインセンティブの１つで、従業員の企業への貢献の対価である。従業員のモチベーションを高めるためには、公平で、だれもが納得できるような評価方法を用いることが不可欠である。\nB.報奨は、「報奨基準」「報奨項目」「報奨水準」の３つの基本的な要素に分けて考えるとわかりやすい。\nC.報奨項目の種類として、代表的な項目には「基本給と手当」「インセンティブ・システム」「福利厚生（フリンジ・ベネフィット）」がある。\nD.インセンティブ・システムの例として、一定の基準に従って利益を配分するプロフィット・シェアリングや、自社株式を購入する権利を与える持株会などがある。\nE.福利厚生には、「その企業に所属していることによって得られる特典」のすべてが該当する。具体的には、退職金や年金積立、財形貯蓄、優遇ローン、健康保険、社宅／独身寮、各種施設の法人割引などがある。","answer":"■正解：D\n■解説\n• A　正しい\n• B　正しい\n• C　正しい\n• D　誤り\n正しくは、インセンティブ・システムの例として、一定の基準に従って利益を配分するプロフィット・シェアリングや、自社株式を購入する権利を与える【ストック・オプション】などがある。\n• E　正しい\n■出典：グロービス マネジメントブック 改訂3版 　\n16.報奨 P.212-213","source":"Word: GMAP道場2026春 (1)(1).docx","no":418,"idx":418},{"id":"docx-2026春-人的資源管理-48bd5786","season":"2026春","subject":"人的資源管理","scope":"15. 人員配置","question":"2026年4月22日（水）＜人的資源管理＞\n出題範囲：15. 人員配置\n■問19.人員配置において人員不足分を埋めるための調達方法として、人材を組織の外部から調達する採用(外部調達)と内部から調達する異動・昇進(内部調達)が挙げられます。外部調達と内部調達に関する事項で、正しいものを全て選んでください。\nA.内部調達は金銭的コストが不要であるのに対し、外部調達は、社内の採用担当者の人件費に加え、人材紹介会社など外部サービスを利用すると実質的な支払いが生じる。\nB.内部に適当な人材がいない場合、組織内で育成するよりも外部から人材を採用する方が、通常は短期間で調達できる。\nC.内部調達のほうがあらかじめ得られる情報が豊富なので、その人材が求める要件を満たしているかどうかを評価しやすい。\nD.新しい人材が組織に参加した結果、他の従業員モチベーションが向上したり、組織間のセクショナリズムやマンネリズムの打破、組織の活性化につながる場合がある。","answer":"■正解：B、C、D\n■解説：\nA：誤り\nB：正しい\nC：正しい\nD：正しい\nAは前半の内部調達に関する記述が誤りです。内部調達は金銭的コストが不要に見えますが、実際にはその人材が現在のスキルや経験などを身につけるまでに、能力開発などの金銭的コストが発生しています。外部調達に関する記述は正しいです。\n■出典：グロービス マネジメントブック 改訂3版\n15.人員配置 P.210-211","source":"Word: GMAP道場2026春 (1)(1).docx","no":419,"idx":419},{"id":"docx-2026春-経営戦略-f822d740","season":"2026春","subject":"経営戦略","scope":"4.全社戦略の構成要素(1)：ドメイン","question":"2026年4月21日（火）＜経営戦略＞\n出題範囲：4.全社戦略の構成要素(1)：ドメイン\n　\n■問24.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\nドメインを決めるときには、製品やサービスを基準とする（①）から定義したり、市場ニーズを基準とする（②）から定義したりする方法がある。また近年は、自社の競争優位の源泉となる（③）を軸にドメインを定める企業もある。\nA. ①事業軸　②顧客軸　③ブランド力\nB. ①市場軸　②製品軸　③経営理念\nC. ①製品軸　②市場軸　③コア・コンピタンス\nD. ①製造軸　②販売軸　③資源配分","answer":"■正解：C\n　\n■解説：\nドメインを決めるときには、製品やサービス（製品軸）から定義したり、市場ニーズ（市場軸）から定義したりする方法がある。製品やサービスからの定義とは、自社の持つ製品の優位性や特徴などを最も効果的に発揮できる領域を選んで、事業展開を図っていくやり方だ。また近年は、自社の競争優位の源泉となるコア・コンピタンスを軸にドメインを定める企業もある。ドメインを決めるときのポイントは、自社の強みを十分に発揮できるかどうかだ。\n　\n■出典：グロービス マネジメントブック 改訂3版\n4.全社戦略の構成要素(1)：ドメイン P.8-9","source":"Word: GMAP道場2026春 (1)(1).docx","no":420,"idx":420},{"id":"docx-2026春-経営戦略-d7baf2e2","season":"2026春","subject":"経営戦略","scope":"1. 経営戦略の意義と企業の目的","question":"2026年4月21日（火）＜経営戦略＞\n出題範囲：1. 経営戦略の意義と企業の目的\n■問23.下記（①）～（④）の空欄に入る語句の組み合わせとして正しいのは、選択肢A～Dのどれですか。\n　\n戦略は「企業あるいは事業の目的を達成するために、持続的な（①）を確立すべく構造化されたアクションプラン」と定義される。\n　\n戦略を策定する場合は、環境変化や競合企業の動きに対して、自社に最も有利となり、かつ（①）を持続できる道筋を選択する。このとき、単発の対応ではなく（②）として機能すること、実行可能な施策であることも重要だ。\n　\nトップマネジメントには、企業の目指す（③）の提示、その実現に向けて（④）を巻き込む力、過去の成功体験にとらわれずに変化を受け入れる度量の広さなどが求められる。\n　\n　\nA. ①シェア　　②慣習　　③方向性やビジョン　④従業員\nB. ①競争優位　②仕組み　③方向性やビジョン　④ステークホルダー\nC. ①シェア　　②仕組み　③損益目標　　　　　④取引先\nD. ①競争優位　②慣習　　③損益目標　　　　　④株主","answer":"■正解：B\n■解説：\n戦略にはさまざまな定義があるが、グロービス マネジメントブック 改訂3版では、戦略を「企業あるいは事業の目的を達成するために、持続的な（①競争優位）を確立すべく構造化されたアクションプラン」と定義する。\n　\n戦略を策定する場合は、環境変化や競合企業の動きに対して、自社に最も有利となり、かつ（①競争優位）を持続できる道筋を選択する。このとき、単発の対応ではなく（②仕組み）として機能すること、実行可能な施策であることも重要だ。\n　\nトップマネジメントには、企業の目指す（③方向性やビジョン）の提示、その実現に向けて（④ステークホルダー）を巻き込む力、過去の成功体験にとらわれずに変化を受け入れる度量の広さなどが求められる。\n　\n　 \n■出典：グロービス マネジメントブック 改訂3版\n1.経営戦略の意義と企業の目的  P.2-3","source":"Word: GMAP道場2026春 (1)(1).docx","no":421,"idx":421},{"id":"docx-2026春-経営戦略-1c79bad3","season":"2026春","subject":"経営戦略","scope":"22. 社会起業家","question":"#GMAP2026S_STR\n2026年4月21日（火）＜経営戦略＞\n出題範囲：22. 社会起業家\n■問22.社会起業家の特徴として正しいものを全て選んでください。\nA.利益を目的とせず、医療や教育、貧困撲滅などの分野を中心にボランティア活動を行う起業家を指す。\nB.社会起業家は、医療や教育などに関する問題解決を政府に任せるのではなく、コミュニティの中で解決していこうという機運の高まりの中で広がった。\nC.有名な社会起業家の例として、フェアトレードがある。\nD.日本では公的な活動で利益の追求を軽視する傾向があるが、行政からのサポートに頼ることなくビジネスとして成立させることで、社会変革を効果的に促すことが求められている。","answer":"■正解：BとC\n■解説：\nA：当初、こうした活動はボランティアやNPOの形で行われることが多かったが、徐々に組織化・効率化が進み、ビジネス化したプレイヤーが優位になっていった。\nB：正しい。\nC：正しい。途上国の中でもさらに立場の弱い、農村部の女性や小規模農家、スラムに住む人々などを支援している。製品デザインのアイデアの提供、品質向上研修のための資金援助、売り手にとって有利な取引条件の提供などを行っている。\nD：行政の立場からも、社会起業家を積極的に支援し、彼らのエネルギーを活用することで、社会変革を効果的に促すことができるものとして注目されている。\n■出典：グロービス マネジメントブック 改訂3版 　\n22．社会起業家 P.44-45","source":"Word: GMAP道場2026春 (1)(1).docx","no":422,"idx":422},{"id":"docx-2026春-経営戦略-b33790bb","season":"2026春","subject":"経営戦略","scope":"21.CSR","question":"2026年4月21日（火）＜経営戦略＞\n出題範囲：21.CSR\n■問21.　空欄に入る言葉を以下の選択肢から選んで答えなさい。\nもともと企業（とくに大企業）は公器としての性格が強く、社会に価値を(1)するのは自然な考え方と言える。しかし、20世紀におけるその方法は、(2)の提供、(3)、(4)の提供などに偏っていた。\n企業活動に邁進することが社会に価値を(1)することにつながると考えられていたとも言える。\nしかし、とくに 1990年代以降、少なくとも先進国においてはこうした単純な考え方は通用しなくなった。\n生活が豊かになるにつれ、利益や経済成長という「(5)」だけがよければ手段がすべて正当化されるわけではなくなってきたのだ。また、1980年代以降、とくに欧州を中心に、酸性雨や温暖化対策など、「(6)」を社会全体として真剣に考えなくてはならないという意識が強まってきた。こうした責務をしっかり果たす企業こそが社会から尊敬を受け、持続的に成長すると考えられるようになっているのである。\n選択肢：\na商品・サービス\nb成長\nc休暇\nd雇用\ne納税\nf福利厚生\ng原因\nh結果\ni提供\nj還元\nk過去の清算をどうするのか\nl現在をいかによくするか\nm未来に何を残せるか","answer":"■正解：(1)-j (2)-a (3)-e (4)-d (5)-h (6)-m\n■解説：\nもともと企業（とくに大企業）は公器としての性格が強く、社会に価値を還元するのは自然な考え方と言える。しかし、20世紀におけるその方法は、商品・サービスの提供、納税、雇用の提供などに偏っていた。\n企業活動に邁進することが社会に価値を還元することにつながると考えられていたとも言える。\nしかし、とくに 1990年代以降、少なくとも先進国においてはこうした単純な考え方は通用しなくなった。\n生活が豊かになるにつれ、利益や経済成長という「結果」だけがよければ手段がすべて正当化されるわけではなくなってきたのだ。また、1980年代以降、とくに欧州を中心に、酸性雨や温暖化対策など、「未来に何を残せるか」を社会全体として真剣に考えなくてはならないという意識が強まってきた。こうした責務をしっかり果たす企業こそが社会から尊敬を受け、持続的に成長すると考えられるようになっているのである。\n■出典：グロービス マネジメントブック 改訂3版\n21.CSR  P.42-43","source":"Word: GMAP道場2026春 (1)(1).docx","no":423,"idx":423},{"id":"docx-2026春-経営戦略-e241c367","season":"2026春","subject":"経営戦略","scope":"20.グローバル化と規格競争","question":"2026年4月21日（火）＜経営戦略＞\n出題範囲：20.グローバル化と規格競争\n　\n■問20.グローバル展開の方法と、従来とは異なる競争ルールが働くデファクト・スタンダードをめぐる競争（規格競争）について、誤っているものを選択してください。\n　\nA. 企業がグローバル展開を志向する理由は大きく分けて2つある。第1は利益拡大による成長機会を追求すること。第2は低コストあるいは差別化を実現し、競合他社に対して競争優位を構築することである。\nB.グローバル展開を進める場合、生産展開パターンは３つある。第1は国内と地域、地域と地域とのR&Dや生産などの機能を統合し、現地市場への適合性を重視するパターン。第2は本社の指揮下で集中管理した生産を行うパターン。第3は第1と第2との折衷パターンである。\nC.デファクト・スタンダードをめぐる競争には、従来の常識とは異なり、技術的優位性はなくても、自社技術をスタンダードとして認めてもらえた企業が市場を制する場合がある。\nD.規格競争においても競争上の地位に応じた戦略の定石がかならず当てはまる。例えば、リーダーの同質化戦略は有効であると言える。","answer":"福井の水ようかんは見た目も全国的なものと少し違います。機会があれば食べてみてください。\n　\n■正解：D\n　\n■解説：\nA：正しい\nB：正しい\nC：正しい\nD：規格競争においては競争上の地位に応じた戦略の定石が該当しない場合があります。例えば、リーダーの同質化戦略は有効ではありません。\n 　\n　\n■出典：グロービス マネジメントブック 改訂3版\n20.グローバル化と規格競争 P.40-41","source":"Word: GMAP道場2026春 (1)(1).docx","no":424,"idx":424},{"id":"docx-2026春-経営戦略-2f03e0c7","season":"2026春","subject":"経営戦略","scope":"19.バリューチェーンの再構築","question":"2026年4月21日（火）＜経営戦略＞\n出題範囲：19.バリューチェーンの再構築\n \n■問19. イノベーションの影響で企業活動における付加価値構造が破壊され、新しいビジネスシステムへとつくり直されることにより、これまで当然と見なされていた事業の定義やルールが根本的に変わることを、バリューチェーンの再構築と呼ぶ。バリューチェーンの再構築は、パソコンやインターネットの普及、デジタル技術の高性能化・低コスト化をはじめとする近年の情報化の進展により、こうした動きが加速している。たとえば、技術変化によりバリューチェーン全体の中で生産コストの重要性が低下すれば、コスト競争力で業界をリードしていた有力企業が優位性を失い、収益性の悪化に苦しむことになる。こうした事態を避けるためには、変化を先取りし、新たな戦略を打ち出さなくてはならない。それには、自社の事業がバリューチェーンの再構築の影響を受けるかどうかを把握し、新たな可能性を探る必要がある。そのためのチェックリストとして、コンサルティング会社のBCGは以下に掲げる5つの問いかけが有効だとしている。\n \n下記のBCGの５つの問いかけの中で合っているものの番号をすべて上げてください。\n \n①  バリューチェーン全体の中でコストの割に価値の高い部分はどこか。\n② バリューチェーン全体の中で自社事業は顧客とどのような関係にあるか。\n③ 自社の事業でネットワーク化の影響を受けるのはどこか。\n④ バリューチェーンが変わることで、現在の資産のうち重荷となるものはどれか。\n⑤ 新しいバリューチェーンではどのような新しい活動・能力が必要となるか。","answer":"■正解：②・③・⑤\n \n■解説：\n① バリューチェーン全体の中でコストの割に価値の高い部分はどこか。（正解　価値の低い部分はどこか）\n②\t バリューチェーン全体の中で自社事業は顧客とどのような関係にあるか。\n③\t自社の事業でネットワーク化の影響を受けるのはどこか。\n④\t バリューチェーンが変わることで、現在の資産のうち重荷となるものはどれか。\n（正解　現在の戦略的資産のうち）\n⑤ 新しいバリューチェーンではどのような新しい活動・能力が必要となるか。\n■出典：グロービス マネジメントブック 改訂3版\n19．バリューチェーンの再構築　P.38-39","source":"Word: GMAP道場2026春 (1)(1).docx","no":425,"idx":425},{"id":"docx-2026春-マーケティング-e244cfe7","season":"2026春","subject":"マーケティング","scope":"2.マーケティングの役割","question":"2026年4月20日（月）＜マーケティング＞\n出題範囲：2.マーケティングの役割\n \n■問23.マーケティング戦略は、全社レベル、事業レベル、製品レベルの各視点で考えなくてはならない。それぞれの記述について、誤っているものを1つ選択して下さい。\n \n①全社レベル：全社的視点に立って方針を決定したり、シナジーなどを考慮して事業部間の調整を図る必要がある。さらに、コーポレート・ブランドの育成や管理なども全社的な観点から考えなければならない。\n②事業レベル：セグメンテーションやターゲティング、ポジショニング、マーケティング・ミックスなどのマーケティング戦略の根幹を担っている。製品間の調整を図るときにも、事業レベルの視点が必要である。\n③製品レベル：扱っている製品について「だれに何をいくらで売るか。それをどのように認知させ、どのように供給するか」をトータルで考えていく。個々の製品ベースで最適なマーケティング戦略を考えれば良い。","answer":"■正解：③が誤り\n  \n■解説：\n正しくは、\n【③製品レベル：扱っている製品について「だれに何をいくらで売るか。それをどのように認知させ、どのように供給するか」をトータルで考えていく。個々の製品ベースで最適なマーケティング戦略を考えていると、機能の重複などの無駄が生じたり、製品間や事業間の整合性がとれなくなったりする。】\nとなります。全社的視点に立って方針を決定したり、シナジーなどを考慮して事業部間の調整を図る必要があります。\n  \n■出典：グロービス マネジメントブック 改訂3版\n2.マーケティングの役割 P.50-51","source":"Word: GMAP道場2026春 (1)(1).docx","no":426,"idx":426},{"id":"docx-2026春-マーケティング-1f02fc12","season":"2026春","subject":"マーケティング","scope":"1. マーケティングの発想","question":"2026年4月20日（月）＜マーケティング＞\n出題範囲：1. マーケティングの発想\n \n■問22.下記文章中の（①）～（④）に入る語句の組み合わせとして適切なものを選択肢　AからDのうちから選んでください。\n \n・マーケティングではなぜ（①）を軸に考えなくてはならないのか。それは企業が（②）に成長するには、企業に収益をもたらす顧客の創造と維持が欠かせないからだ。\n・顧客を引きつけるためには、顧客ニーズを満たす製品を生み出し、常に（①）を高める努力が必要である。\n・顧客の欲求を表す概念として「（③）」と「（④）」がある。（③）とは、衣食住などの生理的なことから社会的、文化的、個人的なことに至るさまざまな事柄に対して人間が感じる「満たされない状態」のことだ。これに対して（④）は、（③）を満たすために製品化されたものを求める感情、つまり「具体的な製品やサービスへの欲求」のことである。\nA. ①営業活動　②単発的　③ウォンツ　④ニーズ\nB. ①市場調査　②継続的　③ニーズ　④ウォンツ\nC. ①顧客満足　②継続的　③ニーズ　④ウォンツ\nD. ①顧客満足　②単発的　③ウォンツ　④ニーズ","answer":"■正解：C\n \n■解説：\n・マーケティングではなぜ顧客満足を軸に考えなくてはならないのか。それは企業が継続的に成長するには、企業に収益をもたらす顧客の創造と維持が欠かせないからだ。\n・顧客を引きつけるためには、顧客ニーズを満たす製品を生み出し、常に顧客満足を高める努力が必要である。\n・顧客の欲求を表す概念として「ニーズ」と「ウォンツ」がある。ニーズとは、衣食住などの生理的なことから社会的、文化的、個人的なことに至るさまざまな事柄に対して人間が感じる「満たされない状態」のことだ。これに対してウォンツは、ニーズを満たすために製品化されたものを求める感情、つまり「具体的な製品やサービスへの欲求」のことである。\n■出典：グロービス マネジメントブック 改訂3版\n1．マーケティングの発想 P.48-49","source":"Word: GMAP道場2026春 (1)(1).docx","no":427,"idx":427},{"id":"docx-2026春-マーケティング-84802f7b","season":"2026春","subject":"マーケティング","scope":"21.レピュテーション","question":"2026年4月20日（月）＜マーケティング＞\n出題範囲：21.レピュテーション\n 　\n■問21.レピュテーション・マネジメントの必要性に関する説明として、誤っているものを1つ選びなさい。\n 　\nA.悪いレピュテーションのほうがよいレピュテーションよりも広がりやすいため、企業は悪いレピュテーションを初期の段階で食い止めることに注目している。\n　\nB.事故や不祥事が起こった際の経営陣の不用意な発言などは、レピュテーションを毀損する典型的な要因となる。\n　\nC.レピュテーションは、企業のさまざまな活動やコミュニケーションがそのまま人々に正確に伝わることで形成される。\nD.人々は、情報の断片を組み合わせて、その企業のレピュテーションを頭の中に形成する。","answer":"■正解：C\n  　\n■解説：\n現代人は忙しく、情報の山に埋もれてしまいがちだ。企業のさまざまな活動やコミュニケーションが、そのまま人々に伝わることを期待してはいけない。人々は、情報の断片を組み合わせて、その企業のレピュテーションを頭の中に形成するからだ。人々を不用意に刺激する発言や行動は、他の真面目なレピュテーションの向上・維持の努力を台無しにしてしまう。認識は受け手が決定するのだ、ということを強く再確認する必要がある。\n 　\n■出典：グロービス マネジメントブック 改訂3版 　\n21.レピュテーション P.88-89","source":"Word: GMAP道場2026春 (1)(1).docx","no":428,"idx":428},{"id":"docx-2026春-マーケティング-faa0d9cd","season":"2026春","subject":"マーケティング","scope":"20. BtoBマーケティング","question":"2026年4月20日（月）＜マーケティング＞\n出題範囲：20. BtoBマーケティング\n■問20.以下の文章からBtoBマーケティングの特徴として誤っているものをすべて選択してください。\nA.エンドユーザーと購入意思決定者が同一である\nB.製品・サービスが顧客企業の競争力に寄与するか否かがKBFとなる\nC.組織ならではの保守性や硬直性を持っている\nD.顧客が少なく、特定しやすい\nE.多くのユーザーがいるため、新しいサービスが採用されやすい\nF.提供する製品・サービスがコモディティであるほど、顧客企業の関心はブランドにシフトする","answer":"■正解：AとEとFが誤り\n■解説：\nBとCとDは記載の通り。\nAは「同一である」が誤り。BtoBではエンドユーザーと購入意思決定者が異なる。\nEは「新しいサービスが採用されやすい」が誤り。BtoBでは多くのユーザーがいるため、慣性が働きやすい。\nFは「ブランド」が誤り。コモディティであるほど、顧客企業の関心はコストにシフトする。\n■出典：グロービス マネジメントブック 改訂3版\n20.BtoBマーケティング P.86-87","source":"Word: GMAP道場2026春 (1)(1).docx","no":429,"idx":429},{"id":"docx-2026春-マーケティング-22d53d28","season":"2026春","subject":"マーケティング","scope":"19.顧客維持型マーケティング","question":"2026年４月20日（月）＜マーケティング＞\n出題範囲：19.顧客維持型マーケティング\n■問19.下記、文章の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・顧客維持型マーケティングの類型（手法）として、「ワン・トゥ・ワン・マーケティング」と「データベース・マーケティング」などがある。\n・ワン・トゥ・ワン・マーケティングは、「（①）」を把握することを前提に展開されるマーケティングで、「（②）」を高めることではなく、「（③）」を高めることに焦点が置かれる。\nA. ①顧客一人ひとり　②市場シェア　　③顧客内シェア\nB. ①製品品質　　　　②顧客内シェア　③市場シェア\nC. ①製品品質　　　　②市場シェア　　③製品認知度\nD. ①顧客一人ひとり　②顧客内シェア　③製品認知度","answer":"■正解：A\n \n■解説：\n・ワン・トゥ・ワン・マーケティングは、「 ①顧客一人ひとり」を把握することを前提に展開されるマーケティングで、「②市場シェア」を高めることではなく、「③顧客内シェア」を高めることに焦点が置かれる。つまり、市場内の何人の顧客に買ってもらうかよりも、1人の顧客に何回かってもらうかを重視する。\n顧客を企業にとっての「パートナー」と考え、彼らとの間に好ましい関係や歴史を構築しながら、\n生涯にわたる彼らのニーズを満たす製品を提供し続け、最大限の利益をその顧客から得ることがポイントとなる。\n \n■出典：グロービス マネジメントブック 改訂3版\n19.顧客維持型マーケティング P.84-85","source":"Word: GMAP道場2026春 (1)(1).docx","no":430,"idx":430},{"id":"docx-2026春-ファイナンス-e0dc5156","season":"2026春","subject":"ファイナンス","scope":"15. 配当政策","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：15. 配当政策\n■問18.配当政策について、誤っているものを選択してください。\nA.実際の世界では、配当政策は株主にとっての企業価値（株価）に影響を与える。同様のことが、完全市場の仮定の下でもいえる。\nB.個人投資家と法人投資家、大株主と小口株主など、だれの利益を最も重視するかによって、配当政策は影響を受ける。\nC.投資家は、配当政策を経営者の持っている情報を推測するための「シグナル」として利用するため、配当政策の影響が株価にも影響を与える可能性がある。","answer":"■正解：Aのみ\n■解説：\nA.実際の世界では、資本構成と同様に税や情報の問題があったり、企業と投資家にとっての投資機会が均一ではないことなどから、配当政策は株主にとっての企業価値（株価）に影響を与える。完全市場の仮定の下では、株主に対する利回りは、配当で還元しても株の値上がり益で還元しても同じである。\nB.個人投資家と法人投資家、大株主と小口株主など、だれの利益を最も重視するかによって、配当政策は影響を受ける。\nC.企業の経営状況やその企業が持つ投資機会については、企業経営者の持つ情報のほうが、投資家の持つ情報よりもはるかに多い。そのため投資家は、配当政策を経営者の持っている情報を推測するための「シグナル」として利用するため、配当政策の影響が株価にも影響を与える可能性がある\n■出典：グロービス マネジメントブック 改訂3版\n配当政策 P.164-165","source":"Word: GMAP道場2026春 (1)(1).docx","no":431,"idx":431},{"id":"docx-2026春-ファイナンス-3828badb","season":"2026春","subject":"ファイナンス","scope":"14.企業の最適資本構成(2)：実際","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：14.企業の最適資本構成(2)：実際\n■問17.下記文章のうち、誤っているものを選択肢AからDの中から選んでください。\nA. 企業は、負債を増やせば節税効果により企業価値が高まる。しかし、極端な負債の増大は倒産リスクが高まるため、負債調達コストが上昇し、企業価値を減少させる。これら2つの効果の分岐点となるのが最適資本構成点である。\nB. 法人税があれば、負債に対する金利の支払いは費用として収益から控除される。利益が圧縮されることにより、その分税金の支払いが減少してキャッシュフローが増加するため、その現在価値である企業価値も増大する。\nC. どの程度の負債比率の上昇に対して、どの程度負債調達コストが上昇するのか（これをリスク・プレミアムと言う）を判断するのは容易ではない。しかしながら近年の社債市場の発達によって、このリスク・プレミアムを判断するための有効な資料が集積されつつある。それは、社債の格付けである。\nD. 安定成長期に入って資金に余裕があり、新規投資のための資金もあまり必要でない企業は、借入金を全部返済して無借金経営にすることが、株主の利益の最大化という最大の使命を果たすことになり、大方の株主の意見に合致する。","answer":"■正解：D\n■解説：\n・「借入金を全部返済して無借金経営にすることが、株主の利益の最大化という最大の使命を果たすことになる」という記述は誤りです。\n・正しくは、「借入金を全部返済するのではなく、少しぐらい負債を残して、その分の資金を配当で株主に還元してほしいというのが、大方の株主の意見であろう」となります。\n・必要以上に負債比率を低く抑えている経営者は、株主の目から見れば、株主の利益の最大化という最大の使命を怠っていると映るケースもありうることには注意が必要です。\n■出典：グロービス マネジメントブック 改訂3版\n14.企業の最適資本構成(2)：実際 P. 162-163","source":"Word: GMAP道場2026春 (1)(1).docx","no":432,"idx":432},{"id":"docx-2026春-ファイナンス-a67bd740","season":"2026春","subject":"ファイナンス","scope":"16.企業の最適資本構成(1)：理論","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：16.企業の最適資本構成(1)：理論\n■問16.モジリアニ＝ミラーの命題の前提となる完全市場の定義として、誤っているものを一つ選びなさい。\n取引される証券にかかる情報は市場参加者の一部の人にのみ伝わる。\n資本市場への参入障壁がなく、またどの市場参加者も価格に影響を与えるほどの力を持っていない。\n資本市場への参入に伴うコストはなく、証券の取引は自由に行われる。\n税制は存在しない。","answer":"■正解：1\n■解説：\n正しくは、「取引される証券にかかる情報は市場参加者のすべてに一様にコストなしに伝わる。」\nモジリアニ＝ミラーの命題は、完全市場においては、企業の負債と株主資本の構成比は、企業価値に影響を与えないことを示した。\n■出典：グロービス マネジメントブック 改訂3版\n16.企業の最適資本構成(1)：理論 P.160-161","source":"Word: GMAP道場2026春 (1)(1).docx","no":433,"idx":433},{"id":"docx-2026春-ファイナンス-94509a63","season":"2026春","subject":"ファイナンス","scope":"12. 市場の効率性","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：12. 市場の効率性\n■問.15\n世間にある情報をもとに恒常的に利益を上げることはできないという考え方を「効率的市場仮説」と言います。効率的市場は、ウィーク、セミストロング、ストロングの3段階に分類できます。次の中からセミストロングについての正しい説明はどれか選んでください。\nA. 非公開情報を含むあらゆる情報に基づいた取引ルールでは他の投資家以上の利益を恒常的に上げられない\nB. 過去の資産価値や収益率のデータに基づいた取引ルールでは恒常的に利益を上げられない\nC. 世間に公表されている情報であればいかなるものでも、その情報に基づいた取引ルールでは恒常的に利益を上げられない","answer":"■正解：C\n■解説：\nA. ストロングフォーム\n企業のインサイダー情報やアナリストの企業ヒヤリング分析結果に基づく取引\nB. ウィークフォーム\n取引事例は、株価チャートなどテクニカル分析に基づく取引\nC. セミストロングフォーム\n取引事例は、情報端末・情報誌・新聞・TV・経済ニュースに基づく取引\n■出典：グロービス マネジメントブック 改訂3版\n市場の効率性　P158-159","source":"Word: GMAP道場2026春 (1)(1).docx","no":434,"idx":434},{"id":"docx-2026春-ファイナンス-456616fa","season":"2026春","subject":"ファイナンス","scope":"11. 株主資本コストの推定","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：11. 株主資本コストの推定\n　\n■     問14.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A～Dのうちから選んでください。\n　　\n・株主が企業の発行する株式を購入するのは、株式投資からの期待利回りが、他の資産への投資をあきらめても、経済的に合理性を持つ水準にある場合である。それは、株式が価格変動を伴うリスクのある資産である以上、株式投資の期待利回りが、無リスク資産(国債)の利回り(①)を上回っている(②)がある場合に他ならない。\n　\n・(①)は、無リスク資産の中でも国債の利回りを使うのが一般的である。マーケット・(②)は、過去の株式投資による利回りを見ながら決定されたと考えられる。これは、投資家は「過去の実績として、株式投資はこれだけ儲かっていたから、今後もこの程度の利回りは期待できるだろう」と考えて投資するからだ。(③)については、個別企業の株価と市場全体の株価の動きの相関を求めることで、推定する。\n　\n・その企業の株主資本コストは、下に示した式で算出できる。\n　\n・株主資本コスト＝(①)+(③)×マーケット・(②)\n　\nA. ①リスク・フリー・レート　②リスク・プレミアム　③個別資産のβ\nB. ①リスク・フリー・レート　②リスク・プレミアム　③キャピタル・ゲイン\nC. ①リスク・プレミアム　②リスク・フリー・レート　③個別企業のβ\nD. ①リスク・フリー・レート　②リスク・プレミアム　③個別企業のβ","answer":"■正解：D\n　\n■解説：\n・株主資本コストは、投資家の期待利回りと言い換えることができます。株主資本コストを推定するときは、リスクと期待利回りの関係を示すCAPM(資本資産価格モデル)及び将来にわたる配当の現在価値をもとに算出する配当割引モデルが利用されることが多いです。\n・ＣＡＰＭを利用して株主資本コストを推定するには、3つの要素が必要となります。すなわち、❶リスク・フリー・レート、❷マーケット・リスク・プレミアム、❸個別企業のβです。\n・自社株式の期待利回りは国債利回り+自社のβ×〔株式市場全体の期待利回り-国債利回り〕で算出されます。\n■出典：グロービス マネジメントブック 改訂3版\n11．株主資本コストの推定 P.156-157","source":"Word: GMAP道場2026春 (1)(1).docx","no":435,"idx":435},{"id":"docx-2026春-ファイナンス-a2677138","season":"2026春","subject":"ファイナンス","scope":"13.資本コスト","question":"2026年4月18日（土）＜ファイナンス＞\n出題範囲：13.資本コスト\n■問13.加重平均資本コスト（WACC）を計算し、適切なものを選択肢A～Dのうちから選んでください。\n株式の時価総額：150\n負債総額：50\n法人税率：40%\n利 益 率：10%\n株主資本コスト：8%\n借入金利：5%\n■選択肢：\nA：13.00%\nB：7.25%\nC：6.75%\nD：6.50%","answer":"■正解：C：6.75%\n■解説：\n計算式\n・WACC＝負債D÷（負債D＋株式の時価総額E）×負債コストrD×（1－法人税率）＋株式の時価総額E÷（負債D＋株式の時価総額E）×株主資本コストrE\n算出手順\n①：負債コストと株主資本コストを、それぞれの構成比率で重み付け（加重平均）して足し合わせすることでWACCを算出します。\n負債コストは借入金利5%を使用します。\n公式に数字を当てはめると以下のようになります。\n負債50÷（負債50＋株式の時価総額150）×負債コスト5%×（1－法人税率40%）＝0.75%\n②：公式の後半部分の株主資本調達コストを算出します。\n公式に数字を当てはめると以下のようになります。\n株式の時価総額150÷（負債50＋株式の時価総額150）×株主資本コスト8%＝6%\n③：負債の調達コストと株主資本の調達コストを合計します。\n負債の調達コスト0.75%＋株主資本調達コスト6%＝WACC6.75%\nなお、WACCの計算で利益率は使用しません。\n■出典：グロービス マネジメントブック 改訂3版\n13.資本コスト P.154-155","source":"Word: GMAP道場2026春 (1)(1).docx","no":436,"idx":436},{"id":"docx-2026春-アカウンティング-00c5d294","season":"2026春","subject":"アカウンティング","scope":"18. 損益分岐点分析","question":"2026年4月17日（金）＜アカウンティング＞\n出題範囲：18. 損益分岐点分析\n■問18.以下データを参照してA〜Dの数値を算出してください。（B、Dは計算値の小数点以下第2位を四捨五入して少数点以下第1位まで解答してください）\n売上高：2000百万円\n変動費：1200百万円\n固定費：  700百万円\nA.限界利益（単位：百万円）\nB.限界利益率（単位：％）\nC.損益分岐点売上高（単位：百万円）\nD.損益分岐点の比率（単位：％）","answer":"■正解：\nA：限界利益　　　　　800百万円\nB：限界利益率　　　　40.0%\nC：損益分岐点売上高　1750百万円\nD：損益分岐点の比率　87.5%　\n　\n■解説：\nA：限界利益＝売上高ー変動費＝2000百万円ー1200百万円＝800百万円\nB：限界利益率＝限界利益÷売上高＝800百万円÷2000百万円＝40.0%\nC：損益分岐点売上高＝固定費÷限界利益率＝700百万円÷40%=1750百万円\nD：損益分岐点の比率＝損益分岐点売上高÷現在の売上高=1750百万円÷2000百万円=87.5%　\n　\n■出典：グロービス マネジメントブック 改訂3版\n18.損益分岐点分析 P.126-127","source":"Word: GMAP道場2026春 (1)(1).docx","no":437,"idx":437},{"id":"docx-2026春-アカウンティング-2b98e8e6","season":"2026春","subject":"アカウンティング","scope":"17. 減価償却と固定資産","question":"2026年4月17日（金）＜アカウンティング＞\n出題範囲：17. 減価償却と固定資産\n■問17.減価償却と固定資産について、誤っているものを全て選択してください。\nA.減価償却とは、時が経つにつれ使用価値が減少していく機械や土地等の有形固定資産に対し、使用期間にわたって費用処理を行うことである。\nB.減価償却は費用として認識され、キャッシュの流出を伴う。\nC.定額法とは、減価償却費を各期間にわたって均等に計上する方法であり、定額法における減価償却費は、（取得原価－残存価値）×（1÷耐用年数）で求められる。\nD.特許権、商標権などの無形固定資産も償却をしなければならない。ただし、一般には定率法により、残存価値ゼロで償却される。","answer":"■正解：A、B、Dが誤り\n■解説：\nA：誤り：有形固定資産であってもその使用価値が減少しないと考えられる土地は、償却の対象にはならない。\nB：誤り：減価償却費は費用として認識されるが、実際にはキャッシュの流出を伴わない\nD：誤り：特許権や商標権などの無形固定資産は償却の対象となるが、一般には「定額法」により償却される。\n■出典：グロービス マネジメントブック 改訂3版\n減価償却と固定資産 P.124-125","source":"Word: GMAP道場2026春 (1)(1).docx","no":438,"idx":438},{"id":"docx-2026春-アカウンティング-54ae71b6","season":"2026春","subject":"アカウンティング","scope":"16. たな卸資産","question":"2026年4月17日（金）＜アカウンティング＞\n出題範囲：16. たな卸資産\n■問16.たな卸資産の評価方法について正しい選択肢をすべて選びなさい。\nA. たな卸資産に加わった新しい順から販売（払い出し）していくと仮定した方法のことを先入先出法という。\nB．平均法には総仕入金額と総仕入数量からその期の平均単価（簿価）を算出し、その期中に販売されたすべての製品についてその価格（簿価）を原価とする移動平均法と仕入のたびに平均単価に算出しなおし、払出原価を計算する総平均法がある。\nC．原価法とはたな卸資産を取得原価で評価する方法である。ただし、時価が取得原価（簿価）より著しく下落したときには、いかなる場合においても強制的に時価を評価額としなければならない。\nD．低価法とは時価と原価を比較していずれか低いほうの価格で評価する方法であり、価値を堅く見積もる保守主義に基づいている。","answer":"■正解：D\n■解説：\nA．たな卸資産に加わった×新しい順（→〇古い順）から販売（払い出し）していくと仮定した方法のことを先入先出法という。\nB．平均法には総仕入金額と総仕入数量からその期の平均単価（簿価）を算出し、その期中に販売されたすべての製品についてその価格（簿価）を原価とする×移動平均法（→〇総平均法）と仕入のたびに平均単価を算出しなおし、払出原価を計算する×総平均法（→〇移動平均法）がある。\nC．原価法とはたな卸資産を取得原価で評価する方法である。ただし、時価が取得原価（簿価）より著しく下落したときには、×いかなる場合においても（→〇回復する見込みがある場合は原価法で問題ない）強制的に時価を評価額としなければならない。\n■出典：グロービス マネジメントブック 改訂3版\nたな卸資産　Ｐ122～123","source":"Word: GMAP道場2026春 (1)(1).docx","no":439,"idx":439},{"id":"docx-2026春-アカウンティング-8d5c41e3","season":"2026春","subject":"アカウンティング","scope":"15. 株式市場が企業を評価する指標","question":"2026年4月17日（金）＜アカウンティング＞\n出題範囲：15. 株式市場が企業を評価する指標\n■問15. 下記に、企業が投資家に評価してもらえるような経営を行うために、理解しておく必要がある指標について書いています。正しいものを全て選んでください。\nA. 日本企業は利益の多寡にかかわらず、安定配当政策をとる傾向がある。その場合、利益が減ると配当性向（配当金総額/税引後当期純利益）が高くなるケースも出てくる。\nB. Earnings per Share (EPS)とは、税引前当期純利益/発行済み株式数のことである。\nC. Price Earnings Ratio (PER)とは、株価と1株当たりの純資産の比率を表す指標だが、個別銘柄が同業他社と比べて際立って高いPERを示していたら、一般に買われすぎと判断され、売却の判断材料の一つとなる。\nD. Price to Book Ratio (PBR) とは、株価を1株当たりの利益で割った指標のことだが、PBR１倍を下回っている場合、株式市場が評価している株価は企業の清算価値を下回っていることになり、投資判断における危険信号と捉えられる。","answer":"■正解：Aのみ\n■解説：\nA. 正解\nB. Earnings per Share（1株あたり利益）＝税引後当期純利益/発行済み株式数\nC. PER（Price Earnings Ratio）は、株価収益率のことで、株価と１株当たりの利益の比率を示す指標です。後半の文章は正しくPERを表しています。\nD. PBR（Price to Book Ratio）は、株価純資産倍率のことで、株価と1株当たりの純資産の比率を表す指標です。後半の文章は正しくPBRを表しています。\n■出典：グロービス マネジメントブック 改訂3版\n株式市場が企業を評価する指標P.120-121","source":"Word: GMAP道場2026春 (1)(1).docx","no":440,"idx":440},{"id":"docx-2026春-アカウンティング-1e6f2f3e","season":"2026春","subject":"アカウンティング","scope":"14. 安全性分析","question":"2026年4月17日（金）＜アカウンティング＞\n出題範囲：14. 安全性分析\n　\n■問14.下記文章中の（①）～（③）に入る語句の組み合わせとして適切なものを選択肢A\\~Dのうちから選んでください。\n　\n・企業の安全性とは財務体質の健全性を意味し、万一の場合に外部の債権者に対して約束どおりの支払いを行うことが可能であるかを示している。\n　\n・短期（1年以内）に返済する必要のある負債に対し、同期間内に現金化される資産で賄えるかを測る指標が（①）であり、150%から200%程度が望ましいと言われている。\n　\n・（②）とは、固定資産の調達がどれだけ純資産によって賄われているかを示す指標である。この比率は100%以下であるのが望ましいが、現実には製造業で120%程度となっている。\n　\n・（③）は、事業利益が支払うべき金利の何倍あるか、という金利支払能力を示す指標であり、製造業平均で18倍と言われている。\n　\nA. ①流動比率　②固定比率　③インタレスト・カバレッジ・レシオ\nB. ①当座比率　②固定比率　③自己資本比率\nC. ①流動比率　②固定長期適合率　③インタレスト・カバレッジ・レシオ\nD. ①当座比率　②固定長期適合率　③自己資本比率","answer":"■正解：A\n　\n■解説：\n　\n・①流動比率（流動資産／流動負債）: 短期的な支払能力を測る指標。短期間（1年以内）に返済する必要のある負債は、同じく短期間内に現金化される資産で賄われる必要がある。この「支払い」と「回収」の期間を対応させる考え方が流動比率の根底にあり、150％〜200％程度が望ましいとされるが、日本の製造業の平均は130〜140％である。\n　\n・②固定比率（固定資産／純資産）: 固定資産の調達がどれだけ純資産で賄われているかを示す。固定資産は長期保有が前提のため、長期的に安定した調達手段によるべきであり、100％以下が理想であるが、現実には製造業で120%程度となっている。\n　\n・③インタレスト・カバレッジ・レシオ（〈営業利益＋金融収益〉／支払利息）: 金利の支払能力を示す指標であり、事業利益が支払うべき金利の何倍あるかという、金利支払い能力を示す指標。この比率は高いに越したことはないが、企業の成長度合いで評価されるべき指標であり、製造業で18倍と言われている。\n　\n■出典：グロービス マネジメントブック 改訂3版\n14.安全性分析 P.118-119","source":"Word: GMAP道場2026春 (1)(1).docx","no":441,"idx":441},{"id":"docx-2026春-アカウンティング-eda6ac04","season":"2026春","subject":"アカウンティング","scope":"13. 収益性分析","question":"2026年４月17日（金）＜アカウンティング＞\n出題範囲：13. 収益性分析\n \n■問13. 売上高利益率とは、売上高に対してどのくらいの利益を獲得することができたかを示す指標ですが、どの利益を用いるかにより、いくつかの指標があります。以下のうち、指標とそこから分かる傾向について、誤っているものを選んでください。\n \nA.売上高総利益率は、利益率の高い製品を販売しているか否かを示している。この指標は業種によって差があるが、同一の業界内では一般に大きな相違はない。この指標を上げるためには取引先の見直しや商品構成の見直し、仕入／生産コストの削減などが有効だと考えられ、これに合わせた行動が必要になってくる。\n \nB.売上高営業利益率は、企業本来の営業活動による利益率であり、本業の利益率が高いかどうかを示している。この指標を同業他社と比較することにより、販売活動や管理活動の効率性がわかり、合理化の余地の有無なども把握することができる。\n \nC.売上高経常利益率は、経常的な通常の企業活動における利益率を表した指標である。この指標には、持分法による投資損益や、金融収支のよしあし、資金調達力の相違については反映されない。\n \nD.各売上高利益率は企業の営業プロセスにより規定されるため、事業形態や業種が異なる企業同士を比較してみても優劣をつけることはできない。しかしながら、似通った事業プロセスの企業や、同一企業を時系列で比較することにより、さまざまなことがわかる。","answer":"■正解：Ｃが誤り\n \n■解説 ：\nＡ.正しい\nＢ.正しい\nC.売上高経常利益率には金融収支のよしあしや資金調達力の相違が反映される。連結の場合、経常利益は持分法による投資損益によっても影響される。\nD.正しい\n■出典：グロービス マネジメントブック 改訂3版\n収益性分析 P.116-117","source":"Word: GMAP道場2026春 (1)(1).docx","no":442,"idx":442},{"id":"docx-2026春-組織行動-706a4b08","season":"2026春","subject":"組織行動","scope":"19.変革のマネジメント","question":"2026年4月16日（木）＜組織行動学＞\n出題範囲：19.変革のマネジメント\n \n■問18.下記文章中の（①）から（③）に入る語句の組み合わせとして適切なものを選択肢AからDより選んでください。\n \n・組織変革とは、新しい環境に適応するために組織を変化させることである。\n・一般には、過去の（①）にとらわれて変化を嫌い、変化から取り残された組織を刷新することを指す場合が多い。\n・しかし、環境が大きく変わることの多い今日では、変化を好み、自ら変化を生み出し、変化に自律的に対応する「（②）組織」になることが、組織変革の（③）になっている。\n \nA. ①伝統　②自己変革型　③始まりのスタート\nB. ①成功　②自己変革型　③最終ゴール\nC. ①伝統　②共創型　③始まりのスタート\nD. ①成功　②共創型　③最終ゴール","answer":"■正解：B\n \n■解説：\n・一般には、過去の成功にとらわれて変化を嫌い、変化から取り残された組織を刷新することを指す場合が多い。\n・しかし、環境が大きく変わることの多い今日では、変化を好み、自ら変化を生み出し、変化に自律的に対応する「自己変革型組織」になることが、組織変革の最終ゴールになっている。\n \n■出典：グロービス マネジメントブック 改訂3版\n19.変革のマネジメント　P.218-219","source":"Word: GMAP道場2026春 (1)(1).docx","no":443,"idx":443},{"id":"docx-2026春-組織行動-67344c5b","season":"2026春","subject":"組織行動","scope":"６. パワー","question":"2026年４月16日（木）＜組織行動学＞\n出題範囲：６. パワー\n \n■問17.パワーを有効に活用するためには、人や組織の行動に影響を及ぼすパワーの源泉を理解する必要があります。この「パワーの源泉」について、誤っているものを①から⑤の中、すべて選択してください。\n \n①.強制力：受け手にとって苦痛となるものを取り除くことで、影響力を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する。\n \n②.報酬力：受け手にとっての励みとなるものを与えることで、影響を及ぼすことのできる力。たとえば、インセンティブなどが該当する。\n \n③.正当権力：受け手に対して影響を及ぼすことができない社会的地位の高さ。たとえば、公式の地位などが該当する。\n \n④.専門力：受け手が信頼することのできる優れた専門性の高さ。たとえば、専門知識、技術などが該当する。　\n　\n⑤.同一視力：受け手にとって魅力のある人物、理想像であること。たとえば、業務\n経験、実績などが同一視力を形成する要素となりうる。","answer":"■正解：①、③が誤り\n  \n■解説：\n①　強制力：受け手にとって苦痛となるものを与えることで、影響力を及ぼすことのできる力。たとえば、ペナルティ（罰則）などが該当する（苦痛となるものを取り除くではなく、与えるが正解）。\n③　正当権力：受け手に対して影響を及ぼすことができる社会的地位の高さ。たとえば、公式の地位などが該当する（影響を及ぼすことができないのではなく、できるが正解）。\n②、④、⑤はそのとおり。\n \n■出典：グロービス マネジメントブック 改訂3版\n６．パワー P.192-193","source":"Word: GMAP道場2026春 (1)(1).docx","no":444,"idx":444},{"id":"docx-2026春-組織行動-a865476a","season":"2026春","subject":"組織行動","scope":"20. 組織学習","question":"2026年4月16日（木）＜組織行動学＞\n出題範囲：20. 組織学習\n \n■問16.激変する環境において企業が存続していくために、変革の力を内在化させた「学習する組織」になる必要がある。アージリスが提唱する「ダブルループ・ラーニング」について正しいものを選択しなさい。\n \nA.既存の目標達成へ向けて軌道修正を行う学習プロセス\n \nB.個人学習と組織学習を行い能力開発・スキルアップを図る学習プロセス\n \nC.組織の目的や前提そのものを疑い、それらも含めて軌道修正を行う学習プロセス\n \nD.個人の結果を組織で振り返り、また個人行動を修正する学習プロセス","answer":"■正解：C\n  \n■解説：\nアージリスは、組織における学習プロセスは、「シングルループ・ラーニング」と「ダブルループ・ラーニング」の2形態あるとしている。\n問題に対して、既存の目的達成へ向けて軌道修正を行うことを「シングルループ・ラーニング」と呼ぶ。\n一方、「ダブルループ・ラーニング」とは、問題に対して、既存の目的や前提そのものを疑い、それらも含めて軌道修正を行うことを言う。\n組織の構成員が自発的な意欲と責任感を持って、変革に資するような行動をとるためにこの学習が必要である。\n \n■出典：グロービス マネジメントブック 改訂3版\n20.組織学習P.220-221","source":"Word: GMAP道場2026春 (1)(1).docx","no":445,"idx":445},{"id":"docx-2026春-組織行動-b96c7566","season":"2026春","subject":"組織行動","scope":"4. リーダーシップとマネジメント","question":"2026年4月16日(木)＜組織行動学＞\n出題範囲：4. リーダーシップとマネジメント\n \n■問15.経営管理者に要求される能力として「企業変革の必要性」と「企業運営の複雑性」の２つの軸で整理した時、「企業変革の必要性が高く、企業運営の複雑性が低い」という場合に要求される能力は①から④のうち、どれでしょう。\n \n■①：リーダーシップ、マネジメント機能ともそれほど必要としない\n■②：高度のリーダーシップが必要であるが、マネジメント機能へのニーズは少ない\n■③：高度のマネジメント機能が必要であるが、リーダーシップ機能へのニーズは少ない\n■④： リーダーシップ、マネジメントの両機能が大いに要求されている","answer":"■正解：②\n■解説：\n「企業変革の必要性が低く、企業運営の複雑性が低い」→19世紀における大部分の企業組織\n「企業変革の必要性が高く、企業運営の複雑性が低い」→企業の創業期　☚正解\n「企業変革の必要性が低く、企業運営の複雑性が高い」→高度成長期の大企業\n「企業変革の必要性が高く、企業運営の複雑性が高い」→現在の大部分の大企業\n（「グロービス　マネジメントブック　改定3版」　P189の右下にあるマトリクス参照）\n■出典：グロービス マネジメントブック 改訂3版\n4．リーダーシップとマネジメント P.188-189","source":"Word: GMAP道場2026春 (1)(1).docx","no":446,"idx":446},{"id":"docx-2026春-組織行動-8faa8b09","season":"2026春","subject":"組織行動","scope":"5. エンパワーメント","question":"2026年4月16日（木）＜組織行動学＞\n出題範囲：5. エンパワーメント\n \n■問14.ビジネスにおけるエンパワーメントの特徴のうち、誤っているものを1つ選んでください。\n \nA.エンパワーメントの特徴は「自律性」を促し、「支援」することにある\n \nB.エンパワーメントは習得可能な「経営の技術」である\n \nC.業務の遂行を支援する方法は従業員自身が問題点を発見したり、不足する能力を開発できる環境を整えることだ\n \nD.業務の遂行を支援する方法は、従業員に具体的な指示を与えて従わせることにある","answer":"■正解：Dのみ誤り\n  \n■解説：\n業務の遂行を「支援」するやりかたも、具体的な指示や解決策を従業員に与えるのではなく、従業員自身が問題点を発見したり、不足する能力を開発できるように環境を整えるといった形をとる。\n \n■出典：グロービス マネジメントブック 改訂3版\nエンパワーメント P.190-191","source":"Word: GMAP道場2026春 (1)(1).docx","no":447,"idx":447},{"id":"docx-2026春-組織行動-22693bf1","season":"2026春","subject":"組織行動","scope":"10. コミュニケーション","question":"2026年4月16日（木）＜組織行動学＞\n出題範囲：10. コミュニケーション\n \n■問13.コミュニケーションの落とし穴に関する記述として、正しいものはどれか。\nA.送り手に関わる阻害要因に「選択的認知」がある。これは受け手により好意的に受け入れてもらうために、送り手が情報を操作することである。\nB.受け手に関わる阻害要因に「フィルタリング」がある。これは個人的な経験に基づいて複数の情報から特定の情報のみを選択したり、自己の関心を反映させた解釈を行うことである。\nC.送り手と受け手双方に関わる阻害要因に「文化的差異」がある。文化的な背景が違うと、同じ単語やジェスチャーが意味するものが異なることがある。\nD.非言語コミュニケーション、とくに「感情表現」は送り手と受け手双方に誤解を与えることが多い。極端な感情表現に直面すると、理性的かつ客観的な思考過程を無視し、感情的な判断を下しがちになる。","answer":"■正解：CとD\n■解説：\nAとBは、誤り。\n正しくは\nA.送り手に関わる阻害要因に「フィルタリング」がある。〜\nB.受け手に関わる阻害要因に「選択的認知」がある。〜\nである。\n■出典：グロービス マネジメントブック 改訂3版\n10．コミュニケーション P.200-201","source":"Word: GMAP道場2026春 (1)(1).docx","no":448,"idx":448},{"id":"docx-2026春-人的資源管理-8990cb88","season":"2026春","subject":"人的資源管理","scope":"14 組織形態","question":"2026年4月15日（水）＜人的資源管理＞\n出題範囲：14 組織形態\n■問18.下記文章中の（①）から（④）に入る語句の組み合わせとして適切なものを、選択肢AからDより選んでください。\n・組織形態の基本的なものとして、ヒエラルキー型組織（機能別組織、事業部別制組織）、（①）型組織がある。\n・組織形態は組織構造の決定要因に加え、（②）、事業特性、戦略、HRポリシーなどを考慮して設計する。\n・機能別組織は、専門的な知識を持った人材を育成することができる一方、幅広い知識をもった（③）が育ちにくく、組織間のコンフリクトが起きやすい。\n・企業の規模が拡大し、さまざまなビジネスを手掛けるようになると、単純な機能別組織では対応しきれなくなるため、（④）組織をとる企業が多くなってくる。\nA. ①ネットワーク　②外部環境　③マネージャー　④ティール\nB. ①マトリクス　②外部環境　③マネージャー　④事業部制\nC. ①マトリクス　②内部環境　③新人　④ティール\nD. ①ネットワーク　②内部環境　③新人　④事業部制","answer":"■正解：B\n■解説：\n・組織形態の基本的なものとして、ヒエラルキー型組織（機能別組織、事業部制組織）、「マトリクス」型組織がある。\n・組織形態は組織構造の決定要因に加え、「外部環境」、事業特性、戦略、HRポリシー等を考慮して設計する。\n・機能別組織は、その機能を深く理解し、専門的な知識を持った人材を育成することができる。また、部門間で機能の重複がないので、経営効率の点で優れている。その一方で、全社の利益の最大化（全体最適）よりも各組織の利益の最大化（部分最適）を追求しがちになる。また、幅広い知識を持った「マネージャー」が育ちにくく、組織間のコンフリクトが起きやすい。\n・企業の規模が拡大し、さまざまなビジネスを手がけるようになると、単純な機能別組織では対応しきれなくなるため、「事業部制」組織をとる企業が多くなってくる。\n■出典：グロービス マネジメントブック 改訂3版\n14．組織形態 P.208-209","source":"Word: GMAP道場2026春 (1)(1).docx","no":449,"idx":449},{"id":"docx-2026春-人的資源管理-2d1cb334","season":"2026春","subject":"人的資源管理","scope":"13.組織設計","question":"2026年4月15日（水）＜人的資源管理＞\n出題範囲：13.組織設計\n　\n■問17.組織設計にあたって考慮すべき要素には、分業と協業、指揮命令系統、管理範囲、意思決定権限、分化と統合が挙げられる。分業と協業の説明について、誤っているものを全て選びなさい。\nA.分業とは、組織全体の業務を、専門性などの基準に基づき、組織構成員に割り振ること。\n　\nB.協業とは、組織全体として協力して業務を行うことを言う。\n　\nC.企業は通常、業務を製造、営業、経理などの機能別に分解し、構成員に割り当てる分業体制を取っている。そのため、協業の必要が生じた場合にも、特に業務間での業務の受け渡し方法などについての調整は不要である。\n　\nD.分業は効率化に役立ち、業務を細分化し、業務範囲を狭くするほど、従業員は倦怠感やストレスを感じにくくなる。そのため、仕事への意欲を高めることができ、従業員のモチベーションや業務効率を向上させることができる。","answer":"■正解：CとD\n　\n■解説：\nA.正しい\n　\nB.正しい\n　\nC.誤り\n企業は通常、業務を製造、営業、経理などの機能別に分解し、構成員に割り当てる分業体制をとっている。そのため、協業などの必要性が生じると、複数の業務間で業務の受け渡し方法などについて調整しなくてはならない。\n　　\nD.誤り\nある程度の分業は業務効率化に役立つが、過度の業務細分化は従業員のモチベーションや業務効率を低下させる原因になりうる。業務範囲が狭く単調になると、従業員は倦怠感やストレスを感じ、仕事への意欲を失ってしまうからだ。\n　\n■出典：グロービス マネジメントブック 改訂3版\n13.組織設計 P.206-207","source":"Word: GMAP道場2026春 (1)(1).docx","no":450,"idx":450},{"id":"docx-2026春-人的資源管理-6097c608","season":"2026春","subject":"人的資源管理","scope":"12.組織文化と企業経営","question":"2026年4月15日（水）＜人的資源管理＞\n出題範囲：12.組織文化と企業経営\n■問16. 「組織文化」に関連する内容ついての説明で誤っているものを1つ選びなさい。\nA. 組織文化を把握するには、組織固有の行動パターンを観察すると良い。様々な儀式、創業エピソード、組織内でのみ通用する独特な言葉などに行動パターンが顕著に示される。\nB.組織文化の生成段階では、個々の構成員の価値観や信念などが衝突しあう。リーダーシップを発揮する人の理念や哲学の影響力は相対的に低い。\nC. 組織文化の持つ機能を大別すると、「判断や行動の指針」「情報伝達の簡素化」「個人の動機づけ」の3つの機能があると言われている。\nD. 強烈な価値観が組織内で共有されている場合、構成員のものの見方が固定化し、環境変化を見過ごす原因になることがある。","answer":"■正解：B\n■解説：\nA・C・Dは正しい。\nBは「リーダーシップを発揮する人の理念や哲学の影響力は相対的に低い」が誤り。\n組織文化の生成プロセスにおいて、\n「リーダーシップを発揮する人の理念や哲学が大きな影響力を持つ」が正しい。\n一般的に、組織規模が小さかったり従業員間の物理的・心理的距離が近い組織の方が、\n比較的容易に企業文化が生成される。\n■出典：グロービス マネジメントブック 改訂3版\n12.組織文化と企業経営　P.204-205","source":"Word: GMAP道場2026春 (1)(1).docx","no":451,"idx":451},{"id":"docx-2026春-人的資源管理-f3822fa2","season":"2026春","subject":"人的資源管理","scope":"3. 組織行動学と人的資源管理","question":"2026年4月15日（水）＜人的資源管理＞\n出題範囲：3. 組織行動学と人的資源管理\n■問15. 以下は組織行動学の視点について説明した内容です。誤っているものを複数選択してください。\nA.人の行動は、「個人」か、「集団」（目的を持った個人の集合）か、「組織」（目的を持った集団の場合）かによって異なってくる。\nB.意思決定をする場合、要する時間やコンフリクトの多寡などの違いは、個人・集団・組織のいずれにおいて変わらない。\nC.個人・集団・組織の特徴を理解しておくことが、マネジメントを行う上では重要になる。\nD.人や組織に働きかけるときには、まず行動を起こし、その結果を踏まえて状況を認識する必要がある。","answer":"■正解：B、D\n■解説：\nA：正しい（設問の記述通り）\nB：誤り\n正しくは、意思決定をする場合、個人・集団・組織によって、要する時間やコンフリクトの多寡などに違いが生じる。\nC：正しい（設問の記述通り）\nD：誤り\n正しくは、組織行動学では、まずその場の状況を認識し、それから自分がとるべき行動と、それが他者や組織に与える影響について十分に考慮したうえで行動を起こす必要がある。「行動」の前には必ず「認識」というステップを踏むことが重要だ。\n■出典：グロービス マネジメントブック 改訂3版\n3.組織行動学と人的資源管理 P.186-187","source":"Word: GMAP道場2026春 (1)(1).docx","no":452,"idx":452},{"id":"docx-2026春-人的資源管理-2cc14e8b","season":"2026春","subject":"人的資源管理","scope":"2. 人・組織のマネジメントに影響を及ぼす要因","question":"#GMAP2026S_HRM\n2026年4月15日（水）＜人的資源管理＞\n出題範囲：2. 人・組織のマネジメントに影響を及ぼす要因\n■問14.次の文章中の(①)～(④)にあてはまる語句の組み合わせとして最も適切なものを、以下の選択肢A～Dから選びなさい。\n・自分の価値観や目的が所属している(①)やビジョン、目的に合致したり、共感できる部分が大きい場合などに、人は働きがいを感じる。\n・企業は組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求めていることを、(②)を通して伝えなければならない。\n・外部環境の中でも、労働市場、法的規制、労働組合、経済状況、技術的進歩、(③)は人・組織のマネジメントに特に大きな影響を与える可能性がある。\n・企業は必要に応じて、在宅勤務やワークシェアリングなどを柔軟に取り入れ、(④)労働力を活用する方法を考える必要がある。\nA：①組織文化　②包括的な施策　③社内組織　④顕在的\nB：①組織の価値観　②包括的な施策　③社内組織　④潜在的\nC：①組織文化　②具体的な施策　③競合他社　④顕在的\nD：①組織の価値観　②具体的な施策　③競合他社　④潜在的","answer":"■正解：D\n①組織の価値観、②具体的な施策、③競合他社、④潜在的\n■解説：\n自分の価値観や目的が所属している組織の価値観やビジョン、目的に合致したり、共感できる部分が大きい場合などに、人は働きがいを感じる。したがって、「ヒト」を惹きつけ、その能力を発揮させるためには、企業は経営理念やビジョンを明示する必要がある。\nさらに、組織として経営理念やビジョンを尊重し、従業員にもそれらに沿った行動を求めていることを、具体的な施策を通して伝えなくてはならない。それには、経営理念やビジョンを実現するための経営戦略と、それを支援する人・組織のマネジメントが必要となる。このとき、経営理念、ビジョン、経営戦略、人・組織のマネジメントのすべてきおいて整合性をとることが重要だ。\nまた、労働市場、法的規制、労働組合、経済状況、技術的進歩、競合他社などの外部環境からの影響に留意しながら、柔軟に対応することが求められる。\n■出典：グロービス マネジメントブック 改訂3\n2.人・組織のマネジメントに影響を及ぼす要因 　P.184-185","source":"Word: GMAP道場2026春 (1)(1).docx","no":453,"idx":453},{"id":"docx-2026春-人的資源管理-c6a54806","season":"2026春","subject":"人的資源管理","scope":"1.企業経営と人・組織のマネジメント","question":"2026年4月15日（水）＜人的資源管理＞\n出題範囲：1.企業経営と人・組織のマネジメント\n　\n■問13.経営資源としての人の特徴の説明のなかで、誤っているものを選択してください。\n　\nA.人の能力は向上し、時には低下する。また能力の種類も変化する。\n　\nB.意思、感情、欲求、能力などは、「変えよう」と決めることで少しずつだが変えることができる。変えようとする気持ちが大切である。\n　\nC.意思、感情、欲求、能力などのあり方や変化の程度には個人差がある。同一人物でも注目するタイミングによって、感じ方や欲求の程度が異なる場合がある。\n　\nD.意思、感情、欲求、能力などの組み合わせに基づく何らかのメカニズムによって、人の行動はある程度決まる。","answer":"■正解：B\n　\n■解説：\nA.正しい\nB.誤り\nC.正しい\nD.正しい\n　\nBの内容が誤っており、正しくは以下の通り。\n　\n意思、感情、欲求、能力などは、「変えよう」と決めてすぐに変えられるものではない。無理に変えようとすると、抵抗が生じることも多い。\n　\n■出典：グロービス マネジメントブック 改訂3版\n1.企業経営と人・組織のマネジメント P.182-183","source":"Word: GMAP道場2026春 (1)(1).docx","no":454,"idx":454},{"id":"docx-2026春-経営戦略-67138e7a","season":"2026春","subject":"経営戦略","scope":"18.M&Aとアライアンス","question":"2026年4月14日（火）＜経営戦略＞\n出題範囲：18.M&Aとアライアンス\n■問18.M&Aとアライアンスとの比較について、誤っているものを全て選択してください。\nA. M&Aは時間・資金をそれほど要さないが、アライアンスは時間・資金を要する。\nB. M&Aは事後の意思決定に時間がかかる場合があるが、アライアンスは事後にスピーディな意思決定が可能。\nC. M&Aは
